name: Deploy site (GitHub Pages)

# Builds the static site and publishes it to GitHub Pages on every push to main.
# Also writes app-version.json so the installed Android app knows a newer web
# bundle is available and updates itself over the air.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://sergiohazary.github.io/DevSecOps-App
          NEXT_PUBLIC_BASE_PATH: /DevSecOps-App
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Publish OTA version pointer for the Android app
        run: |
          SHA="${GITHUB_SHA::7}"
          cat > out/app-version.json <<JSON
          {
            "version": "${SHA}",
            "url": "https://github.com/SergioHAZARY/DevSecOps-App/releases/latest/download/web-bundle.zip"
          }
          JSON
      - name: Disable Jekyll processing
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
