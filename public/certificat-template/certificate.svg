<?xml version="1.0" encoding="UTF-8"?>
<!--
  DevSecOps App - certificate template (A4 landscape, 297 x 210 mm).
  Placeholders between double braces are replaced by lib/certificate.ts before the
  template is rendered to PDF. Only system fonts are used so that it renders offline.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1123 794" width="1123" height="794" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#04AA6D"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect width="1123" height="794" fill="#ffffff"/>
  <rect x="24" y="24" width="1075" height="746" fill="none" stroke="#047857" stroke-width="3"/>
  <rect x="36" y="36" width="1051" height="722" fill="none" stroke="#04AA6D" stroke-width="1"/>

  <!-- header band -->
  <rect x="36" y="36" width="1051" height="96" fill="url(#band)"/>
  <!-- shield logo -->
  <g transform="translate(76 54)">
    <path d="M30 0 L60 11 V30 C60 46 47 57 30 62 C13 57 0 46 0 30 V11 Z" fill="#ffffff"/>
    <path d="M17 31 L26 40 L44 21" fill="none" stroke="#047857" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="156" y="82" font-size="30" font-weight="700" fill="#ffffff">DevSecOps App</text>
  <text x="156" y="108" font-size="15" fill="#e6fff5">{{slogan}}</text>
  <text x="1051" y="92" font-size="16" font-weight="600" fill="#ffffff" text-anchor="end" letter-spacing="2">{{moduleNumber}}</text>

  <!-- title -->
  <text x="561.5" y="212" font-size="36" font-weight="700" fill="#0f2a22" text-anchor="middle" letter-spacing="5">{{heading}}</text>
  <rect x="501.5" y="232" width="120" height="4" rx="2" fill="#04AA6D"/>

  <text x="561.5" y="290" font-size="19" fill="#475569" text-anchor="middle">{{awardedTo}}</text>
  <text x="561.5" y="362" font-size="50" font-weight="700" fill="#047857" text-anchor="middle">{{name}}</text>
  <line x1="281" y1="386" x2="842" y2="386" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="561.5" y="436" font-size="19" fill="#475569" text-anchor="middle">{{forCompleting}}</text>
  <text x="561.5" y="486" font-size="30" font-weight="700" fill="#0f2a22" text-anchor="middle">{{module}}</text>
  <text x="561.5" y="528" font-size="17" fill="#475569" text-anchor="middle">{{details}}</text>

  <!-- seal -->
  <g transform="translate(561.5 610)">
    <circle r="44" fill="#ecfdf5" stroke="#04AA6D" stroke-width="3"/>
    <circle r="35" fill="none" stroke="#047857" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M-16 1 L-5 12 L17 -11" fill="none" stroke="#047857" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- date / identifier -->
  <text x="170" y="612" font-size="14" fill="#64748b" text-anchor="middle">{{dateLabel}}</text>
  <text x="170" y="640" font-size="19" font-weight="600" fill="#0f2a22" text-anchor="middle">{{date}}</text>
  <line x1="80" y1="654" x2="260" y2="654" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="953" y="612" font-size="14" fill="#64748b" text-anchor="middle">{{idLabel}}</text>
  <text x="953" y="640" font-size="19" font-weight="600" fill="#0f2a22" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">{{id}}</text>
  <line x1="863" y1="654" x2="1043" y2="654" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="561.5" y="724" font-size="12.5" fill="#64748b" text-anchor="middle">{{footer}}</text>
</svg>
