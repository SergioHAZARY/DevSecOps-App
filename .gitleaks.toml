# Gitleaks configuration for DevSecOps App.
# Extends the default rules and allows the obviously-fake example secrets that the
# lessons deliberately show (vulnerable code examples, AWS example keys, etc.).
[extend]
useDefault = true

[allowlist]
description = "Fake values used for teaching, never real credentials"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
  '''sk_live_51H8xQ2LkP0aBcD3eFgH''',
  '''changeme-in-vault''',
  '''ChangeMe123!''',
  '''SuperSecret123!''',
]
paths = [
  '''content/.*\.yaml''',
  '''reference/.*''',
]
