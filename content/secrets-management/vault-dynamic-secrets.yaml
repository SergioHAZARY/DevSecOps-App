description:
  fr: "Générer des identifiants de base de données éphémères avec Vault, les consommer en Python avec hvac et comprendre Vault Agent et l'auth Kubernetes."
  en: "Generate ephemeral database credentials with Vault, consume them in Python with hvac and understand Vault Agent and Kubernetes auth."
duration: 30

intro:
  fr: |
    Un secret **statique** — un mot de passe de base de données écrit une fois et utilisé pendant des
    années — est une bombe à retardement : s'il fuite, l'attaquant garde l'accès jusqu'à ce que quelqu'un
    pense à le changer. Les **secrets dynamiques** de Vault renversent la logique : Vault crée un
    identifiant **à la demande, juste pour vous, pour quelques minutes**, puis le supprime automatiquement.

    Pensez à une carte d'hôtel. On ne vous donne pas la clé passe-partout du personnel (le secret statique
    partagé) : la réception programme une carte valable pour votre chambre et votre séjour seulement, et
    elle se désactive à votre départ. Si vous la perdez, le risque est minime et borné dans le temps.

    Dans cette leçon, vous allez configurer le moteur de base de données de Vault pour fabriquer des
    comptes PostgreSQL éphémères, les consommer en Python avec la bibliothèque `hvac`, et découvrir Vault
    Agent et l'authentification Kubernetes.
  en: |
    A **static** secret — a database password written once and used for years — is a time bomb: if it
    leaks, the attacker keeps access until someone remembers to change it. Vault's **dynamic secrets** flip
    the logic: Vault creates a credential **on demand, just for you, for a few minutes**, then deletes it
    automatically.

    Think of a hotel key card. You are not handed the staff master key (the shared static secret): the
    front desk programs a card valid for your room and your stay only, and it deactivates when you leave.
    If you lose it, the risk is small and time-bounded.

    In this lesson you will configure Vault's database engine to mint ephemeral PostgreSQL accounts, consume
    them in Python with the `hvac` library, and discover Vault Agent and Kubernetes authentication.

sections:
  - heading:
      fr: "Statique vs dynamique : pourquoi l'éphémère gagne"
      en: "Static vs dynamic: why ephemeral wins"
    body:
      fr: |
        Un secret statique vit longtemps, est partagé par plusieurs applications, et sa rotation est
        douloureuse (il faut coordonner tout le monde). Un secret dynamique est **unique par
        consommateur**, **à durée de vie courte** (TTL), et **révoqué automatiquement**.

        | | Mot de passe DB statique | Identifiant dynamique Vault |
        |---|---|---|
        | Durée de vie | Des mois ou des années | Quelques minutes (TTL) |
        | Partage | Plusieurs apps, mêmes identifiants | Un identifiant unique par demande |
        | En cas de fuite | Accès jusqu'à rotation manuelle | Expire tout seul très vite |
        | Traçabilité | « C'était app_user » (lequel ?) | Chaque compte est attribuable |
        | Rotation | Manuelle, risquée | Native, à chaque demande |

        Le **moteur de secrets de base de données** de Vault fonctionne ainsi : on lui donne une connexion
        *administrateur* à la base et des *rôles* décrivant quelles instructions SQL exécuter pour créer et
        détruire un compte. Quand une application demande un identifiant, Vault exécute le `CREATE ROLE ...`,
        renvoie le couple généré, et programme le `DROP ROLE ...` à l'expiration du *lease* (bail).
      en: |
        A static secret lives a long time, is shared by several applications, and its rotation is painful
        (everyone must be coordinated). A dynamic secret is **unique per consumer**, **short-lived** (TTL),
        and **automatically revoked**.

        | | Static DB password | Vault dynamic credential |
        |---|---|---|
        | Lifetime | Months or years | A few minutes (TTL) |
        | Sharing | Several apps, same credentials | One unique credential per request |
        | On a leak | Access until manual rotation | Expires on its own very quickly |
        | Traceability | "It was app_user" (which one?) | Each account is attributable |
        | Rotation | Manual, risky | Native, on every request |

        Vault's **database secrets engine** works like this: you give it an *admin* connection to the
        database and *roles* describing which SQL statements to run to create and destroy an account. When
        an application requests a credential, Vault runs the `CREATE ROLE ...`, returns the generated pair,
        and schedules the `DROP ROLE ...` when the *lease* expires.
  - heading:
      fr: "Consommer les secrets : hvac, Vault Agent, Kubernetes"
      en: "Consuming the secrets: hvac, Vault Agent, Kubernetes"
    body:
      fr: |
        Il y a trois grandes manières pour une application de récupérer ses secrets dynamiques :

        1. **Directement, via le SDK** : en Python, la bibliothèque **`hvac`** s'authentifie (AppRole,
           token...) puis lit le chemin du rôle (`database/creds/<role>`). L'application obtient un couple
           utilisateur/mot de passe frais et doit **renouveler le bail** (`sys.renew_lease`) ou en
           redemander un avant l'expiration.
        2. **Vault Agent** : un processus compagnon qui s'authentifie à votre place, récupère les secrets,
           les écrit dans un fichier via un *template*, et gère le renouvellement. L'application lit un
           simple fichier et ignore tout de Vault. Idéal pour du code existant qu'on ne veut pas modifier.
        3. **Authentification Kubernetes** : dans un cluster, le *pod* présente le **jeton de son compte de
           service** (le JWT monté dans `/var/run/secrets/...`). Vault le vérifie auprès de l'API
           Kubernetes et, s'il correspond à un rôle configuré, délivre un token Vault. Aucun secret
           d'amorçage à distribuer : l'identité du pod *est* le point de départ.

        Le fil conducteur : l'application ne détient jamais un secret longue durée. Elle prouve son identité
        (AppRole, compte de service K8s) et reçoit des identifiants courts, renouvelés automatiquement.
      en: |
        There are three main ways for an application to retrieve its dynamic secrets:

        1. **Directly, via the SDK**: in Python, the **`hvac`** library authenticates (AppRole, token...)
           then reads the role path (`database/creds/<role>`). The application gets a fresh user/password
           pair and must **renew the lease** (`sys.renew_lease`) or request a new one before expiry.
        2. **Vault Agent**: a companion process that authenticates for you, fetches the secrets, writes them
           to a file via a *template*, and handles renewal. The application just reads a file and knows
           nothing of Vault. Ideal for existing code you do not want to modify.
        3. **Kubernetes authentication**: in a cluster, the *pod* presents its **service-account token**
           (the JWT mounted under `/var/run/secrets/...`). Vault verifies it against the Kubernetes API
           and, if it matches a configured role, issues a Vault token. No bootstrap secret to distribute:
           the pod's identity *is* the starting point.

        The common thread: the application never holds a long-lived secret. It proves its identity (AppRole,
        K8s service account) and receives short credentials, renewed automatically.

examples:
  - title:
      fr: "L'anti-pattern : un mot de passe DB statique et partagé"
      en: "The anti-pattern: a static, shared DB password"
    file: static_db.py
    lang: python
    kind: vulnerable
    code: |
      import os

      # One password, set years ago, shared by every service and every dev.
      # If it leaks (logs, repo, laptop), the attacker keeps full DB access
      # until someone manually rotates it everywhere at once.
      DB_USER = "app_user"
      DB_PASSWORD = os.environ.get("DB_PASSWORD", "changeme-in-vault")

      def connect():
          print(f"Connecting as {DB_USER} (same creds as all other services)")
          return {"user": DB_USER, "password": DB_PASSWORD}

      connect()
    output: |
      Connecting as app_user (same creds as all other services)
    note:
      fr: "Un seul mot de passe partagé : impossible de savoir quel service a fait quoi, et toute fuite impose une rotation coordonnée douloureuse. Les secrets dynamiques suppriment ce problème à la racine."
      en: "A single shared password: impossible to know which service did what, and any leak forces a painful coordinated rotation. Dynamic secrets remove this problem at the root."

  - title:
      fr: "Configurer le moteur de base de données de Vault"
      en: "Configuring Vault's database secrets engine"
    file: db-engine.sh
    lang: bash
    kind: secure
    code: |
      # Enable the database secrets engine
      vault secrets enable database

      # Teach Vault how to reach PostgreSQL as an ADMIN (to create/drop users).
      # The admin password here is a Vault-managed root rotation candidate.
      vault write database/config/app-postgres \
        plugin_name=postgresql-database-plugin \
        allowed_roles="app-readwrite" \
        connection_url="postgresql://{{username}}:{{password}}@db.example.com:5432/app?sslmode=require" \
        username="vault_admin" password="changeme-in-vault"

      # A role = the SQL Vault runs to CREATE a short-lived account, plus TTLs.
      vault write database/roles/app-readwrite \
        db_name=app-postgres \
        creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO \"{{name}}\";" \
        default_ttl="15m" max_ttl="1h"
    output: |
      Success! Data written to: database/config/app-postgres
      Success! Data written to: database/roles/app-readwrite
    note:
      fr: "Vault détient le compte admin et fabrique à la demande des comptes temporaires avec `creation_statements`. Chaque compte expire après 15 minutes (`default_ttl`). On n'accorde que les droits nécessaires (`SELECT, INSERT, UPDATE, DELETE`), jamais `SUPERUSER`."
      en: "Vault holds the admin account and mints temporary accounts on demand with `creation_statements`. Each account expires after 15 minutes (`default_ttl`). You grant only the needed privileges (`SELECT, INSERT, UPDATE, DELETE`), never `SUPERUSER`."

  - title:
      fr: "Demander un identifiant éphémère (CLI)"
      en: "Requesting an ephemeral credential (CLI)"
    file: get-creds.sh
    lang: bash
    kind: secure
    code: |
      # Ask Vault for a fresh, short-lived PostgreSQL account
      vault read database/creds/app-readwrite
    output: |
      Key                Value
      ---                -----
      lease_id           database/creds/app-readwrite/8xK2mQ9wZrVb4
      lease_duration     15m
      lease_renewable    true
      password           A1b-2Cd3Ef4Gh5Ij
      username           v-approle-app-rea-7Hk2Pq9
    note:
      fr: "Vault a créé à la volée l'utilisateur `v-approle-app-rea-...` valable 15 minutes. Son nom unique le rend attribuable dans les journaux de la base. À l'expiration du bail, Vault exécute le `DROP ROLE` : aucun compte orphelin."
      en: "Vault created the user `v-approle-app-rea-...` on the fly, valid for 15 minutes. Its unique name makes it attributable in the database logs. When the lease expires, Vault runs the `DROP ROLE`: no orphan account."

  - title:
      fr: "Consommer les secrets dynamiques en Python avec hvac"
      en: "Consuming dynamic secrets in Python with hvac"
    file: app_hvac.py
    lang: python
    kind: secure
    code: |
      import os
      import hvac  # pip install hvac

      # Authenticate with AppRole (role_id/secret_id injected by the platform),
      # never with a long-lived root token.
      client = hvac.Client(url=os.environ["VAULT_ADDR"])
      client.auth.approle.login(
          role_id=os.environ["VAULT_ROLE_ID"],
          secret_id=os.environ["VAULT_SECRET_ID"],
      )
      assert client.is_authenticated()

      # Request a fresh, short-lived database credential
      creds = client.secrets.database.generate_credentials(name="app-readwrite")
      lease_id = creds["lease_id"]
      user = creds["data"]["username"]
      password = creds["data"]["password"]
      print(f"Got ephemeral DB user {user} (lease {lease_id[:28]}...)")

      # Before the 15-minute TTL ends, renew the lease to keep the account alive
      client.sys.renew_lease(lease_id=lease_id, increment=900)
      print("Lease renewed for another 15 minutes")

      # The app now connects to PostgreSQL with (user, password).
      # On shutdown, revoke immediately instead of waiting for expiry:
      client.sys.revoke_lease(lease_id=lease_id)
      print("Lease revoked: the database account no longer exists")
    output: |
      Got ephemeral DB user v-approle-app-rea-7Hk2Pq9 (lease database/creds/app...)
      Lease renewed for another 15 minutes
      Lease revoked: the database account no longer exists
    note:
      fr: "`hvac` s'authentifie par AppRole, obtient un compte DB frais, renouvelle le bail tant que l'application tourne, puis le révoque à l'arrêt. Le mot de passe ne survit jamais à l'exécution : rien à faire fuir dans un `.env`."
      en: "`hvac` authenticates via AppRole, gets a fresh DB account, renews the lease while the app runs, then revokes it on shutdown. The password never outlives the run: nothing to leak into a `.env`."

  - title:
      fr: "Aperçu : authentification Kubernetes (rôle Vault)"
      en: "Overview: Kubernetes authentication (Vault role)"
    file: k8s-auth.sh
    lang: bash
    kind: secure
    code: |
      # Enable and configure the Kubernetes auth method so Vault can verify
      # the service-account JWT a pod presents.
      vault auth enable kubernetes
      vault write auth/kubernetes/config \
        kubernetes_host="https://kubernetes.default.svc:443"

      # Bind a Kubernetes service account to a Vault policy. A pod running as
      # 'billing' in namespace 'prod' may log in and get the billing-read policy.
      vault write auth/kubernetes/role/billing \
        bound_service_account_names="billing" \
        bound_service_account_namespaces="prod" \
        policies="billing-read" \
        ttl=20m
    output: |
      Success! Data written to: auth/kubernetes/config
      Success! Data written to: auth/kubernetes/role/billing
    note:
      fr: "Aucun secret d'amorçage à copier dans le pod : son identité (le compte de service `billing` du namespace `prod`) suffit. Vault vérifie le JWT auprès de l'API Kubernetes et délivre un token à TTL court. C'est l'identité machine idéale dans un cluster."
      en: "No bootstrap secret to copy into the pod: its identity (the `billing` service account in the `prod` namespace) is enough. Vault verifies the JWT against the Kubernetes API and issues a short-TTL token. This is the ideal machine identity inside a cluster."

mistake:
  fr: |
    **Traiter un secret dynamique comme un secret statique : le récupérer une fois et l'oublier.**

    Un identifiant dynamique a un **bail** (*lease*) avec un TTL. Si l'application le lit au démarrage puis
    tourne pendant des heures sans renouveler ni redemander, la connexion est brutalement refusée dès que
    Vault exécute le `DROP ROLE`. Il faut soit **renouveler le bail** avant expiration, soit **redemander**
    un identifiant et rouvrir la connexion. Beaucoup d'incidents « la base me rejette après 15 minutes »
    viennent de là.

    Autre erreur : donner au compte admin de Vault des droits `SUPERUSER`, ou aux rôles générés plus de
    privilèges que nécessaire. Les `creation_statements` doivent appliquer le moindre privilège, comme
    n'importe quel compte applicatif. Enfin, ne pas **révoquer** les baux à l'arrêt propre d'une
    application laisse des comptes vivre jusqu'à leur TTL inutilement.
  en: |
    **Treating a dynamic secret like a static one: fetch it once and forget it.**

    A dynamic credential has a **lease** with a TTL. If the application reads it at startup then runs for
    hours without renewing or re-requesting, the connection is abruptly refused as soon as Vault runs the
    `DROP ROLE`. You must either **renew the lease** before expiry, or **re-request** a credential and
    reopen the connection. Many "the database rejects me after 15 minutes" incidents come from this.

    Another mistake: giving Vault's admin account `SUPERUSER` rights, or granting the generated roles more
    privileges than needed. The `creation_statements` must apply least privilege, like any application
    account. Finally, not **revoking** leases on a clean application shutdown lets accounts live to their
    TTL needlessly.

bestPractice:
  fr: |
    - **Préférez les secrets dynamiques aux mots de passe statiques** pour les bases de données, les accès cloud et les certificats.
    - **TTL courts** : un identifiant qui vit 15 minutes limite fortement l'impact d'une fuite.
    - **Renouvelez ou redemandez** avant expiration ; gérez l'erreur de bail expiré par une reconnexion.
    - **Moindre privilège dans les `creation_statements`** : jamais de `SUPERUSER`, seulement les droits requis.
    - **Révoquez les baux à l'arrêt** de l'application, plutôt que d'attendre le TTL.
    - **Authentifiez les applications par leur identité** (AppRole, compte de service Kubernetes), pas par un token longue durée.
    - **Déléguez le cycle de vie à Vault Agent** quand le code ne peut pas être modifié.
  en: |
    - **Prefer dynamic secrets over static passwords** for databases, cloud access and certificates.
    - **Short TTLs**: a credential that lives 15 minutes strongly limits the impact of a leak.
    - **Renew or re-request** before expiry; handle the expired-lease error with a reconnect.
    - **Least privilege in `creation_statements`**: never `SUPERUSER`, only the required rights.
    - **Revoke leases on shutdown** rather than waiting for the TTL.
    - **Authenticate applications by their identity** (AppRole, Kubernetes service account), not by a long-lived token.
    - **Delegate the lifecycle to Vault Agent** when the code cannot be modified.

exercise:
  statement:
    fr: |
      Le moteur de base de données de Vault est déjà activé et un rôle `reporting-ro` existe, qui fabrique
      des comptes PostgreSQL en lecture seule avec un TTL de 15 minutes.

      Écrivez un script Python utilisant `hvac` qui :

      1. s'authentifie auprès de Vault par AppRole (variables `VAULT_ADDR`, `VAULT_ROLE_ID`,
         `VAULT_SECRET_ID`) ;
      2. demande un identifiant dynamique pour le rôle `reporting-ro` et affiche l'utilisateur généré ;
      3. renouvelle le bail d'un quart d'heure supplémentaire ;
      4. révoque le bail à la fin.
    en: |
      Vault's database engine is already enabled and a `reporting-ro` role exists, which mints read-only
      PostgreSQL accounts with a 15-minute TTL.

      Write a Python script using `hvac` that:

      1. authenticates to Vault via AppRole (variables `VAULT_ADDR`, `VAULT_ROLE_ID`, `VAULT_SECRET_ID`);
      2. requests a dynamic credential for the `reporting-ro` role and prints the generated user;
      3. renews the lease for another fifteen minutes;
      4. revokes the lease at the end.
  solution:
    file: solution.py
    lang: python
    code: |
      import os
      import hvac

      # 1. Authenticate with AppRole (no long-lived token in the code)
      client = hvac.Client(url=os.environ["VAULT_ADDR"])
      client.auth.approle.login(
          role_id=os.environ["VAULT_ROLE_ID"],
          secret_id=os.environ["VAULT_SECRET_ID"],
      )
      if not client.is_authenticated():
          raise SystemExit("Vault authentication failed")

      # 2. Request an ephemeral read-only DB credential
      creds = client.secrets.database.generate_credentials(name="reporting-ro")
      lease_id = creds["lease_id"]
      print("Generated user:", creds["data"]["username"])

      # 3. Keep the account alive for another 15 minutes
      client.sys.renew_lease(lease_id=lease_id, increment=900)
      print("Lease renewed")

      # 4. Revoke immediately when done, instead of waiting for the TTL
      client.sys.revoke_lease(lease_id=lease_id)
      print("Lease revoked; the account is dropped")
    note:
      fr: "Le mot de passe n'est jamais stocké : il vit en mémoire le temps de l'exécution. La révocation finale exécute le `DROP ROLE` côté PostgreSQL immédiatement, sans attendre le TTL."
      en: "The password is never stored: it lives in memory for the duration of the run. The final revocation runs the `DROP ROLE` on PostgreSQL immediately, without waiting for the TTL."

quiz:
  - q:
      fr: "Quel est l'avantage principal d'un secret dynamique sur un secret statique ?"
      en: "What is the main advantage of a dynamic secret over a static one?"
    options:
      fr:
        - "Il est plus court à taper"
        - "Il est unique, à durée de vie courte et révoqué automatiquement"
        - "Il ne nécessite aucune authentification"
        - "Il est stocké en clair dans le code"
      en:
        - "It is shorter to type"
        - "It is unique, short-lived and automatically revoked"
        - "It needs no authentication"
        - "It is stored in clear text in the code"
    answer: 1
    why:
      fr: "Vault fabrique un identifiant unique par demande, à TTL court, puis le supprime. Une fuite n'expose qu'un compte temporaire, attribuable, qui expire de lui-même."
      en: "Vault mints a unique credential per request, with a short TTL, then deletes it. A leak only exposes a temporary, attributable account that expires on its own."
  - q:
      fr: "Comment Vault supprime-t-il un compte de base de données dynamique à l'expiration ?"
      en: "How does Vault remove a dynamic database account on expiry?"
    options:
      fr:
        - "Il attend qu'un administrateur le fasse"
        - "Il ne le supprime jamais"
        - "À l'expiration du bail, il exécute les instructions de révocation (`DROP ROLE`)"
        - "Il redémarre la base de données"
      en:
        - "It waits for an administrator to do it"
        - "It never removes it"
        - "When the lease expires, it runs the revocation statements (`DROP ROLE`)"
        - "It restarts the database"
    answer: 2
    why:
      fr: "Chaque bail a un TTL. À l'expiration (ou sur révocation explicite), Vault exécute le `DROP ROLE` : aucun compte orphelin ne subsiste."
      en: "Each lease has a TTL. On expiry (or explicit revocation), Vault runs the `DROP ROLE`: no orphan account remains."
  - q:
      fr: "Pourquoi une application doit-elle renouveler le bail d'un secret dynamique ?"
      en: "Why must an application renew the lease of a dynamic secret?"
    options:
      fr:
        - "Pour éviter que la connexion soit brutalement coupée quand le TTL expire"
        - "Pour chiffrer la connexion"
        - "Pour obtenir des droits d'administrateur"
        - "Parce que Vault facture chaque lecture"
      en:
        - "To avoid the connection being abruptly cut when the TTL expires"
        - "To encrypt the connection"
        - "To obtain administrator rights"
        - "Because Vault bills each read"
    answer: 0
    why:
      fr: "Sans renouvellement ni nouvelle demande, Vault révoque le compte à l'expiration et la base rejette l'application. On renouvelle le bail ou on redemande un identifiant à temps."
      en: "Without renewal or a new request, Vault revokes the account at expiry and the database rejects the application. You renew the lease or re-request a credential in time."
  - q:
      fr: "Dans l'authentification Kubernetes de Vault, qu'utilise le pod pour prouver son identité ?"
      en: "In Vault's Kubernetes authentication, what does the pod use to prove its identity?"
    options:
      fr:
        - "Un mot de passe stocké dans un `.env`"
        - "Le jeton (JWT) de son compte de service, vérifié par l'API Kubernetes"
        - "Son adresse IP"
        - "Le token racine de Vault"
      en:
        - "A password stored in a `.env`"
        - "Its service-account token (JWT), verified by the Kubernetes API"
        - "Its IP address"
        - "The Vault root token"
    answer: 1
    why:
      fr: "Le pod présente le JWT de son compte de service. Vault le valide auprès de l'API Kubernetes et délivre un token. Aucun secret d'amorçage n'est distribué."
      en: "The pod presents its service-account JWT. Vault validates it against the Kubernetes API and issues a token. No bootstrap secret is distributed."
  - q:
      fr: "À quoi sert Vault Agent ?"
      en: "What is Vault Agent for?"
    options:
      fr:
        - "À remplacer la base de données"
        - "À chiffrer le disque du serveur"
        - "À s'authentifier, récupérer et renouveler les secrets pour une application qui lit ensuite un simple fichier"
        - "À désactiver les politiques"
      en:
        - "To replace the database"
        - "To encrypt the server disk"
        - "To authenticate, fetch and renew secrets for an application that then just reads a file"
        - "To disable policies"
    answer: 2
    why:
      fr: "Vault Agent gère l'authentification et le cycle de vie des secrets, puis les écrit dans un fichier via un template. L'application existante lit le fichier sans connaître Vault."
      en: "Vault Agent handles authentication and the secret lifecycle, then writes them to a file via a template. The existing application reads the file without knowing Vault."
