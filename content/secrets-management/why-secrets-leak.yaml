description:
  fr: "Comprendre les cinq grandes voies par lesquelles les secrets fuient : code, historique Git, journaux, images et sorties de CI."
  en: "Understand the five main ways secrets leak: source code, Git history, logs, images and CI output."
duration: 22

intro:
  fr: |
    Un **secret**, c'est toute valeur qui prouve une identité ou ouvre un accès : mot de passe, clé d'API,
    jeton, certificat privé. Il suffit qu'un seul fuite pour qu'un attaquant entre. Le problème n'est pas
    tant de « cacher » un secret que de comprendre les **chemins** par lesquels il s'échappe sans qu'on s'en
    rende compte.

    Imaginez la clé de votre appartement. Vous ne la laissez pas sur la porte (le code source), mais vous
    la photographiez « juste pour la retrouver » (l'historique Git), vous la mentionnez dans un message
    (les journaux), vous la glissez dans un carton de déménagement livré à tous (l'image Docker), ou vous
    la lisez à voix haute devant une caméra qui diffuse en direct (la sortie de CI). Même rangée, elle a
    déjà fuité cinq fois.

    Dans cette leçon, vous allez voir ces cinq voies sur du vrai code et comprendre pourquoi *supprimer* un
    secret ne suffit presque jamais.
  en: |
    A **secret** is any value that proves an identity or opens an access: password, API key, token, private
    certificate. A single leak is enough for an attacker to get in. The problem is less about "hiding" a
    secret than about understanding the **paths** by which it escapes without you noticing.

    Picture your apartment key. You do not leave it in the door (the source code), but you photograph it
    "just to keep a copy" (the Git history), you mention it in a message (the logs), you slip it into a
    moving box delivered to everyone (the Docker image), or you read it aloud in front of a camera
    streaming live (the CI output). Even once tidied away, it has already leaked five times.

    In this lesson you will see those five paths on real code and understand why *deleting* a secret is
    almost never enough.

sections:
  - heading:
      fr: "Les cinq voies de fuite"
      en: "The five leak paths"
    body:
      fr: |
        Un secret ne fuite pas « par magie » : il emprunte presque toujours l'un de ces cinq chemins.

        | Voie | Comment | Pourquoi c'est grave |
        |---|---|---|
        | Code en dur | Clé écrite dans un `.py`, `.js`, `.tf`... | Visible par tous ceux qui lisent le dépôt |
        | Historique Git | Secret commité puis « supprimé » | Reste accessible dans les anciens commits |
        | Journaux | Secret affiché dans un `print`, une URL, une trace | Les journaux partent vers un SIEM, un fichier partagé |
        | Image conteneur | `.env` ou `ARG` figés dans une couche | Qui a l'image a le secret, via `docker history` |
        | Sortie de CI | Secret affiché pendant un `build`, un `echo` | Les logs de pipeline sont souvent publics |

        Le point commun : dans chaque cas, le secret se retrouve dans un endroit **conservé et partagé**
        (dépôt, journaux, registre d'images, logs de CI) que l'on oublie quand on « range » le code. La
        bonne défense n'est pas de mieux cacher, mais de ne **jamais** y mettre le secret, et d'automatiser
        la détection.
      en: |
        A secret does not leak "by magic": it almost always takes one of these five paths.

        | Path | How | Why it is serious |
        |---|---|---|
        | Hard-coded | Key written in a `.py`, `.js`, `.tf`... | Visible to everyone who reads the repo |
        | Git history | Secret committed then "deleted" | Still reachable in older commits |
        | Logs | Secret printed in a `print`, a URL, a stack trace | Logs flow to a SIEM, a shared file |
        | Container image | `.env` or `ARG` frozen into a layer | Whoever has the image has the secret, via `docker history` |
        | CI output | Secret printed during a `build`, an `echo` | Pipeline logs are often public |

        The common thread: in each case the secret ends up in a place that is **kept and shared** (repo,
        logs, image registry, CI logs) that you forget when you "tidy up" the code. The right defence is not
        to hide better, but to **never** put the secret there, and to automate detection.
  - heading:
      fr: "Supprimer ne suffit pas : l'historique Git garde tout"
      en: "Deleting is not enough: Git history keeps everything"
    body:
      fr: |
        L'erreur la plus répandue : commiter une clé, s'en apercevoir, la supprimer dans un nouveau commit,
        et croire le problème réglé. **Faux.** Git est fait pour conserver l'histoire : le secret reste
        présent dans le commit où il a été ajouté, récupérable par `git log -p`, `git show`, ou en clonant
        le dépôt.

        Pire : si le dépôt a été poussé sur GitHub/GitLab, le secret a probablement déjà été lu par des
        robots qui scrutent les commits publics en permanence. Un secret poussé en public doit être
        considéré comme **compromis dès la première seconde**.

        La seule issue correcte comporte deux étapes, dans cet ordre :

        1. **Révoquer et renouveler** le secret chez son émetteur (AWS, base de données, fournisseur d'API) —
           car il est déjà compromis.
        2. **Nettoyer l'historique** (`git filter-repo`, BFG) pour qu'il ne traîne plus dans le dépôt.

        Inverser l'ordre — nettoyer d'abord — laisse la fenêtre ouverte : la leçon « Détection, rotation et
        réponse » détaille ce runbook.
      en: |
        The most widespread mistake: commit a key, notice it, delete it in a new commit, and believe the
        problem is solved. **Wrong.** Git is built to keep history: the secret is still present in the
        commit where it was added, recoverable with `git log -p`, `git show`, or by cloning the repo.

        Worse: if the repo was pushed to GitHub/GitLab, the secret has probably already been read by bots
        that constantly scan public commits. A secret pushed in public must be treated as **compromised
        from the first second**.

        The only correct way out has two steps, in this order:

        1. **Revoke and rotate** the secret at its issuer (AWS, database, API provider) — because it is
           already compromised.
        2. **Clean the history** (`git filter-repo`, BFG) so it no longer lingers in the repo.

        Reversing the order — cleaning first — leaves the window open: the "Detection, rotation and
        response" lesson details that runbook.

examples:
  - title:
      fr: "Les cinq voies de fuite dans une seule application"
      en: "The five leak paths in a single application"
    file: leaky_app.py
    lang: python
    kind: vulnerable
    code: |
      import logging

      # Path 1 - hard-coded secret: anyone reading the repo sees it
      STRIPE_KEY = "sk_live_REDACTED_EXAMPLE_ONLY"
      DB_URL = "postgres://admin:S3cr3tP@ss@db.example.com:5432/app"

      logging.basicConfig(level=logging.INFO)

      def charge(amount):
          # Path 3 - secret leaked into the logs (and whatever ships them)
          logging.info("Calling Stripe with key %s for %s", STRIPE_KEY, amount)
          # Path 3 again - secret embedded in a URL that gets logged by proxies
          return f"https://api.example.com/charge?key={STRIPE_KEY}&amount={amount}"

      print(charge(42))
    output: |
      INFO:root:Calling Stripe with key sk_live_REDACTED_EXAMPLE_ONLY for 42
      https://api.example.com/charge?key=sk_live_REDACTED_EXAMPLE_ONLY&amount=42
    note:
      fr: "Un même secret fuite ici trois fois : en dur dans le code, dans un message de log, et dans une URL (que les proxys et les journaux d'accès enregistrent). Mettre un secret dans une URL est une faute classique."
      en: "The same secret leaks three times here: hard-coded, in a log message, and in a URL (which proxies and access logs record). Putting a secret in a URL is a classic mistake."

  - title:
      fr: "La même application sans secret en clair"
      en: "The same application with no clear-text secret"
    file: clean_app.py
    lang: python
    kind: secure
    code: |
      import os
      import logging

      # The secret is injected by the environment (a vault, the orchestrator).
      # It is never written in the code and never reaches the repository.
      STRIPE_KEY = os.environ["STRIPE_KEY"]

      logging.basicConfig(level=logging.INFO)

      def mask(secret):
          # Log only a non-reversible hint, never the value itself
          return secret[:3] + "..." + secret[-2:]

      def charge(amount):
          # Log a masked hint; the secret travels in a header, not the URL
          logging.info("Calling Stripe (key %s) for %s", mask(STRIPE_KEY), amount)
          return {"url": "https://api.example.com/charge",
                  "headers": {"Authorization": f"Bearer {STRIPE_KEY}"},
                  "body": {"amount": amount}}

      print(charge(42)["url"])
    output: |
      INFO:root:Calling Stripe (key sk_...mN) for 42
      https://api.example.com/charge
    note:
      fr: "Trois corrections : le secret vient de l'environnement, les journaux n'en montrent qu'un indice masqué, et il voyage dans un en-tête `Authorization` (non journalisé) au lieu de l'URL. Le secret ne touche plus aucun support conservé."
      en: "Three fixes: the secret comes from the environment, the logs show only a masked hint, and it travels in an `Authorization` header (not logged) instead of the URL. The secret no longer touches any kept medium."

  - title:
      fr: "Le secret « supprimé » qui vit encore dans l'historique"
      en: "The \"deleted\" secret still alive in history"
    file: git-history-leak.sh
    lang: bash
    kind: vulnerable
    code: |
      # A developer commits a secret, then "removes" it in a later commit
      git add config.py && git commit -m "add config"        # secret committed
      sed -i '/API_KEY/d' config.py
      git add config.py && git commit -m "remove secret"     # looks clean now

      # The current file is clean...
      grep API_KEY config.py || echo "not in working tree"

      # ...but the secret is still fully recoverable from history:
      git log -p -S 'API_KEY' --source | grep API_KEY
    output: |
      not in working tree
      +API_KEY = "AKIAIOSFODNN7EXAMPLE"
    note:
      fr: "Le fichier courant ne contient plus la clé, mais `git log -p -S` la retrouve intacte dans l'ancien commit. Quiconque clone le dépôt la récupère. D'où la règle : révoquer d'abord, nettoyer l'historique ensuite."
      en: "The current file no longer holds the key, but `git log -p -S` finds it intact in the old commit. Anyone who clones the repo gets it. Hence the rule: revoke first, clean the history afterwards."

  - title:
      fr: "Le secret figé dans une couche d'image Docker"
      en: "The secret baked into a Docker image layer"
    file: Dockerfile
    lang: dockerfile
    kind: vulnerable
    code: |
      FROM python:3.12-slim

      # ANTI-PATTERN: the secret is passed as a build argument...
      ARG API_TOKEN
      # ...and written into an env var, frozen into this image layer forever.
      ENV API_TOKEN=${API_TOKEN}

      # Even copying a .env file bakes it into the image history.
      COPY .env /app/.env

      CMD ["python", "app.py"]
    output: |
      # Anyone with the image can extract it without running it:
      $ docker history --no-trunc myimage | grep API_TOKEN
      ... ENV API_TOKEN=changeme-in-vault ...
      $ docker run --rm myimage cat /app/.env
      API_TOKEN=changeme-in-vault
    note:
      fr: "`ARG`/`ENV` et `COPY .env` inscrivent le secret dans une couche de l'image. `docker history` l'exhume sans même lancer le conteneur. Les secrets d'exécution doivent être injectés au **démarrage**, jamais à la **construction**."
      en: "`ARG`/`ENV` and `COPY .env` write the secret into an image layer. `docker history` digs it out without even running the container. Runtime secrets must be injected at **start**, never at **build** time."

mistake:
  fr: |
    **Croire qu'un secret retiré du code est un secret protégé.**

    Un secret qui a été commité, journalisé, intégré à une image ou affiché dans un pipeline est déjà
    sorti : il existe des copies ailleurs, hors de votre contrôle. Le supprimer du fichier courant ne
    supprime ni l'historique Git, ni les journaux déjà expédiés, ni les images déjà distribuées, ni les
    logs de CI déjà archivés.

    Par conséquent, dès qu'un secret a touché l'un de ces cinq supports, il faut le considérer comme
    **compromis** et le **renouveler** chez son émetteur. Cacher n'est pas protéger : la vraie protection
    consiste à ne jamais écrire le secret dans le code ni dans un support conservé, et à détecter
    automatiquement les fuites avant qu'elles n'atteignent le dépôt distant.
  en: |
    **Believing that a secret removed from the code is a protected secret.**

    A secret that was committed, logged, baked into an image or printed in a pipeline is already out: copies
    exist elsewhere, outside your control. Removing it from the current file deletes neither the Git
    history, nor the logs already shipped, nor the images already distributed, nor the CI logs already
    archived.

    Therefore, as soon as a secret has touched one of these five media, treat it as **compromised** and
    **rotate** it at its issuer. Hiding is not protecting: real protection means never writing the secret in
    the code or in any kept medium, and detecting leaks automatically before they reach the remote repo.

bestPractice:
  fr: |
    - **Aucun secret dans le code** : lisez-les depuis l'environnement, un coffre (Vault) ou un gestionnaire (Secrets Manager).
    - **Aucun secret dans une URL ni dans un journal** : masquez-les, faites-les voyager dans un en-tête, et nettoyez les traces.
    - **Aucun secret à la construction d'une image** : injectez-les au démarrage du conteneur, pas via `ARG`/`ENV`/`COPY .env`.
    - **Détection automatique** avant le `push` : un scanner de secrets en hook pre-commit et en CI (gitleaks, ggshield).
    - **Un secret exposé est un secret mort** : révoquez et renouvelez d'abord, nettoyez l'historique ensuite.
    - **Centralisez** la gestion des secrets plutôt que de les disperser dans des fichiers et des variables.
  en: |
    - **No secret in the code**: read them from the environment, a vault (Vault) or a manager (Secrets Manager).
    - **No secret in a URL or a log**: mask them, send them in a header, and clean the traces.
    - **No secret at image build time**: inject them at container start, not via `ARG`/`ENV`/`COPY .env`.
    - **Automatic detection** before the `push`: a secret scanner in a pre-commit hook and in CI (gitleaks, ggshield).
    - **An exposed secret is a dead secret**: revoke and rotate first, clean the history afterwards.
    - **Centralise** secret management instead of scattering secrets across files and variables.

exercise:
  statement:
    fr: |
      Le script ci-dessous contient trois voies de fuite de secret différentes.

      ```python
      API_KEY = "sk_live_abc123def456"

      def notify(user):
          url = f"https://api.example.com/send?token={API_KEY}&to={user}"
          print(f"DEBUG sending with token {API_KEY}")
          return url
      ```

      1. Identifiez les trois voies de fuite.
      2. Réécrivez le script pour les corriger : le secret vient de l'environnement, ne figure pas dans
         l'URL, et n'apparaît pas en clair dans les traces.
    en: |
      The script below contains three different secret-leak paths.

      ```python
      API_KEY = "sk_live_abc123def456"

      def notify(user):
          url = f"https://api.example.com/send?token={API_KEY}&to={user}"
          print(f"DEBUG sending with token {API_KEY}")
          return url
      ```

      1. Identify the three leak paths.
      2. Rewrite the script to fix them: the secret comes from the environment, is not in the URL, and does
         not appear in clear text in the traces.
  solution:
    file: solution.py
    lang: python
    code: |
      import os

      # Fix 1: the secret is read from the environment, not hard-coded
      API_KEY = os.environ["API_KEY"]

      def mask(s):
          return s[:3] + "..." + s[-2:]

      def notify(user):
          # Fix 2: secret goes in a header, not the URL (URLs get logged)
          url = "https://api.example.com/send"
          headers = {"Authorization": f"Bearer {API_KEY}"}
          # Fix 3: log only a masked hint, never the raw secret
          print(f"DEBUG sending to {user} with token {mask(API_KEY)}")
          return {"url": url, "headers": headers, "params": {"to": user}}
    note:
      fr: "Les trois voies corrigées : code en dur (lu depuis l'environnement), secret dans l'URL (déplacé dans un en-tête), secret dans les traces (masqué). Même si ce secret avait déjà été commité, il faudrait aussi le renouveler."
      en: "The three paths fixed: hard-coded (read from the environment), secret in the URL (moved to a header), secret in the traces (masked). If this secret had already been committed, you would also have to rotate it."

quiz:
  - q:
      fr: "Pourquoi supprimer un secret dans un nouveau commit ne le protège-t-il pas ?"
      en: "Why does deleting a secret in a new commit not protect it?"
    options:
      fr:
        - "Parce que Git chiffre les commits"
        - "Parce que le secret reste présent dans l'historique des anciens commits"
        - "Parce que le secret est automatiquement renouvelé"
        - "Parce que la suppression ne fonctionne que sur GitLab"
      en:
        - "Because Git encrypts commits"
        - "Because the secret stays present in the history of the older commits"
        - "Because the secret is automatically rotated"
        - "Because deletion only works on GitLab"
    answer: 1
    why:
      fr: "Git conserve l'histoire : `git log -p -S` ou un simple clone retrouvent le secret dans le commit d'origine. Il faut le révoquer puis nettoyer l'historique."
      en: "Git keeps history: `git log -p -S` or a simple clone recover the secret in the original commit. You must revoke it then clean the history."
  - q:
      fr: "Pourquoi passer un secret via `ARG`/`ENV` dans un Dockerfile est-il dangereux ?"
      en: "Why is passing a secret via `ARG`/`ENV` in a Dockerfile dangerous?"
    options:
      fr:
        - "Il est figé dans une couche de l'image et récupérable avec `docker history`"
        - "Il ralentit la construction de l'image"
        - "Il empêche le conteneur de démarrer"
        - "Il n'est lisible que par root"
      en:
        - "It is frozen into an image layer and recoverable with `docker history`"
        - "It slows down the image build"
        - "It prevents the container from starting"
        - "It is only readable by root"
    answer: 0
    why:
      fr: "Les instructions `ARG`/`ENV` et `COPY .env` inscrivent le secret dans l'image. Quiconque a l'image l'extrait sans la lancer. Les secrets d'exécution s'injectent au démarrage."
      en: "The `ARG`/`ENV` and `COPY .env` instructions write the secret into the image. Anyone with the image extracts it without running it. Runtime secrets are injected at start."
  - q:
      fr: "Pourquoi ne faut-il jamais mettre un secret dans une URL (query string) ?"
      en: "Why should you never put a secret in a URL (query string)?"
    options:
      fr:
        - "Parce que les URL sont limitées à 80 caractères"
        - "Parce que les navigateurs refusent les URL avec des clés"
        - "Parce que les URL sont journalisées par les proxys, serveurs et navigateurs"
        - "Parce que cela casse le chiffrement TLS"
      en:
        - "Because URLs are limited to 80 characters"
        - "Because browsers refuse URLs with keys"
        - "Because URLs are logged by proxies, servers and browsers"
        - "Because it breaks TLS encryption"
    answer: 2
    why:
      fr: "Même en HTTPS, l'URL complète apparaît dans les journaux d'accès, l'historique du navigateur et les proxys. Un secret doit voyager dans un en-tête, pas dans la query string."
      en: "Even over HTTPS, the full URL appears in access logs, browser history and proxies. A secret must travel in a header, not the query string."
  - q:
      fr: "Un secret a été poussé dans un dépôt public pendant dix minutes avant d'être retiré. Que faut-il faire ?"
      en: "A secret was pushed to a public repo for ten minutes before being removed. What should you do?"
    options:
      fr:
        - "Rien, dix minutes c'est trop court pour qu'il soit lu"
        - "Le considérer comme compromis et le renouveler immédiatement"
        - "Le remettre en privé et le garder"
        - "Attendre de voir s'il est utilisé"
      en:
        - "Nothing, ten minutes is too short for it to be read"
        - "Treat it as compromised and rotate it immediately"
        - "Make the repo private again and keep the secret"
        - "Wait to see if it gets used"
    answer: 1
    why:
      fr: "Des robots scrutent les commits publics en continu. Un secret exposé, même brièvement, doit être considéré comme compromis dès la première seconde et renouvelé."
      en: "Bots scan public commits continuously. An exposed secret, even briefly, must be treated as compromised from the first second and rotated."
  - q:
      fr: "Quelle est la meilleure défense de fond contre les fuites de secrets ?"
      en: "What is the best underlying defence against secret leaks?"
    options:
      fr:
        - "Mieux cacher les secrets dans le code"
        - "Renommer les variables de secrets"
        - "Ne jamais écrire le secret dans un support conservé et détecter automatiquement les fuites"
        - "Mettre le dépôt en privé"
      en:
        - "Hide the secrets better in the code"
        - "Rename the secret variables"
        - "Never write the secret into a kept medium and detect leaks automatically"
        - "Make the repo private"
    answer: 2
    why:
      fr: "Cacher ou renommer ne protège pas ; un dépôt privé fuite aussi. La vraie défense : injecter les secrets depuis l'extérieur et scanner avant chaque push."
      en: "Hiding or renaming does not protect; a private repo leaks too. The real defence: inject secrets from outside and scan before every push."
