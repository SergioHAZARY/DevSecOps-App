description:
  fr: "Stocker, lire et faire tourner des secrets avec AWS Secrets Manager (CLI et boto3), une politique IAM restrictive et Parameter Store comme alternative."
  en: "Store, read and rotate secrets with AWS Secrets Manager (CLI and boto3), a restrictive IAM policy and Parameter Store as an alternative."
duration: 28

intro:
  fr: |
    Sur AWS, deux services gardent vos secrets à la place d'un fichier `.env` : **AWS Secrets Manager** et
    **SSM Parameter Store**. Au lieu de livrer un mot de passe avec l'application, celle-ci le demande au
    service au démarrage, en prouvant son identité via **IAM** — et chaque accès est journalisé par
    CloudTrail.

    Imaginez un distributeur de clés sécurisé dans le hall de l'entreprise. Vous ne gardez pas la clé du
    serveur dans votre poche : vous présentez votre badge (le rôle IAM), le distributeur vérifie que vous
    avez le droit (la **politique IAM**), vous donne la clé pour cette porte précise, et note l'emprunt
    dans un registre. Secrets Manager peut même changer la serrure tout seul chaque mois (la **rotation**).

    Dans cette leçon, vous allez créer et lire un secret en CLI et en Python (boto3), écrire une politique
    IAM au plus juste, activer la rotation automatique, et comparer Secrets Manager à Parameter Store.
  en: |
    On AWS, two services keep your secrets instead of a `.env` file: **AWS Secrets Manager** and **SSM
    Parameter Store**. Instead of shipping a password with the application, the application asks the service
    for it at startup, proving its identity via **IAM** — and every access is logged by CloudTrail.

    Picture a secure key dispenser in the company lobby. You do not keep the server key in your pocket: you
    present your badge (the IAM role), the dispenser checks you are allowed (the **IAM policy**), hands you
    the key for that specific door, and records the loan in a register. Secrets Manager can even change the
    lock itself every month (the **rotation**).

    In this lesson you will create and read a secret in the CLI and in Python (boto3), write a tightly
    scoped IAM policy, enable automatic rotation, and compare Secrets Manager to Parameter Store.

sections:
  - heading:
      fr: "Secrets Manager vs Parameter Store : lequel choisir ?"
      en: "Secrets Manager vs Parameter Store: which to choose?"
    body:
      fr: |
        Les deux services stockent des valeurs chiffrées (par **KMS**) et contrôlent l'accès par IAM. Ils se
        ressemblent, mais ne visent pas le même usage.

        | Critère | Secrets Manager | Parameter Store (SecureString) |
        |---|---|---|
        | Rotation automatique native | Oui (via Lambda) | Non (à coder soi-même) |
        | Coût | Payant par secret et par appel | Standard gratuit, Advanced payant |
        | Taille max | 64 Ko | 4 Ko (std) / 8 Ko (advanced) |
        | Réplication multi-région | Intégrée | Manuelle |
        | Cas d'usage idéal | Mots de passe de base de données, rotation | Configuration, petits secrets, budget serré |

        La règle simple : si vous avez besoin de **rotation automatique** (typiquement un mot de passe de
        base de données), prenez **Secrets Manager**. Pour de la configuration et de petits secrets sans
        rotation, **Parameter Store** en `SecureString` suffit et coûte moins cher. Les deux se lisent de la
        même façon en boto3, et tous deux chiffrent au repos avec une clé KMS.
      en: |
        Both services store encrypted values (via **KMS**) and control access with IAM. They look alike but
        do not target the same use.

        | Criterion | Secrets Manager | Parameter Store (SecureString) |
        |---|---|---|
        | Native automatic rotation | Yes (via Lambda) | No (code it yourself) |
        | Cost | Paid per secret and per call | Standard free, Advanced paid |
        | Max size | 64 KB | 4 KB (std) / 8 KB (advanced) |
        | Multi-region replication | Built in | Manual |
        | Ideal use case | Database passwords, rotation | Configuration, small secrets, tight budget |

        The simple rule: if you need **automatic rotation** (typically a database password), use **Secrets
        Manager**. For configuration and small secrets without rotation, **Parameter Store** as a
        `SecureString` is enough and costs less. Both are read the same way in boto3, and both encrypt at
        rest with a KMS key.
  - heading:
      fr: "IAM au plus juste : le piège du wildcard"
      en: "Tightly scoped IAM: the wildcard trap"
    body:
      fr: |
        Un secret bien gardé derrière une politique trop large ne vaut rien. L'erreur la plus répandue :
        accorder `secretsmanager:*` sur `Resource: "*"`. Cela donne à l'application le droit de **lire tous
        les secrets du compte**, et même de les supprimer ou d'en créer.

        La bonne politique applique le **moindre privilège** sur trois axes :

        - **Action** : seulement ce qui est nécessaire, souvent `secretsmanager:GetSecretValue` seul pour un
          consommateur.
        - **Resource** : l'ARN précis du secret, pas `*`. On peut utiliser un préfixe
          (`...:secret:prod/app/*`) pour un groupe cohérent.
        - **Condition** : par exemple restreindre à une région, exiger `aws:MultiFactorAuthPresent`, ou
          limiter à certaines balises.

        Comme un secret est chiffré par KMS, l'application a aussi besoin de `kms:Decrypt` sur la **clé**
        utilisée — autre endroit où limiter à l'ARN de la clé plutôt qu'à `*`. Outil utile : **IAM Access
        Analyzer** signale les politiques qui exposent un secret plus largement que prévu (accès
        inter-comptes, public).
      en: |
        A secret well kept behind an overly broad policy is worthless. The most widespread mistake: granting
        `secretsmanager:*` on `Resource: "*"`. That gives the application the right to **read every secret
        in the account**, and even to delete them or create new ones.

        A good policy applies **least privilege** on three axes:

        - **Action**: only what is needed, often `secretsmanager:GetSecretValue` alone for a consumer.
        - **Resource**: the exact ARN of the secret, not `*`. You can use a prefix (`...:secret:prod/app/*`)
          for a coherent group.
        - **Condition**: for example restrict to a region, require `aws:MultiFactorAuthPresent`, or limit to
          certain tags.

        Since a secret is encrypted by KMS, the application also needs `kms:Decrypt` on the **key** used —
        another place to limit to the key ARN rather than `*`. A useful tool: **IAM Access Analyzer** flags
        policies that expose a secret more broadly than intended (cross-account, public access).

examples:
  - title:
      fr: "Créer et lire un secret en CLI"
      en: "Creating and reading a secret in the CLI"
    file: secret-cli.sh
    lang: bash
    kind: secure
    code: |
      # Create a secret. The value is encrypted at rest with a KMS key.
      aws secretsmanager create-secret \
        --name prod/app/db \
        --description "Production app database credentials" \
        --secret-string '{"username":"app_user","password":"changeme-in-vault"}'

      # Read it back (the value travels over TLS, never written to disk here)
      aws secretsmanager get-secret-value \
        --secret-id prod/app/db \
        --query SecretString --output text

      # Update (new version) without changing the name/ARN
      aws secretsmanager put-secret-value \
        --secret-id prod/app/db \
        --secret-string '{"username":"app_user","password":"rotated-value-2"}'
    output: |
      {
        "ARN": "arn:aws:secretsmanager:eu-west-1:123456789012:secret:prod/app/db-AbCdEf",
        "Name": "prod/app/db",
        "VersionId": "11111111-2222-3333-4444-555555555555"
      }
      {"username":"app_user","password":"changeme-in-vault"}
    note:
      fr: "Le secret est chiffré par KMS et chaque `put-secret-value` crée une nouvelle version sans changer l'ARN. CloudTrail journalise chaque `GetSecretValue` : on sait qui a lu le secret et quand."
      en: "The secret is encrypted by KMS and each `put-secret-value` creates a new version without changing the ARN. CloudTrail logs every `GetSecretValue`: you know who read the secret and when."

  - title:
      fr: "Une politique IAM trop large : à éviter"
      en: "An overly broad IAM policy: to avoid"
    file: policy-wildcard.json
    lang: json
    kind: vulnerable
    code: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "ReadEverySecret",
            "Effect": "Allow",
            "Action": "secretsmanager:*",
            "Resource": "*"
          }
        ]
      }
    note:
      fr: "`secretsmanager:*` sur `Resource: \"*\"` laisse l'application lire, modifier et supprimer **tous** les secrets du compte. Une seule application compromise expose alors l'ensemble des secrets. C'est l'anti-pattern n°1."
      en: "`secretsmanager:*` on `Resource: \"*\"` lets the application read, modify and delete **every** secret in the account. A single compromised application then exposes all secrets. This is the #1 anti-pattern."

  - title:
      fr: "La même politique, au plus juste"
      en: "The same policy, tightly scoped"
    file: policy-scoped.json
    lang: json
    kind: secure
    code: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "ReadOneSecretOnly",
            "Effect": "Allow",
            "Action": "secretsmanager:GetSecretValue",
            "Resource": "arn:aws:secretsmanager:eu-west-1:123456789012:secret:prod/app/db-*",
            "Condition": {
              "StringEquals": { "aws:RequestedRegion": "eu-west-1" }
            }
          },
          {
            "Sid": "DecryptWithTheSecretsKeyOnly",
            "Effect": "Allow",
            "Action": "kms:Decrypt",
            "Resource": "arn:aws:kms:eu-west-1:123456789012:key/22222222-3333-4444-5555-666666666666"
          }
        ]
      }
    note:
      fr: "Trois restrictions : seule l'action `GetSecretValue`, l'ARN précis du secret (le suffixe `-*` couvre l'identifiant aléatoire), une condition de région, et `kms:Decrypt` limité à la bonne clé. L'application lit son secret, rien d'autre."
      en: "Three restrictions: only the `GetSecretValue` action, the exact secret ARN (the `-*` suffix covers the random id), a region condition, and `kms:Decrypt` limited to the right key. The application reads its secret and nothing else."

  - title:
      fr: "Lire le secret en Python avec boto3"
      en: "Reading the secret in Python with boto3"
    file: read_secret.py
    lang: python
    kind: secure
    code: |
      import json
      import boto3  # credentials come from the instance/role, never hard-coded

      def get_db_credentials(secret_id="prod/app/db", region="eu-west-1"):
          client = boto3.client("secretsmanager", region_name=region)
          # IAM decides whether this call is allowed; CloudTrail records it.
          resp = client.get_secret_value(SecretId=secret_id)
          # Secret stored as JSON; parse it into a dict
          return json.loads(resp["SecretString"])

      creds = get_db_credentials()
      # Never print the password; confirm only that it was retrieved
      print("Loaded DB user:", creds["username"], "(password retrieved)")
    output: |
      Loaded DB user: app_user (password retrieved)
    note:
      fr: "boto3 utilise automatiquement le rôle IAM de l'instance/du conteneur : aucune clé d'accès dans le code. Le secret est récupéré à chaque démarrage, jamais stocké sur disque. On n'affiche jamais le mot de passe."
      en: "boto3 automatically uses the IAM role of the instance/container: no access key in the code. The secret is fetched on each startup, never stored on disk. You never print the password."

  - title:
      fr: "Activer la rotation automatique"
      en: "Enabling automatic rotation"
    file: rotate.sh
    lang: bash
    kind: secure
    code: |
      # Secrets Manager rotates by invoking a Lambda that generates a new value
      # and updates both the secret AND the target (e.g. the database user).
      aws secretsmanager rotate-secret \
        --secret-id prod/app/db \
        --rotation-lambda-arn arn:aws:lambda:eu-west-1:123456789012:function:SecretsRotation \
        --rotation-rules '{"AutomaticallyAfterDays":30}'

      # Trigger an immediate rotation to test the Lambda works end to end
      aws secretsmanager rotate-secret --secret-id prod/app/db

      # Confirm rotation is enabled and see the schedule
      aws secretsmanager describe-secret --secret-id prod/app/db \
        --query '{Rotation:RotationEnabled, LastRotated:LastRotatedDate}'
    output: |
      {
        "Rotation": true,
        "LastRotated": "2026-11-27T09:40:12+00:00"
      }
    note:
      fr: "La rotation change la valeur tous les 30 jours sans intervention : la Lambda met à jour le secret et le mot de passe réel de la base. Les applications relisent simplement le secret et obtiennent la nouvelle valeur. C'est le principal atout de Secrets Manager sur Parameter Store."
      en: "Rotation changes the value every 30 days with no intervention: the Lambda updates both the secret and the real database password. Applications simply re-read the secret and get the new value. This is Secrets Manager's main edge over Parameter Store."

mistake:
  fr: |
    **Accorder `secretsmanager:*` sur `Resource: "*"` (et oublier `kms:Decrypt` restreint).**

    C'est l'erreur qui annule tout le bénéfice du service. Une politique large transforme chaque
    application en porte d'entrée vers **l'ensemble** des secrets du compte. Restreignez toujours l'action à
    `GetSecretValue` pour un simple consommateur, et la ressource à l'ARN précis du secret (ou à un préfixe
    cohérent).

    Un second piège, plus subtil : oublier que le secret est chiffré par KMS. Si la politique autorise
    `GetSecretValue` mais pas `kms:Decrypt` sur la clé, l'appel échoue avec `AccessDeniedException` côté
    KMS, ce qui déroute. À l'inverse, accorder `kms:Decrypt` sur `*` redonne un accès trop large. Enfin, ne
    pas **tester** la Lambda de rotation avant de l'activer en production peut casser l'application le jour
    où le mot de passe change sans que la base soit mise à jour.
  en: |
    **Granting `secretsmanager:*` on `Resource: "*"` (and forgetting a restricted `kms:Decrypt`).**

    This is the mistake that cancels the whole benefit of the service. A broad policy turns every
    application into a doorway to **all** the account's secrets. Always restrict the action to
    `GetSecretValue` for a plain consumer, and the resource to the exact secret ARN (or a coherent prefix).

    A second, subtler trap: forgetting that the secret is encrypted by KMS. If the policy allows
    `GetSecretValue` but not `kms:Decrypt` on the key, the call fails with a KMS `AccessDeniedException`,
    which is confusing. Conversely, granting `kms:Decrypt` on `*` hands back too much access. Finally, not
    **testing** the rotation Lambda before enabling it in production can break the application the day the
    password changes without the database being updated.

bestPractice:
  fr: |
    - **Choisissez le bon service** : Secrets Manager si vous avez besoin de rotation ; Parameter Store (SecureString) pour la configuration et les petits secrets.
    - **Moindre privilège IAM** : action `GetSecretValue` seule, ressource = ARN précis du secret, jamais `*`.
    - **N'oubliez pas `kms:Decrypt`** sur la clé du secret, elle aussi restreinte à l'ARN de la clé.
    - **Ajoutez des conditions** (région, MFA, balises) pour réduire encore la portée.
    - **Activez et testez la rotation** avant la production ; déclenchez une rotation manuelle pour valider la Lambda.
    - **Lisez le secret au démarrage avec boto3** via le rôle IAM ; ne le stockez jamais sur disque.
    - **Vérifiez l'exposition avec IAM Access Analyzer** et surveillez les accès via CloudTrail.
  en: |
    - **Choose the right service**: Secrets Manager if you need rotation; Parameter Store (SecureString) for configuration and small secrets.
    - **IAM least privilege**: `GetSecretValue` action alone, resource = exact secret ARN, never `*`.
    - **Do not forget `kms:Decrypt`** on the secret's key, also restricted to the key ARN.
    - **Add conditions** (region, MFA, tags) to narrow the scope further.
    - **Enable and test rotation** before production; trigger a manual rotation to validate the Lambda.
    - **Read the secret at startup with boto3** via the IAM role; never store it on disk.
    - **Check exposure with IAM Access Analyzer** and monitor access via CloudTrail.

exercise:
  statement:
    fr: |
      Une application de production ne doit faire qu'une chose avec les secrets : **lire** le secret
      `prod/payments/stripe` dans la région `eu-west-1`, lui-même chiffré par la clé KMS
      `arn:aws:kms:eu-west-1:123456789012:key/abc`.

      Écrivez la politique IAM JSON au plus juste qui autorise exactement cela :

      1. uniquement l'action de lecture du secret ;
      2. uniquement l'ARN de ce secret (pensez au suffixe aléatoire) ;
      3. le déchiffrement KMS limité à la bonne clé ;
      4. une condition restreignant à la région `eu-west-1`.
    en: |
      A production application must do only one thing with secrets: **read** the `prod/payments/stripe`
      secret in region `eu-west-1`, itself encrypted by the KMS key
      `arn:aws:kms:eu-west-1:123456789012:key/abc`.

      Write the tightly scoped IAM JSON policy that allows exactly that:

      1. only the secret-read action;
      2. only that secret's ARN (mind the random suffix);
      3. KMS decryption limited to the right key;
      4. a condition restricting to the `eu-west-1` region.
  solution:
    file: solution.json
    lang: json
    code: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "ReadStripeSecret",
            "Effect": "Allow",
            "Action": "secretsmanager:GetSecretValue",
            "Resource": "arn:aws:secretsmanager:eu-west-1:123456789012:secret:prod/payments/stripe-*",
            "Condition": {
              "StringEquals": { "aws:RequestedRegion": "eu-west-1" }
            }
          },
          {
            "Sid": "DecryptStripeKey",
            "Effect": "Allow",
            "Action": "kms:Decrypt",
            "Resource": "arn:aws:kms:eu-west-1:123456789012:key/abc"
          }
        ]
      }
    note:
      fr: "Le suffixe `-*` sur l'ARN du secret est nécessaire car Secrets Manager ajoute un identifiant aléatoire (`-AbCdEf`). Sans la permission `kms:Decrypt` sur la clé `.../key/abc`, la lecture échouerait malgré le droit `GetSecretValue`."
      en: "The `-*` suffix on the secret ARN is needed because Secrets Manager appends a random id (`-AbCdEf`). Without the `kms:Decrypt` permission on the `.../key/abc` key, the read would fail despite the `GetSecretValue` right."

quiz:
  - q:
      fr: "Quand choisir AWS Secrets Manager plutôt que Parameter Store ?"
      en: "When should you choose AWS Secrets Manager over Parameter Store?"
    options:
      fr:
        - "Quand on a besoin de rotation automatique native des secrets"
        - "Quand on veut la solution la moins chère pour de la configuration"
        - "Quand on stocke uniquement des valeurs publiques"
        - "Quand on refuse d'utiliser IAM"
      en:
        - "When you need native automatic secret rotation"
        - "When you want the cheapest option for configuration"
        - "When you store only public values"
        - "When you refuse to use IAM"
    answer: 0
    why:
      fr: "Secrets Manager offre la rotation automatique via Lambda, idéale pour les mots de passe de base de données. Pour de la configuration sans rotation, Parameter Store suffit et coûte moins cher."
      en: "Secrets Manager offers automatic rotation via Lambda, ideal for database passwords. For configuration without rotation, Parameter Store is enough and cheaper."
  - q:
      fr: "Pourquoi une politique `secretsmanager:*` sur `Resource: \"*\"` est-elle dangereuse ?"
      en: "Why is a `secretsmanager:*` on `Resource: \"*\"` policy dangerous?"
    options:
      fr:
        - "Elle ralentit les appels API"
        - "Elle empêche la rotation"
        - "Elle autorise l'application à lire, modifier et supprimer tous les secrets du compte"
        - "Elle désactive le chiffrement KMS"
      en:
        - "It slows down API calls"
        - "It prevents rotation"
        - "It lets the application read, modify and delete every secret in the account"
        - "It disables KMS encryption"
    answer: 2
    why:
      fr: "Le wildcard donne un accès total à tous les secrets. Une application compromise expose alors l'ensemble. On restreint l'action à `GetSecretValue` et la ressource à l'ARN précis."
      en: "The wildcard grants full access to every secret. A compromised application then exposes them all. You restrict the action to `GetSecretValue` and the resource to the exact ARN."
  - q:
      fr: "Pourquoi une application peut-elle recevoir un `AccessDenied` de KMS alors qu'elle a `GetSecretValue` ?"
      en: "Why can an application get a KMS `AccessDenied` even though it has `GetSecretValue`?"
    options:
      fr:
        - "Parce que KMS est toujours payant"
        - "Parce que le secret est chiffré par KMS et qu'il manque la permission `kms:Decrypt` sur la clé"
        - "Parce que le secret est trop grand"
        - "Parce que la rotation est désactivée"
      en:
        - "Because KMS is always paid"
        - "Because the secret is encrypted by KMS and the `kms:Decrypt` permission on the key is missing"
        - "Because the secret is too large"
        - "Because rotation is disabled"
    answer: 1
    why:
      fr: "Lire un secret chiffré nécessite aussi `kms:Decrypt` sur la clé utilisée. Sans elle, Secrets Manager autorise l'accès mais KMS refuse le déchiffrement."
      en: "Reading an encrypted secret also needs `kms:Decrypt` on the key used. Without it, Secrets Manager allows access but KMS refuses the decryption."
  - q:
      fr: "Comment une application boto3 sur AWS devrait-elle s'authentifier pour lire un secret ?"
      en: "How should a boto3 application on AWS authenticate to read a secret?"
    options:
      fr:
        - "Avec des clés d'accès codées en dur dans le script"
        - "Via le rôle IAM de l'instance ou du conteneur, sans clé dans le code"
        - "Avec le mot de passe root du compte AWS"
        - "Sans aucune authentification"
      en:
        - "With access keys hard-coded in the script"
        - "Via the IAM role of the instance or container, with no key in the code"
        - "With the AWS account root password"
        - "With no authentication at all"
    answer: 1
    why:
      fr: "boto3 récupère automatiquement les identifiants du rôle IAM attaché à l'instance/au conteneur. Aucune clé d'accès statique ne traîne dans le code, et CloudTrail journalise l'accès."
      en: "boto3 automatically picks up the credentials of the IAM role attached to the instance/container. No static access key lingers in the code, and CloudTrail logs the access."
  - q:
      fr: "Quel outil AWS signale qu'une politique expose un secret plus largement que prévu ?"
      en: "Which AWS tool flags that a policy exposes a secret more broadly than intended?"
    options:
      fr:
        - "IAM Access Analyzer"
        - "Amazon S3"
        - "AWS Lambda"
        - "Route 53"
      en:
        - "IAM Access Analyzer"
        - "Amazon S3"
        - "AWS Lambda"
        - "Route 53"
    answer: 0
    why:
      fr: "IAM Access Analyzer détecte les accès inattendus (inter-comptes, publics) et aide à resserrer les politiques. CloudTrail, lui, journalise chaque accès effectif au secret."
      en: "IAM Access Analyzer detects unexpected access (cross-account, public) and helps tighten policies. CloudTrail, in turn, logs every actual access to the secret."
