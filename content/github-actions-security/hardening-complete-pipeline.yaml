    why:
      fr: "Par défaut, checkout laisse un jeton sur le disque, exploitable par une étape ultérieure. Le désactiver retire cette surface d'attaque quand on n'a pas besoin de pousser."
      en: "By default, checkout leaves a token on disk, usable by a later step. Disabling it removes this attack surface when you do not need to push."
  - q:
      fr: "À quoi sert `step-security/harden-runner` dans un job ?"
      en: "What is `step-security/harden-runner` for in a job?"
    options:
      fr:
        - "À accélérer le téléchargement des dépendances"
        - "À surveiller et bloquer les appels réseau sortants du runner"
        - "À signer automatiquement les commits"
        - "À créer une matrice de versions"
      en:
        - "To speed up dependency downloads"
        - "To watch and block the runner's outbound network calls"
        - "To sign commits automatically"
        - "To create a version matrix"
    answer: 1
    why:
      fr: "`harden-runner` observe (ou bloque) le trafic sortant : si une dépendance compromise tente d'exfiltrer des secrets vers un domaine inconnu, elle est stoppée et vous êtes alerté."
      en: "`harden-runner` observes (or blocks) outbound traffic: if a compromised dependency tries to exfiltrate secrets to an unknown domain, it is stopped and you are alerted."
