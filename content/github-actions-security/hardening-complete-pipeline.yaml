        - "Il désactive le cache des dépendances"
        - "Il supprime l'historique Git"
        - "Il chiffre le dépôt"
      en:
        - "It prevents leaving the Git token on the runner's disk"
        - "It disables the dependency cache"
        - "It removes the Git history"
        - "It encrypts the repo"
