description:
  fr: "Ajouter au workflow le scan de secrets (Gitleaks) et le scan de dépendances : dependency-review-action, pip-audit, npm audit et Trivy en mode filesystem."
  en: "Add secret scanning (Gitleaks) and dependency scanning to the workflow: dependency-review-action, pip-audit, npm audit and Trivy in filesystem mode."
duration: 25

intro:
  fr: |
    Le SAST lit **votre** code. Mais une application moderne est faite à 80 % de code que vous n'avez pas
    écrit : des **dépendances** tierces. Une faille dans l'une d'elles est votre faille. De plus, malgré
    les hooks et `.gitignore`, un **secret** peut toujours se glisser dans un commit. Ce job couvre ces deux
    angles morts.

    Imaginez un plat cuisiné : vous maîtrisez votre recette (le SAST), mais les ingrédients viennent de
    fournisseurs extérieurs. Si l'un d'eux est rappelé pour contamination, votre plat est dangereux, même
    parfaitement préparé. Le **SCA** (*Software Composition Analysis*, analyse de composition logicielle)
    vérifie justement la « liste des ingrédients » face aux rappels connus (les **CVE**).

    Dans cette leçon, vous ajoutez deux familles de contrôles à votre pipeline : le **scan de secrets**
    avec Gitleaks (vu au cours Secure Git, ici en CI), et le **SCA** avec plusieurs outils complémentaires :
    `dependency-review-action` (sur les PR), `pip-audit` et `npm audit` (par écosystème), et **Trivy** en
    mode *filesystem* qui scanne à la fois les dépendances et les fichiers.
  en: |
    SAST reads **your** code. But a modern application is 80% code you did not write: third-party
    **dependencies**. A flaw in one of them is your flaw. And despite hooks and `.gitignore`, a **secret**
    can always slip into a commit. This job covers both blind spots.

    Picture a ready meal: you master your recipe (SAST), but the ingredients come from outside suppliers.
    If one is recalled for contamination, your meal is dangerous, however perfectly prepared. **SCA**
    (*Software Composition Analysis*) checks exactly that "ingredient list" against known recalls (the
    **CVEs**).

    In this lesson you add two families of checks to your pipeline: **secret scanning** with Gitleaks (seen
    in the Secure Git course, here in CI), and **SCA** with several complementary tools:
    `dependency-review-action` (on PRs), `pip-audit` and `npm audit` (per ecosystem), and **Trivy** in
    *filesystem* mode which scans both dependencies and files.

sections:
  - heading:
      fr: "Scan de secrets en CI : le filet non contournable"
      en: "Secret scanning in CI: the non-bypassable net"
    body:
      fr: |
        Vous avez vu Gitleaks en pre-commit. Rappel essentiel : un hook local est **contournable**
        (`--no-verify`, hook non installé). Le même scan rejoué en CI, sur le serveur, est la vraie
        barrière : un développeur ne peut pas la sauter, et elle bloque la pull request.

        L'action officielle `gitleaks/gitleaks-action@v2` scanne l'historique à chaque PR. Un point
        important : il faut récupérer **tout l'historique** avec `fetch-depth: 0`, sinon le scan ne voit
        que le dernier commit et manque un secret ajouté puis « corrigé » dans la même branche.

        ```yaml
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0   # full history, so no leak hides in an older commit
        - uses: gitleaks/gitleaks-action@v2
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ```

        L'action renvoie un code non nul si elle trouve une fuite : le job échoue, la fusion est bloquée.
        C'est le complément serveur indispensable du hook pre-commit.
      en: |
        You saw Gitleaks in pre-commit. Essential reminder: a local hook is **bypassable** (`--no-verify`,
        hook not installed). The same scan replayed in CI, on the server, is the real barrier: a developer
        cannot skip it, and it blocks the pull request.

        The official `gitleaks/gitleaks-action@v2` scans the history on every PR. One important point: you
        must fetch the **whole history** with `fetch-depth: 0`, otherwise the scan only sees the last commit
        and misses a secret added then "fixed" in the same branch.

        ```yaml
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0   # full history, so no leak hides in an older commit
        - uses: gitleaks/gitleaks-action@v2
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ```

        The action returns a non-zero code if it finds a leak: the job fails, the merge is blocked. It is
        the indispensable server-side complement of the pre-commit hook.
  - heading:
      fr: "SCA : vos dépendances face aux CVE"
      en: "SCA: your dependencies against the CVEs"
    body:
      fr: |
        Une **CVE** (*Common Vulnerabilities and Exposures*) est un identifiant public de vulnérabilité
        (`CVE-2024-12345`). Les outils de SCA comparent vos dépendances à des bases de CVE et signalent
        celles qui sont vulnérables, avec leur gravité et, souvent, la version qui corrige.

        Plusieurs outils cohabitent, chacun avec son angle :

        | Outil | Portée | Particularité |
        |---|---|---|
        | `dependency-review-action` | Sur une **PR** | Compare l'avant/après : signale les nouvelles deps vulnérables |
        | `pip-audit` | Python | Scanne `requirements.txt` / l'environnement installé |
        | `npm audit` | Node | Scanne `package-lock.json` |
        | **Trivy** (fs) | Multi-écosystèmes + fichiers | Un seul outil pour tout le dépôt |

        `dependency-review-action` est spécifique aux pull requests : il regarde **ce que la PR ajoute** et
        peut bloquer si elle introduit une dépendance vulnérable au-delà d'un seuil de gravité. Les autres
        scannent l'état complet du projet. En combinant « revue sur la PR » et « scan complet planifié », on
        attrape les failles **nouvelles** (PR) comme celles **découvertes après coup** (une CVE publiée
        aujourd'hui sur une dépendance figée depuis six mois).
      en: |
        A **CVE** (*Common Vulnerabilities and Exposures*) is a public vulnerability identifier
        (`CVE-2024-12345`). SCA tools compare your dependencies against CVE databases and flag the
        vulnerable ones, with their severity and often the fixing version.

        Several tools coexist, each with its angle:

        | Tool | Scope | Specificity |
        |---|---|---|
        | `dependency-review-action` | On a **PR** | Compares before/after: flags new vulnerable deps |
        | `pip-audit` | Python | Scans `requirements.txt` / the installed env |
        | `npm audit` | Node | Scans `package-lock.json` |
        | **Trivy** (fs) | Multi-ecosystem + files | One tool for the whole repo |

        `dependency-review-action` is PR-specific: it looks at **what the PR adds** and can block if it
        introduces a vulnerable dependency above a severity threshold. The others scan the full project
        state. By combining "review on the PR" and "scheduled full scan", you catch **new** flaws (PR) as
        well as those **discovered later** (a CVE published today on a dependency frozen for six months).
  - heading:
      fr: "Trivy en mode filesystem"
      en: "Trivy in filesystem mode"
    body:
      fr: |
        **Trivy** (par Aqua Security) est un scanner polyvalent. En mode **`fs`** (*filesystem*), il analyse
        un dossier et détecte d'un coup : les dépendances vulnérables (tous écosystèmes), les secrets, et
        les erreurs de configuration. C'est souvent le premier outil qu'on ajoute car il couvre beaucoup
        avec une seule étape. (Il scanne aussi les **images** de conteneurs, sujet de la leçon suivante.)

        L'action `aquasecurity/trivy-action` se règle avec deux options clés pour la sécurité :

        - **`severity`** : limite aux gravités qui comptent, par exemple `HIGH,CRITICAL`.
        - **`exit-code: 1`** : fait **échouer** le job quand une vulnérabilité de ce niveau est trouvée
          (par défaut Trivy renvoie 0, donc le job reste vert même s'il trouve des failles).

        ```yaml
        - uses: aquasecurity/trivy-action@0.28.0
          with:
            scan-type: fs
            scan-ref: .
            severity: HIGH,CRITICAL
            exit-code: "1"           # fail the build on HIGH/CRITICAL findings
        ```

        Sans `exit-code: 1`, Trivy affiche un joli tableau mais ne bloque rien : c'est l'erreur classique.
        On peut aussi produire du SARIF (`format: sarif`) pour remonter les résultats dans l'onglet Security,
        comme pour le SAST.
      en: |
        **Trivy** (by Aqua Security) is a versatile scanner. In **`fs`** (*filesystem*) mode, it analyses a
        folder and detects at once: vulnerable dependencies (all ecosystems), secrets, and misconfigurations.
        It is often the first tool you add because it covers a lot in a single step. (It also scans
        container **images**, the topic of the next lesson.)

        The `aquasecurity/trivy-action` is tuned with two key security options:

        - **`severity`**: limits to the severities that matter, for example `HIGH,CRITICAL`.
        - **`exit-code: 1`**: makes the job **fail** when a vulnerability of that level is found (by default
          Trivy returns 0, so the job stays green even when it finds flaws).

        ```yaml
        - uses: aquasecurity/trivy-action@0.28.0
          with:
            scan-type: fs
            scan-ref: .
            severity: HIGH,CRITICAL
            exit-code: "1"           # fail the build on HIGH/CRITICAL findings
        ```

        Without `exit-code: 1`, Trivy prints a nice table but blocks nothing: that is the classic mistake.
        You can also produce SARIF (`format: sarif`) to upload results to the Security tab, as for SAST.

examples:
  - title:
      fr: "Scan de secrets en CI sur tout l'historique"
      en: "Secret scanning in CI over the whole history"
    file: .github/workflows/secrets.yml
    lang: yaml
    kind: secure
    code: |
      name: secret-scan
      on: [pull_request]

      permissions:
        contents: read

      jobs:
        gitleaks:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 0   # full history: catch a secret added then removed
            - name: Scan for hard-coded secrets
              uses: gitleaks/gitleaks-action@v2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    note:
      fr: "`fetch-depth: 0` est crucial : sans l'historique complet, un secret commité puis retiré dans la même branche passerait inaperçu. Ce scan serveur ne peut pas être contourné par `--no-verify`, contrairement au hook local."
      en: "`fetch-depth: 0` is crucial: without the full history, a secret committed then removed in the same branch would go unnoticed. This server scan cannot be bypassed with `--no-verify`, unlike the local hook."

  - title:
      fr: "Revue des dépendances d'une pull request"
      en: "Dependency review of a pull request"
    file: .github/workflows/dep-review.yml
    lang: yaml
    kind: secure
    code: |
      name: dependency-review
      on: [pull_request]

      permissions:
        contents: read
        pull-requests: write   # to post the summary comment on the PR

      jobs:
        review:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - name: Review newly introduced dependencies
              uses: actions/dependency-review-action@v4
              with:
                # Fail the PR if it introduces a high (or worse) vulnerable dep
                fail-on-severity: high
                comment-summary-in-pr: always
    note:
      fr: "`dependency-review-action` compare l'avant/après de la PR : il ne regarde que les dépendances **ajoutées ou modifiées**. `fail-on-severity: high` bloque la fusion si la PR introduit une faille de gravité élevée. Il complète un scan complet planifié qui, lui, attrape les CVE publiées après coup."
      en: "`dependency-review-action` compares the PR's before/after: it only looks at **added or changed** dependencies. `fail-on-severity: high` blocks the merge if the PR introduces a high-severity flaw. It complements a scheduled full scan that catches CVEs published later."

  - title:
      fr: "pip-audit et npm audit par écosystème"
      en: "pip-audit and npm audit per ecosystem"
    file: .github/workflows/sca.yml
    lang: yaml
    kind: secure
    code: |
      name: sca
      on:
        pull_request:
        schedule:
          - cron: "0 7 * * *"   # daily: catch CVEs published after the last commit

      permissions:
        contents: read

      jobs:
        python:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            - name: Audit Python dependencies
              # pip-audit exits non-zero when a known CVE is found
              run: |
                pip install pip-audit
                pip-audit -r requirements.txt

        node:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: "20"
            - name: Audit Node dependencies
              # --audit-level=high fails only on high/critical advisories
              run: npm audit --audit-level=high
    note:
      fr: "Chaque écosystème a son outil dédié : `pip-audit` pour Python, `npm audit` pour Node. Le `schedule` quotidien est essentiel : une CVE peut être publiée demain sur une dépendance qui n'a pas bougé, et seul un re-scan régulier la détecte."
      en: "Each ecosystem has its dedicated tool: `pip-audit` for Python, `npm audit` for Node. The daily `schedule` is essential: a CVE may be published tomorrow on a dependency that has not changed, and only a regular re-scan detects it."

  - title:
      fr: "Trivy filesystem : échouer sur HIGH et CRITICAL"
      en: "Trivy filesystem: fail on HIGH and CRITICAL"
    file: .github/workflows/trivy-fs.yml
    lang: yaml
    kind: secure
    code: |
      name: trivy-fs
      on: [pull_request]

      permissions:
        contents: read
        security-events: write   # to upload the SARIF report

      jobs:
        trivy:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - name: Scan dependencies and files with Trivy
              uses: aquasecurity/trivy-action@0.28.0
              with:
                scan-type: fs
                scan-ref: .
                severity: HIGH,CRITICAL   # ignore low noise, focus on what matters
                exit-code: "1"            # WITHOUT this, Trivy never fails the job
                format: sarif
                output: trivy.sarif
            - name: Upload results to the Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              with:
                sarif_file: trivy.sarif
    note:
      fr: "`exit-code: \"1\"` est le réglage à ne pas oublier : par défaut Trivy renvoie 0 et le job reste vert malgré les failles. `severity: HIGH,CRITICAL` évite de noyer l'équipe sous les alertes mineures. Le SARIF remonte les résultats dans l'onglet Security."
      en: "`exit-code: \"1\"` is the setting not to forget: by default Trivy returns 0 and the job stays green despite the flaws. `severity: HIGH,CRITICAL` avoids drowning the team in minor alerts. The SARIF uploads the results to the Security tab."

mistake:
  fr: |
    **Oublier `exit-code: 1` sur Trivy, ou ne scanner que sur les pull requests.**

    Deux erreurs classiques du SCA. D'abord, sans `exit-code: 1`, Trivy (et bien d'autres) affiche les
    vulnérabilités mais renvoie 0 : le job reste vert et personne ne corrige. Le scanner devient
    décoratif. Ensuite, ne scanner que sur les PR laisse un angle mort énorme : une CVE publiée **après**
    la fusion, sur une dépendance qui n'a pas bougé, ne sera jamais détectée. Il faut un `schedule` régulier
    qui re-scanne le code figé face aux bases de CVE mises à jour.
  en: |
    **Forgetting `exit-code: 1` on Trivy, or only scanning on pull requests.**

    Two classic SCA mistakes. First, without `exit-code: 1`, Trivy (and many others) prints the
    vulnerabilities but returns 0: the job stays green and nobody fixes anything. The scanner becomes
    decorative. Second, scanning only on PRs leaves a huge blind spot: a CVE published **after** the merge,
    on a dependency that has not changed, is never detected. You need a regular `schedule` that re-scans
    the frozen code against the updated CVE databases.

bestPractice:
  fr: |
    - **Rejouez Gitleaks en CI** avec `fetch-depth: 0` : le filet serveur non contournable.
    - **Combinez revue sur PR** (`dependency-review-action`) **et scan complet planifié** (`schedule`).
    - **Mettez toujours `exit-code: 1`** sur Trivy, sinon il ne bloque rien.
    - **Filtrez sur `HIGH,CRITICAL`** pour un signal actionnable, pas un déluge d'alertes mineures.
    - **Remontez le SARIF** dans l'onglet Security pour centraliser les alertes SAST et SCA.
    - **Ajoutez un `schedule`** quotidien ou hebdomadaire : les CVE apparaissent après la fusion.
  en: |
    - **Replay Gitleaks in CI** with `fetch-depth: 0`: the non-bypassable server net.
    - **Combine PR review** (`dependency-review-action`) **and a scheduled full scan** (`schedule`).
    - **Always set `exit-code: 1`** on Trivy, otherwise it blocks nothing.
    - **Filter on `HIGH,CRITICAL`** for an actionable signal, not a flood of minor alerts.
    - **Upload the SARIF** to the Security tab to centralise SAST and SCA alerts.
    - **Add a daily or weekly `schedule`**: CVEs appear after the merge.

exercise:
  statement:
    fr: |
      Ajoutez à votre workflow un job **Trivy** en mode filesystem qui doit :

      1. se déclencher sur chaque **pull request** **et** une fois par jour (scan planifié) ;
      2. ne signaler que les vulnérabilités de gravité **HIGH** et **CRITICAL** ;
      3. **faire échouer** le job quand une telle vulnérabilité est trouvée.

      Expliquez en une phrase pourquoi le déclencheur planifié (`schedule`) est indispensable en plus des
      pull requests.
    en: |
      Add a **Trivy** filesystem job to your workflow that must:

      1. trigger on every **pull request** **and** once a day (scheduled scan);
      2. only report **HIGH** and **CRITICAL** severity vulnerabilities;
      3. **fail** the job when such a vulnerability is found.

      Explain in one sentence why the scheduled trigger (`schedule`) is indispensable on top of pull
      requests.
  solution:
    file: trivy-fs.yml
    lang: yaml
    code: |
      name: trivy-fs
      on:
        pull_request:
        schedule:
          - cron: "0 7 * * *"   # daily scan against updated CVE databases

      permissions:
        contents: read

      jobs:
        trivy:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: aquasecurity/trivy-action@0.28.0
              with:
                scan-type: fs
                scan-ref: .
                severity: HIGH,CRITICAL
                exit-code: "1"   # fail the job on HIGH/CRITICAL findings

      # Why schedule? A CVE can be published AFTER the merge, on a dependency
      # that has not changed; only a regular re-scan detects it.
    note:
      fr: "`exit-code: \"1\"` fait échouer le job ; `severity: HIGH,CRITICAL` filtre le bruit. Le `schedule` quotidien attrape les CVE publiées après la fusion : sans lui, une dépendance figée resterait éternellement « verte » même si une faille y est découverte demain."
      en: "`exit-code: \"1\"` fails the job; `severity: HIGH,CRITICAL` filters noise. The daily `schedule` catches CVEs published after the merge: without it, a frozen dependency would stay forever \"green\" even if a flaw is discovered in it tomorrow."

quiz:
  - q:
      fr: "Pourquoi utiliser `fetch-depth: 0` avant un scan de secrets en CI ?"
      en: "Why use `fetch-depth: 0` before a secret scan in CI?"
    options:
      fr:
        - "Pour récupérer tout l'historique et ne manquer aucun secret ancien"
        - "Pour accélérer le clonage"
        - "Pour chiffrer les secrets"
        - "Pour limiter le scan au dernier commit"
      en:
        - "To fetch the whole history and miss no old secret"
        - "To speed up cloning"
        - "To encrypt the secrets"
        - "To limit the scan to the last commit"
    answer: 0
    why:
      fr: "Sans l'historique complet, un secret ajouté puis retiré dans la même branche échappe au scan. `fetch-depth: 0` récupère tout."
      en: "Without the full history, a secret added then removed in the same branch escapes the scan. `fetch-depth: 0` fetches everything."
  - q:
      fr: "Que signifie SCA ?"
      en: "What does SCA stand for?"
    options:
      fr:
        - "Secure Code Analysis"
        - "Software Composition Analysis (analyse des dépendances)"
        - "Static Container Audit"
        - "Secret Capture Agent"
      en:
        - "Secure Code Analysis"
        - "Software Composition Analysis (dependency analysis)"
        - "Static Container Audit"
        - "Secret Capture Agent"
    answer: 1
    why:
      fr: "Le SCA analyse la composition logicielle, c'est-à-dire les dépendances tierces, face aux CVE connues."
      en: "SCA analyses the software composition, i.e. the third-party dependencies, against known CVEs."
  - q:
      fr: "Quel est le réglage Trivy à ne pas oublier pour bloquer le build ?"
      en: "Which Trivy setting must you not forget to block the build?"
    options:
      fr:
        - "`format: table`"
        - "`scan-type: fs`"
        - "`exit-code: 1`"
        - "`severity: LOW`"
      en:
        - "`format: table`"
        - "`scan-type: fs`"
        - "`exit-code: 1`"
        - "`severity: LOW`"
    answer: 2
    why:
      fr: "Par défaut Trivy renvoie 0 même en trouvant des failles. `exit-code: 1` fait échouer le job sur les gravités ciblées."
      en: "By default Trivy returns 0 even when it finds flaws. `exit-code: 1` fails the job on the targeted severities."
  - q:
      fr: "Quelle est la particularité de `dependency-review-action` ?"
      en: "What is the specificity of `dependency-review-action`?"
    options:
      fr:
        - "Il analyse le code source comme un SAST"
        - "Il scanne les images Docker"
        - "Il révoque les secrets exposés"
        - "Il compare l'avant/après d'une PR pour signaler les dépendances ajoutées vulnérables"
      en:
        - "It analyses the source code like a SAST"
        - "It scans Docker images"
        - "It revokes exposed secrets"
        - "It compares a PR's before/after to flag newly added vulnerable dependencies"
    answer: 3
    why:
      fr: "C'est une action spécifique aux pull requests : elle regarde ce que la PR ajoute et peut bloquer selon un seuil de gravité."
      en: "It is a PR-specific action: it looks at what the PR adds and can block based on a severity threshold."
  - q:
      fr: "Pourquoi ajouter un déclencheur `schedule` au scan de dépendances ?"
      en: "Why add a `schedule` trigger to the dependency scan?"
    options:
      fr:
        - "Pour détecter les CVE publiées après la fusion, sur du code figé"
        - "Pour réduire le nombre de jobs"
        - "Pour désactiver le scan sur les PR"
        - "Pour chiffrer les rapports"
      en:
        - "To detect CVEs published after the merge, on frozen code"
        - "To reduce the number of jobs"
        - "To disable the scan on PRs"
        - "To encrypt the reports"
    answer: 0
    why:
      fr: "Une CVE peut apparaître demain sur une dépendance qui n'a pas changé ; seul un re-scan régulier la trouve, car aucune PR ne la déclenche."
      en: "A CVE can appear tomorrow on an unchanged dependency; only a regular re-scan finds it, since no PR triggers it."
