description:
  fr: "Appliquer le moindre privilège dans GitHub Actions : permissions: minimales, environnements avec reviewers obligatoires et authentification OIDC vers AWS sans secret de longue durée."
  en: "Apply least privilege in GitHub Actions: minimal permissions:, environments with required reviewers, and OIDC authentication to AWS without long-lived secrets."
duration: 25

intro:
  fr: |
    Un workflow ne fait pas que lire du code : il peut écrire des commentaires, publier des artefacts,
    déployer en production. Chaque pouvoir qu'on lui donne est un pouvoir qu'un attaquant pourra détourner
    si une dépendance ou une action est compromise. Le principe de **moindre privilège** dit : ne donnez
    que ce qui est strictement nécessaire, rien de plus.

    Pensez à un trousseau de clés : donneriez-vous le passe-partout de tout l'immeuble à un livreur qui a
    juste besoin d'entrer dans le hall ? Un workflow, c'est pareil. Par défaut, le jeton automatique de
    GitHub (`GITHUB_TOKEN`) peut être trop permissif ; il faut le restreindre.

    Dans cette leçon, vous allez apprendre trois outils complémentaires : les **`permissions:`** qui
    limitent ce que le jeton du workflow peut faire, les **environnements** (*environments*) protégés par
    des **reviewers obligatoires** pour exiger une approbation humaine avant un déploiement, et l'**OIDC**
    (*OpenID Connect*) qui permet de s'authentifier auprès d'AWS **sans stocker** de clé d'accès de longue
    durée dans les secrets.
  en: |
    A workflow does more than read code: it can write comments, publish artefacts, deploy to production.
    Every power you grant it is a power an attacker can hijack if a dependency or an action is compromised.
    The **least privilege** principle says: grant only what is strictly necessary, nothing more.

    Think of a keyring: would you hand the master key to the whole building to a delivery person who only
    needs to enter the lobby? A workflow is the same. By default, GitHub's automatic token (`GITHUB_TOKEN`)
    can be too permissive; it must be restricted.

    In this lesson you will learn three complementary tools: **`permissions:`** which limit what the
    workflow token can do, **environments** protected by **required reviewers** to require human approval
    before a deployment, and **OIDC** (*OpenID Connect*) which lets you authenticate to AWS **without
    storing** a long-lived access key in the secrets.

sections:
  - heading:
      fr: "permissions: le moindre privilège du GITHUB_TOKEN"
      en: "permissions: least privilege for the GITHUB_TOKEN"
    body:
      fr: |
        À chaque exécution, GitHub fournit automatiquement un jeton temporaire, `GITHUB_TOKEN`, qui permet
        au workflow d'agir sur le dépôt (commenter une PR, pousser un paquet...). Ce jeton a des **scopes**
        (droits) que l'on contrôle avec la clé **`permissions:`**.

        La meilleure pratique est de **tout fermer par défaut**, puis d'ouvrir au cas par cas :

        ```yaml
        permissions:
          contents: read      # read the code; nothing else by default
        ```

        On peut déclarer `permissions:` au niveau du **workflow** (s'applique à tous les jobs) ou d'un
        **job** précis (plus fin). Les valeurs possibles pour chaque scope sont `read`, `write` ou `none`.

        | Scope | Exemple d'usage |
        |---|---|
        | `contents` | Lire/écrire le code et les releases |
        | `pull-requests` | Commenter ou modifier une pull request |
        | `id-token` | **Obligatoire pour OIDC** (voir plus bas) |
        | `packages` | Publier une image ou un paquet |
        | `security-events` | Envoyer des résultats SARIF (SAST) |

        Un `permissions:` vide ou `{}` retire **tous** les droits : le workflow ne peut plus rien écrire.
        C'est le point de départ idéal, qu'on élargit ensuite uniquement là où c'est nécessaire.
      en: |
        On every run, GitHub automatically provides a temporary token, `GITHUB_TOKEN`, that lets the
        workflow act on the repo (comment on a PR, push a package...). This token has **scopes**
        (permissions) you control with the **`permissions:`** key.

        The best practice is to **close everything by default**, then open case by case:

        ```yaml
        permissions:
          contents: read      # read the code; nothing else by default
        ```

        You can declare `permissions:` at the **workflow** level (applies to all jobs) or on a specific
        **job** (finer). Each scope can be `read`, `write` or `none`.

        | Scope | Example use |
        |---|---|
        | `contents` | Read/write the code and releases |
        | `pull-requests` | Comment on or edit a pull request |
        | `id-token` | **Required for OIDC** (see below) |
        | `packages` | Publish an image or a package |
        | `security-events` | Upload SARIF results (SAST) |

        An empty `permissions:` or `{}` removes **all** rights: the workflow can no longer write anything.
        That is the ideal starting point, widened afterwards only where necessary.
  - heading:
      fr: "Environnements et reviewers obligatoires"
      en: "Environments and required reviewers"
    body:
      fr: |
        Un **environnement** (`environment:`) représente une cible de déploiement nommée (`staging`,
        `production`). Au-delà du nom, un environnement peut porter des **règles de protection** :

        - **Required reviewers** : un déploiement vers cet environnement est **mis en pause** jusqu'à ce
          qu'une ou plusieurs personnes désignées l'approuvent manuellement. C'est un point de contrôle
          humain avant la production.
        - **Wait timer** : un délai imposé avant le déploiement.
        - **Deployment branches** : seuls certains branches/tags peuvent déployer vers cet environnement.
        - **Environment secrets** : des secrets qui n'existent **que** pour cet environnement, isolés des
          autres.

        ```yaml
        jobs:
          deploy:
            environment: production     # subject to production's protection rules
            runs-on: ubuntu-latest
            steps:
              - run: ./deploy.sh
        ```

        Quand un job cible `production`, GitHub suspend le workflow et attend l'approbation des reviewers
        définis dans les réglages de l'environnement. L'intérêt pour la sécurité est double : une
        **approbation humaine** avant toute action irréversible, et des **secrets de production isolés**
        auxquels les workflows de test n'ont pas accès.
      en: |
        An **environment** (`environment:`) represents a named deployment target (`staging`, `production`).
        Beyond the name, an environment can carry **protection rules**:

        - **Required reviewers**: a deployment to this environment is **paused** until one or more
          designated people approve it manually. It is a human checkpoint before production.
        - **Wait timer**: an imposed delay before the deployment.
        - **Deployment branches**: only certain branches/tags may deploy to this environment.
        - **Environment secrets**: secrets that exist **only** for this environment, isolated from others.

        ```yaml
        jobs:
          deploy:
            environment: production     # subject to production's protection rules
            runs-on: ubuntu-latest
            steps:
              - run: ./deploy.sh
        ```

        When a job targets `production`, GitHub suspends the workflow and waits for approval from the
        reviewers defined in the environment settings. The security benefit is twofold: a **human
        approval** before any irreversible action, and **isolated production secrets** that test workflows
        cannot reach.
  - heading:
      fr: "OIDC : déployer sans secret de longue durée"
      en: "OIDC: deploying without a long-lived secret"
    body:
      fr: |
        Pour déployer sur AWS, la méthode classique consiste à stocker une clé d'accès
        (`AWS_ACCESS_KEY_ID` + `AWS_SECRET_ACCESS_KEY`) dans les secrets du dépôt. Problème : cette clé est
        **permanente**. Si elle fuite, l'attaquant garde un accès jusqu'à ce qu'on la révoque — parfois des
        mois.

        L'**OIDC** supprime ce risque. Au lieu de stocker une clé, GitHub émet à chaque exécution un
        **jeton d'identité** de courte durée, signé, qu'AWS vérifie. AWS accorde alors des identifiants
        **temporaires** (quelques heures). Il n'y a **aucun secret de longue durée** à stocker.

        Côté workflow, deux choses sont nécessaires :

        1. La permission **`id-token: write`**, sans laquelle GitHub n'émet pas le jeton OIDC.
        2. L'action `aws-actions/configure-aws-credentials` avec **`role-to-assume`** : l'ARN d'un rôle IAM
           configuré, côté AWS, pour **faire confiance** au fournisseur OIDC de GitHub et à votre dépôt.

        ```yaml
        permissions:
          id-token: write    # REQUIRED: lets GitHub mint the OIDC token
          contents: read
        ```

        Côté AWS, le rôle IAM a une *trust policy* qui n'autorise que votre organisation et votre dépôt
        (condition sur `repo:acme/app:*`), pour qu'un autre dépôt ne puisse pas assumer le rôle. C'est
        aujourd'hui la méthode recommandée pour tous les déploiements cloud depuis GitHub Actions.
      en: |
        To deploy to AWS, the classic method stores an access key (`AWS_ACCESS_KEY_ID` +
        `AWS_SECRET_ACCESS_KEY`) in the repo secrets. Problem: this key is **permanent**. If it leaks, the
        attacker keeps access until it is revoked — sometimes months.

        **OIDC** removes this risk. Instead of storing a key, GitHub issues a short-lived, signed **identity
        token** on each run, which AWS verifies. AWS then grants **temporary** credentials (a few hours).
        There is **no long-lived secret** to store.

        On the workflow side, two things are needed:

        1. The **`id-token: write`** permission, without which GitHub does not mint the OIDC token.
        2. The `aws-actions/configure-aws-credentials` action with **`role-to-assume`**: the ARN of an IAM
           role configured, on the AWS side, to **trust** GitHub's OIDC provider and your repo.

        ```yaml
        permissions:
          id-token: write    # REQUIRED: lets GitHub mint the OIDC token
          contents: read
        ```

        On AWS, the IAM role has a *trust policy* that only allows your organisation and repo (a condition
        on `repo:acme/app:*`), so another repo cannot assume the role. This is today the recommended method
        for all cloud deployments from GitHub Actions.

examples:
  - title:
      fr: "Moindre privilège : fermer puis ouvrir ce qui est nécessaire"
      en: "Least privilege: close, then open only what is needed"
    file: .github/workflows/pr.yml
    lang: yaml
    kind: secure
    code: |
      name: pr-checks
      on: [pull_request]

      # Default for the whole workflow: read-only, nothing can be written
      permissions:
        contents: read

      jobs:
        comment:
          runs-on: ubuntu-latest
          # This job alone needs to write on the pull request
          permissions:
            contents: read
            pull-requests: write     # only here, only what is needed
          steps:
            - uses: actions/checkout@v4
            - name: Post a review comment
              run: gh pr comment "$PR" --body "Automated checks started."
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                PR: ${{ github.event.pull_request.number }}
    note:
      fr: "Le workflow est en lecture seule par défaut (`contents: read`). Seul le job `comment` obtient `pull-requests: write`, et rien d'autre. Si une action compromise s'exécutait dans un autre job, elle n'aurait aucun droit d'écriture."
      en: "The workflow is read-only by default (`contents: read`). Only the `comment` job gets `pull-requests: write`, and nothing else. If a compromised action ran in another job, it would have no write rights."

  - title:
      fr: "Vulnérable : clé AWS de longue durée dans les secrets"
      en: "Vulnerable: long-lived AWS key in the secrets"
    file: .github/workflows/deploy-bad.yml
    lang: yaml
    kind: vulnerable
    code: |
      name: deploy
      on:
        push:
          branches: [main]

      jobs:
        deploy:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: aws-actions/configure-aws-credentials@v4
              with:
                # Long-lived keys stored as secrets: if they leak, the
                # attacker keeps access until someone manually revokes them.
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: eu-west-1
            - run: aws s3 sync ./dist s3://example-bucket
    note:
      fr: "Le problème n'est pas la syntaxe mais le **modèle** : une clé permanente stockée dans les secrets. Elle ne change jamais toute seule et reste valable si elle fuite. C'est exactement ce que l'OIDC supprime, dans l'exemple suivant."
      en: "The problem is not the syntax but the **model**: a permanent key stored in the secrets. It never rotates on its own and stays valid if it leaks. This is exactly what OIDC removes, in the next example."

  - title:
      fr: "Sécurisé : déploiement OIDC + environnement approuvé"
      en: "Secure: OIDC deployment + approved environment"
    file: .github/workflows/deploy-oidc.yml
    lang: yaml
    kind: secure
    code: |
      name: deploy
      on:
        push:
          branches: [main]

      permissions:
        id-token: write     # REQUIRED so GitHub can mint the OIDC token
        contents: read

      jobs:
        deploy:
          runs-on: ubuntu-latest
          # Production is protected by required reviewers: a human must approve
          environment: production
          steps:
            - uses: actions/checkout@v4
            - name: Get temporary AWS credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                # No stored key: assume a role that trusts GitHub's OIDC provider
                role-to-assume: arn:aws:iam::123456789012:role/github-deploy
                aws-region: eu-west-1
            - run: aws s3 sync ./dist s3://example-bucket
    note:
      fr: "Trois protections cumulées : `id-token: write` (strictement nécessaire à l'OIDC), `role-to-assume` qui remplace la clé permanente par des identifiants temporaires, et `environment: production` qui met le déploiement en pause jusqu'à approbation humaine."
      en: "Three stacked protections: `id-token: write` (strictly required for OIDC), `role-to-assume` which replaces the permanent key with temporary credentials, and `environment: production` which pauses the deployment until a human approves."

  - title:
      fr: "La trust policy IAM côté AWS"
      en: "The IAM trust policy on the AWS side"
    file: trust-policy.json
    lang: json
    kind: secure
    code: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {
              "Federated": "arn:aws:iam::123456789012:oidc-provider/token.actions.githubusercontent.com"
            },
            "Action": "sts:AssumeRoleWithWebIdentity",
            "Condition": {
              "StringEquals": {
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
              },
              "StringLike": {
                "token.actions.githubusercontent.com:sub": "repo:acme/app:ref:refs/heads/main"
              }
            }
          }
        ]
      }
    note:
      fr: "La condition `sub` restreint l'accès au dépôt `acme/app` et à la branche `main` : aucun autre dépôt ne peut assumer ce rôle. C'est ce qui rend l'OIDC sûr — le rôle ne fait confiance qu'à une identité très précise, pas à « n'importe quel workflow GitHub »."
      en: "The `sub` condition restricts access to the `acme/app` repo and the `main` branch: no other repo can assume this role. This is what makes OIDC safe — the role trusts a very precise identity, not \"any GitHub workflow\"."

mistake:
  fr: |
    **Laisser les permissions par défaut, ou stocker une clé cloud permanente « parce que c'est plus simple ».**

    Un workflow sans bloc `permissions:` peut hériter de droits bien plus larges que nécessaire : une
    action compromise en profite immédiatement. Fermez tout (`contents: read`) et n'ouvrez que le strict
    nécessaire, job par job. De même, stocker `AWS_SECRET_ACCESS_KEY` dans les secrets crée une clé
    permanente qui, si elle fuite, reste exploitable des mois. L'OIDC (`id-token: write` + `role-to-assume`)
    délivre des identifiants temporaires et supprime ce risque — adoptez-le dès que la cible le permet.
  en: |
    **Leaving default permissions, or storing a permanent cloud key "because it is simpler".**

    A workflow with no `permissions:` block can inherit far broader rights than needed: a compromised
    action takes advantage immediately. Close everything (`contents: read`) and open only the strict
    minimum, job by job. Likewise, storing `AWS_SECRET_ACCESS_KEY` in the secrets creates a permanent key
    that, if leaked, stays exploitable for months. OIDC (`id-token: write` + `role-to-assume`) issues
    temporary credentials and removes this risk — adopt it whenever the target allows.

bestPractice:
  fr: |
    - **Déclarez `permissions: { contents: read }`** au niveau du workflow, puis élargissez par job.
    - **N'accordez `write`** que sur le scope précis dont un job a besoin (`pull-requests`, `packages`...).
    - **Protégez `production`** avec des reviewers obligatoires : une approbation humaine avant l'irréversible.
    - **Isolez les secrets de production** dans un environnement dédié, inaccessible aux workflows de test.
    - **Préférez l'OIDC** aux clés permanentes : `id-token: write` + `role-to-assume`, aucun secret stocké.
    - **Restreignez la trust policy** au dépôt et à la branche exacts (condition `sub`).
  en: |
    - **Declare `permissions: { contents: read }`** at the workflow level, then widen per job.
    - **Grant `write`** only on the precise scope a job needs (`pull-requests`, `packages`...).
    - **Protect `production`** with required reviewers: a human approval before the irreversible.
    - **Isolate production secrets** in a dedicated environment, unreachable by test workflows.
    - **Prefer OIDC** over permanent keys: `id-token: write` + `role-to-assume`, no stored secret.
    - **Restrict the trust policy** to the exact repo and branch (the `sub` condition).

exercise:
  statement:
    fr: |
      Vous écrivez un job de déploiement vers AWS qui doit :

      1. fonctionner **sans** stocker de clé AWS permanente (donc via OIDC) ;
      2. n'accorder au workflow que les permissions strictement nécessaires à l'OIDC et à la lecture du
         code ;
      3. exiger une **approbation humaine** avant de déployer, via un environnement `production`.

      Écrivez le workflow correspondant. Le rôle à assumer est
      `arn:aws:iam::123456789012:role/github-deploy`, région `eu-west-1`.
    en: |
      You are writing a deployment job to AWS that must:

      1. work **without** storing a permanent AWS key (so via OIDC);
      2. grant the workflow only the permissions strictly needed for OIDC and reading the code;
      3. require a **human approval** before deploying, via a `production` environment.

      Write the matching workflow. The role to assume is
      `arn:aws:iam::123456789012:role/github-deploy`, region `eu-west-1`.
  solution:
    file: deploy.yml
    lang: yaml
    code: |
      name: deploy
      on:
        push:
          branches: [main]

      # Only what OIDC and checkout need, nothing more
      permissions:
        id-token: write     # mint the OIDC token
        contents: read      # read the code

      jobs:
        deploy:
          runs-on: ubuntu-latest
          environment: production   # required reviewers pause the deploy for approval
          steps:
            - uses: actions/checkout@v4
            - uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::123456789012:role/github-deploy
                aws-region: eu-west-1
            - run: aws s3 sync ./dist s3://example-bucket
    note:
      fr: "`id-token: write` est indispensable à l'OIDC ; sans lui, l'action échoue. `role-to-assume` évite toute clé stockée. `environment: production` déclenche l'attente d'approbation si l'environnement a des reviewers obligatoires configurés dans les réglages du dépôt."
      en: "`id-token: write` is essential for OIDC; without it the action fails. `role-to-assume` avoids any stored key. `environment: production` triggers the approval wait if the environment has required reviewers configured in the repo settings."

quiz:
  - q:
      fr: "Quelle est la meilleure valeur de départ pour `permissions:` d'un workflow ?"
      en: "What is the best starting value for a workflow's `permissions:`?"
    options:
      fr:
        - "`contents: read` (tout fermé, on ouvre ensuite au besoin)"
        - "`contents: write` partout"
        - "Aucune déclaration, on garde les droits par défaut"
        - "Tous les scopes en `write`"
      en:
        - "`contents: read` (everything closed, open as needed)"
        - "`contents: write` everywhere"
        - "No declaration, keep the default rights"
        - "Every scope set to `write`"
    answer: 0
    why:
      fr: "On applique le moindre privilège : lecture seule par défaut, puis `write` uniquement sur le scope précis d'un job qui en a besoin."
      en: "You apply least privilege: read-only by default, then `write` only on the precise scope of a job that needs it."
  - q:
      fr: "Quelle permission est obligatoire pour utiliser l'OIDC ?"
      en: "Which permission is mandatory to use OIDC?"
    options:
      fr:
        - "`contents: write`"
        - "`id-token: write`"
        - "`packages: write`"
        - "`security-events: write`"
      en:
        - "`contents: write`"
        - "`id-token: write`"
        - "`packages: write`"
        - "`security-events: write`"
    answer: 1
    why:
      fr: "`id-token: write` autorise GitHub à émettre le jeton d'identité OIDC ; sans cette permission, `configure-aws-credentials` ne peut pas obtenir d'identifiants temporaires."
      en: "`id-token: write` lets GitHub mint the OIDC identity token; without it, `configure-aws-credentials` cannot obtain temporary credentials."
  - q:
      fr: "Quel est l'avantage de sécurité principal de l'OIDC face à une clé AWS stockée ?"
      en: "What is the main security advantage of OIDC over a stored AWS key?"
    options:
      fr:
        - "Il chiffre le code source"
        - "Il accélère les déploiements"
        - "Il évite de stocker un secret permanent, remplacé par des identifiants temporaires"
        - "Il supprime le besoin d'un rôle IAM"
      en:
        - "It encrypts the source code"
        - "It speeds up deployments"
        - "It avoids storing a permanent secret, replaced by temporary credentials"
        - "It removes the need for an IAM role"
    answer: 2
    why:
      fr: "L'OIDC fournit des identifiants de courte durée à chaque run : plus de clé permanente à stocker ni à révoquer en cas de fuite. Un rôle IAM reste nécessaire."
      en: "OIDC provides short-lived credentials on every run: no permanent key to store or revoke if leaked. An IAM role is still required."
  - q:
      fr: "Que fait la règle « required reviewers » d'un environnement ?"
      en: "What does an environment's \"required reviewers\" rule do?"
    options:
      fr:
        - "Elle chiffre les secrets de l'environnement"
        - "Elle met le déploiement en pause jusqu'à une approbation humaine"
        - "Elle limite le nombre de jobs parallèles"
        - "Elle force l'usage d'une matrice"
      en:
        - "It encrypts the environment's secrets"
        - "It pauses the deployment until a human approval"
        - "It limits the number of parallel jobs"
        - "It forces the use of a matrix"
    answer: 1
    why:
      fr: "Un job ciblant cet environnement attend l'approbation des reviewers désignés : c'est un point de contrôle humain avant une action irréversible."
      en: "A job targeting this environment waits for the designated reviewers' approval: a human checkpoint before an irreversible action."
  - q:
      fr: "Dans la trust policy IAM, à quoi sert la condition sur `sub` (`repo:acme/app:...`) ?"
      en: "In the IAM trust policy, what is the condition on `sub` (`repo:acme/app:...`) for?"
    options:
      fr:
        - "À accélérer l'émission du jeton"
        - "À chiffrer les identifiants temporaires"
        - "À autoriser n'importe quel workflow GitHub"
        - "À n'autoriser que le dépôt et la branche exacts à assumer le rôle"
      en:
        - "To speed up token issuance"
        - "To encrypt the temporary credentials"
        - "To allow any GitHub workflow"
        - "To allow only the exact repo and branch to assume the role"
    answer: 3
    why:
      fr: "Sans cette condition, tout dépôt GitHub pourrait assumer le rôle. Elle restreint la confiance à une identité précise (dépôt + branche), ce qui rend l'OIDC sûr."
      en: "Without this condition, any GitHub repo could assume the role. It restricts trust to a precise identity (repo + branch), which makes OIDC safe."
