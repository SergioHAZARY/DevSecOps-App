description:
  fr: "Sécuriser les Secrets Kubernetes : comprendre que base64 n'est pas du chiffrement, chiffrer etcd, et utiliser External Secrets ou Sealed Secrets."
  en: "Secure Kubernetes Secrets: understand that base64 is not encryption, encrypt etcd, and use External Secrets or Sealed Secrets."
duration: 22

intro:
  fr: |
    Un **Secret** Kubernetes stocke une donnée sensible : mot de passe de base, clé d'API, certificat. Le piège,
    c'est son nom : il laisse croire que la donnée est *protégée*. En réalité, par défaut, un Secret n'est que du
    texte **encodé en base64**, et le base64 n'est **pas** du chiffrement — c'est un simple changement d'alphabet
    que n'importe qui décode en une commande.

    L'analogie : un Secret par défaut, c'est un mot de passe écrit à l'envers sur un post-it. Ça ne ressemble pas
    à grand-chose au premier coup d'œil, mais le retourner est trivial. Pour vraiment protéger un secret, il faut
    le **chiffrer au repos** (dans etcd), limiter qui peut le lire (RBAC), et idéalement le faire gérer par un
    coffre extérieur.

    Dans cette leçon, vous allez voir la différence entre encodage et chiffrement, activer le chiffrement d'etcd
    avec une **EncryptionConfiguration**, et découvrir deux approches GitOps-friendly : **External Secrets
    Operator** (synchronise depuis un vrai coffre comme Vault ou AWS Secrets Manager) et **Sealed Secrets**
    (chiffre le secret pour pouvoir le versionner dans Git sans risque).
  en: |
    A Kubernetes **Secret** stores sensitive data: a database password, an API key, a certificate. The trap is
    its name: it suggests the data is *protected*. In reality, by default, a Secret is only **base64-encoded**
    text, and base64 is **not** encryption — it is a mere change of alphabet that anyone decodes in one command.

    The analogy: a default Secret is a password written backwards on a sticky note. It looks like nothing at
    first glance, but flipping it back is trivial. To truly protect a secret you must **encrypt it at rest** (in
    etcd), limit who can read it (RBAC), and ideally let an external vault manage it.

    In this lesson you will see the difference between encoding and encryption, enable etcd encryption with an
    **EncryptionConfiguration**, and discover two GitOps-friendly approaches: **External Secrets Operator**
    (syncs from a real vault such as Vault or AWS Secrets Manager) and **Sealed Secrets** (encrypts the secret so
    you can safely version it in Git).

sections:
  - heading:
      fr: "base64 n'est pas du chiffrement"
      en: "base64 is not encryption"
    body:
      fr: |
        La confusion la plus dangereuse de Kubernetes. Comparons :

        | | base64 | Chiffrement (AES) |
        |---|---|---|
        | But | Transporter des octets en texte | Protéger la confidentialité |
        | Clé nécessaire ? | Non | Oui |
        | Réversible par un tiers ? | **Oui, en une commande** | Non, sans la clé |
        | Protège un secret ? | **Non** | Oui |

        Décoder un Secret est trivial : `kubectl get secret db -o jsonpath='{.data.password}' | base64 -d`.
        Pire, les Secrets sont stockés **en clair dans etcd** (la base de données du cluster) tant que le
        chiffrement au repos n'est pas activé. Quiconque obtient une sauvegarde d'etcd, ou un accès disque au nœud
        du control plane, lit tous les secrets. La vraie protection commence par **chiffrer etcd**.
      en: |
        The most dangerous confusion in Kubernetes. Let's compare:

        | | base64 | Encryption (AES) |
        |---|---|---|
        | Purpose | Carry bytes as text | Protect confidentiality |
        | Key required? | No | Yes |
        | Reversible by a third party? | **Yes, in one command** | No, without the key |
        | Protects a secret? | **No** | Yes |

        Decoding a Secret is trivial: `kubectl get secret db -o jsonpath='{.data.password}' | base64 -d`. Worse,
        Secrets are stored **in clear in etcd** (the cluster's database) as long as encryption at rest is not
        enabled. Anyone who obtains an etcd backup, or disk access to the control plane node, reads every secret.
        Real protection starts with **encrypting etcd**.
  - heading:
      fr: "Coffres externes et Sealed Secrets"
      en: "External vaults and Sealed Secrets"
    body:
      fr: |
        Chiffrer etcd protège les secrets *au repos dans le cluster*, mais pose un autre problème : **où ranger le
        secret avant de l'y mettre ?** Le committer en clair dans Git est une faute grave. Deux approches modernes
        répondent à cette question :

        - **External Secrets Operator (ESO)** : le secret vit dans un vrai coffre (HashiCorp Vault, AWS Secrets
          Manager, GCP Secret Manager). Un objet `ExternalSecret` dans le cluster indique *quel* secret
          synchroniser ; l'opérateur le récupère et crée le Secret K8s automatiquement. Le secret n'est **jamais**
          dans Git.

        - **Sealed Secrets** (Bitnami) : on chiffre le secret avec une clé publique propre au cluster, produisant
          un objet `SealedSecret` qu'on peut **committer sans risque** dans Git. Seul le contrôleur, qui détient
          la clé privée, peut le déchiffrer en un vrai Secret. Idéal pour le GitOps.

        | Approche | Le secret est dans Git ? | Source de vérité |
        |---|---|---|
        | External Secrets | Non | Le coffre externe |
        | Sealed Secrets | Oui, **chiffré** | Git |
      en: |
        Encrypting etcd protects secrets *at rest in the cluster*, but raises another problem: **where do you keep
        the secret before putting it there?** Committing it in clear to Git is a serious mistake. Two modern
        approaches answer this:

        - **External Secrets Operator (ESO)**: the secret lives in a real vault (HashiCorp Vault, AWS Secrets
          Manager, GCP Secret Manager). An `ExternalSecret` object in the cluster says *which* secret to sync;
          the operator fetches it and creates the K8s Secret automatically. The secret is **never** in Git.

        - **Sealed Secrets** (Bitnami): you encrypt the secret with a cluster-specific public key, producing a
          `SealedSecret` object you can **commit safely** to Git. Only the controller, which holds the private
          key, can decrypt it into a real Secret. Ideal for GitOps.

        | Approach | Is the secret in Git? | Source of truth |
        |---|---|---|
        | External Secrets | No | The external vault |
        | Sealed Secrets | Yes, **encrypted** | Git |

examples:
  - title:
      fr: "Dangereux : un Secret pris pour protégé"
      en: "Dangerous: a Secret mistaken for protected"
    file: fake-secret.yaml
    lang: yaml
    kind: vulnerable
    code: |
      # ANTI-PATTERN - committed to Git, believed "secure" because base64.
      apiVersion: v1
      kind: Secret
      metadata:
        name: db-credentials
        namespace: shop
      type: Opaque
      data:
        # "cGFzc3dvcmQxMjM=" is just base64, NOT encryption.
        # Anyone reading this file decodes the password instantly.
        username: YWRtaW4=              # -> admin
        password: cGFzc3dvcmQxMjM=      # -> password123
    output: |
      # Reversing it takes one command, no key needed:
      #   echo cGFzc3dvcmQxMjM= | base64 -d
      #   password123
      # And in etcd (unencrypted) it is stored the same way.
    note:
      fr: "Ce fichier committé dans Git expose le mot de passe : `base64 -d` le révèle sans aucune clé. Croire qu'un Secret est protégé parce qu'il est en base64 est l'erreur la plus courante. Il faut chiffrer etcd ET ne pas committer le secret en clair."
      en: "This file committed to Git exposes the password: `base64 -d` reveals it with no key. Believing a Secret is protected because it is base64 is the most common mistake. You must encrypt etcd AND not commit the secret in clear."

  - title:
      fr: "Sécurisé : chiffrer etcd (EncryptionConfiguration)"
      en: "Secure: encrypt etcd (EncryptionConfiguration)"
    file: encryption-config.yaml
    lang: yaml
    kind: secure
    code: |
      # /etc/kubernetes/enc/encryption-config.yaml
      # Referenced by the API Server flag:
      #   --encryption-provider-config=/etc/kubernetes/enc/encryption-config.yaml
      apiVersion: apiserver.config.k8s.io/v1
      kind: EncryptionConfiguration
      resources:
        - resources:
            - secrets                 # encrypt Secret objects at rest in etcd
          providers:
            # AES-GCM with a locally managed key. In production, prefer a
            # KMS provider (cloud KMS / Vault) so the key never sits on disk.
            - aescbc:
                keys:
                  - name: key1
                    # 32-byte key, base64-encoded (generate with:
                    # head -c 32 /dev/urandom | base64). Store it safely.
                    secret: c2VjcmV0LWtleS0zMi1ieXRlcy1sb25nLWV4YW1wbGU=
            # identity LAST = fallback for reads of not-yet-encrypted data.
            - identity: {}
    output: |
      # After restarting the API Server, re-encrypt existing secrets:
      #   kubectl get secrets -A -o json | kubectl replace -f -
      # Reading etcd directly now shows ciphertext:
      #   etcdctl get /registry/secrets/shop/db-credentials
      #   k8s:enc:aescbc:v1:key1:<binary ciphertext>   <-- no longer clear
    note:
      fr: "Avec cette configuration, les Secrets sont chiffrés (AES) avant d'être écrits dans etcd. Une sauvegarde d'etcd volée ne révèle plus rien. En production, on utilise un fournisseur KMS pour que la clé ne soit jamais stockée en clair sur le disque du control plane."
      en: "With this configuration, Secrets are encrypted (AES) before being written to etcd. A stolen etcd backup no longer reveals anything. In production, use a KMS provider so the key is never stored in clear on the control plane disk."

  - title:
      fr: "Sécurisé : synchroniser depuis un coffre (ESO)"
      en: "Secure: sync from a vault (ESO)"
    file: external-secret.yaml
    lang: yaml
    kind: secure
    code: |
      # The secret lives in AWS Secrets Manager; it is NEVER in Git.
      # External Secrets Operator pulls it and creates a native K8s Secret.
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: db-credentials
        namespace: shop
      spec:
        refreshInterval: 1h           # re-sync hourly (picks up rotations)
        secretStoreRef:
          name: aws-secrets-manager   # a SecretStore configured with IRSA
          kind: SecretStore
        target:
          name: db-credentials        # the K8s Secret that will be created
          creationPolicy: Owner
        data:
          - secretKey: password       # key inside the resulting K8s Secret
            remoteRef:
              key: prod/shop/db       # path in AWS Secrets Manager
              property: password
    output: |
      # The operator creates a real Secret, kept in sync with the vault:
      #   kubectl get secret db-credentials -n shop
      #   NAME             TYPE     DATA   AGE
      #   db-credentials   Opaque   1      5s
      # Rotating the secret in AWS automatically updates it in the cluster.
    note:
      fr: "L'`ExternalSecret` ne contient **aucune** valeur sensible, seulement une *référence* vers le coffre AWS. On peut donc le committer dans Git sans risque. La rotation faite dans le coffre se propage automatiquement au cluster."
      en: "The `ExternalSecret` contains **no** sensitive value, only a *reference* to the AWS vault. It can therefore be committed to Git safely. A rotation done in the vault propagates automatically to the cluster."

mistake:
  fr: |
    **Prendre base64 pour du chiffrement et committer des Secrets dans Git.** C'est l'erreur fondamentale :
    `data:` dans un manifeste Secret n'est que de l'encodage, décodable par quiconque lit le fichier ou le dépôt.
    Committer un tel manifeste expose le secret pour toujours dans l'historique Git. Deuxième piège : activer le
    chiffrement d'etcd mais **oublier de réécrire les secrets existants** (`kubectl get secrets -A -o json |
    kubectl replace -f -`) — les anciens restent en clair dans etcd jusqu'à leur prochaine modification.
  en: |
    **Taking base64 for encryption and committing Secrets to Git.** This is the fundamental mistake: `data:` in a
    Secret manifest is only encoding, decodable by anyone reading the file or the repository. Committing such a
    manifest exposes the secret forever in the Git history. Second trap: enabling etcd encryption but **forgetting
    to rewrite existing secrets** (`kubectl get secrets -A -o json | kubectl replace -f -`) — the old ones stay
    in clear in etcd until their next modification.

bestPractice:
  fr: |
    - **Rappelez-vous : base64 ≠ chiffrement.** Un Secret par défaut n'est pas protégé.
    - **Chiffrez etcd au repos** avec une `EncryptionConfiguration` (idéalement un fournisseur KMS).
    - **Ne committez jamais** un Secret en clair dans Git ; utilisez External Secrets ou Sealed Secrets.
    - **Limitez la lecture** par RBAC : peu de comptes doivent avoir `get`/`list` sur `secrets`.
    - **Faites tourner les secrets** régulièrement et montez-les de préférence en volume plutôt qu'en variable d'environnement.
  en: |
    - **Remember: base64 ≠ encryption.** A default Secret is not protected.
    - **Encrypt etcd at rest** with an `EncryptionConfiguration` (ideally a KMS provider).
    - **Never commit** a clear-text Secret to Git; use External Secrets or Sealed Secrets.
    - **Limit reads** via RBAC: few accounts should have `get`/`list` on `secrets`.
    - **Rotate secrets** regularly and prefer mounting them as a volume rather than an environment variable.

exercise:
  statement:
    fr: |
      Un collègue vous montre ce manifeste et affirme : « le mot de passe est sécurisé, il est en base64 ».

      ```yaml
      apiVersion: v1
      kind: Secret
      metadata:
        name: api-key
      data:
        token: c3VwZXItc2VjcmV0
      ```

      1. Prouvez en une commande que ce n'est **pas** sécurisé.
      2. Citez **deux** mesures concrètes pour réellement protéger ce secret.
    en: |
      A colleague shows you this manifest and claims: "the password is secure, it's base64".

      ```yaml
      apiVersion: v1
      kind: Secret
      metadata:
        name: api-key
      data:
        token: c3VwZXItc2VjcmV0
      ```

      1. Prove in one command that it is **not** secure.
      2. Name **two** concrete measures to actually protect this secret.
  solution:
    file: solution.sh
    lang: bash
    code: |
      # 1. Decode it instantly - no key, no tooling: base64 is NOT encryption.
      echo c3VwZXItc2VjcmV0 | base64 -d
      # Output: super-secret

      # 2. Concrete protections:
      #  (a) Enable etcd encryption at rest with an EncryptionConfiguration
      #      (or a KMS provider) so Secrets are AES-encrypted in etcd.
      #  (b) Never store it in Git in clear: use External Secrets Operator
      #      (pull from Vault/AWS) or Sealed Secrets (commit it encrypted).
      #  Bonus: restrict `get secrets` via RBAC and rotate the token.
    note:
      fr: "La commande `base64 -d` révèle `super-secret` sans aucune clé : l'encodage ne protège rien. Les vraies parades sont le chiffrement d'etcd et un coffre externe (ou Sealed Secrets), plus une restriction RBAC."
      en: "The `base64 -d` command reveals `super-secret` with no key: encoding protects nothing. The real defenses are etcd encryption and an external vault (or Sealed Secrets), plus an RBAC restriction."

quiz:
  - q:
      fr: "Un Secret Kubernetes par défaut protège-t-il la confidentialité de la donnée ?"
      en: "Does a default Kubernetes Secret protect the data's confidentiality?"
    options:
      fr: ["Oui, il est chiffré en AES", "Non, il est seulement encodé en base64", "Oui, mais seulement en mémoire", "Oui, avec une clé automatique"]
      en: ["Yes, it is AES-encrypted", "No, it is only base64-encoded", "Yes, but only in memory", "Yes, with an automatic key"]
    answer: 1
    why:
      fr: "Par défaut, un Secret n'est qu'en base64, un simple encodage réversible sans clé ; il n'offre aucune confidentialité réelle."
      en: "By default, a Secret is only base64, a simple encoding reversible without a key; it offers no real confidentiality."
  - q:
      fr: "Comment décode-t-on la valeur d'un Secret en base64 ?"
      en: "How do you decode a base64 Secret value?"
    options:
      fr: ["Il faut la clé privée du cluster", "C'est impossible", "Avec `base64 -d`, sans aucune clé", "Avec un certificat TLS"]
      en: ["You need the cluster's private key", "It is impossible", "With `base64 -d`, no key needed", "With a TLS certificate"]
    answer: 2
    why:
      fr: "`echo <valeur> | base64 -d` révèle la donnée immédiatement : c'est bien la preuve que le base64 n'est pas du chiffrement."
      en: "`echo <value> | base64 -d` reveals the data immediately: this is proof that base64 is not encryption."
  - q:
      fr: "À quoi sert une EncryptionConfiguration dans Kubernetes ?"
      en: "What is an EncryptionConfiguration used for in Kubernetes?"
    options:
      fr: ["À chiffrer les Secrets au repos dans etcd", "À chiffrer le réseau entre pods", "À signer les images", "À générer des certificats TLS"]
      en: ["To encrypt Secrets at rest in etcd", "To encrypt pod-to-pod network traffic", "To sign images", "To generate TLS certificates"]
    answer: 0
    why:
      fr: "L'EncryptionConfiguration indique à l'API Server de chiffrer (AES ou via KMS) les Secrets avant de les écrire dans etcd, protégeant une sauvegarde volée."
      en: "The EncryptionConfiguration tells the API Server to encrypt (AES or via KMS) Secrets before writing them to etcd, protecting a stolen backup."
  - q:
      fr: "Quelle différence majeure entre External Secrets et Sealed Secrets ?"
      en: "What is the major difference between External Secrets and Sealed Secrets?"
    options:
      fr: ["External Secrets garde le secret hors de Git ; Sealed Secrets le committe chiffré", "Ils sont identiques", "Sealed Secrets ne chiffre rien", "External Secrets stocke tout en clair"]
      en: ["External Secrets keeps the secret out of Git; Sealed Secrets commits it encrypted", "They are identical", "Sealed Secrets encrypts nothing", "External Secrets stores everything in clear"]
    answer: 0
    why:
      fr: "Avec External Secrets, le secret reste dans un coffre externe (jamais dans Git) ; avec Sealed Secrets, on committe une version chiffrée que seul le contrôleur peut déchiffrer."
      en: "With External Secrets, the secret stays in an external vault (never in Git); with Sealed Secrets, you commit an encrypted version that only the controller can decrypt."
  - q:
      fr: "Après avoir activé le chiffrement d'etcd, que faut-il faire des secrets existants ?"
      en: "After enabling etcd encryption, what must you do with existing secrets?"
    options:
      fr: ["Rien, ils sont déjà chiffrés", "Les supprimer tous", "Désactiver le RBAC", "Les réécrire pour qu'ils soient chiffrés (kubectl replace)"]
      en: ["Nothing, they are already encrypted", "Delete them all", "Disable RBAC", "Rewrite them so they get encrypted (kubectl replace)"]
    answer: 3
    why:
      fr: "Le chiffrement ne s'applique qu'aux écritures ; il faut réécrire les secrets existants (`kubectl get secrets -A -o json | kubectl replace -f -`) pour les chiffrer dans etcd."
      en: "Encryption applies only to writes; you must rewrite existing secrets (`kubectl get secrets -A -o json | kubectl replace -f -`) to encrypt them in etcd."
