description:
  fr: "Comprendre l'OWASP Top 10 : la liste 2021, la façon dont elle est construite, l'évolution depuis 2017 et l'édition 2025 à venir."
  en: "Understanding the OWASP Top 10: the 2021 list, how it is built, the evolution since 2017 and the upcoming 2025 edition."
duration: 20

intro:
  fr: |
    L'**OWASP** (*Open Worldwide Application Security Project*) est une fondation à but non lucratif qui
    publie des ressources libres sur la sécurité applicative. Son document le plus connu est l'**OWASP Top
    10** : un classement des dix catégories de risques les plus critiques pour les applications web, mis à
    jour tous les trois à quatre ans.

    Voyez-le comme la **check-list d'un pilote avant le décollage**. Elle ne décrit pas chaque panne
    possible, mais rassemble les dix familles de problèmes qui causent le plus d'accidents. Un développeur
    qui connaît ces dix catégories évite l'immense majorité des failles réelles.

    Dans cette leçon, vous découvrez la **liste 2021** (celle en vigueur), **comment elle est construite** à
    partir de données réelles, **ce qui a changé depuis 2017**, et un aperçu de l'**édition 2025**. Chaque
    catégorie fait ensuite l'objet d'une leçon dédiée avec du code vulnérable et sa correction.
  en: |
    **OWASP** (*Open Worldwide Application Security Project*) is a non-profit foundation that publishes free
    resources on application security. Its best-known document is the **OWASP Top 10**: a ranking of the ten
    most critical risk categories for web applications, updated every three to four years.

    See it as a **pilot's pre-flight checklist**. It does not describe every possible failure, but gathers
    the ten families of problems that cause the most accidents. A developer who knows these ten categories
    avoids the vast majority of real-world flaws.

    In this lesson you discover the **2021 list** (the one in force), **how it is built** from real data,
    **what changed since 2017**, and a preview of the **2025 edition**. Each category then has its own
    lesson with vulnerable code and its fix.

sections:
  - heading:
      fr: "La liste OWASP Top 10 - 2021"
      en: "The OWASP Top 10 - 2021 list"
    body:
      fr: |
        Voici les dix catégories de l'édition **2021**, encore en vigueur :

        | Rang | Catégorie | En bref |
        |---|---|---|
        | A01 | Broken Access Control | Contrôle d'accès défaillant : accéder à ce qui ne nous est pas destiné |
        | A02 | Cryptographic Failures | Défaillances cryptographiques : données sensibles mal (ou non) chiffrées |
        | A03 | Injection | Injection : données traitées comme du code (SQL, commandes, XSS) |
        | A04 | Insecure Design | Conception non sécurisée : la faille est dans le modèle, pas le code |
        | A05 | Security Misconfiguration | Mauvaise configuration : réglages par défaut, services exposés |
        | A06 | Vulnerable and Outdated Components | Composants vulnérables et obsolètes |
        | A07 | Identification and Authentication Failures | Identification et authentification défaillantes |
        | A08 | Software and Data Integrity Failures | Manque d'intégrité des données et du logiciel |
        | A09 | Security Logging and Monitoring Failures | Journalisation et surveillance insuffisantes |
        | A10 | Server-Side Request Forgery (SSRF) | Falsification de requête côté serveur |

        Chaque entrée est un **risque**, pas une faille unique : A03 « Injection » regroupe l'injection SQL,
        l'injection de commandes, le XSS, etc. Le Top 10 est une **sensibilisation**, pas une norme de
        certification — pour cela, OWASP publie l'**ASVS** (*Application Security Verification Standard*).
      en: |
        Here are the ten categories of the **2021** edition, still in force:

        | Rank | Category | In short |
        |---|---|---|
        | A01 | Broken Access Control | Accessing what is not meant for you |
        | A02 | Cryptographic Failures | Sensitive data poorly (or not) encrypted |
        | A03 | Injection | Data treated as code (SQL, commands, XSS) |
        | A04 | Insecure Design | The flaw is in the model, not the code |
        | A05 | Security Misconfiguration | Default settings, exposed services |
        | A06 | Vulnerable and Outdated Components | Vulnerable and outdated components |
        | A07 | Identification and Authentication Failures | Broken login and identity |
        | A08 | Software and Data Integrity Failures | Missing software and data integrity |
        | A09 | Security Logging and Monitoring Failures | Insufficient logging and monitoring |
        | A10 | Server-Side Request Forgery (SSRF) | Server-side request forgery |

        Each entry is a **risk**, not a single flaw: A03 "Injection" groups SQL injection, command injection,
        XSS, etc. The Top 10 is **awareness**, not a certification standard — for that, OWASP publishes the
        **ASVS** (*Application Security Verification Standard*).
  - heading:
      fr: "Comment la liste est construite"
      en: "How the list is built"
    body:
      fr: |
        L'OWASP Top 10 n'est pas une opinion : il s'appuie sur des **données**. Pour 2021, OWASP a analysé
        plus de **500 000 applications** et des centaines de milliers de vulnérabilités, catégorisées par
        **CWE** (*Common Weakness Enumeration*, le catalogue standard des types de faiblesses).

        Huit catégories sur dix sont classées à partir des données (fréquence, exploitabilité, impact), et
        **deux** proviennent d'un **sondage de la communauté** des professionnels — c'est ainsi qu'A04
        « Insecure Design » est entrée, bien qu'elle soit difficile à mesurer automatiquement. Chaque
        catégorie agrège plusieurs CWE : A01 en regroupe une trentaine.

        Conséquence pratique : le Top 10 reflète ce qu'on **trouve réellement** dans les applications, pas
        seulement ce qui est spectaculaire. C'est pourquoi le « Broken Access Control », longtemps sous-estimé,
        est passé en tête en 2021 : il était présent dans une très grande part des applications testées.
      en: |
        The OWASP Top 10 is not an opinion: it rests on **data**. For 2021, OWASP analysed more than
        **500,000 applications** and hundreds of thousands of vulnerabilities, categorised by **CWE**
        (*Common Weakness Enumeration*, the standard catalogue of weakness types).

        Eight of the ten categories are ranked from the data (frequency, exploitability, impact), and
        **two** come from a **community survey** of practitioners — that is how A04 "Insecure Design" entered,
        even though it is hard to measure automatically. Each category aggregates several CWEs: A01 groups
        about thirty.

        Practical consequence: the Top 10 reflects what is **actually found** in applications, not only what
        is spectacular. That is why "Broken Access Control", long underestimated, rose to the top in 2021: it
        was present in a very large share of tested applications.
  - heading:
      fr: "De 2017 à 2021, et l'édition 2025"
      en: "From 2017 to 2021, and the 2025 edition"
    body:
      fr: |
        Entre 2017 et 2021, trois catégories sont **nouvelles** (A04 Insecure Design, A08 Integrity
        Failures, A10 SSRF), plusieurs ont été **fusionnées ou renommées**, et le classement a changé : XSS a
        rejoint « Injection », et « Broken Access Control » est monté de la 5ᵉ à la 1ʳᵉ place.

        L'**édition 2025** (en cours de finalisation par OWASP) réorganise encore la liste. Le point majeur :
        l'apparition d'une catégorie dédiée à la **chaîne d'approvisionnement logicielle**. Correspondance
        entre 2021 et la proposition 2025 :

        | 2025 | Catégorie 2025 | Principale origine en 2021 |
        |---|---|---|
        | A01 | Broken Access Control | A01 (inchangé en tête) |
        | A02 | Security Misconfiguration | A05 |
        | A03 | Software Supply Chain Failures | A06 (élargi au-delà des seuls composants) |
        | A04 | Cryptographic Failures | A02 |
        | A05 | Injection | A03 |
        | A06 | Insecure Design | A04 |
        | A07 | Authentication Failures | A07 |
        | A08 | Software or Data Integrity Failures | A08 |
        | A09 | Logging & Alerting Failures | A09 |
        | A10 | Mishandling of Exceptional Conditions | nouvelle catégorie |

        Deux tendances : la **chaîne d'approvisionnement** monte (attaques type SolarWinds, dépendances
        compromises) et la **mauvaise gestion des erreurs** devient une catégorie à part entière. Le reste de
        ce cours suit la numérotation **2021**, référence actuelle, tout en signalant ces évolutions.
      en: |
        Between 2017 and 2021, three categories are **new** (A04 Insecure Design, A08 Integrity Failures,
        A10 SSRF), several were **merged or renamed**, and the ranking shifted: XSS joined "Injection", and
        "Broken Access Control" rose from 5th to 1st place.

        The **2025 edition** (being finalised by OWASP) reorganises the list again. The major point: a
        dedicated category for the **software supply chain**. Mapping between 2021 and the 2025 proposal:

        | 2025 | 2025 category | Main 2021 origin |
        |---|---|---|
        | A01 | Broken Access Control | A01 (unchanged at the top) |
        | A02 | Security Misconfiguration | A05 |
        | A03 | Software Supply Chain Failures | A06 (broadened beyond components) |
        | A04 | Cryptographic Failures | A02 |
        | A05 | Injection | A03 |
        | A06 | Insecure Design | A04 |
        | A07 | Authentication Failures | A07 |
        | A08 | Software or Data Integrity Failures | A08 |
        | A09 | Logging & Alerting Failures | A09 |
        | A10 | Mishandling of Exceptional Conditions | new category |

        Two trends: the **supply chain** rises (SolarWinds-style attacks, compromised dependencies) and
        **poor error handling** becomes a category of its own. The rest of this course follows the **2021**
        numbering, the current reference, while flagging these changes.

examples:
  - title:
      fr: "Afficher la liste OWASP Top 10 2021 (Python)"
      en: "Printing the OWASP Top 10 2021 list (Python)"
    file: owasp_2021.py
    lang: python
    kind: neutral
    code: |
      # The 2021 Top 10: each entry is a RISK category, grouping several CWE weaknesses
      TOP_10_2021 = [
          ("A01", "Broken Access Control"),
          ("A02", "Cryptographic Failures"),
          ("A03", "Injection"),
          ("A04", "Insecure Design"),
          ("A05", "Security Misconfiguration"),
          ("A06", "Vulnerable and Outdated Components"),
          ("A07", "Identification and Authentication Failures"),
          ("A08", "Software and Data Integrity Failures"),
          ("A09", "Security Logging and Monitoring Failures"),
          ("A10", "Server-Side Request Forgery (SSRF)"),
      ]

      for rank, name in TOP_10_2021:
          print(f"{rank}  {name}")
    output: |
      A01  Broken Access Control
      A02  Cryptographic Failures
      A03  Injection
      A04  Insecure Design
      A05  Security Misconfiguration
      A06  Vulnerable and Outdated Components
      A07  Identification and Authentication Failures
      A08  Software and Data Integrity Failures
      A09  Security Logging and Monitoring Failures
      A10  Server-Side Request Forgery (SSRF)
    note:
      fr: "Appuyez sur Run : vous obtenez la liste exacte de 2021. Retenez que chaque rang est une **famille** de faiblesses (plusieurs CWE), pas une faille isolée."
      en: "Press Run: you get the exact 2021 list. Remember that each rank is a **family** of weaknesses (several CWEs), not a single flaw."

  - title:
      fr: "Cartographier 2021 vers l'édition 2025 (Python)"
      en: "Mapping 2021 to the 2025 edition (Python)"
    file: mapping_2025.py
    lang: python
    kind: neutral
    code: |
      # Proposed 2025 list and its main origin in the 2021 edition
      MAPPING_2025 = [
          ("A01", "Broken Access Control", "A01"),
          ("A02", "Security Misconfiguration", "A05"),
          ("A03", "Software Supply Chain Failures", "A06"),
          ("A04", "Cryptographic Failures", "A02"),
          ("A05", "Injection", "A03"),
          ("A06", "Insecure Design", "A04"),
          ("A07", "Authentication Failures", "A07"),
          ("A08", "Software or Data Integrity Failures", "A08"),
          ("A09", "Logging & Alerting Failures", "A09"),
          ("A10", "Mishandling of Exceptional Conditions", "new"),
      ]

      for rank_2025, name, origin in MAPPING_2025:
          arrow = "new category" if origin == "new" else f"from 2021 {origin}"
          print(f"2025 {rank_2025}: {name:38} ({arrow})")
    output: |
      2025 A01: Broken Access Control                  (from 2021 A01)
      2025 A02: Security Misconfiguration              (from 2021 A05)
      2025 A03: Software Supply Chain Failures         (from 2021 A06)
      2025 A04: Cryptographic Failures                 (from 2021 A02)
      2025 A05: Injection                              (from 2021 A03)
      2025 A06: Insecure Design                        (from 2021 A04)
      2025 A07: Authentication Failures                (from 2021 A07)
      2025 A08: Software or Data Integrity Failures    (from 2021 A08)
      2025 A09: Logging & Alerting Failures            (from 2021 A09)
      2025 A10: Mishandling of Exceptional Conditions  (new category)
    note:
      fr: "La nouveauté marquante de 2025 est A03 « Software Supply Chain Failures » et A10 « Mishandling of Exceptional Conditions ». « Broken Access Control » reste en tête, preuve de sa prévalence."
      en: "The notable novelty of 2025 is A03 \"Software Supply Chain Failures\" and A10 \"Mishandling of Exceptional Conditions\". \"Broken Access Control\" stays on top, a sign of its prevalence."

  - title:
      fr: "Un aperçu concret : A01 vulnérable puis corrigé (Python/Flask)"
      en: "A concrete taste: A01 vulnerable then fixed (Python/Flask)"
    file: taste_a01.py
    lang: python
    kind: secure
    code: |
      from flask import Flask, abort
      from flask_login import current_user, login_required

      app = Flask(__name__)

      # ---------- VULNERABLE (A01 Broken Access Control) ----------
      @app.get("/vulnerable/account/<int:user_id>")
      @login_required
      def account_vulnerable(user_id):
          # Any logged-in user reads any account by changing user_id (IDOR)
          return load_account(user_id)

      # ---------- FIXED ----------
      @app.get("/account/<int:user_id>")
      @login_required
      def account(user_id):
          # Object-level check: you may only read your own account
          if user_id != current_user.id:
              abort(404)  # deny by default; 404 does not confirm the account exists
          return load_account(user_id)
    note:
      fr: "Ce court exemple illustre la catégorie A01, la plus fréquente. Chaque leçon suivante détaille une catégorie avec ce même schéma : explication, code vulnérable, code corrigé, et l'outil du pipeline qui la détecte."
      en: "This short example illustrates category A01, the most frequent. Each following lesson details one category with this same pattern: explanation, vulnerable code, fixed code, and the pipeline tool that detects it."

mistake:
  fr: |
    **Prendre l'OWASP Top 10 pour une check-list de certification exhaustive.**

    Le Top 10 est un outil de **sensibilisation** aux risques les plus répandus, pas une norme de
    conformité ni une liste complète. Une application peut « cocher les dix cases » et rester vulnérable à
    une faille métier spécifique. Pour une vérification rigoureuse, OWASP fournit l'**ASVS** (niveaux 1 à 3)
    et des guides de test détaillés. Autre erreur : croire que les numéros sont figés — la numérotation
    change à chaque édition, donc citez toujours l'**année** (« A01:2021 ») pour éviter toute confusion.
  en: |
    **Taking the OWASP Top 10 as an exhaustive certification checklist.**

    The Top 10 is an **awareness** tool for the most widespread risks, not a compliance standard nor a
    complete list. An application can "tick all ten boxes" and remain vulnerable to a specific business-logic
    flaw. For rigorous verification, OWASP provides the **ASVS** (levels 1 to 3) and detailed testing
    guides. Another mistake: believing the numbers are fixed — the numbering changes with each edition, so
    always cite the **year** ("A01:2021") to avoid confusion.

bestPractice:
  fr: |
    - **Apprendre les dix catégories** comme un socle commun entre développeurs, ops et sécurité.
    - **Citer l'année** (ex. `A03:2021`) : la numérotation évolue d'une édition à l'autre.
    - **Relier chaque risque à des outils** du pipeline (SAST, SCA, DAST, IaC) qui le détectent automatiquement.
    - **Aller plus loin que le Top 10** avec l'ASVS pour une vérification structurée et des niveaux d'exigence.
    - **Suivre les évolutions** : préparer dès maintenant la chaîne d'approvisionnement (A03:2025) et la gestion des erreurs.
  en: |
    - **Learn the ten categories** as a common foundation shared by developers, ops and security.
    - **Cite the year** (e.g. `A03:2021`): the numbering evolves from one edition to the next.
    - **Map each risk to pipeline tools** (SAST, SCA, DAST, IaC) that detect it automatically.
    - **Go beyond the Top 10** with the ASVS for structured verification and requirement levels.
    - **Track the evolution**: start preparing for the supply chain (A03:2025) and error handling now.

exercise:
  statement:
    fr: |
      Un responsable affirme : « Notre application est conforme à l'OWASP Top 10, donc elle est sécurisée et
      certifiée. »

      1. Relevez deux imprécisions dans cette phrase.
      2. Associez chacune de ces trois failles concrètes à sa catégorie 2021 : (a) une requête SQL
         construite par concaténation, (b) un bucket S3 laissé public par défaut, (c) un utilisateur qui lit
         la facture d'un autre en changeant l'`id` dans l'URL.
    en: |
      A manager states: "Our application is OWASP Top 10 compliant, so it is secure and certified."

      1. Point out two inaccuracies in this sentence.
      2. Map each of these three concrete flaws to its 2021 category: (a) a SQL query built by
         concatenation, (b) an S3 bucket left public by default, (c) a user reading someone else's invoice
         by changing the `id` in the URL.
  solution:
    file: solution.md
    lang: markdown
    code: |
      # 1. Inaccuracies

      - The Top 10 is an **awareness document**, not a certification. "Compliant" has no formal meaning;
        the standard for verification is the OWASP **ASVS**.
      - Covering the Top 10 does **not** guarantee security: business-logic flaws and categories outside
        the ten can remain.

      # 2. Mapping to the 2021 categories

      - (a) SQL query built by concatenation -> **A03 Injection**
      - (b) S3 bucket public by default      -> **A05 Security Misconfiguration**
      - (c) Reading another user's invoice via the id -> **A01 Broken Access Control** (IDOR)
    note:
      fr: "Le Top 10 sensibilise mais ne certifie pas ; l'ASVS sert à vérifier. Savoir ranger une faille réelle dans sa catégorie est l'objectif de ce cours."
      en: "The Top 10 raises awareness but does not certify; the ASVS is for verification. Being able to file a real flaw under its category is the goal of this course."

quiz:
  - q:
      fr: "Que représente chaque entrée de l'OWASP Top 10 ?"
      en: "What does each OWASP Top 10 entry represent?"
    options:
      fr:
        - "Un outil de sécurité précis à installer"
        - "Une catégorie de risque regroupant plusieurs types de faiblesses (CWE)"
        - "Une loi à respecter"
        - "Un langage de programmation à éviter"
      en:
        - "A specific security tool to install"
        - "A risk category grouping several weakness types (CWE)"
        - "A law to comply with"
        - "A programming language to avoid"
    answer: 1
    why:
      fr: "Chaque rang est une famille de risques ; par exemple A03 « Injection » couvre SQL, commandes et XSS, chacun décrit par des CWE."
      en: "Each rank is a family of risks; for example A03 \"Injection\" covers SQL, commands and XSS, each described by CWEs."
  - q:
      fr: "Quelle catégorie occupe la 1ʳᵉ place de l'OWASP Top 10 2021 ?"
      en: "Which category is ranked 1st in the OWASP Top 10 2021?"
    options:
      fr:
        - "Injection"
        - "Cryptographic Failures"
        - "Broken Access Control"
        - "Server-Side Request Forgery"
      en:
        - "Injection"
        - "Cryptographic Failures"
        - "Broken Access Control"
        - "Server-Side Request Forgery"
    answer: 2
    why:
      fr: "« Broken Access Control » est passé en tête en 2021 car il était présent dans une très large part des applications analysées."
      en: "\"Broken Access Control\" rose to the top in 2021 because it was present in a very large share of the analysed applications."
  - q:
      fr: "Comment la liste 2021 est-elle majoritairement établie ?"
      en: "How is the 2021 list mostly established?"
    options:
      fr:
        - "À partir de données réelles (centaines de milliers d'applications et de vulnérabilités), complétées par un sondage"
        - "Uniquement par le vote d'un comité fermé"
        - "Au hasard chaque année"
        - "Selon les préférences d'un seul éditeur de logiciels"
      en:
        - "From real data (hundreds of thousands of applications and vulnerabilities), complemented by a survey"
        - "Only by the vote of a closed committee"
        - "Randomly each year"
        - "According to the preferences of a single software vendor"
    answer: 0
    why:
      fr: "Huit catégories viennent des données (fréquence, impact) et deux d'un sondage de la communauté, d'où l'entrée d'« Insecure Design »."
      en: "Eight categories come from data (frequency, impact) and two from a community survey, which is how \"Insecure Design\" entered."
  - q:
      fr: "Quelle nouveauté marquante apporte l'édition 2025 ?"
      en: "What notable novelty does the 2025 edition bring?"
    options:
      fr:
        - "La suppression du contrôle d'accès"
        - "Une catégorie dédiée à la chaîne d'approvisionnement logicielle (Software Supply Chain Failures)"
        - "L'abandon total de la cryptographie"
        - "Le remplacement du Top 10 par un Top 3"
      en:
        - "The removal of access control"
        - "A dedicated Software Supply Chain Failures category"
        - "Dropping cryptography entirely"
        - "Replacing the Top 10 with a Top 3"
    answer: 1
    why:
      fr: "2025 élargit A06 en une catégorie « Software Supply Chain Failures » et ajoute « Mishandling of Exceptional Conditions »."
      en: "2025 broadens A06 into a \"Software Supply Chain Failures\" category and adds \"Mishandling of Exceptional Conditions\"."
  - q:
      fr: "Pourquoi faut-il préciser l'année quand on cite une catégorie (par ex. « A05:2021 ») ?"
      en: "Why should you specify the year when citing a category (e.g. \"A05:2021\")?"
    options:
      fr:
        - "Pour des raisons juridiques"
        - "Parce que la numérotation change d'une édition à l'autre"
        - "Parce que les catégories ont une date d'expiration"
        - "Ce n'est pas nécessaire"
      en:
        - "For legal reasons"
        - "Because the numbering changes from one edition to the next"
        - "Because categories have an expiry date"
        - "It is not necessary"
    answer: 1
    why:
      fr: "A05 désigne « Security Misconfiguration » en 2021 mais correspond à « Injection » en 2025 : sans l'année, la référence est ambiguë."
      en: "A05 means \"Security Misconfiguration\" in 2021 but maps to \"Injection\" in 2025: without the year, the reference is ambiguous."
