description:
  fr: "Gérer les credentials dans Jenkins : scopes, withCredentials et credentials(), limites du masquage, le piège de l'interpolation dans sh \"...\" et l'intégration de HashiCorp Vault."
  en: "Manage credentials in Jenkins: scopes, withCredentials and credentials(), masking limits, the sh \"...\" interpolation pitfall and HashiCorp Vault integration."
duration: 25

intro:
  fr: |
    Un pipeline a besoin de **secrets** : jeton de registre Docker, clé de déploiement, mot de passe de base
    de données. Les coder en dur dans le `Jenkinsfile` les enverrait dans Git pour toujours. Jenkins fournit
    donc un **magasin de credentials** chiffré et une façon de les injecter dans un build sans jamais les
    écrire dans le code.

    Pensez au coffre d'un hôtel. Le client ne repart pas avec le lingot : il demande un accès ponctuel,
    utilise l'objet dans le coffre, et tout est tracé. Le magasin de credentials Jenkins fonctionne pareil :
    le secret reste chiffré sur disque, et le pipeline y accède le temps d'une étape, via une variable qui
    disparaît ensuite.

    Dans cette leçon vous allez découvrir les **scopes**, les deux façons d'utiliser un secret
    (`credentials()` et `withCredentials`), comprendre pourquoi le masquage dans les logs a des **limites**,
    éviter le piège classique de l'interpolation `sh "..."`, et brancher Vault pour des secrets centralisés.
  en: |
    A pipeline needs **secrets**: a Docker registry token, a deployment key, a database password. Hard-coding
    them in the `Jenkinsfile` would send them to Git forever. Jenkins therefore provides an encrypted
    **credentials store** and a way to inject them into a build without ever writing them in the code.

    Think of a hotel safe. The guest does not walk off with the gold bar: they request temporary access, use
    the item inside the safe, and everything is logged. The Jenkins credentials store works the same way: the
    secret stays encrypted on disk, and the pipeline reaches it for the duration of a step, through a
    variable that then disappears.

    In this lesson you will discover the **scopes**, the two ways to use a secret (`credentials()` and
    `withCredentials`), understand why log masking has **limits**, avoid the classic `sh "..."` interpolation
    pitfall, and wire in Vault for centralised secrets.

sections:
  - heading:
      fr: "Types et scopes des credentials"
      en: "Credential types and scopes"
    body:
      fr: |
        Jenkins stocke plusieurs **types** de credentials : *Secret text* (un jeton), *Username with
        password*, *SSH private key*, *Secret file*, *Certificate*. Chacun reçoit un **ID** que le pipeline
        utilise pour y faire référence.

        Le **scope** décide *où* le credential est visible :

        | Scope | Visible depuis | Usage |
        |---|---|---|
        | **System** | Le contrôleur uniquement, jamais les builds | Config interne (nœuds, outils) |
        | **Global** | Le contrôleur et tous les jobs/agents | Secrets partagés par plusieurs pipelines |
        | **Folder** (plugin Folders) | Un dossier et ses jobs seulement | Cloisonner par équipe/projet |

        Le principe du moindre privilège s'applique : un secret réservé à l'équipe *paiement* vit dans le
        **folder** de cette équipe, pas en global. Un credential de scope **System** ne peut pas fuir vers un
        build — c'est le bon scope pour la configuration du contrôleur lui-même.
      en: |
        Jenkins stores several credential **types**: *Secret text* (a token), *Username with password*, *SSH
        private key*, *Secret file*, *Certificate*. Each one gets an **ID** that the pipeline uses to refer to
        it.

        The **scope** decides *where* the credential is visible:

        | Scope | Visible from | Use |
        |---|---|---|
        | **System** | The controller only, never builds | Internal config (nodes, tools) |
        | **Global** | The controller and all jobs/agents | Secrets shared by several pipelines |
        | **Folder** (Folders plugin) | A folder and its jobs only | Partition by team/project |

        Least privilege applies: a secret meant for the *payments* team lives in that team's **folder**, not
        in global. A **System**-scoped credential cannot leak into a build — it is the right scope for the
        controller's own configuration.
  - heading:
      fr: "Deux façons d'utiliser un secret"
      en: "Two ways to use a secret"
    body:
      fr: |
        **1. Via le bloc `environment` et `credentials('id')`** — pratique pour un secret simple :

        ```groovy
        environment {
            REGISTRY_TOKEN = credentials('docker-registry-token')
        }
        ```

        La variable `REGISTRY_TOKEN` est disponible dans tout le pipeline. Pour un credential *Username with
        password*, Jenkins crée aussi `REGISTRY_TOKEN_USR` et `REGISTRY_TOKEN_PSW`.

        **2. Via `withCredentials { ... }`** — recommandé car le secret n'existe que dans le bloc :

        ```groovy
        withCredentials([string(credentialsId: 'docker-registry-token', variable: 'TOKEN')]) {
            sh 'docker login -u ci --password-stdin <<< "$TOKEN"'
        }
        ```

        `withCredentials` limite la **durée de vie** du secret à l'étape qui en a besoin, et supporte tous
        les types (`usernamePassword`, `sshUserPrivateKey`, `file`). C'est la forme à privilégier : plus un
        secret est exposé longtemps, plus il risque de fuir dans un log ou un sous-processus.
      en: |
        **1. Via the `environment` block and `credentials('id')`** — handy for a simple secret:

        ```groovy
        environment {
            REGISTRY_TOKEN = credentials('docker-registry-token')
        }
        ```

        The `REGISTRY_TOKEN` variable is available across the whole pipeline. For a *Username with password*
        credential, Jenkins also creates `REGISTRY_TOKEN_USR` and `REGISTRY_TOKEN_PSW`.

        **2. Via `withCredentials { ... }`** — recommended, because the secret exists only inside the block:

        ```groovy
        withCredentials([string(credentialsId: 'docker-registry-token', variable: 'TOKEN')]) {
            sh 'docker login -u ci --password-stdin <<< "$TOKEN"'
        }
        ```

        `withCredentials` limits the secret's **lifetime** to the step that needs it, and supports every type
        (`usernamePassword`, `sshUserPrivateKey`, `file`). It is the preferred form: the longer a secret is
        exposed, the more likely it leaks into a log or a sub-process.
  - heading:
      fr: "Les limites du masquage et le piège de l'interpolation"
      en: "The limits of masking and the interpolation pitfall"
    body:
      fr: |
        Jenkins **masque** (remplace par `****`) la valeur d'un credential quand elle apparaît telle quelle
        dans la sortie console. Mais ce masquage a des limites qu'il faut connaître :

        - il ne masque que la valeur **exacte** : si le secret est transformé (encodé en base64, découpé), la
          forme transformée n'est pas masquée ;
        - il ne protège pas un secret écrit dans un **fichier** ou envoyé sur le **réseau** ;
        - il ne protège pas contre un secret interpolé **par Groovy** avant que le shell ne s'exécute.

        Ce dernier point est le piège le plus courant. Comparez :

        ```groovy
        sh "echo $TOKEN"   // DANGEREUX : Groovy remplace $TOKEN AVANT l'exécution
        sh 'echo $TOKEN'   // SÛR : le shell lit la variable d'environnement, Jenkins la masque
        ```

        Avec les **doubles guillemets**, Groovy interpole `$TOKEN` dans la chaîne au moment de compiler le
        pipeline : la valeur réelle se retrouve dans la ligne de commande, visible dans la liste des
        processus (`ps`) et parfois dans les logs. Avec les **guillemets simples**, Groovy ne touche à rien :
        c'est le shell qui lit `$TOKEN` depuis l'environnement, où Jenkins sait le masquer. **Règle : pour un
        secret, toujours des guillemets simples dans `sh`**, et passer le secret par variable d'environnement
        ou par stdin, jamais sur la ligne de commande.
      en: |
        Jenkins **masks** (replaces with `****`) a credential's value when it appears verbatim in the console
        output. But this masking has limits you must know:

        - it only masks the **exact** value: if the secret is transformed (base64-encoded, split), the
          transformed form is not masked;
        - it does not protect a secret written to a **file** or sent over the **network**;
        - it does not protect against a secret interpolated **by Groovy** before the shell runs.

        That last point is the most common pitfall. Compare:

        ```groovy
        sh "echo $TOKEN"   // DANGEROUS: Groovy substitutes $TOKEN BEFORE execution
        sh 'echo $TOKEN'   // SAFE: the shell reads the env variable, Jenkins masks it
        ```

        With **double quotes**, Groovy interpolates `$TOKEN` into the string when the pipeline is compiled:
        the real value ends up on the command line, visible in the process list (`ps`) and sometimes in the
        logs. With **single quotes**, Groovy touches nothing: it is the shell that reads `$TOKEN` from the
        environment, where Jenkins can mask it. **Rule: for a secret, always single quotes in `sh`**, and
        pass the secret through an environment variable or stdin, never on the command line.

examples:
  - title:
      fr: "Vulnérable : interpolation Groovy d'un secret"
      en: "Vulnerable: Groovy interpolation of a secret"
    file: Jenkinsfile
    lang: groovy
    kind: vulnerable
    code: |
      pipeline {
          agent any
          stages {
              stage('Deploy') {
                  steps {
                      withCredentials([string(credentialsId: 'api-token', variable: 'TOKEN')]) {
                          // DANGER 1: double quotes -> Groovy inlines the real token value
                          // into the command line BEFORE the shell runs. Masking is defeated.
                          sh "curl -H 'Authorization: Bearer $TOKEN' https://api.example.com/deploy"

                          // DANGER 2: the token is transformed, so Jenkins cannot match and mask it
                          sh 'echo $TOKEN | base64'
                      }
                  }
              }
          }
      }
    output: |
      + curl -H 'Authorization: Bearer glpat-REAL-SECRET-VALUE-HERE' https://api.example.com/deploy
      + echo **** | base64
      Z2xwYXQtUkVBTC1TRUNSRVQtVkFMVUUtSEVSRQ==
    note:
      fr: "Les doubles guillemets ont inséré la vraie valeur dans la commande `curl` : elle apparaît en clair dans le log et dans `ps`. La seconde commande encode le secret en base64 ; comme la forme encodée diffère de la valeur masquée, Jenkins ne la masque pas et le secret fuit quand même."
      en: "The double quotes inserted the real value into the `curl` command: it appears in clear text in the log and in `ps`. The second command base64-encodes the secret; because the encoded form differs from the masked value, Jenkins does not mask it and the secret leaks anyway."

  - title:
      fr: "Sécurisé : guillemets simples et passage par l'environnement"
      en: "Secure: single quotes and passing through the environment"
    file: Jenkinsfile
    lang: groovy
    kind: secure
    code: |
      pipeline {
          agent any
          stages {
              stage('Deploy') {
                  steps {
                      withCredentials([string(credentialsId: 'api-token', variable: 'TOKEN')]) {
                          // SAFE: single quotes -> Groovy does not touch the string.
                          // The shell expands $TOKEN from the environment, where Jenkins masks it.
                          // The header is built inside the shell, not on the visible command line.
                          sh '''
                            curl --fail --silent \
                              -H "Authorization: Bearer $TOKEN" \
                              https://api.example.com/deploy
                          '''
                      }
                  }
              }
          }
      }
    output: |
      + curl --fail --silent -H "Authorization: Bearer $TOKEN" https://api.example.com/deploy
      {"status":"deployed"}
    note:
      fr: "Avec les guillemets simples, la ligne affichée contient `$TOKEN` littéral, pas la valeur. Le secret ne vit que dans l'environnement du processus `curl` et n'est jamais écrit sur la ligne de commande. On ne le transforme pas non plus."
      en: "With single quotes, the printed line contains the literal `$TOKEN`, not the value. The secret lives only in the `curl` process environment and is never written on the command line. We also never transform it."

  - title:
      fr: "Username/password et clé SSH avec withCredentials"
      en: "Username/password and SSH key with withCredentials"
    file: Jenkinsfile
    lang: groovy
    kind: secure
    code: |
      pipeline {
          agent any
          stages {
              stage('Push image') {
                  steps {
                      // usernamePassword binds two variables that Jenkins masks
                      withCredentials([usernamePassword(
                          credentialsId: 'docker-hub',
                          usernameVariable: 'REG_USER',
                          passwordVariable: 'REG_PASS')]) {
                          // --password-stdin keeps the password off the command line
                          sh 'echo "$REG_PASS" | docker login -u "$REG_USER" --password-stdin'
                          sh 'docker push registry.example.com/app:$BUILD_NUMBER'
                      }
                  }
              }
              stage('Remote deploy') {
                  steps {
                      // sshUserPrivateKey writes the key to a temp file and gives its path
                      withCredentials([sshUserPrivateKey(
                          credentialsId: 'deploy-ssh-key',
                          keyFileVariable: 'KEYFILE',
                          usernameVariable: 'SSH_USER')]) {
                          sh 'ssh -i "$KEYFILE" "$SSH_USER@10.0.0.0" "/opt/app/deploy.sh"'
                      }
                  }
              }
          }
      }
    output: |
      + docker login -u ci --password-stdin
      Login Succeeded
      + docker push registry.example.com/app:42
      + ssh -i **** ci@10.0.0.0 /opt/app/deploy.sh
      deploy ok
    note:
      fr: "`usernamePassword` et `sshUserPrivateKey` injectent le secret proprement : le mot de passe passe par `--password-stdin`, la clé SSH par un fichier temporaire supprimé à la fin du bloc. Aucun secret n'apparaît sur la ligne de commande."
      en: "`usernamePassword` and `sshUserPrivateKey` inject the secret cleanly: the password goes through `--password-stdin`, the SSH key through a temp file deleted at the end of the block. No secret appears on the command line."

  - title:
      fr: "Secrets centralisés avec HashiCorp Vault"
      en: "Centralised secrets with HashiCorp Vault"
    file: Jenkinsfile
    lang: groovy
    kind: secure
    code: |
      pipeline {
          agent any
          stages {
              stage('Fetch from Vault') {
                  steps {
                      // The HashiCorp Vault plugin reads secrets at run time.
                      // Nothing is stored in Jenkins: Vault stays the single source of truth,
                      // and the lease can be short-lived and revoked.
                      withVault(
                          configuration: [vaultUrl: 'https://vault.example.com:8200',
                                          vaultCredentialId: 'vault-approle'],
                          vaultSecrets: [[
                              path: 'secret/data/ci/database',
                              secretValues: [[vaultKey: 'password', envVar: 'DB_PASSWORD']]
                          ]]
                      ) {
                          // DB_PASSWORD is masked; single quotes keep Groovy out of it
                          sh 'psql "postg://app:$DB_PASSWORD@db.example.com/app" -c "SELECT 1"'
                      }
                  }
              }
          }
      }
    output: |
      Retrieving secret: secret/data/ci/database
      + psql postg://app:****@db.example.com/app -c "SELECT 1"
       ?column?
      ----------
              1
    note:
      fr: "Avec Vault, le secret n'est plus dans Jenkins : il est lu à la volée via AppRole au moment du build. L'avantage majeur est la **rotation** et la **révocation** centralisées, et des secrets dynamiques à durée de vie courte. Jenkins ne détient qu'un identifiant AppRole, pas les mots de passe eux-mêmes."
      en: "With Vault, the secret is no longer in Jenkins: it is read on the fly via AppRole at build time. The major advantage is centralised **rotation** and **revocation**, plus short-lived dynamic secrets. Jenkins only holds an AppRole identity, not the passwords themselves."

mistake:
  fr: |
    **Croire que « Jenkins masque les secrets » suffit, et utiliser `sh "..."` avec un `$SECRET`.**

    Le masquage est une dernière barrière, pas une protection. Il ne masque que la valeur exacte, dans la
    console, et jamais une valeur transformée, écrite dans un fichier ou interpolée par Groovy. Dès que vous
    écrivez `sh "deploy --token=$TOKEN"`, Groovy insère la vraie valeur dans la commande : elle fuit dans
    `ps`, dans les logs réseau, dans les sous-processus. La valeur du secret ne doit jamais apparaître sur
    une ligne de commande, point.
  en: |
    **Believing that "Jenkins masks secrets" is enough, and using `sh "..."` with a `$SECRET`.**

    Masking is a last barrier, not a protection. It only masks the exact value, in the console, and never a
    transformed value, one written to a file, or one interpolated by Groovy. The moment you write
    `sh "deploy --token=$TOKEN"`, Groovy inserts the real value into the command: it leaks into `ps`, into
    network logs, into sub-processes. A secret's value must never appear on a command line, full stop.

bestPractice:
  fr: |
    - **Jamais de secret en dur** : tout passe par le magasin de credentials ou Vault.
    - **Préférez `withCredentials`** à `environment` : le secret ne vit que dans le bloc qui l'utilise.
    - **Guillemets simples dans `sh`** pour un secret ; passez-le par variable d'environnement ou stdin.
    - **Le bon scope** : System pour la config, Folder pour cloisonner par équipe, Global en dernier recours.
    - **Ne transformez pas un secret** avant de l'utiliser (base64, découpage) : le masquage ne suivrait pas.
    - **Centralisez et faites tourner** les secrets avec Vault quand l'échelle le justifie.
  en: |
    - **Never hard-code a secret**: everything goes through the credentials store or Vault.
    - **Prefer `withCredentials`** over `environment`: the secret lives only in the block that uses it.
    - **Single quotes in `sh`** for a secret; pass it through an environment variable or stdin.
    - **The right scope**: System for config, Folder to partition by team, Global as a last resort.
    - **Do not transform a secret** before use (base64, splitting): masking would not follow.
    - **Centralise and rotate** secrets with Vault when scale justifies it.

exercise:
  statement:
    fr: |
      Un pipeline contient cette étape, censée publier une image Docker :

      ```groovy
      withCredentials([string(credentialsId: 'reg-token', variable: 'TOKEN')]) {
          sh "docker login registry.example.com -u ci -p $TOKEN"
          sh "docker push registry.example.com/app:latest"
      }
      ```

      1. Identifiez le problème de sécurité de la première commande `sh`.
      2. Expliquez pourquoi le masquage ne suffit pas ici.
      3. Réécrivez le bloc pour que le jeton n'apparaisse jamais sur la ligne de commande.
    en: |
      A pipeline contains this stage, meant to publish a Docker image:

      ```groovy
      withCredentials([string(credentialsId: 'reg-token', variable: 'TOKEN')]) {
          sh "docker login registry.example.com -u ci -p $TOKEN"
          sh "docker push registry.example.com/app:latest"
      }
      ```

      1. Identify the security problem in the first `sh` command.
      2. Explain why masking is not enough here.
      3. Rewrite the block so the token never appears on the command line.
  solution:
    file: Jenkinsfile
    lang: groovy
    code: |
      withCredentials([string(credentialsId: 'reg-token', variable: 'TOKEN')]) {
          // Single quotes: Groovy leaves $TOKEN alone. --password-stdin keeps the
          // token off the command line and out of the process list.
          sh 'echo "$TOKEN" | docker login registry.example.com -u ci --password-stdin'
          sh 'docker push registry.example.com/app:latest'
      }
    note:
      fr: "1. Les doubles guillemets font interpoler `$TOKEN` par Groovy : la vraie valeur part dans la commande (et `-p` sur la ligne de commande est de toute façon à proscrire). 2. Le masquage n'agit que sur la console, pas sur `ps` ni les sous-processus. 3. On passe par `--password-stdin` et des guillemets simples : le jeton ne quitte jamais l'environnement."
      en: "1. The double quotes make Groovy interpolate `$TOKEN`: the real value goes into the command (and `-p` on the command line is to be avoided anyway). 2. Masking only acts on the console, not on `ps` or sub-processes. 3. We use `--password-stdin` and single quotes: the token never leaves the environment."

quiz:
  - q:
      fr: "Pourquoi `sh \"deploy --token=$TOKEN\"` est-il dangereux ?"
      en: "Why is `sh \"deploy --token=$TOKEN\"` dangerous?"
    options:
      fr:
        - "Groovy interpole la vraie valeur du secret dans la commande avant l'exécution"
        - "La commande sera trop longue pour le shell"
        - "Docker refuse les doubles guillemets"
        - "Le build sera plus lent"
      en:
        - "Groovy interpolates the real secret value into the command before execution"
        - "The command will be too long for the shell"
        - "Docker rejects double quotes"
        - "The build will be slower"
    answer: 0
    why:
      fr: "Les doubles guillemets déclenchent l'interpolation Groovy au moment de compiler le pipeline : la valeur réelle se retrouve sur la ligne de commande, visible dans `ps` et les logs, hors de portée du masquage."
      en: "Double quotes trigger Groovy interpolation when the pipeline is compiled: the real value ends up on the command line, visible in `ps` and logs, beyond the reach of masking."
  - q:
      fr: "Quel scope empêche qu'un credential soit visible depuis un build ?"
      en: "Which scope prevents a credential from being visible from a build?"
    options:
      fr: ["Global", "Folder", "System", "Public"]
      en: ["Global", "Folder", "System", "Public"]
    answer: 2
    why:
      fr: "Le scope System n'est visible que par le contrôleur, jamais par les builds. Il convient à la configuration interne de Jenkins (nœuds, outils)."
      en: "The System scope is visible only to the controller, never to builds. It suits Jenkins' internal configuration (nodes, tools)."
  - q:
      fr: "Pourquoi préférer `withCredentials` au bloc `environment` global ?"
      en: "Why prefer `withCredentials` over a global `environment` block?"
    options:
      fr:
        - "Il chiffre le secret deux fois"
        - "Le secret n'existe que dans le bloc qui en a besoin, limitant son exposition"
        - "Il est obligatoire pour les clés SSH"
        - "Il affiche le secret pour vérification"
      en:
        - "It encrypts the secret twice"
        - "The secret exists only in the block that needs it, limiting its exposure"
        - "It is mandatory for SSH keys"
        - "It prints the secret for verification"
    answer: 1
    why:
      fr: "`withCredentials` limite la durée de vie du secret à l'étape concernée. Moins un secret est exposé longtemps, moins il risque de fuir."
      en: "`withCredentials` limits the secret's lifetime to the relevant step. The less time a secret is exposed, the less it can leak."
  - q:
      fr: "Que se passe-t-il si vous encodez un secret en base64 avant de l'utiliser ?"
      en: "What happens if you base64-encode a secret before using it?"
    options:
      fr:
        - "Jenkins masque automatiquement la forme encodée"
        - "Le secret devient impossible à lire"
        - "La forme encodée n'est pas masquée et le secret peut fuir"
        - "Le build échoue systématiquement"
      en:
        - "Jenkins automatically masks the encoded form"
        - "The secret becomes impossible to read"
        - "The encoded form is not masked and the secret can leak"
        - "The build always fails"
    answer: 2
    why:
      fr: "Le masquage ne remplace que la valeur exacte. Une fois transformée (base64, découpée), la nouvelle chaîne n'est plus reconnue et apparaît en clair."
      en: "Masking only replaces the exact value. Once transformed (base64, split), the new string is no longer recognised and appears in clear text."
  - q:
      fr: "Quel est l'intérêt principal d'intégrer HashiCorp Vault à Jenkins ?"
      en: "What is the main benefit of integrating HashiCorp Vault with Jenkins?"
    options:
      fr:
        - "Rendre les builds plus rapides"
        - "Centraliser les secrets avec rotation et révocation, Jenkins ne détenant qu'un identifiant d'accès"
        - "Supprimer le besoin de masquer les secrets"
        - "Autoriser les secrets en dur dans le Jenkinsfile"
      en:
        - "Making builds faster"
        - "Centralising secrets with rotation and revocation, Jenkins holding only an access identity"
        - "Removing the need to mask secrets"
        - "Allowing hard-coded secrets in the Jenkinsfile"
    answer: 1
    why:
      fr: "Vault devient la source unique des secrets : ils sont lus à la volée, peuvent être dynamiques et à durée de vie courte, et révoqués d'un coup. Jenkins ne stocke plus les mots de passe."
      en: "Vault becomes the single source of secrets: they are read on the fly, can be dynamic and short-lived, and revoked at once. Jenkins no longer stores the passwords."
