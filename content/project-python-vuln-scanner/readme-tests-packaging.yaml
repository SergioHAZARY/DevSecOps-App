description:
  fr: "Finaliser le scanner : une suite de tests sans réseau externe, un Dockerfile non-root, un pipeline CI, et un README complet avec avertissement légal ; puis comment présenter l'outil dans un portfolio."
  en: "Finalise the scanner: a test suite with no external network, a non-root Dockerfile, a CI pipeline, and a complete README with a legal warning; then how to present the tool in a portfolio."
duration: 25

intro:
  fr: |
    L'outil fonctionne. Pour en faire un **projet de portfolio crédible**, il reste à le rendre
    **fiable** (tests), **distribuable** (Docker, packaging), **vérifié en continu** (CI) et
    **documenté** (README avec l'avertissement légal bien visible).

    Un recruteur qui regarde un scanner de sécurité vérifie deux choses avant tout : l'outil est-il
    **testé** (preuve de sérieux) et son auteur est-il **conscient du cadre légal** (preuve de maturité) ?
    Le README et la suite de tests répondent à ces deux questions.

    Analogie : on a construit un bel outil ; il faut maintenant le mettre dans une **boîte propre avec sa
    notice** (packaging + README) et coller l'étiquette « à utiliser avec autorisation uniquement ». Dans
    cette dernière leçon : tests, Dockerfile, CI, README, et mise en valeur dans un portfolio.
  en: |
    The tool works. To make it a **credible portfolio project**, what remains is to make it **reliable**
    (tests), **distributable** (Docker, packaging), **continuously verified** (CI) and **documented**
    (README with the legal warning clearly visible).

    A recruiter looking at a security scanner checks two things above all: is the tool **tested** (proof
    of seriousness) and is its author **aware of the legal framework** (proof of maturity)? The README and
    the test suite answer both questions.

    Analogy: we built a fine tool; now it must go into a **clean box with its manual** (packaging +
    README) and carry the "use with authorisation only" label. In this final lesson: tests, Dockerfile,
    CI, README, and showcasing it in a portfolio.

sections:
  - heading:
      fr: "Une suite de tests fiable et sans réseau"
      en: "A reliable, network-free test suite"
    body:
      fr: |
        On rassemble les tests écrits au fil des leçons : scan de ports (socket locale), rapports
        (échappement HTML), vérifications HTTP (mocks). Le principe directeur reste le même : **aucun test
        ne dépend d'internet**. C'est indispensable pour un scanner — un test qui vise un vrai site serait
        lent, instable et potentiellement illégal.

        On lance tout avec `pytest`. Dans le pipeline, on ajoute deux contrôles de sécurité sur notre
        propre code : **Bandit** (analyse statique Python, pour s'assurer qu'on n'a pas introduit de
        `verify=False` ou d'`eval` dangereux) et **pip-audit** (CVE dans nos dépendances). Un outil de
        sécurité se doit d'être exemplaire sur sa propre sécurité.
      en: |
        We gather the tests written across the lessons: port scanning (local socket), reports (HTML
        escaping), HTTP checks (mocks). The guiding principle stays the same: **no test depends on the
        internet**. This is essential for a scanner — a test aimed at a real site would be slow, unstable
        and potentially illegal.

        We run everything with `pytest`. In the pipeline we add two security checks on our own code:
        **Bandit** (Python static analysis, to make sure we did not introduce a `verify=False` or a
        dangerous `eval`) and **pip-audit** (CVEs in our dependencies). A security tool must be exemplary
        about its own security.
  - heading:
      fr: "Packaging et conteneur"
      en: "Packaging and container"
    body:
      fr: |
        Grâce au `pyproject.toml` (leçon 1), le projet s'installe avec `pip install .` et expose la
        commande `vulnscan`. Pour le distribuer sans même installer Python, on fournit un **Dockerfile**
        qui reprend nos principes : image **slim**, **multi-stage**, **utilisateur non-root**, et un
        `ENTRYPOINT` sur `vulnscan`.

        Ainsi, n'importe qui peut lancer l'outil en une commande :

        ```bash
        docker run --rm vulnscan 127.0.0.1
        ```

        Le conteneur par défaut ne vise que `127.0.0.1` et refuse toute cible externe sans le drapeau
        d'autorisation : le garde-fou éthique voyage **avec** l'image.
      en: |
        Thanks to the `pyproject.toml` (lesson 1), the project installs with `pip install .` and exposes
        the `vulnscan` command. To distribute it without even installing Python, we provide a
        **Dockerfile** that reuses our principles: **slim** image, **multi-stage**, **non-root user**, and
        an `ENTRYPOINT` on `vulnscan`.

        Anyone can then run the tool in one command:

        ```bash
        docker run --rm vulnscan 127.0.0.1
        ```

        The default container only targets `127.0.0.1` and refuses any external target without the
        authorization flag: the ethics guardrail travels **with** the image.
  - heading:
      fr: "README et présentation en portfolio"
      en: "README and portfolio presentation"
    body:
      fr: |
        Le README d'un outil offensif-défensif a une exigence particulière : l'**avertissement légal doit
        être impossible à manquer**, placé tout en haut. Il protège l'utilisateur... et son auteur.

        Pour le reste, on applique les mêmes principes que les projets précédents : description, prérequis,
        installation, utilisation, exemples, et comment lancer les tests. En entretien, ce projet permet de
        parler de **sockets**, de **concurrence**, de **TLS**, d'**échappement HTML**, et surtout de
        montrer une **posture éthique** mûre — un atout rare et très apprécié pour les métiers de la
        sécurité. Mettez en avant que l'outil fait de la **détection**, jamais de l'exploitation.
      en: |
        The README of an offensive-defensive tool has a particular requirement: the **legal warning must
        be impossible to miss**, placed right at the top. It protects the user... and the author.

        For the rest, we apply the same principles as the previous projects: description, prerequisites,
        installation, usage, examples, and how to run the tests. In an interview, this project lets you
        talk about **sockets**, **concurrency**, **TLS**, **HTML escaping**, and above all show a mature
        **ethical stance** — a rare and highly valued asset for security roles. Emphasise that the tool
        does **detection**, never exploitation.

examples:
  - title:
      fr: "Dockerfile : image slim, multi-stage, non-root"
      en: "Dockerfile: slim, multi-stage, non-root image"
    file: Dockerfile
    lang: dockerfile
    kind: secure
    code: |
      # ---- Stage 1: install the package into a venv ----
      FROM python:3.12-slim AS build
      WORKDIR /src
      COPY pyproject.toml README.md ./
      COPY scanner/ ./scanner/
      RUN python -m venv /opt/venv \
       && /opt/venv/bin/pip install --no-cache-dir .

      # ---- Stage 2: minimal non-root runtime ----
      FROM python:3.12-slim AS runtime
      RUN useradd --create-home --uid 10001 appuser
      COPY --from=build /opt/venv /opt/venv
      ENV PATH="/opt/venv/bin:$PATH"
      USER 10001
      # The ethics guardrail ships with the image: default target is 127.0.0.1.
      ENTRYPOINT ["vulnscan"]
      CMD ["127.0.0.1"]
    note:
      fr: "L'image installe le paquet puis ne garde que l'environnement. `USER 10001` fait tourner l'outil sans privilège. L'`ENTRYPOINT` est `vulnscan` : `docker run --rm image <cible>`."
      en: "The image installs the package then keeps only the environment. `USER 10001` runs the tool unprivileged. The `ENTRYPOINT` is `vulnscan`: `docker run --rm image <target>`."

  - title:
      fr: "ci.yml : tests, Bandit et pip-audit"
      en: "ci.yml: tests, Bandit and pip-audit"
    file: .github/workflows/ci.yml
    lang: yaml
    kind: secure
    code: |
      name: ci

      on: [push, pull_request]

      permissions:
        contents: read   # least privilege

      jobs:
        test:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            - name: Install the project with dev tools
              run: pip install -e ".[dev]"
            - name: Run the tests (no external network needed)
              run: pytest -q
            - name: Static analysis of our own code (Bandit)
              run: bandit -r scanner -lll
            - name: Audit our dependencies for CVEs (pip-audit)
              run: pip-audit
    note:
      fr: "Un outil de sécurité se contrôle lui-même : Bandit vérifie qu'on n'a pas introduit de code dangereux, pip-audit traque les CVE de nos dépendances. Les tests tournent sans réseau externe."
      en: "A security tool checks itself: Bandit verifies we did not introduce dangerous code, pip-audit hunts for CVEs in our dependencies. Tests run with no external network."

  - title:
      fr: "Le README.md complet de l'outil"
      en: "The tool's complete README.md"
    file: README.md
    lang: markdown
    kind: secure
    code: |
      # vulnscan

      ![CI](https://github.com/OWNER/devsecops-scanner/actions/workflows/ci.yml/badge.svg)

      > ## Legal notice
      > **Scan ONLY systems you own, or for which you hold WRITTEN authorisation.**
      > Unauthorised scanning is illegal in most jurisdictions. This tool performs
      > **detection and reporting only** — never exploitation. Default targets are
      > `127.0.0.1` and `scanme.nmap.org`; any other target requires the
      > `--i-have-authorization` flag.

      A small, dependency-light vulnerability scanner: open ports, service banners,
      missing HTTP security headers and TLS certificate checks, with JSON/HTML reports.

      ## Prerequisites

      - Python 3.11+ (and optionally Docker)

      ## Installation

      ```bash
      python -m venv .venv && source .venv/bin/activate
      pip install -e ".[dev]"   # editable install with test tools
      ```

      ## Usage

      ```bash
      vulnscan 127.0.0.1                      # scan your own machine (JSON)
      vulnscan 127.0.0.1 --format html --output report.html
      vulnscan scanme.nmap.org --i-have-authorization   # authorised external host
      ```

      ## What it checks

      | Module | Detects |
      |--------|---------|
      | ports | Open TCP ports (concurrent, with timeouts) |
      | banners | Service software/versions (outdated components) |
      | http_checks | Missing security headers (HSTS, CSP, X-Frame-Options...) |
      | tls_checks | Weak TLS protocol, certificate expiry |

      ## How to test

      ```bash
      pytest -q          # unit tests, no external network
      bandit -r scanner  # static analysis of the tool itself
      pip-audit          # dependency CVE audit
      ```

      ## Docker

      ```bash
      docker build -t vulnscan .
      docker run --rm vulnscan 127.0.0.1
      ```

      ## License

      MIT
    note:
      fr: "L'avertissement légal est en blockquote tout en haut, impossible à manquer. Le tableau « What it checks » résume les capacités, et la section « How to test » prouve le sérieux de l'outil."
      en: "The legal warning is in a blockquote right at the top, impossible to miss. The 'What it checks' table summarises the capabilities, and the 'How to test' section proves the tool's seriousness."

  - title:
      fr: "Résumé du projet pour le CV (orienté impact)"
      en: "Project summary for the résumé (impact-oriented)"
    file: cv-entry.txt
    lang: text
    kind: neutral
    code: |
      vulnscan — Detection-only vulnerability scanner (Python)
      - Built a modular CLI scanner: concurrent TCP port scan (ThreadPoolExecutor),
        banner grabbing, missing HTTP security headers, TLS protocol/expiry checks.
      - Standard-library first (socket, ssl, concurrent.futures); JSON/HTML reports
        with html.escape to prevent XSS in the report itself.
      - Enforced an ethics guardrail in code: default local target, explicit
        --i-have-authorization for any other host; detection only, no exploitation.
      - Packaged with pyproject.toml (console script), non-root Docker image, and a
        CI pipeline running pytest, Bandit and pip-audit. Tests use no external network.
      Tech: Python, sockets, TLS/ssl, argparse, pytest, Bandit, pip-audit, Docker.
    note:
      fr: "La ligne sur le garde-fou éthique et le « detection only » distingue ce projet : elle montre qu'on code de la sécurité offensive de façon responsable, ce que les recruteurs recherchent."
      en: "The line about the ethics guardrail and 'detection only' sets this project apart: it shows you build offensive security responsibly, which recruiters look for."

mistake:
  fr: |
    **Publier un scanner sans avertissement légal ni « detection only », avec des tests qui visent de vrais sites.**

    Un dépôt public d'outil de scan sans cadre légal explicite envoie un mauvais signal et peut même vous
    exposer si quelqu'un l'utilise mal. Des tests qui frappent de vrais hôtes externes sont lents,
    instables et potentiellement illégaux. Un README avec avertissement en tête, la mention « détection
    uniquement », et des tests 100 % locaux : voilà ce qui distingue un projet responsable d'un projet
    risqué.
  en: |
    **Publishing a scanner with no legal warning or "detection only", with tests aimed at real sites.**

    A public repository of a scanning tool with no explicit legal framing sends the wrong signal and can
    even expose you if someone misuses it. Tests that hit real external hosts are slow, unstable and
    potentially illegal. A README with the warning up top, the "detection only" statement, and 100% local
    tests: that is what sets a responsible project apart from a risky one.

bestPractice:
  fr: |
    - **Avertissement légal en tête du README** : impossible à manquer, « detection only ».
    - **Tests 100 % locaux** (socket locale, mocks) : rapides, stables, sans question légale.
    - **L'outil s'auto-contrôle** : Bandit + pip-audit sur son propre code.
    - **Packaging propre** (`pyproject.toml`, commande `vulnscan`) et **image non-root**.
    - **CI** qui lance tests et scans de sécurité à chaque push.
    - **Mettre en avant l'éthique** dans le CV et l'entretien : signe de maturité.
  en: |
    - **Legal warning at the top of the README**: impossible to miss, "detection only".
    - **100% local tests** (local socket, mocks): fast, stable, no legal question.
    - **The tool checks itself**: Bandit + pip-audit on its own code.
    - **Clean packaging** (`pyproject.toml`, `vulnscan` command) and a **non-root image**.
    - **CI** running tests and security scans on every push.
    - **Highlight the ethics** in the résumé and interview: a sign of maturity.

exercise:
  statement:
    fr: |
      Ajoutez au pipeline CI un **scan de l'image Docker** du scanner avec **Trivy**, qui échoue sur les
      vulnérabilités HIGH/CRITICAL corrigeables.

      Écrivez le job GitHub Actions `image` qui : construit l'image, la scanne avec l'action officielle
      `aquasecurity/trivy-action` épinglée, et fait échouer le pipeline en cas de CVE grave corrigeable.
    en: |
      Add to the CI pipeline a **Docker image scan** of the scanner with **Trivy**, failing on fixable
      HIGH/CRITICAL vulnerabilities.

      Write the GitHub Actions `image` job that: builds the image, scans it with the pinned official
      `aquasecurity/trivy-action`, and fails the pipeline on a serious fixable CVE.
  solution:
    file: image-job.yml
    lang: yaml
    code: |
      # Append this job to .github/workflows/ci.yml
        image:
          runs-on: ubuntu-latest
          needs: [test]   # only build the image if the code is clean
          steps:
            - uses: actions/checkout@v4
            - name: Build the scanner image
              run: docker build -t vulnscan:ci .
            - name: Scan the image with Trivy
              uses: aquasecurity/trivy-action@0.28.0
              with:
                image-ref: vulnscan:ci
                severity: HIGH,CRITICAL
                ignore-unfixed: true
                exit-code: "1"   # fail on fixable HIGH/CRITICAL
    note:
      fr: "Même un outil de sécurité doit scanner sa propre image : `needs: [test]` évite de construire si les tests échouent, et `exit-code: 1` bloque le pipeline sur une CVE grave corrigeable."
      en: "Even a security tool must scan its own image: `needs: [test]` avoids building if tests fail, and `exit-code: 1` blocks the pipeline on a serious fixable CVE."

quiz:
  - q:
      fr: "Où doit figurer l'avertissement légal dans le README de ce projet ?"
      en: "Where must the legal warning appear in this project's README?"
    options:
      fr:
        - "Tout en haut, impossible à manquer"
        - "Tout en bas, après la licence"
        - "Dans un fichier séparé non lié"
        - "Nulle part, c'est implicite"
      en:
        - "Right at the top, impossible to miss"
        - "At the very bottom, after the licence"
        - "In a separate, unlinked file"
        - "Nowhere, it is implicit"
    answer: 0
    why:
      fr: "L'avertissement protège l'utilisateur et l'auteur : il doit être la première chose lue, en tête du README."
      en: "The warning protects the user and the author: it must be the first thing read, at the top of the README."
  - q:
      fr: "Pourquoi les tests du scanner n'utilisent-ils aucun réseau externe ?"
      en: "Why do the scanner's tests use no external network?"
    options:
      fr:
        - "Parce que pytest l'interdit"
        - "Pour qu'ils soient rapides, stables et sans question légale"
        - "Pour économiser de la bande passante"
        - "Parce que les mocks sont obligatoires en Python"
      en:
        - "Because pytest forbids it"
        - "So they are fast, stable and raise no legal question"
        - "To save bandwidth"
        - "Because mocks are mandatory in Python"
    answer: 1
    why:
      fr: "Un test qui scanne un vrai site serait lent, instable et potentiellement illégal : on utilise une socket locale et des mocks."
      en: "A test scanning a real site would be slow, unstable and potentially illegal: we use a local socket and mocks."
  - q:
      fr: "Quels outils vérifient la sécurité du code du scanner lui-même dans la CI ?"
      en: "Which tools check the security of the scanner's own code in CI?"
    options:
      fr:
        - "ESLint et Prettier"
        - "Terraform et Checkov"
        - "Bandit (analyse statique) et pip-audit (CVE des dépendances)"
        - "ZAP et Nikto"
      en:
        - "ESLint and Prettier"
        - "Terraform and Checkov"
        - "Bandit (static analysis) and pip-audit (dependency CVEs)"
        - "ZAP and Nikto"
    answer: 2
    why:
      fr: "Bandit analyse le code Python et pip-audit vérifie les dépendances : un outil de sécurité se doit d'être exemplaire."
      en: "Bandit analyses the Python code and pip-audit checks the dependencies: a security tool must lead by example."
  - q:
      fr: "Comment lance-t-on le scanner via Docker sur la machine locale ?"
      en: "How do you run the scanner via Docker against the local machine?"
    options:
      fr:
        - "docker scan vulnscan"
        - "docker run --rm vulnscan 127.0.0.1"
        - "docker exec vulnscan --target"
        - "vulnscan docker 127.0.0.1"
      en:
        - "docker scan vulnscan"
        - "docker run --rm vulnscan 127.0.0.1"
        - "docker exec vulnscan --target"
        - "vulnscan docker 127.0.0.1"
    answer: 1
    why:
      fr: "L'`ENTRYPOINT` est `vulnscan` : on passe la cible comme argument de `docker run`. La cible par défaut reste `127.0.0.1`."
      en: "The `ENTRYPOINT` is `vulnscan`: the target is passed as an argument to `docker run`. The default target stays `127.0.0.1`."
  - q:
      fr: "Quel aspect de ce projet est le plus valorisant en entretien de sécurité ?"
      en: "Which aspect of this project is most valuable in a security interview?"
    options:
      fr:
        - "La couleur du rapport HTML"
        - "Le nombre de lignes de code"
        - "Le choix du port 8080"
        - "La posture éthique codée (détection uniquement, autorisation requise)"
      en:
        - "The colour of the HTML report"
        - "The number of lines of code"
        - "The choice of port 8080"
        - "The coded ethical stance (detection only, authorisation required)"
    answer: 3
    why:
      fr: "Montrer qu'on construit de la sécurité offensive de façon responsable est un signal de maturité rare et recherché."
      en: "Showing that you build offensive security responsibly is a rare, sought-after sign of maturity."
