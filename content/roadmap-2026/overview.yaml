description:
  fr: "Découvrir les 8 étapes de la roadmap DevSecOps 2026, des fondations Linux jusqu'au premier emploi, et démarrer son dépôt de suivi."
  en: "Discover the 8 steps of the 2026 DevSecOps roadmap, from Linux foundations to the first job, and start your tracking repository."
duration: 15

intro:
  fr: |
    Devenir ingénieur DevSecOps ressemble à une **grande randonnée** : le sommet paraît loin, et sans carte
    on tourne en rond entre des dizaines d'outils. Une **roadmap** (feuille de route) est cette carte. Elle
    ne raccourcit pas le chemin, mais elle vous dit par où commencer, dans quel ordre avancer, et où vous
    en êtes.

    La roadmap de ce site comporte **8 étapes**, qui correspondent aux 8 modules du menu. Vous n'avez
    besoin d'aucun diplôme pour la suivre : seulement d'un ordinateur, de régularité et de curiosité.

    Dans cette leçon, vous allez parcourir les 8 étapes, vérifier ce qui est déjà installé sur votre
    machine, et créer le dépôt Git qui suivra votre progression. Ce dépôt sera votre première ligne de
    portfolio.
  en: |
    Becoming a DevSecOps engineer is like a **long hike**: the summit looks far away, and without a map you
    walk in circles between dozens of tools. A **roadmap** is that map. It does not shorten the path, but
    it tells you where to start, in which order to move, and where you stand.

    The roadmap of this site has **8 steps**, matching the 8 modules of the menu. You need no degree to
    follow it: only a computer, regularity and curiosity.

    In this lesson you will walk through the 8 steps, check what is already installed on your machine,
    and create the Git repository that will track your progress. That repository will be the first line
    of your portfolio.

sections:
  - heading:
      fr: "Les 8 étapes"
      en: "The 8 steps"
    body:
      fr: |
        | # | Étape | Ce que vous apprenez | À la fin, vous savez… |
        |---|---|---|---|
        | 1 | **Fondations** | Culture DevSecOps, Linux, réseaux, adresses IP | administrer un serveur Linux en ligne de commande |
        | 2 | **Langages** | Python, Bash, YAML, JSON, SQL, puis Go, HCL, Rego | lire et écrire les fichiers et scripts du métier |
        | 3 | **Sécurité d'infrastructure** | Durcissement, secrets, identités, pare-feu, cloud, conteneurs | protéger un serveur, un compte cloud, un cluster |
        | 4 | **Sécurité des applications** | OWASP Top 10, failles web, authentification, chiffrement, API | reconnaître et corriger une faille dans du code |
        | 5 | **CI/CD sécurisé** | Git, GitHub Actions, GitLab CI, Jenkins, SAST, DAST, SCA | construire un pipeline qui bloque les failles |
        | 6 | **Infrastructure as Code** | Terraform, Ansible, Docker, Kubernetes, supervision | décrire et déployer une infrastructure avec du code |
        | 7 | **Projets complets** | Cinq projets guidés de bout en bout | montrer un travail réel à un recruteur |
        | 8 | **Carrière** | CV, portfolio, entretiens, certifications | décrocher et réussir un entretien |

        Les étapes 1 et 2 sont le socle : ne les sautez pas. Un scanner de sécurité ne sert à rien si l'on ne
        sait pas lire un fichier de configuration Linux ou un script.
      en: |
        | # | Step | What you learn | At the end, you can… |
        |---|---|---|---|
        | 1 | **Foundations** | DevSecOps culture, Linux, networking, IP addresses | administer a Linux server from the command line |
        | 2 | **Languages** | Python, Bash, YAML, JSON, SQL, then Go, HCL, Rego | read and write the files and scripts of the job |
        | 3 | **Infrastructure security** | Hardening, secrets, identities, firewalls, cloud, containers | protect a server, a cloud account, a cluster |
        | 4 | **Application security** | OWASP Top 10, web flaws, authentication, encryption, APIs | recognise and fix a flaw in code |
        | 5 | **Secure CI/CD** | Git, GitHub Actions, GitLab CI, Jenkins, SAST, DAST, SCA | build a pipeline that blocks flaws |
        | 6 | **Infrastructure as Code** | Terraform, Ansible, Docker, Kubernetes, monitoring | describe and deploy infrastructure with code |
        | 7 | **Complete projects** | Five guided end-to-end projects | show real work to a recruiter |
        | 8 | **Career** | Résumé, portfolio, interviews, certifications | land and pass an interview |

        Steps 1 and 2 are the base: do not skip them. A security scanner is useless if you cannot read a
        Linux configuration file or a script.
  - heading:
      fr: "Comment parcourir la roadmap"
      en: "How to walk the roadmap"
    body:
      fr: |
        La roadmap n'est pas une ligne droite parfaite. Quelques règles simples :

        - **L'ordre des étapes 1 et 2 est important**, la suite est plus souple. Par exemple, apprenez les
          bases de Docker (étape 6) avant la sécurité Docker (étape 3) : on ne sécurise bien que ce que
          l'on sait utiliser.
        - **Un cycle en trois temps** pour chaque sujet : *apprendre* (lire la leçon), *pratiquer* (refaire
          les exemples, casser, réparer), *publier* (garder une trace dans votre dépôt Git).
        - **Largeur puis profondeur** : visez d'abord une compréhension de base de chaque étape, puis
          approfondissez un ou deux domaines qui vous plaisent. C'est le profil « en T ».
        - **Les concepts avant les marques** : les outils changent, les idées restent. Comprendre ce qu'est
          une analyse de dépendances compte plus que connaître le nom du dernier outil à la mode.
      en: |
        The roadmap is not a perfectly straight line. A few simple rules:

        - **The order of steps 1 and 2 matters**, the rest is more flexible. For example, learn Docker
          basics (step 6) before Docker security (step 3): you only secure well what you know how to use.
        - **A three-beat cycle** for every topic: *learn* (read the lesson), *practise* (redo the examples,
          break, repair), *publish* (keep a trace in your Git repository).
        - **Breadth, then depth**: first aim for a basic understanding of each step, then go deep into one
          or two areas you enjoy. This is the "T-shaped" profile.
        - **Concepts before brands**: tools change, ideas stay. Understanding what dependency analysis is
          matters more than knowing the name of the latest trendy tool.
  - heading:
      fr: "Ce qui compte particulièrement en 2026"
      en: "What matters especially in 2026"
    body:
      fr: |
        Le socle du métier est stable, mais trois sujets ont pris beaucoup d'importance :

        | Sujet | Pourquoi il compte | Où vous le verrez |
        |---|---|---|
        | **Chaîne d'approvisionnement logicielle** | Une application est faite en grande partie du code des autres : dépendances, images, actions de pipeline. Il faut savoir d'où vient chaque composant. | SCA, SBOM, signature d'images |
        | **Code généré par IA** | Un assistant écrit du code vite, mais ce code peut contenir des failles ou des dépendances douteuses : il passe par les mêmes contrôles que le code humain. | SAST, revue de code |
        | **Politiques en code** | Les règles de sécurité sont écrites dans des fichiers, versionnées et appliquées automatiquement. | OPA, Rego, scans IaC |

        Aucun de ces sujets ne remplace les fondations : ils s'appuient dessus.
      en: |
        The core of the job is stable, but three topics have become much more important:

        | Topic | Why it matters | Where you will meet it |
        |---|---|---|
        | **Software supply chain** | An application is largely made of other people's code: dependencies, images, pipeline actions. You must know where every component comes from. | SCA, SBOM, image signing |
        | **AI-generated code** | An assistant writes code fast, but that code may contain flaws or dubious dependencies: it goes through the same checks as human code. | SAST, code review |
        | **Policy as code** | Security rules are written in files, versioned and enforced automatically. | OPA, Rego, IaC scans |

        None of these topics replaces the foundations: they build on them.

examples:
  - title:
      fr: "Où en est ma machine ? Vérifier la boîte à outils"
      en: "Where does my machine stand? Checking the toolbox"
    file: check-toolbox.sh
    lang: bash
    kind: neutral
    code: |
      #!/usr/bin/env bash
      # Which tools of the roadmap are already installed on this machine?

      for tool in git ssh python3 docker curl jq terraform kubectl; do
        # command -v prints the path of a program, or fails if it does not exist
        if command -v "$tool" >/dev/null 2>&1; then
          printf '%-10s installed  %s\n' "$tool" "$(command -v "$tool")"
        else
          printf '%-10s MISSING\n' "$tool"
        fi
      done
    output: |
      git        installed  /usr/bin/git
      ssh        installed  /usr/bin/ssh
      python3    installed  /usr/bin/python3
      docker     MISSING
      curl       installed  /usr/bin/curl
      jq         MISSING
      terraform  MISSING
      kubectl    MISSING
    note:
      fr: "Lancez ce script dans un terminal Linux, macOS ou WSL avec `bash check-toolbox.sh`. Il est normal que beaucoup d'outils manquent au début : chaque étape de la roadmap en ajoutera. La leçon « Monter son laboratoire » installe les premiers."
      en: "Run this script in a Linux, macOS or WSL terminal with `bash check-toolbox.sh`. It is normal for many tools to be missing at first: each step of the roadmap will add some. The \"Build your learning lab\" lesson installs the first ones."

  - title:
      fr: "Ma roadmap dans un fichier YAML"
      en: "My roadmap in a YAML file"
    file: roadmap.yaml
    lang: yaml
    kind: neutral
    code: |
      # roadmap.yaml - my DevSecOps journey, versioned in Git
      owner: alice
      goal: "Junior DevSecOps engineer"
      started: "2027-01-04"

      steps:
        - id: 1
          name: Foundations
          topics: [devsecops-culture, linux, networking, ip-cidr]
          status: in-progress # planned | in-progress | done
        - id: 2
          name: Languages
          topics: [python, bash, yaml, json, sql]
          status: planned
        - id: 3
          name: Infrastructure security
          topics: [hardening, secrets, identity, firewall, cloud, containers]
          status: planned
        - id: 4
          name: Application security
          topics: [owasp-top-10, web-flaws, authentication, encryption, api]
          status: planned
        - id: 5
          name: Secure CI/CD
          topics: [git, github-actions, sast, dast, sca]
          status: planned
        - id: 6
          name: Infrastructure as Code
          topics: [terraform, ansible, docker, kubernetes, monitoring]
          status: planned
        - id: 7
          name: Projects
          topics: [flask-pipeline, aws-terraform, k8s-opa-falco, python-scanner, homelab-wazuh]
          status: planned
        - id: 8
          name: Career
          topics: [resume, portfolio, interviews, certifications]
          status: planned
    note:
      fr: "YAML est le format de presque tous les fichiers du métier (pipelines, Kubernetes, Ansible). Écrire votre plan en YAML est déjà un exercice. Mettez à jour le champ `status` au fil de l'eau : l'historique Git racontera votre progression."
      en: "YAML is the format of almost every file in this job (pipelines, Kubernetes, Ansible). Writing your plan in YAML is already an exercise. Update the `status` field as you go: the Git history will tell the story of your progress."

  - title:
      fr: "Créer le dépôt qui suivra votre parcours"
      en: "Creating the repository that will track your journey"
    file: start-journey.sh
    lang: bash
    kind: secure
    code: |
      # Create the folder and turn it into a Git repository
      mkdir devsecops-journey && cd devsecops-journey
      git init -q -b main

      # Security reflex from day one: files that must never be committed
      printf '%s\n' '.env' '*.pem' '*.key' 'id_rsa*' 'id_ed25519*' > .gitignore

      echo "# My DevSecOps journey" > README.md
      # (copy the roadmap.yaml of the previous example into this folder)

      git add .gitignore README.md roadmap.yaml
      git commit -q -m "Start my DevSecOps roadmap"
      git log --oneline
      git status --short
    output: |
      4c1e9a7 Start my DevSecOps roadmap
    note:
      fr: "Le `.gitignore` est créé **avant** le premier commit : les clés privées et fichiers `.env` ne pourront pas être ajoutés par accident. `git status --short` n'affiche rien : tout est enregistré. Publiez ensuite ce dépôt sur GitHub ou GitLab, il deviendra la base de votre portfolio."
      en: "The `.gitignore` is created **before** the first commit: private keys and `.env` files cannot be added by accident. `git status --short` prints nothing: everything is recorded. Then publish this repository on GitHub or GitLab; it will become the base of your portfolio."

  - title:
      fr: "Visualiser sa progression"
      en: "Visualising your progress"
    file: progress.py
    lang: python
    kind: neutral
    code: |
      # (lessons done, lessons planned) for each step - replace with your own numbers
      roadmap = {
          "1. Foundations": (18, 24),
          "2. Languages": (10, 40),
          "3. Infrastructure security": (0, 30),
          "4. Application security": (0, 25),
          "5. Secure CI/CD": (3, 30),
          "6. Infrastructure as Code": (0, 30),
          "7. Projects": (0, 5),
          "8. Career": (0, 10),
      }

      done_total = planned_total = 0
      for step, (done, planned) in roadmap.items():
          percent = 100 * done // planned
          bar = "#" * (percent // 10) + "." * (10 - percent // 10)
          print(f"{step:<28} [{bar}] {percent:>3} %")
          done_total += done
          planned_total += planned

      print(f"{'Whole roadmap':<28} {100 * done_total // planned_total:>16} %")
    output: |
      1. Foundations               [#######...]  75 %
      2. Languages                 [##........]  25 %
      3. Infrastructure security   [..........]   0 %
      4. Application security      [..........]   0 %
      5. Secure CI/CD              [#.........]  10 %
      6. Infrastructure as Code    [..........]   0 %
      7. Projects                  [..........]   0 %
      8. Career                    [..........]   0 %
      Whole roadmap                              15 %
    note:
      fr: "Un petit script suffit pour voir où vous en êtes. Remarquez que l'on peut avoir commencé l'étape 5 avant de finir l'étape 2 : la roadmap se parcourt avec des allers-retours. Modifiez les nombres et appuyez sur Run."
      en: "A small script is enough to see where you stand. Notice that step 5 may be started before step 2 is finished: the roadmap is walked with some back and forth. Change the numbers and press Run."

mistake:
  fr: |
    **Vouloir tout apprendre en même temps, ou collectionner les tutoriels sans pratiquer.**

    Ouvrir en parallèle Kubernetes, Terraform, AWS et trois scanners donne l'impression d'avancer, mais on
    n'en retient presque rien : c'est le « syndrome du tutoriel ». Sans les fondations (Linux, réseau, un
    langage de script), chaque outil avancé ressemble à de la magie, et l'on reste bloqué à la première
    erreur. Suivez l'ordre, **tapez les commandes vous-même**, et ne passez au sujet suivant qu'après avoir
    réussi l'exercice de la leçon sans regarder la solution.
  en: |
    **Trying to learn everything at once, or collecting tutorials without practising.**

    Opening Kubernetes, Terraform, AWS and three scanners in parallel feels like progress, but almost
    nothing sticks: this is "tutorial hell". Without the foundations (Linux, networking, one scripting
    language), every advanced tool looks like magic, and you get stuck at the first error. Follow the
    order, **type the commands yourself**, and only move to the next topic after solving the lesson's
    exercise without looking at the solution.

bestPractice:
  fr: |
    - **Un dépôt Git dès le premier jour** : notes, scripts et exercices y sont versionnés. C'est une preuve de travail.
    - **Jamais de secret dans ce dépôt** : commencez par un `.gitignore`, même pour un projet personnel.
    - **Apprendre, pratiquer, publier** : chaque sujet se termine par quelque chose qui fonctionne et que l'on peut montrer.
    - **Fondations d'abord** : Linux, réseau et un langage de script avant les outils avancés.
    - **Un seul outil par catégorie** pour débuter ; vous comparerez les alternatives plus tard.
    - **Faites le point chaque mois** : mettez à jour `roadmap.yaml` et ajustez le rythme.
  en: |
    - **A Git repository from day one**: notes, scripts and exercises are versioned there. It is proof of work.
    - **Never a secret in that repository**: start with a `.gitignore`, even for a personal project.
    - **Learn, practise, publish**: every topic ends with something that works and that you can show.
    - **Foundations first**: Linux, networking and a scripting language before advanced tools.
    - **One tool per category** to begin with; you will compare alternatives later.
    - **Review every month**: update `roadmap.yaml` and adjust the pace.

exercise:
  statement:
    fr: |
      Créez votre dépôt de suivi `devsecops-journey` en une seule fois, avec un script Bash qui :

      1. crée le dossier et initialise un dépôt Git sur la branche `main` ;
      2. crée un `.gitignore` qui exclut `.env`, `*.pem` et `*.key` ;
      3. crée un `README.md` avec un titre et votre objectif ;
      4. crée un `roadmap.yaml` contenant au moins les étapes 1 et 2, avec un champ `status` ;
      5. enregistre le tout dans un premier commit.

      Vérifiez ensuite avec `git log --oneline` que le commit existe.
    en: |
      Create your `devsecops-journey` tracking repository in one go, with a Bash script that:

      1. creates the folder and initialises a Git repository on the `main` branch;
      2. creates a `.gitignore` that excludes `.env`, `*.pem` and `*.key`;
      3. creates a `README.md` with a title and your goal;
      4. creates a `roadmap.yaml` containing at least steps 1 and 2, with a `status` field;
      5. records everything in a first commit.

      Then check with `git log --oneline` that the commit exists.
  solution:
    file: solution.sh
    lang: bash
    code: |
      #!/usr/bin/env bash
      set -eu

      mkdir devsecops-journey
      cd devsecops-journey
      git init -q -b main

      # Ignore rules first, so that no secret can slip into the first commit
      printf '%s\n' '.env' '*.pem' '*.key' > .gitignore

      cat > README.md <<'EOF'
      # My DevSecOps journey

      Goal: become a junior DevSecOps engineer by following the 8-step roadmap.
      EOF

      cat > roadmap.yaml <<'EOF'
      goal: "Junior DevSecOps engineer"
      steps:
        - id: 1
          name: Foundations
          status: in-progress
        - id: 2
          name: Languages
          status: planned
      EOF

      git add .gitignore README.md roadmap.yaml
      git commit -q -m "Start my DevSecOps roadmap"
      git log --oneline
    note:
      fr: "`cat > fichier <<'EOF'` écrit plusieurs lignes dans un fichier (un *heredoc*). `set -eu` arrête le script à la première erreur : un bon réflexe pour tous vos scripts."
      en: "`cat > file <<'EOF'` writes several lines into a file (a *heredoc*). `set -eu` stops the script at the first error: a good habit for all your scripts."

quiz:
  - q:
      fr: "Par quelles étapes la roadmap commence-t-elle ?"
      en: "Which steps does the roadmap start with?"
    options:
      fr: ["Kubernetes et le cloud", "Les fondations (Linux, réseaux) puis les langages", "Les certifications", "Les projets complets"]
      en: ["Kubernetes and the cloud", "Foundations (Linux, networking), then languages", "Certifications", "Complete projects"]
    answer: 1
    why:
      fr: "Sans Linux, le réseau et un langage de script, les outils avancés restent incompréhensibles."
      en: "Without Linux, networking and a scripting language, advanced tools remain incomprehensible."
  - q:
      fr: "Quel cycle la leçon recommande-t-elle pour chaque sujet ?"
      en: "Which cycle does the lesson recommend for every topic?"
    options:
      fr: ["Lire, lire, relire", "Acheter, installer, oublier", "Apprendre, pratiquer, publier", "Copier, coller, déployer"]
      en: ["Read, read, read again", "Buy, install, forget", "Learn, practise, publish", "Copy, paste, deploy"]
    answer: 2
    why:
      fr: "On lit la leçon, on refait les exemples soi-même, puis on garde une trace publique dans son dépôt Git."
      en: "You read the lesson, redo the examples yourself, then keep a public trace in your Git repository."
  - q:
      fr: "Pourquoi créer le `.gitignore` avant le premier commit ?"
      en: "Why create the `.gitignore` before the first commit?"
    options:
      fr: ["Pour empêcher l'ajout accidentel de secrets ou de clés privées", "Pour accélérer Git", "Parce que Git refuse de fonctionner sans lui", "Pour chiffrer le dépôt"]
      en: ["To prevent secrets or private keys from being added by accident", "To make Git faster", "Because Git refuses to work without it", "To encrypt the repository"]
    answer: 0
    why:
      fr: "Un fichier ignoré n'est pas ajouté par `git add .` : la règle protège dès le premier commit."
      en: "An ignored file is not added by `git add .`: the rule protects from the very first commit."
  - q:
      fr: "Que fait `command -v docker` dans le script de vérification ?"
      en: "What does `command -v docker` do in the check script?"
    options:
      fr: ["Il installe Docker", "Il met Docker à jour", "Il démarre un conteneur", "Il affiche le chemin du programme s'il est installé, sinon il échoue"]
      en: ["It installs Docker", "It updates Docker", "It starts a container", "It prints the program's path if it is installed, otherwise it fails"]
    answer: 3
    why:
      fr: "`command -v` cherche un programme dans le PATH ; son code de sortie indique s'il existe, ce que le `if` exploite."
      en: "`command -v` looks a program up in the PATH; its exit code tells whether it exists, which the `if` relies on."
  - q:
      fr: "Comment la roadmap traite-t-elle le code généré par une IA ?"
      en: "How does the roadmap treat AI-generated code?"
    options:
      fr: ["Il est sûr par défaut", "Il est interdit en entreprise", "Il passe par les mêmes contrôles de sécurité que le code humain", "Il n'a pas besoin d'être versionné"]
      en: ["It is safe by default", "It is forbidden in companies", "It goes through the same security checks as human code", "It does not need to be versioned"]
    answer: 2
    why:
      fr: "Un assistant peut produire des failles ou des dépendances douteuses : analyse de code et revue s'appliquent de la même façon."
      en: "An assistant can produce flaws or dubious dependencies: code analysis and review apply in the same way."
