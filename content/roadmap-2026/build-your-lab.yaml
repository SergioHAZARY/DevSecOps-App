description:
  fr: "Monter un laboratoire d'apprentissage gratuit sur sa propre machine avec une machine virtuelle Linux, pour pratiquer sans rien casser de réel."
  en: "Build a free learning lab on your own machine with a Linux virtual machine, to practise without breaking anything real."
duration: 20

intro:
  fr: |
    On n'apprend pas à conduire en lisant le code de la route : il faut une voiture et un parking vide. En
    DevSecOps, ce « parking vide » s'appelle un **laboratoire** (*homelab*) : un environnement à vous, isolé,
    où vous pouvez taper des commandes, tout casser, et recommencer sans conséquence.

    La peur numéro un du débutant est « et si je casse mon ordinateur ? ». La solution est la **machine
    virtuelle** (*VM*) : un ordinateur complet qui tourne *dans une fenêtre* de votre ordinateur. Si vous la
    cassez, vous la supprimez et en recréez une en cinq minutes. Votre vraie machine, elle, n'est jamais
    touchée. C'est un bac à sable, au sens propre.

    Dans cette leçon, vous allez installer un outil de virtualisation gratuit, créer une VM Linux, vous y
    connecter, et prendre un **instantané** (*snapshot*) pour pouvoir revenir en arrière après chaque
    expérience. C'est la base de tout le reste de la roadmap.
  en: |
    You do not learn to drive by reading the highway code: you need a car and an empty parking lot. In
    DevSecOps, that "empty parking lot" is called a **lab** (*homelab*): an environment of your own, isolated,
    where you can type commands, break everything, and start over with no consequences.

    The beginner's number-one fear is "what if I break my computer?". The answer is the **virtual machine**
    (*VM*): a complete computer running *inside a window* of your computer. If you break it, you delete it and
    recreate one in five minutes. Your real machine is never touched. It is a sandbox, literally.

    In this lesson you will install a free virtualization tool, create a Linux VM, connect to it, and take a
    **snapshot** so you can roll back after each experiment. This is the foundation for the rest of the
    roadmap.

sections:
  - heading:
      fr: "Pourquoi une machine virtuelle ?"
      en: "Why a virtual machine?"
    body:
      fr: |
        Une **machine virtuelle** est un ordinateur simulé par un logiciel appelé **hyperviseur**
        (VirtualBox, VMware, Hyper-V...). Elle a son propre disque, sa propre mémoire, son propre système
        d'exploitation, mais tout cela n'est qu'un gros fichier sur votre disque.

        | Question du débutant | Réponse avec une VM |
        |---|---|
        | « Et si je casse Linux ? » | Vous supprimez la VM et en recréez une |
        | « Et si une commande efface tout ? » | Elle n'efface que la VM, pas votre PC |
        | « Je suis sous Windows / macOS » | La VM fait tourner Linux par-dessus |
        | « Je veux tester une attaque » | Dans la VM, isolée du reste |

        L'alternative moderne est le **conteneur** (Docker), plus léger. Mais pour débuter, une VM Linux
        complète est plus pédagogique : vous voyez un vrai système, avec ses utilisateurs, ses services et ses
        journaux. On installera Docker *dans* cette VM plus tard.
      en: |
        A **virtual machine** is a computer simulated by software called a **hypervisor** (VirtualBox, VMware,
        Hyper-V...). It has its own disk, its own memory, its own operating system, but all of that is just one
        large file on your disk.

        | Beginner's question | Answer with a VM |
        |---|---|
        | "What if I break Linux?" | You delete the VM and recreate one |
        | "What if a command wipes everything?" | It only wipes the VM, not your PC |
        | "I'm on Windows / macOS" | The VM runs Linux on top |
        | "I want to test an attack" | Inside the VM, isolated from the rest |

        The modern alternative is the **container** (Docker), which is lighter. But to start, a full Linux VM is
        more educational: you see a real system, with its users, services and logs. We will install Docker
        *inside* that VM later.
  - heading:
      fr: "Les instantanés : votre filet de sécurité"
      en: "Snapshots: your safety net"
    body:
      fr: |
        La fonction la plus précieuse d'une VM pour apprendre est l'**instantané** (*snapshot*) : une photo de
        l'état exact de la VM à un instant donné. Vous en prenez un **avant** une expérience risquée ; si tout
        casse, vous **restaurez** l'instantané et la VM redevient exactement comme avant, en quelques secondes.

        Le flux d'apprentissage idéal ressemble à ceci :

        1. VM propre, fraîchement installée → **instantané « base saine »**.
        2. Vous testez un durcissement SSH, une règle de pare-feu, une attaque… et vous cassez tout.
        3. Vous **restaurez** l'instantané « base saine » : retour à zéro, aucune trace.
        4. Vous recommencez, cette fois en comprenant mieux.

        Cette liberté de tout casser sans peur est ce qui accélère le plus l'apprentissage. Un débutant qui a
        peur de casser avance lentement ; un débutant avec un instantané ose, et apprend trois fois plus vite.
      en: |
        The most valuable VM feature for learning is the **snapshot**: a photo of the VM's exact state at a
        given moment. You take one **before** a risky experiment; if everything breaks, you **restore** the
        snapshot and the VM becomes exactly as it was, in seconds.

        The ideal learning flow looks like this:

        1. Clean, freshly installed VM → **"clean base" snapshot**.
        2. You test SSH hardening, a firewall rule, an attack… and you break everything.
        3. You **restore** the "clean base" snapshot: back to zero, no trace left.
        4. You start over, this time understanding better.

        This freedom to break anything without fear is what speeds learning the most. A beginner afraid to break
        moves slowly; a beginner with a snapshot dares, and learns three times faster.

examples:
  - title:
      fr: "Créer et démarrer une VM Ubuntu avec VirtualBox"
      en: "Creating and starting an Ubuntu VM with VirtualBox"
    file: create-vm.sh
    lang: bash
    kind: neutral
    code: |
      # VBoxManage is the command-line of VirtualBox. These commands create a
      # headless Ubuntu Server VM. You can also do it all from the VirtualBox GUI.

      # 1. Create and register the VM
      VBoxManage createvm --name devlab --ostype Ubuntu_64 --register

      # 2. Give it 2 GB of RAM and one CPU
      VBoxManage modifyvm devlab --memory 2048 --cpus 1

      # 3. Create a 20 GB virtual disk and attach the Ubuntu install ISO
      VBoxManage createhd --filename devlab.vdi --size 20000
      VBoxManage storagectl devlab --name SATA --add sata
      VBoxManage storageattach devlab --storagectl SATA --port 0 \
        --device 0 --type hdd --medium devlab.vdi

      # 4. Start the VM (then follow the Ubuntu installer on screen)
      VBoxManage startvm devlab
    output: |
      Virtual machine 'devlab' is created and registered.
      UUID: 6f2b1c9a-0d4e-4a1b-9c3f-7e2d5a8b1f04
      Waiting for VM "devlab" to power on...
      VM "devlab" has been successfully started.
    note:
      fr: "Débuter par l'interface graphique de VirtualBox est tout à fait valable. Ces commandes montrent ce qui se passe « sous le capot » : une VM, c'est de la RAM, un disque virtuel et une image d'installation."
      en: "Starting with the VirtualBox GUI is perfectly fine. These commands show what happens \"under the hood\": a VM is some RAM, a virtual disk and an installation image."

  - title:
      fr: "Prendre et restaurer un instantané"
      en: "Taking and restoring a snapshot"
    file: snapshots.sh
    lang: bash
    kind: secure
    code: |
      # Take a snapshot of a clean, freshly installed VM BEFORE experimenting.
      VBoxManage snapshot devlab take "clean-base" --description "Fresh Ubuntu install"

      # ... now break things: test firewall rules, hardening, an attack ...

      # Something went wrong? Roll back to the exact clean state in seconds.
      VBoxManage controlvm devlab poweroff
      VBoxManage snapshot devlab restore "clean-base"

      # Check your snapshots
      VBoxManage snapshot devlab list
    output: |
      Snapshot taken. UUID: 1a7c3e90-5b2d-4f81-a0c6-9d4e2b7f1a03
      Restoring snapshot 'clean-base' (1a7c3e90-5b2d-4f81-a0c6-9d4e2b7f1a03)
      Restored snapshot 'clean-base'
      Name: clean-base (UUID: 1a7c3e90-5b2d-4f81-a0c6-9d4e2b7f1a03)
    note:
      fr: "L'instantané « clean-base » est votre filet. Prenez-en un après chaque étape stable (VM installée, outils de base posés) et restaurez sans hésiter : casser puis revenir en arrière est la meilleure façon d'apprendre."
      en: "The \"clean-base\" snapshot is your safety net. Take one after each stable step (VM installed, base tools set) and restore without hesitation: breaking then rolling back is the best way to learn."

  - title:
      fr: "Installer la première boîte à outils dans la VM"
      en: "Installing the first toolbox in the VM"
    file: bootstrap-lab.sh
    lang: bash
    kind: secure
    code: |
      #!/usr/bin/env bash
      # Run this INSIDE the Linux VM to install the roadmap's first tools.
      set -eu

      # Refresh package lists, then install the essentials
      sudo apt-get update
      sudo apt-get install -y git curl jq python3 python3-venv

      # Verify each tool is present and show its version
      for tool in git curl jq python3; do
        printf '%-8s %s\n' "$tool" "$("$tool" --version | head -n 1)"
      done
    output: |
      git      git version 2.43.0
      curl     curl 8.5.0 (x86_64-pc-linux-gnu)
      jq       jq-1.7.1
      python3  Python 3.12.3
    note:
      fr: "On installe les outils **dans la VM**, pas sur votre vraie machine : tout reste isolé et jetable. Prenez un instantané juste après : vous aurez une « base saine avec outils » à restaurer à volonté."
      en: "Tools are installed **inside the VM**, not on your real machine: everything stays isolated and disposable. Take a snapshot right after: you get a \"clean base with tools\" to restore at will."

mistake:
  fr: |
    **Pratiquer les attaques et les durcissements directement sur sa machine principale (ou un vrai serveur).**

    Tester une règle de pare-feu, un scan de ports ou une commande de suppression sur votre ordinateur de tous
    les jours, c'est risquer de perdre vos fichiers ou de vous couper l'accès. Pire : scanner ou attaquer une
    machine qui n'est pas à vous est illégal. Le laboratoire résout les deux problèmes : tout est **isolé** (ça
    ne touche que la VM) et **à vous** (vous avez le droit d'y faire ce que vous voulez). N'expérimentez jamais
    ailleurs que dans votre lab.
  en: |
    **Practising attacks and hardening directly on your main machine (or a real server).**

    Testing a firewall rule, a port scan or a delete command on your everyday computer risks losing your files
    or locking yourself out. Worse: scanning or attacking a machine that is not yours is illegal. The lab solves
    both problems: everything is **isolated** (it only touches the VM) and **yours** (you are allowed to do
    whatever you want in it). Never experiment anywhere but your own lab.

bestPractice:
  fr: |
    - **Tout dans une VM** : installez, cassez et testez uniquement dans le laboratoire, jamais sur votre vraie machine.
    - **Un instantané « base saine »** après chaque étape stable, pour revenir en arrière en secondes.
    - **Osez casser** : la peur ralentit l'apprentissage ; avec un instantané, chaque erreur est réversible.
    - **N'attaquez que ce qui est à vous** : votre lab, `localhost`, ou des cibles explicitement autorisées.
    - **Pas de données réelles dans le lab** : utilisez des valeurs factices, jamais vos vrais mots de passe.
    - **Gardez la VM à jour** : `apt-get update && apt-get upgrade` reste un bon réflexe, même pour un lab.
  en: |
    - **Everything in a VM**: install, break and test only in the lab, never on your real machine.
    - **A "clean base" snapshot** after each stable step, to roll back in seconds.
    - **Dare to break**: fear slows learning; with a snapshot, every mistake is reversible.
    - **Only attack what is yours**: your lab, `localhost`, or explicitly authorised targets.
    - **No real data in the lab**: use fake values, never your real passwords.
    - **Keep the VM updated**: `apt-get update && apt-get upgrade` stays a good habit, even for a lab.

exercise:
  statement:
    fr: |
      Montez votre premier laboratoire et sécurisez votre façon de travailler :

      1. Installez un hyperviseur gratuit (VirtualBox, par exemple) et créez une VM Ubuntu Server.
      2. Une fois Ubuntu installé, prenez un instantané nommé `clean-base`.
      3. Dans la VM, installez les outils de base (`git`, `curl`, `jq`, `python3`) avec un script.
      4. Prenez un second instantané nommé `base-with-tools`.
      5. Cassez volontairement quelque chose (par exemple `sudo rm /etc/hostname`), puis restaurez l'instantané.

      Notez les commandes utilisées dans votre dépôt `devsecops-journey`.
    en: |
      Build your first lab and secure the way you work:

      1. Install a free hypervisor (VirtualBox, for example) and create an Ubuntu Server VM.
      2. Once Ubuntu is installed, take a snapshot named `clean-base`.
      3. In the VM, install the base tools (`git`, `curl`, `jq`, `python3`) with a script.
      4. Take a second snapshot named `base-with-tools`.
      5. Deliberately break something (for example `sudo rm /etc/hostname`), then restore the snapshot.

      Record the commands you used in your `devsecops-journey` repository.
  solution:
    file: lab-setup.sh
    lang: bash
    code: |
      #!/usr/bin/env bash
      set -eu

      # 1-2. (Done in the VirtualBox GUI or with VBoxManage, then:)
      VBoxManage snapshot devlab take "clean-base" --description "Fresh Ubuntu"

      # 3. Inside the VM, install base tools
      sudo apt-get update
      sudo apt-get install -y git curl jq python3 python3-venv

      # 4. Snapshot the VM again, now with tools installed
      VBoxManage snapshot devlab take "base-with-tools" --description "Ubuntu + tools"

      # 5. Break something on purpose, then roll back
      sudo rm /etc/hostname          # oops - this would break the VM's name
      VBoxManage controlvm devlab poweroff
      VBoxManage snapshot devlab restore "base-with-tools"
    note:
      fr: "Après la restauration, `/etc/hostname` est de retour : la VM est redevenue exactement comme avant la bêtise. C'est tout l'intérêt d'un lab jetable : l'erreur n'a aucune conséquence durable."
      en: "After the restore, `/etc/hostname` is back: the VM is exactly as it was before the mistake. That is the whole point of a disposable lab: the error has no lasting consequence."

quiz:
  - q:
      fr: "Pourquoi utiliser une machine virtuelle pour apprendre ?"
      en: "Why use a virtual machine to learn?"
    options:
      fr:
        - "Parce qu'elle rend l'ordinateur plus rapide"
        - "Parce qu'elle est isolée : la casser ne touche pas votre vraie machine"
        - "Parce qu'elle supprime le besoin de Linux"
        - "Parce qu'elle est obligatoire pour installer Git"
      en:
        - "Because it makes the computer faster"
        - "Because it is isolated: breaking it does not touch your real machine"
        - "Because it removes the need for Linux"
        - "Because it is required to install Git"
    answer: 1
    why:
      fr: "Une VM est un ordinateur simulé et isolé : vous pouvez tout casser et recommencer sans aucune conséquence pour votre vraie machine."
      en: "A VM is a simulated, isolated computer: you can break everything and start over with no consequence for your real machine."
  - q:
      fr: "À quoi sert un instantané (snapshot) ?"
      en: "What is a snapshot for?"
    options:
      fr:
        - "À photographier l'état de la VM pour y revenir plus tard"
        - "À accélérer le démarrage de la VM"
        - "À prendre une capture d'écran du bureau"
        - "À chiffrer le disque virtuel"
      en:
        - "To capture the VM's state so you can return to it later"
        - "To speed up the VM's boot"
        - "To take a screenshot of the desktop"
        - "To encrypt the virtual disk"
    answer: 0
    why:
      fr: "Un instantané fige l'état exact de la VM ; en le restaurant, on revient en secondes à cet état, ce qui permet de tout tester sans peur."
      en: "A snapshot freezes the VM's exact state; restoring it returns you to that state in seconds, letting you test anything without fear."
  - q:
      fr: "Où doit-on pratiquer une attaque ou un durcissement ?"
      en: "Where should you practise an attack or hardening?"
    options:
      fr:
        - "Sur n'importe quel serveur trouvé en ligne"
        - "Sur sa machine principale, pour gagner du temps"
        - "Dans son laboratoire isolé, qui est à soi"
        - "Sur le site web de son école"
      en:
        - "On any server found online"
        - "On your main machine, to save time"
        - "In your own isolated lab, which belongs to you"
        - "On your school's website"
    answer: 2
    why:
      fr: "On n'expérimente que sur ce qui est à soi et isolé : attaquer une machine qui n'est pas la vôtre est illégal, et casser sa machine principale est risqué."
      en: "You only experiment on what is yours and isolated: attacking a machine that is not yours is illegal, and breaking your main machine is risky."
  - q:
      fr: "Dans l'exercice, pourquoi installe-t-on les outils dans la VM et non sur le PC ?"
      en: "In the exercise, why install the tools in the VM and not on the PC?"
    options:
      fr:
        - "Parce que les outils ne fonctionnent pas sous Windows"
        - "Pour tout garder isolé et jetable, sans toucher au vrai système"
        - "Parce que la VM est plus rapide que le PC"
        - "Parce que c'est obligatoire pour VirtualBox"
      en:
        - "Because the tools do not work on Windows"
        - "To keep everything isolated and disposable, without touching the real system"
        - "Because the VM is faster than the PC"
        - "Because VirtualBox requires it"
    answer: 1
    why:
      fr: "Installer dans la VM garde votre vraie machine propre : si le lab se corrompt, on restaure un instantané et on repart de zéro."
      en: "Installing in the VM keeps your real machine clean: if the lab gets corrupted, you restore a snapshot and start fresh."
  - q:
      fr: "Quelle commande rafraîchit la liste des paquets avant d'installer des outils ?"
      en: "Which command refreshes the package list before installing tools?"
    options:
      fr:
        - "sudo apt-get remove"
        - "sudo systemctl restart"
        - "VBoxManage snapshot take"
        - "sudo apt-get update"
      en:
        - "sudo apt-get remove"
        - "sudo systemctl restart"
        - "VBoxManage snapshot take"
        - "sudo apt-get update"
    answer: 3
    why:
      fr: "`apt-get update` met à jour la liste des paquets disponibles ; c'est l'étape préalable avant `apt-get install`."
      en: "`apt-get update` refreshes the list of available packages; it is the step before `apt-get install`."
