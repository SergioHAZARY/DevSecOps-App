description:
  fr: "Construire un plan d'étude réaliste sur 12 mois pour devenir ingénieur DevSecOps, avec un rythme tenable et des jalons mesurables."
  en: "Build a realistic 12-month study plan to become a DevSecOps engineer, with a sustainable pace and measurable milestones."
duration: 18

intro:
  fr: |
    Savoir *quoi* apprendre ne suffit pas : il faut savoir *quand* et *à quel rythme*. Sans plan, on avance par
    à-coups, on saute des bases, on s'épuise sur un week-end puis on abandonne un mois. Un **plan d'étude**
    transforme une montagne en escalier.

    Pensez à l'entraînement d'un coureur qui prépare un marathon. Il ne court pas 42 km le premier jour : il
    suit un plan sur plusieurs mois, augmente progressivement, et prévoit des jours de repos. La régularité bat
    toujours l'intensité : **une heure par jour pendant un an** fait un ingénieur ; un week-end de douze heures
    tous les deux mois ne fait rien du tout.

    Dans cette leçon, vous allez construire votre propre plan sur 12 mois, découpé en trimestres, avec un
    rythme hebdomadaire tenable et des **jalons** concrets pour vérifier que vous progressez vraiment.
  en: |
    Knowing *what* to learn is not enough: you must know *when* and *at what pace*. Without a plan, you move in
    fits and starts, skip the basics, burn out over a weekend then quit for a month. A **study plan** turns a
    mountain into a staircase.

    Think of a runner training for a marathon. They do not run 42 km on day one: they follow a plan over
    months, build up gradually, and schedule rest days. Regularity always beats intensity: **one hour a day for
    a year** makes an engineer; a twelve-hour weekend every two months makes nothing at all.

    In this lesson you will build your own 12-month plan, split into quarters, with a sustainable weekly rhythm
    and concrete **milestones** to check that you are really progressing.

sections:
  - heading:
      fr: "Un plan sur quatre trimestres"
      en: "A plan over four quarters"
    body:
      fr: |
        On découpe l'année en quatre blocs de trois mois. Chaque trimestre s'appuie sur le précédent : on ne
        passe au cloud qu'après avoir compris Linux et le réseau.

        | Trimestre | Thème | Ce que vous apprenez | Jalon de fin |
        |---|---|---|---|
        | **T1** | Fondations | Linux, réseau, Git, un langage (Python/Bash) | Administrer un petit serveur Linux seul |
        | **T2** | Sécurité du code et pipeline | OWASP Top 10, SAST/SCA, GitHub Actions | Un pipeline qui bloque une faille |
        | **T3** | Infrastructure et cloud | Docker, Terraform, un compte cloud, secrets | Déployer une appli conteneurisée avec IaC |
        | **T4** | Projets et carrière | 2 projets complets, portfolio, entretiens | Un portfolio prêt à être présenté |

        Ce découpage n'est pas une loi : si vous avancez plus vite, tant mieux ; si un trimestre déborde, ce
        n'est pas grave. **L'ordre** compte plus que les dates. Ne commencez pas par le T3 : sécuriser Docker
        sans savoir lire un log Linux ne mène nulle part.
      en: |
        Split the year into four three-month blocks. Each quarter builds on the previous one: you only move to
        the cloud after understanding Linux and networking.

        | Quarter | Theme | What you learn | End milestone |
        |---|---|---|---|
        | **Q1** | Foundations | Linux, networking, Git, a language (Python/Bash) | Administer a small Linux server on your own |
        | **Q2** | Code and pipeline security | OWASP Top 10, SAST/SCA, GitHub Actions | A pipeline that blocks a flaw |
        | **Q3** | Infrastructure and cloud | Docker, Terraform, a cloud account, secrets | Deploy a containerised app with IaC |
        | **Q4** | Projects and career | 2 complete projects, portfolio, interviews | A portfolio ready to present |

        This split is not a law: if you move faster, great; if a quarter runs over, no problem. **Order**
        matters more than dates. Do not start with Q3: securing Docker without knowing how to read a Linux log
        leads nowhere.
  - heading:
      fr: "Un rythme hebdomadaire tenable"
      en: "A sustainable weekly rhythm"
    body:
      fr: |
        La semaine est l'unité qui compte vraiment. Un rythme qui tient sur la durée ressemble à ceci :

        - **Lundi à vendredi** : 45 à 60 minutes par jour. Une leçon, puis on refait les exemples soi-même.
        - **Un jour** : pas d'écran technique. Le cerveau consolide pendant le repos ; c'est prouvé et utile.
        - **Le week-end** : une session plus longue (2 à 3 h) pour un petit projet, pas pour « rattraper ».

        La règle des **70/20/10** aide à équilibrer :

        | Part | Activité | Pourquoi |
        |---|---|---|
        | 70 % | Pratiquer (taper les commandes, casser, réparer) | On apprend en faisant, pas en lisant |
        | 20 % | Apprendre des autres (doc, correction, communauté) | On évite de réinventer les erreurs |
        | 10 % | Théorie pure (lire, regarder) | Le contexte, mais ça ne remplace pas la pratique |

        Si vous ne retenez qu'une chose : **la constance** est votre meilleur outil. Trois heures réparties sur
        la semaine valent mieux que trois heures d'un coup puis plus rien.
      en: |
        The week is the unit that really counts. A rhythm that lasts looks like this:

        - **Monday to Friday**: 45 to 60 minutes a day. One lesson, then redo the examples yourself.
        - **One day**: no technical screen. The brain consolidates during rest; this is proven and useful.
        - **The weekend**: one longer session (2 to 3 h) for a small project, not to "catch up".

        The **70/20/10** rule helps balance things:

        | Share | Activity | Why |
        |---|---|---|
        | 70% | Practice (type the commands, break, fix) | You learn by doing, not by reading |
        | 20% | Learn from others (docs, corrections, community) | You avoid reinventing mistakes |
        | 10% | Pure theory (read, watch) | The context, but it does not replace practice |

        If you remember one thing: **consistency** is your best tool. Three hours spread across the week beat
        three hours in one go then nothing.
  - heading:
      fr: "Des jalons pour mesurer, pas pour se juger"
      en: "Milestones to measure, not to judge"
    body:
      fr: |
        Un **jalon** (*milestone*) est une preuve concrète que vous savez faire quelque chose : pas « j'ai lu la
        leçon SSH », mais « je me connecte à un serveur par clé SSH, sans mot de passe ». Un bon jalon est :

        1. **Observable** : on peut le montrer (un dépôt, une démo, un pipeline vert).
        2. **Daté** : il a une échéance, sinon il glisse indéfiniment.
        3. **À votre portée** : assez petit pour être atteint en quelques semaines.

        Les jalons servent à **ajuster le plan**, pas à se flageller. Si un jalon est raté, c'est une
        information : le sujet était trop gros, ou le rythme trop ambitieux. On redécoupe, on continue. Le seul
        vrai échec est d'arrêter.
      en: |
        A **milestone** is concrete proof that you can do something: not "I read the SSH lesson", but "I connect
        to a server with an SSH key, no password". A good milestone is:

        1. **Observable**: you can show it (a repo, a demo, a green pipeline).
        2. **Dated**: it has a deadline, otherwise it slips forever.
        3. **Within reach**: small enough to be hit in a few weeks.

        Milestones are there to **adjust the plan**, not to beat yourself up. If a milestone is missed, that is
        information: the topic was too big, or the pace too ambitious. You re-split, you carry on. The only real
        failure is stopping.

examples:
  - title:
      fr: "Le plan sur 12 mois en YAML"
      en: "The 12-month plan in YAML"
    file: study-plan.yaml
    lang: yaml
    kind: neutral
    code: |
      # study-plan.yaml - versioned in Git, reviewed every month
      start: "2027-01-05"
      weekly_hours: 6          # ~1h on weekdays + one weekend session

      quarters:
        - id: Q1
          theme: Foundations
          topics: [linux, networking, git, python]
          milestone: "Administer a Linux VM: users, permissions, SSH, logs"
        - id: Q2
          theme: Code and pipeline security
          topics: [owasp-top-10, sast, sca, github-actions]
          milestone: "A CI pipeline that fails on a hard-coded secret"
        - id: Q3
          theme: Infrastructure and cloud
          topics: [docker, terraform, cloud-iam, vault]
          milestone: "Deploy a container with Terraform, no secret in code"
        - id: Q4
          theme: Projects and career
          topics: [project-1, project-2, portfolio, interviews]
          milestone: "A portfolio with two documented projects"
    output: |
      # A checklist, not a program: update the milestone status as you go
      # and let the Git history prove your steady progress over the year.
    note:
      fr: "Écrire son plan en YAML est déjà un exercice de métier. Le garder dans Git permet de suivre ses ajustements : un plan vivant, relu chaque mois, bat un plan parfait rangé dans un tiroir."
      en: "Writing your plan in YAML is already a job skill. Keeping it in Git lets you track your adjustments: a living plan, reviewed monthly, beats a perfect plan left in a drawer."

  - title:
      fr: "Suivre son assiduité semaine par semaine"
      en: "Tracking your consistency week by week"
    file: streak.py
    lang: python
    kind: neutral
    code: |
      # Record the hours studied each week, then see the trend.
      # Consistency (few zeros) matters more than occasional big weeks.
      weeks = [6, 5, 6, 0, 7, 6, 5, 6]  # hours studied, week by week

      total = sum(weeks)
      active = sum(1 for h in weeks if h > 0)
      average = total / len(weeks)

      print(f"Weeks tracked : {len(weeks)}")
      print(f"Active weeks  : {active}/{len(weeks)}")
      print(f"Total hours   : {total}")
      print(f"Average/week  : {average:.1f} h")
    output: |
      Weeks tracked : 8
      Active weeks  : 7/8
      Total hours   : 41
      Average/week  : 5.1 h
    note:
      fr: "Sept semaines actives sur huit : voilà la vraie mesure. Une seule semaine à zéro n'est pas un drame, mais trois d'affilée annoncent l'abandon. Suivez l'assiduité, pas la performance d'une semaine."
      en: "Seven active weeks out of eight: that is the real measure. One zero week is no drama, but three in a row signal a drop-out. Track consistency, not one week's performance."

  - title:
      fr: "Transformer un jalon en tâches de la semaine"
      en: "Turning a milestone into this week's tasks"
    file: week-tasks.sh
    lang: bash
    kind: neutral
    code: |
      #!/usr/bin/env bash
      # Break the Q1 milestone "Administer a Linux VM" into doable weekly tasks.
      # Keeping them in a plain file makes progress visible and satisfying.

      cat > week-03-tasks.txt <<'EOF'
      [ ] Create a user 'deploy' and add it to the sudo group
      [ ] Set file permissions so only 'deploy' can read /opt/app/.env
      [ ] Generate an ed25519 SSH key and log in without a password
      [ ] Read /var/log/auth.log and find my own login line
      EOF

      echo "This week's tasks:"
      cat week-03-tasks.txt
    output: |
      This week's tasks:
      [ ] Create a user 'deploy' and add it to the sudo group
      [ ] Set file permissions so only 'deploy' can read /opt/app/.env
      [ ] Generate an ed25519 SSH key and log in without a password
      [ ] Read /var/log/auth.log and find my own login line
    note:
      fr: "Un jalon trimestriel est trop gros pour agir ; découpé en quatre tâches de la semaine, il devient faisable. Cochez-les au fur et à mesure : l'avancement visible est un puissant moteur de motivation."
      en: "A quarterly milestone is too big to act on; split into four weekly tasks, it becomes doable. Tick them off as you go: visible progress is a powerful source of motivation."

mistake:
  fr: |
    **Confondre intensité et régularité.**

    Beaucoup de débutants se jettent sur douze heures d'étude le week-end, s'épuisent, puis ne touchent plus à
    rien pendant trois semaines. Le cerveau n'apprend pas comme ça : il consolide par **répétition espacée**.
    Une heure chaque jour, même courte, grave durablement ce que dix heures d'un coup effacent dès le lendemain.
    Visez un rythme que vous pouvez tenir *un mauvais jour aussi*, pas seulement les jours où vous êtes motivé.
  en: |
    **Confusing intensity with regularity.**

    Many beginners dive into twelve hours of study on the weekend, burn out, then touch nothing for three weeks.
    The brain does not learn that way: it consolidates through **spaced repetition**. One hour every day, even a
    short one, carves in what ten hours in one go erase by the next day. Aim for a rhythm you can keep *on a bad
    day too*, not only on the days you feel motivated.

bestPractice:
  fr: |
    - **La régularité d'abord** : un rythme tenable tous les jours bat un marathon occasionnel.
    - **Respectez l'ordre** : fondations, puis sécurité du code, puis infra/cloud, puis projets.
    - **70/20/10** : la majorité du temps en pratique, le reste à apprendre des autres et un peu de théorie.
    - **Des jalons observables et datés** : une preuve concrète par trimestre, montrable dans votre dépôt.
    - **Un plan vivant** : relisez-le chaque mois et réajustez sans culpabiliser si un jalon glisse.
    - **Un jour de repos** : le cerveau consolide au repos ; ce n'est pas du temps perdu.
  en: |
    - **Regularity first**: a sustainable daily rhythm beats an occasional marathon.
    - **Respect the order**: foundations, then code security, then infra/cloud, then projects.
    - **70/20/10**: most of the time practising, the rest learning from others and a little theory.
    - **Observable, dated milestones**: one concrete proof per quarter, showable in your repo.
    - **A living plan**: review it monthly and readjust without guilt if a milestone slips.
    - **One rest day**: the brain consolidates at rest; it is not wasted time.

exercise:
  statement:
    fr: |
      Construisez votre propre plan d'étude sur 12 mois, adapté à votre temps réel disponible :

      1. Choisissez un nombre d'heures hebdomadaires que vous pouvez **vraiment** tenir (soyez honnête).
      2. Reprenez les quatre trimestres de la leçon et, pour chacun, écrivez **un** jalon observable et daté.
      3. Pour le trimestre en cours, découpez le jalon en au moins trois tâches de la semaine.

      Enregistrez le tout dans votre dépôt `devsecops-journey`.
    en: |
      Build your own 12-month study plan, adapted to the time you really have:

      1. Choose a weekly number of hours you can **truly** keep (be honest).
      2. Take the four quarters from the lesson and, for each, write **one** observable, dated milestone.
      3. For the current quarter, split the milestone into at least three weekly tasks.

      Save everything in your `devsecops-journey` repository.
  solution:
    file: my-study-plan.yaml
    lang: yaml
    code: |
      # my-study-plan.yaml - honest plan, 5 hours a week
      start: "2027-02-01"
      weekly_hours: 5
      quarters:
        - id: Q1
          milestone: "By 2027-04-30: administer a Linux VM on my own"
        - id: Q2
          milestone: "By 2027-07-31: a pipeline that fails on a hard-coded secret"
        - id: Q3
          milestone: "By 2027-10-31: deploy a container with Terraform"
        - id: Q4
          milestone: "By 2028-01-31: a portfolio with two projects"

      current_quarter_tasks:          # Q1, broken into weekly steps
        - "Create and configure a user with sudo"
        - "Set least-privilege permissions on a secrets file"
        - "Log in over SSH with an ed25519 key, no password"
    note:
      fr: "Cinq heures tenues chaque semaine valent mieux que dix prévues et jamais faites. Chaque jalon est daté et observable, et le trimestre en cours est déjà découpé en actions concrètes."
      en: "Five hours kept every week beat ten planned and never done. Each milestone is dated and observable, and the current quarter is already broken into concrete actions."

quiz:
  - q:
      fr: "Qu'est-ce qui fait le plus progresser sur la durée ?"
      en: "What drives the most progress over time?"
    options:
      fr:
        - "Des sessions marathon occasionnelles"
        - "Un rythme régulier et tenable"
        - "Apprendre uniquement la théorie"
        - "Changer de sujet chaque jour"
      en:
        - "Occasional marathon sessions"
        - "A regular, sustainable rhythm"
        - "Learning theory only"
        - "Switching topic every day"
    answer: 1
    why:
      fr: "Le cerveau apprend par répétition espacée : une heure par jour grave durablement ce qu'un marathon efface le lendemain."
      en: "The brain learns through spaced repetition: an hour a day carves in what a marathon erases by the next day."
  - q:
      fr: "Dans la règle 70/20/10, à quoi correspond le 70 % ?"
      en: "In the 70/20/10 rule, what does the 70% stand for?"
    options:
      fr:
        - "À la théorie pure (lire, regarder)"
        - "Au repos"
        - "À la pratique (taper, casser, réparer)"
        - "Aux réseaux sociaux techniques"
      en:
        - "Pure theory (read, watch)"
        - "Rest"
        - "Practice (type, break, fix)"
        - "Technical social networks"
    answer: 2
    why:
      fr: "On apprend surtout en faisant : la majeure partie du temps doit être de la pratique, pas de la lecture passive."
      en: "You learn mostly by doing: the bulk of the time must be practice, not passive reading."
  - q:
      fr: "Qu'est-ce qu'un bon jalon (milestone) ?"
      en: "What is a good milestone?"
    options:
      fr:
        - "Une preuve observable, datée et à votre portée"
        - "Une note que l'on garde pour soi"
        - "Un objectif vague sans échéance"
        - "La lecture d'une leçon"
      en:
        - "An observable, dated, within-reach proof"
        - "A note kept to yourself"
        - "A vague goal with no deadline"
        - "Reading a lesson"
    answer: 0
    why:
      fr: "Un jalon se montre (dépôt, démo), a une date, et reste assez petit pour être atteint : « je me connecte en SSH par clé », pas « j'ai lu »."
      en: "A milestone can be shown (repo, demo), has a date, and stays small enough to reach: \"I log in with an SSH key\", not \"I read\"."
  - q:
      fr: "Dans quel ordre suivre les quatre trimestres ?"
      en: "In which order should the four quarters be followed?"
    options:
      fr:
        - "Cloud, puis fondations, puis projets, puis pipeline"
        - "Projets d'abord, fondations en dernier"
        - "Peu importe, l'ordre est libre"
        - "Fondations, sécurité du code, infra/cloud, projets"
      en:
        - "Cloud, then foundations, then projects, then pipeline"
        - "Projects first, foundations last"
        - "Any order, it is free"
        - "Foundations, code security, infra/cloud, projects"
    answer: 3
    why:
      fr: "Chaque trimestre s'appuie sur le précédent : on ne sécurise bien le cloud qu'après avoir compris Linux, le réseau et un langage."
      en: "Each quarter builds on the last: you only secure the cloud well after understanding Linux, networking and a language."
  - q:
      fr: "Que faire si un jalon trimestriel est raté ?"
      en: "What should you do if a quarterly milestone is missed?"
    options:
      fr:
        - "Abandonner le plan"
        - "Ignorer et passer à la suite sans rien changer"
        - "Y voir une information : redécouper et ajuster le rythme"
        - "Recommencer toute l'année depuis le début"
      en:
        - "Abandon the plan"
        - "Ignore it and move on without changing anything"
        - "Treat it as information: re-split and adjust the pace"
        - "Restart the whole year from scratch"
    answer: 2
    why:
      fr: "Un jalon raté signale un sujet trop gros ou un rythme trop ambitieux : on redécoupe et on continue, le seul échec étant d'arrêter."
      en: "A missed milestone signals too big a topic or too ambitious a pace: you re-split and carry on, the only failure being to stop."
