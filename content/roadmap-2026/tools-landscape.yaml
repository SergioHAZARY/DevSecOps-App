description:
  fr: "Découvrir le paysage des outils DevSecOps par catégorie, comprendre à quoi sert chaque famille et éviter le piège de tout vouloir installer."
  en: "Discover the DevSecOps tools landscape by category, understand what each family is for and avoid the trap of installing everything."
duration: 18

intro:
  fr: |
    Quand on débute, la liste des outils DevSecOps donne le vertige : des centaines de noms, des logos partout,
    de nouveaux projets chaque mois. On a l'impression qu'il faut tout connaître. C'est faux, et c'est même le
    meilleur moyen de ne rien apprendre.

    Imaginez un magasin de bricolage. Vous n'avez pas besoin de connaître chaque marque de perceuse : vous avez
    besoin de savoir qu'il existe un **rayon perçage**, un **rayon mesure**, un **rayon sécurité**. Les outils
    se rangent par **fonction**. Une fois les rayons compris, choisir une marque devient facile et
    interchangeable.

    Dans cette leçon, vous allez ranger les outils DevSecOps par **catégorie** (le rayon), avec un ou deux
    exemples par catégorie. L'objectif n'est pas de les installer tous, mais de savoir, devant un besoin, dans
    quel rayon chercher.
  en: |
    When you start out, the list of DevSecOps tools is dizzying: hundreds of names, logos everywhere, new
    projects every month. It feels like you must know them all. That is false, and it is the surest way to
    learn nothing.

    Picture a hardware store. You do not need to know every brand of drill: you need to know there is a
    **drilling aisle**, a **measuring aisle**, a **safety aisle**. Tools are organised by **function**. Once
    the aisles make sense, picking a brand becomes easy and interchangeable.

    In this lesson you will sort DevSecOps tools by **category** (the aisle), with one or two examples each.
    The goal is not to install them all, but to know, facing a need, which aisle to look in.

sections:
  - heading:
      fr: "Les catégories qui comptent"
      en: "The categories that matter"
    body:
      fr: |
        La sécurité suit le cycle de vie du logiciel : on protège le code, puis les dépendances, puis l'image,
        puis l'infrastructure, puis ce qui tourne en production. Chaque étape a sa famille d'outils.

        | Catégorie | Acronyme | Ce qu'elle cherche | Exemples 2026 |
        |---|---|---|---|
        | Analyse de secrets | — | Mots de passe et clés en clair dans le code | Gitleaks, TruffleHog |
        | Analyse statique | SAST | Failles dans *votre* code source | Semgrep, Bandit, CodeQL |
        | Analyse des dépendances | SCA | Failles dans le code *des autres* | Trivy, Grype, Dependabot |
        | Scan d'images de conteneurs | — | Paquets vulnérables dans une image Docker | Trivy, Grype |
        | Analyse d'Infrastructure as Code | IaC | Mauvaises configurations Terraform/K8s | Trivy, Checkov |
        | Analyse dynamique | DAST | Failles sur l'appli qui tourne | OWASP ZAP |
        | Gestion des secrets | — | Stocker et distribuer les secrets | HashiCorp Vault |
        | Politique en code | — | Imposer des règles automatiquement | OPA / Rego, Kyverno |
        | Supervision / détection | — | Repérer un comportement anormal en production | Falco, Wazuh |

        Remarquez qu'un même outil, **Trivy**, couvre plusieurs rayons (dépendances, images, IaC). C'est la
        tendance 2026 : des outils « couteau suisse » qui remplacent plusieurs scanners spécialisés.
      en: |
        Security follows the software lifecycle: you protect the code, then the dependencies, then the image,
        then the infrastructure, then whatever runs in production. Each step has its tool family.

        | Category | Acronym | What it looks for | 2026 examples |
        |---|---|---|---|
        | Secret scanning | — | Clear-text passwords and keys in the code | Gitleaks, TruffleHog |
        | Static analysis | SAST | Flaws in *your* source code | Semgrep, Bandit, CodeQL |
        | Dependency analysis | SCA | Flaws in *other people's* code | Trivy, Grype, Dependabot |
        | Container image scanning | — | Vulnerable packages in a Docker image | Trivy, Grype |
        | Infrastructure as Code scanning | IaC | Misconfigured Terraform/K8s | Trivy, Checkov |
        | Dynamic analysis | DAST | Flaws on the running app | OWASP ZAP |
        | Secret management | — | Store and distribute secrets | HashiCorp Vault |
        | Policy as code | — | Enforce rules automatically | OPA / Rego, Kyverno |
        | Monitoring / detection | — | Spot abnormal behaviour in production | Falco, Wazuh |

        Notice that one tool, **Trivy**, covers several aisles (dependencies, images, IaC). This is the 2026
        trend: "Swiss-army" tools replacing several specialised scanners.
  - heading:
      fr: "SAST, DAST, SCA : la différence en une phrase"
      en: "SAST, DAST, SCA: the difference in one sentence"
    body:
      fr: |
        Trois acronymes reviennent sans cesse. Voici la différence, simplement :

        - **SAST** (*Static Application Security Testing*) lit votre code **à l'arrêt**, comme un correcteur
          d'orthographe qui relit un texte sans l'exécuter. Il trouve une injection SQL en lisant la ligne.
        - **DAST** (*Dynamic Application Security Testing*) attaque l'application **pendant qu'elle tourne**,
          comme un cambrioleur qui essaie toutes les portes du dehors. Il ne voit pas le code, seulement les
          réponses.
        - **SCA** (*Software Composition Analysis*) ne regarde ni votre code ni l'appli, mais la **liste de vos
          dépendances** : « utilisez-vous une bibliothèque dont une faille est connue ? »

        Les trois sont **complémentaires**. SAST voit du code que DAST ne peut pas atteindre ; DAST voit des
        failles de configuration que SAST ignore ; SCA couvre le code que vous n'avez pas écrit. Un bon pipeline
        combine les trois.
      en: |
        Three acronyms come up constantly. Here is the difference, simply:

        - **SAST** (*Static Application Security Testing*) reads your code **at rest**, like a spell-checker
          proofreading a text without running it. It finds a SQL injection by reading the line.
        - **DAST** (*Dynamic Application Security Testing*) attacks the application **while it runs**, like a
          burglar trying every door from outside. It never sees the code, only the responses.
        - **SCA** (*Software Composition Analysis*) looks neither at your code nor the app, but at your **list
          of dependencies**: "are you using a library with a known flaw?"

        The three are **complementary**. SAST sees code DAST cannot reach; DAST sees configuration flaws SAST
        ignores; SCA covers code you did not write. A good pipeline combines all three.

examples:
  - title:
      fr: "Un seul outil, plusieurs rayons : Trivy"
      en: "One tool, several aisles: Trivy"
    file: scan-with-trivy.sh
    lang: bash
    kind: secure
    code: |
      # Trivy is a "Swiss-army" scanner: dependencies, images and IaC in one tool.

      # 1. Scan the project's dependencies (SCA) for known vulnerabilities
      trivy fs --scanners vuln .

      # 2. Scan a container image before shipping it
      trivy image nginx:1.27

      # 3. Scan Terraform/Kubernetes files for misconfigurations (IaC)
      trivy config ./infra
    output: |
      nginx:1.27 (debian 12.7)
      ===========================
      Total: 2 (HIGH: 2, CRITICAL: 0)

      ┌───────────────┬────────────────┬──────────┬─────────┬───────────────┐
      │    Library    │ Vulnerability  │ Severity │ Status  │ Fixed Version │
      ├───────────────┼────────────────┼──────────┼─────────┼───────────────┤
      │ libxml2       │ CVE-2024-25062 │ HIGH     │ fixed   │ 2.9.14+dfsg-1 │
      └───────────────┴────────────────┴──────────┴─────────┴───────────────┘
    note:
      fr: "Un même outil répond à trois besoins. Pour débuter, apprenez à fond **un** scanner polyvalent comme Trivy plutôt que d'en empiler cinq : vous couvrez déjà dépendances, images et IaC."
      en: "One tool answers three needs. To start, learn **one** versatile scanner like Trivy deeply instead of stacking five: you already cover dependencies, images and IaC."

  - title:
      fr: "SAST sur du vrai code : Semgrep trouve une faille"
      en: "SAST on real code: Semgrep finds a flaw"
    file: scan-code.sh
    lang: bash
    kind: secure
    code: |
      # Semgrep reads source code at rest (SAST) using rule packs.
      # The "auto" config picks rules matching the languages it detects.
      semgrep --config auto app.py
    output: |
      Scanning 1 file.

        app.py
        ❯❯❱ python.lang.security.audit.dangerous-subprocess-use
              Detected subprocess function 'os.system' with user input.
              This can lead to command injection.

              12┆ os.system("ping -c 1 " + host)

      Ran 120 rules on 1 file: 1 finding.
    note:
      fr: "Semgrep lit le code sans l'exécuter et repère une injection de commande (`os.system` avec une entrée utilisateur). C'est typiquement ce qu'un pipeline lance à chaque push pour bloquer la faille avant la fusion."
      en: "Semgrep reads the code without running it and spots a command injection (`os.system` with user input). This is typically what a pipeline runs on every push to block the flaw before merge."

  - title:
      fr: "Choisir le bon rayon selon le besoin"
      en: "Picking the right aisle for the need"
    file: pick-tool.py
    lang: python
    kind: neutral
    code: |
      # A decision helper: describe your need, get the category to look in.
      needs = {
          "a key is hard-coded in my code": "secret scanning (Gitleaks)",
          "is my code vulnerable": "SAST (Semgrep)",
          "is a library I use vulnerable": "SCA (Trivy)",
          "is my Docker image vulnerable": "image scanning (Trivy)",
          "is my Terraform misconfigured": "IaC scanning (Trivy, Checkov)",
          "attack my running app": "DAST (OWASP ZAP)",
      }

      for need, category in needs.items():
          print(f"- I want to know: {need}")
          print(f"  -> look in: {category}")
    output: |
      - I want to know: a key is hard-coded in my code
        -> look in: secret scanning (Gitleaks)
      - I want to know: is my code vulnerable
        -> look in: SAST (Semgrep)
      - I want to know: is a library I use vulnerable
        -> look in: SCA (Trivy)
      - I want to know: is my Docker image vulnerable
        -> look in: image scanning (Trivy)
      - I want to know: is my Terraform misconfigured
        -> look in: IaC scanning (Trivy, Checkov)
      - I want to know: attack my running app
        -> look in: DAST (OWASP ZAP)
    note:
      fr: "Devant un nouvel outil inconnu, posez-vous une seule question : « quel rayon ? ». Si vous savez ranger un outil dans une catégorie, vous savez à quoi il sert et par quoi le remplacer."
      en: "Facing a new unknown tool, ask one question: \"which aisle?\". If you can file a tool into a category, you know what it is for and what can replace it."

mistake:
  fr: |
    **Vouloir installer et apprendre tous les outils en même temps.**

    Le paysage change vite : un outil populaire aujourd'hui peut être remplacé demain (tfsec a été absorbé par
    Trivy, par exemple). Si vous mémorisez des marques, vous serez toujours en retard. Si vous comprenez les
    **catégories** et la logique SAST/DAST/SCA, vous adoptez n'importe quel nouvel outil en une après-midi.
    Apprenez les rayons d'abord, les marques ensuite — et une seule marque par rayon pour commencer.
  en: |
    **Trying to install and learn every tool at once.**

    The landscape changes fast: a popular tool today may be replaced tomorrow (tfsec was folded into Trivy, for
    example). If you memorise brands, you will always be behind. If you understand the **categories** and the
    SAST/DAST/SCA logic, you adopt any new tool in an afternoon. Learn the aisles first, the brands second — and
    one brand per aisle to begin with.

bestPractice:
  fr: |
    - **Pensez catégorie, pas marque** : chaque outil se range dans un rayon (secrets, SAST, SCA, IaC...).
    - **Un outil par catégorie** pour débuter ; comparez les alternatives seulement quand le besoin apparaît.
    - **Préférez les outils polyvalents et libres** (Trivy, Semgrep) : une seule prise en main couvre plusieurs besoins.
    - **Privilégiez ce qui s'intègre au pipeline** : un scanner utile est un scanner qui tourne automatiquement.
    - **Méfiez-vous du neuf** : attendez qu'un outil soit stable et maintenu avant d'en faire une dépendance.
  en: |
    - **Think category, not brand**: each tool files into an aisle (secrets, SAST, SCA, IaC...).
    - **One tool per category** to start; compare alternatives only when the need appears.
    - **Prefer versatile, open-source tools** (Trivy, Semgrep): one learning curve covers several needs.
    - **Favour what integrates into the pipeline**: a useful scanner is one that runs automatically.
    - **Be wary of the brand-new**: wait for a tool to be stable and maintained before depending on it.

exercise:
  statement:
    fr: |
      Pour chacun des besoins suivants, indiquez la **catégorie** d'outil à utiliser (secrets, SAST, SCA,
      scan d'image, IaC, DAST, gestion des secrets, politique en code) et un exemple d'outil 2026 :

      1. Vérifier qu'aucune clé d'API n'est écrite en clair dans le dépôt.
      2. Savoir si une bibliothèque Python que vous importez contient une faille connue.
      3. Détecter une injection SQL en lisant le code sans l'exécuter.
      4. Tester l'application pendant qu'elle tourne, de l'extérieur.
      5. Vérifier qu'un fichier Terraform ne crée pas un bucket S3 public.

      Écrivez vos réponses dans un petit fichier.
    en: |
      For each of the following needs, give the tool **category** to use (secrets, SAST, SCA, image scan, IaC,
      DAST, secret management, policy as code) and an example 2026 tool:

      1. Check that no API key is written in clear text in the repository.
      2. Know whether a Python library you import contains a known flaw.
      3. Detect a SQL injection by reading the code without running it.
      4. Test the application while it runs, from the outside.
      5. Check that a Terraform file does not create a public S3 bucket.

      Write your answers in a small file.
  solution:
    file: answers.md
    lang: markdown
    code: |
      # Which aisle for each need?

      1. Clear-text API key in the repo -> **secret scanning** (Gitleaks)
      2. Vulnerable Python library      -> **SCA** (Trivy)
      3. SQL injection read in the code -> **SAST** (Semgrep, Bandit)
      4. Attack the running app         -> **DAST** (OWASP ZAP)
      5. Public S3 bucket in Terraform  -> **IaC scanning** (Trivy, Checkov)
    note:
      fr: "L'exercice n'est pas de retenir des marques, mais de relier un besoin à un rayon. Un même outil (Trivy) apparaît deux fois : c'est normal, les outils polyvalents couvrent plusieurs catégories."
      en: "The exercise is not to memorise brands, but to link a need to an aisle. The same tool (Trivy) shows up twice: that is normal, versatile tools cover several categories."

quiz:
  - q:
      fr: "Quelle est la bonne façon d'aborder le paysage des outils ?"
      en: "What is the right way to approach the tools landscape?"
    options:
      fr:
        - "Mémoriser un maximum de marques"
        - "Comprendre les catégories, puis une marque par catégorie"
        - "Installer tous les outils sur sa machine"
        - "N'utiliser que l'outil le plus récent"
      en:
        - "Memorise as many brands as possible"
        - "Understand the categories, then one brand per category"
        - "Install every tool on your machine"
        - "Use only the newest tool"
    answer: 1
    why:
      fr: "Les marques changent, les catégories restent : comprendre les rayons permet d'adopter n'importe quel outil rapidement."
      en: "Brands change, categories stay: understanding the aisles lets you adopt any tool quickly."
  - q:
      fr: "Que cherche l'analyse des dépendances (SCA) ?"
      en: "What does dependency analysis (SCA) look for?"
    options:
      fr:
        - "Des failles dans le code que vous avez écrit"
        - "Des secrets en clair dans l'historique Git"
        - "Des failles connues dans les bibliothèques que vous utilisez"
        - "Des comportements anormaux en production"
      en:
        - "Flaws in the code you wrote"
        - "Clear-text secrets in the Git history"
        - "Known flaws in the libraries you use"
        - "Abnormal behaviour in production"
    answer: 2
    why:
      fr: "Le SCA regarde le code des autres : vos dépendances, pour savoir si l'une d'elles a une faille connue."
      en: "SCA looks at other people's code: your dependencies, to see whether one has a known flaw."
  - q:
      fr: "Quelle est la différence entre SAST et DAST ?"
      en: "What is the difference between SAST and DAST?"
    options:
      fr:
        - "SAST lit le code à l'arrêt, DAST attaque l'appli qui tourne"
        - "SAST est payant, DAST est gratuit"
        - "SAST sert pour le cloud, DAST pour Linux"
        - "Il n'y a aucune différence"
      en:
        - "SAST reads the code at rest, DAST attacks the running app"
        - "SAST is paid, DAST is free"
        - "SAST is for the cloud, DAST for Linux"
        - "There is no difference"
    answer: 0
    why:
      fr: "SAST analyse le code source sans l'exécuter ; DAST teste l'application en fonctionnement, de l'extérieur. Ils sont complémentaires."
      en: "SAST analyses source code without running it; DAST tests the running application from the outside. They are complementary."
  - q:
      fr: "Pourquoi Trivy est-il souvent conseillé aux débutants ?"
      en: "Why is Trivy often recommended to beginners?"
    options:
      fr:
        - "Parce qu'il remplace tout besoin de Linux"
        - "Parce qu'il est le plus ancien"
        - "Parce qu'il couvre plusieurs catégories (dépendances, images, IaC) en un seul outil"
        - "Parce qu'il n'affiche jamais de faux positifs"
      en:
        - "Because it removes any need for Linux"
        - "Because it is the oldest"
        - "Because it covers several categories (dependencies, images, IaC) in one tool"
        - "Because it never shows false positives"
    answer: 2
    why:
      fr: "Trivy est un outil polyvalent : une seule prise en main couvre les dépendances, les images de conteneurs et l'IaC."
      en: "Trivy is versatile: one learning curve covers dependencies, container images and IaC."
  - q:
      fr: "Quel outil choisir pour détecter une clé d'API écrite en clair dans le dépôt ?"
      en: "Which tool to pick to detect an API key written in clear text in the repo?"
    options:
      fr:
        - "Un outil DAST comme OWASP ZAP"
        - "Un outil de supervision comme Falco"
        - "Un gestionnaire de secrets comme Vault"
        - "Un scanner de secrets comme Gitleaks"
      en:
        - "A DAST tool like OWASP ZAP"
        - "A monitoring tool like Falco"
        - "A secret manager like Vault"
        - "A secret scanner like Gitleaks"
    answer: 3
    why:
      fr: "La détection de secrets en clair dans le code relève du rayon « analyse de secrets », dont Gitleaks est un exemple courant."
      en: "Detecting clear-text secrets in the code belongs to the \"secret scanning\" aisle, of which Gitleaks is a common example."
