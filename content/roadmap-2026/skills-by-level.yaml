description:
  fr: "Savoir quelles compétences un ingénieur DevSecOps junior, confirmé puis senior doit maîtriser, et comment passer d'un niveau au suivant."
  en: "Know which skills a junior, mid-level then senior DevSecOps engineer must master, and how to move from one level to the next."
duration: 18

intro:
  fr: |
    « Junior », « confirmé », « senior » : ces mots reviennent dans toutes les offres d'emploi, mais que
    recouvrent-ils vraiment ? Un **niveau** n'est pas une question d'années passées sur une chaise. C'est un
    ensemble de choses que vous savez faire **seul**, puis **pour les autres**, puis **à l'échelle de toute
    une organisation**.

    Pensez à la cuisine. Le commis sait exécuter une recette qu'on lui donne. Le chef de partie gère tout un
    poste sans supervision. Le chef de cuisine conçoit la carte, forme l'équipe et tient le budget. Personne ne
    saute d'étape : on monte en responsabilité au fur et à mesure que l'autonomie grandit.

    Dans cette leçon, vous allez découvrir, niveau par niveau, les compétences attendues d'un ingénieur
    DevSecOps, et surtout **ce qui fait la différence** entre deux niveaux. À la fin, vous saurez vous
    situer honnêtement et choisir la prochaine compétence à travailler.
  en: |
    "Junior", "mid-level", "senior": these words show up in every job ad, but what do they really mean? A
    **level** is not about years spent in a chair. It is a set of things you can do **on your own**, then
    **for others**, then **at the scale of a whole organization**.

    Think of a kitchen. The commis can follow a recipe handed to them. The station chef runs a whole station
    without supervision. The head chef designs the menu, trains the team and manages the budget. Nobody skips
    a stage: responsibility grows as autonomy grows.

    In this lesson you will discover, level by level, the skills expected of a DevSecOps engineer, and above
    all **what makes the difference** between two levels. By the end you will be able to place yourself
    honestly and pick the next skill to work on.

sections:
  - heading:
      fr: "Les trois niveaux en une image"
      en: "The three levels in one picture"
    body:
      fr: |
        On peut résumer la progression par le degré d'**autonomie** et la **portée** de ce que vous faites :

        | Niveau | Mot-clé | Ce que vous faites | Qui vous aide |
        |---|---|---|---|
        | **Junior** | *exécuter* | Vous réalisez des tâches bien définies avec de l'aide | Un confirmé relit et corrige |
        | **Confirmé** | *résoudre* | Vous prenez une fonctionnalité de bout en bout, seul | Vous demandez un avis en cas de doute |
        | **Senior** | *orienter* | Vous définissez des standards, aidez les autres, arbitrez | Vous êtes la personne qu'on consulte |

        La barre n'est pas la même partout : dans une petite entreprise, un junior touche vite à tout ; dans un
        grand groupe, les rôles sont plus découpés. Mais la logique reste la même : **plus on monte, moins on
        a besoin qu'on vérifie derrière soi**, et plus on fait monter les autres.
      en: |
        Progress can be summed up by the degree of **autonomy** and the **reach** of what you do:

        | Level | Keyword | What you do | Who helps you |
        |---|---|---|---|
        | **Junior** | *execute* | You carry out well-defined tasks with help | A mid-level reviews and corrects |
        | **Mid-level** | *solve* | You own a feature end to end, on your own | You ask for advice when in doubt |
        | **Senior** | *steer* | You define standards, help others, make calls | You are the person people consult |

        The bar is not the same everywhere: in a small company a junior quickly touches everything; in a large
        group roles are more divided. But the logic holds: **the higher you go, the less someone needs to check
        behind you**, and the more you lift others up.
  - heading:
      fr: "Compétences par niveau"
      en: "Skills by level"
    body:
      fr: |
        **Junior** — vous savez utiliser les outils du quotidien :

        - Linux en ligne de commande (naviguer, droits, logs), Git et une pull request.
        - Un langage de script (Python ou Bash) pour automatiser une petite tâche.
        - Lire un pipeline CI existant et comprendre pourquoi une étape échoue.
        - Reconnaître les failles de base : secret en clair, injection SQL, dépendance vulnérable.

        **Confirmé** — vous livrez de façon autonome et sûre :

        - Concevoir un pipeline CI/CD avec contrôles de sécurité (SAST, SCA, scan de secrets).
        - Écrire de l'Infrastructure as Code (Terraform) et des conteneurs durcis.
        - Gérer les secrets avec un coffre, appliquer le moindre privilège sur le cloud.
        - Trier les alertes : distinguer une vraie faille d'un faux positif, prioriser par le risque.

        **Senior** — vous décidez et vous entraînez l'équipe :

        - Définir une politique de sécurité en code (modèles de menace, OPA/Rego, standards de pipeline).
        - Concevoir une architecture résiliente et répondre à un incident.
        - Mesurer (métriques DORA, délai de correction) et améliorer en continu.
        - Mentorat, revue, et traduction du risque technique en décisions pour les équipes dirigeantes.
      en: |
        **Junior** — you can use the everyday tools:

        - Linux on the command line (navigate, permissions, logs), Git and a pull request.
        - A scripting language (Python or Bash) to automate a small task.
        - Read an existing CI pipeline and understand why a step fails.
        - Recognise the basic flaws: clear-text secret, SQL injection, vulnerable dependency.

        **Mid-level** — you ship autonomously and safely:

        - Design a CI/CD pipeline with security checks (SAST, SCA, secret scanning).
        - Write Infrastructure as Code (Terraform) and hardened containers.
        - Manage secrets with a vault, apply least privilege on the cloud.
        - Triage alerts: tell a real flaw from a false positive, prioritise by risk.

        **Senior** — you decide and you grow the team:

        - Define security as code (threat models, OPA/Rego, pipeline standards).
        - Design resilient architecture and respond to an incident.
        - Measure (DORA metrics, time to fix) and improve continuously.
        - Mentoring, review, and translating technical risk into decisions for leadership.
  - heading:
      fr: "Les compétences humaines comptent autant"
      en: "Human skills matter just as much"
    body:
      fr: |
        DevSecOps est un métier de **collaboration** : la sécurité ne progresse que si les développeurs
        coopèrent. Les compétences non techniques pèsent donc lourd, et de plus en plus à mesure qu'on monte :

        - **Communication** : expliquer un risque sans faire peur, écrire un ticket clair, documenter.
        - **Empathie** : proposer la correction la plus simple pour le développeur, pas la plus « pure ».
        - **Priorisation** : tout corriger est impossible ; choisir ce qui réduit le plus le risque.
        - **Apprentissage continu** : les outils changent, l'état d'esprit « j'apprends toujours » reste.

        Un senior qui sait coder mais que personne n'écoute a moins d'impact qu'un confirmé qui fait adhérer
        trois équipes à de bonnes pratiques. L'influence, c'est aussi une compétence.
      en: |
        DevSecOps is a job of **collaboration**: security only improves if developers cooperate. Soft skills
        therefore carry real weight, and more so as you climb:

        - **Communication**: explain a risk without scaring people, write a clear ticket, document.
        - **Empathy**: propose the simplest fix for the developer, not the most "pure" one.
        - **Prioritisation**: fixing everything is impossible; choose what reduces risk the most.
        - **Continuous learning**: tools change, the "I am always learning" mindset stays.

        A senior who can code but whom nobody listens to has less impact than a mid-level who gets three teams
        to adopt good practices. Influence is a skill too.

examples:
  - title:
      fr: "Une grille d'auto-évaluation en YAML"
      en: "A self-assessment grid in YAML"
    file: self-assessment.yaml
    lang: yaml
    kind: neutral
    code: |
      # Rate yourself 0-3 on each skill: 0 = never done, 3 = I teach it
      level_target: mid        # junior | mid | senior
      skills:
        linux_cli: 3
        git_pull_request: 3
        python_or_bash: 2
        read_ci_pipeline: 2
        design_ci_pipeline: 1  # weak point: below the mid-level target
        terraform_iac: 1       # weak point
        secret_management: 2
        triage_findings: 1     # weak point
        threat_modeling: 0     # senior skill, expected to be low for now
    output: |
      # No program to run: this file is a checklist you keep in Git and
      # update every month. The three "1" values are your next goals.
    note:
      fr: "Noter honnêtement chaque compétence transforme un ressenti flou (« je ne suis pas prêt ») en plan d'action clair : ici, concevoir un pipeline, apprendre Terraform et trier les alertes sont les trois prochains chantiers."
      en: "Scoring each skill honestly turns a vague feeling (\"I'm not ready\") into a clear action plan: here, designing a pipeline, learning Terraform and triaging findings are the next three goals."

  - title:
      fr: "Prouver une compétence junior : automatiser une vérification"
      en: "Proving a junior skill: automating a check"
    file: check-updates.sh
    lang: bash
    kind: neutral
    code: |
      #!/usr/bin/env bash
      # A junior-level task: list packages that have a security update waiting.
      set -eu

      # Refresh the package lists first (quiet), then count upgradable packages
      sudo apt-get update -qq
      count=$(apt list --upgradable 2>/dev/null | grep -c 'security' || true)

      echo "Security updates available: $count"
      if [ "$count" -gt 0 ]; then
        echo "Run 'sudo apt-get upgrade' to apply them."
      fi
    output: |
      Security updates available: 4
      Run 'sudo apt-get upgrade' to apply them.
    note:
      fr: "Un petit script utile, testé et versionné dans Git, vaut mieux qu'une ligne de CV. C'est exactement le type de preuve qu'un recruteur cherche chez un junior : l'automatisation d'une tâche réelle."
      en: "A small, useful script, tested and versioned in Git, beats a line on a résumé. It is exactly the kind of proof a recruiter looks for in a junior: automating a real task."

  - title:
      fr: "Penser comme un confirmé : prioriser par le risque"
      en: "Thinking like a mid-level: prioritise by risk"
    file: triage.py
    lang: python
    kind: neutral
    code: |
      # Mid-level skill: not all findings deserve the same urgency.
      # Risk = how bad it is (severity) x how reachable it is (exposure).
      findings = [
          {"id": "SQLi in /login", "severity": 9, "exposure": 10},   # public, critical
          {"id": "Old TLS on internal API", "severity": 6, "exposure": 3},
          {"id": "Verbose error page", "severity": 3, "exposure": 8},
          {"id": "Unused debug flag", "severity": 2, "exposure": 1},
      ]

      # Sort by risk score, highest first: that is the order to fix them in
      for f in sorted(findings, key=lambda f: f["severity"] * f["exposure"], reverse=True):
          score = f["severity"] * f["exposure"]
          print(f"{score:>3}  {f['id']}")
    output: |
       90  SQLi in /login
       24  Verbose error page
       18  Old TLS on internal API
        2  Unused debug flag
    note:
      fr: "Un junior signale toutes les failles ; un confirmé les **classe**. Une injection SQL sur une page publique passe avant une erreur verbeuse, même si les deux sont à corriger. Savoir ordonner le travail est une marque de niveau."
      en: "A junior reports all flaws; a mid-level **ranks** them. A SQL injection on a public page comes before a verbose error, even if both must be fixed. Knowing how to order the work is a mark of level."

mistake:
  fr: |
    **Croire qu'on « saute » un niveau en apprenant un outil à la mode.**

    Installer Kubernetes ou citer le dernier scanner ne fait pas de vous un senior. Un niveau se prouve par
    l'**autonomie** et la capacité à faire réussir les autres, pas par une liste d'outils. À l'inverse,
    beaucoup de juniors se dévalorisent (« je ne connais pas Terraform ») alors qu'ils maîtrisent déjà Linux,
    Git et un langage : c'est exactement ce qu'on attend d'eux. Situez-vous sur l'autonomie, pas sur le buzz.
  en: |
    **Believing you "skip" a level by learning a trendy tool.**

    Installing Kubernetes or name-dropping the latest scanner does not make you a senior. A level is proven by
    **autonomy** and by the ability to make others succeed, not by a list of tools. Conversely, many juniors
    undersell themselves ("I don't know Terraform") while they already master Linux, Git and a language: that
    is exactly what is expected of them. Place yourself on autonomy, not on hype.

bestPractice:
  fr: |
    - **Évaluez-vous sur l'autonomie** : « puis-je faire cette tâche seul, de bout en bout ? »
    - **Un chantier à la fois** : choisissez la compétence la plus en retard par rapport à votre niveau cible.
    - **Prouvez par du concret** : chaque compétence acquise se traduit par un script, un pipeline ou un projet dans Git.
    - **Travaillez les compétences humaines** : communiquer un risque clairement a autant de valeur que le corriger.
    - **Demandez des retours** : un confirmé ou un senior qui relit votre travail accélère votre progression.
  en: |
    - **Assess yourself on autonomy**: "can I do this task alone, end to end?"
    - **One focus at a time**: pick the skill that lags most behind your target level.
    - **Prove with concrete work**: every acquired skill becomes a script, a pipeline or a project in Git.
    - **Work on soft skills**: communicating a risk clearly is worth as much as fixing it.
    - **Ask for feedback**: a mid-level or senior reviewing your work speeds up your progress.

exercise:
  statement:
    fr: |
      Reprenez la grille d'auto-évaluation YAML de la leçon et adaptez-la à vous :

      1. Fixez votre `level_target` (`junior`, `mid` ou `senior`).
      2. Notez-vous honnêtement de 0 à 3 sur au moins six compétences de la leçon.
      3. Identifiez vos **trois** compétences les plus faibles par rapport à la cible.
      4. Écrivez, pour chacune, une action concrète à mener ce mois-ci.

      Enregistrez le fichier dans votre dépôt `devsecops-journey`.
    en: |
      Take the YAML self-assessment grid from the lesson and adapt it to yourself:

      1. Set your `level_target` (`junior`, `mid` or `senior`).
      2. Score yourself honestly from 0 to 3 on at least six skills from the lesson.
      3. Identify your **three** weakest skills relative to the target.
      4. Write, for each, one concrete action to take this month.

      Save the file in your `devsecops-journey` repository.
  solution:
    file: my-growth-plan.yaml
    lang: yaml
    code: |
      # my-growth-plan.yaml - reviewed on the first of each month
      level_target: junior
      skills:
        linux_cli: 2
        git_pull_request: 2
        python_or_bash: 1       # weak point
        read_ci_pipeline: 1     # weak point
        recognise_basic_flaws: 1 # weak point
        secret_management: 2

      # Three concrete actions for this month, one per weak skill
      actions_this_month:
        - "Write a Python script that scans a folder for files named *.key or .env"
        - "Add a GitHub Actions job that runs gitleaks on every push to a test repo"
        - "Read the OWASP Top 10 page and spot one flaw in my own old code"
    note:
      fr: "La clé est le lien entre une faiblesse notée et une action mesurable et datée. Un plan sans action reste un vœu ; un plan avec trois actions pour le mois est exécutable."
      en: "The key is the link between a scored weakness and a measurable, dated action. A plan without actions stays a wish; a plan with three actions for the month is executable."

quiz:
  - q:
      fr: "Qu'est-ce qui distingue le mieux un niveau d'un autre ?"
      en: "What best distinguishes one level from another?"
    options:
      fr:
        - "Le degré d'autonomie et la portée de ce qu'on fait"
        - "Le nombre d'outils installés sur sa machine"
        - "Le nombre d'années passées dans l'entreprise"
        - "La vitesse de frappe au clavier"
      en:
        - "The degree of autonomy and the reach of what you do"
        - "The number of tools installed on your machine"
        - "The number of years spent in the company"
        - "Typing speed on the keyboard"
    answer: 0
    why:
      fr: "On monte en niveau quand on fait les choses seul, puis pour les autres, puis à l'échelle de l'organisation — pas en collectionnant des outils ou des années."
      en: "You level up when you do things alone, then for others, then at organization scale — not by collecting tools or years."
  - q:
      fr: "Laquelle de ces compétences est typiquement attendue d'un junior ?"
      en: "Which of these skills is typically expected of a junior?"
    options:
      fr:
        - "Définir la politique de sécurité en code pour toute l'entreprise"
        - "Répondre à un incident de sécurité majeur"
        - "Utiliser Linux en ligne de commande et ouvrir une pull request"
        - "Concevoir une architecture résiliente multi-région"
      en:
        - "Define security as code for the whole company"
        - "Respond to a major security incident"
        - "Use Linux on the command line and open a pull request"
        - "Design a resilient multi-region architecture"
    answer: 2
    why:
      fr: "Linux, Git et un langage de script sont le socle du junior ; les trois autres relèvent du niveau senior."
      en: "Linux, Git and a scripting language are the junior foundation; the other three belong to the senior level."
  - q:
      fr: "Pourquoi les compétences humaines comptent-elles de plus en plus avec le niveau ?"
      en: "Why do soft skills matter more and more with seniority?"
    options:
      fr:
        - "Parce qu'elles remplacent complètement la technique"
        - "Parce que la sécurité ne progresse que si les équipes coopèrent"
        - "Parce qu'elles sont plus faciles que la technique"
        - "Parce que les outils deviennent inutiles"
      en:
        - "Because they fully replace technical skills"
        - "Because security only improves if teams cooperate"
        - "Because they are easier than technical skills"
        - "Because tools become useless"
    answer: 1
    why:
      fr: "DevSecOps repose sur la collaboration : convaincre et aider les équipes démultiplie l'impact, sans remplacer la technique."
      en: "DevSecOps relies on collaboration: convincing and helping teams multiplies impact, without replacing technical skill."
  - q:
      fr: "Dans l'exemple de tri, pourquoi l'injection SQL passe-t-elle en premier ?"
      en: "In the triage example, why does the SQL injection come first?"
    options:
      fr:
        - "Parce qu'elle a le score le plus bas"
        - "Parce qu'elle est interne"
        - "Parce qu'elle est la plus ancienne"
        - "Parce que son risque (gravité × exposition) est le plus élevé"
      en:
        - "Because it has the lowest score"
        - "Because it is internal"
        - "Because it is the oldest"
        - "Because its risk (severity × exposure) is the highest"
    answer: 3
    why:
      fr: "Gravité 9 × exposition 10 = 90, le plus haut score : une faille critique sur une page publique se corrige en priorité."
      en: "Severity 9 × exposure 10 = 90, the highest score: a critical flaw on a public page is fixed first."
  - q:
      fr: "Quelle est la bonne façon de combler une faiblesse repérée ?"
      en: "What is the right way to close a spotted weakness?"
    options:
      fr:
        - "La transformer en une action concrète, mesurable et datée"
        - "Attendre d'avoir plus d'expérience"
        - "Installer dix outils d'un coup"
        - "Changer d'objectif de niveau"
      en:
        - "Turn it into a concrete, measurable, dated action"
        - "Wait until you have more experience"
        - "Install ten tools at once"
        - "Change your level target"
    answer: 0
    why:
      fr: "Un plan n'avance que si chaque faiblesse se traduit par une action faisable ce mois-ci, prouvée par un livrable dans Git."
      en: "A plan only moves when each weakness becomes a doable action this month, proven by a deliverable in Git."
