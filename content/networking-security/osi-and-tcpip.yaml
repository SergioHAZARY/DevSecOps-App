description:
  fr: "Comprendre les modèles OSI et TCP/IP couche par couche, et savoir à quelle couche se situent une attaque et sa défense."
  en: "Understand the OSI and TCP/IP models layer by layer, and know at which layer an attack and its defense take place."
duration: 20

intro:
  fr: |
    Quand vous ouvrez un site web, votre message traverse des câbles, des box, des routeurs et des serveurs
    avant d'arriver. Pour que des milliards de machines différentes se comprennent, le réseau est découpé en
    **couches** : chaque couche a un seul travail et fait confiance à celle du dessous.

    Pensez à l'envoi d'un colis. Vous écrivez une **lettre** (les données), vous la glissez dans une
    **enveloppe** avec un numéro d'appartement (le port), puis dans un **carton** avec l'adresse de l'immeuble
    (l'adresse IP), que le **camion** du quartier transporte (le câble ou le Wi-Fi). Chacun ne lit que
    l'étiquette qui le concerne.

    Deux modèles décrivent ce découpage : **OSI** (*Open Systems Interconnection*, 7 couches, le vocabulaire
    de référence) et **TCP/IP** (4 couches, ce qui tourne réellement sur Internet). Dans cette leçon, vous allez
    apprendre à les lire et à vous poser la question clé en sécurité : *« à quelle couche se passe le problème ? »*
  en: |
    When you open a website, your message travels through cables, home routers, routers and servers before
    it arrives. So that billions of different machines can understand each other, networking is split into
    **layers**: each layer has a single job and trusts the one below it.

    Think of sending a parcel. You write a **letter** (the data), slip it into an **envelope** with a flat
    number (the port), then into a **box** with the address of the building (the IP address), which the local
    **truck** carries (the cable or the Wi-Fi). Everyone only reads the label that concerns them.

    Two models describe this split: **OSI** (*Open Systems Interconnection*, 7 layers, the reference
    vocabulary) and **TCP/IP** (4 layers, what actually runs on the Internet). In this lesson you will learn
    to read them and to ask the key security question: *"at which layer is the problem happening?"*

sections:
  - heading:
      fr: "Les 7 couches du modèle OSI"
      en: "The 7 layers of the OSI model"
    body:
      fr: |
        On numérote les couches de bas en haut : la couche 1 est le câble, la couche 7 est l'application que
        vous utilisez.

        | N° | Couche | Son travail | Exemples | Unité |
        |---|---|---|---|---|
        | 7 | Application | Parler le langage de l'application | HTTP, DNS, SSH, SMTP | Données |
        | 6 | Présentation | Mettre en forme, chiffrer | TLS, JSON, UTF-8 | Données |
        | 5 | Session | Ouvrir et maintenir le dialogue | Sessions, sockets | Données |
        | 4 | Transport | Livrer au bon programme (port) | TCP, UDP | Segment |
        | 3 | Réseau | Trouver le chemin entre deux réseaux | IP, ICMP, routeur | Paquet |
        | 2 | Liaison | Parler au voisin direct sur le même réseau | Ethernet, Wi-Fi, adresse MAC, switch | Trame |
        | 1 | Physique | Transporter des 0 et des 1 | Câble, fibre, ondes radio | Bit |

        Astuce pour retenir l'ordre de 1 à 7 en anglais : **P**lease **D**o **N**ot **T**hrow **S**ausage
        **P**izza **A**way (*Physical, Data link, Network, Transport, Session, Presentation, Application*).

        En pratique, on entend souvent : « un pare-feu **couche 4** » (il filtre des adresses IP et des ports)
        ou « un pare-feu **couche 7** » (il comprend HTTP). Ces numéros viennent de ce tableau.
      en: |
        Layers are numbered from bottom to top: layer 1 is the cable, layer 7 is the application you use.

        | No. | Layer | Its job | Examples | Unit |
        |---|---|---|---|---|
        | 7 | Application | Speak the language of the application | HTTP, DNS, SSH, SMTP | Data |
        | 6 | Presentation | Format, encrypt | TLS, JSON, UTF-8 | Data |
        | 5 | Session | Open and maintain the dialogue | Sessions, sockets | Data |
        | 4 | Transport | Deliver to the right program (port) | TCP, UDP | Segment |
        | 3 | Network | Find the path between two networks | IP, ICMP, router | Packet |
        | 2 | Data link | Talk to the direct neighbour on the same network | Ethernet, Wi-Fi, MAC address, switch | Frame |
        | 1 | Physical | Carry 0s and 1s | Cable, fibre, radio waves | Bit |

        A trick to remember the order from 1 to 7: **P**lease **D**o **N**ot **T**hrow **S**ausage **P**izza
        **A**way (*Physical, Data link, Network, Transport, Session, Presentation, Application*).

        In practice you will often hear "a **layer 4** firewall" (it filters IP addresses and ports) or
        "a **layer 7** firewall" (it understands HTTP). Those numbers come from this table.
  - heading:
      fr: "Le modèle TCP/IP : 4 couches"
      en: "The TCP/IP model: 4 layers"
    body:
      fr: |
        Internet n'utilise pas 7 couches mais 4. Le modèle TCP/IP regroupe simplement certaines couches OSI :

        | Couche TCP/IP | Couches OSI correspondantes | Protocoles | Ce que vous y verrez |
        |---|---|---|---|
        | Application | 5, 6 et 7 | HTTP, HTTPS, DNS, SSH | URL, en-têtes, certificats |
        | Transport | 4 | TCP, UDP | Numéros de port |
        | Internet | 3 | IPv4, IPv6, ICMP | Adresses IP, routes |
        | Accès réseau | 1 et 2 | Ethernet, Wi-Fi, ARP | Adresses MAC, câbles |

        Les deux modèles ne s'opposent pas : **TCP/IP est ce qui fonctionne, OSI est la façon d'en parler**.
        Quand un collègue dit « c'est un problème de couche 3 », il utilise la numérotation OSI pour dire
        « c'est un problème d'adresse IP ou de routage ».

        À l'envoi, chaque couche ajoute son étiquette (un **en-tête**) autour des données : c'est
        l'**encapsulation**. À la réception, chaque couche retire la sienne : c'est la **décapsulation**.
      en: |
        The Internet does not use 7 layers but 4. The TCP/IP model simply groups some OSI layers together:

        | TCP/IP layer | Matching OSI layers | Protocols | What you will see there |
        |---|---|---|---|
        | Application | 5, 6 and 7 | HTTP, HTTPS, DNS, SSH | URLs, headers, certificates |
        | Transport | 4 | TCP, UDP | Port numbers |
        | Internet | 3 | IPv4, IPv6, ICMP | IP addresses, routes |
        | Network access | 1 and 2 | Ethernet, Wi-Fi, ARP | MAC addresses, cables |

        The two models do not compete: **TCP/IP is what runs, OSI is the way to talk about it**. When a
        colleague says "it's a layer 3 problem", they use OSI numbering to say "it's an IP address or routing
        problem".

        When sending, each layer adds its own label (a **header**) around the data: this is
        **encapsulation**. When receiving, each layer removes its own: this is **decapsulation**.
  - heading:
      fr: "Une attaque et une défense par couche"
      en: "One attack and one defense per layer"
    body:
      fr: |
        Chaque couche a ses propres attaques, et une défense placée à une couche **ne voit pas** ce qui se
        passe dans les autres. C'est la raison d'être de la **défense en profondeur** : plusieurs protections
        superposées.

        | Couche | Attaque typique | Défense typique |
        |---|---|---|
        | 7 Application | Injection SQL, XSS, vol de session | Code sûr, WAF (pare-feu applicatif) |
        | 6 Présentation | Interception d'un échange non chiffré | TLS (HTTPS) |
        | 4 Transport | Scan de ports, SYN flood | Pare-feu, limitation de débit |
        | 3 Réseau | Usurpation d'adresse IP (*IP spoofing*) | Filtrage, segmentation en sous-réseaux |
        | 2 Liaison | ARP spoofing sur le réseau local | Switch sécurisé, VLAN, chiffrement |
        | 1 Physique | Branchement sur une prise, vol de matériel | Contrôle d'accès aux locaux |

        Les leçons suivantes détaillent ces protocoles un par un : TCP, UDP et les ports, DNS, HTTP et HTTPS,
        puis les pare-feu, les outils et les attaques.
      en: |
        Each layer has its own attacks, and a defense placed at one layer **cannot see** what happens in the
        others. This is why **defense in depth** exists: several protections stacked on top of each other.

        | Layer | Typical attack | Typical defense |
        |---|---|---|
        | 7 Application | SQL injection, XSS, session theft | Safe code, WAF (web application firewall) |
        | 6 Presentation | Intercepting an unencrypted exchange | TLS (HTTPS) |
        | 4 Transport | Port scanning, SYN flood | Firewall, rate limiting |
        | 3 Network | IP address spoofing | Filtering, segmentation into subnets |
        | 2 Data link | ARP spoofing on the local network | Hardened switch, VLAN, encryption |
        | 1 Physical | Plugging into a wall socket, hardware theft | Physical access control |

        The next lessons go through these protocols one by one: TCP, UDP and ports, DNS, HTTP and HTTPS,
        then firewalls, tools and attacks.

examples:
  - title:
      fr: "L'encapsulation : une lettre dans une enveloppe dans un carton"
      en: "Encapsulation: a letter in an envelope in a box"
    file: encapsulation.py
    lang: python
    code: |
      # Layer 7 (application): the data itself, here an HTTP request
      message = "GET /index.html HTTP/1.1"

      # Layer 4 (transport): TCP adds the ports -> the unit is called a SEGMENT
      segment = {"src_port": 51514, "dst_port": 80, "data": message}

      # Layer 3 (network): IP adds the addresses -> the unit is called a PACKET
      packet = {"src_ip": "192.168.1.20", "dst_ip": "203.0.113.10", "data": segment}

      # Layer 2 (data link): Ethernet adds the MAC addresses -> the unit is called a FRAME
      frame = {"src_mac": "52:54:00:12:34:56", "dst_mac": "52:54:00:ab:cd:ef", "data": packet}

      print("What travels on the cable, outermost label first:")
      print("  Frame   (L2):", frame["src_mac"], "->", frame["dst_mac"])
      print("  Packet  (L3):", packet["src_ip"], "->", packet["dst_ip"])
      print("  Segment (L4): port", segment["src_port"], "-> port", segment["dst_port"])
      print("  Data    (L7):", message)

      # A classic firewall reads the labels of layers 3 and 4 only.
      # It never opens the letter: an attack written inside the HTTP data goes through.
      firewall_sees = {"dst_ip": packet["dst_ip"], "dst_port": segment["dst_port"]}
      print("A layer 3-4 firewall decides with:", firewall_sees)
    output: |
      What travels on the cable, outermost label first:
        Frame   (L2): 52:54:00:12:34:56 -> 52:54:00:ab:cd:ef
        Packet  (L3): 192.168.1.20 -> 203.0.113.10
        Segment (L4): port 51514 -> port 80
        Data    (L7): GET /index.html HTTP/1.1
      A layer 3-4 firewall decides with: {'dst_ip': '203.0.113.10', 'dst_port': 80}
    note:
      fr: "Chaque dictionnaire contient le précédent dans son champ `data` : c'est exactement l'encapsulation. Regardez la dernière ligne : un pare-feu classique ne décide qu'avec l'adresse IP et le port, pas avec le contenu."
      en: "Each dictionary contains the previous one in its `data` field: that is exactly what encapsulation is. Look at the last line: a classic firewall decides with the IP address and the port only, not with the content."

  - title:
      fr: "Voir les couches 2, 3 et 4 sur votre machine Linux"
      en: "Seeing layers 2, 3 and 4 on your Linux machine"
    file: layers.sh
    lang: bash
    code: |
      # Layer 2: network cards and their MAC addresses
      ip -br link show

      # Layer 3: IP addresses, and the default route (the door to other networks)
      ip -br addr show
      ip route show default

      # Link between layer 3 and layer 2: which MAC address owns which IP (ARP table)
      ip neigh show

      # Layer 4: TCP ports that are listening on this machine
      ss -tln
    output: |
      lo               UNKNOWN        00:00:00:00:00:00 <LOOPBACK,UP,LOWER_UP>
      eth0             UP             52:54:00:12:34:56 <BROADCAST,MULTICAST,UP,LOWER_UP>
      lo               UNKNOWN        127.0.0.1/8 ::1/128
      eth0             UP             192.168.1.20/24 fe80::5054:ff:fe12:3456/64
      default via 192.168.1.1 dev eth0 proto dhcp src 192.168.1.20 metric 100
      192.168.1.1 dev eth0 lladdr 52:54:00:ab:cd:ef REACHABLE
      State    Recv-Q   Send-Q     Local Address:Port     Peer Address:Port  Process
      LISTEN   0        128              0.0.0.0:22            0.0.0.0:*
      LISTEN   0        4096       127.0.0.53%lo:53            0.0.0.0:*
    note:
      fr: "Chaque commande répond à une question d'une couche précise : `ip link` (carte et adresse MAC), `ip addr` et `ip route` (adresse IP et chemin), `ip neigh` (qui est mon voisin), `ss` (quels ports écoutent). Ces commandes ne modifient rien : vous pouvez les lancer sans risque."
      en: "Each command answers a question about one specific layer: `ip link` (card and MAC address), `ip addr` and `ip route` (IP address and path), `ip neigh` (who is my neighbour), `ss` (which ports are listening). These commands change nothing: you can run them safely."

  - title:
      fr: "Diagnostiquer une panne en remontant les couches"
      en: "Troubleshooting by climbing the layers"
    file: diagnose.sh
    lang: bash
    code: |
      # Always test from the bottom up: a broken lower layer breaks everything above it.

      # Layer 3: can I reach an IP address on the Internet? (ICMP echo = ping)
      ping -c 2 1.1.1.1

      # Layer 4: can I open a TCP connection to port 443 of the server?
      # -z = only test the connection, -v = say what happens
      nc -zv example.com 443

      # Layer 7: does the web server answer in HTTP? (-s silent, -I headers only)
      curl -sI https://example.com | head -n 1
    output: |
      PING 1.1.1.1 (1.1.1.1) 56(84) bytes of data.
      64 bytes from 1.1.1.1: icmp_seq=1 ttl=57 time=11.8 ms
      64 bytes from 1.1.1.1: icmp_seq=2 ttl=57 time=11.5 ms

      --- 1.1.1.1 ping statistics ---
      2 packets transmitted, 2 received, 0% packet loss, time 1002ms
      rtt min/avg/max/mdev = 11.512/11.661/11.810/0.149 ms
      Connection to example.com (104.20.23.154) 443 port [tcp/https] succeeded!
      HTTP/2 200
    note:
      fr: "Si le `ping` échoue, inutile de chercher du côté de l'application : le problème est en couche 3 ou en dessous. Si `ping` et `nc` réussissent mais que `curl` échoue, le réseau est sain et le problème est en couche 7. Attention : certains serveurs bloquent le ping, un échec ICMP seul ne prouve pas une panne."
      en: "If `ping` fails, there is no point looking at the application: the problem is at layer 3 or below. If `ping` and `nc` succeed but `curl` fails, the network is healthy and the problem is at layer 7. Note that some servers block ping, so an ICMP failure alone does not prove an outage."

  - title:
      fr: "Associer chaque défense à sa couche"
      en: "Mapping each defense to its layer"
    file: defense_in_depth.py
    lang: python
    kind: secure
    code: |
      # Defense in depth: one protection per layer, because each one is blind to the others.
      defenses = [
          (7, "Application", "input validation, WAF"),
          (6, "Presentation", "TLS encryption (HTTPS)"),
          (4, "Transport", "firewall on ports, rate limiting"),
          (3, "Network", "network segmentation, IP filtering"),
          (2, "Data link", "VLANs, switch port security"),
          (1, "Physical", "locked server room"),
      ]

      attacks = {
          "SQL injection in a web form": 7,
          "Password read on public Wi-Fi": 6,
          "Port scan": 4,
          "ARP spoofing": 2,
      }

      for attack, layer in attacks.items():
          name, defense = next((n, d) for (l, n, d) in defenses if l == layer)
          print(f"{attack:32} -> layer {layer} ({name}): {defense}")
    output: |
      SQL injection in a web form      -> layer 7 (Application): input validation, WAF
      Password read on public Wi-Fi    -> layer 6 (Presentation): TLS encryption (HTTPS)
      Port scan                        -> layer 4 (Transport): firewall on ports, rate limiting
      ARP spoofing                     -> layer 2 (Data link): VLANs, switch port security
    note:
      fr: "Ce petit tableau est un réflexe d'analyste : pour chaque attaque, on cherche la couche, puis la défense qui agit **à cette couche**. Un pare-feu sur les ports n'arrête pas une injection SQL, et le chiffrement TLS n'arrête pas un scan de ports."
      en: "This small table is an analyst's reflex: for each attack, find the layer, then the defense that acts **at that layer**. A firewall on ports does not stop a SQL injection, and TLS encryption does not stop a port scan."

mistake:
  fr: |
    **Croire qu'un pare-feu réseau protège l'application.**

    Un pare-feu classique travaille aux couches 3 et 4 : il autorise ou bloque des adresses IP et des ports.
    Si le port 443 est ouvert pour votre site, **toutes** les requêtes HTTPS passent, y compris celles qui
    contiennent une injection SQL : l'attaque se trouve dans les données de la couche 7, que le pare-feu ne lit
    pas. Chaque défense protège sa couche, et seulement sa couche.
  en: |
    **Believing that a network firewall protects the application.**

    A classic firewall works at layers 3 and 4: it allows or blocks IP addresses and ports. If port 443 is
    open for your website, **all** HTTPS requests go through, including the ones carrying a SQL injection:
    the attack sits in the layer 7 data, which the firewall does not read. Each defense protects its own
    layer, and only that layer.

bestPractice:
  fr: |
    - **Défense en profondeur** : prévoyez au moins une protection par couche (segmentation réseau, pare-feu, TLS, code sûr).
    - **Nommez la couche** quand vous décrivez un incident ou une règle : « blocage couche 4 sur le port 5432 » est plus clair que « c'est bloqué ».
    - **Diagnostiquez de bas en haut** : lien, adresse IP, port, puis application.
    - **Chiffrez par défaut** : tout ce qui circule en clair peut être lu par un équipement intermédiaire.
  en: |
    - **Defense in depth**: plan at least one protection per layer (network segmentation, firewall, TLS, safe code).
    - **Name the layer** when you describe an incident or a rule: "layer 4 block on port 5432" is clearer than "it's blocked".
    - **Troubleshoot from the bottom up**: link, IP address, port, then application.
    - **Encrypt by default**: anything travelling in clear text can be read by a device along the path.

exercise:
  statement:
    fr: |
      Classez chacun des éléments suivants dans la bonne couche OSI (numéro et nom) :

      1. Une adresse MAC `52:54:00:12:34:56`
      2. Le port TCP `443`
      3. L'adresse IP `203.0.113.10`
      4. Un en-tête HTTP `Host: example.com`
      5. Un câble Ethernet débranché
      6. Un certificat TLS expiré

      Écrivez ensuite un petit script Python qui affiche votre classement, de la couche la plus basse à la
      plus haute.
    en: |
      Put each of the following items in the right OSI layer (number and name):

      1. A MAC address `52:54:00:12:34:56`
      2. TCP port `443`
      3. The IP address `203.0.113.10`
      4. An HTTP header `Host: example.com`
      5. An unplugged Ethernet cable
      6. An expired TLS certificate

      Then write a small Python script that prints your classification, from the lowest layer to the
      highest.
  solution:
    file: solution.py
    lang: python
    code: |
      # (layer number, layer name, item)
      classification = [
          (1, "Physical", "Unplugged Ethernet cable"),
          (2, "Data link", "MAC address 52:54:00:12:34:56"),
          (3, "Network", "IP address 203.0.113.10"),
          (4, "Transport", "TCP port 443"),
          (6, "Presentation", "Expired TLS certificate"),
          (7, "Application", "HTTP header Host: example.com"),
      ]

      # sorted() orders the tuples by their first element: the layer number
      for number, name, item in sorted(classification):
          print(f"Layer {number} - {name:12} : {item}")
    note:
      fr: "TLS est généralement rangé en couche 6 (présentation) car il chiffre les données juste avant l'application ; dans le modèle TCP/IP, il fait partie de la couche Application."
      en: "TLS is usually placed at layer 6 (presentation) because it encrypts the data right before the application; in the TCP/IP model it belongs to the Application layer."

quiz:
  - q:
      fr: "À quelle couche OSI travaille le protocole IP ?"
      en: "At which OSI layer does the IP protocol work?"
    options:
      fr: ["Couche 2 - Liaison", "Couche 3 - Réseau", "Couche 4 - Transport", "Couche 7 - Application"]
      en: ["Layer 2 - Data link", "Layer 3 - Network", "Layer 4 - Transport", "Layer 7 - Application"]
    answer: 1
    why:
      fr: "IP s'occupe de l'adressage et du routage entre réseaux : c'est le rôle de la couche 3."
      en: "IP handles addressing and routing between networks: that is the job of layer 3."
  - q:
      fr: "Combien de couches compte le modèle TCP/IP ?"
      en: "How many layers does the TCP/IP model have?"
    options:
      fr: ["3", "5", "7", "4"]
      en: ["3", "5", "7", "4"]
    answer: 3
    why:
      fr: "TCP/IP compte 4 couches : Accès réseau, Internet, Transport et Application. Le modèle OSI en compte 7."
      en: "TCP/IP has 4 layers: Network access, Internet, Transport and Application. The OSI model has 7."
  - q:
      fr: "Comment s'appelle le fait d'ajouter un en-tête à chaque couche lors de l'envoi ?"
      en: "What is adding a header at each layer when sending called?"
    options:
      fr: ["L'encapsulation", "Le routage", "La fragmentation", "Le chiffrement"]
      en: ["Encapsulation", "Routing", "Fragmentation", "Encryption"]
    answer: 0
    why:
      fr: "Chaque couche enveloppe les données de la couche supérieure avec son propre en-tête : c'est l'encapsulation."
      en: "Each layer wraps the data of the layer above with its own header: that is encapsulation."
  - q:
      fr: "Un pare-feu qui filtre uniquement des adresses IP et des ports peut-il bloquer une injection SQL envoyée sur le port 443 ?"
      en: "Can a firewall that only filters IP addresses and ports block a SQL injection sent to port 443?"
    options:
      fr:
        - "Oui, car il inspecte tout le trafic"
        - "Oui, si le port 443 est ouvert"
        - "Non, car l'attaque est dans les données de la couche 7"
        - "Non, car le port 443 n'existe pas en TCP"
      en:
        - "Yes, because it inspects all traffic"
        - "Yes, if port 443 is open"
        - "No, because the attack is in the layer 7 data"
        - "No, because port 443 does not exist in TCP"
    answer: 2
    why:
      fr: "Ce pare-feu travaille aux couches 3 et 4. L'injection SQL se trouve dans le contenu applicatif, qu'il ne lit pas."
      en: "That firewall works at layers 3 and 4. The SQL injection is inside the application content, which it does not read."
  - q:
      fr: "`ping 1.1.1.1` fonctionne, mais `curl https://example.com` échoue. Où chercher en premier ?"
      en: "`ping 1.1.1.1` works, but `curl https://example.com` fails. Where should you look first?"
    options:
      fr:
        - "Le câble réseau (couche 1)"
        - "La carte réseau (couche 2)"
        - "Au-dessus de la couche 3 : DNS, port ou application"
        - "L'adresse MAC du routeur"
      en:
        - "The network cable (layer 1)"
        - "The network card (layer 2)"
        - "Above layer 3: DNS, port or application"
        - "The MAC address of the router"
    answer: 2
    why:
      fr: "Un ping réussi prouve que les couches 1 à 3 fonctionnent. Le problème se situe donc plus haut : résolution DNS, port filtré ou service web."
      en: "A successful ping proves that layers 1 to 3 work. The problem is therefore higher up: DNS resolution, filtered port or web service."
