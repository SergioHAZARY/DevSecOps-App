description:
  fr: "Séparer la configuration du code avec les ConfigMaps et gérer les données sensibles avec les Secrets, en comprenant que base64 n'est pas du chiffrement."
  en: "Separate configuration from code with ConfigMaps and handle sensitive data with Secrets, understanding that base64 is not encryption."
duration: 35

intro:
  fr: |
    Une bonne application ne contient pas sa configuration en dur : l'URL de la base, le niveau de log, le
    nombre de workers changent d'un environnement à l'autre. Kubernetes propose deux objets pour cela : le
    **ConfigMap** pour la configuration non sensible, et le **Secret** pour les données sensibles (mots de
    passe, clés d'API, certificats).

    Pensez à une recette de cuisine : la méthode (les étapes) est le code, elle ne change pas ; mais la
    quantité de sel, le four utilisé, c'est la configuration, qui s'adapte. Et le code du coffre-fort de la
    maison, lui, ne s'écrit pas sur la recette collée au mur : c'est un Secret.

    Vous allez créer un ConfigMap et l'injecter dans un Pod (par variables d'environnement puis par fichier),
    créer un Secret, et découvrir un piège essentiel : **base64 n'est pas du chiffrement**. Un Secret
    Kubernetes n'est qu'encodé, pas chiffré ; nous verrons comment le protéger réellement.
  en: |
    A good application does not hard-code its configuration: the database URL, the log level, the worker
    count differ from one environment to another. Kubernetes offers two objects for this: the **ConfigMap**
    for non-sensitive configuration, and the **Secret** for sensitive data (passwords, API keys,
    certificates).

    Think of a cooking recipe: the method (the steps) is the code, it does not change; but the amount of
    salt, the oven used, that is configuration, which adapts. And the house safe's code is not written on
    the recipe taped to the wall: that is a Secret.

    You will create a ConfigMap and inject it into a Pod (as environment variables then as a file), create a
    Secret, and discover an essential trap: **base64 is not encryption**. A Kubernetes Secret is only
    encoded, not encrypted; we will see how to actually protect it.

sections:
  - heading:
      fr: "ConfigMap : la configuration non sensible"
      en: "ConfigMap: non-sensitive configuration"
    body:
      fr: |
        Un **ConfigMap** (`apiVersion: v1`, `kind: ConfigMap`) stocke des paires clé-valeur ou des fichiers
        de configuration entiers. On l'injecte dans un Pod de deux façons :

        | Méthode | Comment | Quand l'utiliser |
        |---|---|---|
        | Variables d'environnement | `envFrom` ou `env` + `valueFrom` | Quelques réglages simples |
        | Fichier monté en volume | `volumeMounts` + `volume` | Fichiers de config (nginx.conf, app.yaml) |

        Le montage en **volume** a un avantage : si le ConfigMap change, le fichier monté est mis à jour
        dans le Pod sans le recréer (après un court délai). Les **variables d'environnement**, elles, sont
        figées au démarrage du conteneur.

        Un ConfigMap peut aussi être marqué **`immutable: true`** : il ne pourra plus être modifié, ce qui
        améliore les performances du cluster et évite les changements accidentels. Pour changer la config, on
        crée alors un nouveau ConfigMap et on fait pointer le Pod dessus.
      en: |
        A **ConfigMap** (`apiVersion: v1`, `kind: ConfigMap`) stores key-value pairs or whole configuration
        files. You inject it into a Pod two ways:

        | Method | How | When to use it |
        |---|---|---|
        | Environment variables | `envFrom` or `env` + `valueFrom` | A few simple settings |
        | File mounted as a volume | `volumeMounts` + `volume` | Config files (nginx.conf, app.yaml) |

        The **volume** mount has an advantage: if the ConfigMap changes, the mounted file is updated inside
        the Pod without recreating it (after a short delay). **Environment variables**, on the other hand,
        are frozen at container start.

        A ConfigMap can also be marked **`immutable: true`**: it can no longer be modified, which improves
        cluster performance and avoids accidental changes. To change the config you then create a new
        ConfigMap and point the Pod at it.
  - heading:
      fr: "Secret : attention, base64 n'est pas du chiffrement"
      en: "Secret: beware, base64 is not encryption"
    body:
      fr: |
        Un **Secret** ressemble à un ConfigMap, mais pour les données sensibles. Point **crucial** : par
        défaut, les valeurs d'un Secret sont seulement **encodées en base64**, pas chiffrées. Base64 est un
        encodage réversible que n'importe qui décode en une seconde :

        ```
        echo 'U3VwZXJTZWNyZXQxMjMh' | base64 -d   ->  SuperSecret123!
        ```

        Un Secret n'est donc « secret » que grâce à **deux autres mécanismes** :

        | Protection | Rôle |
        |---|---|
        | RBAC | Restreindre qui peut lire les Secrets (leçon RBAC) |
        | Chiffrement au repos (`EncryptionConfiguration`) | Chiffrer les Secrets dans etcd |
        | Coffre externe (Vault, cloud) | Stocker le secret hors du cluster |

        Règle d'or : ne commitez **jamais** un Secret en clair dans Git, même « encodé » en base64 — c'est
        équivalent à commiter le mot de passe. On utilise des outils comme Sealed Secrets ou External
        Secrets, ou on injecte les secrets depuis un coffre-fort externe.
      en: |
        A **Secret** looks like a ConfigMap, but for sensitive data. **Crucial** point: by default a
        Secret's values are only **base64-encoded**, not encrypted. Base64 is a reversible encoding anyone
        decodes in a second:

        ```
        echo 'U3VwZXJTZWNyZXQxMjMh' | base64 -d   ->  SuperSecret123!
        ```

        A Secret is therefore only "secret" thanks to **two other mechanisms**:

        | Protection | Role |
        |---|---|
        | RBAC | Restrict who can read Secrets (RBAC lesson) |
        | Encryption at rest (`EncryptionConfiguration`) | Encrypt Secrets in etcd |
        | External vault (Vault, cloud) | Store the secret outside the cluster |

        Golden rule: **never** commit a clear Secret to Git, even "encoded" in base64 — that is equivalent to
        committing the password. You use tools like Sealed Secrets or External Secrets, or inject secrets
        from an external vault.
  - heading:
      fr: "Injecter secrets et config dans un Pod"
      en: "Injecting secrets and config into a Pod"
    body:
      fr: |
        On injecte un Secret comme un ConfigMap : en variables d'environnement ou en fichier monté. Pour les
        secrets, le **montage en fichier est préférable** : les variables d'environnement se retrouvent dans
        `kubectl describe pod`, dans les journaux de plantage et sont héritées par les processus enfants.

        | Injection d'un secret | Exposition |
        |---|---|
        | Variable d'environnement | Visible dans `describe`, héritée, fuit dans les logs |
        | Fichier monté (`/etc/secret/...`) | Lisible seulement par le processus, plus discret |

        Quelques réflexes complémentaires : utiliser des Secrets de type précis (`kubernetes.io/tls` pour un
        certificat, `kubernetes.io/dockerconfigjson` pour un registre), ne monter que le secret dont le Pod
        a besoin (pas tous), et toujours combiner avec RBAC pour que seuls les comptes autorisés puissent
        lire le Secret.

        La séparation ConfigMap (non sensible) / Secret (sensible) n'est pas qu'esthétique : elle permet
        d'appliquer des politiques d'accès et de chiffrement différentes aux deux, et de ne jamais traiter un
        mot de passe comme une simple variable de configuration.
      en: |
        You inject a Secret like a ConfigMap: as environment variables or a mounted file. For secrets, the
        **file mount is preferable**: environment variables show up in `kubectl describe pod`, in crash logs
        and are inherited by child processes.

        | Secret injection | Exposure |
        |---|---|
        | Environment variable | Visible in `describe`, inherited, leaks into logs |
        | Mounted file (`/etc/secret/...`) | Readable only by the process, more discreet |

        A few extra reflexes: use precise Secret types (`kubernetes.io/tls` for a certificate,
        `kubernetes.io/dockerconfigjson` for a registry), mount only the secret the Pod needs (not all of
        them), and always combine with RBAC so only authorised accounts can read the Secret.

        The ConfigMap (non-sensitive) / Secret (sensitive) split is not just cosmetic: it lets you apply
        different access and encryption policies to each, and never treat a password as a mere configuration
        variable.

examples:
  - title:
      fr: "Un ConfigMap injecté en variables et en fichier"
      en: "A ConfigMap injected as variables and as a file"
    file: configmap.yaml
    lang: yaml
    kind: secure
    code: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: app-config
      immutable: true            # cannot be edited; create a new one to change config
      data:
        LOG_LEVEL: "info"        # simple key-value, good for an env var
        WORKERS: "4"
        app.yaml: |              # a whole config FILE, good for a volume mount
          server:
            timeout: 30
            cors: false
      ---
      apiVersion: v1
      kind: Pod
      metadata:
        name: app
        labels:
          app: app
      spec:
        containers:
          - name: app
            image: ghcr.io/acme/app:1.0.0
            envFrom:
              - configMapRef:
                  name: app-config   # LOG_LEVEL and WORKERS become env vars
            volumeMounts:
              - name: config
                mountPath: /etc/app  # app.yaml appears as /etc/app/app.yaml
                readOnly: true
        volumes:
          - name: config
            configMap:
              name: app-config
    note:
      fr: "Les clés simples (`LOG_LEVEL`) deviennent des variables via `envFrom` ; le fichier `app.yaml` est monté dans `/etc/app`. `immutable: true` interdit toute modification accidentelle du ConfigMap."
      en: "Simple keys (`LOG_LEVEL`) become variables via `envFrom`; the `app.yaml` file is mounted in `/etc/app`. `immutable: true` forbids any accidental change to the ConfigMap."

  - title:
      fr: "La preuve que base64 n'est pas du chiffrement"
      en: "Proof that base64 is not encryption"
    file: base64-demo.sh
    lang: bash
    kind: vulnerable
    code: |
      # A Secret stores values base64-ENCODED, not encrypted. Anyone with read
      # access decodes them instantly:
      echo -n 'SuperSecret123!' | base64
      # -> U3VwZXJTZWNyZXQxMjMh   (this is NOT protection, just encoding)

      # Reverse it in one command:
      echo 'U3VwZXJTZWNyZXQxMjMh' | base64 -d
      # -> SuperSecret123!

      # So a Secret committed to Git "in base64" is as exposed as the plain password.
      # Read a real Secret's value from the cluster (needs RBAC permission):
      kubectl get secret db-credentials -o jsonpath='{.data.password}' | base64 -d
    output: |
      U3VwZXJTZWNyZXQxMjMh
      SuperSecret123!
    note:
      fr: "base64 est un encodage réversible, pas du chiffrement. Un Secret n'est protégé que par RBAC, le chiffrement d'etcd au repos, ou un coffre externe — jamais par le base64 lui-même."
      en: "base64 is a reversible encoding, not encryption. A Secret is protected only by RBAC, etcd encryption at rest, or an external vault — never by the base64 itself."

  - title:
      fr: "SÉCURISÉ : un Secret monté en fichier, pas en variable"
      en: "SECURE: a Secret mounted as a file, not a variable"
    file: secret-pod.yaml
    lang: yaml
    kind: secure
    code: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: db-credentials
      type: Opaque
      stringData:                # stringData takes plain text; K8s encodes it for you
        password: changeme-in-vault  # in real life: injected from Vault/External Secrets
      ---
      apiVersion: v1
      kind: Pod
      metadata:
        name: api
        labels:
          app: api
      spec:
        containers:
          - name: api
            image: ghcr.io/acme/api:1.0.0
            env:
              # Tell the app WHERE to read the secret file, not the secret itself
              - name: DB_PASSWORD_FILE
                value: /etc/secret/password
            volumeMounts:
              - name: dbsecret
                mountPath: /etc/secret
                readOnly: true
        volumes:
          - name: dbsecret
            secret:
              secretName: db-credentials
              defaultMode: 0400  # read-only for the owner, nobody else
    note:
      fr: "Le mot de passe est monté en fichier `/etc/secret/password` (mode 0400), pas en variable d'environnement : il ne fuit ni dans `describe`, ni dans les logs, ni vers les processus enfants."
      en: "The password is mounted as a file `/etc/secret/password` (mode 0400), not an environment variable: it leaks neither into `describe`, nor into logs, nor to child processes."

  - title:
      fr: "Protéger réellement les Secrets : les options"
      en: "Really protecting Secrets: the options"
    file: protect.sh
    lang: bash
    kind: secure
    code: |
      # Option 1: enable encryption at rest so Secrets are encrypted inside etcd
      #   (set on the API server via an EncryptionConfiguration file)

      # Option 2: never store Secrets in Git. Use Sealed Secrets: encrypt a Secret
      #   with the controller's public key; only the cluster can decrypt it.
      kubeseal --format yaml < secret.yaml > sealed-secret.yaml   # safe to commit

      # Option 3: pull secrets from an external vault at runtime with External Secrets.
      #   The real secret lives in Vault/AWS Secrets Manager, never in the manifests.

      # Option 4: restrict who can even read Secrets, with RBAC (next course).
      kubectl auth can-i get secrets --as=system:serviceaccount:shop:api
    output: |
      # kubeseal output is encrypted and safe to commit:
      # SealedSecret -> only the in-cluster controller can decrypt it.
      no
    note:
      fr: "Quatre leviers réels : chiffrement d'etcd au repos, Sealed Secrets (chiffré, versionnable dans Git), External Secrets (coffre externe), et RBAC. Le base64 n'en fait pas partie."
      en: "Four real levers: etcd encryption at rest, Sealed Secrets (encrypted, Git-versionable), External Secrets (external vault), and RBAC. base64 is not one of them."

mistake:
  fr: |
    **Croire qu'un Secret Kubernetes est chiffré, et le commiter « en base64 » dans Git.**

    C'est l'erreur de sécurité la plus répandue sur Kubernetes. Un Secret stocke ses valeurs en base64, qui
    est un simple **encodage réversible** : `base64 -d` révèle le mot de passe en une commande. Commiter un
    Secret « encodé » dans Git revient à commiter le mot de passe en clair, et il reste pour toujours dans
    l'historique. Un Secret n'est protégé que par RBAC (qui peut le lire), le chiffrement d'etcd au repos,
    ou un coffre externe. Pour versionner un secret dans Git, utilisez Sealed Secrets (réellement chiffré)
    ou External Secrets, jamais le base64 nu. Et un secret exposé une fois doit être changé (rotation).
  en: |
    **Believing a Kubernetes Secret is encrypted, and committing it "in base64" to Git.**

    This is the most widespread Kubernetes security mistake. A Secret stores its values in base64, which is
    a plain **reversible encoding**: `base64 -d` reveals the password in one command. Committing an
    "encoded" Secret to Git is equivalent to committing the plain password, and it stays in the history
    forever. A Secret is protected only by RBAC (who can read it), etcd encryption at rest, or an external
    vault. To version a secret in Git, use Sealed Secrets (truly encrypted) or External Secrets, never bare
    base64. And a secret exposed once must be rotated.

bestPractice:
  fr: |
    - **ConfigMap pour le non sensible, Secret pour le sensible** : ne jamais mélanger.
    - **Souvenez-vous : base64 n'est pas du chiffrement** ; un Secret nu est lisible par qui y a accès.
    - **Montez les secrets en fichier** (`/etc/secret`, mode 0400) plutôt qu'en variable d'environnement.
    - **Chiffrez etcd au repos** et restreignez l'accès aux Secrets avec RBAC.
    - **Ne commitez jamais un Secret nu** : Sealed Secrets ou External Secrets pour versionner sans risque.
    - **`immutable: true`** sur les ConfigMaps/Secrets stables : performance et sécurité.
    - **Rotation** : un secret exposé une fois est compromis, changez-le.
  en: |
    - **ConfigMap for non-sensitive, Secret for sensitive**: never mix the two.
    - **Remember: base64 is not encryption**; a bare Secret is readable by anyone with access.
    - **Mount secrets as files** (`/etc/secret`, mode 0400) rather than environment variables.
    - **Encrypt etcd at rest** and restrict Secret access with RBAC.
    - **Never commit a bare Secret**: Sealed Secrets or External Secrets to version without risk.
    - **`immutable: true`** on stable ConfigMaps/Secrets: performance and security.
    - **Rotation**: a secret exposed once is compromised, change it.

exercise:
  statement:
    fr: |
      1. Un collègue vous montre la valeur `cGFzc3dvcmQxMjM=` stockée dans un Secret et affirme « elle est
         chiffrée, c'est bon ». A-t-il raison ? Donnez la commande qui le prouve ou l'infirme.
      2. Écrivez un Secret nommé `smtp` de type `Opaque` contenant une clé `password` avec la valeur
         `changeme-in-vault` (utilisez `stringData`).
      3. Citez deux moyens réels de protéger ce Secret au-delà du base64.
    en: |
      1. A colleague shows you the value `cGFzc3dvcmQxMjM=` stored in a Secret and claims "it is encrypted,
         we are fine". Are they right? Give the command that proves or disproves it.
      2. Write a Secret named `smtp` of type `Opaque` containing a `password` key with the value
         `changeme-in-vault` (use `stringData`).
      3. Name two real ways to protect this Secret beyond base64.
  solution:
    file: solution.yaml
    lang: yaml
    code: |
      # 1. No, base64 is only encoding. Prove it:
      #      echo 'cGFzc3dvcmQxMjM=' | base64 -d   ->  password123
      #    Anyone with read access decodes it instantly.
      #
      # 2. The Secret (stringData takes plain text, K8s encodes it on apply):
      apiVersion: v1
      kind: Secret
      metadata:
        name: smtp
      type: Opaque
      stringData:
        password: changeme-in-vault
      #
      # 3. Two REAL protections (not base64):
      #    - Enable encryption at rest for Secrets in etcd (EncryptionConfiguration),
      #      and/or restrict read access with RBAC.
      #    - Keep the secret out of Git using Sealed Secrets or External Secrets
      #      (the real value lives in an external vault such as HashiCorp Vault).
    note:
      fr: "`base64 -d` révèle `password123` : l'encodage n'est pas une protection. Les vraies protections sont le chiffrement d'etcd, RBAC, et un coffre externe (Sealed/External Secrets)."
      en: "`base64 -d` reveals `password123`: encoding is not protection. The real protections are etcd encryption, RBAC, and an external vault (Sealed/External Secrets)."

quiz:
  - q:
      fr: "Quelle est la différence entre un ConfigMap et un Secret ?"
      en: "What is the difference between a ConfigMap and a Secret?"
    options:
      fr:
        - "Le ConfigMap stocke la config non sensible, le Secret les données sensibles"
        - "Le Secret est plus rapide à lire"
        - "Le ConfigMap chiffre ses valeurs, pas le Secret"
        - "Ils sont strictement identiques"
      en:
        - "The ConfigMap stores non-sensitive config, the Secret sensitive data"
        - "The Secret is faster to read"
        - "The ConfigMap encrypts its values, the Secret does not"
        - "They are strictly identical"
    answer: 0
    why:
      fr: "Les deux stockent des paires clé-valeur, mais le Secret est destiné aux données sensibles et bénéficie de protections dédiées (RBAC, chiffrement d'etcd)."
      en: "Both store key-value pairs, but the Secret is meant for sensitive data and benefits from dedicated protections (RBAC, etcd encryption)."
  - q:
      fr: "Un Secret Kubernetes par défaut, c'est :"
      en: "A default Kubernetes Secret is:"
    options:
      fr:
        - "Chiffré avec AES-256"
        - "Seulement encodé en base64 (réversible), pas chiffré"
        - "Signé numériquement"
        - "Stocké hors du cluster"
      en:
        - "Encrypted with AES-256"
        - "Only base64-encoded (reversible), not encrypted"
        - "Digitally signed"
        - "Stored outside the cluster"
    answer: 1
    why:
      fr: "Par défaut les valeurs sont encodées en base64, décodables en une commande : c'est un encodage, pas une protection."
      en: "By default the values are base64-encoded, decodable in one command: it is an encoding, not a protection."
  - q:
      fr: "Pourquoi monter un secret en fichier plutôt qu'en variable d'environnement ?"
      en: "Why mount a secret as a file rather than an environment variable?"
    options:
      fr:
        - "Pour chiffrer automatiquement le secret"
        - "Parce que les variables sont obligatoires"
        - "Les variables apparaissent dans `describe`, les logs et sont héritées par les enfants"
        - "Les fichiers sont plus rapides"
      en:
        - "To automatically encrypt the secret"
        - "Because variables are mandatory"
        - "Variables show up in `describe`, logs and are inherited by child processes"
        - "Files are faster"
    answer: 2
    why:
      fr: "Une variable d'environnement fuit facilement (inspection, journaux de plantage, héritage) ; un fichier monté en lecture seule reste bien plus discret."
      en: "An environment variable leaks easily (inspection, crash logs, inheritance); a read-only mounted file stays far more discreet."
  - q:
      fr: "Comment protéger réellement les Secrets stockés dans etcd ?"
      en: "How do you actually protect Secrets stored in etcd?"
    options:
      fr:
        - "En les encodant deux fois en base64"
        - "En activant le chiffrement au repos et en restreignant l'accès par RBAC"
        - "En les mettant tous dans le namespace default"
        - "En les renommant"
      en:
        - "By base64-encoding them twice"
        - "By enabling encryption at rest and restricting access with RBAC"
        - "By putting them all in the default namespace"
        - "By renaming them"
    answer: 1
    why:
      fr: "Le chiffrement au repos protège les Secrets dans etcd, et RBAC limite qui peut les lire : ce sont les protections réelles, pas le base64."
      en: "Encryption at rest protects Secrets in etcd, and RBAC limits who can read them: these are the real protections, not base64."
  - q:
      fr: "Que fait `immutable: true` sur un ConfigMap ?"
      en: "What does `immutable: true` do on a ConfigMap?"
    options:
      fr:
        - "Il le chiffre"
        - "Il le supprime après usage"
        - "Il le partage entre namespaces"
        - "Il empêche toute modification ultérieure (on crée un nouveau ConfigMap pour changer)"
      en:
        - "It encrypts it"
        - "It deletes it after use"
        - "It shares it across namespaces"
        - "It prevents any later change (you create a new ConfigMap to change it)"
    answer: 3
    why:
      fr: "Un ConfigMap immuable ne peut plus être édité : cela évite les changements accidentels et améliore les performances du cluster."
      en: "An immutable ConfigMap can no longer be edited: this avoids accidental changes and improves cluster performance."
