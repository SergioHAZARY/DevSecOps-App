description:
  fr: "Découvrir Python à partir de zéro : variables, types, conditions et boucles, avec des exemples tirés du quotidien d'un ingénieur DevSecOps."
  en: "Discover Python from scratch: variables, types, conditions and loops, with examples taken from a DevSecOps engineer's daily work."
duration: 25

intro:
  fr: |
    **Python** est le langage le plus utilisé en sécurité et en automatisation : scanners, scripts d'audit,
    outils cloud (Ansible, AWS CLI, Bandit) sont écrits en Python. Sa force : il se lit presque comme de
    l'anglais, et quelques lignes suffisent pour faire un travail utile.

    Un programme, c'est comme une **recette de cuisine** : une liste d'instructions que l'ordinateur suit
    dans l'ordre, de haut en bas. Les **variables** sont les bols étiquetés où l'on range les ingrédients,
    les **conditions** sont les « si la pâte est trop liquide, ajoutez de la farine », et les **boucles**
    sont les « répétez pour chaque œuf ».

    Cette leçon ne suppose **aucune connaissance** en programmation. Chaque exemple peut être exécuté
    directement dans la page avec le bouton **Run** : modifiez les valeurs, relancez, observez. À la fin,
    vous saurez écrire un petit script qui valide des données et classe des ports réseau.
  en: |
    **Python** is the most widely used language in security and automation: scanners, audit scripts and
    cloud tools (Ansible, AWS CLI, Bandit) are written in Python. Its strength: it reads almost like
    English, and a few lines are enough to get useful work done.

    A program is like a **cooking recipe**: a list of instructions the computer follows in order, from top
    to bottom. **Variables** are the labelled bowls where you keep the ingredients, **conditions** are the
    "if the dough is too runny, add flour", and **loops** are the "repeat for each egg".

    This lesson assumes **no programming knowledge** at all. Every example can be executed right in the
    page with the **Run** button: change the values, run again, observe. By the end you will be able to
    write a small script that validates data and classifies network ports.

sections:
  - heading:
      fr: "Installer et lancer Python"
      en: "Installing and running Python"
    body:
      fr: |
        Sur Linux et macOS, Python 3 est généralement déjà présent. Sur Windows, installez-le depuis
        [python.org](https://www.python.org/downloads/) en cochant « Add python.exe to PATH ».

        ```bash
        python3 --version        # Windows : python --version
        python3 hello.py         # exécute le fichier hello.py
        python3                  # ouvre l'interpréteur interactif (quitter : exit())
        ```

        Un script Python est un simple fichier texte dont le nom finit par `.py`. Trois règles à retenir
        dès maintenant :

        - une instruction par ligne, exécutée de haut en bas ;
        - tout ce qui suit un `#` est un **commentaire** : Python l'ignore, il est là pour les humains ;
        - `print(...)` affiche une valeur à l'écran. C'est votre premier outil de débogage.
      en: |
        On Linux and macOS, Python 3 is usually already there. On Windows, install it from
        [python.org](https://www.python.org/downloads/) and tick "Add python.exe to PATH".

        ```bash
        python3 --version        # Windows: python --version
        python3 hello.py         # runs the file hello.py
        python3                  # opens the interactive interpreter (quit with exit())
        ```

        A Python script is a plain text file whose name ends with `.py`. Three rules to remember right
        away:

        - one instruction per line, executed from top to bottom;
        - everything after a `#` is a **comment**: Python ignores it, it is there for humans;
        - `print(...)` displays a value on screen. It is your first debugging tool.
  - heading:
      fr: "Variables et types de base"
      en: "Variables and basic types"
    body:
      fr: |
        Une **variable** est un nom que l'on attache à une valeur avec le signe `=`. Python devine le
        **type** de la valeur tout seul :

        | Type | Nom Python | Exemple | Usage typique en DevSecOps |
        |---|---|---|---|
        | Texte | `str` | `"web-01"` | nom d'hôte, ligne de log, adresse IP |
        | Entier | `int` | `443` | port, nombre de tentatives |
        | Décimal | `float` | `0.73` | charge CPU, score CVSS |
        | Booléen | `bool` | `True` / `False` | chiffré ou non, public ou privé |
        | Absence de valeur | `NoneType` | `None` | résultat inconnu, champ vide |

        Les types ne se mélangent pas automatiquement : `"8080" + 1` provoque une erreur, car on ne peut pas
        additionner un texte et un nombre. On convertit explicitement avec `int("8080")`, `str(443)` ou
        `float("7.5")`.

        Pour insérer des variables dans un texte, on utilise une **f-string** : un `f` devant les
        guillemets, et les variables entre accolades, par exemple `f"port {port} ouvert"`.
      en: |
        A **variable** is a name attached to a value with the `=` sign. Python works out the **type** of the
        value on its own:

        | Type | Python name | Example | Typical DevSecOps use |
        |---|---|---|---|
        | Text | `str` | `"web-01"` | host name, log line, IP address |
        | Integer | `int` | `443` | port, number of attempts |
        | Decimal | `float` | `0.73` | CPU load, CVSS score |
        | Boolean | `bool` | `True` / `False` | encrypted or not, public or private |
        | No value | `NoneType` | `None` | unknown result, empty field |

        Types do not mix automatically: `"8080" + 1` raises an error, because text and a number cannot be
        added together. You convert explicitly with `int("8080")`, `str(443)` or `float("7.5")`.

        To insert variables into text, use an **f-string**: an `f` in front of the quotes, and the variables
        between curly braces, for example `f"port {port} open"`.
  - heading:
      fr: "L'indentation, les conditions et les boucles"
      en: "Indentation, conditions and loops"
    body:
      fr: |
        En Python, les blocs de code ne sont pas délimités par des accolades mais par l'**indentation** :
        les lignes décalées de **4 espaces** sous un `if` ou un `for` appartiennent à ce bloc. La ligne qui
        ouvre le bloc se termine toujours par `:`.

        - `if` / `elif` / `else` : exécuter un bloc **si** une condition est vraie ;
        - `for element in liste:` : répéter un bloc **pour chaque** élément ;
        - `while condition:` : répéter **tant que** la condition reste vraie ;
        - `break` sort de la boucle, `continue` passe directement à l'élément suivant.

        | Opérateur | Signification | Exemple vrai |
        |---|---|---|
        | `==` / `!=` | égal / différent | `port == 22` |
        | `<` `<=` `>` `>=` | comparaisons | `port < 1024` |
        | `and` / `or` / `not` | et / ou / non | `port == 23 and not encrypted` |
        | `in` | « est contenu dans » | `"error" in line` |

        Attention : `=` **affecte** une valeur, `==` **compare** deux valeurs.
      en: |
        In Python, blocks of code are not delimited by curly braces but by **indentation**: the lines
        shifted by **4 spaces** under an `if` or a `for` belong to that block. The line that opens the block
        always ends with `:`.

        - `if` / `elif` / `else`: run a block **if** a condition is true;
        - `for item in some_list:`: repeat a block **for each** item;
        - `while condition:`: repeat **as long as** the condition stays true;
        - `break` leaves the loop, `continue` jumps straight to the next item.

        | Operator | Meaning | True example |
        |---|---|---|
        | `==` / `!=` | equal / different | `port == 22` |
        | `<` `<=` `>` `>=` | comparisons | `port < 1024` |
        | `and` / `or` / `not` | and / or / not | `port == 23 and not encrypted` |
        | `in` | "is contained in" | `"error" in line` |

        Careful: `=` **assigns** a value, `==` **compares** two values.

examples:
  - title:
      fr: "Variables, types et f-strings"
      en: "Variables, types and f-strings"
    file: variables.py
    lang: python
    code: |
      # A variable is a name attached to a value
      hostname = "web-01"      # str   (text)
      port = 443               # int   (whole number)
      cpu_load = 0.73          # float (decimal number)
      is_public = True         # bool  (True or False)

      print("Host:", hostname)
      print("Port:", port)

      # f-string: the f before the quote lets you insert variables with {}
      print(f"{hostname} listens on port {port}")
      print(f"CPU load: {cpu_load:.0%} - exposed to Internet: {is_public}")

      # type() tells you what kind of value a variable holds
      print(type(port), type(hostname))

      # Text that looks like a number is still text: convert it before doing maths
      user_input = "8080"
      next_port = int(user_input) + 1
      print("Next port:", next_port)

      # len() gives the length of a text
      password = "Summer2026"
      print("Password length:", len(password))
    output: |
      Host: web-01
      Port: 443
      web-01 listens on port 443
      CPU load: 73% - exposed to Internet: True
      <class 'int'> <class 'str'>
      Next port: 8081
      Password length: 10
    note:
      fr: "Remplacez `int(user_input) + 1` par `user_input + 1` et relancez : Python refuse avec une `TypeError`. C'est une protection : le langage ne devine jamais une conversion à votre place."
      en: "Replace `int(user_input) + 1` with `user_input + 1` and run again: Python refuses with a `TypeError`. That is a safeguard: the language never guesses a conversion for you."

  - title:
      fr: "Conditions : reconnaître un service dangereux"
      en: "Conditions: recognising a dangerous service"
    file: conditions.py
    lang: python
    code: |
      port = 23
      encrypted = False

      # Only ONE branch runs: the first whose condition is true
      if port == 22:
          print("SSH: remote administration, encrypted")
      elif port == 23:
          print("Telnet: remote administration, NOT encrypted")
      elif port == 443:
          print("HTTPS: encrypted web traffic")
      else:
          print("Unknown service")

      # Conditions can be combined with and / or / not
      if port < 1024 and not encrypted:
          print("ALERT: clear-text protocol on a well-known port")

      # "in" checks whether a value is part of a group
      if port in (21, 23, 69):
          print("Recommendation: disable this legacy service")
    output: |
      Telnet: remote administration, NOT encrypted
      ALERT: clear-text protocol on a well-known port
      Recommendation: disable this legacy service
    note:
      fr: "Changez `port = 23` en `port = 22` puis en `port = 8080` pour voir chaque branche s'exécuter. Remarquez les `:` en fin de ligne et les 4 espaces d'indentation : sans eux, Python lève une `IndentationError`."
      en: "Change `port = 23` to `port = 22` and then to `port = 8080` to see each branch run. Notice the `:` at the end of the line and the 4 spaces of indentation: without them Python raises an `IndentationError`."

  - title:
      fr: "Boucles : parcourir des ports et verrouiller un compte"
      en: "Loops: walking through ports and locking an account"
    file: loops.py
    lang: python
    code: |
      # for: repeat the block once per item of the list
      open_ports = [22, 80, 443, 3306, 6379]
      database_ports = (3306, 5432, 6379, 27017)
      exposed = 0

      for port in open_ports:
          if port in database_ports:
              print(f"Port {port}: a database should never face the Internet")
              exposed = exposed + 1
          else:
              print(f"Port {port}: ok")

      print("Exposed databases:", exposed)

      # range(1, 4) produces 1, 2, 3 (the end value is excluded)
      for attempt in range(1, 4):
          print(f"Login attempt {attempt}")

      # while: repeat as long as the condition is true
      failures = 0
      max_failures = 3
      while failures < max_failures:
          failures += 1            # same as: failures = failures + 1
      print(f"Account locked after {failures} failures")
    output: |
      Port 22: ok
      Port 80: ok
      Port 443: ok
      Port 3306: a database should never face the Internet
      Port 6379: a database should never face the Internet
      Exposed databases: 2
      Login attempt 1
      Login attempt 2
      Login attempt 3
      Account locked after 3 failures
    note:
      fr: "`for` sert quand on connaît la liste à parcourir, `while` quand on attend qu'une condition change. Une boucle `while` dont la condition ne devient jamais fausse tourne indéfiniment : vérifiez toujours qu'une ligne du bloc fait évoluer la condition."
      en: "Use `for` when you know the list to walk through, `while` when you wait for a condition to change. A `while` loop whose condition never becomes false runs forever: always check that a line in the block makes the condition evolve."

  - title:
      fr: "Cas réel, version dangereuse : faire confiance à une saisie"
      en: "Real case, dangerous version: trusting an input"
    file: check_port_vulnerable.py
    lang: python
    kind: vulnerable
    code: |
      # Values typed by users or read from a form are ALWAYS text
      raw_values = ["443", "99999", "22; rm -rf /"]

      for raw in raw_values:
          # No check at all: whatever was typed is used as it is
          print("Running: scan --port " + raw)
    output: |
      Running: scan --port 443
      Running: scan --port 99999
      Running: scan --port 22; rm -rf /
    note:
      fr: "Le script « marche », mais il accepte un port qui n'existe pas (99999) et, pire, un texte qui contient une commande. Si cette chaîne était passée à un terminal, `rm -rf /` serait exécuté : c'est une **injection de commande**."
      en: "The script \"works\", but it accepts a port that does not exist (99999) and, worse, a text that contains a command. If that string were handed to a terminal, `rm -rf /` would be executed: this is a **command injection**."

  - title:
      fr: "Cas réel, version sûre : valider avant d'utiliser"
      en: "Real case, safe version: validate before use"
    file: check_port_secure.py
    lang: python
    kind: secure
    code: |
      raw_values = ["443", "99999", "22; rm -rf /"]

      for raw in raw_values:
          # Rule 1: only digits are accepted (isdigit() is False for "22; rm -rf /")
          if not raw.isdigit():
              print(f"REJECTED {raw!r}: not a number")
              continue                      # skip to the next value

          # Rule 2: convert to int, then check the valid range of TCP ports
          port = int(raw)
          if port < 1 or port > 65535:
              print(f"REJECTED {port}: out of range 1-65535")
              continue

          print(f"OK: scan --port {port}")
    output: |
      OK: scan --port 443
      REJECTED 99999: out of range 1-65535
      REJECTED '22; rm -rf /': not a number
    note:
      fr: "Deux contrôles suffisent : le **format** (uniquement des chiffres) puis la **plage** (1 à 65535). `{raw!r}` affiche la valeur entre guillemets, ce qui rend visibles les caractères suspects dans un journal."
      en: "Two checks are enough: the **format** (digits only) then the **range** (1 to 65535). `{raw!r}` prints the value between quotes, which makes suspicious characters visible in a log."

mistake:
  fr: |
    **Confondre `=` et `==`, et mélanger tabulations et espaces.**

    - `if port = 22:` est une erreur de syntaxe : `=` range une valeur dans une variable, `==` pose la
      question « est-ce égal ? ».
    - L'indentation fait partie du langage. Un bloc indenté tantôt avec une tabulation, tantôt avec des
      espaces provoque `TabError` ou, pire, un code qui ne fait pas ce que vous croyez. Réglez votre éditeur
      sur **4 espaces** et n'y pensez plus.
    - `"22" == 22` vaut `False` : un texte n'est jamais égal à un nombre. Convertissez d'abord avec `int()`.
  en: |
    **Confusing `=` with `==`, and mixing tabs and spaces.**

    - `if port = 22:` is a syntax error: `=` stores a value in a variable, `==` asks the question "is it
      equal?".
    - Indentation is part of the language. A block indented sometimes with a tab and sometimes with spaces
      triggers `TabError` or, worse, code that does not do what you think. Set your editor to **4 spaces**
      and forget about it.
    - `"22" == 22` is `False`: a text is never equal to a number. Convert first with `int()`.

bestPractice:
  fr: |
    - **Toute donnée venue de l'extérieur est du texte non fiable** : vérifiez son format et sa plage avant
      de l'utiliser (c'est la validation d'entrée, base de la sécurité applicative).
    - **Nommez clairement vos variables** : `failed_logins` plutôt que `x`. Un script de sécurité est relu
      pendant un incident, souvent par quelqu'un d'autre.
    - **Utilisez Python 3 à jour** (3.12 ou plus récent) : Python 2 n'est plus maintenu depuis 2020 et ne
      reçoit plus aucun correctif de sécurité.
    - **Ne mettez jamais de mot de passe ou de clé dans une variable du script** : vous verrez dans la suite
      du cours comment les lire depuis l'environnement.
    - **Suivez PEP 8**, le guide de style officiel : 4 espaces, noms en `snake_case`, lignes courtes.
  en: |
    - **Any data coming from outside is untrusted text**: check its format and range before using it (this
      is input validation, the foundation of application security).
    - **Name your variables clearly**: `failed_logins` rather than `x`. A security script gets re-read
      during an incident, often by somebody else.
    - **Use an up-to-date Python 3** (3.12 or newer): Python 2 has been unmaintained since 2020 and no
      longer receives any security fix.
    - **Never put a password or a key in a script variable**: later in this course you will see how to read
      them from the environment.
    - **Follow PEP 8**, the official style guide: 4 spaces, `snake_case` names, short lines.

exercise:
  statement:
    fr: |
      Vous recevez la liste des résultats de connexion d'un compte, dans l'ordre chronologique :

      ```python
      attempts = ["fail", "fail", "ok", "fail", "fail", "fail", "fail", "ok"]
      ```

      Écrivez un script qui parcourt cette liste et :

      1. compte les échecs **consécutifs** (un `"ok"` remet le compteur à zéro) ;
      2. affiche `Attempt N: account LOCKED` et arrête la boucle dès que 3 échecs consécutifs sont atteints ;
      3. affiche à la fin le nombre total de tentatives examinées.
    en: |
      You receive the list of login results for one account, in chronological order:

      ```python
      attempts = ["fail", "fail", "ok", "fail", "fail", "fail", "fail", "ok"]
      ```

      Write a script that walks through this list and:

      1. counts **consecutive** failures (an `"ok"` resets the counter to zero);
      2. prints `Attempt N: account LOCKED` and stops the loop as soon as 3 consecutive failures are reached;
      3. prints at the end the total number of attempts examined.
  solution:
    file: lockout.py
    lang: python
    code: |
      attempts = ["fail", "fail", "ok", "fail", "fail", "fail", "fail", "ok"]

      MAX_FAILURES = 3     # constants are written in capital letters by convention
      consecutive = 0
      examined = 0

      for result in attempts:
          examined += 1
          if result == "ok":
              consecutive = 0          # a successful login resets the counter
          else:
              consecutive += 1

          if consecutive >= MAX_FAILURES:
              print(f"Attempt {examined}: account LOCKED")
              break                    # stop reading: the account is locked

      print("Attempts examined:", examined)
    note:
      fr: "Le script affiche `Attempt 6: account LOCKED` puis `Attempts examined: 6`. Le `break` évite de traiter les tentatives suivantes : c'est exactement la logique d'un verrouillage de compte contre la force brute."
      en: "The script prints `Attempt 6: account LOCKED` then `Attempts examined: 6`. The `break` avoids processing the following attempts: this is exactly the logic of an account lockout against brute force."

quiz:
  - q:
      fr: "Quel est le type de la valeur `\"443\"` (avec les guillemets) ?"
      en: "What is the type of the value `\"443\"` (with the quotes)?"
    options:
      fr: ["int", "str", "float", "bool"]
      en: ["int", "str", "float", "bool"]
    answer: 1
    why:
      fr: "Tout ce qui est entre guillemets est du texte (`str`), même si cela ressemble à un nombre. Il faut `int(\"443\")` pour obtenir un entier."
      en: "Anything between quotes is text (`str`), even if it looks like a number. You need `int(\"443\")` to get an integer."
  - q:
      fr: "Comment Python sait-il quelles lignes appartiennent à un bloc `if` ?"
      en: "How does Python know which lines belong to an `if` block?"
    options:
      fr:
        - "Grâce aux accolades { }"
        - "Grâce au mot-clé end"
        - "Grâce aux points-virgules"
        - "Grâce à l'indentation"
      en:
        - "Thanks to curly braces { }"
        - "Thanks to the end keyword"
        - "Thanks to semicolons"
        - "Thanks to indentation"
    answer: 3
    why:
      fr: "Les lignes décalées (4 espaces par convention) sous la ligne terminée par `:` forment le bloc. L'indentation fait partie de la syntaxe."
      en: "The lines shifted (4 spaces by convention) under the line ending with `:` form the block. Indentation is part of the syntax."
  - q:
      fr: "Que produit `range(1, 4)` dans une boucle `for` ?"
      en: "What does `range(1, 4)` produce in a `for` loop?"
    options:
      fr: ["1, 2, 3", "1, 2, 3, 4", "0, 1, 2, 3", "1 et 4 uniquement"]
      en: ["1, 2, 3", "1, 2, 3, 4", "0, 1, 2, 3", "1 and 4 only"]
    answer: 0
    why:
      fr: "`range(début, fin)` commence à `début` et s'arrête **avant** `fin` : la borne de fin est exclue."
      en: "`range(start, stop)` begins at `start` and ends **before** `stop`: the stop value is excluded."
  - q:
      fr: "Dans la version sûre du cas réel, pourquoi la valeur `\"22; rm -rf /\"` est-elle rejetée ?"
      en: "In the safe version of the real case, why is the value `\"22; rm -rf /\"` rejected?"
    options:
      fr:
        - "Parce qu'elle est trop longue"
        - "Parce que le port 22 est interdit"
        - "Parce que `isdigit()` renvoie False dès qu'un caractère n'est pas un chiffre"
        - "Parce que Python détecte automatiquement les commandes dangereuses"
      en:
        - "Because it is too long"
        - "Because port 22 is forbidden"
        - "Because `isdigit()` returns False as soon as one character is not a digit"
        - "Because Python automatically detects dangerous commands"
    answer: 2
    why:
      fr: "Python ne détecte rien tout seul : c'est le contrôle de format `isdigit()` écrit par le développeur qui refuse tout ce qui n'est pas composé uniquement de chiffres."
      en: "Python detects nothing on its own: it is the `isdigit()` format check written by the developer that refuses anything not made of digits only."
  - q:
      fr: "Quelle est la différence entre `=` et `==` ?"
      en: "What is the difference between `=` and `==`?"
    options:
      fr:
        - "Aucune, ils sont interchangeables"
        - "`=` compare, `==` affecte"
        - "`=` affecte une valeur, `==` compare deux valeurs"
        - "`==` ne fonctionne qu'avec les nombres"
      en:
        - "None, they are interchangeable"
        - "`=` compares, `==` assigns"
        - "`=` assigns a value, `==` compares two values"
        - "`==` only works with numbers"
    answer: 2
    why:
      fr: "`port = 22` range 22 dans la variable ; `port == 22` renvoie `True` ou `False`. Les confondre dans un `if` provoque une erreur de syntaxe."
      en: "`port = 22` stores 22 in the variable; `port == 22` returns `True` or `False`. Mixing them up in an `if` causes a syntax error."
