          def __init__(self, capacity, refill_per_sec):
              self.capacity = capacity
              self.refill = refill_per_sec
              self.tokens = float(capacity)
              self.last = time.monotonic()
          def allow(self):
              ...  # à compléter
      ```
    en: |
      Complete the implementation of a **token bucket**: the `allow()` method must refill the bucket according to
      the elapsed time, spend a token if available (and return `True`), or deny (`False`) if the bucket is empty.

      ```python
      class TokenBucket:
          def __init__(self, capacity, refill_per_sec):
              self.capacity = capacity
              self.refill = refill_per_sec
              self.tokens = float(capacity)
              self.last = time.monotonic()
          def allow(self):
              ...  # to complete
      ```
  solution:
    file: solution.py
    lang: python
    code: |
      import time


      class TokenBucket:
          def __init__(self, capacity, refill_per_sec):
              self.capacity = capacity
              self.refill = refill_per_sec
              self.tokens = float(capacity)
              self.last = time.monotonic()

          def allow(self):
              now = time.monotonic()
              # 1. Refill based on elapsed time, never above capacity.
              self.tokens = min(self.capacity,
                                self.tokens + (now - self.last) * self.refill)
              self.last = now
              # 2. Spend a token if one is available, else deny.
              if self.tokens >= 1:
                  self.tokens -= 1
                  return True
              return False


      # Quick check: 3 allowed immediately, then denied.
      b = TokenBucket(capacity=3, refill_per_sec=1)
      print([b.allow() for _ in range(5)])  # [True, True, True, False, False]
    note:
      fr: "La recharge est proportionnelle au temps écoulé et plafonnée à `capacity`. Une requête consomme un jeton si le seau n'est pas vide, sinon elle est refusée (ce qui correspond à un `429`). Le seau se recharge ensuite au débit configuré."
      en: "The refill is proportional to elapsed time and capped at `capacity`. A request spends a token if the bucket is not empty, otherwise it is denied (which maps to a `429`). The bucket then refills at the configured rate."

quiz:
  - q:
      fr: "Quelle faille OWASP API le rate limiting prévient-il principalement ?"
      en: "Which OWASP API flaw does rate limiting mainly prevent?"
    options:
      fr: ["Unrestricted Resource Consumption (API4)", "Broken Object Level Authorization (API1)", "SSRF (API7)", "Security Misconfiguration (API8)"]
      en: ["Unrestricted Resource Consumption (API4)", "Broken Object Level Authorization (API1)", "SSRF (API7)", "Security Misconfiguration (API8)"]
    answer: 0
    why:
      fr: "Le rate limiting borne la consommation de ressources (force brute, DoS, explosion de coûts), ce qui correspond à la faille API4 de l'OWASP."
      en: "Rate limiting bounds resource consumption (brute force, DoS, cost blow-up), which maps to OWASP's API4 flaw."
  - q:
      fr: "Quel est le défaut de l'algorithme de fenêtre fixe ?"
      en: "What is the flaw of the fixed-window algorithm?"
    options:
      fr: ["Il consomme trop de mémoire", "Il autorise un pic double à la jonction de deux fenêtres", "Il bloque tout le trafic", "Il ne compte pas les requêtes"]
      en: ["It uses too much memory", "It allows a double spike at the junction of two windows", "It blocks all traffic", "It does not count requests"]
    answer: 1
    why:
      fr: "Avec une fenêtre fixe, un client peut envoyer la limite en fin de fenêtre puis à nouveau au début de la suivante, concentrant le double du débit sur un court instant."
      en: "With a fixed window, a client can send the limit at the end of one window then again at the start of the next, concentrating double the rate in a short moment."
  - q:
      fr: "Quel avantage distinctif offre le token bucket ?"
      en: "What distinctive advantage does the token bucket offer?"
    options:
      fr: ["Il interdit toute rafale", "Il autorise des rafales contrôlées tout en bornant le débit moyen", "Il n'a aucun paramètre", "Il chiffre les requêtes"]
      en: ["It forbids any burst", "It allows controlled bursts while bounding the average rate", "It has no parameters", "It encrypts requests"]
    answer: 1
    why:
      fr: "Le token bucket tolère une rafale jusqu'à la taille du seau, tout en garantissant un débit moyen égal à la vitesse de remplissage : souple et prévisible."
      en: "The token bucket tolerates a burst up to the bucket size while guaranteeing an average rate equal to the refill speed: flexible and predictable."
  - q:
      fr: "Pourquoi stocker les compteurs dans Redis quand le service a plusieurs instances ?"
      en: "Why store the counters in Redis when the service has several instances?"
    options:
      fr: ["Pour chiffrer les requêtes", "Pour que la limite soit partagée et non multipliée par instance", "Pour accélérer l'API", "Pour réduire les logs"]
      en: ["To encrypt requests", "So the limit is shared and not multiplied per instance", "To speed up the API", "To reduce logs"]
    answer: 1
    why:
      fr: "Sans store partagé, chaque instance applique la limite de son côté, et le débit total autorisé est multiplié par le nombre d'instances ; Redis centralise le compteur."
      en: "Without a shared store, each instance applies the limit on its own, and the total allowed rate is multiplied by the instance count; Redis centralises the counter."
  - q:
      fr: "Quel code HTTP et quel en-tête renvoyer lorsqu'une limite est atteinte ?"
      en: "Which HTTP code and header should you return when a limit is reached?"
    options:
      fr: ["500 avec Content-Type", "403 avec Set-Cookie", "200 avec Cache-Control", "429 avec Retry-After"]
      en: ["500 with Content-Type", "403 with Set-Cookie", "200 with Cache-Control", "429 with Retry-After"]
    answer: 3
    why:
      fr: "`429 Too Many Requests` signale une limite dépassée, et `Retry-After` indique au client honnête quand réessayer, ce qui évite qu'il insiste inutilement."
      en: "`429 Too Many Requests` signals an exceeded limit, and `Retry-After` tells an honest client when to retry, avoiding needless hammering."
