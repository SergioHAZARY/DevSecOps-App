description:
  fr: "Comprendre, pour s'en défendre, le bourrage d'identifiants, la pulvérisation et la force brute, et pourquoi réutiliser un mot de passe est si dangereux."
  en: "Understand, in order to defend against them, credential stuffing, password spraying and brute force, and why reusing a password is so dangerous."
duration: 20

intro:
  fr: |
    Après une fuite de données, des milliards d'identifiants circulent. Les attaquants ne « devinent » pas au
    hasard : ils **rejouent** des couples e-mail/mot de passe déjà connus, ou testent un seul mot de passe
    très courant sur des milliers de comptes. Cette leçon décrit ces techniques **pour les reconnaître et les
    bloquer**, pas pour les mener.

    Pensez à un trousseau de clés perdu dans la rue. Le voleur honnête rendrait le trousseau ; le malhonnête
    va essayer chaque clé sur toutes les portes du quartier. Si vous avez utilisé **la même clé** pour la
    maison, le garage et la cave, une seule fuite ouvre tout. C'est exactement ce qui se passe quand on
    réutilise un mot de passe.

    **Cadre :** aucune de ces techniques ne doit viser un compte qui n'est pas le vôtre. On étudie le
    **mécanisme** et surtout la **défense** (limitation de débit, MFA, détection). Les exemples de code
    tournent en local, sur des données fictives, pour illustrer la logique côté serveur.
  en: |
    After a data breach, billions of credentials circulate. Attackers do not "guess" at random: they
    **replay** already-known email/password pairs, or test a single very common password against thousands of
    accounts. This lesson describes these techniques **to recognise and block them**, not to run them.

    Think of a lost keyring in the street. The honest finder returns it; the dishonest one tries every key on
    every door in the neighbourhood. If you used **the same key** for the house, the garage and the cellar,
    one loss opens everything. That is exactly what happens when you reuse a password.

    **Scope:** none of these techniques may target an account that is not yours. We study the **mechanism**
    and above all the **defence** (rate limiting, MFA, detection). The code examples run locally, on fictional
    data, to illustrate the server-side logic.

sections:
  - heading:
      fr: "Trois attaques, trois logiques"
      en: "Three attacks, three logics"
    body:
      fr: |
        On confond souvent ces attaques ; elles sont pourtant très différentes, et chacune appelle une défense
        propre.

        | Attaque | Principe | Point faible exploité | Signe côté serveur |
        |---|---|---|---|
        | Bourrage (stuffing) | Rejouer des couples email+mdp fuités | **Réutilisation** de mots de passe | Beaucoup de comptes, 1 essai chacun, succès épars |
        | Pulvérisation (spraying) | 1 mot de passe courant sur N comptes | Mots de passe **faibles/par défaut** | 1 mdp, des milliers de comptes, lent |
        | Force brute | Essayer tous les mdp d'**un** compte | Absence de **limitation** | 1 compte, des milliers d'essais rapides |

        Le bourrage est le plus courant et le plus efficace, car il n'exige pas de « deviner » : les mots de
        passe sont déjà corrects quelque part. La pulvérisation contourne les blocages de compte en restant
        « bas et lent » (peu d'essais par compte). La force brute classique, elle, est bruyante et facile à
        détecter — c'est pourquoi les attaquants la réservent aux hachages volés, hors ligne.
      en: |
        These attacks are often confused; yet they are very different, and each calls for its own defence.

        | Attack | Principle | Weakness exploited | Server-side sign |
        |---|---|---|---|
        | Stuffing | Replay leaked email+password pairs | Password **reuse** | Many accounts, 1 try each, scattered success |
        | Spraying | 1 common password over N accounts | **Weak/default** passwords | 1 password, thousands of accounts, slow |
        | Brute force | Try every password for **one** account | Lack of **rate limiting** | 1 account, thousands of fast attempts |

        Stuffing is the most common and effective, because it needs no "guessing": the passwords are already
        correct somewhere. Spraying bypasses account lockouts by staying "low and slow" (few attempts per
        account). Classic brute force is noisy and easy to detect — which is why attackers keep it for stolen
        hashes, offline.
  - heading:
      fr: "Pourquoi la réutilisation est la vraie faille"
      en: "Why reuse is the real flaw"
    body:
      fr: |
        Le bourrage d'identifiants ne fonctionne que grâce à un comportement humain : **réutiliser** le même
        mot de passe sur plusieurs sites. Quand un petit forum sans importance se fait pirater, les attaquants
        récupèrent votre `email + mot de passe` et les essaient sur votre banque, votre messagerie, vos réseaux
        sociaux. Si c'est le même, tout tombe.

        Les chiffres sont parlants : un lot de bourrage réussit en moyenne sur **0,1 à 2 %** des comptes. Cela
        paraît faible, mais sur dix millions de couples, c'est des dizaines de milliers de comptes ouverts,
        pour un coût quasi nul. La contre-mesure la plus puissante côté utilisateur est donc simple : **un mot
        de passe unique par site** (via un gestionnaire) et **le MFA**, qui rend le mot de passe seul
        insuffisant. Côté plateforme, on détecte le motif (beaucoup de comptes, un essai chacun) et on vérifie
        les mots de passe contre les bases de fuites connues.
      en: |
        Credential stuffing only works thanks to one human behaviour: **reusing** the same password across
        several sites. When a small, unimportant forum gets breached, attackers grab your `email + password`
        and try them on your bank, your mailbox, your social accounts. If it is the same, everything falls.

        The numbers are telling: a stuffing batch succeeds on average against **0.1 to 2%** of accounts. That
        sounds small, but on ten million pairs it is tens of thousands of opened accounts, at almost no cost.
        The most powerful user-side countermeasure is therefore simple: **a unique password per site** (via a
        manager) and **MFA**, which makes the password alone insufficient. On the platform side, you detect
        the pattern (many accounts, one try each) and check passwords against known breach databases.

examples:
  - title:
      fr: "Détecter un motif de bourrage dans des journaux (local)"
      en: "Detecting a stuffing pattern in logs (local)"
    file: detect_stuffing.py
    lang: python
    kind: secure
    code: |
      # Defensive analytics on FICTIONAL login logs. Stuffing looks like: one source IP
      # trying MANY different accounts with ONE attempt each. We flag that shape.
      logs = [
          # (ip, username, success) - all fake data
          ("192.0.2.50", "alice@example.com", False),
          ("192.0.2.50", "bob@example.com",   False),
          ("192.0.2.50", "carol@example.com", True),
          ("192.0.2.50", "dave@example.com",  False),
          ("198.51.100.9", "alice@example.com", True),
      ]

      from collections import defaultdict
      distinct_accounts = defaultdict(set)
      for ip, user, ok in logs:
          distinct_accounts[ip].add(user)

      # An IP touching many distinct accounts is a stuffing signal, not a normal user.
      for ip, users in distinct_accounts.items():
          if len(users) >= 4:
              print(f"ALERT stuffing suspected from {ip}: {len(users)} distinct accounts")
    output: |
      ALERT stuffing suspected from 192.0.2.50: 4 distinct accounts
    note:
      fr: "La signature du bourrage est « une IP, beaucoup de comptes, un essai chacun ». Compter les comptes distincts par source est une détection simple et efficace."
      en: "The stuffing signature is 'one IP, many accounts, one try each'. Counting distinct accounts per source is a simple, effective detection."

  - title:
      fr: "Reconnaître la pulvérisation (low and slow)"
      en: "Recognising spraying (low and slow)"
    file: detect_spraying.py
    lang: python
    kind: secure
    code: |
      # Spraying = ONE password tried across MANY accounts, spaced out to dodge lockouts.
      # Defensive view: group failures by the (hashed) password attempted, not by account.
      import hashlib

      attempts = [
          ("alice@example.com", "Winter2026!"),
          ("bob@example.com",   "Winter2026!"),
          ("carol@example.com", "Winter2026!"),
          ("dave@example.com",  "Winter2026!"),
      ]

      # We never store attempted passwords in clear; we bucket by their hash.
      buckets = {}
      for user, pw in attempts:
          key = hashlib.sha256(pw.encode()).hexdigest()[:12]
          buckets.setdefault(key, set()).add(user)

      for key, users in buckets.items():
          if len(users) >= 3:
              print(f"ALERT spraying: same password tried on {len(users)} accounts (bucket {key})")
    output: |
      ALERT spraying: same password tried on 4 accounts (bucket 6b3a9c2f1e07)
    note:
      fr: "La pulvérisation se repère en regroupant les échecs par mot de passe tenté (haché, jamais en clair) : un même mot de passe sur plusieurs comptes est anormal."
      en: "Spraying is spotted by grouping failures by attempted password (hashed, never clear): the same password across several accounts is abnormal."

  - title:
      fr: "Pourquoi la force brute en ligne est vouée à l'échec"
      en: "Why online brute force is doomed"
    file: online_bruteforce.py
    lang: python
    kind: neutral
    code: |
      # A SERVER-SIDE simulation (no real target) showing why online brute force fails
      # once rate limiting exists. We model a login that sleeps and locks after 5 fails.
      import time

      FAKE_PASSWORD = "S3cret-unknown"   # unknown to the "attacker" loop below
      attempts, MAX = 0, 5

      for guess in ["123456", "password", "qwerty", "letmein", "dragon", "monkey"]:
          attempts += 1
          if attempts > MAX:
              print("Account locked - further attempts refused")
              break
          time.sleep(0.2)  # the server deliberately slows each try
          if guess == FAKE_PASSWORD:
              print("Would succeed:", guess)
              break
          print(f"Attempt {attempts} failed")
    output: |
      Attempt 1 failed
      Attempt 2 failed
      Attempt 3 failed
      Attempt 4 failed
      Attempt 5 failed
      Account locked - further attempts refused
    note:
      fr: "Avec une temporisation et un verrouillage après 5 échecs, la force brute en ligne s'épuise avant de réussir. C'est pourquoi les attaquants préfèrent le bourrage."
      en: "With a delay and a lockout after 5 failures, online brute force runs out before succeeding. This is why attackers prefer stuffing."

mistake:
  fr: |
    **Croire qu'un mot de passe « très compliqué » protège, même réutilisé partout.**

    La complexité ne sert à rien face au bourrage : si votre mot de passe ultra-robuste fuit d'un seul site,
    il est désormais connu, et les attaquants le rejouent tel quel sur tous vos autres comptes. La force d'un
    mot de passe ne compense jamais sa **réutilisation**. La seule parade est l'**unicité** (un mot de passe
    différent par site) combinée au **MFA**, qui rend le mot de passe seul insuffisant.
  en: |
    **Believing a "very complex" password protects you, even reused everywhere.**

    Complexity is useless against stuffing: if your ultra-strong password leaks from a single site, it is now
    known, and attackers replay it as-is on all your other accounts. A password's strength never makes up for
    its **reuse**. The only guard is **uniqueness** (a different password per site) combined with **MFA**,
    which makes the password alone insufficient.

bestPractice:
  fr: |
    - **Un mot de passe unique par site**, via un gestionnaire : le bourrage devient inoffensif.
    - **Activer le MFA** partout où c'est possible : un mot de passe fuité ne suffit plus à entrer.
    - **Vérifier ses adresses sur un service de fuites** (comme Have I Been Pwned) et changer les mots de passe exposés.
    - Côté plateforme : **limiter le débit**, détecter les motifs (bourrage, pulvérisation) et bloquer les mots de passe connus comme compromis.
    - **N'analyser que ses propres journaux et comptes** : on étudie la défense, jamais l'attaque d'autrui.
  en: |
    - **A unique password per site**, via a manager: stuffing becomes harmless.
    - **Enable MFA** wherever possible: a leaked password is no longer enough to get in.
    - **Check your addresses on a breach service** (such as Have I Been Pwned) and change exposed passwords.
    - On the platform side: **rate-limit**, detect patterns (stuffing, spraying) and block passwords known to be compromised.
    - **Only analyse your own logs and accounts**: you study the defence, never someone else's attack.

exercise:
  statement:
    fr: |
      Un service voit, en une heure, 50 000 tentatives de connexion échouées provenant de nombreuses adresses
      IP, chacune n'essayant qu'un ou deux comptes, avec quelques succès épars. De quelle attaque s'agit-il
      très probablement ? Citez deux défenses côté utilisateur et deux défenses côté plateforme.
    en: |
      A service sees, in one hour, 50,000 failed logins from many IP addresses, each trying only one or two
      accounts, with a few scattered successes. Which attack is this most likely? Name two user-side defences
      and two platform-side defences.
  solution:
    file: solution.md
    lang: markdown
    code: |
      # Diagnosis
      This is **credential stuffing**: many accounts, roughly one attempt each, distributed
      sources, and scattered successes (the accounts whose leaked password still works).
      It is NOT brute force (that targets one account with many tries) nor spraying
      (one password over many accounts).

      ## User-side defences
      1. A unique password per site (a leak elsewhere no longer opens this account).
      2. MFA enabled (a correct password alone is not enough to log in).

      ## Platform-side defences
      1. Check submitted passwords against a breach list (e.g. HIBP k-anonymity) and refuse known-compromised ones.
      2. Detect the pattern (many accounts from correlated sources) and add rate limiting, device/risk-based challenges, or CAPTCHA.
    note:
      fr: "Le motif « beaucoup de comptes, un essai chacun, succès épars » est la signature du bourrage. La réponse combine unicité + MFA côté utilisateur, détection + blocage des mots de passe compromis côté plateforme."
      en: "The 'many accounts, one try each, scattered success' pattern is the stuffing signature. The answer combines uniqueness + MFA on the user side, detection + blocking compromised passwords on the platform side."

quiz:
  - q:
      fr: "Quelle faiblesse humaine rend le bourrage d'identifiants efficace ?"
      en: "Which human weakness makes credential stuffing effective?"
    options:
      fr:
        - "La réutilisation du même mot de passe sur plusieurs sites"
        - "L'utilisation d'un gestionnaire de mots de passe"
        - "L'activation du MFA"
        - "Le chiffrement du disque"
      en:
        - "Reusing the same password across several sites"
        - "Using a password manager"
        - "Enabling MFA"
        - "Encrypting the disk"
    answer: 0
    why:
      fr: "Le bourrage rejoue des couples email+mdp fuités ; il ne marche que si le mot de passe est réutilisé ailleurs."
      en: "Stuffing replays leaked email+password pairs; it only works if the password is reused elsewhere."
  - q:
      fr: "En quoi la pulvérisation (spraying) diffère-t-elle de la force brute classique ?"
      en: "How does password spraying differ from classic brute force?"
    options:
      fr:
        - "Elle teste tous les mots de passe d'un seul compte"
        - "Elle teste un mot de passe courant sur de nombreux comptes"
        - "Elle n'utilise jamais Internet"
        - "Elle vise uniquement les administrateurs"
      en:
        - "It tries every password on a single account"
        - "It tries one common password across many accounts"
        - "It never uses the Internet"
        - "It targets only administrators"
    answer: 1
    why:
      fr: "La pulvérisation essaie un seul mot de passe courant sur beaucoup de comptes, en restant « bas et lent » pour éviter les verrouillages."
      en: "Spraying tries a single common password across many accounts, staying 'low and slow' to avoid lockouts."
  - q:
      fr: "Quelle défense neutralise le mieux le bourrage côté utilisateur ?"
      en: "Which defence best neutralises stuffing on the user side?"
    options:
      fr:
        - "Un mot de passe plus long, mais identique partout"
        - "Changer d'adresse e-mail chaque mois"
        - "Un mot de passe unique par site, plus le MFA"
        - "Désactiver les cookies"
      en:
        - "A longer password, but the same everywhere"
        - "Changing email address every month"
        - "A unique password per site, plus MFA"
        - "Disabling cookies"
    answer: 2
    why:
      fr: "L'unicité rend un mot de passe fuité inutile ailleurs, et le MFA fait qu'un mot de passe correct ne suffit plus."
      en: "Uniqueness makes a leaked password useless elsewhere, and MFA means a correct password is no longer enough."
  - q:
      fr: "Pourquoi la force brute en ligne est-elle rarement utilisée par les attaquants sérieux ?"
      en: "Why is online brute force rarely used by serious attackers?"
    options:
      fr:
        - "Parce qu'elle est interdite par le DNS"
        - "Parce qu'elle exige un mot de passe court"
        - "Parce qu'elle ne fonctionne que le week-end"
        - "Parce que la limitation de débit et le verrouillage l'épuisent vite"
      en:
        - "Because DNS forbids it"
        - "Because it requires a short password"
        - "Because it only works on weekends"
        - "Because rate limiting and lockout exhaust it quickly"
    answer: 3
    why:
      fr: "En ligne, la temporisation et le verrouillage après quelques échecs rendent la force brute inefficace ; elle est bruyante et vite détectée."
      en: "Online, delays and lockout after a few failures make brute force ineffective; it is noisy and quickly detected."
  - q:
      fr: "Comment détecter un bourrage côté serveur ?"
      en: "How do you detect stuffing on the server side?"
    options:
      fr:
        - "En comptant les comptes distincts touchés par une même source"
        - "En mesurant la température du serveur"
        - "En supprimant les journaux"
        - "En augmentant la longueur des mots de passe"
      en:
        - "By counting distinct accounts touched by one source"
        - "By measuring the server temperature"
        - "By deleting the logs"
        - "By increasing password length"
    answer: 0
    why:
      fr: "Le bourrage se signale par « une source, beaucoup de comptes, un essai chacun » : compter les comptes distincts par IP révèle le motif."
      en: "Stuffing shows up as 'one source, many accounts, one try each': counting distinct accounts per IP reveals the pattern."
