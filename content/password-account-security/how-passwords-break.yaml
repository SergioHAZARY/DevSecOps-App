description:
  fr: "Comprendre le hachage des mots de passe et pourquoi les hachages rapides sont faibles, en testant John et hashcat sur VOS propres hachages de laboratoire."
  en: "Understand password hashing and why fast hashes are weak, by testing John and hashcat on YOUR OWN lab hashes."
duration: 25

intro:
  fr: |
    Un site sérieux ne stocke jamais votre mot de passe en clair : il en garde une **empreinte** appelée
    **hachage** (ou *hash*). Une fonction de hachage transforme `motdepasse123` en une longue suite comme
    `ef797c...`, impossible à inverser directement. Pour vérifier votre connexion, le site rehache ce que
    vous tapez et compare les empreintes.

    Imaginez une machine à faire des smoothies : avec des fraises vous obtenez toujours le même smoothie,
    mais à partir du smoothie vous ne pouvez pas « reconstituer » les fraises. Le hachage, c'est pareil —
    sauf qu'un attaquant peut **essayer** des millions de fruits à la seconde et comparer les smoothies.
    C'est tout le problème des hachages **rapides**.

    **Cadre strictement éthique :** vous ne cassez QUE des hachages que vous avez générés vous-même, sur
    votre machine. Récupérer ou casser les mots de passe d'autrui est illégal. L'objectif est de
    **comprendre** pourquoi certains choix de hachage sont dangereux, pour mieux protéger ses comptes et ceux
    de ses utilisateurs.
  en: |
    A serious website never stores your password in clear text: it keeps a **fingerprint** called a **hash**.
    A hash function turns `password123` into a long string like `ef797c...`, impossible to reverse directly.
    To check your login, the site re-hashes what you type and compares the fingerprints.

    Picture a smoothie machine: strawberries always give the same smoothie, but from the smoothie you cannot
    "rebuild" the strawberries. Hashing is the same — except an attacker can **try** millions of fruits per
    second and compare the smoothies. That is the whole problem with **fast** hashes.

    **Strictly ethical scope:** you only crack hashes you generated yourself, on your own machine. Obtaining
    or cracking other people's passwords is illegal. The goal is to **understand** why certain hashing
    choices are dangerous, so you can better protect your own accounts and your users'.

sections:
  - heading:
      fr: "Hachage rapide contre hachage lent"
      en: "Fast hashing versus slow hashing"
    body:
      fr: |
        Toutes les fonctions de hachage ne se valent pas pour les mots de passe. Les unes sont conçues pour
        être **rapides** (bon pour vérifier un fichier), les autres **volontairement lentes** et salées (fait
        exprès pour les mots de passe).

        | Fonction | Vitesse | Pour mots de passe ? | Pourquoi |
        |---|---|---|---|
        | MD5, SHA-1 | Milliards/s sur GPU | Non | Trop rapide, cassable en masse |
        | SHA-256 nu | Très rapide | Non | Rapide = brute force facile |
        | bcrypt | Réglable (lent) | Oui | Facteur de coût configurable |
        | scrypt | Lent + mémoire | Oui | Résiste aux GPU |
        | Argon2id | Lent + mémoire | **Recommandé** | Gagnant du Password Hashing Competition |

        La clé : un hachage **lent** multiplie le temps de chaque essai. Si tester un mot de passe prend
        0,0000001 s (MD5) ou 0,3 s (bcrypt coût 12), un attaquant fait des milliards d'essais dans le premier
        cas, et quelques dizaines dans le second. C'est le même attaquant, le même matériel : seul le choix de
        la fonction change tout.
      en: |
        Not all hash functions are equal for passwords. Some are built to be **fast** (good for checking a
        file), others are **deliberately slow** and salted (made on purpose for passwords).

        | Function | Speed | For passwords? | Why |
        |---|---|---|---|
        | MD5, SHA-1 | Billions/s on GPU | No | Too fast, crackable in bulk |
        | Bare SHA-256 | Very fast | No | Fast = easy brute force |
        | bcrypt | Tunable (slow) | Yes | Configurable cost factor |
        | scrypt | Slow + memory | Yes | Resists GPUs |
        | Argon2id | Slow + memory | **Recommended** | Winner of the Password Hashing Competition |

        The key: a **slow** hash multiplies the time of every attempt. If testing one password takes
        0.0000001 s (MD5) or 0.3 s (bcrypt cost 12), an attacker makes billions of guesses in the first case
        and a few dozen in the second. Same attacker, same hardware: only the choice of function changes
        everything.
  - heading:
      fr: "Sel, poivre et tables arc-en-ciel"
      en: "Salt, pepper and rainbow tables"
    body:
      fr: |
        Deux mots de passe identiques donnent le même hachage. Un attaquant peut donc précalculer une immense
        table de correspondances (une **table arc-en-ciel**) et retrouver d'un coup tous les mots de passe
        courants. Le **sel** (*salt*) empêche cela : c'est une valeur aléatoire **unique par utilisateur**,
        ajoutée avant le hachage. Même deux `azerty` donnent alors deux hachages différents, et les tables
        précalculées deviennent inutiles.

        | Défense | Rôle | Où est-il stocké ? |
        |---|---|---|
        | Sel (salt) | Unique par compte, casse les tables arc-en-ciel | Avec le hachage, en base |
        | Poivre (pepper) | Secret global, ajouté avant le hachage | Hors base (variable d'env, HSM) |
        | Facteur de coût | Rend chaque essai lent | Dans le paramétrage du hachage |

        bcrypt, scrypt et Argon2id intègrent **nativement** un sel aléatoire : vous n'avez pas à le gérer à la
        main. Le poivre est un secret supplémentaire conservé ailleurs : même si la base fuit, l'attaquant lui
        manque pour tester les mots de passe.
      en: |
        Two identical passwords give the same hash. An attacker can therefore precompute a huge lookup table
        (a **rainbow table**) and recover all common passwords at once. The **salt** prevents this: a random
        value **unique per user**, added before hashing. Even two `azerty` then give two different hashes, and
        precomputed tables become useless.

        | Defence | Role | Where is it stored? |
        |---|---|---|
        | Salt | Unique per account, breaks rainbow tables | With the hash, in the database |
        | Pepper | Global secret, added before hashing | Outside the database (env var, HSM) |
        | Cost factor | Makes each attempt slow | In the hash parameters |

        bcrypt, scrypt and Argon2id build in a random salt **natively**: you do not manage it by hand. The
        pepper is an extra secret kept elsewhere: even if the database leaks, the attacker is missing it to
        test the passwords.

examples:
  - title:
      fr: "Voir pourquoi un hachage rapide est faible"
      en: "Seeing why a fast hash is weak"
    file: fast_hash.py
    lang: python
    kind: vulnerable
    code: |
      import hashlib
      import time

      # DO NOT use plain SHA-256 for passwords. This demo shows WHY: it is far too fast.
      # We hash a small dictionary and time it, as an attacker's loop would.
      candidates = ["azerty", "password123", "letmein", "dragon", "Tr0ub4dor&3"]
      target = hashlib.sha256("Tr0ub4dor&3".encode()).hexdigest()  # a stolen hash, lab only

      start = time.perf_counter()
      for guess in candidates:
          if hashlib.sha256(guess.encode()).hexdigest() == target:
              print("Cracked:", guess)
      elapsed = time.perf_counter() - start

      # A real GPU does BILLIONS of these per second - a tiny dictionary falls instantly.
      print(f"Tried {len(candidates)} guesses in {elapsed*1000:.3f} ms")
    output: |
      Cracked: Tr0ub4dor&3
      Tried 5 guesses in 0.012 ms
    note:
      fr: "SHA-256 nu est si rapide qu'une liste de mots de passe tombe instantanément. C'est exactement pourquoi on ne l'utilise jamais pour stocker des mots de passe."
      en: "Bare SHA-256 is so fast that a wordlist falls instantly. This is exactly why you never use it to store passwords."

  - title:
      fr: "Hacher correctement avec un facteur de coût (bcrypt)"
      en: "Hashing correctly with a cost factor (bcrypt)"
    file: slow_hash.py
    lang: python
    kind: secure
    code: |
      import bcrypt
      import time

      # bcrypt is deliberately slow and salts automatically. 'rounds' is the cost factor:
      # each +1 DOUBLES the work. 12 is a sane 2026 baseline for interactive logins.
      password = b"Tr0ub4dor&3"
      start = time.perf_counter()
      hashed = bcrypt.hashpw(password, bcrypt.gensalt(rounds=12))
      elapsed = time.perf_counter() - start

      # Verification uses the salt embedded in the hash string.
      print("Stored hash:", hashed.decode())
      print("Check OK   :", bcrypt.checkpw(password, hashed))
      print(f"One hash took {elapsed*1000:.1f} ms (an attacker pays this PER guess)")
    output: |
      Stored hash: $2b$12$Nn3kq7Qe6Xh2w5VtQ0b9u8yq2m1a3c4e5g6i7k8m9o0p1q2r3s4
      Check OK   : True
      One hash took 310.4 ms (an attacker pays this PER guess)
    note:
      fr: "Chaque essai coûte ~0,3 s au lieu de quelques nanosecondes. Le sel (`$2b$12$...`) est intégré au hachage. Le facteur de coût 12 est un bon point de départ en 2026."
      en: "Each guess costs ~0.3 s instead of a few nanoseconds. The salt (`$2b$12$...`) is embedded in the hash. Cost factor 12 is a good 2026 starting point."

  - title:
      fr: "Casser SES PROPRES hachages avec John the Ripper"
      en: "Cracking YOUR OWN hashes with John the Ripper"
    file: john_lab.sh
    lang: bash
    kind: neutral
    code: |
      # LAB ONLY: these are hashes YOU generated for your own accounts.
      # Never run this against credentials that are not yours - that is illegal.

      # Create a demo MD5 hash file (deliberately weak, to show the risk).
      echo -n "letmein" | md5sum | awk '{print "demo:"$1}' > myhashes.txt

      # John auto-detects the format and tries a wordlist (rockyou ships with Kali).
      john --format=raw-md5 --wordlist=/usr/share/wordlists/rockyou.txt myhashes.txt

      # Show what was cracked.
      john --show --format=raw-md5 myhashes.txt
    output: |
      Using default input encoding: UTF-8
      letmein          (demo)
      1g 0:00:00:00 DONE
      demo:letmein
      1 password hash cracked, 0 left
    note:
      fr: "John teste une liste de mots contre vos hachages de démo. Un MD5 d'un mot courant tombe en une fraction de seconde — la preuve pratique du danger des hachages rapides."
      en: "John tests a wordlist against your demo hashes. An MD5 of a common word falls in a fraction of a second — the practical proof of the fast-hash danger."

  - title:
      fr: "Mesurer la résistance avec hashcat (benchmark local)"
      en: "Measuring resistance with hashcat (local benchmark)"
    file: hashcat_bench.sh
    lang: bash
    kind: neutral
    code: |
      # LAB ONLY: a benchmark reveals how many guesses/second your hardware does
      # per algorithm. No real hash is attacked here - it is pure measurement.

      # Compare a fast hash (MD5, mode 0) with a slow one (bcrypt, mode 3200).
      hashcat -b -m 0      # raw MD5
      hashcat -b -m 3200   # bcrypt

      # The gap (often a MILLION-fold) is exactly why slow hashes protect passwords.
    output: |
      Hashmode: 0 - MD5
      Speed.#1.........:  18500.4 MH/s   (18.5 billion guesses/second)
      Hashmode: 3200 - bcrypt, Blowfish (cost 5)
      Speed.#1.........:     21500 H/s   (21 500 guesses/second)
    note:
      fr: "Le benchmark montre l'écart : ~18 milliards d'essais/s pour MD5 contre ~21 500 pour bcrypt. Un bon hachage transforme un brute force de secondes en des siècles."
      en: "The benchmark shows the gap: ~18 billion guesses/s for MD5 versus ~21,500 for bcrypt. A good hash turns a seconds-long brute force into centuries."

mistake:
  fr: |
    **Utiliser SHA-256 (ou MD5) « avec un sel » en croyant que c'est sécurisé.**

    Le sel empêche les tables arc-en-ciel, mais il ne ralentit **pas** les essais : un SHA-256 salé reste
    cassable à des milliards d'essais par seconde sur GPU. Pour les mots de passe, il faut une fonction
    **lente et gourmande en mémoire** (Argon2id, scrypt, bcrypt), pas un hachage rapide bricolé avec un sel.
    Et on ne teste jamais que ses propres hachages, générés pour l'exercice.
  en: |
    **Using SHA-256 (or MD5) "with a salt" and thinking it is secure.**

    The salt stops rainbow tables, but it does **not** slow down guesses: a salted SHA-256 is still crackable
    at billions of attempts per second on a GPU. For passwords you need a **slow, memory-hard** function
    (Argon2id, scrypt, bcrypt), not a fast hash patched with a salt. And you only ever test your own hashes,
    generated for the exercise.

bestPractice:
  fr: |
    - **Choisir Argon2id** par défaut (ou bcrypt/scrypt), jamais MD5/SHA pour les mots de passe.
    - **Laisser la bibliothèque gérer le sel** : bcrypt, scrypt et Argon2id l'intègrent automatiquement.
    - **Régler le facteur de coût** pour qu'un hachage prenne ~0,25 à 0,5 s sur votre matériel de production.
    - **Ajouter un poivre** (secret hors base) pour que la fuite de la base ne suffise pas à tester les mots de passe.
    - **N'auditer que ses propres hachages**, sur sa machine : casser ceux d'autrui est illégal.
  en: |
    - **Choose Argon2id** by default (or bcrypt/scrypt), never MD5/SHA for passwords.
    - **Let the library handle the salt**: bcrypt, scrypt and Argon2id build it in automatically.
    - **Tune the cost factor** so one hash takes ~0.25 to 0.5 s on your production hardware.
    - **Add a pepper** (secret outside the database) so a database leak alone is not enough to test passwords.
    - **Only audit your own hashes**, on your own machine: cracking others' is illegal.

exercise:
  statement:
    fr: |
      Un développeur stocke les mots de passe avec `sha256(password + salt)` et affirme que « le sel rend le
      système sûr ». Expliquez pourquoi c'est faux, puis écrivez quelques lignes de Python qui stockent et
      vérifient un mot de passe correctement avec `bcrypt` (sur un mot de passe de test que vous choisissez).
    en: |
      A developer stores passwords with `sha256(password + salt)` and claims "the salt makes the system
      safe". Explain why that is wrong, then write a few lines of Python that store and verify a password
      correctly with `bcrypt` (on a test password you choose).
  solution:
    file: solution.py
    lang: python
    code: |
      import bcrypt

      # Why the developer is wrong: the salt defeats rainbow tables, but SHA-256 is still
      # a FAST hash. A GPU tries billions of salted SHA-256 per second, so weak or common
      # passwords fall anyway. Passwords need a SLOW, memory-hard function.

      def store(password: str) -> bytes:
          # gensalt() creates a random per-user salt; rounds=12 sets the cost (slow on purpose).
          return bcrypt.hashpw(password.encode(), bcrypt.gensalt(rounds=12))

      def verify(password: str, stored: bytes) -> bool:
          # checkpw re-derives the hash using the salt embedded in 'stored' and compares safely.
          return bcrypt.checkpw(password.encode(), stored)

      h = store("correct horse battery staple")  # a test password of your choosing
      print("Match :", verify("correct horse battery staple", h))
      print("Wrong :", verify("guess", h))
    note:
      fr: "Le point clé : le sel n'est pas le problème, la **vitesse** l'est. bcrypt est lent par conception et gère le sel tout seul."
      en: "Key point: the salt is not the problem, the **speed** is. bcrypt is slow by design and manages the salt on its own."

quiz:
  - q:
      fr: "Pourquoi MD5 et SHA-256 nus sont-ils de mauvais choix pour stocker des mots de passe ?"
      en: "Why are bare MD5 and SHA-256 poor choices for storing passwords?"
    options:
      fr:
        - "Parce qu'ils sont trop rapides, donc faciles à brute-forcer"
        - "Parce qu'ils sont trop lents pour un serveur"
        - "Parce qu'ils ne produisent pas de hachage"
        - "Parce qu'ils chiffrent au lieu de hacher"
      en:
        - "Because they are too fast, so easy to brute-force"
        - "Because they are too slow for a server"
        - "Because they produce no hash"
        - "Because they encrypt instead of hashing"
    answer: 0
    why:
      fr: "Leur rapidité permet des milliards d'essais par seconde sur GPU : un mot de passe faible tombe immédiatement."
      en: "Their speed allows billions of guesses per second on a GPU: a weak password falls immediately."
  - q:
      fr: "À quoi sert un sel (salt) dans le hachage d'un mot de passe ?"
      en: "What is a salt used for in password hashing?"
    options:
      fr:
        - "À ralentir chaque essai de l'attaquant"
        - "À chiffrer la base de données"
        - "À rendre chaque hachage unique et casser les tables arc-en-ciel"
        - "À compresser le mot de passe"
      en:
        - "To slow down each attacker guess"
        - "To encrypt the database"
        - "To make each hash unique and break rainbow tables"
        - "To compress the password"
    answer: 2
    why:
      fr: "Le sel, unique par compte, empêche deux mots de passe identiques d'avoir le même hachage, rendant les tables précalculées inutiles."
      en: "The salt, unique per account, stops two identical passwords from sharing a hash, making precomputed tables useless."
  - q:
      fr: "Quelle fonction est recommandée aujourd'hui pour hacher des mots de passe ?"
      en: "Which function is recommended today for hashing passwords?"
    options:
      fr:
        - "SHA-1"
        - "Argon2id"
        - "MD5"
        - "CRC32"
      en:
        - "SHA-1"
        - "Argon2id"
        - "MD5"
        - "CRC32"
    answer: 1
    why:
      fr: "Argon2id, lent et gourmand en mémoire, a remporté le Password Hashing Competition et résiste aux GPU."
      en: "Argon2id, slow and memory-hard, won the Password Hashing Competition and resists GPUs."
  - q:
      fr: "Que mesure un benchmark hashcat (`hashcat -b`) ?"
      en: "What does a hashcat benchmark (`hashcat -b`) measure?"
    options:
      fr:
        - "La taille des mots de passe stockés"
        - "La solidité du réseau"
        - "Le nombre de comptes sur le serveur"
        - "Le nombre d'essais par seconde par algorithme"
      en:
        - "The size of the stored passwords"
        - "The network strength"
        - "The number of accounts on the server"
        - "The number of guesses per second per algorithm"
    answer: 3
    why:
      fr: "Le benchmark mesure la vitesse de hachage de votre matériel par algorithme : il montre l'énorme écart entre MD5 et bcrypt."
      en: "The benchmark measures your hardware's hashing speed per algorithm: it reveals the huge gap between MD5 and bcrypt."
  - q:
      fr: "Dans quel cadre peut-on casser des hachages de mots de passe pour apprendre ?"
      en: "In what scope may you crack password hashes to learn?"
    options:
      fr:
        - "Uniquement des hachages que l'on a générés soi-même, sur sa machine"
        - "Ceux d'une fuite de données trouvée en ligne"
        - "Ceux de ses collègues, pour les prévenir"
        - "N'importe quel hachage disponible publiquement"
      en:
        - "Only hashes you generated yourself, on your own machine"
        - "Those from a data breach found online"
        - "Your colleagues', to warn them"
        - "Any publicly available hash"
    answer: 0
    why:
      fr: "On ne casse que ses propres hachages, générés pour l'exercice. Casser ceux d'autrui, même « pour aider », est illégal."
      en: "You only crack your own hashes, generated for the exercise. Cracking others', even 'to help', is illegal."
