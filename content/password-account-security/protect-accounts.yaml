description:
  fr: "Protéger ses comptes en pratique : mots de passe uniques avec un gestionnaire, MFA, passkeys/WebAuthn et hygiène des moyens de récupération."
  en: "Protecting your accounts in practice: unique passwords with a manager, MFA, passkeys/WebAuthn and recovery hygiene."
duration: 20

intro:
  fr: |
    Vous savez désormais comment les comptes tombent. Place à la **défense personnelle** : quelques habitudes
    simples rendent la très grande majorité des attaques inefficaces. L'idée n'est pas de devenir paranoïaque,
    mais d'empiler des protections pour qu'aucune fuite isolée ne compromette toute votre vie numérique.

    C'est comme protéger ses clés : on ne met pas la même serrure partout (mots de passe uniques), on ajoute
    un verrou de sécurité (le MFA), on préfère une clé impossible à copier (les passkeys), et on range le
    double en lieu sûr (les codes de récupération). Chaque couche compense les faiblesses des autres.

    Cette leçon est **100 % défensive** : elle ne concerne que vos propres comptes. Vous allez voir comment
    générer et stocker des secrets, comparer les facteurs d'authentification, et comprendre pourquoi les
    passkeys représentent l'avenir de la connexion.
  en: |
    You now know how accounts fall. Time for **personal defence**: a few simple habits make the vast majority
    of attacks ineffective. The idea is not to become paranoid, but to stack protections so that no single
    leak compromises your whole digital life.

    It is like protecting your keys: you do not use the same lock everywhere (unique passwords), you add a
    deadbolt (MFA), you prefer a key that cannot be copied (passkeys), and you store the spare somewhere safe
    (recovery codes). Each layer offsets the weaknesses of the others.

    This lesson is **100% defensive**: it concerns only your own accounts. You will see how to generate and
    store secrets, compare authentication factors, and understand why passkeys are the future of signing in.

sections:
  - heading:
      fr: "Les quatre couches d'un compte solide"
      en: "The four layers of a solid account"
    body:
      fr: |
        Un compte bien protégé repose sur quatre couches complémentaires. Aucune n'est parfaite seule ;
        ensemble, elles sont très robustes.

        | Couche | Rôle | Outil |
        |---|---|---|
        | Mot de passe unique | Une fuite n'affecte qu'un site | Gestionnaire de mots de passe |
        | Second facteur (MFA) | Le mot de passe seul ne suffit plus | Appli TOTP, clé FIDO2 |
        | Passkey | Connexion résistante au phishing | WebAuthn (téléphone, clé, OS) |
        | Récupération saine | Pas de porte dérobée faible | Codes de secours hors ligne |

        La priorité est l'**unicité** : un mot de passe différent par site neutralise le bourrage
        d'identifiants. Comme on ne peut pas mémoriser 200 mots de passe forts, un **gestionnaire** les génère
        et les retient à votre place ; vous ne retenez qu'un mot de passe maître, long et unique. Par-dessus,
        le MFA (idéalement une passkey) rend un mot de passe fuité insuffisant pour entrer.
      en: |
        A well-protected account rests on four complementary layers. None is perfect alone; together, they are
        very robust.

        | Layer | Role | Tool |
        |---|---|---|
        | Unique password | A leak affects only one site | Password manager |
        | Second factor (MFA) | The password alone no longer suffices | TOTP app, FIDO2 key |
        | Passkey | Phishing-resistant login | WebAuthn (phone, key, OS) |
        | Healthy recovery | No weak back door | Offline backup codes |

        The priority is **uniqueness**: a different password per site neutralises credential stuffing. Since
        you cannot memorise 200 strong passwords, a **manager** generates and remembers them for you; you only
        memorise one master password, long and unique. On top, MFA (ideally a passkey) makes a leaked password
        insufficient to get in.
  - heading:
      fr: "Passkeys : pourquoi elles changent tout"
      en: "Passkeys: why they change everything"
    body:
      fr: |
        Une **passkey** (standard **WebAuthn/FIDO2**) remplace le mot de passe par une paire de clés
        cryptographiques. La clé **privée** reste sur votre appareil (téléphone, ordinateur, clé USB
        sécurisée) ; le site ne connaît que la clé **publique**. Pour vous connecter, votre appareil **signe**
        un défi envoyé par le site — rien de réutilisable ne transite.

        | | Mot de passe | TOTP (code à 6 chiffres) | Passkey |
        |---|---|---|---|
        | Secret transmis ? | Oui | Oui (le code) | Non (une signature) |
        | Hameçonnable ? | Oui | Oui (temps réel) | **Non** (lié au domaine) |
        | Rejouable si volé ? | Oui | Oui pendant 30 s | Non |
        | À mémoriser ? | Oui | Non | Non |

        L'atout décisif : la passkey est **liée au domaine légitime**. Si vous arrivez sur `exemple-login.com`
        au lieu de `example.com`, le navigateur **refuse** de signer. Le phishing, qui piège même les codes
        TOTP, devient inopérant. C'est pourquoi les grandes plateformes poussent les passkeys comme successeur
        du mot de passe.
      en: |
        A **passkey** (the **WebAuthn/FIDO2** standard) replaces the password with a pair of cryptographic
        keys. The **private** key stays on your device (phone, computer, secure USB key); the site only knows
        the **public** key. To sign in, your device **signs** a challenge sent by the site — nothing reusable
        travels.

        | | Password | TOTP (6-digit code) | Passkey |
        |---|---|---|---|
        | Secret transmitted? | Yes | Yes (the code) | No (a signature) |
        | Phishable? | Yes | Yes (real time) | **No** (bound to domain) |
        | Replayable if stolen? | Yes | Yes for 30 s | No |
        | To memorise? | Yes | No | No |

        The decisive strength: a passkey is **bound to the legitimate domain**. If you land on
        `example-login.com` instead of `example.com`, the browser **refuses** to sign. Phishing, which traps
        even TOTP codes, becomes powerless. That is why major platforms push passkeys as the successor to the
        password.

examples:
  - title:
      fr: "Générer un mot de passe fort et unique (stdlib)"
      en: "Generating a strong, unique password (stdlib)"
    file: gen_password.py
    lang: python
    kind: secure
    code: |
      import secrets
      import string

      # A manager does this for you, but here is the principle: cryptographically random,
      # long, from a wide alphabet. 'secrets' is the right module (NOT random) for security.
      def strong_password(length: int = 20) -> str:
          alphabet = string.ascii_letters + string.digits + "!@#$%^&*-_=+"
          # secrets.choice draws from a CSPRNG - unpredictable, unlike random.choice.
          return "".join(secrets.choice(alphabet) for _ in range(length))

      # Generate a DIFFERENT password per site so one leak never affects another.
      for site in ["bank.example.com", "mail.example.com", "shop.example.com"]:
          print(f"{site}: {strong_password()}")
    output: |
      bank.example.com: 7kR#2mQ9xL!vP4nZ8wd=
      mail.example.com: aB3$fH6&jK1pM9sT2uX-
      shop.example.com: Zq8!wE4rT7yU2iO5pA#d
    note:
      fr: "On utilise `secrets` (générateur cryptographique), pas `random`. Chaque site reçoit un mot de passe unique : c'est exactement le rôle d'un gestionnaire, montré ici à la main."
      en: "Use `secrets` (a cryptographic generator), not `random`. Each site gets a unique password: this is exactly a manager's job, shown here by hand."

  - title:
      fr: "Comprendre un code TOTP (le calcul réel)"
      en: "Understanding a TOTP code (the real computation)"
    file: totp_demo.py
    lang: python
    kind: neutral
    code: |
      import hmac, hashlib, struct, time, base64

      # TOTP (RFC 6238) is what authenticator apps compute. This shows the real math on
      # YOUR OWN demo secret - it is standard, open, and runs fully offline.
      def totp(secret_b32: str, step: int = 30, digits: int = 6) -> str:
          key = base64.b32decode(secret_b32)
          counter = int(time.time() // step)              # same 30s window on both sides
          msg = struct.pack(">Q", counter)
          digest = hmac.new(key, msg, hashlib.sha1).digest()
          offset = digest[-1] & 0x0F                       # dynamic truncation (RFC 4226)
          code = (struct.unpack(">I", digest[offset:offset+4])[0] & 0x7FFFFFFF) % (10 ** digits)
          return str(code).zfill(digits)

      SECRET = "JBSWY3DPEHPK3PXP"   # a demo Base32 secret, not a real account
      print("Current TOTP:", totp(SECRET))
    output: |
      Current TOTP: 284913
    note:
      fr: "Le code TOTP dérive d'un secret partagé et de l'heure courante (fenêtre de 30 s). Utile à comprendre, mais le TOTP reste hameçonnable : la passkey fait mieux."
      en: "The TOTP code derives from a shared secret and the current time (30s window). Useful to understand, but TOTP stays phishable: the passkey does better."

  - title:
      fr: "Enregistrer une passkey côté serveur (WebAuthn)"
      en: "Registering a passkey server-side (WebAuthn)"
    file: webauthn_options.py
    lang: python
    kind: secure
    code: |
      import secrets, base64, json

      # A server starts passkey registration by sending options to the browser's
      # navigator.credentials.create(). The browser binds the key to THIS domain (rpId),
      # which is what makes passkeys phishing-resistant.
      def registration_options(user_id: str, username: str) -> str:
          challenge = base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()
          options = {
              "challenge": challenge,              # fresh random, prevents replay
              "rp": {"id": "example.com", "name": "Example"},   # the legitimate domain
              "user": {"id": user_id, "name": username, "displayName": username},
              "pubKeyCredParams": [{"type": "public-key", "alg": -7}],  # ES256
              "authenticatorSelection": {"userVerification": "required"},
              "timeout": 60000,
          }
          return json.dumps(options, indent=2)

      print(registration_options("user-123", "alice@example.com"))
    output: |
      {
        "challenge": "s2Vk...redacted...",
        "rp": {
          "id": "example.com",
          "name": "Example"
        },
        "user": {
          "id": "user-123",
          "name": "alice@example.com",
          "displayName": "alice@example.com"
        },
        "pubKeyCredParams": [
          {
            "type": "public-key",
            "alg": -7
          }
        ],
        "authenticatorSelection": {
          "userVerification": "required"
        },
        "timeout": 60000
      }
    note:
      fr: "Le `rp.id` (`example.com`) lie la passkey au domaine légitime : le navigateur refusera de signer sur un site sosie. Le `challenge` aléatoire empêche le rejeu."
      en: "The `rp.id` (`example.com`) binds the passkey to the legitimate domain: the browser will refuse to sign on a look-alike site. The random `challenge` prevents replay."

  - title:
      fr: "Stocker ses codes de récupération, pas en clair dans un mail"
      en: "Storing recovery codes, not in clear in an email"
    file: recovery.py
    lang: python
    kind: secure
    code: |
      import secrets, hashlib

      # Recovery codes are a back door - treat them like passwords. A SERVICE should store
      # only their hashes, and the USER should keep the plaintext OFFLINE (printed, vault).
      def generate_codes(n: int = 8):
          codes = ["-".join(secrets.token_hex(2) for _ in range(2)) for _ in range(n)]
          # Server keeps only hashes; a database leak then exposes no usable code.
          hashes = {hashlib.sha256(c.encode()).hexdigest() for c in codes}
          return codes, hashes

      plain, stored = generate_codes()
      print("Show ONCE to the user (they store it offline):")
      for c in plain:
          print(" ", c)
      print("Server stores only hashes:", len(stored), "entries")
    output: |
      Show ONCE to the user (they store it offline):
        1a2b-3c4d
        5e6f-7a8b
        9c0d-1e2f
        3a4b-5c6d
        7e8f-9a0b
        1c2d-3e4f
        5a6b-7c8d
        9e0f-1a2b
      Server stores only hashes: 8 entries
    note:
      fr: "Les codes de secours sont une porte dérobée : le service n'en stocke que les hachages, l'utilisateur garde le texte **hors ligne**. Jamais dans un e-mail ou une note en clair."
      en: "Recovery codes are a back door: the service stores only their hashes, the user keeps the text **offline**. Never in an email or a clear note."

mistake:
  fr: |
    **Mettre un MFA solide sur la connexion mais laisser une récupération faible.**

    Beaucoup activent une clé FIDO2 puis gardent comme secours des « questions secrètes » (nom du chien,
    ville de naissance) trouvables en ligne, ou envoient les codes de récupération dans un e-mail jamais
    effacé. L'attaquant n'attaque pas la porte blindée : il passe par la fenêtre de récupération. Une chaîne
    de sécurité vaut son maillon le plus faible ; la récupération doit être aussi solide que la connexion
    principale.
  en: |
    **Putting strong MFA on login but leaving recovery weak.**

    Many enable a FIDO2 key, then keep "secret questions" (pet's name, birth city) as a fallback — findable
    online — or email themselves recovery codes that are never deleted. The attacker does not attack the
    armoured door: they go through the recovery window. A security chain is only as strong as its weakest
    link; recovery must be as solid as the main login.

bestPractice:
  fr: |
    - **Un gestionnaire de mots de passe** avec un mot de passe maître long et unique, protégé par MFA.
    - **Des passkeys** partout où c'est proposé : la meilleure défense contre le phishing.
    - **À défaut de passkey, une appli TOTP ou une clé FIDO2**, jamais le SMS si l'on peut l'éviter.
    - **Des codes de récupération hors ligne** (imprimés ou dans le coffre du gestionnaire), jamais en clair dans un e-mail.
    - **Vérifier régulièrement ses comptes** (sessions actives, appareils, fuites via Have I Been Pwned) et révoquer ce qui est inconnu.
  en: |
    - **A password manager** with a long, unique master password, protected by MFA.
    - **Passkeys** everywhere they are offered: the best defence against phishing.
    - **Failing a passkey, a TOTP app or a FIDO2 key**, never SMS if it can be avoided.
    - **Offline recovery codes** (printed or in the manager's vault), never in clear in an email.
    - **Review your accounts regularly** (active sessions, devices, leaks via Have I Been Pwned) and revoke anything unknown.

exercise:
  statement:
    fr: |
      Vous aidez un proche à sécuriser son compte e-mail principal (celui qui sert à réinitialiser tous les
      autres). Décrivez, dans l'ordre de priorité, les quatre mesures que vous mettez en place et expliquez,
      pour chacune, quel type d'attaque elle bloque.
    en: |
      You are helping a relative secure their main email account (the one used to reset all the others).
      Describe, in priority order, the four measures you put in place and explain, for each, which kind of
      attack it blocks.
  solution:
    file: solution.md
    lang: markdown
    code: |
      # Securing the main email account (priority order)

      1. **Unique, strong password via a manager.**
         Blocks: credential stuffing. A leak from any other site no longer opens this mailbox.

      2. **Passkey (WebAuthn) as the primary second factor, or at least a TOTP app.**
         Blocks: phishing and real-time relay. A passkey is bound to the real domain, so a
         fake login page cannot be used; it also defeats password-only takeover.

      3. **Remove weak recovery: no SMS fallback, no guessable secret questions.**
         Blocks: SIM swap and OSINT-based recovery abuse - the back door is closed.

      4. **Offline recovery codes + review of active sessions and connected apps.**
         Blocks: silent session hijacking and stale access. The spare key is offline, and
         any unknown session/device is revoked.
    note:
      fr: "L'ordre suit l'impact : unicité d'abord (bourrage), puis passkey (phishing), puis récupération saine (SIM swap/OSINT), puis contrôle des sessions. Chaque couche ferme un vecteur précis."
      en: "The order follows impact: uniqueness first (stuffing), then passkey (phishing), then healthy recovery (SIM swap/OSINT), then session review. Each layer closes a precise vector."

quiz:
  - q:
      fr: "Pourquoi un gestionnaire de mots de passe améliore-t-il la sécurité ?"
      en: "Why does a password manager improve security?"
    options:
      fr:
        - "Il permet d'avoir un mot de passe unique et fort par site"
        - "Il chiffre le disque dur"
        - "Il bloque les virus"
        - "Il remplace l'antivirus"
      en:
        - "It lets you have a unique, strong password per site"
        - "It encrypts the hard drive"
        - "It blocks viruses"
        - "It replaces the antivirus"
    answer: 0
    why:
      fr: "Le gestionnaire génère et mémorise un mot de passe différent par site, ce qui neutralise le bourrage d'identifiants."
      en: "The manager generates and remembers a different password per site, which neutralises credential stuffing."
  - q:
      fr: "Qu'est-ce qui rend une passkey résistante au phishing ?"
      en: "What makes a passkey phishing-resistant?"
    options:
      fr:
        - "Elle est plus longue qu'un mot de passe"
        - "Elle est liée au domaine légitime et ne transmet aucun secret réutilisable"
        - "Elle change toutes les 30 secondes"
        - "Elle est envoyée par SMS"
      en:
        - "It is longer than a password"
        - "It is bound to the legitimate domain and sends no reusable secret"
        - "It changes every 30 seconds"
        - "It is sent by SMS"
    answer: 1
    why:
      fr: "Le navigateur refuse de signer pour un domaine sosie, et seule une signature (non rejouable) transite : rien à hameçonner."
      en: "The browser refuses to sign for a look-alike domain, and only a non-replayable signature travels: nothing to phish."
  - q:
      fr: "Quel module Python faut-il utiliser pour générer un mot de passe sûr ?"
      en: "Which Python module should you use to generate a secure password?"
    options:
      fr:
        - "random"
        - "math"
        - "secrets"
        - "os.path"
      en:
        - "random"
        - "math"
        - "secrets"
        - "os.path"
    answer: 2
    why:
      fr: "`secrets` s'appuie sur un générateur cryptographique ; `random` est prévisible et ne doit pas servir pour la sécurité."
      en: "`secrets` uses a cryptographic generator; `random` is predictable and must not be used for security."
  - q:
      fr: "Comment un service doit-il stocker les codes de récupération ?"
      en: "How should a service store recovery codes?"
    options:
      fr:
        - "En clair dans la base pour pouvoir les rappeler"
        - "Dans un e-mail envoyé à l'utilisateur"
        - "Sur une page web publique"
        - "Sous forme de hachages, l'utilisateur gardant le texte hors ligne"
      en:
        - "In clear in the database to recall them"
        - "In an email sent to the user"
        - "On a public web page"
        - "As hashes, with the user keeping the text offline"
    answer: 3
    why:
      fr: "Comme des mots de passe, les codes de secours ne sont stockés que hachés côté serveur ; l'utilisateur en garde le texte hors ligne."
      en: "Like passwords, recovery codes are stored only hashed on the server; the user keeps the text offline."
  - q:
      fr: "Quelle erreur fréquente ruine une bonne protection de connexion ?"
      en: "Which common mistake ruins an otherwise good login protection?"
    options:
      fr:
        - "Laisser une récupération faible (SMS, questions secrètes devinables)"
        - "Utiliser une passkey"
        - "Avoir un mot de passe maître long"
        - "Vérifier ses sessions actives"
      en:
        - "Leaving weak recovery (SMS, guessable secret questions)"
        - "Using a passkey"
        - "Having a long master password"
        - "Reviewing active sessions"
    answer: 0
    why:
      fr: "L'attaquant passe par le maillon faible : une récupération mal protégée contourne même un MFA solide."
      en: "The attacker goes through the weak link: poorly protected recovery bypasses even strong MFA."
