description:
  fr: "Découvrir la rétro-ingénierie d'un binaire que VOUS possédez : compilation contre désassemblage, et les outils strings, objdump, gdb et Ghidra."
  en: "Discover reverse engineering of a binary YOU own: compilation versus disassembly, and the tools strings, objdump, gdb and Ghidra."
duration: 25

intro:
  fr: |
    La **rétro-ingénierie** (*reverse engineering*, RE) consiste à partir d'un programme **compilé** (un
    exécutable binaire) pour en comprendre le fonctionnement, sans avoir le code source. C'est une compétence
    défensive essentielle : analyser un malware, auditer un logiciel sans source, ou comprendre un format de
    fichier passent tous par là.

    Imaginez un plat au restaurant : le cuisinier a suivi une recette (le code source), mais vous ne recevez
    que l'assiette (le binaire). La rétro-ingénierie, c'est goûter, décortiquer les ingrédients et reconstituer
    la recette à partir du résultat. On ne retrouve jamais exactement le texte d'origine, mais on comprend ce
    que fait le plat.

    **Cadre strictement légal :** vous n'analysez QUE des binaires que vous possédez ou avez le droit d'étudier
    — un programme que vous avez compilé vous-même, un CrackMe de `crackmes.one`, ou un logiciel dont la
    licence autorise l'analyse. Rétro-concevoir un logiciel commercial protégé peut violer sa licence et la
    loi. Ici, on apprend la RE pour **mieux protéger** son propre logiciel, sujet de la dernière leçon.
  en: |
    **Reverse engineering** (RE) means starting from a **compiled** program (a binary executable) to
    understand how it works, without the source code. It is an essential defensive skill: analysing malware,
    auditing software without source, or understanding a file format all go through it.

    Picture a restaurant dish: the chef followed a recipe (the source code), but you only get the plate (the
    binary). Reverse engineering is tasting, breaking down the ingredients and reconstructing the recipe from
    the result. You never recover the exact original text, but you understand what the dish does.

    **Strictly legal scope:** you analyse ONLY binaries you own or are allowed to study — a program you
    compiled yourself, a CrackMe from `crackmes.one`, or software whose licence permits analysis.
    Reverse-engineering protected commercial software can breach its licence and the law. Here you learn RE
    to **better protect** your own software, the topic of the last lesson.

sections:
  - heading:
      fr: "De la source au binaire, et retour"
      en: "From source to binary, and back"
    body:
      fr: |
        Comprendre la RE, c'est d'abord comprendre ce que fait un **compilateur**. Il traduit un code lisible
        (C, Rust, Go...) en **instructions machine** propres au processeur, en perdant au passage les noms de
        variables, les commentaires et la structure claire.

        | Étape | Entrée | Sortie | Outil |
        |---|---|---|---|
        | Compilation | `main.c` (source) | code assembleur | `gcc -S` |
        | Assemblage | assembleur | binaire objet | `as` |
        | Édition de liens | objets | exécutable | `ld` |
        | **Désassemblage** | exécutable | assembleur (reconstitué) | `objdump`, Ghidra |
        | **Décompilation** | exécutable | pseudo-code C (approché) | Ghidra, IDA |

        La RE remonte ces flèches **à l'envers** : du binaire vers l'assembleur (désassemblage), puis vers un
        pseudo-C lisible (décompilation). On ne retrouve pas les commentaires ni les vrais noms, mais la logique
        du programme réapparaît. C'est pourquoi un secret caché dans un binaire n'est **jamais** vraiment caché.
      en: |
        Understanding RE starts with understanding what a **compiler** does. It translates readable code (C,
        Rust, Go...) into **machine instructions** specific to the processor, dropping variable names, comments
        and clear structure along the way.

        | Step | Input | Output | Tool |
        |---|---|---|---|
        | Compilation | `main.c` (source) | assembly code | `gcc -S` |
        | Assembly | assembly | object binary | `as` |
        | Linking | objects | executable | `ld` |
        | **Disassembly** | executable | assembly (reconstructed) | `objdump`, Ghidra |
        | **Decompilation** | executable | C pseudo-code (approximate) | Ghidra, IDA |

        RE walks these arrows **backwards**: from binary to assembly (disassembly), then to readable pseudo-C
        (decompilation). You do not recover comments or real names, but the program's logic reappears. That is
        why a secret hidden in a binary is **never** truly hidden.
  - heading:
      fr: "La boîte à outils de l'analyste"
      en: "The analyst's toolbox"
    body:
      fr: |
        Quatre outils forment la base, du plus simple au plus puissant :

        - **`strings`** : extrait les chaînes de caractères lisibles d'un binaire. En quelques secondes, on y
          trouve des messages, des URLs, parfois un mot de passe laissé en clair. C'est toujours le premier
          réflexe.
        - **`objdump -d`** : désassemble le binaire, affiche les instructions machine. Idéal pour lire une
          petite fonction sans interface graphique.
        - **`gdb`** : le débogueur. Il exécute le programme **pas à pas**, pose des points d'arrêt
          (*breakpoints*), inspecte les registres et la mémoire. C'est l'analyse **dynamique** (on observe le
          programme en train de tourner).
        - **Ghidra** : la suite de rétro-ingénierie open source de la NSA. Elle **décompile** le binaire en
          pseudo-C lisible, navigue entre fonctions, renomme les variables. C'est l'outil de référence pour
          l'analyse **statique** approfondie.

        Analyse **statique** (lire le code sans l'exécuter, avec Ghidra/objdump/strings) et analyse
        **dynamique** (observer l'exécution avec gdb) sont complémentaires : on alterne entre les deux selon ce
        qu'on cherche.
      en: |
        Four tools form the base, from simplest to most powerful:

        - **`strings`**: extracts the readable character strings from a binary. In seconds you find messages,
          URLs, sometimes a password left in clear. It is always the first reflex.
        - **`objdump -d`**: disassembles the binary, shows the machine instructions. Ideal to read a small
          function without a GUI.
        - **`gdb`**: the debugger. It runs the program **step by step**, sets breakpoints, inspects registers
          and memory. This is **dynamic** analysis (watching the program as it runs).
        - **Ghidra**: the NSA's open-source reverse-engineering suite. It **decompiles** the binary into
          readable pseudo-C, navigates between functions, renames variables. It is the reference tool for deep
          **static** analysis.

        **Static** analysis (reading the code without running it, with Ghidra/objdump/strings) and **dynamic**
        analysis (watching execution with gdb) are complementary: you alternate between the two depending on
        what you seek.

examples:
  - title:
      fr: "Un petit programme que vous compilez vous-même"
      en: "A small program you compile yourself"
    file: secret.c
    lang: c
    kind: neutral
    code: |
      #include <stdio.h>
      #include <string.h>

      // We compile THIS ourselves, so analysing it afterwards is fully legal.
      // It naively compares an input to a hard-coded value - a common beginner mistake.
      int main(int argc, char **argv) {
          const char *expected = "lab-passphrase-42";  // this will leak via 'strings'
          if (argc == 2 && strcmp(argv[1], expected) == 0) {
              puts("Access granted");
              return 0;
          }
          puts("Access denied");
          return 1;
      }
    output: |
      $ gcc -o secret secret.c
      $ ./secret wrong
      Access denied
      $ ./secret lab-passphrase-42
      Access granted
    note:
      fr: "Ce binaire, que vous compilez, servira de cobaye. Le mot de passe est codé en dur : la leçon est qu'un secret dans un binaire est récupérable, comme le montre l'exemple suivant."
      en: "This binary, which you compile, will be the guinea pig. The password is hard-coded: the lesson is that a secret in a binary is recoverable, as the next example shows."

  - title:
      fr: "Extraire les secrets avec strings"
      en: "Extracting secrets with strings"
    file: run_strings.sh
    lang: bash
    kind: vulnerable
    code: |
      # 'strings' lists printable sequences in the binary. It takes seconds and is the
      # first thing any analyst (or attacker) runs. Here it reveals the hard-coded value.
      strings ./secret | grep -i -E "pass|granted|denied"

      # Lesson: anything compiled into the binary (keys, URLs, passwords) is readable.
      # Never store a real secret inside a client binary - the next lessons expand on this.
    output: |
      lab-passphrase-42
      Access granted
      Access denied
    note:
      fr: "En une commande, le « secret » codé en dur apparaît. C'est la démonstration pratique qu'un binaire ne cache rien : la protection doit venir d'ailleurs (serveur, chiffrement à clé externe)."
      en: "In one command, the hard-coded 'secret' appears. It is the practical proof that a binary hides nothing: protection must come from elsewhere (server, external-key encryption)."

  - title:
      fr: "Désassembler la fonction main avec objdump"
      en: "Disassembling the main function with objdump"
    file: objdump.sh
    lang: bash
    kind: neutral
    code: |
      # -d disassembles; Intel syntax is easier to read than the default AT&T.
      # We focus on main to see the comparison that gates "Access granted".
      objdump -d -M intel ./secret | grep -A 20 "<main>:"

      # The 'call' to strcmp and the following test/jump are the decision point.
      # Understanding this is the basis for both cracking AND for designing defences.
    output: |
      0000000000001149 <main>:
        1149:  push   rbp
        114a:  mov    rbp,rsp
        ...
        1180:  call   1050 <strcmp@plt>
        1185:  test   eax,eax
        1187:  jne    119a <main+0x51>     ; jump to "Access denied" if not equal
        1189:  lea    rax,[rip+0xe74]      ; "Access granted"
    note:
      fr: "Le couple `test eax,eax` + `jne` est la décision du programme. Repérer ce saut conditionnel est le point de départ de la leçon « CrackMe » et de la leçon « patching »."
      en: "The `test eax,eax` + `jne` pair is the program's decision. Spotting this conditional jump is the starting point for the 'CrackMe' and 'patching' lessons."

  - title:
      fr: "Analyse dynamique pas à pas avec gdb"
      en: "Dynamic step-by-step analysis with gdb"
    file: gdb_session.txt
    lang: text
    kind: neutral
    code: |
      # gdb runs YOUR binary under control. We break at main, run, and inspect the
      # comparison live. This is dynamic analysis - watching real values at runtime.
      $ gdb -q ./secret
      (gdb) break main
      Breakpoint 1 at 0x1149
      (gdb) run deny-me
      (gdb) break strcmp
      (gdb) continue
      # When stopped at strcmp, inspect the two arguments (x86-64: rdi and rsi):
      (gdb) x/s $rdi
      0x7fffffffe4f0: "deny-me"
      (gdb) x/s $rsi
      0x555555556008: "lab-passphrase-42"
    note:
      fr: "gdb montre, en cours d'exécution, les deux chaînes comparées. L'analyse dynamique révèle les valeurs réelles en mémoire, là où l'analyse statique ne montre que le code."
      en: "gdb shows, during execution, the two strings being compared. Dynamic analysis reveals the real in-memory values, where static analysis only shows the code."

mistake:
  fr: |
    **Croire qu'un binaire « protège » le code et les secrets qu'il contient.**

    Beaucoup de développeurs pensent que compiler suffit à cacher une clé d'API, un mot de passe ou un
    algorithme. C'est faux : `strings` révèle les chaînes en clair, et un décompilateur comme Ghidra
    reconstitue la logique en pseudo-C. Tout ce qui est livré au client peut être lu. Un secret doit rester
    côté **serveur** ; le binaire client ne doit jamais contenir de clé exploitable seule.
  en: |
    **Believing a binary "protects" the code and secrets it contains.**

    Many developers think that compiling is enough to hide an API key, a password or an algorithm. It is not:
    `strings` reveals clear strings, and a decompiler like Ghidra reconstructs the logic into pseudo-C. Anything
    shipped to the client can be read. A secret must stay on the **server**; the client binary must never hold
    a key that is usable on its own.

bestPractice:
  fr: |
    - **Commencer simple** : `strings` puis `objdump`, avant de sortir Ghidra ou gdb.
    - **Alterner statique et dynamique** : lire le code (Ghidra) et observer l'exécution (gdb) se complètent.
    - **Renommer au fur et à mesure** dans Ghidra : des noms clairs transforment un pseudo-code illisible en logique compréhensible.
    - **N'analyser que ce qui vous appartient** : votre binaire, un CrackMe, un logiciel dont la licence l'autorise.
    - **Tirer la leçon défensive** : ce que vous retrouvez facilement, un attaquant le retrouve aussi — ne mettez pas de secret dans un binaire client.
  en: |
    - **Start simple**: `strings` then `objdump`, before pulling out Ghidra or gdb.
    - **Alternate static and dynamic**: reading the code (Ghidra) and watching execution (gdb) complement each other.
    - **Rename as you go** in Ghidra: clear names turn unreadable pseudo-code into understandable logic.
    - **Only analyse what you own**: your binary, a CrackMe, software whose licence allows it.
    - **Draw the defensive lesson**: what you find easily, an attacker finds too — never put a secret in a client binary.

exercise:
  statement:
    fr: |
      Vous compilez vous-même un petit programme en C qui contient une URL interne
      `http://api.internal.example.com/v1` et une clé `demo-key-ABC123`. Donnez la commande qui révèle
      instantanément ces deux valeurs dans l'exécutable, puis expliquez la leçon défensive à en tirer.
    en: |
      You compile yourself a small C program that contains an internal URL
      `http://api.internal.example.com/v1` and a key `demo-key-ABC123`. Give the command that instantly
      reveals both values in the executable, then explain the defensive lesson to draw from it.
  solution:
    file: solution.sh
    lang: bash
    code: |
      # Your own binary, so this is fully legal.

      # One command extracts readable strings and filters for our values.
      strings ./myprog | grep -E "example.com|demo-key"

      # Expected output:
      #   http://api.internal.example.com/v1
      #   demo-key-ABC123

      # Defensive lesson: compiling does NOT hide data. Both the URL and the key are in
      # clear inside the binary. A client binary must not carry a usable secret; keep
      # keys server-side and have the client authenticate to obtain scoped, short-lived tokens.
    note:
      fr: "`strings` suffit à sortir l'URL et la clé : compiler ne cache rien. Les secrets exploitables restent côté serveur, jamais dans le binaire distribué."
      en: "`strings` alone extracts the URL and key: compiling hides nothing. Usable secrets stay server-side, never in the distributed binary."

quiz:
  - q:
      fr: "Que fait un décompilateur comme Ghidra ?"
      en: "What does a decompiler like Ghidra do?"
    options:
      fr:
        - "Il reconstitue un pseudo-code lisible à partir du binaire"
        - "Il compile du C en binaire"
        - "Il chiffre l'exécutable"
        - "Il supprime les chaînes de caractères"
      en:
        - "It reconstructs readable pseudo-code from the binary"
        - "It compiles C into a binary"
        - "It encrypts the executable"
        - "It removes the character strings"
    answer: 0
    why:
      fr: "Ghidra décompile : il remonte du binaire vers un pseudo-C approché, révélant la logique du programme sans le code source d'origine."
      en: "Ghidra decompiles: it goes from binary back to approximate pseudo-C, revealing the program's logic without the original source."
  - q:
      fr: "Quel outil extrait en quelques secondes les chaînes lisibles d'un binaire ?"
      en: "Which tool extracts a binary's readable strings in seconds?"
    options:
      fr:
        - "gcc"
        - "ld"
        - "strings"
        - "make"
      en:
        - "gcc"
        - "ld"
        - "strings"
        - "make"
    answer: 2
    why:
      fr: "`strings` liste les séquences imprimables : c'est le premier réflexe, et il révèle souvent des secrets codés en dur."
      en: "`strings` lists printable sequences: it is the first reflex, and it often reveals hard-coded secrets."
  - q:
      fr: "Quelle est la différence entre analyse statique et analyse dynamique ?"
      en: "What is the difference between static and dynamic analysis?"
    options:
      fr:
        - "La statique exécute le programme, la dynamique le lit seulement"
        - "La statique lit le code sans l'exécuter, la dynamique observe l'exécution"
        - "Les deux sont identiques"
        - "La dynamique ne fonctionne que sur Windows"
      en:
        - "Static runs the program, dynamic only reads it"
        - "Static reads the code without running it, dynamic watches execution"
        - "The two are identical"
        - "Dynamic only works on Windows"
    answer: 1
    why:
      fr: "Statique = lire (Ghidra, objdump, strings) sans exécuter ; dynamique = observer le programme en train de tourner (gdb)."
      en: "Static = reading (Ghidra, objdump, strings) without running; dynamic = watching the program as it runs (gdb)."
  - q:
      fr: "Quelle est la leçon défensive principale de la rétro-ingénierie ?"
      en: "What is the main defensive lesson of reverse engineering?"
    options:
      fr:
        - "Un binaire chiffre automatiquement ses secrets"
        - "Compiler rend le code introuvable"
        - "Les débogueurs sont illégaux"
        - "Un secret livré au client peut être extrait : il doit rester côté serveur"
      en:
        - "A binary automatically encrypts its secrets"
        - "Compiling makes code impossible to find"
        - "Debuggers are illegal"
        - "A secret shipped to the client can be extracted: it must stay server-side"
    answer: 3
    why:
      fr: "Tout ce qui est dans le binaire client est lisible (strings, Ghidra) : les secrets exploitables doivent rester côté serveur."
      en: "Anything in the client binary is readable (strings, Ghidra): usable secrets must stay server-side."
  - q:
      fr: "Dans quel cadre peut-on légalement rétro-concevoir un binaire pour apprendre ?"
      en: "In what scope may you legally reverse-engineer a binary to learn?"
    options:
      fr:
        - "Un binaire qu'on possède, un CrackMe, ou un logiciel dont la licence l'autorise"
        - "N'importe quel logiciel commercial téléchargé"
        - "Les jeux vidéo protégés des autres"
        - "Tout fichier trouvé sur Internet"
      en:
        - "A binary you own, a CrackMe, or software whose licence allows it"
        - "Any downloaded commercial software"
        - "Other people's protected video games"
        - "Any file found on the Internet"
    answer: 0
    why:
      fr: "On n'analyse que ce qu'on a le droit d'étudier : son propre binaire, un CrackMe de crackmes.one, ou un logiciel dont la licence permet l'analyse."
      en: "You only analyse what you are allowed to study: your own binary, a CrackMe from crackmes.one, or software whose licence permits analysis."
