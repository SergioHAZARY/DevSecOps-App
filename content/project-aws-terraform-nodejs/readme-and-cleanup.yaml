description:
  fr: "Finaliser le projet : un README professionnel avec architecture, démarrage rapide et tableau des contrôles de sécurité, un avertissement de coûts clair, et le nettoyage complet avec terraform destroy."
  en: "Finalise the project: a professional README with architecture, quick start and a security controls table, a clear cost warning, and a full cleanup with terraform destroy."
duration: 20

intro:
  fr: |
    L'infrastructure est décrite, le pipeline déploie sans clé. Reste à **documenter** le projet et,
    point crucial de ce projet cloud, à **tout nettoyer** pour ne pas payer une infrastructure qui tourne
    dans le vide.

    Le README expliquera l'architecture, le démarrage et les contrôles de sécurité. Mais il contiendra
    aussi une section que le projet Flask n'avait pas : un **avertissement sur les coûts** et la procédure
    de **destruction** (`terraform destroy`).

    Analogie : après avoir monté une tente de camping (l'infrastructure), on ne la laisse pas plantée pour
    toujours — surtout si l'emplacement est payant à la nuit. On apprend à la **démonter proprement**.
    Dans cette dernière leçon, on finalise la documentation et on garantit un coût qui retombe à zéro.
  en: |
    The infrastructure is described, the pipeline deploys without a key. What remains is to **document**
    the project and, a crucial point for this cloud project, to **clean everything up** so you do not pay
    for infrastructure running for nothing.

    The README will explain the architecture, the start-up and the security controls. But it will also
    contain a section the Flask project did not have: a **cost warning** and the **teardown** procedure
    (`terraform destroy`).

    Analogy: after pitching a camping tent (the infrastructure), you do not leave it standing forever —
    especially if the pitch is charged per night. We learn to **take it down cleanly**. In this final
    lesson we finalise the documentation and guarantee a cost that drops back to zero.

sections:
  - heading:
      fr: "Un README qui prévient des coûts"
      en: "A README that warns about costs"
    body:
      fr: |
        Pour un projet cloud, le README doit être **honnête sur l'argent**. Un lecteur qui déploie sans le
        savoir peut se retrouver avec une facture surprise. On place donc, **bien en évidence**, un
        avertissement et une estimation d'ordre de grandeur :

        | Ressource | Coût approximatif |
        |---|---|
        | Application Load Balancer | ~0,025 USD / heure |
        | NAT Gateway | ~0,045 USD / heure + trafic |
        | ECS Fargate (2 tâches) | ~0,02 USD / heure |
        | **Total** | **quelques USD par jour** |

        Ces montants varient selon la région et dans le temps : le README invite toujours à vérifier la
        **tarification officielle AWS**. Le message clé : *détruisez l'infrastructure dès que vous avez
        terminé*.
      en: |
        For a cloud project, the README must be **honest about money**. A reader who deploys unknowingly
        can end up with a surprise bill. So we place, **prominently**, a warning and an order-of-magnitude
        estimate:

        | Resource | Approximate cost |
        |---|---|
        | Application Load Balancer | ~0.025 USD / hour |
        | NAT Gateway | ~0.045 USD / hour + traffic |
        | ECS Fargate (2 tasks) | ~0.02 USD / hour |
        | **Total** | **a few USD per day** |

        These amounts vary by region and over time: the README always invites checking the **official AWS
        pricing**. The key message: *destroy the infrastructure as soon as you are done*.
  - heading:
      fr: "Détruire proprement avec terraform destroy"
      en: "Tearing down cleanly with terraform destroy"
    body:
      fr: |
        La grande force de l'Infrastructure as Code : ce qu'on a créé avec `terraform apply`, on le
        supprime avec **`terraform destroy`**. Une seule commande retire le VPC, l'ALB, la NAT Gateway,
        ECS, ECR et les rôles — dans le bon ordre, en respectant les dépendances.

        Quelques détails importants pour que la destruction réussisse du premier coup :

        - le registre ECR a `force_delete = true`, sinon Terraform refuse de supprimer un dépôt contenant
          des images ;
        - le **bucket S3 du state** n'est **pas** géré par ce Terraform (il a été créé à part) : il
          survit, ce qui est normal. On le supprime manuellement si l'on veut repartir de zéro ;
        - après destruction, on **vérifie** dans la console AWS qu'il ne reste rien (surtout la NAT
          Gateway et l'EIP, qui coûtent).
      en: |
        The great strength of Infrastructure as Code: what you created with `terraform apply`, you remove
        with **`terraform destroy`**. A single command tears down the VPC, the ALB, the NAT Gateway, ECS,
        ECR and the roles — in the right order, respecting dependencies.

        A few important details so the teardown succeeds first time:

        - the ECR registry has `force_delete = true`, otherwise Terraform refuses to delete a repository
          containing images;
        - the **S3 state bucket** is **not** managed by this Terraform (it was created separately): it
          survives, which is normal. Delete it manually if you want to start from scratch;
        - after teardown, **check** in the AWS console that nothing is left (especially the NAT Gateway
          and the EIP, which cost money).
  - heading:
      fr: "Présenter ce projet dans un portfolio"
      en: "Presenting this project in a portfolio"
    body:
      fr: |
        Ce projet est un excellent argument pour un poste cloud / DevSecOps, car il coche des cases
        recherchées : **Terraform**, **AWS**, **conteneurs**, et surtout **déploiement sans secret via
        OIDC** — un sujet encore mal maîtrisé par beaucoup de candidats.

        En entretien, préparez-vous à expliquer :

        - **pourquoi OIDC** plutôt qu'une clé statique (jetons courts, rien à voler) ;
        - comment vous **restreignez** la confiance (`sub` = dépôt + branche) ;
        - le **découpage réseau** public/privé et le rôle de chaque groupe de sécurité ;
        - la **conscience des coûts** : montrer que vous pensez « destruction » autant que « création » est
          un signal de maturité que les recruteurs remarquent.
      en: |
        This project is an excellent argument for a cloud / DevSecOps role, because it ticks sought-after
        boxes: **Terraform**, **AWS**, **containers**, and above all **secret-less deployment via OIDC** —
        a topic still poorly mastered by many candidates.

        In an interview, be ready to explain:

        - **why OIDC** rather than a static key (short tokens, nothing to steal);
        - how you **restrict** the trust (`sub` = repo + branch);
        - the public/private **network split** and the role of each security group;
        - **cost awareness**: showing that you think about "teardown" as much as "build" is a sign of
          maturity that recruiters notice.

examples:
  - title:
      fr: "Le README.md complet du projet"
      en: "The project's complete README.md"
    file: README.md
    lang: markdown
    kind: secure
    code: |
      # node-aws-ecs

      ![deploy](https://github.com/OWNER/node-aws-ecs/actions/workflows/deploy.yml/badge.svg)

      A Node.js (Express) app deployed to **AWS ECS Fargate** with **Terraform**
      and a **GitHub Actions** pipeline that uses **OIDC** — no static AWS keys.

      ## Architecture

      ```text
      Internet ─► ALB (public subnets) ─► ECS Fargate tasks (private subnets)
                                                │
                                   image from ECR (scan on push)
                                                │
                                        logs ─► CloudWatch

      GitHub Actions ──OIDC token──► IAM role (repo+branch restricted) ──► deploy
      ```

      ## Prerequisites

      - AWS account, Terraform 1.10+, AWS CLI, Docker
      - An S3 bucket for remote state (see "State backend" below)

      > ## Cost warning
      > This project creates **billable** resources (ALB, NAT Gateway, Fargate).
      > Expect **a few USD per day even with no traffic**. Always run
      > `terraform destroy` when you are done, and check the AWS console.

      ## Quick start

      ```bash
      # 1. Bootstrap the state bucket (once), then deploy
      cd terraform
      terraform init
      terraform apply            # creates the whole infrastructure
      terraform output alb_dns_name   # public URL of the app

      # 2. The CI pipeline builds, scans and deploys the image on push to main
      ```

      ## Security controls

      | Area | Control |
      |------|---------|
      | Auth to AWS | GitHub OIDC, no static keys, trust restricted to repo+branch |
      | Network | Public ALB, containers in private subnets, restricted SGs |
      | Registry | ECR scan-on-push, immutable tags, encryption at rest |
      | Runtime | Non-root container, read-only root filesystem |
      | IAM | Separate execution/task roles, least-privilege deploy role |
      | Pipeline | Checkov + Trivy (IaC), image scan before push |
      | State | Encrypted S3 backend with native locking |

      ## State backend

      Create the bucket once (see `bootstrap-backend.sh`): versioning + AES256.

      ## Cleanup

      ```bash
      cd terraform
      terraform destroy          # removes EVERYTHING this project created
      ```

      ## License

      MIT
    note:
      fr: "L'avertissement de coûts est en blockquote, impossible à manquer. Le tableau des contrôles de sécurité et la section `Cleanup` sont les deux parties les plus importantes pour ce projet cloud."
      en: "The cost warning is in a blockquote, impossible to miss. The security controls table and the `Cleanup` section are the two most important parts for this cloud project."

  - title:
      fr: "terraform destroy : tout supprimer et vérifier"
      en: "terraform destroy: remove everything and verify"
    file: cleanup.sh
    lang: bash
    kind: secure
    code: |
      cd terraform

      # Preview what will be destroyed (safety first).
      terraform plan -destroy

      # Destroy everything this project created.
      terraform destroy -auto-approve

      # Verify the costly resources are really gone.
      aws ec2 describe-nat-gateways \
        --filter "Name=state,Values=available" --query "NatGateways[].NatGatewayId"
      aws elbv2 describe-load-balancers --query "LoadBalancers[].LoadBalancerName"
    output: |
      Destroy complete! Resources: 28 destroyed.

      []
      []
    note:
      fr: "`terraform plan -destroy` montre d'abord ce qui sera supprimé. Après coup, les deux commandes AWS CLI confirment qu'aucune NAT Gateway ni ALB (les ressources les plus chères) ne subsiste."
      en: "`terraform plan -destroy` first shows what will be removed. Afterwards, the two AWS CLI commands confirm that no NAT Gateway or ALB (the most expensive resources) remains."

  - title:
      fr: "Résumé du projet pour le CV (orienté impact)"
      en: "Project summary for the résumé (impact-oriented)"
    file: cv-entry.txt
    lang: text
    kind: neutral
    code: |
      node-aws-ecs — Secret-less AWS deployment with Terraform + OIDC
      - Provisioned a segmented VPC (public/private subnets), ALB, ECS Fargate
        and ECR (scan-on-push, immutable tags) entirely in Terraform.
      - Implemented keyless CI/CD: GitHub OIDC role with trust restricted to
        repo+branch, least-privilege deploy policy, no static AWS keys.
      - Added IaC security gates (Checkov, Trivy config) and image scanning
        before push; least-privilege ECS execution/task roles.
      - Documented costs and automated full teardown with terraform destroy.
      Tech: AWS (ECS, ECR, ALB, VPC, IAM), Terraform, GitHub Actions, OIDC, Trivy.
    note:
      fr: "La mention « secret-less » et « OIDC » attire l'œil : c'est une compétence différenciante. La ligne sur les coûts et la destruction montre une maturité opérationnelle rare chez les juniors."
      en: "The 'secret-less' and 'OIDC' mentions catch the eye: it is a differentiating skill. The line about costs and teardown shows operational maturity that is rare among juniors."

mistake:
  fr: |
    **Laisser l'infrastructure tourner « pour la montrer » après l'exercice.**

    Une NAT Gateway et un ALB oubliés, c'est quelques euros qui partent chaque jour, indéfiniment, pour
    rien. Pire : certains laissent le déploiement actif des semaines en pensant « je verrai plus tard ».
    La règle : on déploie pour apprendre ou démontrer, puis on **détruit immédiatement**. Pour une démo en
    entretien, un enregistrement d'écran ou des captures suffisent largement.
  en: |
    **Leaving the infrastructure running "to show it off" after the exercise.**

    A forgotten NAT Gateway and ALB are a few euros draining away every day, indefinitely, for nothing.
    Worse: some leave the deployment active for weeks thinking "I'll deal with it later". The rule: you
    deploy to learn or demonstrate, then **destroy immediately**. For an interview demo, a screen
    recording or screenshots are more than enough.

bestPractice:
  fr: |
    - **Avertissement de coûts visible** (blockquote) et estimation d'ordre de grandeur.
    - **`terraform destroy` documenté** et **vérification console** après coup.
    - **Tableau des contrôles de sécurité** : OIDC, réseau, ECR, IAM, pipeline, state.
    - **`force_delete` sur ECR** pour que la destruction passe du premier coup.
    - **Captures/enregistrement** pour la démo, plutôt qu'une infra laissée en ligne.
    - **Mettre OIDC en avant** dans le CV et l'entretien : compétence différenciante.
  en: |
    - **Visible cost warning** (blockquote) and an order-of-magnitude estimate.
    - **Documented `terraform destroy`** and a **console check** afterwards.
    - **Security controls table**: OIDC, network, ECR, IAM, pipeline, state.
    - **`force_delete` on ECR** so the teardown succeeds first time.
    - **Screenshots/recording** for the demo, rather than leaving the infra online.
    - **Highlight OIDC** in the résumé and interview: a differentiating skill.

exercise:
  statement:
    fr: |
      Pour éviter d'oublier de détruire l'infrastructure, ajoutez un **garde-fou de coût**. Écrivez la
      ressource Terraform `aws_budgets_budget` qui :

      1. fixe un budget mensuel de **10 USD** sur le compte ;
      2. envoie une **alerte par e-mail** dès que **80 %** du budget (dépense réelle) est atteint.

      Indiquez l'adresse e-mail via une variable, sans la coder en dur.
    en: |
      To avoid forgetting to destroy the infrastructure, add a **cost guardrail**. Write the Terraform
      resource `aws_budgets_budget` that:

      1. sets a monthly budget of **10 USD** on the account;
      2. sends an **email alert** as soon as **80%** of the budget (actual spend) is reached.

      Provide the email address through a variable, without hard-coding it.
  solution:
    file: budget.tf
    lang: hcl
    code: |
      variable "alert_email" {
        description = "Address that receives the cost alert"
        type        = string
      }

      resource "aws_budgets_budget" "monthly" {
        name         = "${var.project}-monthly"
        budget_type  = "COST"
        limit_amount = "10"
        limit_unit   = "USD"
        time_unit    = "MONTHLY"

        # Email as soon as ACTUAL spend reaches 80% of the 10 USD budget.
        notification {
          comparison_operator        = "GREATER_THAN"
          threshold                  = 80
          threshold_type             = "PERCENTAGE"
          notification_type          = "ACTUAL"
          subscriber_email_addresses = [var.alert_email]
        }
      }
    note:
      fr: "Un budget AWS est un filet de sécurité : si vous oubliez de détruire, vous recevez un e-mail avant que la facture ne dérape. L'adresse passe par une variable, jamais en dur."
      en: "An AWS budget is a safety net: if you forget to destroy, you get an email before the bill gets out of hand. The address comes from a variable, never hard-coded."

quiz:
  - q:
      fr: "Quelle commande supprime toute l'infrastructure créée par le projet ?"
      en: "Which command removes all the infrastructure created by the project?"
    options:
      fr:
        - "terraform destroy"
        - "terraform delete"
        - "terraform remove --all"
        - "aws ecs stop"
      en:
        - "terraform destroy"
        - "terraform delete"
        - "terraform remove --all"
        - "aws ecs stop"
    answer: 0
    why:
      fr: "`terraform destroy` supprime les ressources du state dans le bon ordre. `terraform delete` et `remove --all` n'existent pas."
      en: "`terraform destroy` removes the state's resources in the right order. `terraform delete` and `remove --all` do not exist."
  - q:
      fr: "Pourquoi le projet insiste-t-il autant sur la destruction de l'infrastructure ?"
      en: "Why does the project insist so much on tearing down the infrastructure?"
    options:
      fr:
        - "Parce que Terraform l'exige après chaque apply"
        - "Parce que des ressources comme l'ALB et la NAT Gateway sont facturées même sans trafic"
        - "Pour libérer de la mémoire sur le poste local"
        - "Parce que GitHub supprime les dépôts inactifs"
      en:
        - "Because Terraform requires it after each apply"
        - "Because resources like the ALB and NAT Gateway are billed even with no traffic"
        - "To free memory on the local machine"
        - "Because GitHub deletes inactive repositories"
    answer: 1
    why:
      fr: "Ces ressources coûtent à l'heure, indépendamment du trafic : les oublier, c'est payer pour rien."
      en: "These resources cost per hour, regardless of traffic: forgetting them means paying for nothing."
  - q:
      fr: "Pourquoi le registre ECR a-t-il `force_delete = true` ?"
      en: "Why does the ECR registry have `force_delete = true`?"
    options:
      fr:
        - "Pour chiffrer les images"
        - "Pour scanner les images au push"
        - "Pour rendre les tags immuables"
        - "Pour que `terraform destroy` supprime le dépôt même s'il contient des images"
      en:
        - "To encrypt the images"
        - "To scan images on push"
        - "To make tags immutable"
        - "So `terraform destroy` can delete the repository even if it holds images"
    answer: 3
    why:
      fr: "Sans `force_delete`, Terraform refuse de supprimer un dépôt ECR non vide, et la destruction échoue."
      en: "Without `force_delete`, Terraform refuses to delete a non-empty ECR repository, and the teardown fails."
  - q:
      fr: "Quel élément de ce projet est le plus différenciant sur un CV ?"
      en: "Which element of this project is the most differentiating on a résumé?"
    options:
      fr:
        - "Le déploiement sans clé statique via OIDC"
        - "L'utilisation de Markdown dans le README"
        - "Le port 3000 de l'application"
        - "Le choix de la région us-east-1"
      en:
        - "Secret-less deployment via OIDC"
        - "Using Markdown in the README"
        - "The application's port 3000"
        - "Choosing the us-east-1 region"
    answer: 0
    why:
      fr: "Le déploiement OIDC sans secret est une compétence recherchée et encore peu maîtrisée : c'est un vrai atout."
      en: "Secret-less OIDC deployment is a sought-after skill still poorly mastered: a genuine asset."
  - q:
      fr: "Le bucket S3 qui stocke le state est-il supprimé par `terraform destroy` ?"
      en: "Is the S3 bucket storing the state removed by `terraform destroy`?"
    options:
      fr:
        - "Oui, toujours"
        - "Non : il a été créé à part et n'est pas géré par ce Terraform, donc il survit"
        - "Oui, mais seulement si le bucket est vide"
        - "Non, car S3 n'est pas destructible"
      en:
        - "Yes, always"
        - "No: it was created separately and is not managed by this Terraform, so it survives"
        - "Yes, but only if the bucket is empty"
        - "No, because S3 is not destructible"
    answer: 1
    why:
      fr: "Le bucket de state est amorcé hors Terraform ; il n'est pas dans le state, donc `destroy` ne le touche pas. On le supprime manuellement si besoin."
      en: "The state bucket is bootstrapped outside Terraform; it is not in the state, so `destroy` does not touch it. Delete it manually if needed."
