description:
  fr: "Découvrir IPv6 : 128 bits, notation hexadécimale, compression des zéros, préfixes et mise en pratique de tout le cours."
  en: "Discover IPv6: 128 bits, hexadecimal notation, zero compression, prefixes and a hands-on recap of the whole course."
duration: 22

intro:
  fr: |
    IPv4 n'offre que ~4,3 milliards d'adresses - trop peu pour la planète connectée d'aujourd'hui. **IPv6**
    règle le problème avec des adresses de **128 bits**, soit 2^128 adresses (un nombre à 39 chiffres). Autant
    dire qu'on n'en manquera jamais.

    Une adresse IPv6 s'écrit en **hexadécimal** - vous avez appris à le lire plus tôt dans ce cours. Elle
    comporte **8 groupes de 16 bits** séparés par des deux-points, par exemple
    `2001:0db8:0000:0000:0000:0000:0000:0001`. Comme c'est long, il existe des règles de **compression** pour
    la raccourcir en `2001:db8::1`.

    Pensez à un très long numéro de série : on supprime les zéros inutiles pour le rendre lisible. Dans cette
    dernière leçon, vous apprendrez à lire, compresser et classer une adresse IPv6, puis vous réviserez tout le
    cours (binaire, hex, IPv4, CIDR, subnetting) avec des exercices concrets. Le **calculateur CIDR** de la page
    fonctionne aussi pour l'IPv6.
  en: |
    IPv4 offers only ~4.3 billion addresses - too few for today's connected planet. **IPv6** fixes this with
    **128-bit** addresses, i.e. 2^128 addresses (a 39-digit number). We will effectively never run out.

    An IPv6 address is written in **hexadecimal** - you learned to read it earlier in this course. It has
    **8 groups of 16 bits** separated by colons, for example `2001:0db8:0000:0000:0000:0000:0000:0001`. Because
    that is long, there are **compression** rules to shorten it to `2001:db8::1`.

    Think of a very long serial number: you drop the useless zeros to make it readable. In this final lesson
    you will learn to read, compress and classify an IPv6 address, then revise the whole course (binary, hex,
    IPv4, CIDR, subnetting) with concrete exercises. The page's **CIDR calculator** works for IPv6 too.

sections:
  - heading:
      fr: "Lire et compresser une adresse IPv6"
      en: "Reading and compressing an IPv6 address"
    body:
      fr: |
        Une adresse IPv6 complète (« exploded ») fait 8 groupes de 4 chiffres hex :
        `2001:0db8:0000:0000:0000:0000:0000:0001`. Deux règles la raccourcissent :

        1. **Supprimer les zéros de tête** de chaque groupe : `0db8` → `db8`, `0001` → `1`.
        2. **Remplacer une seule** suite de groupes entièrement nuls par `::`.

        | Étape | Résultat |
        |---|---|
        | Complète | 2001:0db8:0000:0000:0000:0000:0000:0001 |
        | Sans zéros de tête | 2001:db8:0:0:0:0:0:1 |
        | Avec `::` | 2001:db8::1 |

        Attention : `::` ne peut apparaître **qu'une fois** dans l'adresse, sinon on ne saurait pas combien de
        groupes il remplace. Le préfixe s'écrit toujours en CIDR, par exemple `2001:db8::/32` ou `/64` pour un
        réseau local standard.
      en: |
        A full ("exploded") IPv6 address is 8 groups of 4 hex digits:
        `2001:0db8:0000:0000:0000:0000:0000:0001`. Two rules shorten it:

        1. **Drop the leading zeros** of each group: `0db8` → `db8`, `0001` → `1`.
        2. **Replace one single** run of all-zero groups with `::`.

        | Step | Result |
        |---|---|
        | Full | 2001:0db8:0000:0000:0000:0000:0000:0001 |
        | No leading zeros | 2001:db8:0:0:0:0:0:1 |
        | With `::` | 2001:db8::1 |

        Careful: `::` may appear **only once** in an address, otherwise you could not tell how many groups it
        replaces. The prefix is always written in CIDR, for example `2001:db8::/32`, or `/64` for a standard
        local network.
  - heading:
      fr: "Les adresses IPv6 à connaître"
      en: "The IPv6 addresses to know"
    body:
      fr: |
        Comme en IPv4, certaines plages ont un rôle particulier :

        | Adresse / préfixe | Rôle | Équivalent IPv4 |
        |---|---|---|
        | ::1/128 | Loopback (localhost) | 127.0.0.1 |
        | ::/128 | Adresse non spécifiée | 0.0.0.0 |
        | fe80::/10 | Link-local (segment local) | 169.254.0.0/16 |
        | fc00::/7 | Unique local (privée) | 10.0.0.0/8, 192.168.0.0/16 |
        | 2000::/3 | Unicast global (Internet public) | adresses publiques |
        | ff00::/8 | Multicast | (remplace le broadcast) |
        | 2001:db8::/32 | Documentation / exemples | 192.0.2.0/24 |

        Détail important : **IPv6 n'a pas de broadcast**. La diffusion passe par le multicast. Un réseau IPv6
        « standard » utilise un préfixe `/64`, ce qui laisse 64 bits pour les machines - largement de quoi.
      en: |
        As in IPv4, some ranges have a special role:

        | Address / prefix | Role | IPv4 equivalent |
        |---|---|---|
        | ::1/128 | Loopback (localhost) | 127.0.0.1 |
        | ::/128 | Unspecified address | 0.0.0.0 |
        | fe80::/10 | Link-local (local segment) | 169.254.0.0/16 |
        | fc00::/7 | Unique local (private) | 10.0.0.0/8, 192.168.0.0/16 |
        | 2000::/3 | Global unicast (public Internet) | public addresses |
        | ff00::/8 | Multicast | (replaces broadcast) |
        | 2001:db8::/32 | Documentation / examples | 192.0.2.0/24 |

        Important detail: **IPv6 has no broadcast**. Addressing many hosts at once goes through multicast. A
        "standard" IPv6 network uses a `/64` prefix, leaving 64 bits for hosts - more than enough.

examples:
  - title:
      fr: "Compresser et étendre une adresse IPv6"
      en: "Compress and expand an IPv6 address"
    file: ipv6_compress.py
    lang: python
    kind: neutral
    code: |
      import ipaddress

      full = "2001:0db8:0000:0000:0000:0000:0000:0001"
      ip = ipaddress.ip_address(full)

      print("Compressed:", ip.compressed)  # 2001:db8::1
      print("Exploded  :", ip.exploded)    # back to the full form
      print("Version   :", ip.version)     # 6

      # :: can appear only once; ipaddress refuses an invalid double ::
      print("Loopback  :", ipaddress.ip_address("::1").is_loopback)  # True
    output: |
      Compressed: 2001:db8::1
      Exploded  : 2001:0db8:0000:0000:0000:0000:0000:0001
      Version   : 6
      Loopback  : True
    note:
      fr: "`.compressed` applique les deux règles automatiquement ; `.exploded` fait l'inverse. `::1` est le loopback IPv6."
      en: "`.compressed` applies both rules automatically; `.exploded` does the reverse. `::1` is the IPv6 loopback."

  - title:
      fr: "Classer une adresse IPv6"
      en: "Classify an IPv6 address"
    file: ipv6_classify.py
    lang: python
    kind: neutral
    code: |
      import ipaddress

      for text in ["::1", "fe80::1", "2001:db8::1", "fc00::1234"]:
          ip = ipaddress.ip_address(text)
          kind = (
              "loopback" if ip.is_loopback
              else "link-local" if ip.is_link_local
              else "private (ULA)" if ip.is_private
              else "global"
          )
          print(f"{text:<14} -> {kind}")
    output: |
      ::1            -> loopback
      fe80::1        -> link-local
      2001:db8::1    -> private (ULA)
      fc00::1234     -> private (ULA)
    note:
      fr: "`2001:db8::/32` est une plage de documentation, considérée comme non globale. `fe80::` est toujours link-local."
      en: "`2001:db8::/32` is a documentation range, treated as non-global. `fe80::` is always link-local."

  - title:
      fr: "Révision générale : un rapport binaire / hex / CIDR pour IPv4"
      en: "Full recap: a binary / hex / CIDR report for IPv4"
    file: recap_report.py
    lang: python
    kind: neutral
    code: |
      import ipaddress

      ip = ipaddress.ip_interface("192.168.1.10/26")  # address + prefix together

      octets = str(ip.ip).split(".")
      print("Binary   :", ".".join(format(int(o), "08b") for o in octets))
      print("Hex      :", ".".join(format(int(o), "02X") for o in octets))
      print("Network  :", ip.network.network_address)     # 192.168.1.0
      print("Broadcast:", ip.network.broadcast_address)   # 192.168.1.63
      print("Mask     :", ip.netmask)                      # 255.255.255.192
      print("Usable   :", ip.network.num_addresses - 2)    # 62
    output: |
      Binary   : 11000000.10101000.00000001.00001010
      Hex      : C0.A8.01.0A
      Network  : 192.168.1.0
      Broadcast: 192.168.1.63
      Mask     : 255.255.255.192
      Usable   : 62
    note:
      fr: "Ce script réunit tout le cours : binaire (leçon 1), hex (leçon 2), IP (leçon 3), masque et réseau (leçons 4-5)."
      en: "This script brings the whole course together: binary (lesson 1), hex (lesson 2), IP (lesson 3), mask and network (lessons 4-5)."

mistake:
  fr: |
    **Utiliser `::` deux fois ou croire qu'IPv6 a un broadcast.**

    La compression `::` ne peut apparaître **qu'une seule fois** : `2001::db8::1` est invalide car on ne peut
    pas deviner combien de groupes nuls chaque `::` remplace. Autre confusion fréquente : chercher une « adresse
    de broadcast » en IPv6. Il n'y en a pas : IPv6 utilise le **multicast** (`ff00::/8`) à la place. Enfin,
    `fe80::` (link-local) n'est joignable que sur le segment local, jamais routé.
  en: |
    **Using `::` twice, or believing IPv6 has a broadcast.**

    The `::` compression may appear **only once**: `2001::db8::1` is invalid because you cannot guess how many
    zero groups each `::` replaces. Another common mix-up: looking for a "broadcast address" in IPv6. There is
    none: IPv6 uses **multicast** (`ff00::/8`) instead. Finally, `fe80::` (link-local) is reachable only on the
    local segment and is never routed.

bestPractice:
  fr: |
    - **Compressez les adresses** pour les humains, mais stockez-les sous forme canonique avec `ipaddress`.
    - **Utilisez `2001:db8::/32`** pour tous vos exemples IPv6 (plage de documentation RFC 3849).
    - **Prévoyez des `/64`** pour les réseaux locaux : c'est la taille standard attendue par l'autoconfiguration.
    - **Sécurisez IPv6 comme IPv4** : pare-feu, segmentation et filtrage doivent couvrir les deux protocoles.
    - **Testez vos calculs** avec le calculateur CIDR de la page, qui accepte aussi les préfixes IPv6.
  en: |
    - **Compress addresses** for humans, but store them in canonical form with `ipaddress`.
    - **Use `2001:db8::/32`** for all your IPv6 examples (RFC 3849 documentation range).
    - **Plan `/64` prefixes** for local networks: that is the standard size expected by autoconfiguration.
    - **Secure IPv6 like IPv4**: firewalls, segmentation and filtering must cover both protocols.
    - **Test your calculations** with the page's CIDR calculator, which also accepts IPv6 prefixes.

exercise:
  statement:
    fr: |
      Deux tâches de révision :

      1. Compressez l'adresse IPv6 `2001:0db8:0000:0000:0000:ff00:0042:8329` à la main, puis vérifiez.
      2. Pour `10.10.0.0/22`, donnez le nombre d'adresses, le nombre de machines utilisables et l'adresse de
         broadcast. (Indice : 32 − 22 = 10 bits machine.)
    en: |
      Two recap tasks:

      1. Compress the IPv6 address `2001:0db8:0000:0000:0000:ff00:0042:8329` by hand, then verify.
      2. For `10.10.0.0/22`, give the number of addresses, the number of usable hosts and the broadcast
         address. (Hint: 32 − 22 = 10 host bits.)
  solution:
    file: solution.py
    lang: python
    code: |
      import ipaddress

      # 1) Drop leading zeros, replace the single run of zero groups with ::
      ip = ipaddress.ip_address("2001:0db8:0000:0000:0000:ff00:0042:8329")
      print("Compressed:", ip.compressed)  # 2001:db8::ff00:42:8329

      # 2) /22 -> 2**(32-22) = 1024 addresses, 1022 usable
      net = ipaddress.ip_network("10.10.0.0/22")
      print("Addresses :", net.num_addresses)       # 1024
      print("Usable    :", net.num_addresses - 2)   # 1022
      print("Broadcast :", net.broadcast_address)   # 10.10.3.255
    note:
      fr: "2001:db8::ff00:42:8329 : seuls les trois groupes nuls du milieu deviennent `::`. /22 = 1024 adresses, 1022 utilisables, broadcast 10.10.3.255."
      en: "2001:db8::ff00:42:8329: only the three middle zero groups become `::`. /22 = 1024 addresses, 1022 usable, broadcast 10.10.3.255."

quiz:
  - q:
      fr: "Combien de bits contient une adresse IPv6 ?"
      en: "How many bits are in an IPv6 address?"
    options:
      fr: ["32", "64", "128", "256"]
      en: ["32", "64", "128", "256"]
    answer: 2
    why:
      fr: "IPv6 utilise 128 bits (8 groupes de 16 bits), contre 32 bits pour IPv4."
      en: "IPv6 uses 128 bits (8 groups of 16 bits), versus 32 bits for IPv4."
  - q:
      fr: "Combien de fois le symbole :: peut-il apparaître dans une adresse IPv6 ?"
      en: "How many times may the :: symbol appear in an IPv6 address?"
    options:
      fr: ["Autant qu'on veut", "Exactement une fois au maximum", "Exactement deux fois", "Jamais"]
      en: ["As many as you like", "At most exactly once", "Exactly twice", "Never"]
    answer: 1
    why:
      fr: "Une seule occurrence : sinon on ne pourrait pas déduire combien de groupes nuls chaque :: remplace."
      en: "Only one occurrence: otherwise you could not infer how many zero groups each :: replaces."
  - q:
      fr: "Quelle est la forme compressée de 2001:0db8:0000:0000:0000:0000:0000:0001 ?"
      en: "What is the compressed form of 2001:0db8:0000:0000:0000:0000:0000:0001?"
    options:
      fr: ["2001:db8:1", "2001:db8::1", "2001::db8::1", "21:db8::1"]
      en: ["2001:db8:1", "2001:db8::1", "2001::db8::1", "21:db8::1"]
    answer: 1
    why:
      fr: "On retire les zéros de tête et on remplace la suite de groupes nuls par :: → 2001:db8::1."
      en: "Drop the leading zeros and replace the run of zero groups with :: → 2001:db8::1."
  - q:
      fr: "Quel mécanisme remplace le broadcast en IPv6 ?"
      en: "Which mechanism replaces broadcast in IPv6?"
    options:
      fr: ["Le loopback", "Le multicast (ff00::/8)", "Le link-local", "Le NAT"]
      en: ["Loopback", "Multicast (ff00::/8)", "Link-local", "NAT"]
    answer: 1
    why:
      fr: "IPv6 n'a pas de broadcast ; la diffusion vers plusieurs machines passe par le multicast ff00::/8."
      en: "IPv6 has no broadcast; addressing several hosts at once uses multicast ff00::/8."
  - q:
      fr: "Quelle adresse IPv6 est le loopback (équivalent de 127.0.0.1) ?"
      en: "Which IPv6 address is the loopback (equivalent of 127.0.0.1)?"
    options:
      fr: ["::1", "::", "fe80::1", "ff02::1"]
      en: ["::1", "::", "fe80::1", "ff02::1"]
    answer: 0
    why:
      fr: "::1/128 est le loopback IPv6. :: est l'adresse non spécifiée, fe80:: est link-local, ff02:: est multicast."
      en: "::1/128 is the IPv6 loopback. :: is the unspecified address, fe80:: is link-local, ff02:: is multicast."

