description:
  fr: "Comprendre les masques de sous-réseau et la notation CIDR : séparer réseau et machine, compter les adresses, trouver réseau et broadcast."
  en: "Understand subnet masks and CIDR notation: split network from host, count addresses, find the network and broadcast."
duration: 22

intro:
  fr: |
    Une adresse IP seule ne dit pas où s'arrête le **réseau** et où commence la **machine**. Pour cela il
    faut un **masque de sous-réseau**. Le masque est une suite de bits à `1` (la partie réseau) suivie de
    bits à `0` (la partie machine).

    Plutôt que d'écrire le masque complet `255.255.255.0`, on utilise la notation **CIDR** (*Classless
    Inter-Domain Routing*) : on compte simplement le nombre de bits à `1` et on l'écrit après une barre
    oblique. `255.255.255.0` devient `/24`. L'adresse complète s'écrit alors `192.168.1.10/24`.

    Imaginez un code postal : les premiers chiffres désignent la région, les derniers la rue. Le masque
    joue ce rôle de « combien de chiffres servent à la région ». Dans cette leçon vous apprendrez à lire un
    `/n`, à compter les adresses d'un réseau et à trouver son adresse réseau et son broadcast. Le
    **calculateur CIDR** en bas de page affiche tous ces résultats instantanément.
  en: |
    An IP address on its own does not say where the **network** ends and the **host** begins. For that you
    need a **subnet mask**. The mask is a run of `1` bits (the network part) followed by `0` bits (the host
    part).

    Rather than writing the full mask `255.255.255.0`, we use **CIDR** notation (*Classless Inter-Domain
    Routing*): simply count the number of `1` bits and write it after a slash. `255.255.255.0` becomes `/24`.
    The full address is then written `192.168.1.10/24`.

    Think of a postcode: the first digits name the region, the last ones name the street. The mask plays the
    role of "how many digits name the region". In this lesson you will learn to read a `/n`, count a
    network's addresses and find its network and broadcast addresses. The **CIDR calculator** at the bottom
    of the page shows all of these instantly.

sections:
  - heading:
      fr: "Du masque à la notation CIDR"
      en: "From mask to CIDR notation"
    body:
      fr: |
        Le masque `/24` signifie « les 24 premiers bits sont le réseau ». En binaire :

        | | Octet 1 | Octet 2 | Octet 3 | Octet 4 |
        |---|---|---|---|---|
        | **/24 binaire** | 11111111 | 11111111 | 11111111 | 00000000 |
        | **/24 décimal** | 255 | 255 | 255 | 0 |

        Il reste 32 − 24 = **8 bits machine**, soit 2^8 = **256 adresses**. Voici les masques les plus courants :

        | CIDR | Masque | Bits machine | Adresses | Machines utilisables |
        |---|---|---|---|---|
        | /8 | 255.0.0.0 | 24 | 16 777 216 | 16 777 214 |
        | /16 | 255.255.0.0 | 16 | 65 536 | 65 534 |
        | /24 | 255.255.255.0 | 8 | 256 | 254 |
        | /26 | 255.255.255.192 | 6 | 64 | 62 |
        | /30 | 255.255.255.252 | 2 | 4 | 2 |

        **Pourquoi « −2 » ?** Dans chaque réseau, la première adresse est l'**adresse réseau** et la dernière
        est l'adresse de **broadcast** (diffusion). Elles ne sont pas attribuables à une machine, d'où le
        nombre d'adresses utilisables = total − 2.
      en: |
        The mask `/24` means "the first 24 bits are the network". In binary:

        | | Octet 1 | Octet 2 | Octet 3 | Octet 4 |
        |---|---|---|---|---|
        | **/24 binary** | 11111111 | 11111111 | 11111111 | 00000000 |
        | **/24 decimal** | 255 | 255 | 255 | 0 |

        That leaves 32 − 24 = **8 host bits**, i.e. 2^8 = **256 addresses**. Here are the most common masks:

        | CIDR | Mask | Host bits | Addresses | Usable hosts |
        |---|---|---|---|---|
        | /8 | 255.0.0.0 | 24 | 16,777,216 | 16,777,214 |
        | /16 | 255.255.0.0 | 16 | 65,536 | 65,534 |
        | /24 | 255.255.255.0 | 8 | 256 | 254 |
        | /26 | 255.255.255.192 | 6 | 64 | 62 |
        | /30 | 255.255.255.252 | 2 | 4 | 2 |

        **Why "−2"?** In every network, the first address is the **network address** and the last is the
        **broadcast** address. Neither can be assigned to a host, so usable addresses = total − 2.
  - heading:
      fr: "Trouver l'adresse réseau et le broadcast"
      en: "Finding the network and broadcast addresses"
    body:
      fr: |
        Prenons `192.168.1.10/24`. Les 24 bits de réseau couvrent `192.168.1`. Les 8 bits machine varient
        de `00000000` (0) à `11111111` (255) :

        - **Adresse réseau** = tous les bits machine à 0 → `192.168.1.0`
        - **Broadcast** = tous les bits machine à 1 → `192.168.1.255`
        - **Machines utilisables** = `192.168.1.1` à `192.168.1.254`

        Avec un masque qui ne tombe pas sur une frontière d'octet, le calcul passe par le binaire. Prenons
        `/26` (masque `...11000000` sur le dernier octet). Le « pas » du réseau est 2^(32−26) = 64. Les
        réseaux /26 commencent donc à `.0`, `.64`, `.128`, `.192`. L'adresse `192.168.1.100/26` appartient au
        réseau `192.168.1.64/26` : réseau `.64`, broadcast `.127`, machines `.65` à `.126`.
      en: |
        Take `192.168.1.10/24`. The 24 network bits cover `192.168.1`. The 8 host bits range from `00000000`
        (0) to `11111111` (255):

        - **Network address** = all host bits 0 → `192.168.1.0`
        - **Broadcast** = all host bits 1 → `192.168.1.255`
        - **Usable hosts** = `192.168.1.1` to `192.168.1.254`

        When the mask does not land on an octet boundary, the maths goes through binary. Take `/26` (mask
        `...11000000` on the last octet). The network "step" is 2^(32−26) = 64. So /26 networks start at `.0`,
        `.64`, `.128`, `.192`. The address `192.168.1.100/26` belongs to network `192.168.1.64/26`: network
        `.64`, broadcast `.127`, hosts `.65` to `.126`.

examples:
  - title:
      fr: "Lire un réseau CIDR avec ipaddress"
      en: "Read a CIDR network with ipaddress"
    file: cidr_basics.py
    lang: python
    kind: neutral
    code: |
      import ipaddress

      net = ipaddress.ip_network("192.168.1.0/24")
      print("Mask        :", net.netmask)            # 255.255.255.0
      print("Addresses   :", net.num_addresses)      # 256
      print("Network     :", net.network_address)    # 192.168.1.0
      print("Broadcast   :", net.broadcast_address)  # 192.168.1.255
      print("Usable hosts:", net.num_addresses - 2)  # 254
      print("First host  :", next(net.hosts()))      # 192.168.1.1
    output: |
      Mask        : 255.255.255.0
      Addresses   : 256
      Network     : 192.168.1.0
      Broadcast   : 192.168.1.255
      Usable hosts: 254
      First host  : 192.168.1.1
    note:
      fr: "`net.hosts()` exclut déjà l'adresse réseau et le broadcast : d'où 254 machines pour un /24."
      en: "`net.hosts()` already excludes the network and broadcast addresses: hence 254 hosts for a /24."

  - title:
      fr: "Un masque qui ne tombe pas sur un octet : le /26"
      en: "A mask that is not on an octet boundary: /26"
    file: non_boundary_mask.py
    lang: python
    kind: neutral
    code: |
      import ipaddress

      # strict=False lets us pass a host address instead of the network address
      net = ipaddress.ip_network("192.168.1.100/26", strict=False)
      print("Belongs to  :", net)                    # 192.168.1.64/26
      print("Mask        :", net.netmask)            # 255.255.255.192
      print("Network     :", net.network_address)    # 192.168.1.64
      print("Broadcast   :", net.broadcast_address)  # 192.168.1.127
      print("Usable hosts:", net.num_addresses - 2)  # 62

      # The "step" between /26 networks is 2 ** (32 - 26) = 64
      print("Step        :", 2 ** (32 - 26))
    output: |
      Belongs to  : 192.168.1.64/26
      Mask        : 255.255.255.192
      Network     : 192.168.1.64
      Broadcast   : 192.168.1.127
      Usable hosts: 62
      Step        : 64
    note:
      fr: "192.168.1.100 tombe dans le bloc .64-.127. Le masque /26 laisse 6 bits machine, donc 64 adresses et 62 machines."
      en: "192.168.1.100 falls in the .64-.127 block. The /26 mask leaves 6 host bits, so 64 addresses and 62 hosts."

  - title:
      fr: "Convertir un préfixe CIDR en masque binaire, à la main"
      en: "Turn a CIDR prefix into a binary mask, by hand"
    file: prefix_to_mask.py
    lang: python
    kind: neutral
    code: |
      def prefix_to_mask(prefix: int) -> str:
          # prefix ones followed by (32 - prefix) zeros
          bits = "1" * prefix + "0" * (32 - prefix)
          # regroup into 4 octets and convert each to decimal
          octets = [str(int(bits[i:i + 8], 2)) for i in range(0, 32, 8)]
          return ".".join(octets)

      for p in (8, 16, 24, 26, 30):
          print(f"/{p:<2} -> {prefix_to_mask(p)}")
    output: |
      /8  -> 255.0.0.0
      /16 -> 255.255.0.0
      /24 -> 255.255.255.0
      /26 -> 255.255.255.192
      /30 -> 255.255.255.252
    note:
      fr: "Le masque n'est qu'une suite de 1 puis de 0. /26 = 26 uns : le dernier octet 11000000 vaut 192."
      en: "The mask is just a run of 1s then 0s. /26 = 26 ones: the last octet 11000000 equals 192."

mistake:
  fr: |
    **Oublier de réserver l'adresse réseau et le broadcast, ou confondre /24 et 24 machines.**

    Un `/24` ne fournit pas 256 machines utilisables mais **254** : la première adresse (`.0`) est l'adresse
    réseau et la dernière (`.255`) le broadcast. Autre erreur classique : croire qu'un plus grand nombre après
    le `/` donne un plus grand réseau. C'est l'inverse : **plus le préfixe est grand, plus le réseau est petit**
    (`/30` = 4 adresses, `/8` = 16 millions).
  en: |
    **Forgetting to reserve the network and broadcast addresses, or confusing /24 with 24 hosts.**

    A `/24` does not give 256 usable hosts but **254**: the first address (`.0`) is the network address and the
    last (`.255`) is the broadcast. Another classic error: thinking a bigger number after the `/` means a bigger
    network. It is the opposite: **the larger the prefix, the smaller the network** (`/30` = 4 addresses, `/8` =
    16 million).

bestPractice:
  fr: |
    - **Retenez la formule** : adresses = 2^(32 − préfixe), machines utilisables = ce nombre − 2.
    - **Mémorisez les masques fréquents** : /24 = 255.255.255.0, /16 = 255.255.0.0, /8 = 255.0.0.0.
    - **Utilisez `strict=False`** quand vous partez d'une adresse de machine pour retrouver son réseau.
    - **Vérifiez chaque découpage** avec le calculateur CIDR de la page avant de l'appliquer en production.
  en: |
    - **Remember the formula**: addresses = 2^(32 − prefix), usable hosts = that number − 2.
    - **Memorise the common masks**: /24 = 255.255.255.0, /16 = 255.255.0.0, /8 = 255.0.0.0.
    - **Use `strict=False`** when you start from a host address to recover its network.
    - **Check every split** with the page's CIDR calculator before applying it in production.

exercise:
  statement:
    fr: |
      Pour le réseau `10.20.30.0/28` :

      1. Combien d'adresses contient-il, et combien de machines utilisables ?
      2. Quelles sont son adresse réseau et son adresse de broadcast ?
      3. Vérifiez avec `ipaddress`, puis avec le calculateur CIDR de la page.
    en: |
      For the network `10.20.30.0/28`:

      1. How many addresses does it contain, and how many usable hosts?
      2. What are its network and broadcast addresses?
      3. Check with `ipaddress`, then with the page's CIDR calculator.
  solution:
    file: solution.py
    lang: python
    code: |
      import ipaddress

      net = ipaddress.ip_network("10.20.30.0/28")

      # 32 - 28 = 4 host bits -> 2**4 = 16 addresses, 16 - 2 = 14 usable
      print("Addresses   :", net.num_addresses)      # 16
      print("Usable hosts:", net.num_addresses - 2)  # 14
      print("Network     :", net.network_address)    # 10.20.30.0
      print("Broadcast   :", net.broadcast_address)  # 10.20.30.15
    note:
      fr: "/28 laisse 4 bits machine : 16 adresses, 14 utilisables (.1 à .14), réseau .0, broadcast .15."
      en: "/28 leaves 4 host bits: 16 addresses, 14 usable (.1 to .14), network .0, broadcast .15."

quiz:
  - q:
      fr: "Que signifie le /24 dans 192.168.1.0/24 ?"
      en: "What does the /24 mean in 192.168.1.0/24?"
    options:
      fr:
        - "Il y a 24 machines sur le réseau"
        - "Les 24 premiers bits désignent le réseau"
        - "Le réseau utilise la version 24 du protocole"
        - "Il y a 24 sous-réseaux"
      en:
        - "There are 24 hosts on the network"
        - "The first 24 bits identify the network"
        - "The network uses protocol version 24"
        - "There are 24 subnets"
    answer: 1
    why:
      fr: "Le /24 est le nombre de bits à 1 du masque : les 24 premiers bits sont la partie réseau."
      en: "The /24 is the number of 1 bits in the mask: the first 24 bits are the network part."
  - q:
      fr: "Combien de machines utilisables un réseau /24 fournit-il ?"
      en: "How many usable hosts does a /24 network provide?"
    options:
      fr: ["254", "256", "255", "128"]
      en: ["254", "256", "255", "128"]
    answer: 0
    why:
      fr: "256 adresses au total, moins l'adresse réseau et le broadcast, soit 254 machines."
      en: "256 addresses in total, minus the network and broadcast addresses, leaving 254 hosts."
  - q:
      fr: "Quel masque décimal correspond à /26 ?"
      en: "Which decimal mask matches /26?"
    options:
      fr: ["255.255.255.0", "255.255.255.224", "255.255.255.192", "255.255.255.252"]
      en: ["255.255.255.0", "255.255.255.224", "255.255.255.192", "255.255.255.252"]
    answer: 2
    why:
      fr: "/26 = 26 uns ; le dernier octet 11000000 vaut 192, d'où 255.255.255.192."
      en: "/26 = 26 ones; the last octet 11000000 equals 192, hence 255.255.255.192."
  - q:
      fr: "Entre /30 et /24, lequel désigne le plus grand réseau ?"
      en: "Between /30 and /24, which one is the larger network?"
    options:
      fr:
        - "/30, car 30 est plus grand"
        - "/24, car un préfixe plus petit laisse plus de bits machine"
        - "Ils ont la même taille"
        - "Cela dépend de l'adresse IP"
      en:
        - "/30, because 30 is bigger"
        - "/24, because a smaller prefix leaves more host bits"
        - "They are the same size"
        - "It depends on the IP address"
    answer: 1
    why:
      fr: "Plus le préfixe est petit, plus il reste de bits machine : /24 = 256 adresses, /30 = 4 adresses."
      en: "The smaller the prefix, the more host bits remain: /24 = 256 addresses, /30 = 4 addresses."
  - q:
      fr: "Dans 10.0.0.0/24, quelle adresse est le broadcast ?"
      en: "In 10.0.0.0/24, which address is the broadcast?"
    options:
      fr: ["10.0.0.0", "10.0.0.1", "10.0.0.254", "10.0.0.255"]
      en: ["10.0.0.0", "10.0.0.1", "10.0.0.254", "10.0.0.255"]
    answer: 3
    why:
      fr: "Le broadcast a tous les bits machine à 1 : pour un /24, c'est le dernier octet à 255, donc 10.0.0.255."
      en: "The broadcast has all host bits set to 1: for a /24 that is the last octet at 255, so 10.0.0.255."

