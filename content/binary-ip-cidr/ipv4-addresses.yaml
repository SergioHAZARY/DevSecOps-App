description:
  fr: "Lire une adresse IPv4, comprendre les 4 octets, distinguer adresses publiques et privées et les plages réservées."
  en: "Read an IPv4 address, understand the 4 octets, tell public from private addresses and the reserved ranges."
duration: 20

intro:
  fr: |
    Une **adresse IP** (*Internet Protocol*) est le numéro de téléphone d'une machine sur un réseau : elle
    permet d'envoyer des données à la bonne destination. La version la plus courante, **IPv4**, s'écrit sous
    la forme de quatre nombres séparés par des points, par exemple `192.168.1.10`.

    Chacun de ces quatre nombres est un **octet** (8 bits), donc il va de 0 à 255 - vous avez vu pourquoi
    dans la leçon sur le binaire. Au total une adresse IPv4 fait **32 bits**, ce qui donne environ 4,3
    milliards d'adresses possibles.

    Pensez à une adresse postale : le début identifie le quartier (le **réseau**), la fin identifie la maison
    (la **machine**). Certaines adresses sont « publiques » (visibles sur Internet), d'autres « privées »
    (réservées aux réseaux internes, comme votre box ou votre entreprise). Dans cette leçon vous apprendrez
    à les reconnaître. Le **calculateur CIDR** en bas de page vous aidera à décomposer n'importe quelle adresse.
  en: |
    An **IP address** (*Internet Protocol*) is a machine's phone number on a network: it lets data reach the
    right destination. The most common version, **IPv4**, is written as four numbers separated by dots, for
    example `192.168.1.10`.

    Each of those four numbers is an **octet** (8 bits), so it ranges from 0 to 255 - you saw why in the binary
    lesson. In total an IPv4 address is **32 bits**, which gives roughly 4.3 billion possible addresses.

    Think of a postal address: the start identifies the neighbourhood (the **network**), the end identifies the
    house (the **host**). Some addresses are "public" (visible on the Internet), others are "private" (reserved
    for internal networks, like your home router or your company). In this lesson you will learn to tell them
    apart. The **CIDR calculator** at the bottom of the page will help you break any address down.

sections:
  - heading:
      fr: "Anatomie d'une adresse IPv4"
      en: "Anatomy of an IPv4 address"
    body:
      fr: |
        Prenons `192.168.1.10`. Chaque octet se traduit en 8 bits :

        | Octet | 192 | 168 | 1 | 10 |
        |---|---|---|---|---|
        | **Binaire** | 11000000 | 10101000 | 00000001 | 00001010 |

        Mises bout à bout, on obtient les 32 bits : `11000000.10101000.00000001.00001010`. Chaque octet est
        indépendant et plafonne à 255 : une adresse comme `10.256.0.1` est **invalide**, car 256 ne tient pas
        dans un octet.

        Une adresse seule ne suffit pas : il faut aussi un **masque de sous-réseau** pour savoir quelle partie
        désigne le réseau et quelle partie désigne la machine. C'est l'objet de la prochaine leçon (CIDR).
      en: |
        Take `192.168.1.10`. Each octet translates into 8 bits:

        | Octet | 192 | 168 | 1 | 10 |
        |---|---|---|---|---|
        | **Binary** | 11000000 | 10101000 | 00000001 | 00001010 |

        Joined together, you get the 32 bits: `11000000.10101000.00000001.00001010`. Each octet is independent
        and caps at 255: an address like `10.256.0.1` is **invalid**, because 256 does not fit in an octet.

        An address alone is not enough: you also need a **subnet mask** to know which part names the network and
        which part names the host. That is the subject of the next lesson (CIDR).
  - heading:
      fr: "Adresses publiques, privées et réservées"
      en: "Public, private and reserved addresses"
    body:
      fr: |
        Toutes les adresses ne se valent pas. Trois plages sont **privées** (RFC 1918) : elles ne sont pas
        routées sur Internet et servent aux réseaux internes. D'autres plages sont réservées à des usages
        spéciaux.

        | Plage | Notation | Usage |
        |---|---|---|
        | 10.0.0.0 - 10.255.255.255 | 10.0.0.0/8 | Privée (grands réseaux) |
        | 172.16.0.0 - 172.31.255.255 | 172.16.0.0/12 | Privée (réseaux moyens) |
        | 192.168.0.0 - 192.168.255.255 | 192.168.0.0/16 | Privée (box, PME) |
        | 127.0.0.0 - 127.255.255.255 | 127.0.0.0/8 | Loopback (localhost) |
        | 169.254.0.0 - 169.254.255.255 | 169.254.0.0/16 | Link-local (APIPA, pas de DHCP) |

        Pour la documentation et les exemples, on utilise les plages `192.0.2.0/24`, `198.51.100.0/24` et
        `203.0.113.0/24` (RFC 5737) : ce sont de « fausses » adresses publiques, sûres à écrire dans un tutoriel.
      en: |
        Not all addresses are equal. Three ranges are **private** (RFC 1918): they are not routed on the
        Internet and are used for internal networks. Other ranges are reserved for special purposes.

        | Range | Notation | Use |
        |---|---|---|
        | 10.0.0.0 - 10.255.255.255 | 10.0.0.0/8 | Private (large networks) |
        | 172.16.0.0 - 172.31.255.255 | 172.16.0.0/12 | Private (medium networks) |
        | 192.168.0.0 - 192.168.255.255 | 192.168.0.0/16 | Private (home routers, small business) |
        | 127.0.0.0 - 127.255.255.255 | 127.0.0.0/8 | Loopback (localhost) |
        | 169.254.0.0 - 169.254.255.255 | 169.254.0.0/16 | Link-local (APIPA, no DHCP) |

        For documentation and examples, use the ranges `192.0.2.0/24`, `198.51.100.0/24` and `203.0.113.0/24`
        (RFC 5737): these are "fake" public addresses, safe to write in a tutorial.

examples:
  - title:
      fr: "Décomposer une adresse en octets binaires"
      en: "Break an address down into binary octets"
    file: ip_to_binary.py
    lang: python
    kind: neutral
    code: |
      ip = "192.168.1.10"

      # Split on the dots, convert each octet to an 8-bit string
      octets = ip.split(".")
      binary = ".".join(format(int(o), "08b") for o in octets)
      print(ip, "->", binary)

      # An IPv4 address is 32 bits in total
      bits = "".join(format(int(o), "08b") for o in octets)
      print("Total bits:", len(bits))
    output: |
      192.168.1.10 -> 11000000.10101000.00000001.00001010
      Total bits: 32
    note:
      fr: "On applique à chaque octet la conversion décimal → binaire de la 1re leçon. Les 4 octets donnent bien 32 bits."
      en: "Each octet uses the decimal → binary conversion from lesson 1. The 4 octets add up to the expected 32 bits."

  - title:
      fr: "Reconnaître une adresse privée avec le module ipaddress"
      en: "Detect a private address with the ipaddress module"
    file: classify_ip.py
    lang: python
    kind: neutral
    code: |
      import ipaddress

      # The standard library knows every reserved range
      for text in ["192.168.1.10", "10.0.0.5", "8.8.8.8", "127.0.0.1", "169.254.3.3"]:
          ip = ipaddress.ip_address(text)
          kind = (
              "loopback" if ip.is_loopback
              else "link-local" if ip.is_link_local
              else "private" if ip.is_private
              else "public"
          )
          print(f"{text:<15} -> {kind}")
    output: |
      192.168.1.10    -> private
      10.0.0.5        -> private
      8.8.8.8         -> public
      127.0.0.1       -> loopback
      169.254.3.3     -> link-local
    note:
      fr: "`ipaddress` évite d'apprendre les plages par cœur dans le code. `8.8.8.8` (DNS Google) est la seule adresse publique ici."
      en: "`ipaddress` avoids memorising ranges in code. `8.8.8.8` (Google DNS) is the only public address here."

  - title:
      fr: "Valider une adresse saisie par un utilisateur"
      en: "Validate a user-supplied address"
    file: validate_ip.py
    lang: python
    kind: secure
    code: |
      import ipaddress

      def is_valid_ipv4(text: str) -> bool:
          try:
              # version=4 rejects IPv6 and malformed input instead of trusting it
              ipaddress.IPv4Address(text)
              return True
          except ipaddress.AddressValueError:
              return False

      for text in ["203.0.113.5", "10.256.0.1", "1.2.3", "not-an-ip"]:
          print(f"{text:<15} -> {is_valid_ipv4(text)}")
    output: |
      203.0.113.5     -> True
      10.256.0.1      -> False
      1.2.3           -> False
      not-an-ip       -> False
    note:
      fr: "Ne validez jamais une IP avec une simple découpe de chaîne : `10.256.0.1` passerait. Laissez `ipaddress` rejeter les octets > 255 et les formats incomplets."
      en: "Never validate an IP with a plain string split: `10.256.0.1` would pass. Let `ipaddress` reject octets > 255 and incomplete formats."

mistake:
  fr: |
    **Croire qu'une adresse privée est « sécurisée » ou qu'un octet peut dépasser 255.**

    Une adresse privée n'est pas routée sur Internet, mais elle reste joignable depuis le réseau local : ce
    n'est **pas** une protection de sécurité. Par ailleurs, chaque octet est limité à 255 : `192.168.300.1`
    n'existe pas. Enfin, ne validez jamais une IP « à la main » avec un `split(\".\")` : utilisez une
    bibliothèque qui vérifie réellement les bornes.
  en: |
    **Thinking a private address is "secure", or that an octet can exceed 255.**

    A private address is not routed on the Internet, but it is still reachable from the local network: it is
    **not** a security control. Also, each octet is capped at 255: `192.168.300.1` does not exist. Finally,
    never validate an IP "by hand" with a `split(\".\")`: use a library that actually checks the bounds.

bestPractice:
  fr: |
    - **Utilisez les plages de documentation** (`192.0.2.0/24`, `198.51.100.0/24`, `203.0.113.0/24`) dans vos tutoriels et tickets.
    - **Validez les adresses** avec le module `ipaddress` plutôt qu'avec des expressions régulières fragiles.
    - **Ne vous fiez pas au réseau privé pour la sécurité** : appliquez quand même authentification et chiffrement.
    - **Réservez les adresses statiques** (serveurs, passerelles) et documentez votre plan d'adressage.
  en: |
    - **Use the documentation ranges** (`192.0.2.0/24`, `198.51.100.0/24`, `203.0.113.0/24`) in your tutorials and tickets.
    - **Validate addresses** with the `ipaddress` module rather than fragile regular expressions.
    - **Do not rely on a private network for security**: still apply authentication and encryption.
    - **Reserve static addresses** (servers, gateways) and document your addressing plan.

exercise:
  statement:
    fr: |
      Écrivez un script qui, pour la liste d'adresses `["172.16.5.4", "203.0.113.9", "127.0.0.1"]` :

      1. affiche chaque adresse en binaire (4 octets) ;
      2. indique si elle est privée, loopback ou publique.

      Appuyez-vous sur le module `ipaddress` et sur le **calculateur CIDR** de la page pour vérifier.
    en: |
      Write a script that, for the list `["172.16.5.4", "203.0.113.9", "127.0.0.1"]`:

      1. prints each address in binary (4 octets);
      2. states whether it is private, loopback or public.

      Lean on the `ipaddress` module and on the **CIDR calculator** on this page to check.
  solution:
    file: solution.py
    lang: python
    code: |
      import ipaddress

      for text in ["172.16.5.4", "203.0.113.9", "127.0.0.1"]:
          ip = ipaddress.ip_address(text)
          binary = ".".join(format(int(o), "08b") for o in text.split("."))
          kind = (
              "loopback" if ip.is_loopback
              else "private" if ip.is_private
              else "public"
          )
          print(f"{text:<13} {binary}  ({kind})")
    note:
      fr: "172.16.5.4 est dans 172.16.0.0/12 (privée), 203.0.113.9 est une plage de documentation (publique), 127.0.0.1 est le loopback."
      en: "172.16.5.4 falls in 172.16.0.0/12 (private), 203.0.113.9 is a documentation range (public), 127.0.0.1 is loopback."

quiz:
  - q:
      fr: "Combien de bits contient une adresse IPv4 ?"
      en: "How many bits are in an IPv4 address?"
    options:
      fr: ["32", "16", "64", "128"]
      en: ["32", "16", "64", "128"]
    answer: 0
    why:
      fr: "4 octets × 8 bits = 32 bits, soit environ 4,3 milliards d'adresses possibles."
      en: "4 octets × 8 bits = 32 bits, giving about 4.3 billion possible addresses."
  - q:
      fr: "Laquelle de ces adresses est privée (RFC 1918) ?"
      en: "Which of these addresses is private (RFC 1918)?"
    options:
      fr: ["8.8.8.8", "203.0.113.1", "1.1.1.1", "10.0.5.1"]
      en: ["8.8.8.8", "203.0.113.1", "1.1.1.1", "10.0.5.1"]
    answer: 3
    why:
      fr: "10.0.0.0/8 est une plage privée. Les trois autres sont des adresses publiques."
      en: "10.0.0.0/8 is a private range. The other three are public addresses."
  - q:
      fr: "Pourquoi l'adresse 192.168.300.1 est-elle invalide ?"
      en: "Why is the address 192.168.300.1 invalid?"
    options:
      fr:
        - "Parce qu'elle est publique"
        - "Parce que 300 dépasse 255, la valeur maximale d'un octet"
        - "Parce qu'il manque un octet"
        - "Parce qu'elle commence par 192"
      en:
        - "Because it is public"
        - "Because 300 exceeds 255, the maximum value of an octet"
        - "Because an octet is missing"
        - "Because it starts with 192"
    answer: 1
    why:
      fr: "Un octet fait 8 bits et plafonne à 255. 300 n'y tient pas, l'adresse est donc impossible."
      en: "An octet is 8 bits and caps at 255. 300 does not fit, so the address is impossible."
  - q:
      fr: "À quoi sert l'adresse 127.0.0.1 ?"
      en: "What is the address 127.0.0.1 used for?"
    options:
      fr:
        - "C'est l'adresse de la passerelle par défaut"
        - "C'est une adresse publique de Google"
        - "C'est le loopback : la machine elle-même (localhost)"
        - "C'est une adresse de diffusion (broadcast)"
      en:
        - "It is the default gateway address"
        - "It is a public Google address"
        - "It is loopback: the machine itself (localhost)"
        - "It is a broadcast address"
    answer: 2
    why:
      fr: "127.0.0.0/8 est réservé au loopback ; 127.0.0.1 désigne la machine locale elle-même."
      en: "127.0.0.0/8 is reserved for loopback; 127.0.0.1 points to the local machine itself."
  - q:
      fr: "Quelle plage utiliser pour des exemples d'adresses publiques dans un tutoriel ?"
      en: "Which range should you use for public-address examples in a tutorial?"
    options:
      fr: ["192.168.0.0/16", "10.0.0.0/8", "203.0.113.0/24", "169.254.0.0/16"]
      en: ["192.168.0.0/16", "10.0.0.0/8", "203.0.113.0/24", "169.254.0.0/16"]
    answer: 2
    why:
      fr: "203.0.113.0/24 est une plage de documentation (RFC 5737), prévue pour les exemples sans risque."
      en: "203.0.113.0/24 is a documentation range (RFC 5737), meant for safe examples."

