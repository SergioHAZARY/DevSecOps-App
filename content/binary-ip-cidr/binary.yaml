description:
  fr: "Comprendre le système binaire : compter avec des 0 et des 1, convertir vers le décimal et manipuler des octets, la brique de base des réseaux."
  en: "Understand the binary system: counting with 0s and 1s, converting to decimal and working with bytes, the building block of networking."
duration: 20

intro:
  fr: |
    Un ordinateur ne connaît que deux états : le courant passe (**1**) ou ne passe pas (**0**).
    Chaque 0 ou 1 s'appelle un **bit** (de *binary digit*, chiffre binaire). Huit bits forment un **octet**
    (*byte* en anglais). Tout ce que fait une machine - une lettre, une couleur, une adresse IP - finit
    en binaire.

    Imaginez un tableau d'interrupteurs. Chaque interrupteur vaut une certaine quantité (1, 2, 4, 8...).
    Pour écrire un nombre, vous allumez les bons interrupteurs et vous additionnez leurs valeurs. C'est
    exactement ce qu'est le binaire.

    Dans cette leçon, vous allez apprendre à **compter en binaire** et à **convertir** un nombre binaire
    en décimal (et l'inverse), étape par étape. Utilisez le **convertisseur de base** interactif en bas de
    page pour vérifier chacun de vos calculs.
  en: |
    A computer only knows two states: current flows (**1**) or it does not (**0**).
    Each 0 or 1 is called a **bit** (from *binary digit*). Eight bits make a **byte**. Everything a machine
    does - a letter, a colour, an IP address - ends up as binary.

    Picture a row of light switches. Each switch is worth a certain amount (1, 2, 4, 8...). To write a
    number, you flip on the right switches and add up their values. That is exactly what binary is.

    In this lesson you will learn to **count in binary** and to **convert** a binary number to decimal
    (and back), step by step. Use the interactive **base converter** at the bottom of the page to check
    every calculation.

sections:
  - heading:
      fr: "Les valeurs de position"
      en: "Place values"
    body:
      fr: |
        En décimal (base 10), chaque colonne vaut 10 fois la précédente : 1, 10, 100, 1000...
        En binaire (base 2), chaque colonne vaut **2 fois** la précédente : 1, 2, 4, 8, 16, 32, 64, 128.

        Un octet = 8 bits, donc 8 colonnes. Voici les poids, du bit de poids fort (à gauche) au bit de
        poids faible (à droite) :

        | Bit | 8e | 7e | 6e | 5e | 4e | 3e | 2e | 1er |
        |---|---|---|---|---|---|---|---|---|
        | **Poids** | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

        Pour lire un octet, additionnez les poids des colonnes où il y a un **1**. Exemple : `11010010`
        = 128 + 64 + 16 + 2 = **210**. Le plus grand octet, `11111111`, vaut 128+64+32+16+8+4+2+1 = **255**.
        C'est pourquoi un octet va toujours de **0 à 255** (256 valeurs).
      en: |
        In decimal (base 10), each column is worth 10 times the previous one: 1, 10, 100, 1000...
        In binary (base 2), each column is worth **2 times** the previous one: 1, 2, 4, 8, 16, 32, 64, 128.

        One byte = 8 bits, so 8 columns. Here are the weights, from the most significant bit (left) to the
        least significant bit (right):

        | Bit | 8th | 7th | 6th | 5th | 4th | 3rd | 2nd | 1st |
        |---|---|---|---|---|---|---|---|---|
        | **Weight** | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

        To read a byte, add the weights of the columns that hold a **1**. Example: `11010010`
        = 128 + 64 + 16 + 2 = **210**. The largest byte, `11111111`, equals 128+64+32+16+8+4+2+1 = **255**.
        That is why a byte always ranges from **0 to 255** (256 values).
  - heading:
      fr: "Décimal vers binaire : la méthode des soustractions"
      en: "Decimal to binary: the subtraction method"
    body:
      fr: |
        Pour convertir un nombre décimal (0-255) en binaire, parcourez les poids de **128 à 1**. À chaque
        poids, demandez : « est-ce qu'il rentre dans ce qui me reste ? » Si oui, écrivez **1** et soustrayez ;
        sinon écrivez **0**.

        Convertissons **77** :

        | Poids | Rentre dans le reste ? | Bit | Reste |
        |---|---|---|---|
        | 128 | 128 > 77, non | 0 | 77 |
        | 64 | 64 ≤ 77, oui | 1 | 13 |
        | 32 | 32 > 13, non | 0 | 13 |
        | 16 | 16 > 13, non | 0 | 13 |
        | 8 | 8 ≤ 13, oui | 1 | 5 |
        | 4 | 4 ≤ 5, oui | 1 | 1 |
        | 2 | 2 > 1, non | 0 | 1 |
        | 1 | 1 ≤ 1, oui | 1 | 0 |

        Résultat : **77 = 01001101**. Vérification : 64 + 8 + 4 + 1 = 77. ✔
      en: |
        To convert a decimal number (0-255) to binary, walk through the weights from **128 down to 1**. At
        each weight ask: "does it fit in what is left?" If yes, write **1** and subtract; otherwise write **0**.

        Let us convert **77**:

        | Weight | Fits in the remainder? | Bit | Remainder |
        |---|---|---|---|
        | 128 | 128 > 77, no | 0 | 77 |
        | 64 | 64 ≤ 77, yes | 1 | 13 |
        | 32 | 32 > 13, no | 0 | 13 |
        | 16 | 16 > 13, no | 0 | 13 |
        | 8 | 8 ≤ 13, yes | 1 | 5 |
        | 4 | 4 ≤ 5, yes | 1 | 1 |
        | 2 | 2 > 1, no | 0 | 1 |
        | 1 | 1 ≤ 1, yes | 1 | 0 |

        Result: **77 = 01001101**. Check: 64 + 8 + 4 + 1 = 77. ✔

examples:
  - title:
      fr: "Lire un octet binaire à la main, puis le vérifier en Python"
      en: "Read a binary byte by hand, then check it in Python"
    file: read_byte.py
    lang: python
    kind: neutral
    code: |
      # Byte to read: 11010010
      # Weights:      128 64 32 16 8 4 2 1
      # Bits set:     1   1  0  1  0 0 1 0
      # Sum:          128+64 +16   +2  = 210

      byte = "11010010"
      weights = [128, 64, 32, 16, 8, 4, 2, 1]

      total = 0
      for bit, weight in zip(byte, weights):
          if bit == "1":
              total += weight  # add the column weight only when the bit is 1

      print("Manual total:", total)
      print("int() check :", int(byte, 2))  # int(string, base) parses binary
    output: |
      Manual total: 210
      int() check : 210
    note:
      fr: "`int(\"11010010\", 2)` lit la chaîne comme un nombre en base 2. Les deux méthodes donnent 210 : votre calcul manuel est juste."
      en: "`int(\"11010010\", 2)` reads the string as a base-2 number. Both methods give 210: your manual calculation is correct."

  - title:
      fr: "Convertir un décimal en binaire avec les fonctions intégrées"
      en: "Convert decimal to binary with built-in functions"
    file: to_binary.py
    lang: python
    kind: neutral
    code: |
      # bin() returns a string prefixed with "0b"
      print(bin(77))            # 0b1001101

      # format(n, "08b") pads to 8 digits - the normal way to show a byte
      for n in (77, 172, 255):
          print(f"{n:>3} = {format(n, '08b')}")

      # 172 = 128 + 32 + 8 + 4  -> 10101100
      # 255 = all bits set       -> 11111111
    output: |
      0b1001101
       77 = 01001101
      172 = 10101100
      255 = 11111111
    note:
      fr: "`format(n, '08b')` complète à 8 chiffres : indispensable pour afficher un octet, car `bin(77)` ne montre que `1001101` (7 chiffres)."
      en: "`format(n, '08b')` pads to 8 digits: essential to display a byte, because `bin(77)` only shows `1001101` (7 digits)."

  - title:
      fr: "Le binaire est partout : un octet, 256 valeurs"
      en: "Binary is everywhere: one byte, 256 values"
    file: byte_range.py
    lang: python
    kind: neutral
    code: |
      # One byte = 8 bits = 2**8 = 256 distinct values (0 to 255)
      print("Values in a byte:", 2 ** 8)
      print("Smallest byte    :", format(0, "08b"), "=", 0)
      print("Largest byte     :", format(255, "08b"), "=", 255)

      # This is why each part of an IPv4 address (one octet) stops at 255.
      # 10.0.0.1  ->  00001010.00000000.00000000.00000001
      octets = [10, 0, 0, 1]
      print(".".join(format(o, "08b") for o in octets))
    output: |
      Values in a byte: 256
      Smallest byte    : 00000000 = 0
      Largest byte     : 11111111 = 255
      00001010.00000000.00000000.00000001
    note:
      fr: "Un octet ne peut pas dépasser 255. C'est la raison pour laquelle on ne verra jamais `10.256.0.1` : la leçon sur les adresses IPv4 s'appuie directement sur ce principe."
      en: "A byte cannot exceed 255. That is why you will never see `10.256.0.1`: the IPv4 addresses lesson builds directly on this principle."

mistake:
  fr: |
    **Lire les bits dans le mauvais sens ou oublier les zéros de gauche.**

    Le bit le plus à gauche vaut **128**, pas 1. Beaucoup de débutants lisent `00000011` comme 110 au lieu
    de 3. De même, en écrivant un octet il faut toujours **8 chiffres** : `101` tout seul est ambigu, il
    faut écrire `00000101`. Alignez toujours vos bits sous les poids 128-64-32-16-8-4-2-1.
  en: |
    **Reading the bits the wrong way round or dropping the leading zeros.**

    The leftmost bit is worth **128**, not 1. Many beginners read `00000011` as 110 instead of 3. Likewise,
    when writing a byte you must always use **8 digits**: `101` on its own is ambiguous, you should write
    `00000101`. Always line your bits up under the 128-64-32-16-8-4-2-1 weights.

bestPractice:
  fr: |
    - **Apprenez par cœur les 8 poids** : 128, 64, 32, 16, 8, 4, 2, 1. Tout le reste en découle.
    - **Écrivez toujours les octets sur 8 bits**, avec les zéros de tête.
    - **Vérifiez systématiquement** avec `int(\"...\", 2)` ou le convertisseur de base de cette page.
    - **Repérez les puissances de 2** (2, 4, 8, 16, 32, 64, 128, 256) : elles reviennent sans cesse en réseau et en sécurité.
  en: |
    - **Memorise the 8 weights**: 128, 64, 32, 16, 8, 4, 2, 1. Everything else follows from them.
    - **Always write bytes as 8 bits**, including the leading zeros.
    - **Always double-check** with `int(\"...\", 2)` or the base converter on this page.
    - **Recognise the powers of 2** (2, 4, 8, 16, 32, 64, 128, 256): they come up constantly in networking and security.

exercise:
  statement:
    fr: |
      Sans utiliser d'ordinateur dans un premier temps :

      1. Convertissez le décimal **200** en binaire sur 8 bits (méthode des soustractions).
      2. Convertissez le binaire **00101010** en décimal.
      3. Vérifiez ensuite vos deux réponses avec un petit script Python.
    en: |
      Without a computer at first:

      1. Convert the decimal **200** to an 8-bit binary number (subtraction method).
      2. Convert the binary **00101010** to decimal.
      3. Then check both answers with a short Python script.
  solution:
    file: solution.py
    lang: python
    code: |
      # 1) 200 -> binary
      # 128 fits (remainder 72), 64 fits (remainder 8), 32 no, 16 no,
      # 8 fits (remainder 0), 4 no, 2 no, 1 no  ->  11001000
      print("200 =", format(200, "08b"))   # 11001000

      # 2) 00101010 -> decimal : 32 + 8 + 2 = 42
      print("00101010 =", int("00101010", 2))  # 42

      # Checks
      assert format(200, "08b") == "11001000"
      assert int("00101010", 2) == 42
      print("Both answers are correct.")
    note:
      fr: "200 = 128+64+8 = 11001000. 00101010 = 32+8+2 = 42. Les `assert` échoueraient si un calcul était faux."
      en: "200 = 128+64+8 = 11001000. 00101010 = 32+8+2 = 42. The `assert` lines would fail if either calculation were wrong."

quiz:
  - q:
      fr: "Combien de bits contient un octet ?"
      en: "How many bits are in one byte?"
    options:
      fr: ["4", "8", "16", "32"]
      en: ["4", "8", "16", "32"]
    answer: 1
    why:
      fr: "Un octet = 8 bits, ce qui donne 2^8 = 256 valeurs possibles (0 à 255)."
      en: "A byte = 8 bits, which gives 2^8 = 256 possible values (0 to 255)."
  - q:
      fr: "Quelle est la valeur décimale du binaire 10101100 ?"
      en: "What is the decimal value of binary 10101100?"
    options:
      fr: ["156", "172", "180", "204"]
      en: ["156", "172", "180", "204"]
    answer: 1
    why:
      fr: "128 + 32 + 8 + 4 = 172."
      en: "128 + 32 + 8 + 4 = 172."
  - q:
      fr: "Quel est le poids du bit le plus à gauche d'un octet ?"
      en: "What is the weight of the leftmost bit in a byte?"
    options:
      fr: ["1", "64", "128", "256"]
      en: ["1", "64", "128", "256"]
    answer: 2
    why:
      fr: "Le bit de poids fort vaut 128 ; le bit de poids faible, tout à droite, vaut 1."
      en: "The most significant bit is worth 128; the least significant bit, far right, is worth 1."
  - q:
      fr: "Quelle est la plus grande valeur qu'un seul octet peut représenter ?"
      en: "What is the largest value a single byte can represent?"
    options:
      fr: ["127", "255", "256", "1024"]
      en: ["127", "255", "256", "1024"]
    answer: 1
    why:
      fr: "11111111 = 128+64+32+16+8+4+2+1 = 255. Il y a 256 valeurs car on compte aussi le 0."
      en: "11111111 = 128+64+32+16+8+4+2+1 = 255. There are 256 values because 0 counts too."
  - q:
      fr: "Comment écrit-on le décimal 5 sur 8 bits ?"
      en: "How do you write decimal 5 as an 8-bit number?"
    options:
      fr: ["00000101", "00000011", "00001010", "00000111"]
      en: ["00000101", "00000011", "00001010", "00000111"]
    answer: 0
    why:
      fr: "5 = 4 + 1, donc les bits de poids 4 et 1 sont à 1 : 00000101."
      en: "5 = 4 + 1, so the bits with weights 4 and 1 are set: 00000101."

