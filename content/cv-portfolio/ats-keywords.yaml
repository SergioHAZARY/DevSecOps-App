description:
  fr: "Passer le filtre ATS : comprendre comment un logiciel trie les CV, bâtir une liste de mots-clés DevSecOps, chiffrer ses réalisations, et écrire un script Python qui repère les mots-clés d'une offre absents de votre CV."
  en: "Pass the ATS filter: understand how software screens résumés, build a DevSecOps keyword list, quantify your achievements, and write a Python script that spots which job-offer keywords are missing from your résumé."
duration: 25

intro:
  fr: |
    Avant qu'un humain ne lise votre CV, un logiciel l'a souvent déjà trié. Un **ATS** (*Applicant
    Tracking System*) est le système qu'utilisent beaucoup d'entreprises pour gérer les candidatures : il
    analyse votre CV, cherche des **mots-clés** correspondant à l'offre et classe les candidats. Si les
    bons mots n'y sont pas, un humain ne verra peut-être jamais votre profil.

    L'analogie : l'ATS est le **videur** à l'entrée. Il ne juge pas votre talent, il vérifie une liste. Si
    l'offre demande « Terraform » et que votre CV dit seulement « IaC », le videur peut vous recaler, même
    si vous maîtrisez Terraform.

    Ce n'est **pas** une invitation au bourrage de mots-clés (que les ATS modernes et les humains
    détectent). C'est une invitation à **parler le même langage que l'offre**, honnêtement. Dans cette
    leçon : une liste de mots-clés DevSecOps, la règle des réalisations chiffrées, et un **script Python**
    que vous pouvez lancer pour comparer votre CV à une offre et voir ce qui manque.
  en: |
    Before a human reads your résumé, software has often already screened it. An **ATS** (*Applicant
    Tracking System*) is the system many companies use to manage applications: it parses your résumé,
    looks for **keywords** matching the offer and ranks candidates. If the right words are not there, a
    human may never see your profile.

    The analogy: the ATS is the **bouncer** at the door. It does not judge your talent, it checks a list.
    If the offer asks for "Terraform" and your résumé only says "IaC", the bouncer may turn you away, even
    if you are fluent in Terraform.

    This is **not** an invitation to keyword-stuff (modern ATS and humans detect it). It is an invitation
    to **speak the same language as the offer**, honestly. In this lesson: a DevSecOps keyword list, the
    quantified-achievement rule, and a **Python script** you can run to compare your résumé with an offer
    and see what is missing.

sections:
  - heading:
      fr: "Comment pense un ATS"
      en: "How an ATS thinks"
    body:
      fr: |
        Un ATS fait trois choses : il **extrait le texte** de votre CV, le **compare** à des mots-clés
        (souvent tirés de l'offre), et **classe** les candidats. Conséquences pratiques :

        - **Format lisible** : un CV en colonnes compliquées, en image ou avec des tableaux exotiques peut
          être mal extrait. Préférez une structure simple (le Markdown exporté en PDF passe bien).
        - **Les mots exacts comptent** : écrivez à la fois l'acronyme et le terme complet la première fois
          (« CI/CD (intégration et déploiement continus) »), et nommez les outils précis.
        - **Pas d'astuce** : le texte blanc sur fond blanc ou les mots-clés cachés sont détectés et
          disqualifient.

        | À faire | À éviter |
        |---|---|
        | Nommer les outils exacts (Terraform, Trivy) | Rester vague (« outils IaC ») |
        | Reprendre les mots de l'offre quand c'est vrai | Inventer des compétences |
        | Format texte simple | Images, colonnes, texte caché |
      en: |
        An ATS does three things: it **extracts the text** of your résumé, **compares** it to keywords
        (often drawn from the offer), and **ranks** candidates. Practical consequences:

        - **Readable format**: a résumé in complex columns, as an image or with exotic tables may be parsed
          badly. Prefer a simple structure (Markdown exported to PDF works well).
        - **Exact words matter**: write both the acronym and the full term the first time ("CI/CD
          (continuous integration and delivery)"), and name the precise tools.
        - **No tricks**: white text on white background or hidden keywords are detected and disqualify you.

        | Do | Avoid |
        |---|---|
        | Name the exact tools (Terraform, Trivy) | Stay vague ("IaC tools") |
        | Reuse the offer's words when true | Invent skills |
        | Simple text format | Images, columns, hidden text |
  - heading:
      fr: "Mots-clés DevSecOps et réalisations chiffrées"
      en: "DevSecOps keywords and quantified achievements"
    body:
      fr: |
        Groupez vos mots-clés par thème : le recruteur comme l'ATS s'y retrouvent. Une base solide pour un
        profil DevSecOps :

        - **CI/CD & sécurité du pipeline** : GitHub Actions, GitLab CI, Jenkins, SAST, DAST, SCA, Semgrep,
          Trivy, OWASP ZAP, Gitleaks.
        - **Cloud & IaC** : AWS, Azure, GCP, Terraform, Ansible, OIDC, IAM, moindre privilège.
        - **Conteneurs & orchestration** : Docker, Kubernetes, Helm, OPA/Gatekeeper, Falco.
        - **AppSec** : OWASP Top 10, injection SQL, XSS, JWT, TLS.
        - **Langages** : Python, Bash, Go, SQL, YAML.
        - **Transverses** : CIS Benchmarks, SBOM, MITRE ATT&CK, SIEM.

        N'écrivez que ce qui est **vrai**. Puis chiffrez : chaque compétence prend de la valeur quand elle
        est reliée à un résultat (« réduit de 60 % les vulnérabilités critiques », « 40+ merges bloqués »).
        Un mot-clé prouve que vous *connaissez* l'outil ; un chiffre prouve que vous *l'avez utilisé avec
        impact*.
      en: |
        Group your keywords by theme: both the recruiter and the ATS find their way. A solid base for a
        DevSecOps profile:

        - **CI/CD & pipeline security**: GitHub Actions, GitLab CI, Jenkins, SAST, DAST, SCA, Semgrep,
          Trivy, OWASP ZAP, Gitleaks.
        - **Cloud & IaC**: AWS, Azure, GCP, Terraform, Ansible, OIDC, IAM, least privilege.
        - **Containers & orchestration**: Docker, Kubernetes, Helm, OPA/Gatekeeper, Falco.
        - **AppSec**: OWASP Top 10, SQL injection, XSS, JWT, TLS.
        - **Languages**: Python, Bash, Go, SQL, YAML.
        - **Cross-cutting**: CIS Benchmarks, SBOM, MITRE ATT&CK, SIEM.

        Only write what is **true**. Then quantify: each skill gains value when tied to a result ("cut
        critical vulnerabilities by 60%", "40+ merges blocked"). A keyword proves you *know* the tool; a
        number proves you *used it with impact*.

examples:
  - title:
      fr: "Une liste de mots-clés DevSecOps (à adapter à chaque offre)"
      en: "A DevSecOps keyword list (tailor to each offer)"
    file: keywords.md
    lang: markdown
    kind: neutral
    code: |
      # DevSecOps keyword bank — pick the ones that are TRUE for you and match the offer

      ## CI/CD & pipeline security
      CI/CD, GitHub Actions, GitLab CI, Jenkins, pipeline, SAST, DAST, SCA,
      Semgrep, SonarQube, Trivy, Grype, OWASP ZAP, Gitleaks, Dependabot, SBOM

      ## Cloud & IaC
      AWS, Azure, GCP, Terraform, Ansible, CloudFormation, OIDC, IAM,
      least privilege, VPC, Security Groups, CIS Benchmarks

      ## Containers & Kubernetes
      Docker, Dockerfile, Kubernetes, kubectl, Helm, OPA, Gatekeeper, Kyverno,
      Falco, Pod Security, NetworkPolicy, RBAC, distroless

      ## AppSec & crypto
      OWASP Top 10, SQL injection, XSS, CSRF, SSRF, JWT, OAuth2, TLS, mTLS, Argon2

      ## Languages & monitoring
      Python, Bash, Go, SQL, YAML, Prometheus, Grafana, ELK, Wazuh, SIEM, MITRE ATT&CK
    note:
      fr: "C'est une **banque** de mots-clés, pas une liste à copier telle quelle. Pour chaque candidature, surlignez l'intersection entre vos vraies compétences et les termes de l'offre, puis assurez-vous qu'ils figurent dans votre CV."
      en: "This is a keyword **bank**, not a list to copy as-is. For each application, highlight the intersection between your real skills and the offer's terms, then make sure they appear in your résumé."

  - title:
      fr: "Lignes faibles (ni mots-clés, ni chiffres)"
      en: "Weak bullets (no keywords, no numbers)"
    file: weak.md
    lang: markdown
    kind: vulnerable
    code: |
      - Set up some security tools in the deployment process.
      - Good knowledge of cloud and containers.
      - Improved the application's security.
    note:
      fr: "Aucun outil nommé, aucun chiffre : ni l'ATS ni l'humain n'ont de prise. « Des outils de sécurité » ne correspond à aucun mot-clé d'offre."
      en: "No tool named, no number: neither the ATS nor the human has anything to grab. \"Security tools\" matches no offer keyword."

  - title:
      fr: "Lignes fortes (mots-clés précis + chiffres)"
      en: "Strong bullets (precise keywords + numbers)"
    file: strong.md
    lang: markdown
    kind: secure
    code: |
      - Integrated Semgrep (SAST), Trivy (SCA) and Gitleaks into a GitHub Actions
        pipeline, blocking 40+ vulnerable merges over one quarter.
      - Hardened AWS IAM to least privilege and moved CI auth to OIDC, removing all
        long-lived access keys.
      - Scanned and hardened Docker images (distroless, non-root), cutting critical
        CVEs by ~70% per release.
    note:
      fr: "Chaque ligne nomme des outils exacts (Semgrep, Trivy, Gitleaks, OIDC, distroless) **et** donne un résultat chiffré. Elle satisfait l'ATS (mots-clés) et convainc l'humain (impact)."
      en: "Each line names exact tools (Semgrep, Trivy, Gitleaks, OIDC, distroless) **and** gives a quantified result. It satisfies the ATS (keywords) and convinces the human (impact)."

  - title:
      fr: "Un script Python : quels mots-clés de l'offre manquent à mon CV ?"
      en: "A Python script: which offer keywords are missing from my résumé?"
    file: ats_check.py
    lang: python
    kind: neutral
    code: |
      import re

      # Paste your CV text and the job-offer text (kept short here for the demo).
      cv_text = """
      DevSecOps engineer. Built a GitHub Actions pipeline with Semgrep and Trivy.
      Hardened Docker images and AWS IAM. Python and Bash scripting.
      """

      job_offer = """
      We are hiring a DevSecOps engineer with GitHub Actions, Terraform, Docker,
      Kubernetes, Trivy and Python. Experience with OIDC and Semgrep is a plus.
      """

      def tokenize(text):
          # Lowercase and split on non-word characters; keep '/' and '+' as separators
          return set(re.findall(r"[a-z0-9][a-z0-9+#.]*", text.lower()))

      def keywords(text):
          # The skills an offer screens on (extend this list for real use)
          known = {
              "ci/cd", "github", "gitlab", "jenkins", "terraform", "ansible",
              "docker", "kubernetes", "aws", "azure", "gcp", "oidc", "iam",
              "semgrep", "trivy", "gitleaks", "python", "bash", "go", "sql",
          }
          tokens = tokenize(text)
          return {k for k in known if all(part in tokens for part in k.split("/"))}

      cv_keywords = keywords(cv_text)
      offer_keywords = keywords(job_offer)
      missing = sorted(offer_keywords - cv_keywords)

      print("Offer asks for :", sorted(offer_keywords))
      print("Your CV covers :", sorted(cv_keywords))
      print("MISSING        :", missing)
      coverage = round(100 * len(offer_keywords & cv_keywords) / max(len(offer_keywords), 1))
      print(f"Coverage       : {coverage}%")
    output: |
      Offer asks for : ['docker', 'github', 'kubernetes', 'oidc', 'python', 'semgrep', 'terraform', 'trivy']
      Your CV covers : ['aws', 'docker', 'github', 'python', 'semgrep', 'trivy']
      MISSING        : ['kubernetes', 'oidc', 'terraform']
      Coverage       : 62%
    note:
      fr: "Le script révèle les mots-clés de l'offre absents de votre CV (`kubernetes`, `oidc`, `terraform`). S'ils correspondent à de **vraies** compétences, ajoutez-les ; sinon, c'est peut-être une offre pour laquelle il faut d'abord se former. Lancez-le, modifiez les deux textes, observez la couverture."
      en: "The script reveals the offer keywords missing from your résumé (`kubernetes`, `oidc`, `terraform`). If they match **real** skills, add them; if not, it may be an offer to upskill for first. Run it, edit the two texts, watch the coverage."

mistake:
  fr: |
    **Bourrer son CV de mots-clés que l'on ne maîtrise pas.**

    Tenté de copier toute la liste de l'offre pour passer l'ATS ? Mauvaise idée. D'abord, les ATS modernes
    et les recruteurs repèrent le remplissage artificiel (texte caché, listes incohérentes). Ensuite, et
    surtout, le mensonge se paie à l'**entretien technique** : on vous posera une question sur ce
    « Kubernetes » que vous avez listé sans jamais l'avoir utilisé. Mettez les mots-clés **vrais**, et
    formez-vous sur ceux qui manquent.
  en: |
    **Stuffing your résumé with keywords you do not master.**

    Tempted to copy the offer's whole list to pass the ATS? Bad idea. First, modern ATS and recruiters
    spot artificial filling (hidden text, incoherent lists). Second, and above all, the lie is paid for in
    the **technical interview**: you will be asked about that "Kubernetes" you listed without ever using
    it. Put the **true** keywords, and upskill on the missing ones.

bestPractice:
  fr: |
    - **Reprenez le vocabulaire de l'offre** quand il correspond à de vraies compétences.
    - **Nommez les outils exacts** (Terraform, Trivy), pas des catégories floues (« outils IaC »).
    - **Écrivez acronyme + terme complet** la première fois, pour couvrir les deux recherches ATS.
    - **Gardez un format texte simple** : pas d'image, pas de colonnes exotiques, PDF exporté proprement.
    - **Mesurez la couverture** avec un script avant d'envoyer, et comblez les manques réels.
    - **Jamais de bourrage** : chaque mot-clé doit survivre à une question d'entretien.
  en: |
    - **Reuse the offer's vocabulary** when it matches real skills.
    - **Name the exact tools** (Terraform, Trivy), not vague categories ("IaC tools").
    - **Write acronym + full term** the first time, to cover both ATS searches.
    - **Keep a simple text format**: no image, no exotic columns, cleanly exported PDF.
    - **Measure coverage** with a script before sending, and fill the real gaps.
    - **Never keyword-stuff**: every keyword must survive an interview question.

exercise:
  statement:
    fr: |
      Reprenez le script `ats_check.py`. Une offre mentionne « Ansible » et « GitLab CI », mais la liste
      `known` du script ne contient pas encore « ansible » et « gitlab ».

      1. Que se passe-t-il si ces termes sont dans l'offre mais absents de `known` ?
      2. Modifiez la fonction `keywords` pour qu'elle les prenne en compte, et dites comment vérifier la
         couverture ensuite.
    en: |
      Take the `ats_check.py` script. An offer mentions "Ansible" and "GitLab CI", but the script's `known`
      list does not yet contain "ansible" and "gitlab".

      1. What happens if those terms are in the offer but absent from `known`?
      2. Modify the `keywords` function so it accounts for them, and say how to check coverage afterwards.
  solution:
    file: ats_fix.py
    lang: python
    code: |
      # 1. If a term is not in `known`, the script simply ignores it: it will never
      #    appear as "asked for" nor as "missing". The known set is the script's
      #    vocabulary, so it must contain every skill you want to track.

      # 2. Add the terms to the known set (here as an extension):
      extra = {"ansible", "gitlab", "helm", "falco"}

      def keywords(text, known):
          import re
          tokens = set(re.findall(r"[a-z0-9][a-z0-9+#.]*", text.lower()))
          return {k for k in known if all(part in tokens for part in k.split("/"))}

      base = {"ci/cd", "github", "terraform", "docker", "kubernetes", "python"}
      known = base | extra  # now 'ansible' and 'gitlab' are tracked

      offer = "DevSecOps with GitLab CI, Ansible, Terraform and Docker."
      cv = "I use Terraform and Docker daily."
      print("Missing:", sorted(keywords(offer, known) - keywords(cv, known)))
      # Missing: ['ansible', 'gitlab']
    note:
      fr: "Le point clé : la liste `known` **est** le vocabulaire du script. Un mot-clé absent de cette liste est invisible pour l'analyse. On l'étend donc avec les compétences que l'on veut suivre, puis on relance pour voir la nouvelle couverture."
      en: "The key point: the `known` list **is** the script's vocabulary. A keyword absent from it is invisible to the analysis. So you extend it with the skills you want to track, then re-run to see the new coverage."

quiz:
  - q:
      fr: "Que fait un ATS avec votre CV ?"
      en: "What does an ATS do with your résumé?"
    options:
      fr:
        - "Il l'imprime automatiquement"
        - "Il extrait le texte, cherche des mots-clés et classe les candidats"
        - "Il corrige vos fautes"
        - "Il l'envoie directement au PDG"
      en:
        - "It prints it automatically"
        - "It extracts the text, looks for keywords and ranks candidates"
        - "It fixes your typos"
        - "It sends it straight to the CEO"
    answer: 1
    why:
      fr: "L'ATS parse le CV, le compare à des mots-clés (souvent issus de l'offre) et trie les candidatures avant l'humain."
      en: "The ATS parses the résumé, compares it to keywords (often from the offer) and sorts applications before a human sees them."
  - q:
      fr: "Pourquoi nommer les outils exacts plutôt que des catégories floues ?"
      en: "Why name exact tools rather than vague categories?"
    options:
      fr:
        - "Pour allonger le CV"
        - "Parce que l'ATS cherche des mots précis : « Terraform » matche, « outils IaC » souvent non"
        - "Parce que les catégories sont interdites"
        - "Pour impressionner par le jargon"
      en:
        - "To make the résumé longer"
        - "Because the ATS looks for precise words: \"Terraform\" matches, \"IaC tools\" often does not"
        - "Because categories are forbidden"
        - "To impress with jargon"
    answer: 1
    why:
      fr: "L'ATS compare des termes exacts. Si l'offre dit « Terraform », il faut que « Terraform » figure dans le CV."
      en: "The ATS compares exact terms. If the offer says \"Terraform\", the word \"Terraform\" must appear in the résumé."
  - q:
      fr: "Quel est le risque du bourrage de mots-clés ?"
      en: "What is the risk of keyword stuffing?"
    options:
      fr:
        - "Aucun, c'est recommandé"
        - "Être détecté par l'ATS/recruteur et se faire piéger à l'entretien technique"
        - "Rendre le CV plus rapide à lire"
        - "Améliorer la mise en page"
      en:
        - "None, it is recommended"
        - "Being detected by the ATS/recruiter and getting caught in the technical interview"
        - "Making the résumé faster to read"
        - "Improving the layout"
    answer: 1
    why:
      fr: "Le bourrage est repéré et, pire, une compétence inventée s'effondre dès la première question technique."
      en: "Stuffing is spotted and, worse, an invented skill collapses at the first technical question."
  - q:
      fr: "Dans le script `ats_check.py`, que représente l'ensemble `known` ?"
      en: "In the `ats_check.py` script, what does the `known` set represent?"
    options:
      fr:
        - "Le vocabulaire de compétences que le script sait reconnaître"
        - "La liste des recruteurs"
        - "Les mots interdits"
        - "Les fautes d'orthographe"
      en:
        - "The vocabulary of skills the script can recognize"
        - "The list of recruiters"
        - "The forbidden words"
        - "The spelling mistakes"
    answer: 0
    why:
      fr: "Un mot absent de `known` est ignoré par l'analyse ; on étend donc cette liste avec les compétences à suivre."
      en: "A word absent from `known` is ignored by the analysis; so you extend that list with the skills to track."
  - q:
      fr: "Comment rendre un mot-clé crédible aux yeux du recruteur ?"
      en: "How do you make a keyword credible to the recruiter?"
    options:
      fr:
        - "En le mettant en gras trois fois"
        - "En le reliant à une réalisation chiffrée"
        - "En le cachant en blanc sur blanc"
        - "En le répétant à chaque ligne"
      en:
        - "By bolding it three times"
        - "By tying it to a quantified achievement"
        - "By hiding it white on white"
        - "By repeating it on every line"
    answer: 1
    why:
      fr: "Un mot-clé relié à un résultat (« Trivy : -70 % de CVE ») prouve l'usage réel, pas seulement la connaissance."
      en: "A keyword tied to a result (\"Trivy: -70% CVEs\") proves real usage, not just awareness."
