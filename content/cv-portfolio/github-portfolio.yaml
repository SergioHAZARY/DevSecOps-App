description:
  fr: "Transformer votre GitHub en portfolio qui recrute : un README de profil soigné, des dépôts épinglés bien choisis, une structure de README de projet claire, et des descriptions qui prouvent au lieu de dire."
  en: "Turn your GitHub into a portfolio that gets you hired: a polished profile README, well-chosen pinned repositories, a clear project README structure, and descriptions that prove instead of tell."
duration: 20

intro:
  fr: |
    En DevSecOps, votre **GitHub vaut parfois plus que votre CV**. Un recruteur technique clique sur le
    lien, regarde vos dépôts épinglés et votre code en dix minutes. C'est votre vitrine : elle doit
    montrer que vous savez livrer du code propre, documenté et sécurisé.

    L'analogie : GitHub est votre **boutique**. Le README de profil est la devanture, les dépôts épinglés
    sont les produits en vitrine, et chaque README de projet est l'étiquette qui explique à quoi sert le
    produit. Une boutique en désordre, sans étiquettes, fait fuir même si les produits sont bons.

    Dans cette leçon, vous allez soigner trois choses : le **README de profil** (ce que l'on voit en
    arrivant sur votre page), la **sélection des dépôts épinglés** (montrez vos meilleurs projets, pas
    tout), et la **structure d'un bon README de projet**. Vos projets du module 6 sont la matière parfaite
    pour cette vitrine.
  en: |
    In DevSecOps, your **GitHub is sometimes worth more than your résumé**. A technical recruiter clicks
    the link, looks at your pinned repositories and your code within ten minutes. It is your shop window:
    it must show you can ship clean, documented and secure code.

    The analogy: GitHub is your **shop**. The profile README is the storefront, the pinned repositories are
    the products on display, and each project README is the label that explains what the product does. A
    messy shop with no labels drives people away even if the products are good.

    In this lesson you will polish three things: the **profile README** (what people see when they land on
    your page), the **selection of pinned repositories** (show your best projects, not everything), and the
    **structure of a good project README**. Your module-6 projects are the perfect material for this window.

sections:
  - heading:
      fr: "Le README de profil et les dépôts épinglés"
      en: "The profile README and pinned repositories"
    body:
      fr: |
        GitHub affiche un **README de profil** si vous créez un dépôt portant **exactement votre nom
        d'utilisateur** (par exemple `example/example`) contenant un `README.md`. Ce texte apparaît en haut
        de votre page. Gardez-le court : qui vous êtes, votre spécialité, vos projets phares, comment vous
        contacter.

        Les **dépôts épinglés** (jusqu'à six) sont ce qu'un recruteur regarde en premier. Règles :

        - **Qualité, pas quantité** : épinglez 3 à 6 projets soignés, pas vos 40 exercices.
        - **Chaque projet épinglé a un bon README** et, idéalement, un CI vert (badge de pipeline).
        - **Variez** : montrez un pipeline sécurisé, un projet Kubernetes, un outil en Python, par exemple.

        > Un dépôt sans README est un produit sans étiquette : le recruteur ne devinera pas, il passera.

        Rangez le reste : archivez les vieux dépôts, supprimez les forks inutiles. Une page claire envoie
        un meilleur signal qu'une page encombrée.
      en: |
        GitHub shows a **profile README** if you create a repository named **exactly your username** (for
        example `example/example`) containing a `README.md`. This text appears at the top of your page. Keep
        it short: who you are, your specialty, your flagship projects, how to reach you.

        **Pinned repositories** (up to six) are what a recruiter looks at first. Rules:

        - **Quality, not quantity**: pin 3 to 6 polished projects, not your 40 exercises.
        - **Every pinned project has a good README** and, ideally, a green CI (pipeline badge).
        - **Vary them**: show a secure pipeline, a Kubernetes project, a Python tool, for example.

        > A repository with no README is a product with no label: the recruiter will not guess, they will
        > move on.

        Tidy the rest: archive old repositories, delete useless forks. A clean page sends a better signal
        than a cluttered one.
  - heading:
      fr: "Un README de projet qui parle au recruteur"
      en: "A project README that speaks to the recruiter"
    body:
      fr: |
        Un bon README de projet répond à quatre questions, dans l'ordre : *quoi ?*, *pourquoi c'est
        intéressant ?*, *comment l'utiliser ?*, *qu'est-ce que ça prouve ?*. Une structure efficace :

        | Section | Contenu |
        |---|---|
        | Titre + phrase d'accroche | Ce que fait le projet en une ligne |
        | Badges | CI, licence, langage (crédibilité immédiate) |
        | Fonctionnalités / sécurité | Ce qui est démontré (SAST, durcissement…) |
        | Démarrage rapide | Les commandes pour lancer |
        | Architecture / choix | Pourquoi vous avez fait ces choix |
        | Captures / résultats | La preuve que ça marche |

        Pour un projet de sécurité, la section « sécurité » est votre atout : montrez **ce que vous avez
        protégé et comment** (contrôles du pipeline, image durcie, politiques). C'est ce qui vous distingue
        d'un projet « qui marche » sans plus.

        Enfin, les **descriptions** : une phrase par projet, qui **prouve** au lieu de dire. Comparez
        « petit projet Kubernetes » et « cluster Kubernetes durci avec OPA Gatekeeper et Falco, validé par
        attaques simulées ». La seconde donne envie de cliquer.
      en: |
        A good project README answers four questions, in order: *what?*, *why is it interesting?*, *how do
        I use it?*, *what does it prove?*. An effective structure:

        | Section | Content |
        |---|---|
        | Title + one-line hook | What the project does in one line |
        | Badges | CI, license, language (instant credibility) |
        | Features / security | What is demonstrated (SAST, hardening…) |
        | Quick start | The commands to run it |
        | Architecture / choices | Why you made these choices |
        | Screenshots / results | Proof that it works |

        For a security project, the "security" section is your asset: show **what you protected and how**
        (pipeline controls, hardened image, policies). That is what sets you apart from a project that
        merely "works".

        Finally, the **descriptions**: one sentence per project, that **proves** instead of tells. Compare
        "small Kubernetes project" and "hardened Kubernetes cluster with OPA Gatekeeper and Falco, validated
        with simulated attacks". The second one makes people want to click.

examples:
  - title:
      fr: "Le README de profil GitHub"
      en: "The GitHub profile README"
    file: README.md
    lang: markdown
    kind: neutral
    code: |
      ## Hi, I'm Jean 👋

      **DevSecOps engineer** — I build secure CI/CD pipelines and harden cloud and
      Kubernetes infrastructure. I learn in public and ship small, well-documented
      projects.

      ### 🔧 What I work with
      `GitHub Actions` · `Terraform` · `Docker` · `Kubernetes` · `Trivy` · `Semgrep`
      · `OPA/Gatekeeper` · `Falco` · `Python` · `Bash`

      ### 📌 Featured projects
      - **hardened-k8s-lab** — kind cluster with OPA Gatekeeper + Falco, validated
        with simulated attacks.
      - **secure-flask-pipeline** — Flask API with a zero-secret CI/CD pipeline
        (SAST, SCA, DAST).
      - **devsecops-homelab-wazuh** — Wazuh SIEM detecting SSH brute force and SQLi.

      ### 📫 Reach me
      jean.rakoto@example.com · linkedin.com/in/example
    note:
      fr: "Court et scannable : qui vous êtes, vos outils, trois projets phares décrits en une ligne chacun, un contact. Le dépôt doit s'appeler exactement comme votre nom d'utilisateur (`example/example`) pour s'afficher en tête de profil."
      en: "Short and scannable: who you are, your tools, three flagship projects described in one line each, a contact. The repo must be named exactly like your username (`example/example`) to appear at the top of the profile."

  - title:
      fr: "La structure d'un README de projet"
      en: "A project README structure"
    file: project-README.md
    lang: markdown
    kind: neutral
    code: |
      # hardened-k8s-lab

      [![CI](https://img.shields.io/badge/CI-passing-brightgreen)](#)
      [![License: MIT](https://img.shields.io/badge/License-MIT-blue)](#)

      A local, hardened Kubernetes cluster with defense in depth and simulated
      attacks that prove it works.

      ## Security controls
      - Pod Security Admission (`restricted`) + OPA Gatekeeper policies
      - Default-deny NetworkPolicies (Calico), least-privilege RBAC
      - Falco runtime detection (shells, `/etc` writes, odd egress)

      ## Quick start
      ```bash
      ./scripts/setup.sh
      kubectl apply -f workloads/
      ./scripts/validate.sh   # runs the simulated attacks
      ```

      ## What it proves
      Privileged Pods are rejected, a shell exec raises a Falco alert, and
      cross-namespace traffic is blocked — all demonstrated by the validation script.
    note:
      fr: "Les badges donnent une crédibilité immédiate ; la section **sécurité** met en avant ce qui vous distingue ; « What it proves » montre que le projet est validé, pas seulement écrit. On reste concis et orienté résultat."
      en: "The badges give instant credibility; the **security** section highlights what sets you apart; \"What it proves\" shows the project is validated, not just written. It stays concise and result-oriented."

  - title:
      fr: "Description de projet faible"
      en: "Weak project description"
    file: descriptions.md
    lang: markdown
    kind: vulnerable
    code: |
      ## Weak repo descriptions (vague, forgettable)
      - k8s-stuff — my kubernetes project
      - pipeline — a ci pipeline
      - scanner — python tool
    note:
      fr: "« my kubernetes project » ne dit rien : ni ce qui est fait, ni la techno, ni la valeur. Un recruteur qui survole ne clique pas. Un dépôt mal nommé et mal décrit est invisible."
      en: "\"my kubernetes project\" says nothing: not what is done, not the tech, not the value. A recruiter skimming does not click. A badly named, badly described repo is invisible."

  - title:
      fr: "Description de projet forte"
      en: "Strong project description"
    file: descriptions.md
    lang: markdown
    kind: secure
    code: |
      ## Strong repo descriptions (specific, prove value)
      - hardened-k8s-lab — Hardened Kubernetes cluster with OPA Gatekeeper + Falco,
        validated by simulated attacks.
      - secure-flask-pipeline — Flask API with a zero-secret CI/CD pipeline: SAST,
        SCA, container scan and DAST.
      - vuln-scanner — Python CLI scanning ports, HTTP headers and TLS, with a
        JSON/HTML report.
    note:
      fr: "Chaque description nomme la techno, ce que fait le projet et sa valeur de sécurité. En une ligne, le recruteur sait s'il veut ouvrir le dépôt. C'est la même règle que pour les lignes de CV : prouver, pas dire."
      en: "Each description names the tech, what the project does and its security value. In one line, the recruiter knows whether to open the repo. It is the same rule as for résumé bullets: prove, don't tell."

mistake:
  fr: |
    **Épingler vingt dépôts vides ou sans README.**

    Beaucoup pensent que « plus il y a de dépôts, mieux c'est ». C'est l'inverse. Un recruteur qui tombe
    sur des dizaines de dépôts d'exercices sans description, sans README, parfois cassés, en conclut que
    vous ne savez pas finir ni documenter. Mieux vaut **trois projets soignés, documentés et verts en CI**
    que trente brouillons. Archivez le reste, et faites de chaque dépôt épinglé une vitrine.
  en: |
    **Pinning twenty empty or README-less repositories.**

    Many think "the more repos, the better". It is the opposite. A recruiter who lands on dozens of
    exercise repos with no description, no README, sometimes broken, concludes you cannot finish or
    document. Better **three polished, documented, CI-green projects** than thirty drafts. Archive the
    rest, and make every pinned repo a shop window.

bestPractice:
  fr: |
    - **Créez un README de profil** (dépôt au nom de votre utilisateur) : court, avec vos projets phares.
    - **Épinglez 3 à 6 projets de qualité**, variés, chacun avec un bon README et idéalement un CI vert.
    - **Chaque README répond à** quoi / pourquoi / comment / ce que ça prouve.
    - **Mettez la sécurité en avant** : les contrôles, le durcissement, les politiques appliquées.
    - **Décrivez chaque dépôt** en une ligne qui prouve la valeur, pas « mon projet ».
    - **Rangez** : archivez les vieux dépôts, supprimez les forks inutiles.
  en: |
    - **Create a profile README** (repo named after your username): short, with your flagship projects.
    - **Pin 3 to 6 quality projects**, varied, each with a good README and ideally a green CI.
    - **Every README answers** what / why / how / what it proves.
    - **Feature security**: the controls, the hardening, the policies applied.
    - **Describe each repo** in one line that proves value, not "my project".
    - **Tidy up**: archive old repos, delete useless forks.

exercise:
  statement:
    fr: |
      Vous avez un dépôt nommé `scanner` avec la description « python tool ». C'est en réalité un scanner
      de vulnérabilités en ligne de commande qui vérifie les ports ouverts, les en-têtes HTTP de sécurité
      et la configuration TLS, et produit un rapport JSON.

      1. Proposez un meilleur **nom** de dépôt.
      2. Écrivez une **description** d'une ligne qui prouve la valeur.
    en: |
      You have a repository named `scanner` with the description "python tool". It is actually a
      command-line vulnerability scanner that checks open ports, HTTP security headers and TLS
      configuration, and produces a JSON report.

      1. Propose a better repository **name**.
      2. Write a one-line **description** that proves the value.
  solution:
    file: rename.md
    lang: markdown
    code: |
      # 1. A clear, descriptive name (lowercase, hyphenated, self-explanatory)
      vuln-scanner

      # 2. A one-line description that names the tech and proves the value
      "Python CLI vulnerability scanner: open ports, HTTP security headers and TLS
      configuration, with a JSON report. Built with the standard library."
    note:
      fr: "Le nom `vuln-scanner` dit tout de suite ce que c'est ; la description nomme la techno (Python, CLI) et les capacités (ports, en-têtes, TLS, rapport JSON). On passe d'invisible à cliquable."
      en: "The name `vuln-scanner` immediately says what it is; the description names the tech (Python, CLI) and the capabilities (ports, headers, TLS, JSON report). It goes from invisible to clickable."

quiz:
  - q:
      fr: "Comment afficher un README en haut de votre page de profil GitHub ?"
      en: "How do you display a README at the top of your GitHub profile page?"
    options:
      fr:
        - "En créant un dépôt nommé exactement comme votre nom d'utilisateur, avec un README.md"
        - "En payant un abonnement"
        - "En ajoutant un fichier profile.txt"
        - "C'est impossible"
      en:
        - "By creating a repository named exactly like your username, with a README.md"
        - "By paying for a subscription"
        - "By adding a profile.txt file"
        - "It is impossible"
    answer: 0
    why:
      fr: "GitHub affiche le README d'un dépôt portant exactement votre nom d'utilisateur en tête de votre profil."
      en: "GitHub displays the README of a repository named exactly like your username at the top of your profile."
  - q:
      fr: "Combien de dépôts épingler, et selon quel critère ?"
      en: "How many repositories should you pin, and by what criterion?"
    options:
      fr:
        - "Le plus possible, quantité avant tout"
        - "3 à 6 projets de qualité, variés et documentés"
        - "Un seul, pour rester mystérieux"
        - "Uniquement des forks populaires"
      en:
        - "As many as possible, quantity first"
        - "3 to 6 quality projects, varied and documented"
        - "Just one, to stay mysterious"
        - "Only popular forks"
    answer: 1
    why:
      fr: "On épingle quelques projets soignés qui montrent l'étendue de ses compétences, pas une masse de brouillons."
      en: "You pin a few polished projects that show the breadth of your skills, not a mass of drafts."
  - q:
      fr: "Que doit répondre un bon README de projet ?"
      en: "What should a good project README answer?"
    options:
      fr:
        - "Uniquement le nom de l'auteur"
        - "Quoi, pourquoi c'est intéressant, comment l'utiliser, ce que ça prouve"
        - "La liste des commits"
        - "Le salaire espéré"
      en:
        - "Only the author's name"
        - "What, why it is interesting, how to use it, what it proves"
        - "The commit list"
        - "The expected salary"
    answer: 1
    why:
      fr: "Un README efficace guide le lecteur : but, intérêt, utilisation, preuve que ça fonctionne."
      en: "An effective README guides the reader: purpose, interest, usage, proof that it works."
  - q:
      fr: "Pourquoi une description comme « my kubernetes project » est-elle mauvaise ?"
      en: "Why is a description like \"my kubernetes project\" bad?"
    options:
      fr:
        - "Parce qu'elle est trop longue"
        - "Parce qu'elle ne nomme ni la techno précise, ni ce que fait le projet, ni sa valeur"
        - "Parce que Kubernetes est interdit sur GitHub"
        - "Parce qu'elle contient trop de mots-clés"
      en:
        - "Because it is too long"
        - "Because it names neither the precise tech, nor what the project does, nor its value"
        - "Because Kubernetes is forbidden on GitHub"
        - "Because it has too many keywords"
    answer: 1
    why:
      fr: "Une description doit prouver la valeur en une ligne ; « my kubernetes project » n'apprend rien au recruteur."
      en: "A description must prove value in one line; \"my kubernetes project\" teaches the recruiter nothing."
  - q:
      fr: "Pour un projet de sécurité, quelle section du README met le plus en valeur votre profil ?"
      en: "For a security project, which README section best showcases your profile?"
    options:
      fr:
        - "La section listant vos loisirs"
        - "La section expliquant ce que vous avez protégé et comment (contrôles, durcissement, politiques)"
        - "La section des remerciements"
        - "La liste complète des dépendances"
      en:
        - "The section listing your hobbies"
        - "The section explaining what you protected and how (controls, hardening, policies)"
        - "The acknowledgements section"
        - "The full dependency list"
    answer: 1
    why:
      fr: "La section sécurité montre concrètement vos compétences DevSecOps, ce qui vous distingue d'un projet « qui marche »."
      en: "The security section concretely shows your DevSecOps skills, which sets you apart from a project that merely \"works\"."
