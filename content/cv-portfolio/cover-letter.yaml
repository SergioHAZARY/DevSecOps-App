description:
  fr: "Écrire une lettre de motivation DevSecOps qui donne envie de vous rencontrer : structure en trois parties, exemples complets en français et en anglais, et la différence entre une accroche banale et une accroche qui accroche."
  en: "Write a DevSecOps cover letter that makes people want to meet you: a three-part structure, complete examples in French and English, and the difference between a dull opening and one that hooks."
duration: 20

intro:
  fr: |
    « Est-ce qu'on lit encore les lettres de motivation ? » Souvent, oui — surtout quand deux CV se
    valent. La lettre est l'endroit où vous montrez que vous avez **compris l'entreprise** et que votre
    candidature n'est pas un copier-coller envoyé à cinquante offres.

    Pensez à la lettre comme à un **message de présentation** sur une plateforme : court, personnel,
    orienté vers l'autre. Personne ne lit trois paragraphes génériques ; tout le monde lit trois phrases
    qui parlent de *son* besoin.

    La règle d'or : **parlez de l'entreprise, pas seulement de vous**. Montrez que vous savez ce qu'elle
    fait, reliez un de vos accomplissements à son besoin, et proposez la suite. Dans cette leçon, vous
    obtenez une structure simple et deux lettres complètes et réutilisables, une en **français** et une en
    **anglais**, que vous adapterez à chaque candidature.
  en: |
    "Does anyone still read cover letters?" Often, yes — especially when two résumés are equal. The letter
    is where you show that you have **understood the company** and that your application is not a copy-paste
    sent to fifty offers.

    Think of the letter like an **intro message** on a platform: short, personal, focused on the other
    side. Nobody reads three generic paragraphs; everyone reads three sentences that speak to *their* need.

    The golden rule: **talk about the company, not only about yourself**. Show that you know what they do,
    tie one of your achievements to their need, and propose the next step. In this lesson you get a simple
    structure and two complete, reusable letters, one in **French** and one in **English**, which you will
    tailor to each application.

sections:
  - heading:
      fr: "La structure en trois parties"
      en: "The three-part structure"
    body:
      fr: |
        Une bonne lettre tient en trois courts paragraphes, sur **moins d'une page** :

        1. **L'accroche (pourquoi eux)** : montrez que vous connaissez l'entreprise et le poste. Une phrase
           précise sur ce qu'elle fait vaut mieux que « Je suis passionné par la sécurité ».
        2. **La preuve (pourquoi vous)** : reliez **une** réalisation concrète au besoin de l'offre. Pas
           votre CV entier : *un* exemple fort, chiffré, pertinent.
        3. **La suite (l'appel à l'action)** : proposez un échange, remerciez, restez disponible.

        | Partie | Objectif | Piège à éviter |
        |---|---|---|
        | Accroche | Montrer l'intérêt réel | « Je vous écris pour postuler… » |
        | Preuve | Prouver l'adéquation | Répéter le CV mot pour mot |
        | Suite | Ouvrir la porte | Finir mollement, sans appel |

        Adaptez **à chaque offre**. Une lettre générique se repère en une phrase et dessert plus qu'elle
        n'aide.
      en: |
        A good letter fits in three short paragraphs, on **less than one page**:

        1. **The hook (why them)**: show you know the company and the role. One precise sentence about what
           they do beats "I am passionate about security".
        2. **The proof (why you)**: tie **one** concrete achievement to the offer's need. Not your whole
           résumé: *one* strong, quantified, relevant example.
        3. **The next step (the call to action)**: propose a conversation, thank them, stay available.

        | Part | Goal | Trap to avoid |
        |---|---|---|
        | Hook | Show genuine interest | "I am writing to apply…" |
        | Proof | Prove the fit | Repeating the résumé word for word |
        | Next step | Open the door | Ending weakly, with no call |

        Tailor it **to each offer**. A generic letter is spotted in one sentence and hurts more than it
        helps.
  - heading:
      fr: "Ton, longueur et personnalisation"
      en: "Tone, length and personalization"
    body:
      fr: |
        Le ton est **professionnel mais humain** : on écrit à une personne, pas à un formulaire. Évitez le
        jargon pompeux (« synergies », « forte appétence ») et les formules creuses. Préférez des phrases
        courtes et des faits.

        La longueur : **150 à 250 mots**, trois paragraphes. Un recruteur qui voit un pavé ne le lit pas.

        La personnalisation fait toute la différence. Deux leviers simples :

        - **Citez un élément réel** : un produit de l'entreprise, une valeur affichée, une techno de leur
          stack mentionnée dans l'offre.
        - **Reliez-le à vous** : « Votre migration vers Kubernetes m'évoque le cluster durci que j'ai
          construit avec OPA Gatekeeper et Falco. »

        > Même structure, deux langues : une entreprise malgache ou française attendra souvent le français,
        > une entreprise internationale ou un poste remote, l'anglais. Gardez les deux prêtes.
      en: |
        The tone is **professional but human**: you write to a person, not to a form. Avoid pompous jargon
        ("synergies", "strong appetite") and empty phrases. Prefer short sentences and facts.

        The length: **150 to 250 words**, three paragraphs. A recruiter who sees a wall of text does not
        read it.

        Personalization makes all the difference. Two simple levers:

        - **Cite something real**: a company product, a stated value, a tech from their stack mentioned in
          the offer.
        - **Tie it to you**: "Your migration to Kubernetes echoes the hardened cluster I built with OPA
          Gatekeeper and Falco."

        > Same structure, two languages: a Malagasy or French company will often expect French, an
        > international company or a remote role, English. Keep both ready.

examples:
  - title:
      fr: "Lettre de motivation complète (français)"
      en: "Complete cover letter (French)"
    file: lettre-fr.md
    lang: markdown
    kind: secure
    code: |
      Objet : Candidature au poste d'ingénieur DevSecOps

      Madame, Monsieur,

      Votre annonce mentionne la sécurisation de vos pipelines CI/CD et votre
      migration vers Kubernetes : ce sont exactement les sujets sur lesquels je
      construis mes projets. Votre approche « la sécurité au plus tôt » rejoint ma
      façon de travailler.

      Lors de mon stage chez Example Corp, j'ai intégré Semgrep, Trivy et Gitleaks
      à un pipeline GitHub Actions, ce qui a bloqué plus de 40 fusions vulnérables
      en un trimestre. En parallèle, j'ai monté un cluster Kubernetes durci avec
      OPA Gatekeeper et Falco, que j'ai validé par des attaques simulées. Ces deux
      expériences correspondent directement à votre besoin.

      Je serais ravi d'échanger sur la façon dont je pourrais contribuer à vos
      pipelines. Je reste disponible pour un entretien et vous remercie de votre
      attention.

      Jean Rakoto
      jean.rakoto@example.com · github.com/example
    note:
      fr: "Trois paragraphes, moins de 200 mots. L'accroche cite **leurs** sujets (CI/CD, Kubernetes), la preuve relie **une** réalisation chiffrée au besoin, la clôture propose un échange. Rien n'est générique."
      en: "Three paragraphs, under 200 words. The hook cites **their** topics (CI/CD, Kubernetes), the proof ties **one** quantified achievement to the need, the close proposes a conversation. Nothing is generic."

  - title:
      fr: "Lettre de motivation complète (anglais)"
      en: "Complete cover letter (English)"
    file: letter-en.md
    lang: markdown
    kind: secure
    code: |
      Subject: Application for the DevSecOps Engineer position

      Dear Hiring Team,

      Your posting highlights securing CI/CD pipelines and your move to Kubernetes —
      the exact areas I build my projects around. Your "shift-left" approach matches
      how I like to work.

      During my internship at Example Corp, I added Semgrep, Trivy and Gitleaks to a
      GitHub Actions pipeline, which blocked over 40 vulnerable merges in a single
      quarter. In parallel, I built a hardened Kubernetes cluster with OPA Gatekeeper
      and Falco and validated it with simulated attacks. Both map directly to what
      your team is doing.

      I would love to discuss how I could help strengthen your pipelines. I am
      available for an interview, and thank you for your time.

      Best regards,
      Jean Rakoto
      jean.rakoto@example.com · github.com/example
    note:
      fr: "La version anglaise suit la **même structure** et les mêmes faits. Gardez les deux à jour en parallèle : pour un poste remote ou international, l'anglais est souvent attendu."
      en: "The English version follows the **same structure** and the same facts. Keep both up to date in parallel: for a remote or international role, English is often expected."

  - title:
      fr: "Accroche faible vs accroche forte"
      en: "Weak opening vs strong opening"
    file: openings.md
    lang: markdown
    kind: vulnerable
    code: |
      ## Weak opening (generic, about you, says nothing)
      "I am writing to apply for the DevSecOps position. I am passionate about
      security and a hard worker, and I believe I would be a great fit for your
      company."

      ## Strong opening (specific, about THEM, shows you did your homework)
      "Your posting highlights securing CI/CD pipelines and your move to Kubernetes —
      the exact areas I build my projects around. Your shift-left approach matches
      how I like to work."
    note:
      fr: "L'accroche faible pourrait être envoyée à n'importe quelle entreprise : elle ne prouve rien. L'accroche forte cite **leur** contexte et montre que vous avez lu l'offre. C'est la première phrase qui décide si la suite est lue."
      en: "The weak opening could be sent to any company: it proves nothing. The strong opening cites **their** context and shows you read the offer. The first sentence decides whether the rest gets read."

mistake:
  fr: |
    **Envoyer la même lettre générique à toutes les offres.**

    « Je suis passionné, motivé, rigoureux » : ces mots ne disent rien et s'appliquent à tout le monde. Une
    lettre qui ne nomme jamais l'entreprise ni le poste précis est repérée immédiatement et donne
    l'impression que vous postulez en masse, sans intérêt réel. Pire que pas de lettre du tout. Consacrez
    cinq minutes à personnaliser l'accroche et l'exemple : c'est ce qui fait la différence.
  en: |
    **Sending the same generic letter to every offer.**

    "I am passionate, motivated, rigorous": these words say nothing and apply to everyone. A letter that
    never names the company or the precise role is spotted immediately and gives the impression you are
    mass-applying, with no real interest. Worse than no letter at all. Spend five minutes personalizing the
    hook and the example: that is what makes the difference.

bestPractice:
  fr: |
    - **Trois paragraphes, 150-250 mots** : accroche (eux), preuve (vous), appel à l'action.
    - **Citez un élément réel** de l'entreprise dès la première phrase.
    - **Une seule réalisation**, chiffrée et pertinente, pas tout votre CV.
    - **Personnalisez à chaque offre** : jamais de lettre universelle.
    - **Gardez une version FR et une version EN** à jour, pour l'local et le remote/international.
    - **Relisez** : zéro faute, et le bon nom d'entreprise (l'erreur de copier-coller est fatale).
  en: |
    - **Three paragraphs, 150-250 words**: hook (them), proof (you), call to action.
    - **Cite something real** about the company in the very first sentence.
    - **One achievement only**, quantified and relevant, not your whole résumé.
    - **Personalize for each offer**: never a universal letter.
    - **Keep an FR and an EN version** up to date, for local and remote/international.
    - **Proofread**: zero typos, and the right company name (the copy-paste error is fatal).

exercise:
  statement:
    fr: |
      Une entreprise fictive, « CloudNova », recrute un ingénieur DevSecOps. Son offre insiste sur la
      **sécurité des conteneurs** et la **détection à l'exécution**.

      Écrivez l'**accroche** (le premier paragraphe, 2-3 phrases) d'une lettre qui montre que vous avez
      compris leur besoin et le relie à votre expérience. Évitez toute formule générique.
    en: |
      A fictional company, "CloudNova", is hiring a DevSecOps engineer. Their posting stresses **container
      security** and **runtime detection**.

      Write the **opening** (the first paragraph, 2-3 sentences) of a letter that shows you understood their
      need and ties it to your experience. Avoid any generic phrase.
  solution:
    file: hook.md
    lang: markdown
    code: |
      Madame, Monsieur,

      Votre annonce met l'accent sur la sécurité des conteneurs et la détection à
      l'exécution — précisément les deux piliers du cluster Kubernetes que j'ai
      durci avec OPA Gatekeeper et Falco. Votre approche me parle d'autant plus que
      je l'ai mise en pratique et validée par des attaques simulées dans mon
      laboratoire.
    note:
      fr: "L'accroche nomme **leurs** mots (sécurité des conteneurs, détection à l'exécution) et les relie immédiatement à une réalisation concrète (Gatekeeper, Falco, attaques simulées). Le recruteur voit en deux phrases que vous êtes pertinent."
      en: "The opening names **their** words (container security, runtime detection) and immediately ties them to a concrete achievement (Gatekeeper, Falco, simulated attacks). In two sentences the recruiter sees you are relevant."

quiz:
  - q:
      fr: "Quel est le rôle du premier paragraphe d'une lettre de motivation ?"
      en: "What is the role of a cover letter's first paragraph?"
    options:
      fr:
        - "Lister vos diplômes"
        - "Montrer que vous connaissez l'entreprise et le poste, pour accrocher"
        - "Répéter l'intégralité du CV"
        - "Demander le salaire"
      en:
        - "List your degrees"
        - "Show you know the company and the role, to hook them"
        - "Repeat the entire résumé"
        - "Ask about the salary"
    answer: 1
    why:
      fr: "L'accroche prouve l'intérêt réel en citant le contexte de l'entreprise ; c'est elle qui décide si la suite est lue."
      en: "The hook proves genuine interest by citing the company's context; it decides whether the rest gets read."
  - q:
      fr: "Combien de réalisations détailler dans le paragraphe de preuve ?"
      en: "How many achievements should the proof paragraph detail?"
    options:
      fr:
        - "Toutes celles du CV"
        - "Une seule, forte, chiffrée et pertinente"
        - "Aucune, pour rester modeste"
        - "Au moins dix"
      en:
        - "All the ones from the résumé"
        - "Just one, strong, quantified and relevant"
        - "None, to stay modest"
        - "At least ten"
    answer: 1
    why:
      fr: "La lettre n'est pas un CV bis : un exemple fort et relié au besoin convainc mieux qu'une liste."
      en: "The letter is not a second résumé: one strong example tied to the need convinces better than a list."
  - q:
      fr: "Quelle longueur viser pour une lettre de motivation ?"
      en: "What length should a cover letter aim for?"
    options:
      fr:
        - "Deux pages pleines"
        - "150 à 250 mots, moins d'une page"
        - "Une seule phrase"
        - "Autant que le CV"
      en:
        - "Two full pages"
        - "150 to 250 words, under one page"
        - "A single sentence"
        - "As much as the résumé"
    answer: 1
    why:
      fr: "Un recruteur ne lit pas un pavé ; trois courts paragraphes suffisent à montrer l'essentiel."
      en: "A recruiter does not read a wall of text; three short paragraphs are enough to show the essentials."
  - q:
      fr: "Pourquoi éviter une lettre générique ?"
      en: "Why avoid a generic letter?"
    options:
      fr:
        - "Parce qu'elle est trop longue à écrire"
        - "Parce qu'elle se repère immédiatement et donne l'impression d'un envoi en masse"
        - "Parce que c'est interdit"
        - "Parce qu'elle contient trop de mots-clés"
      en:
        - "Because it takes too long to write"
        - "Because it is spotted immediately and looks like a mass mailing"
        - "Because it is forbidden"
        - "Because it contains too many keywords"
    answer: 1
    why:
      fr: "Une lettre qui ne nomme ni l'entreprise ni le poste signale un copier-coller et dessert la candidature."
      en: "A letter that names neither the company nor the role signals a copy-paste and hurts the application."
  - q:
      fr: "Pour un poste remote international, quelle langue privilégier souvent pour la lettre ?"
      en: "For an international remote role, which language is often preferred for the letter?"
    options:
      fr:
        - "L'anglais"
        - "Uniquement le français"
        - "Peu importe, personne ne la lit"
        - "La langue maternelle du recruteur, à deviner"
      en:
        - "English"
        - "French only"
        - "It does not matter, nobody reads it"
        - "The recruiter's mother tongue, to be guessed"
    answer: 0
    why:
      fr: "Les postes remote et internationaux se traitent le plus souvent en anglais ; gardez une version EN prête."
      en: "Remote and international roles are usually handled in English; keep an EN version ready."
