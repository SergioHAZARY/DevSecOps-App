description:
  fr: "Construire la structure d'un CV DevSecOps efficace : les sections qui comptent, un CV complet en Markdown, un resume.json au format JSON Resume, et la différence entre une ligne faible et une ligne forte."
  en: "Build the structure of an effective DevSecOps résumé: the sections that matter, a complete résumé in Markdown, a resume.json in the JSON Resume format, and the difference between a weak and a strong bullet."
duration: 20

intro:
  fr: |
    Votre CV a environ **sept secondes** pour convaincre un recruteur de continuer sa lecture. En
    DevSecOps, où les offres sont techniques et concurrentielles, un CV clair et ciblé fait la différence
    entre « suivant » et « on l'appelle ».

    Pensez à votre CV comme à la **page d'accueil d'une application** : on doit comprendre, sans effort, ce
    que vous faites, ce que vous avez accompli et comment vous contacter. Pas de surcharge, pas de détour.

    Dans cette leçon, vous allez voir **quelles sections** mettre et dans quel ordre, puis obtenir deux
    gabarits réutilisables : un **CV complet en Markdown** (facile à versionner et à exporter en PDF) et un
    **`resume.json`** au format *JSON Resume*, un standard ouvert qui génère automatiquement un CV à partir
    de données structurées. Enfin, vous apprendrez à transformer une ligne plate (« responsable de la
    sécurité ») en une ligne qui prouve (« réduit de 60 % les vulnérabilités critiques »).
  en: |
    Your résumé has roughly **seven seconds** to convince a recruiter to keep reading. In DevSecOps, where
    job offers are technical and competitive, a clear, targeted résumé is the difference between "next" and
    "let's call them".

    Think of your résumé like an **application's landing page**: one must understand, effortlessly, what
    you do, what you achieved and how to contact you. No clutter, no detour.

    In this lesson you will see **which sections** to include and in what order, then get two reusable
    templates: a **complete résumé in Markdown** (easy to version and export to PDF) and a **`resume.json`**
    in the *JSON Resume* format, an open standard that generates a résumé from structured data. Finally,
    you will learn to turn a flat line ("responsible for security") into one that proves ("cut critical
    vulnerabilities by 60%").

sections:
  - heading:
      fr: "Les sections d'un CV DevSecOps"
      en: "The sections of a DevSecOps résumé"
    body:
      fr: |
        L'ordre compte : le recruteur lit de haut en bas et s'arrête si rien n'accroche. Une structure
        éprouvée :

        | Section | Contenu | Pourquoi |
        |---|---|---|
        | En-tête | Nom, titre, e-mail, GitHub, LinkedIn, ville/remote | Contact immédiat |
        | Résumé (3-4 lignes) | Qui vous êtes + votre spécialité + un chiffre fort | L'accroche des 7 secondes |
        | Compétences | Outils regroupés par thème (CI/CD, cloud, conteneurs…) | Mots-clés pour l'ATS et l'humain |
        | Expérience | Réalisations **chiffrées**, pas des tâches | La preuve |
        | Projets | 2-3 projets concrets avec lien GitHub | Montre, ne dit pas |
        | Certifications & formation | Sécurité d'abord si pertinent | Crédibilité |

        Pour un débutant, inversez **Projets** et **Expérience** : vos projets personnels (comme ceux du
        module 6) remplacent une expérience que vous n'avez pas encore. Un CV tient idéalement sur **une
        page** (deux maximum pour un profil senior).
      en: |
        Order matters: the recruiter reads top to bottom and stops if nothing grabs them. A proven
        structure:

        | Section | Content | Why |
        |---|---|---|
        | Header | Name, title, email, GitHub, LinkedIn, city/remote | Immediate contact |
        | Summary (3-4 lines) | Who you are + your specialty + one strong number | The 7-second hook |
        | Skills | Tools grouped by theme (CI/CD, cloud, containers…) | Keywords for the ATS and the human |
        | Experience | **Quantified** achievements, not tasks | The proof |
        | Projects | 2-3 concrete projects with GitHub links | Show, don't tell |
        | Certifications & education | Security first if relevant | Credibility |

        For a beginner, swap **Projects** and **Experience**: your personal projects (like those in module
        6) stand in for experience you do not have yet. A résumé ideally fits on **one page** (two at most
        for a senior profile).
  - heading:
      fr: "Markdown ou JSON Resume ?"
      en: "Markdown or JSON Resume?"
    body:
      fr: |
        Pour un profil technique, deux formats sont particulièrement malins.

        Le **Markdown** se versionne dans Git, se relit facilement et s'exporte en PDF propre (via
        `pandoc` ou un thème). Vous gardez l'historique de votre CV comme du code.

        Le **JSON Resume** (`resume.json`) sépare les **données** de la **mise en forme** : vous écrivez un
        seul fichier JSON structuré, et des thèmes génèrent le rendu (HTML, PDF). C'est le CV « as code » :
        un même contenu, plusieurs présentations, sans copier-coller.

        > Conseil : gardez **une source de vérité** (souvent le `resume.json`) et générez le reste. Deux CV
        > divergents finissent toujours par se contredire.

        Les deux évitent les pièges de Word : polices qui sautent, mise en page cassée à l'ouverture chez
        le recruteur, et surtout le **format illisible par un ATS** (le logiciel qui trie les CV, voir la
        leçon suivante).
      en: |
        For a technical profile, two formats are particularly smart.

        **Markdown** versions in Git, reads easily and exports to a clean PDF (via `pandoc` or a theme).
        You keep your résumé's history like code.

        **JSON Resume** (`resume.json`) separates **data** from **presentation**: you write a single
        structured JSON file, and themes generate the output (HTML, PDF). It is the "résumé as code": one
        content, several presentations, no copy-paste.

        > Tip: keep **one source of truth** (often the `resume.json`) and generate the rest. Two diverging
        > résumés always end up contradicting each other.

        Both avoid Word's traps: fonts that shift, layout breaking when the recruiter opens it, and above
        all the **format an ATS cannot read** (the software that sorts résumés, see the next lesson).

examples:
  - title:
      fr: "Un CV DevSecOps complet en Markdown"
      en: "A complete DevSecOps résumé in Markdown"
    file: cv.md
    lang: markdown
    kind: neutral
    code: |
      # Jean Rakoto
      **DevSecOps Engineer** · Antananarivo (remote-friendly)
      jean.rakoto@example.com · github.com/example · linkedin.com/in/example

      ## Summary
      DevSecOps engineer who builds secure CI/CD pipelines and hardens cloud
      infrastructure. Shipped a zero-secret pipeline that cut critical
      vulnerabilities reaching production by 60%. Comfortable from Terraform to
      Kubernetes admission control.

      ## Skills
      - **CI/CD & SAST/DAST:** GitHub Actions, GitLab CI, Semgrep, Trivy, OWASP ZAP
      - **Cloud & IaC:** AWS, Terraform, OIDC, least-privilege IAM
      - **Containers & K8s:** Docker, Kubernetes, OPA Gatekeeper, Falco
      - **Languages:** Python, Bash, Go (basics), SQL

      ## Experience
      ### Security Automation Intern — Example Corp (2025)
      - Built a GitHub Actions pipeline with Gitleaks, Semgrep and Trivy that
        **blocked 40+ vulnerable merges** in three months.
      - Migrated CI auth from static keys to **OIDC**, removing 100% of long-lived
        AWS credentials from the org.

      ## Projects
      - **hardened-k8s-lab** (github.com/example): kind cluster with OPA Gatekeeper
        and Falco; validated with simulated attacks.
      - **devsecops-homelab-wazuh**: Wazuh SIEM detecting SSH brute force and SQLi
        with custom rules mapped to MITRE ATT&CK.

      ## Certifications & Education
      - CompTIA Security+ (in progress) · BSc Computer Science
    note:
      fr: "Remarquez la densité : un résumé avec un chiffre, des compétences groupées par thème, et des réalisations **chiffrées** (« 40+ merges bloqués », « 100 % des clés statiques retirées »). Les projets du module 6 servent de preuve concrète."
      en: "Notice the density: a summary with a number, skills grouped by theme, and **quantified** achievements (\"40+ merges blocked\", \"100% of static keys removed\"). The module-6 projects serve as concrete proof."

  - title:
      fr: "Le même CV en JSON Resume (resume.json)"
      en: "The same résumé in JSON Resume (resume.json)"
    file: resume.json
    lang: json
    kind: neutral
    code: |
      {
        "basics": {
          "name": "Jean Rakoto",
          "label": "DevSecOps Engineer",
          "email": "jean.rakoto@example.com",
          "url": "https://github.com/example",
          "summary": "DevSecOps engineer building secure CI/CD pipelines and hardening cloud infrastructure. Cut critical vulnerabilities reaching production by 60%.",
          "location": { "city": "Antananarivo", "countryCode": "MG" },
          "profiles": [
            { "network": "GitHub", "username": "example", "url": "https://github.com/example" },
            { "network": "LinkedIn", "username": "example", "url": "https://linkedin.com/in/example" }
          ]
        },
        "work": [
          {
            "name": "Example Corp",
            "position": "Security Automation Intern",
            "startDate": "2025-01",
            "endDate": "2025-09",
            "highlights": [
              "Built a GitHub Actions pipeline (Gitleaks, Semgrep, Trivy) that blocked 40+ vulnerable merges in three months",
              "Migrated CI auth from static keys to OIDC, removing 100% of long-lived AWS credentials"
            ]
          }
        ],
        "projects": [
          {
            "name": "hardened-k8s-lab",
            "description": "kind cluster with OPA Gatekeeper and Falco, validated with simulated attacks",
            "url": "https://github.com/example/hardened-k8s-lab"
          }
        ],
        "skills": [
          { "name": "CI/CD Security", "keywords": ["GitHub Actions", "Semgrep", "Trivy", "OWASP ZAP"] },
          { "name": "Cloud & IaC", "keywords": ["AWS", "Terraform", "OIDC", "IAM"] },
          { "name": "Containers", "keywords": ["Docker", "Kubernetes", "OPA", "Falco"] }
        ],
        "certificates": [
          { "name": "CompTIA Security+ (in progress)", "issuer": "CompTIA" }
        ]
      }
    note:
      fr: "Même contenu, format structuré. Un thème JSON Resume transforme ce fichier en CV HTML ou PDF. L'avantage : une seule **source de vérité**, versionnée dans Git, qui alimente plusieurs rendus sans recopie."
      en: "Same content, structured format. A JSON Resume theme turns this file into an HTML or PDF résumé. The benefit: a single **source of truth**, versioned in Git, feeding several outputs without re-typing."

  - title:
      fr: "Ligne faible vs ligne forte"
      en: "Weak bullet vs strong bullet"
    file: bullets.md
    lang: markdown
    kind: vulnerable
    code: |
      ## Weak (vague, task-focused, no proof)
      - Responsible for security of the CI/CD pipeline.
      - Worked on Docker and Kubernetes.
      - Helped improve the deployment process.
    note:
      fr: "Ces lignes décrivent des **tâches**, pas des **résultats**. « Responsable de » ne prouve rien : combien de failles évitées ? Quel impact ? Le recruteur ne peut pas vous distinguer des autres candidats."
      en: "These lines describe **tasks**, not **results**. \"Responsible for\" proves nothing: how many flaws avoided? What impact? The recruiter cannot tell you apart from other candidates."

  - title:
      fr: "La version forte, chiffrée et orientée résultat"
      en: "The strong, quantified, result-oriented version"
    file: bullets.md
    lang: markdown
    kind: secure
    code: |
      ## Strong (action verb + what + quantified result)
      - Added SAST and secret scanning to the CI/CD pipeline, blocking 40+
        vulnerable merges in three months.
      - Hardened Docker images (non-root, distroless), cutting image CVEs by 70%.
      - Automated OIDC deployment, removing 100% of static cloud credentials.
    note:
      fr: "La formule : **verbe d'action + ce que vous avez fait + résultat chiffré**. Même sans chiffre officiel, une estimation honnête (« ~70 % de CVE en moins ») vaut mille fois « travaillé sur Docker »."
      en: "The formula: **action verb + what you did + quantified result**. Even without an official figure, an honest estimate (\"~70% fewer CVEs\") beats \"worked on Docker\" a thousand times over."

mistake:
  fr: |
    **Lister des tâches au lieu de prouver des résultats.**

    « Responsable de la sécurité », « a travaillé sur Kubernetes », « a participé au pipeline » : ces
    formules ne disent rien de votre impact. Deux candidats peuvent écrire la même chose en ayant des
    niveaux radicalement différents. Chaque ligne d'expérience doit répondre à « **et alors, quel
    résultat ?** » — idéalement avec un chiffre, même estimé honnêtement. Sans preuve, votre CV ressemble
    à tous les autres.
  en: |
    **Listing tasks instead of proving results.**

    "Responsible for security", "worked on Kubernetes", "participated in the pipeline": these phrases say
    nothing about your impact. Two candidates can write the same thing while being at radically different
    levels. Every experience bullet must answer "**so what, what was the result?**" — ideally with a
    number, even an honestly estimated one. Without proof, your résumé looks like everyone else's.

bestPractice:
  fr: |
    - **Une page** pour un profil junior ou intermédiaire, deux maximum pour un senior.
    - **Un résumé d'accroche** de 3-4 lignes avec au moins un chiffre fort.
    - **Des réalisations chiffrées** : verbe d'action + action + résultat mesurable.
    - **Gardez une source de vérité** (Markdown ou `resume.json`) versionnée dans Git, et exportez en PDF.
    - **Mettez vos projets en avant** quand l'expérience manque : les projets du module 6 sont parfaits.
    - **Adaptez le CV à chaque offre** : réordonnez les compétences selon ce que l'annonce demande.
  en: |
    - **One page** for a junior or mid profile, two at most for a senior.
    - **A hook summary** of 3-4 lines with at least one strong number.
    - **Quantified achievements**: action verb + action + measurable result.
    - **Keep one source of truth** (Markdown or `resume.json`) versioned in Git, and export to PDF.
    - **Feature your projects** when experience is thin: the module-6 projects are perfect.
    - **Tailor the résumé to each offer**: reorder skills to match what the posting asks for.

exercise:
  statement:
    fr: |
      Voici une ligne d'expérience faible :

      > « Participé à la sécurisation des conteneurs Docker de l'entreprise. »

      Réécrivez-la en une ligne **forte** : un verbe d'action, ce que vous avez concrètement fait, et un
      résultat chiffré (vous pouvez inventer un chiffre plausible pour l'exercice).
    en: |
      Here is a weak experience bullet:

      > "Participated in securing the company's Docker containers."

      Rewrite it as a **strong** line: an action verb, what you concretely did, and a quantified result
      (you may invent a plausible figure for the exercise).
  solution:
    file: rewrite.md
    lang: markdown
    code: |
      - Hardened the company's Docker images (non-root user, dropped capabilities,
        multi-stage distroless builds) and added Trivy scanning in CI, reducing
        critical image CVEs from ~25 to under 5 per release (about 80% fewer).
    note:
      fr: "La ligne forte nomme **les techniques** (non-root, capabilities, distroless, Trivy) et donne un **résultat chiffré** (« ~80 % de CVE critiques en moins »). Elle prouve à la fois le savoir-faire et l'impact — exactement ce que cherche un recruteur."
      en: "The strong line names **the techniques** (non-root, capabilities, distroless, Trivy) and gives a **quantified result** (\"~80% fewer critical CVEs\"). It proves both the skill and the impact — exactly what a recruiter looks for."

quiz:
  - q:
      fr: "Quelle est la fonction du résumé d'accroche en haut du CV ?"
      en: "What is the purpose of the hook summary at the top of the résumé?"
    options:
      fr:
        - "Lister toutes vos certifications"
        - "Accrocher le recruteur en quelques secondes avec qui vous êtes et un chiffre fort"
        - "Décrire vos loisirs"
        - "Remplir la page pour qu'elle soit pleine"
      en:
        - "List all your certifications"
        - "Hook the recruiter in a few seconds with who you are and one strong number"
        - "Describe your hobbies"
        - "Fill the page so it looks complete"
    answer: 1
    why:
      fr: "Le recruteur décide en quelques secondes ; un résumé clair avec un chiffre marquant donne envie de lire la suite."
      en: "The recruiter decides in seconds; a clear summary with a striking number makes them want to read on."
  - q:
      fr: "Qu'est-ce qui distingue une ligne d'expérience forte d'une ligne faible ?"
      en: "What distinguishes a strong experience bullet from a weak one?"
    options:
      fr:
        - "Elle est plus longue"
        - "Elle utilise un vocabulaire compliqué"
        - "Elle combine un verbe d'action et un résultat chiffré, pas seulement une tâche"
        - "Elle mentionne le nom du manager"
      en:
        - "It is longer"
        - "It uses complicated vocabulary"
        - "It combines an action verb and a quantified result, not just a task"
        - "It mentions the manager's name"
    answer: 2
    why:
      fr: "« Verbe d'action + action + résultat mesurable » prouve l'impact ; « responsable de » ne dit rien."
      en: "\"Action verb + action + measurable result\" proves impact; \"responsible for\" says nothing."
  - q:
      fr: "Quel est l'avantage principal du format JSON Resume ?"
      en: "What is the main advantage of the JSON Resume format?"
    options:
      fr:
        - "Il sépare les données de la mise en forme : une source, plusieurs rendus"
        - "Il est plus coloré"
        - "Il est illisible par les ATS, ce qui protège vos données"
        - "Il interdit les fautes d'orthographe"
      en:
        - "It separates data from presentation: one source, several outputs"
        - "It is more colorful"
        - "It is unreadable by ATS, protecting your data"
        - "It forbids spelling mistakes"
    answer: 0
    why:
      fr: "`resume.json` est une source de vérité structurée ; des thèmes génèrent HTML ou PDF sans recopier le contenu."
      en: "`resume.json` is a structured source of truth; themes generate HTML or PDF without re-typing the content."
  - q:
      fr: "Pour un débutant sans expérience, que mettre en avant ?"
      en: "For a beginner with no experience, what should be featured?"
    options:
      fr:
        - "Une longue liste de loisirs"
        - "Des projets personnels concrets avec lien GitHub"
        - "Des phrases vagues sur la motivation"
        - "La liste de tous les cours suivis au collège"
      en:
        - "A long list of hobbies"
        - "Concrete personal projects with a GitHub link"
        - "Vague sentences about motivation"
        - "A list of every course taken in middle school"
    answer: 1
    why:
      fr: "Sans expérience, les projets prouvent les compétences. Les projets du module 6 (cluster durci, homelab Wazuh) remplissent ce rôle."
      en: "Without experience, projects prove skills. The module-6 projects (hardened cluster, Wazuh homelab) fill that role."
  - q:
      fr: "Quelle longueur viser pour un CV de profil junior ou intermédiaire ?"
      en: "What length should a junior or mid profile résumé aim for?"
    options:
      fr:
        - "Cinq pages détaillées"
        - "Une page, deux maximum"
        - "Une seule ligne"
        - "Autant de pages que d'années d'étude"
      en:
        - "Five detailed pages"
        - "One page, two at most"
        - "A single line"
        - "As many pages as years of study"
    answer: 1
    why:
      fr: "Un recruteur survole : une page dense et ciblée vaut mieux que plusieurs pages diluées."
      en: "A recruiter skims: one dense, targeted page beats several diluted ones."
