description:
  fr: "Rendre votre profil LinkedIn visible et crédible : un titre qui se trouve dans les recherches, une section À propos en français et en anglais, et une stratégie simple pour gagner en visibilité sans y passer ses journées."
  en: "Make your LinkedIn profile visible and credible: a headline that shows up in searches, an About section in French and English, and a simple strategy to gain visibility without spending all day on it."
duration: 20

intro:
  fr: |
    Beaucoup d'opportunités en DevSecOps ne passent pas par une annonce : un recruteur **cherche** sur
    LinkedIn des profils correspondant à un poste. Si votre profil ne contient pas les bons mots, il
    n'apparaît pas dans sa recherche — et vous n'existez pas pour cette opportunité.

    L'analogie : LinkedIn est un **moteur de recherche de personnes**. Comme pour le référencement d'un
    site, ce qui compte, c'est que les bons mots-clés soient aux bons endroits (titre, À propos,
    compétences), et qu'ils soient **vrais**.

    Votre profil doit faire deux choses : **être trouvé** (visibilité) et, une fois trouvé, **inspirer
    confiance** (crédibilité). Dans cette leçon : comment rédiger un **titre** qui sort dans les
    recherches, une section **À propos** convaincante en français et en anglais, et une routine légère
    pour rester visible. Pas besoin de devenir influenceur : la régularité et la clarté suffisent.
  en: |
    Many DevSecOps opportunities never come from a posting: a recruiter **searches** LinkedIn for profiles
    matching a role. If your profile does not contain the right words, it does not appear in their search —
    and you do not exist for that opportunity.

    The analogy: LinkedIn is a **search engine for people**. As with a website's SEO, what matters is that
    the right keywords are in the right places (headline, About, skills), and that they are **true**.

    Your profile must do two things: **be found** (visibility) and, once found, **inspire trust**
    (credibility). In this lesson: how to write a **headline** that surfaces in searches, a convincing
    **About** section in French and English, and a light routine to stay visible. No need to become an
    influencer: consistency and clarity are enough.

sections:
  - heading:
      fr: "Le titre : votre mot-clé le plus important"
      en: "The headline: your most important keyword"
    body:
      fr: |
        Le **titre** (sous votre nom) est le champ le plus lu et le plus pesé dans les recherches. Par
        défaut, LinkedIn y met votre poste actuel — souvent trop vague. Reprenez-le en main.

        Une bonne formule : **rôle + spécialités + éventuellement une valeur**. Par exemple :
        « DevSecOps Engineer | CI/CD Security, Kubernetes, Cloud | I build secure pipelines ».

        | Titre faible | Titre fort |
        |---|---|
        | « Étudiant » | « Aspiring DevSecOps Engineer | CI/CD Security, Docker, Terraform » |
        | « À la recherche d'un emploi » | « DevSecOps | Kubernetes & Pipeline Security | Open to work » |
        | « Ingénieur » | « Security Engineer | AppSec, OWASP, SAST/DAST | Python & Go » |

        Mettez-y les **mots que les recruteurs tapent** : « DevSecOps », « Kubernetes », « CI/CD »,
        « Cloud Security ». Restez honnête : « Aspiring » ou « Junior » est parfaitement acceptable et
        évite les malentendus.
      en: |
        The **headline** (under your name) is the most read field and the most weighted in searches. By
        default LinkedIn puts your current job title there — often too vague. Take control of it.

        A good formula: **role + specialties + optionally a value**. For example: "DevSecOps Engineer |
        CI/CD Security, Kubernetes, Cloud | I build secure pipelines".

        | Weak headline | Strong headline |
        |---|---|
        | "Student" | "Aspiring DevSecOps Engineer | CI/CD Security, Docker, Terraform" |
        | "Looking for a job" | "DevSecOps | Kubernetes & Pipeline Security | Open to work" |
        | "Engineer" | "Security Engineer | AppSec, OWASP, SAST/DAST | Python & Go" |

        Put in it the **words recruiters type**: "DevSecOps", "Kubernetes", "CI/CD", "Cloud Security". Stay
        honest: "Aspiring" or "Junior" is perfectly fine and avoids misunderstandings.
  - heading:
      fr: "À propos, compétences et visibilité"
      en: "About, skills and visibility"
    body:
      fr: |
        La section **À propos** est votre pitch. Trois à cinq phrases à la première personne : qui vous
        êtes, ce que vous savez faire, une preuve (projet, chiffre), et ce que vous cherchez. Ajoutez
        quelques mots-clés naturellement, et un appel à l'action (« n'hésitez pas à me contacter »).

        La section **Compétences** est aussi indexée : ajoutez vos vraies compétences (Docker, Kubernetes,
        Terraform…), car les recherches de recruteurs s'appuient dessus.

        Pour la **visibilité**, pas besoin d'y vivre. Une routine légère et régulière :

        - **Complétez le profil à 100 %** (photo nette, titre, À propos, expériences, compétences).
        - **Publiez de temps en temps** : partagez un projet, une leçon apprise, un article utile.
          Montrer qu'on apprend vaut mieux que se taire.
        - **Interagissez** : commenter un post pertinent vous rend visible sans rien publier.
        - **Activez « Open to work »** (visible des recruteurs) quand vous cherchez.

        > La régularité bat l'intensité : un post par mois tenu sur un an vaut mieux que dix posts en une
        > semaine puis le silence.
      en: |
        The **About** section is your pitch. Three to five first-person sentences: who you are, what you can
        do, a proof (project, number), and what you are looking for. Add a few keywords naturally, and a
        call to action ("feel free to reach out").

        The **Skills** section is indexed too: add your real skills (Docker, Kubernetes, Terraform…),
        because recruiter searches rely on them.

        For **visibility**, you do not need to live there. A light, regular routine:

        - **Complete the profile to 100%** (clear photo, headline, About, experience, skills).
        - **Post occasionally**: share a project, a lesson learned, a useful article. Showing you learn
          beats staying silent.
        - **Engage**: commenting on a relevant post makes you visible without posting anything.
        - **Turn on "Open to work"** (visible to recruiters) when you are searching.

        > Consistency beats intensity: one post a month sustained over a year beats ten posts in one week
        > then silence.

examples:
  - title:
      fr: "Titre LinkedIn : faible vs fort"
      en: "LinkedIn headline: weak vs strong"
    file: headline.md
    lang: markdown
    kind: vulnerable
    code: |
      ## Weak headlines (vague, no keywords, invisible in search)
      - "Student"
      - "Looking for opportunities"
      - "IT enthusiast"

      ## Strong headlines (role + specialties + honest level)
      - "Aspiring DevSecOps Engineer | CI/CD Security, Docker, Kubernetes | Python & Bash"
      - "DevSecOps | Pipeline Security, Terraform, AWS | Open to work (remote)"
      - "Junior Security Engineer | OWASP, SAST/DAST, Trivy | Learning in public"
    note:
      fr: "« Student » n'apparaît dans aucune recherche de recruteur. Les versions fortes contiennent les mots tapés (« DevSecOps », « Kubernetes », « CI/CD ») tout en restant honnêtes sur le niveau (« Aspiring », « Junior »)."
      en: "\"Student\" shows up in no recruiter search. The strong versions contain the typed words (\"DevSecOps\", \"Kubernetes\", \"CI/CD\") while staying honest about the level (\"Aspiring\", \"Junior\")."

  - title:
      fr: "Section À propos (anglais)"
      en: "About section (English)"
    file: about-en.md
    lang: markdown
    kind: secure
    code: |
      I'm a DevSecOps engineer focused on building secure CI/CD pipelines and
      hardening cloud and Kubernetes infrastructure. I enjoy turning security from a
      blocker into an automated, invisible part of shipping software.

      Recently I built a hardened Kubernetes cluster (OPA Gatekeeper + Falco) and a
      zero-secret CI/CD pipeline that blocked 40+ vulnerable merges in a quarter. I
      work mostly with GitHub Actions, Terraform, Docker, Trivy and Python.

      I'm currently open to junior/mid DevSecOps roles, remote-friendly. Feel free to
      reach out — I'm always happy to talk pipelines, Kubernetes security or homelabs.
    note:
      fr: "Trois paragraphes : qui vous êtes, une preuve chiffrée avec des outils nommés, ce que vous cherchez + un appel à l'action. Les mots-clés (DevSecOps, Kubernetes, Terraform…) sont placés naturellement, pas entassés."
      en: "Three paragraphs: who you are, a quantified proof with named tools, what you seek + a call to action. The keywords (DevSecOps, Kubernetes, Terraform…) are placed naturally, not piled up."

  - title:
      fr: "Section À propos (français)"
      en: "About section (French)"
    file: about-fr.md
    lang: markdown
    kind: secure
    code: |
      Ingénieur DevSecOps, je construis des pipelines CI/CD sécurisés et je durcis
      les infrastructures cloud et Kubernetes. Mon objectif : faire de la sécurité
      une étape automatisée et invisible de la livraison, plutôt qu'un frein.

      J'ai récemment monté un cluster Kubernetes durci (OPA Gatekeeper + Falco) et un
      pipeline CI/CD sans secret qui a bloqué plus de 40 fusions vulnérables en un
      trimestre. Je travaille surtout avec GitHub Actions, Terraform, Docker, Trivy
      et Python.

      Je suis ouvert à des postes DevSecOps junior/confirmé, en remote ou à
      Antananarivo. N'hésitez pas à me contacter : je parle volontiers pipelines,
      sécurité Kubernetes et homelabs.
    note:
      fr: "La version française suit la même structure et les mêmes preuves. Garder les deux à jour permet d'être trouvé par des recruteurs locaux (français) comme internationaux (anglais)."
      en: "The French version follows the same structure and the same proofs. Keeping both up to date lets you be found by local recruiters (French) and international ones (English)."

  - title:
      fr: "Une routine de visibilité légère"
      en: "A light visibility routine"
    file: visibility-plan.md
    lang: markdown
    kind: neutral
    code: |
      ## A sustainable weekly routine (about 30 min/week)

      ### Once, to set up
      - [ ] 100% complete profile: clear photo, strong headline, About (FR + EN)
      - [ ] Add real skills (Docker, Kubernetes, Terraform, Python...)
      - [ ] Link your GitHub and pin your best projects there

      ### Every week (pick one or two)
      - [ ] Comment thoughtfully on 2-3 relevant posts
      - [ ] Connect with 3-5 people you actually interacted with
      - [ ] Draft one short post idea (a lesson learned, a project update)

      ### Every month
      - [ ] Publish one post: a finished project, a "what I learned" write-up
      - [ ] Update the headline/About if your focus changed

      ### When job searching
      - [ ] Turn on "Open to work" (recruiters-only visibility)
    note:
      fr: "Une checklist, pas une obsession : 30 minutes par semaine suffisent. Commenter régulièrement vous rend visible sans créer de contenu. L'important est la **constance**, pas le volume."
      en: "A checklist, not an obsession: 30 minutes a week is enough. Commenting regularly makes you visible without creating content. What matters is **consistency**, not volume."

mistake:
  fr: |
    **Laisser le titre par défaut « Étudiant » ou « À la recherche d'un emploi ».**

    Ces titres ne contiennent aucun mot-clé métier : vous êtes invisible quand un recruteur cherche
    « DevSecOps » ou « Kubernetes ». Pire, « À la recherche d'un emploi » envoie un signal passif. Un
    titre comme « Aspiring DevSecOps Engineer | CI/CD Security, Docker, Kubernetes » vous rend trouvable
    **et** précis, tout en restant honnête sur votre niveau. Reprenez toujours la main sur ce champ.
  en: |
    **Leaving the default headline "Student" or "Looking for a job".**

    These headlines contain no professional keyword: you are invisible when a recruiter searches for
    "DevSecOps" or "Kubernetes". Worse, "Looking for a job" sends a passive signal. A headline like
    "Aspiring DevSecOps Engineer | CI/CD Security, Docker, Kubernetes" makes you findable **and** specific,
    while staying honest about your level. Always take control of this field.

bestPractice:
  fr: |
    - **Réécrivez votre titre** : rôle + spécialités + niveau honnête, avec les mots que tapent les recruteurs.
    - **Rédigez un À propos** en FR et EN : qui vous êtes, une preuve chiffrée, ce que vous cherchez, un appel à l'action.
    - **Renseignez vos vraies compétences** : elles alimentent les recherches de recruteurs.
    - **Complétez le profil à 100 %** et liez votre GitHub.
    - **Soyez régulier, pas intense** : commenter et publier un peu, mais durablement.
    - **Activez « Open to work »** quand vous cherchez, en visibilité recruteurs.
  en: |
    - **Rewrite your headline**: role + specialties + honest level, with the words recruiters type.
    - **Write an About** in FR and EN: who you are, a quantified proof, what you seek, a call to action.
    - **Fill in your real skills**: they feed recruiter searches.
    - **Complete the profile to 100%** and link your GitHub.
    - **Be consistent, not intense**: comment and post a little, but sustainably.
    - **Turn on "Open to work"** when searching, with recruiter-only visibility.

exercise:
  statement:
    fr: |
      Votre titre LinkedIn actuel est « Étudiant en informatique ». Vous visez un poste DevSecOps junior,
      vous maîtrisez Docker, les bases de Kubernetes, GitHub Actions et Python, et vous êtes ouvert au
      remote.

      Écrivez un **nouveau titre** honnête et optimisé pour la recherche, puis une **première phrase** de
      section À propos.
    en: |
      Your current LinkedIn headline is "Computer Science Student". You target a junior DevSecOps role, you
      know Docker, Kubernetes basics, GitHub Actions and Python, and you are open to remote.

      Write a **new headline** that is honest and search-optimized, then a **first sentence** of an About
      section.
  solution:
    file: linkedin-fix.md
    lang: markdown
    code: |
      # New headline (role + specialties + honest level + availability)
      Aspiring DevSecOps Engineer | CI/CD Security, Docker, Kubernetes, Python |
      Open to junior roles (remote-friendly)

      # First About sentence (who + focus + a hint of proof)
      I'm an early-career DevSecOps engineer who automates security into CI/CD
      pipelines and hardens containers — I learn by building and documenting homelab
      projects (a hardened Kubernetes cluster, a zero-secret pipeline).
    note:
      fr: "Le titre contient les mots recherchés (DevSecOps, Docker, Kubernetes, Python) et reste honnête (« Aspiring », « junior »). La première phrase situe le niveau et annonce la preuve (projets de homelab), donnant envie de lire la suite."
      en: "The headline contains the searched words (DevSecOps, Docker, Kubernetes, Python) and stays honest (\"Aspiring\", \"junior\"). The first sentence places the level and hints at proof (homelab projects), making people want to read on."

quiz:
  - q:
      fr: "Pourquoi le titre LinkedIn est-il si important ?"
      en: "Why is the LinkedIn headline so important?"
    options:
      fr:
        - "Parce qu'il change la couleur du profil"
        - "Parce que c'est un champ très pesé dans les recherches des recruteurs"
        - "Parce qu'il est obligatoire pour s'inscrire"
        - "Parce qu'il affiche votre salaire"
      en:
        - "Because it changes the profile color"
        - "Because it is heavily weighted in recruiter searches"
        - "Because it is required to sign up"
        - "Because it shows your salary"
    answer: 1
    why:
      fr: "Le titre est l'un des champs les plus indexés : sans les bons mots, vous n'apparaissez pas dans les recherches."
      en: "The headline is one of the most indexed fields: without the right words, you do not appear in searches."
  - q:
      fr: "Que doit contenir un bon titre DevSecOps ?"
      en: "What should a good DevSecOps headline contain?"
    options:
      fr:
        - "Uniquement votre nom"
        - "Un rôle, des spécialités et un niveau honnête, avec des mots-clés recherchés"
        - "Une citation inspirante"
        - "La liste de tous vos diplômes"
      en:
        - "Only your name"
        - "A role, specialties and an honest level, with searched keywords"
        - "An inspiring quote"
        - "The list of all your degrees"
    answer: 1
    why:
      fr: "« Rôle + spécialités + niveau » avec des mots comme DevSecOps ou Kubernetes rend trouvable et clair."
      en: "\"Role + specialties + level\" with words like DevSecOps or Kubernetes makes you findable and clear."
  - q:
      fr: "Quelle approche de visibilité est la plus efficace sur la durée ?"
      en: "Which visibility approach is most effective over time?"
    options:
      fr:
        - "Publier dix posts en une semaine puis s'arrêter"
        - "Une activité légère mais régulière (commenter, publier un peu, constamment)"
        - "Ne jamais interagir"
        - "Acheter des abonnés"
      en:
        - "Posting ten posts in one week then stopping"
        - "Light but consistent activity (commenting, posting a little, constantly)"
        - "Never engaging"
        - "Buying followers"
    answer: 1
    why:
      fr: "La régularité bat l'intensité : une présence modeste et constante construit la visibilité dans la durée."
      en: "Consistency beats intensity: a modest, steady presence builds visibility over time."
  - q:
      fr: "Pourquoi renseigner la section Compétences ?"
      en: "Why fill in the Skills section?"
    options:
      fr:
        - "Pour décorer le profil"
        - "Parce qu'elle est indexée et alimente les recherches des recruteurs"
        - "Parce qu'elle remplace le CV"
        - "Parce qu'elle est payante"
      en:
        - "To decorate the profile"
        - "Because it is indexed and feeds recruiter searches"
        - "Because it replaces the résumé"
        - "Because it is paid"
    answer: 1
    why:
      fr: "Les compétences déclarées sont utilisées par les recherches de recruteurs ; il faut y mettre ses vraies compétences."
      en: "Declared skills are used by recruiter searches; you should list your real ones."
  - q:
      fr: "Que faut-il garder à l'esprit en optimisant son profil pour la recherche ?"
      en: "What must you keep in mind when optimizing your profile for search?"
    options:
      fr:
        - "Rester honnête : le niveau (« Aspiring », « Junior ») doit refléter la réalité"
        - "Mettre un maximum de titres, même faux"
        - "Cacher ses projets"
        - "Supprimer l'À propos"
      en:
        - "Stay honest: the level (\"Aspiring\", \"Junior\") must reflect reality"
        - "Add as many titles as possible, even false ones"
        - "Hide your projects"
        - "Remove the About section"
    answer: 0
    why:
      fr: "On optimise avec de vrais mots-clés et un niveau honnête : un titre mensonger se paie à l'entretien."
      en: "You optimize with true keywords and an honest level: a false headline is paid for in the interview."
