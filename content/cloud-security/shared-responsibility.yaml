description:
  fr: "Comprendre le modèle de responsabilité partagée : ce que le fournisseur cloud sécurise, et ce qui reste toujours à votre charge en IaaS, PaaS et SaaS."
  en: "Understand the shared responsibility model: what the cloud provider secures and what always remains your job in IaaS, PaaS and SaaS."
duration: 20

intro:
  fr: |
    Passer dans le **cloud** ne veut pas dire « confier sa sécurité à Amazon, Microsoft ou Google ».
    Chaque fournisseur publie un **modèle de responsabilité partagée** : il sécurise *le* cloud
    (bâtiments, serveurs, hyperviseur), vous sécurisez ce que vous mettez *dans* le cloud
    (données, comptes, configuration).

    Pensez à la location d'un appartement. Le propriétaire répond de la solidité de l'immeuble, de la porte
    du hall et de l'ascenseur. Mais si vous laissez la porte de votre appartement ouverte ou si vous
    distribuez des doubles de vos clés, le cambriolage est de **votre** responsabilité.

    Dans cette leçon, vous allez apprendre à tracer cette frontière pour les trois modèles de service -
    **IaaS** (*Infrastructure as a Service*), **PaaS** (*Platform as a Service*) et **SaaS**
    (*Software as a Service*) - et à vérifier votre part du contrat avec de vraies commandes.
  en: |
    Moving to the **cloud** does not mean "handing your security over to Amazon, Microsoft or Google".
    Every provider publishes a **shared responsibility model**: the provider secures the cloud *itself*
    (buildings, servers, hypervisor), you secure what you put *in* the cloud (data, accounts,
    configuration).

    Think of renting a flat. The landlord answers for the strength of the building, the lobby door and
    the lift. But if you leave your own front door open or hand out copies of your keys, the burglary is
    **your** responsibility.

    In this lesson you will learn to draw that line for the three service models - **IaaS**
    (*Infrastructure as a Service*), **PaaS** (*Platform as a Service*) and **SaaS** (*Software as a
    Service*) - and to check your side of the contract with real commands.

sections:
  - heading:
      fr: "Qui sécurise quoi ?"
      en: "Who secures what?"
    body:
      fr: |
        Plus le service est « managé », plus le fournisseur prend de couches à sa charge. Mais deux lignes
        ne changent **jamais** de colonne : vos données et vos identités.

        | Couche | Sur site | IaaS (EC2, VM Azure, Compute Engine) | PaaS (RDS, App Service, Cloud Run) | SaaS (Microsoft 365, Salesforce) |
        |---|---|---|---|---|
        | Données et classification | Vous | Vous | Vous | Vous |
        | Identités, accès, MFA | Vous | Vous | Vous | Vous |
        | Application et code | Vous | Vous | Vous | Fournisseur |
        | Runtime, middleware | Vous | Vous | Fournisseur | Fournisseur |
        | Système d'exploitation, correctifs | Vous | Vous | Fournisseur | Fournisseur |
        | Virtualisation, hyperviseur | Vous | Fournisseur | Fournisseur | Fournisseur |
        | Réseau physique, serveurs, bâtiments | Vous | Fournisseur | Fournisseur | Fournisseur |

        AWS résume cela par deux expressions : le fournisseur assure la sécurité **du** cloud
        (*security of the cloud*), le client assure la sécurité **dans** le cloud (*security in the cloud*).
        En PaaS et en SaaS, certaines responsabilités sont réellement **partagées** : le fournisseur
        fournit le chiffrement, le pare-feu ou la journalisation, mais c'est vous qui les **activez et les
        configurez**.
      en: |
        The more "managed" a service is, the more layers the provider takes over. But two rows **never**
        change column: your data and your identities.

        | Layer | On-premises | IaaS (EC2, Azure VM, Compute Engine) | PaaS (RDS, App Service, Cloud Run) | SaaS (Microsoft 365, Salesforce) |
        |---|---|---|---|---|
        | Data and classification | You | You | You | You |
        | Identities, access, MFA | You | You | You | You |
        | Application and code | You | You | You | Provider |
        | Runtime, middleware | You | You | Provider | Provider |
        | Operating system, patching | You | You | Provider | Provider |
        | Virtualisation, hypervisor | You | Provider | Provider | Provider |
        | Physical network, servers, buildings | You | Provider | Provider | Provider |

        AWS sums it up in two phrases: the provider handles security **of** the cloud, the customer handles
        security **in** the cloud. In PaaS and SaaS some responsibilities are truly **shared**: the
        provider supplies encryption, firewalling or logging, but you are the one who **turns them on and
        configures them**.
  - heading:
      fr: "Pourquoi presque tous les incidents viennent du côté client"
      en: "Why almost every incident comes from the customer side"
    body:
      fr: |
        Les grands fournisseurs sont rarement compromis au niveau des datacenters ou de l'hyperviseur. Les
        fuites de données que l'on lit dans la presse ont presque toujours la même origine : une **erreur de
        configuration du client**.

        - un bucket de stockage rendu **public** « pour tester » ;
        - une clé d'accès longue durée publiée dans un dépôt Git ;
        - un port d'administration (SSH 22, RDP 3389, base de données) ouvert à `0.0.0.0/0` ;
        - un compte administrateur sans **MFA** (*Multi-Factor Authentication*, authentification multifacteur) ;
        - des journaux d'audit jamais activés : personne ne voit l'attaque.

        Le fournisseur ne vous empêchera pas de faire ces choix : ses API obéissent. Les valeurs par défaut
        se sont durcies au fil des ans (par exemple, les nouveaux buckets S3 bloquent l'accès public), mais
        une ligne de configuration suffit à les annuler. Votre défense repose donc sur trois réflexes :
        **décrire l'infrastructure en code**, **contrôler ce code avant le déploiement**, et **auditer en
        continu** ce qui tourne réellement.
      en: |
        The major providers are rarely breached at the data-centre or hypervisor level. The data leaks you
        read about in the press almost always share the same origin: a **customer misconfiguration**.

        - a storage bucket made **public** "just to test";
        - a long-lived access key pushed to a Git repository;
        - an admin port (SSH 22, RDP 3389, a database) open to `0.0.0.0/0`;
        - an administrator account without **MFA** (*Multi-Factor Authentication*);
        - audit logs never enabled: nobody sees the attack.

        The provider will not stop you from making these choices: its APIs simply obey. Defaults have
        hardened over the years (new S3 buckets block public access, for instance), but one line of
        configuration is enough to undo them. Your defence therefore rests on three habits: **describe the
        infrastructure as code**, **check that code before deployment**, and **continuously audit** what
        is actually running.
  - heading:
      fr: "Votre part du contrat, en six domaines"
      en: "Your side of the contract, in six domains"
    body:
      fr: |
        Quel que soit le fournisseur, votre part se range toujours dans les mêmes tiroirs. Le reste de ce
        cours les reprend un par un sur AWS, Azure et GCP.

        | Domaine | Question à se poser | Service type |
        |---|---|---|
        | Identité | Qui peut faire quoi ? MFA partout ? | IAM, Entra ID |
        | Données | Chiffrées au repos et en transit ? Publiques ? | KMS, Key Vault |
        | Réseau | Quels ports sont joignables depuis Internet ? | Security Groups, NSG, pare-feu VPC |
        | Journalisation | Peut-on reconstituer qui a fait quoi ? | CloudTrail, Activity Log, Cloud Audit Logs |
        | Détection | Qui est alerté en cas de comportement anormal ? | GuardDuty, Defender for Cloud, SCC |
        | Conformité | Mesure-t-on l'écart à un référentiel ? | CIS Benchmarks, CSPM |
      en: |
        Whatever the provider, your side always falls into the same drawers. The rest of this course goes
        through them one by one on AWS, Azure and GCP.

        | Domain | Question to ask | Typical service |
        |---|---|---|
        | Identity | Who can do what? MFA everywhere? | IAM, Entra ID |
        | Data | Encrypted at rest and in transit? Public? | KMS, Key Vault |
        | Network | Which ports are reachable from the Internet? | Security Groups, NSGs, VPC firewall |
        | Logging | Can we reconstruct who did what? | CloudTrail, Activity Log, Cloud Audit Logs |
        | Detection | Who is alerted on abnormal behaviour? | GuardDuty, Defender for Cloud, SCC |
        | Compliance | Do we measure the gap to a baseline? | CIS Benchmarks, CSPM |

examples:
  - title:
      fr: "La matrice de responsabilité, en code"
      en: "The responsibility matrix, as code"
    file: responsibility.py
    lang: python
    kind: neutral
    code: |
      # Who secures what? "you" = the customer, "provider" = AWS / Azure / GCP
      LAYERS = [
          "data", "identities", "application", "runtime",
          "operating system", "virtualization", "physical datacenter",
      ]

      # Index of the first layer managed by the provider, for each service model
      FIRST_PROVIDER_LAYER = {"on-prem": 7, "iaas": 5, "paas": 3, "saas": 2}


      def owner(model, layer):
          return "provider" if LAYERS.index(layer) >= FIRST_PROVIDER_LAYER[model] else "you"


      print(f"{'layer':<20}{'on-prem':<10}{'iaas':<10}{'paas':<10}saas")
      for layer in LAYERS:
          row = "".join(f"{owner(m, layer):<10}" for m in FIRST_PROVIDER_LAYER)
          print(f"{layer:<20}{row}".rstrip())

      # Data and identities never move to the provider column
      always_yours = [l for l in LAYERS if all(owner(m, l) == "you" for m in FIRST_PROVIDER_LAYER)]
      print("\nAlways your job:", ", ".join(always_yours))
    output: |
      layer               on-prem   iaas      paas      saas
      data                you       you       you       you
      identities          you       you       you       you
      application         you       you       you       provider
      runtime             you       you       provider  provider
      operating system    you       you       provider  provider
      virtualization      you       provider  provider  provider
      physical datacenter you       provider  provider  provider

      Always your job: data, identities
    note:
      fr: "Lancez le script : la colonne « provider » grandit de l'IaaS vers le SaaS, mais les deux premières lignes restent à « you » dans tous les modèles. C'est le cœur du modèle de responsabilité partagée."
      en: "Run the script: the \"provider\" column grows from IaaS to SaaS, but the first two rows stay on \"you\" in every model. That is the heart of the shared responsibility model."

  - title:
      fr: "Côté client mal tenu : un bucket public et un SSH ouvert au monde"
      en: "Customer side neglected: a public bucket and SSH open to the world"
    file: main.tf
    lang: hcl
    kind: vulnerable
    code: |
      # The provider's infrastructure is perfectly secure here.
      # Every problem below is a customer-side configuration choice.

      resource "aws_s3_bucket" "exports" {
        bucket = "acme-customer-exports"
      }

      # Problem 1: the four "Block Public Access" guards are switched off
      resource "aws_s3_bucket_public_access_block" "exports" {
        bucket                  = aws_s3_bucket.exports.id
        block_public_acls       = false
        ignore_public_acls      = false
        block_public_policy     = false
        restrict_public_buckets = false
      }

      # Problem 2: anyone on the Internet ("*") can download every object
      resource "aws_s3_bucket_policy" "exports" {
        bucket     = aws_s3_bucket.exports.id
        depends_on = [aws_s3_bucket_public_access_block.exports]
        policy = jsonencode({
          Version = "2012-10-17"
          Statement = [{
            Effect    = "Allow"
            Principal = "*"
            Action    = "s3:GetObject"
            Resource  = "${aws_s3_bucket.exports.arn}/*"
          }]
        })
      }

      # Problem 3: SSH reachable from the whole Internet
      resource "aws_security_group" "admin" {
        name   = "admin"
        vpc_id = var.vpc_id

        ingress {
          from_port   = 22
          to_port     = 22
          protocol    = "tcp"
          cidr_blocks = ["0.0.0.0/0"]
        }
      }

      variable "vpc_id" {
        type = string
      }
    note:
      fr: "AWS exécute cette configuration sans broncher : rien n'est « cassé » du côté du fournisseur. Les exports clients sont téléchargeables par n'importe qui et le port SSH reçoit des tentatives de connexion en quelques minutes."
      en: "AWS applies this configuration without complaint: nothing is \"broken\" on the provider side. Customer exports can be downloaded by anyone and the SSH port starts receiving login attempts within minutes."

  - title:
      fr: "Côté client bien tenu : privé, chiffré, sans port d'administration exposé"
      en: "Customer side done right: private, encrypted, no exposed admin port"
    file: main.tf
    lang: hcl
    kind: secure
    code: |
      resource "aws_s3_bucket" "exports" {
        bucket = "acme-customer-exports"
      }

      # Fix 1: all four guards on - public ACLs and public policies are refused
      resource "aws_s3_bucket_public_access_block" "exports" {
        bucket                  = aws_s3_bucket.exports.id
        block_public_acls       = true
        ignore_public_acls      = true
        block_public_policy     = true
        restrict_public_buckets = true
      }

      # Fix 2: data encrypted at rest with a KMS key (your data, your responsibility)
      resource "aws_s3_bucket_server_side_encryption_configuration" "exports" {
        bucket = aws_s3_bucket.exports.id

        rule {
          apply_server_side_encryption_by_default {
            sse_algorithm = "aws:kms"
          }
          bucket_key_enabled = true
        }
      }

      # Fix 3: no inbound rule at all - administration goes through
      # AWS Systems Manager Session Manager, which needs no open port
      resource "aws_security_group" "app" {
        name   = "app"
        vpc_id = var.vpc_id

        egress {
          description = "HTTPS out, to reach AWS APIs and package mirrors"
          from_port   = 443
          to_port     = 443
          protocol    = "tcp"
          cidr_blocks = ["0.0.0.0/0"]
        }
      }

      variable "vpc_id" {
        type = string
      }
    note:
      fr: "Même infrastructure, mais votre part du contrat est remplie : accès public bloqué, chiffrement au repos activé, et plus aucun port d'administration joignable depuis Internet."
      en: "Same infrastructure, but your side of the contract is fulfilled: public access blocked, encryption at rest enabled, and no admin port reachable from the Internet any more."

  - title:
      fr: "Vérifier sa part : cinq contrôles en ligne de commande"
      en: "Checking your side: five command-line checks"
    file: check-my-side.sh
    lang: bash
    kind: neutral
    code: |
      #!/usr/bin/env bash
      # Read-only checks: run them with an audit role, on an account you are authorised to assess.
      set -euo pipefail

      # 1. Identity: does the root account have MFA, and no access key?
      aws iam get-account-summary \
        --query 'SummaryMap.{RootMFA:AccountMFAEnabled,RootAccessKeys:AccountAccessKeysPresent}'

      # 2. Data: is public access blocked for the whole account?
      ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      aws s3control get-public-access-block --account-id "$ACCOUNT_ID"

      # 3. Network: which security groups expose SSH to the whole Internet?
      aws ec2 describe-security-groups \
        --filters Name=ip-permission.from-port,Values=22 Name=ip-permission.cidr,Values=0.0.0.0/0 \
        --query 'SecurityGroups[].[GroupId,GroupName]' --output text

      # 4. Logging: is there a multi-region audit trail?
      aws cloudtrail describe-trails --query 'trailList[].{Name:Name,MultiRegion:IsMultiRegionTrail}'

      # 5. Detection: is GuardDuty enabled in this region?
      aws guardduty list-detectors --query 'DetectorIds'
    output: |
      {
          "RootMFA": 1,
          "RootAccessKeys": 0
      }
      {
          "PublicAccessBlockConfiguration": {
              "BlockPublicAcls": true,
              "IgnorePublicAcls": true,
              "BlockPublicPolicy": true,
              "RestrictPublicBuckets": true
          }
      }
      [
          {
              "Name": "org-trail",
              "MultiRegion": true
          }
      ]
      [
          "12abc34d567e8fa901bc2d34e56789f0"
      ]
    note:
      fr: "Sortie d'un compte sain : MFA sur le compte racine, aucun groupe de sécurité listé pour le port 22 (la commande 3 n'affiche rien), un journal multi-région et un détecteur GuardDuty. Chaque ligne correspond à un domaine du tableau « votre part du contrat »."
      en: "Output of a healthy account: MFA on the root account, no security group listed for port 22 (command 3 prints nothing), a multi-region trail and a GuardDuty detector. Each line maps to a domain of the \"your side of the contract\" table."

mistake:
  fr: |
    **Croire qu'un service managé est sécurisé « par défaut et pour toujours ».**

    « C'est du PaaS, donc AWS s'en occupe » est la phrase qui précède beaucoup d'incidents. Une base RDS
    est bien patchée par le fournisseur, mais c'est vous qui décidez si elle est accessible depuis Internet,
    si son stockage est chiffré, qui possède le mot de passe administrateur et si les sauvegardes sont
    conservées. Le fournisseur fournit les **serrures** ; il ne vérifie pas que vous les avez fermées.
  en: |
    **Believing that a managed service is secure "by default and forever".**

    "It is PaaS, so AWS takes care of it" is the sentence that precedes many incidents. An RDS database is
    indeed patched by the provider, but you decide whether it is reachable from the Internet, whether its
    storage is encrypted, who holds the admin password and whether backups are kept. The provider supplies
    the **locks**; it does not check that you turned the key.

bestPractice:
  fr: |
    - **Écrivez la frontière noir sur blanc** : pour chaque service utilisé, notez ce que fait le fournisseur
      et ce que fait votre équipe (une matrice RACI d'une page suffit).
    - **Infrastructure as Code partout** : une configuration décrite dans Git peut être relue, scannée
      (Checkov, Trivy) et auditée ; un clic dans la console ne laisse aucune trace de revue.
    - **Garde-fous au niveau du compte** : activez le blocage d'accès public et les politiques
      d'organisation, pour qu'une erreur isolée ne suffise pas à exposer des données.
    - **Journalisez dès le premier jour** : sans journal d'audit, impossible de prouver ce qui s'est passé.
    - **Mesurez en continu** avec un outil de CSPM (*Cloud Security Posture Management*), vu en fin de cours.
  en: |
    - **Write the boundary down**: for every service you use, note what the provider does and what your
      team does (a one-page RACI matrix is enough).
    - **Infrastructure as Code everywhere**: a configuration stored in Git can be reviewed, scanned
      (Checkov, Trivy) and audited; a click in the console leaves no review trail.
    - **Account-level guardrails**: enable public access blocking and organisation policies so that a
      single mistake is not enough to expose data.
    - **Log from day one**: without an audit log you cannot prove what happened.
    - **Measure continuously** with a CSPM (*Cloud Security Posture Management*) tool, covered at the end
      of this course.

exercise:
  statement:
    fr: |
      Une équipe héberge une boutique en ligne ainsi :

      - le site tourne sur des machines virtuelles **EC2** (IaaS) ;
      - la base de données est un **RDS PostgreSQL** (PaaS) ;
      - la messagerie de l'entreprise est **Microsoft 365** (SaaS).

      Pour chacun des six évènements suivants, indiquez **qui est responsable** (client ou fournisseur) :

      1. Une faille du noyau Linux n'est pas corrigée sur les machines EC2.
      2. Une faille du moteur PostgreSQL n'est pas corrigée sur RDS.
      3. La base RDS accepte les connexions depuis `0.0.0.0/0`.
      4. Un disque dur défectueux du datacenter est jeté sans être effacé.
      5. Un administrateur Microsoft 365 se fait voler son mot de passe : il n'avait pas de MFA.
      6. Une injection SQL dans le code de la boutique expose les commandes.
    en: |
      A team hosts an online shop as follows:

      - the website runs on **EC2** virtual machines (IaaS);
      - the database is an **RDS PostgreSQL** instance (PaaS);
      - company e-mail is **Microsoft 365** (SaaS).

      For each of the six events below, state **who is responsible** (customer or provider):

      1. A Linux kernel flaw is left unpatched on the EC2 machines.
      2. A PostgreSQL engine flaw is left unpatched on RDS.
      3. The RDS database accepts connections from `0.0.0.0/0`.
      4. A faulty data-centre hard drive is thrown away without being wiped.
      5. A Microsoft 365 administrator has their password stolen: they had no MFA.
      6. A SQL injection in the shop's code exposes the orders.
  solution:
    file: solution.md
    lang: markdown
    code: |
      | # | Event                                   | Responsible | Why                                                      |
      |---|-----------------------------------------|-------------|----------------------------------------------------------|
      | 1 | Unpatched kernel on EC2                 | Customer    | IaaS: the guest operating system is yours                |
      | 2 | Unpatched PostgreSQL engine on RDS      | Provider    | PaaS: the provider patches the engine (you choose the    |
      |   |                                         |             | maintenance window and must not block minor upgrades)    |
      | 3 | RDS open to 0.0.0.0/0                   | Customer    | Network configuration is always yours                    |
      | 4 | Drive discarded without wiping          | Provider    | Physical media belong to "security of the cloud"         |
      | 5 | Admin account without MFA               | Customer    | Identities are yours in every model, SaaS included       |
      | 6 | SQL injection in the shop               | Customer    | Your application code is yours in IaaS and PaaS          |
    note:
      fr: "Quatre évènements sur six relèvent du client, et ce sont justement les plus fréquents dans la réalité : configuration réseau, identités et code applicatif."
      en: "Four events out of six fall on the customer, and they are precisely the most frequent ones in real life: network configuration, identities and application code."

quiz:
  - q:
      fr: "Dans le modèle de responsabilité partagée, que sécurise toujours le fournisseur cloud ?"
      en: "In the shared responsibility model, what does the cloud provider always secure?"
    options:
      fr:
        - "Les mots de passe de vos utilisateurs"
        - "L'infrastructure physique et la couche de virtualisation"
        - "Le code de votre application"
        - "Les règles de vos groupes de sécurité"
      en:
        - "Your users' passwords"
        - "The physical infrastructure and the virtualisation layer"
        - "Your application code"
        - "Your security group rules"
    answer: 1
    why:
      fr: "Bâtiments, serveurs, réseau physique et hyperviseur relèvent de la « sécurité du cloud », à la charge du fournisseur dans tous les modèles."
      en: "Buildings, servers, physical network and hypervisor belong to \"security of the cloud\", which the provider handles in every model."
  - q:
      fr: "Quelles responsabilités restent au client même en SaaS ?"
      en: "Which responsibilities stay with the customer even in SaaS?"
    options:
      fr:
        - "Les correctifs du système d'exploitation"
        - "La sécurité physique des serveurs"
        - "Le runtime de l'application"
        - "Les données et la gestion des identités"
      en:
        - "Operating system patching"
        - "Physical security of the servers"
        - "The application runtime"
        - "Data and identity management"
    answer: 3
    why:
      fr: "Les données et les identités (comptes, droits, MFA) restent à la charge du client en IaaS, en PaaS comme en SaaS."
      en: "Data and identities (accounts, permissions, MFA) remain the customer's job in IaaS, PaaS and SaaS alike."
  - q:
      fr: "Vous utilisez une machine virtuelle (IaaS). Qui applique les correctifs du système d'exploitation invité ?"
      en: "You run a virtual machine (IaaS). Who patches the guest operating system?"
    options:
      fr:
        - "Vous, le client"
        - "Le fournisseur, automatiquement"
        - "Personne : une VM cloud n'a pas besoin de correctifs"
        - "L'éditeur de l'hyperviseur"
      en:
        - "You, the customer"
        - "The provider, automatically"
        - "Nobody: a cloud VM needs no patching"
        - "The hypervisor vendor"
    answer: 0
    why:
      fr: "En IaaS, le fournisseur s'arrête à l'hyperviseur. Tout ce qui tourne dans la VM, système d'exploitation compris, est à vous."
      en: "In IaaS the provider stops at the hypervisor. Everything running inside the VM, operating system included, is yours."
  - q:
      fr: "Quelle est la cause la plus fréquente des fuites de données dans le cloud ?"
      en: "What is the most frequent cause of data leaks in the cloud?"
    options:
      fr:
        - "Une intrusion physique dans un datacenter"
        - "Une faille de l'hyperviseur"
        - "Une erreur de configuration côté client"
        - "Une panne d'électricité chez le fournisseur"
      en:
        - "A physical break-in at a data centre"
        - "A hypervisor vulnerability"
        - "A customer-side misconfiguration"
        - "A power outage at the provider"
    answer: 2
    why:
      fr: "Bucket public, port ouvert à tous, clé publiée dans Git, absence de MFA : l'immense majorité des incidents vient d'un réglage fait par le client."
      en: "Public bucket, port open to all, key pushed to Git, missing MFA: the vast majority of incidents come from a setting chosen by the customer."
  - q:
      fr: "Une base de données managée (PaaS) est joignable depuis `0.0.0.0/0`. Qui doit corriger ?"
      en: "A managed database (PaaS) is reachable from `0.0.0.0/0`. Who must fix it?"
    options:
      fr:
        - "Le fournisseur, car la base est managée"
        - "Le client, car la configuration réseau reste à sa charge"
        - "Personne, c'est le comportement normal d'une base managée"
        - "L'éditeur du moteur de base de données"
      en:
        - "The provider, because the database is managed"
