description:
  fr: "Durcir Google Cloud : IAM et comptes de service, politiques d'organisation, règles de pare-feu VPC, buckets à accès uniforme et Security Command Center."
  en: "Harden Google Cloud: IAM and service accounts, organisation policies, VPC firewall rules, uniform bucket-level access and Security Command Center."
duration: 30

intro:
  fr: |
    **GCP** (*Google Cloud Platform*) organise tout autour d'une idée simple : une **hiérarchie de
    ressources** - organisation, dossiers, projets - dans laquelle les droits et les règles **descendent**
    du haut vers le bas.

    Pensez à un groupe d'entreprises. Le siège (l'**organisation**) fixe des règles valables partout :
    « aucune filiale ne publie de documents internes ». Chaque filiale (un **dossier**) et chaque équipe
    (un **projet**) peut ajouter ses propres règles, mais ne peut pas annuler celles du siège. C'est
    exactement le rôle des **politiques d'organisation**.

    Dans cette leçon, vous allez appliquer le moindre privilège avec **IAM** (*Identity and Access
    Management*), poser des garde-fous d'organisation, fermer le pare-feu VPC, verrouiller un bucket
    Cloud Storage et lire les alertes de **Security Command Center**, avec `gcloud` et Terraform.
  en: |
    **GCP** (*Google Cloud Platform*) builds everything around one simple idea: a **resource hierarchy** -
    organisation, folders, projects - in which permissions and rules flow **down** from top to bottom.

    Think of a group of companies. Headquarters (the **organisation**) sets rules that apply everywhere:
    "no subsidiary publishes internal documents". Each subsidiary (a **folder**) and each team (a
    **project**) may add its own rules but cannot cancel those of headquarters. That is exactly the role
    of **organisation policies**.

    In this lesson you will apply least privilege with **IAM** (*Identity and Access Management*), set
    organisation guardrails, close the VPC firewall, lock down a Cloud Storage bucket and read the
    findings of **Security Command Center**, with `gcloud` and Terraform.

sections:
  - heading:
      fr: "IAM : qui peut faire quoi, sur quelle ressource"
      en: "IAM: who can do what, on which resource"
    body:
      fr: |
        Une liaison IAM (*binding*) associe un **membre** (utilisateur, groupe, compte de service) à un
        **rôle** sur une **ressource**. Attribuée sur un dossier ou un projet, elle s'hérite sur tout ce
        qu'il contient.

        | Type de rôle | Exemple | À utiliser ? |
        |---|---|---|
        | Rôles de base | `roles/owner`, `roles/editor`, `roles/viewer` | Non en production : des milliers de permissions sur tout le projet |
        | Rôles prédéfinis | `roles/storage.objectViewer`, `roles/cloudsql.client` | Oui : limités à un service et à un usage |
        | Rôles personnalisés | Une liste de permissions choisies | Quand aucun rôle prédéfini n'est assez étroit |

        Les **comptes de service** sont les identités des machines. Deux pièges classiques :

        - le **compte de service Compute Engine par défaut**, qui reçoit historiquement le rôle
          `roles/editor` sur tout le projet ; créez un compte dédié par application ;
        - les **clés de compte de service** (fichiers JSON), des secrets longue durée qui finissent dans
          Git. Préférez l'attachement du compte à la ressource (VM, Cloud Run, GKE Workload Identity) et
          la **fédération d'identité de charge de travail** (*Workload Identity Federation*) pour la CI/CD.
      en: |
        An IAM binding links a **member** (user, group, service account) to a **role** on a **resource**.
        Granted on a folder or a project, it is inherited by everything inside.

        | Role type | Example | Use it? |
        |---|---|---|
        | Basic roles | `roles/owner`, `roles/editor`, `roles/viewer` | Not in production: thousands of permissions on the whole project |
        | Predefined roles | `roles/storage.objectViewer`, `roles/cloudsql.client` | Yes: scoped to one service and one use |
        | Custom roles | A hand-picked list of permissions | When no predefined role is narrow enough |

        **Service accounts** are machine identities. Two classic traps:

        - the **default Compute Engine service account**, which historically receives `roles/editor` on
          the whole project; create a dedicated account per application;
        - **service account keys** (JSON files), long-lived secrets that end up in Git. Prefer attaching
          the account to the resource (VM, Cloud Run, GKE Workload Identity) and **Workload Identity
          Federation** for CI/CD.
  - heading:
      fr: "Les politiques d'organisation : des garde-fous hérités"
      en: "Organisation policies: inherited guardrails"
    body:
      fr: |
        IAM répond à « **qui** peut agir ? ». Une politique d'organisation répond à « **qu'est-ce qui est
        permis**, quel que soit l'auteur ? ». Même un propriétaire de projet ne peut pas la contourner.

        | Contrainte | Effet |
        |---|---|
        | `iam.disableServiceAccountKeyCreation` | Interdit de créer des clés de compte de service |
        | `storage.publicAccessPrevention` | Interdit `allUsers` et `allAuthenticatedUsers` sur les buckets |
        | `storage.uniformBucketLevelAccess` | Impose l'accès uniforme sur tous les buckets |
        | `compute.vmExternalIpAccess` | Restreint les VM autorisées à porter une IP publique |
        | `compute.skipDefaultNetworkCreation` | Ne crée plus le réseau `default` dans les nouveaux projets |
        | `compute.requireOsLogin` | Impose OS Login : accès SSH lié à l'identité IAM, sans clés à distribuer |
        | `iam.allowedPolicyMemberDomains` | N'autorise que les identités de vos domaines dans les liaisons IAM |

        Les organisations créées récemment reçoivent déjà une partie de ces contraintes par défaut ;
        vérifiez l'état réel avec `gcloud org-policies describe` plutôt que de le supposer.
      en: |
        IAM answers "**who** may act?". An organisation policy answers "**what is allowed**, whoever the
        author is?". Not even a project owner can bypass it.

        | Constraint | Effect |
        |---|---|
        | `iam.disableServiceAccountKeyCreation` | Forbids creating service account keys |
        | `storage.publicAccessPrevention` | Forbids `allUsers` and `allAuthenticatedUsers` on buckets |
        | `storage.uniformBucketLevelAccess` | Enforces uniform access on every bucket |
        | `compute.vmExternalIpAccess` | Restricts which VMs may hold a public IP |
        | `compute.skipDefaultNetworkCreation` | Stops creating the `default` network in new projects |
        | `compute.requireOsLogin` | Enforces OS Login: SSH access tied to the IAM identity, no keys to hand out |
        | `iam.allowedPolicyMemberDomains` | Allows only identities from your domains in IAM bindings |

        Recently created organisations already receive some of these constraints by default; check the
        actual state with `gcloud org-policies describe` rather than assuming it.
  - heading:
      fr: "Pare-feu VPC, Cloud Storage et Security Command Center"
      en: "VPC firewall, Cloud Storage and Security Command Center"
    body:
      fr: |
        **Pare-feu VPC.** Les règles sont *stateful* et portent une **priorité** de 0 à 65535 (le plus petit
        nombre gagne). Deux règles implicites existent toujours : tout entrant refusé, tout sortant
        autorisé. Le danger vient du réseau **`default`**, créé automatiquement avec des règles qui ouvrent
        SSH (22), RDP (3389) et ICMP à `0.0.0.0/0`. Une règle cible des VM par **tag réseau** ou, mieux, par
        **compte de service**. Pour l'administration, **IAP** (*Identity-Aware Proxy*) relaie SSH depuis la
        seule plage `35.235.240.0/20`, après authentification IAM.

        **Cloud Storage.** L'**accès uniforme au niveau du bucket** désactive les ACL par objet : les droits
        ne viennent plus que d'IAM, donc d'un seul endroit auditable. La **prévention de l'accès public**
        (`enforced`) refuse toute liaison avec `allUsers`.

        **Security Command Center (SCC).** C'est le tableau de bord de sécurité de GCP. *Security Health
        Analytics* y détecte les erreurs de configuration (bucket public, pare-feu ouvert, clé de compte de
        service ancienne) ; les niveaux payants ajoutent la détection de menaces et les rapports de
        conformité CIS.

        **Journaux d'audit.** Les journaux *Admin Activity* sont toujours actifs ; les journaux *Data
        Access* (lecture des données) doivent être activés pour les services sensibles.
      en: |
        **VPC firewall.** Rules are stateful and carry a **priority** from 0 to 65535 (the lowest number
        wins). Two implied rules always exist: all ingress denied, all egress allowed. The danger comes
        from the **`default`** network, created automatically with rules opening SSH (22), RDP (3389) and
        ICMP to `0.0.0.0/0`. A rule targets VMs by **network tag** or, better, by **service account**. For
        administration, **IAP** (*Identity-Aware Proxy*) relays SSH from the single range
        `35.235.240.0/20`, after IAM authentication.

        **Cloud Storage.** **Uniform bucket-level access** disables per-object ACLs: permissions come from
        IAM only, hence from a single auditable place. **Public access prevention** (`enforced`) refuses
        any binding to `allUsers`.

        **Security Command Center (SCC).** This is GCP's security dashboard. *Security Health Analytics*
        detects misconfigurations (public bucket, open firewall, old service account key); the paid tiers
        add threat detection and CIS compliance reports.

        **Audit logs.** *Admin Activity* logs are always on; *Data Access* logs (data reads) must be
        enabled for sensitive services.

examples:
  - title:
      fr: "Les quatre raccourcis qui exposent un projet"
      en: "The four shortcuts that expose a project"
    file: shortcuts.sh
    lang: bash
    kind: vulnerable
    code: |
      #!/usr/bin/env bash
      PROJECT=acme-shop-prod
      SA="shop-app@${PROJECT}.iam.gserviceaccount.com"

      # 1. Basic role: the application can modify almost every resource of the project
      gcloud projects add-iam-policy-binding "$PROJECT" \
        --member="serviceAccount:${SA}" --role="roles/editor"

      # 2. A long-lived JSON key: it will be copied to laptops, CI variables, then Git
      gcloud iam service-accounts keys create key.json --iam-account="$SA"

      # 3. allUsers = anyone on the Internet, without authentication
      gcloud storage buckets add-iam-policy-binding gs://acme-invoices-prod \
        --member=allUsers --role=roles/storage.objectViewer

      # 4. SSH from the whole planet on every VM of the default network
      gcloud compute firewall-rules create allow-ssh-all \
        --network=default --direction=INGRESS \
        --allow=tcp:22 --source-ranges=0.0.0.0/0
    note:
      fr: "Chaque commande fait gagner cinq minutes et ouvre une porte : un rôle beaucoup trop large, un secret permanent, des factures publiques et un SSH mondial. Les trois dernières auraient été refusées par une politique d'organisation."
      en: "Each command saves five minutes and opens a door: a role far too broad, a permanent secret, public invoices and worldwide SSH. The last three would have been refused by an organisation policy."

  - title:
      fr: "La version durcie en Terraform"
      en: "The hardened version in Terraform"
    file: main.tf
    lang: hcl
    kind: secure
    code: |
      # One dedicated service account per application, attached to the workload: no key file
      resource "google_service_account" "shop" {
        account_id   = "shop-app"
        display_name = "Shop application"
      }

      resource "google_storage_bucket" "invoices" {
        name     = "acme-invoices-prod"
        location = "EU"

        uniform_bucket_level_access = true       # IAM only, no per-object ACL
        public_access_prevention    = "enforced" # allUsers bindings are rejected

        versioning {
          enabled = true
        }
      }

      # Least privilege: read objects of THIS bucket, not "editor" on the whole project
      resource "google_storage_bucket_iam_member" "shop_reads_invoices" {
        bucket = google_storage_bucket.invoices.name
        role   = "roles/storage.objectViewer"
        member = "serviceAccount:${google_service_account.shop.email}"
      }

      # A custom network: no default-allow-ssh / default-allow-rdp rules
      resource "google_compute_network" "main" {
        name                    = "main"
        auto_create_subnetworks = false
      }

      # SSH only from Identity-Aware Proxy, only to VMs running as the shop service account
      resource "google_compute_firewall" "ssh_from_iap" {
        name      = "allow-ssh-from-iap"
        network   = google_compute_network.main.name
        direction = "INGRESS"

        source_ranges           = ["35.235.240.0/20"]
        target_service_accounts = [google_service_account.shop.email]

        allow {
          protocol = "tcp"
          ports    = ["22"]
        }

        log_config {
          metadata = "INCLUDE_ALL_METADATA" # every connection attempt is logged
        }
      }
    note:
      fr: "Le rôle est attribué sur le bucket et non sur le projet, le bucket ne peut pas devenir public, et le port 22 n'est joignable que par IAP : l'accès SSH dépend alors d'un rôle IAM (`roles/iap.tunnelResourceAccessor`), pas d'une adresse IP."
      en: "The role is granted on the bucket rather than on the project, the bucket cannot become public, and port 22 is reachable through IAP only: SSH access then depends on an IAM role (`roles/iap.tunnelResourceAccessor`), not on an IP address."

  - title:
      fr: "Garde-fous : deux politiques d'organisation"
      en: "Guardrails: two organisation policies"
    file: org-policies.tf
    lang: hcl
    kind: secure
    code: |
      variable "org_id" {
        type        = string
        description = "Numeric organisation ID, for example 123456789012"
      }

      # Nobody in the organisation can create a service account key any more
      resource "google_org_policy_policy" "no_sa_keys" {
        name   = "organizations/${var.org_id}/policies/iam.disableServiceAccountKeyCreation"
        parent = "organizations/${var.org_id}"

        spec {
          rules {
            enforce = "TRUE"
          }
        }
      }

      # No bucket of the organisation can be opened to allUsers / allAuthenticatedUsers
      resource "google_org_policy_policy" "no_public_buckets" {
        name   = "organizations/${var.org_id}/policies/storage.publicAccessPrevention"
        parent = "organizations/${var.org_id}"

        spec {
          rules {
            enforce = "TRUE"
          }
        }
      }
    output: |
      $ gcloud iam service-accounts keys create key.json \
          --iam-account=shop-app@acme-shop-prod.iam.gserviceaccount.com
      ERROR: (gcloud.iam.service-accounts.keys.create) FAILED_PRECONDITION: Key creation is not allowed on this service account.
      - '@type': type.googleapis.com/google.rpc.PreconditionFailure
        violations:
        - description: Key creation is not allowed on this service account.
          subject: projects/acme-shop-prod/serviceAccounts/shop-app@acme-shop-prod.iam.gserviceaccount.com?configvalue=shop-app%40acme-shop-prod.iam.gserviceaccount.com
          type: constraints/iam.disableServiceAccountKeyCreation
    note:
      fr: "Une fois la politique appliquée, la commande n°2 de l'exemple vulnérable échoue, même pour un propriétaire du projet. Une exception reste possible en redéfinissant la politique sur un projet précis, ce qui laisse une trace explicite et relisible."
      en: "Once the policy is applied, command no. 2 of the vulnerable example fails, even for a project owner. An exception remains possible by overriding the policy on a specific project, which leaves an explicit, reviewable trace."

  - title:
      fr: "Auditer un projet avec gcloud"
      en: "Auditing a project with gcloud"
    file: audit.sh
    lang: bash
    kind: neutral
    code: |
      #!/usr/bin/env bash
      # Read-only commands: run them on projects you are authorised to assess.
      set -euo pipefail
      PROJECT=acme-shop-prod
      ORG=123456789012

      # 1. Who holds a basic role (owner / editor) on the project?
      gcloud projects get-iam-policy "$PROJECT" \
        --flatten="bindings[].members" \
        --filter="bindings.role:(roles/owner roles/editor)" \
        --format="table(bindings.role, bindings.members)"

      # 2. User-managed keys of a service account (the goal is an empty list)
      gcloud iam service-accounts keys list \
        --iam-account="shop-app@${PROJECT}.iam.gserviceaccount.com" --managed-by=user

      # 3. Ingress firewall rules open to the whole Internet
      gcloud compute firewall-rules list --project="$PROJECT" \
        --filter="direction=INGRESS AND sourceRanges:0.0.0.0/0" \
        --format="table(name, network.basename(), sourceRanges.list())"

      # 4. Is the organisation policy really in force on this project?
      gcloud org-policies describe storage.publicAccessPrevention \
        --project="$PROJECT" --effective

      # 5. Active critical findings in Security Command Center
      gcloud scc findings list "organizations/${ORG}" \
        --filter='state="ACTIVE" AND severity="CRITICAL"' \
        --format="table(finding.category, finding.resourceName)"
    output: |
      ROLE          MEMBERS
      roles/editor  serviceAccount:123456789012-compute@developer.gserviceaccount.com
      roles/owner   user:alice@example.com

      NAME               NETWORK  SOURCE_RANGES
      default-allow-rdp  default  0.0.0.0/0
      default-allow-ssh  default  0.0.0.0/0

      name: projects/987654321098/policies/storage.publicAccessPrevention
      spec:
        rules:
        - enforce: true

      CATEGORY        RESOURCE_NAME
      OPEN_SSH_PORT   //compute.googleapis.com/projects/acme-shop-prod/global/firewalls/default-allow-ssh
      OPEN_RDP_PORT   //compute.googleapis.com/projects/acme-shop-prod/global/firewalls/default-allow-rdp
    note:
      fr: "Trois constats typiques d'un projet créé sans précaution : le compte de service Compute par défaut est `editor`, le réseau `default` ouvre SSH et RDP au monde, et SCC le signale. La commande 2 n'affiche rien : aucune clé gérée par l'utilisateur, c'est l'objectif."
      en: "Three typical findings of a carelessly created project: the default Compute service account is `editor`, the `default` network opens SSH and RDP to the world, and SCC flags it. Command 2 prints nothing: no user-managed key, which is the goal."

mistake:
  fr: |
    **Télécharger une clé de compte de service « pour que la CI puisse déployer ».**

    Ce fichier JSON est un mot de passe qui n'expire jamais, souvent associé à un rôle `editor`. Il est
    copié dans les secrets de la CI, sur des postes, parfois dans le dépôt. C'est l'une des premières causes
    de compromission de projets GCP. La solution s'appelle **Workload Identity Federation** : GitHub Actions
    ou GitLab présentent leur jeton OIDC, Google l'échange contre un jeton d'accès de courte durée, et
    aucun secret n'est stocké. Complétez par la contrainte `iam.disableServiceAccountKeyCreation`.
  en: |
    **Downloading a service account key "so that CI can deploy".**

    That JSON file is a password that never expires, often tied to an `editor` role. It gets copied into
    CI secrets, onto laptops, sometimes into the repository. It is one of the leading causes of GCP
    project compromise. The solution is called **Workload Identity Federation**: GitHub Actions or GitLab
    present their OIDC token, Google exchanges it for a short-lived access token, and no secret is stored.
    Complete it with the `iam.disableServiceAccountKeyCreation` constraint.

bestPractice:
  fr: |
    - **Aucun rôle de base** (`owner`, `editor`) en production ; des rôles prédéfinis attribués à des **groupes**, au niveau le plus bas possible.
    - **Un compte de service par application**, attaché à la ressource ; aucune clé téléchargée.
    - **Politiques d'organisation** posées dès la création : pas de clés, pas de bucket public, pas de réseau `default`, pas d'IP externe par défaut.
    - **Réseau** : supprimez le réseau `default`, administrez via IAP et OS Login, journalisez les règles de pare-feu.
    - **Buckets** : accès uniforme et prévention de l'accès public partout.
    - **SCC activé au niveau de l'organisation**, avec un responsable pour chaque alerte critique.
    - **Journaux Data Access** activés sur les services qui contiennent des données sensibles.
  en: |
    - **No basic role** (`owner`, `editor`) in production; predefined roles granted to **groups**, at the lowest possible level.
    - **One service account per application**, attached to the resource; no downloaded key.
    - **Organisation policies** set from day one: no keys, no public bucket, no `default` network, no external IP by default.
    - **Network**: delete the `default` network, administer through IAP and OS Login, log firewall rules.
    - **Buckets**: uniform access and public access prevention everywhere.
    - **SCC enabled at organisation level**, with an owner for every critical finding.
    - **Data Access logs** enabled on services holding sensitive data.

exercise:
  statement:
    fr: |
      Le projet `acme-data-prod` contient le bucket `gs://acme-reports`. Un audit signale :

      - le bucket est lisible par `allUsers` ;
      - il utilise encore des ACL par objet ;
      - la règle de pare-feu `default-allow-ssh` est ouverte à `0.0.0.0/0`.

      Avec `gcloud` :

      1. retirez l'accès public du bucket ;
      2. activez l'accès uniforme et la prévention de l'accès public ;
      3. supprimez la règle SSH ouverte et créez une règle qui n'autorise SSH que depuis IAP ;
      4. connectez-vous à la VM `reports-1` (zone `europe-west1-b`) en passant par IAP.
    en: |
      The project `acme-data-prod` contains the bucket `gs://acme-reports`. An audit reports:

      - the bucket is readable by `allUsers`;
      - it still uses per-object ACLs;
      - the firewall rule `default-allow-ssh` is open to `0.0.0.0/0`.

      With `gcloud`:

      1. remove public access from the bucket;
      2. enable uniform access and public access prevention;
      3. delete the open SSH rule and create a rule allowing SSH from IAP only;
      4. connect to the VM `reports-1` (zone `europe-west1-b`) through IAP.
  solution:
    file: solution.sh
    lang: bash
    code: |
      #!/usr/bin/env bash
      set -euo pipefail
      gcloud config set project acme-data-prod

      # 1. Remove the public binding
      gcloud storage buckets remove-iam-policy-binding gs://acme-reports \
        --member=allUsers --role=roles/storage.objectViewer

      # 2. IAM only, and public bindings refused from now on
      gcloud storage buckets update gs://acme-reports \
        --uniform-bucket-level-access --public-access-prevention

      # 3. Replace worldwide SSH with SSH from Identity-Aware Proxy only
      gcloud compute firewall-rules delete default-allow-ssh --quiet
      gcloud compute firewall-rules create allow-ssh-from-iap \
        --network=default --direction=INGRESS \
        --allow=tcp:22 --source-ranges=35.235.240.0/20 \
        --enable-logging

      # 4. SSH through IAP: works without any public IP on the VM
      gcloud compute ssh reports-1 --zone=europe-west1-b --tunnel-through-iap
    note:
      fr: "Activez l'accès uniforme seulement après avoir vérifié qu'aucune application ne dépend des ACL par objet : elles cessent de s'appliquer immédiatement. À terme, déplacez aussi la VM hors du réseau `default`."
      en: "Enable uniform access only after checking that no application depends on per-object ACLs: they stop applying immediately. Eventually, also move the VM out of the `default` network."

quiz:
  - q:
      fr: "Pourquoi éviter le rôle `roles/editor` pour le compte de service d'une application ?"
      en: "Why avoid the `roles/editor` role for an application's service account?"
    options:
      fr:
        - "Il est facturé plus cher que les rôles prédéfinis"
        - "Il ne permet pas de lire Cloud Storage"
        - "Il expire au bout de 90 jours"
        - "Il donne des milliers de permissions sur tout le projet, bien au-delà du besoin"
      en:
        - "It is billed at a higher rate than predefined roles"
        - "It does not allow reading Cloud Storage"
        - "It expires after 90 days"
        - "It grants thousands of permissions on the whole project, far beyond what is needed"
    answer: 3
    why:
      fr: "Les rôles de base contredisent le moindre privilège : une application compromise avec `editor` peut modifier presque toutes les ressources du projet."
      en: "Basic roles contradict least privilege: a compromised application holding `editor` can modify almost every resource in the project."
  - q:
      fr: "Quelle différence y a-t-il entre IAM et une politique d'organisation ?"
      en: "What is the difference between IAM and an organisation policy?"
    options:
      fr:
        - "IAM dit qui peut agir ; la politique d'organisation limite ce qui est permis, quel que soit l'auteur"
        - "IAM s'applique aux machines, la politique d'organisation aux humains"
        - "La politique d'organisation ne s'applique qu'au réseau"
        - "Il n'y en a pas : ce sont deux noms du même mécanisme"
      en:
        - "IAM says who may act; the organisation policy limits what is allowed, whoever the author is"
        - "IAM applies to machines, the organisation policy to humans"
        - "The organisation policy applies to networking only"
        - "None: they are two names for the same mechanism"
    answer: 0
    why:
      fr: "Même avec le rôle `owner`, un utilisateur ne peut pas créer une ressource qui viole une contrainte d'organisation : c'est un garde-fou indépendant des droits."
      en: "Even with the `owner` role, a user cannot create a resource that violates an organisation constraint: it is a guardrail independent of permissions."
  - q:
      fr: "Que fait l'accès uniforme au niveau du bucket (uniform bucket-level access) ?"
      en: "What does uniform bucket-level access do?"
    options:
      fr:
        - "Il chiffre tous les objets avec la même clé"
        - "Il rend le bucket accessible depuis toutes les régions"
        - "Il désactive les ACL par objet : seuls les droits IAM s'appliquent"
        - "Il réplique le bucket dans un second projet"
      en:
        - "It encrypts all objects with the same key"
        - "It makes the bucket reachable from every region"
        - "It disables per-object ACLs: only IAM permissions apply"
        - "It replicates the bucket to a second project"
    answer: 2
    why:
      fr: "Avec un seul système de droits (IAM), il n'y a plus d'objet rendu public par une ACL oubliée, et l'audit devient simple."
      en: "With a single permission system (IAM) there is no longer an object made public by a forgotten ACL, and auditing becomes simple."
  - q:
      fr: "Pourquoi le réseau `default` d'un projet GCP est-il déconseillé ?"
      en: "Why is the `default` network of a GCP project discouraged?"
    options:
      fr:
        - "Il ne permet pas de créer de VM"
        - "Il est créé avec des règles ouvrant SSH, RDP et ICMP à `0.0.0.0/0`"
        - "Il est limité à une seule région"
        - "Il n'est pas compatible avec Cloud Storage"
      en:
        - "It does not allow creating VMs"
        - "It is created with rules opening SSH, RDP and ICMP to `0.0.0.0/0`"
        - "It is limited to a single region"
        - "It is not compatible with Cloud Storage"
    answer: 1
    why:
      fr: "Les règles `default-allow-ssh`, `default-allow-rdp` et `default-allow-icmp` exposent toute VM dotée d'une IP publique. Créez un réseau personnalisé sans ces règles."
      en: "The rules `default-allow-ssh`, `default-allow-rdp` and `default-allow-icmp` expose any VM with a public IP. Create a custom network without those rules."
  - q:
      fr: "Comment une CI/CD externe devrait-elle s'authentifier auprès de GCP ?"
      en: "How should an external CI/CD system authenticate to GCP?"
    options:
      fr:
        - "Avec une clé JSON de compte de service stockée dans les secrets de la CI"
        - "Avec le mot de passe d'un administrateur"
        - "Avec Workload Identity Federation, en échangeant son jeton OIDC contre un jeton de courte durée"
        - "En rendant les ressources publiques pendant le déploiement"
      en:
        - "With a service account JSON key stored in the CI secrets"
        - "With an administrator's password"
        - "With Workload Identity Federation, exchanging its OIDC token for a short-lived token"
        - "By making resources public during deployment"
    answer: 2
    why:
      fr: "La fédération d'identité supprime le secret longue durée : la CI prouve son identité avec un jeton OIDC signé et reçoit un accès temporaire."
      en: "Identity federation removes the long-lived secret: CI proves its identity with a signed OIDC token and receives temporary access."
