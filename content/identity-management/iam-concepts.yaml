description:
  fr: "Distinguer authentification et autorisation, comprendre les principals (utilisateurs, groupes, rôles, identités machine) et poser le vocabulaire de l'IAM."
  en: "Tell authentication and authorization apart, understand principals (users, groups, roles, workload identities) and lay the IAM vocabulary."
duration: 22

intro:
  fr: |
    **IAM** signifie *Identity and Access Management* : la gestion des identités et des accès. C'est la
    discipline qui répond à deux questions pour chaque action dans un système : **« Qui es-tu ? »** et
    **« As-tu le droit de faire ça ? »**. Confondre ces deux questions est la source d'innombrables failles.

    Imaginez l'entrée d'un immeuble de bureaux. À l'accueil, on vérifie votre **identité** avec un badge et
    un code : c'est l'**authentification**. Ensuite, votre badge n'ouvre que certains étages et certaines
    portes : c'est l'**autorisation**. Prouver qui vous êtes ne vous donne pas accès à tout — et c'est
    précisément le rôle de l'IAM de séparer les deux.

    Dans cette leçon, vous allez poser le vocabulaire fondamental — identification, authentification,
    autorisation — et découvrir les *principals* (utilisateurs, groupes, rôles, identités machine) sur
    lesquels reposent tous les systèmes d'accès modernes.
  en: |
    **IAM** stands for *Identity and Access Management*. It is the discipline that answers two questions
    for every action in a system: **"Who are you?"** and **"Are you allowed to do that?"**. Confusing these
    two questions is the source of countless flaws.

    Picture the entrance of an office building. At reception, your **identity** is checked with a badge and
    a code: that is **authentication**. Then your badge only opens certain floors and certain doors: that
    is **authorization**. Proving who you are does not grant you access to everything — and it is precisely
    IAM's job to keep the two apart.

    In this lesson you will lay the fundamental vocabulary — identification, authentication, authorization —
    and discover the *principals* (users, groups, roles, workload identities) on which every modern access
    system is built.

sections:
  - heading:
      fr: "Identification, authentification, autorisation"
      en: "Identification, authentication, authorization"
    body:
      fr: |
        Trois mots proches qu'il faut absolument distinguer :

        - **Identification** : *annoncer* qui l'on prétend être (saisir un nom d'utilisateur, présenter un
          identifiant). C'est une simple déclaration, sans preuve.
        - **Authentification** (*authn*) : *prouver* cette identité. On fournit un **facteur** : quelque
          chose que l'on sait (mot de passe), que l'on possède (téléphone, clé), ou que l'on est
          (biométrie).
        - **Autorisation** (*authz*) : une fois l'identité prouvée, *décider ce que cette identité a le
          droit de faire*. C'est l'application d'une politique.

        | | Authentification (authn) | Autorisation (authz) |
        |---|---|---|
        | Question | Qui es-tu ? | Que peux-tu faire ? |
        | Vient | En premier | Après l'authentification |
        | Moyen | Mot de passe, MFA, clé | Politique, rôle, permission |
        | Erreur typique | Mot de passe refusé (401) | Accès interdit (403) |

        Un système peut parfaitement vous **authentifier** (il sait que c'est bien vous) et pourtant vous
        **refuser l'autorisation** (vous n'avez pas le droit). En HTTP, cela correspond au couple `401
        Unauthorized` (identité non prouvée) et `403 Forbidden` (identité connue mais droits insuffisants).
      en: |
        Three close words you must absolutely tell apart:

        - **Identification**: *announcing* who you claim to be (typing a username, presenting an id). It is
          a mere declaration, with no proof.
        - **Authentication** (*authn*): *proving* that identity. You provide a **factor**: something you
          know (password), something you have (phone, key), or something you are (biometrics).
        - **Authorization** (*authz*): once the identity is proven, *deciding what that identity is allowed
          to do*. It is the enforcement of a policy.

        | | Authentication (authn) | Authorization (authz) |
        |---|---|---|
        | Question | Who are you? | What can you do? |
        | Comes | First | After authentication |
        | Means | Password, MFA, key | Policy, role, permission |
        | Typical error | Password rejected (401) | Access denied (403) |

        A system can perfectly well **authenticate** you (it knows it is really you) and still **deny
        authorization** (you are not allowed). In HTTP, this maps to the pair `401 Unauthorized` (identity
        not proven) and `403 Forbidden` (identity known but insufficient rights).
  - heading:
      fr: "Les principals : qui agit dans le système ?"
      en: "Principals: who acts in the system?"
    body:
      fr: |
        Un **principal** est toute entité qui peut être authentifiée et à qui l'on accorde (ou refuse) des
        droits. On distingue plusieurs types :

        - **Utilisateur** (*user*) : une personne, avec une identité à long terme (nom, mot de passe, MFA).
        - **Groupe** (*group*) : un ensemble d'utilisateurs. On attache les permissions au groupe, puis on
          y ajoute les personnes. Changer d'équipe = changer de groupe, sans retoucher chaque permission.
        - **Rôle** (*role*) : une identité **temporaire** qu'un principal **endosse** le temps d'une tâche.
          Le rôle porte des permissions ; en l'assumant, on obtient des identifiants à courte durée. C'est
          la pierre angulaire des accès cloud modernes.
        - **Identité machine / de charge de travail** (*workload identity*) : un service, une application,
          un conteneur, une fonction. Elle n'a pas de mot de passe humain : elle s'authentifie par un
          certificat, un token, ou l'identité fournie par sa plateforme.

        La tendance de fond : privilégier les **rôles** et les **identités machine** à durée de vie courte
        plutôt que des identifiants permanents. Un rôle endossé pour 15 minutes qui fuit vaut bien moins
        qu'un mot de passe permanent volé. Les leçons suivantes appliquent ces concepts à AWS IAM, au RBAC
        et au SSO.
      en: |
        A **principal** is any entity that can be authenticated and granted (or denied) rights. There are
        several types:

        - **User**: a person, with a long-term identity (name, password, MFA).
        - **Group**: a set of users. You attach permissions to the group, then add people to it. Changing
          team = changing group, without reworking each permission.
        - **Role**: a **temporary** identity that a principal **assumes** for the duration of a task. The
          role carries permissions; by assuming it, you obtain short-lived credentials. It is the
          cornerstone of modern cloud access.
        - **Workload / machine identity**: a service, an application, a container, a function. It has no
          human password: it authenticates with a certificate, a token, or the identity provided by its
          platform.

        The underlying trend: favour **roles** and short-lived **workload identities** over permanent
        credentials. A role assumed for 15 minutes that leaks is worth far less than a stolen permanent
        password. The following lessons apply these concepts to AWS IAM, RBAC and SSO.

examples:
  - title:
      fr: "Authentifié mais pas autorisé : 401 vs 403"
      en: "Authenticated but not authorized: 401 vs 403"
    file: authn_vs_authz.py
    lang: python
    kind: neutral
    code: |
      # A tiny model of the two steps. 'users' is the authn store,
      # 'roles' is the authz policy. They are intentionally separate.
      users = {"alice": "pw-alice", "bob": "pw-bob"}
      roles = {"alice": "admin", "bob": "viewer"}
      allowed = {"admin": {"read", "delete"}, "viewer": {"read"}}

      def request(username, password, action):
          # STEP 1 - authentication: prove who you are
          if users.get(username) != password:
              return "401 Unauthorized (identity not proven)"
          # STEP 2 - authorization: are you allowed to do THIS action?
          if action not in allowed[roles[username]]:
              return "403 Forbidden (identity known, action not allowed)"
          return f"200 OK ({username} may {action})"

      print(request("bob", "wrong", "read"))     # fails authn
      print(request("bob", "pw-bob", "delete"))  # passes authn, fails authz
      print(request("alice", "pw-alice", "delete"))
    output: |
      401 Unauthorized (identity not proven)
      403 Forbidden (identity known, action not allowed)
      200 OK (alice may delete)
    note:
      fr: "Bob est bien authentifié (bon mot de passe) mais pas autorisé à supprimer : c'est un 403, pas un 401. Séparer le magasin d'identités (`users`) de la politique (`roles`/`allowed`) est le réflexe de base de l'IAM."
      en: "Bob is properly authenticated (right password) but not authorized to delete: that is a 403, not a 401. Separating the identity store (`users`) from the policy (`roles`/`allowed`) is IAM's basic reflex."

  - title:
      fr: "Groupes : attacher les droits au groupe, pas à la personne"
      en: "Groups: attach rights to the group, not the person"
    file: groups.py
    lang: python
    kind: secure
    code: |
      # Permissions live on GROUPS. People are simply members of groups.
      group_permissions = {
          "developers": {"deploy_staging", "read_logs"},
          "admins": {"deploy_prod", "manage_users"},
      }
      user_groups = {
          "alice": {"admins", "developers"},
          "bob": {"developers"},
      }

      def can(user, permission):
          # A user's permissions are the UNION of their groups' permissions
          perms = set()
          for g in user_groups.get(user, set()):
              perms |= group_permissions[g]
          return permission in perms

      print("bob deploy_prod:", can("bob", "deploy_prod"))
      print("alice deploy_prod:", can("alice", "deploy_prod"))
      # Onboarding a new dev = add them to 'developers'. No per-user edits.
      user_groups["carol"] = {"developers"}
      print("carol read_logs:", can("carol", "read_logs"))
    output: |
      bob deploy_prod: False
      alice deploy_prod: True
      carol read_logs: True
    note:
      fr: "Les permissions sont portées par les groupes : intégrer `carol` se résume à l'ajouter au bon groupe. On évite de dupliquer les droits sur chaque utilisateur, source d'oublis lors des départs."
      en: "Permissions are carried by groups: onboarding `carol` is just adding her to the right group. You avoid duplicating rights on each user, a source of omissions when people leave."

  - title:
      fr: "Rôle temporaire : endosser des droits pour une tâche"
      en: "Temporary role: assuming rights for a task"
    file: assume_role.py
    lang: python
    kind: secure
    code: |
      import time

      # A role grants permissions only while it is "assumed", for a short TTL.
      role_permissions = {"deployer": {"deploy_prod"}}

      def assume_role(role, ttl_seconds=900):
          # Returns a short-lived credential, not a permanent one
          return {"role": role, "expires_at": time.time() + ttl_seconds,
                  "permissions": role_permissions[role]}

      def can(credential, permission):
          if time.time() > credential["expires_at"]:
              return False  # expired: the temporary access is gone
          return permission in credential["permissions"]

      session = assume_role("deployer", ttl_seconds=900)
      print("can deploy now:", can(session, "deploy_prod"))
      # Simulate the credential having expired
      session["expires_at"] = time.time() - 1
      print("can deploy after expiry:", can(session, "deploy_prod"))
    output: |
      can deploy now: True
      can deploy after expiry: False
    note:
      fr: "Le rôle n'accorde des droits que pendant un court instant (`ttl`). Un identifiant temporaire qui fuit devient inutile à l'expiration : c'est tout l'intérêt des rôles face aux identifiants permanents."
      en: "The role only grants rights for a short while (`ttl`). A leaked temporary credential becomes useless at expiry: that is the whole point of roles over permanent credentials."

mistake:
  fr: |
    **Confondre authentification et autorisation, et croire qu'une identité prouvée donne tous les droits.**

    L'erreur classique : une application vérifie le mot de passe (authn) et, une fois l'utilisateur connecté,
    ne contrôle plus rien — elle suppose que « connecté = autorisé ». Résultat : n'importe quel utilisateur
    authentifié peut atteindre des ressources qui ne le concernent pas (un simple changement d'identifiant
    dans l'URL suffit souvent). C'est la faille « *Broken Access Control* », en tête de l'OWASP Top 10.

    L'authentification et l'autorisation sont **deux étapes distinctes**. Prouver qui l'on est ne dit rien
    de ce que l'on a le droit de faire. Chaque action sensible doit être contrôlée côté serveur contre la
    politique du principal, même après une connexion réussie. Et souvenez-vous de la correspondance HTTP :
    `401` = identité non prouvée, `403` = identité connue mais droits insuffisants.
  en: |
    **Confusing authentication and authorization, and believing that a proven identity grants all rights.**

    The classic mistake: an application checks the password (authn) and, once the user is logged in, checks
    nothing more — it assumes "logged in = authorized". As a result, any authenticated user can reach
    resources that are none of their business (often just changing an id in the URL is enough). This is the
    "*Broken Access Control*" flaw, number one in the OWASP Top 10.

    Authentication and authorization are **two distinct steps**. Proving who you are says nothing about what
    you are allowed to do. Every sensitive action must be checked server-side against the principal's
    policy, even after a successful login. And remember the HTTP mapping: `401` = identity not proven, `403`
    = identity known but insufficient rights.

bestPractice:
  fr: |
    - **Séparez authentification et autorisation** : prouver l'identité, puis vérifier les droits à chaque action sensible.
    - **Attachez les permissions aux groupes et aux rôles**, pas aux personnes une par une.
    - **Préférez les rôles temporaires** aux identifiants permanents : une fuite expire d'elle-même.
    - **Donnez une identité propre à chaque charge de travail** (service, conteneur, fonction), sans mot de passe humain partagé.
    - **Contrôlez l'autorisation côté serveur**, jamais seulement côté client : une connexion réussie n'autorise pas tout.
    - **Respectez le vocabulaire** (401 vs 403) : il guide le diagnostic et évite les malentendus de conception.
  en: |
    - **Separate authentication and authorization**: prove the identity, then check rights on every sensitive action.
    - **Attach permissions to groups and roles**, not to people one by one.
    - **Prefer temporary roles** over permanent credentials: a leak expires on its own.
    - **Give each workload its own identity** (service, container, function), with no shared human password.
    - **Enforce authorization server-side**, never only client-side: a successful login does not authorize everything.
    - **Respect the vocabulary** (401 vs 403): it guides diagnosis and avoids design misunderstandings.

exercise:
  statement:
    fr: |
      On vous donne un magasin d'identités et une politique d'autorisation séparés :

      ```python
      passwords = {"alice": "a1", "bob": "b2"}
      role_of = {"alice": "editor", "bob": "reader"}
      can_do = {"editor": {"read", "write"}, "reader": {"read"}}
      ```

      Écrivez une fonction `access(user, password, action)` qui renvoie :

      - `"401"` si le mot de passe est faux (authentification échouée) ;
      - `"403"` si l'utilisateur est authentifié mais n'a pas le droit de faire l'action ;
      - `"200"` sinon.

      Testez-la avec un mauvais mot de passe, une action interdite et une action autorisée.
    en: |
      You are given a separate identity store and authorization policy:

      ```python
      passwords = {"alice": "a1", "bob": "b2"}
      role_of = {"alice": "editor", "bob": "reader"}
      can_do = {"editor": {"read", "write"}, "reader": {"read"}}
      ```

      Write a function `access(user, password, action)` that returns:

      - `"401"` if the password is wrong (authentication failed);
      - `"403"` if the user is authenticated but not allowed to do the action;
      - `"200"` otherwise.

      Test it with a wrong password, a forbidden action and an allowed action.
  solution:
    file: solution.py
    lang: python
    code: |
      passwords = {"alice": "a1", "bob": "b2"}
      role_of = {"alice": "editor", "bob": "reader"}
      can_do = {"editor": {"read", "write"}, "reader": {"read"}}

      def access(user, password, action):
          # STEP 1 - authentication (who are you?)
          if passwords.get(user) != password:
              return "401"
          # STEP 2 - authorization (are you allowed?)
          if action not in can_do[role_of[user]]:
              return "403"
          return "200"

      print(access("bob", "wrong", "read"))   # 401: authn fails
      print(access("bob", "b2", "write"))      # 403: authn ok, authz fails
      print(access("alice", "a1", "write"))    # 200: both pass
    note:
      fr: "La fonction vérifie d'abord l'identité, puis seulement les droits : l'ordre reflète la réalité. Bob avec le bon mot de passe mais sans droit d'écriture obtient un `403`, pas un `401`."
      en: "The function first checks the identity, then only the rights: the order mirrors reality. Bob with the right password but no write permission gets a `403`, not a `401`."

quiz:
  - q:
      fr: "Quelle est la différence entre authentification et autorisation ?"
      en: "What is the difference between authentication and authorization?"
    options:
      fr:
        - "L'authentification prouve qui vous êtes ; l'autorisation décide ce que vous pouvez faire"
        - "Ce sont deux mots pour la même chose"
        - "L'autorisation vient toujours avant l'authentification"
        - "L'authentification concerne uniquement les machines"
      en:
        - "Authentication proves who you are; authorization decides what you can do"
        - "They are two words for the same thing"
        - "Authorization always comes before authentication"
        - "Authentication concerns machines only"
    answer: 0
    why:
      fr: "L'authentification (authn) établit l'identité ; l'autorisation (authz) applique la politique. On s'authentifie d'abord, puis on vérifie les droits."
      en: "Authentication (authn) establishes identity; authorization (authz) enforces policy. You authenticate first, then check rights."
  - q:
      fr: "Un utilisateur connecté tente une action pour laquelle il n'a pas les droits. Quel code HTTP ?"
      en: "A logged-in user attempts an action they are not allowed to perform. Which HTTP code?"
    options:
      fr:
        - "401 Unauthorized"
        - "403 Forbidden"
        - "200 OK"
        - "500 Internal Server Error"
      en:
        - "401 Unauthorized"
        - "403 Forbidden"
        - "200 OK"
        - "500 Internal Server Error"
    answer: 1
    why:
      fr: "L'identité est prouvée (pas de 401), mais les droits manquent : c'est un `403 Forbidden`. Le 401 correspond à une authentification qui a échoué."
      en: "The identity is proven (no 401), but the rights are missing: it is a `403 Forbidden`. The 401 corresponds to a failed authentication."
  - q:
      fr: "Pourquoi attacher les permissions à des groupes plutôt qu'à chaque utilisateur ?"
      en: "Why attach permissions to groups rather than to each user?"
    options:
      fr:
        - "Parce que les utilisateurs n'ont pas de droits"
        - "Pour chiffrer les mots de passe"
        - "Pour gérer les droits en un seul endroit et simplifier arrivées et départs"
        - "Parce que les groupes sont obligatoires en HTTP"
      en:
        - "Because users have no rights"
        - "To encrypt passwords"
        - "To manage rights in one place and simplify onboarding and offboarding"
        - "Because groups are mandatory in HTTP"
    answer: 2
    why:
      fr: "Les permissions sur un groupe s'appliquent à tous ses membres. Intégrer ou retirer quelqu'un revient à changer son appartenance, sans retoucher des droits individuels dispersés."
      en: "Permissions on a group apply to all its members. Onboarding or removing someone is just changing membership, without reworking scattered individual rights."
  - q:
      fr: "Qu'est-ce qu'un rôle (role) en IAM ?"
      en: "What is a role in IAM?"
    options:
      fr:
        - "Un mot de passe permanent"
        - "Une identité temporaire qu'un principal endosse, avec des identifiants à courte durée"
        - "Un groupe d'adresses IP"
        - "Un type de pare-feu"
      en:
        - "A permanent password"
        - "A temporary identity a principal assumes, with short-lived credentials"
        - "A group of IP addresses"
        - "A type of firewall"
    answer: 1
    why:
      fr: "Un rôle porte des permissions et se fait endosser le temps d'une tâche, délivrant des identifiants temporaires. Une fuite expire d'elle-même, contrairement à un identifiant permanent."
      en: "A role carries permissions and is assumed for the duration of a task, issuing temporary credentials. A leak expires on its own, unlike a permanent credential."
  - q:
      fr: "Qu'est-ce qu'une identité de charge de travail (workload identity) ?"
      en: "What is a workload identity?"
    options:
      fr:
        - "Le mot de passe de l'administrateur"
        - "L'adresse e-mail d'un employé"
        - "Un numéro de téléphone pour le MFA"
        - "L'identité d'un service, conteneur ou fonction, authentifiée sans mot de passe humain"
      en:
        - "The administrator's password"
        - "An employee's email address"
        - "A phone number for MFA"
        - "The identity of a service, container or function, authenticated without a human password"
    answer: 3
    why:
      fr: "Une identité machine appartient à un logiciel, pas à une personne. Elle s'authentifie par certificat, token ou identité de plateforme, sans mot de passe humain partagé."
      en: "A machine identity belongs to software, not a person. It authenticates with a certificate, token or platform identity, with no shared human password."
