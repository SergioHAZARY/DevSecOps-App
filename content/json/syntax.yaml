description:
  fr: "Apprendre la syntaxe JSON : objets, tableaux, les six types de valeurs et les différences avec YAML."
  en: "Learn JSON syntax: objects, arrays, the six value types and the differences with YAML."
duration: 18

intro:
  fr: |
    **JSON** signifie *JavaScript Object Notation*. C'est le format d'échange de données le plus répandu au
    monde : les API web, les fichiers de configuration, les politiques de sécurité cloud, les réponses de
    presque tous les services parlent JSON. Savoir le lire et l'écrire est indispensable en DevSecOps.

    JSON est volontairement **minimaliste** : il n'a que deux structures (les objets et les tableaux) et six
    types de valeurs. Contrairement à YAML, il utilise des **accolades** et des **crochets** explicites plutôt
    que l'indentation, ce qui le rend moins piégeux mais plus verbeux.

    Imaginez une fiche d'identité très structurée : un nom entre guillemets, une liste de compétences entre
    crochets, le tout entre accolades. Dans cette leçon vous apprendrez les règles exactes de JSON (notamment
    les pièges des guillemets et des virgules) et ce qui le distingue de YAML.
  en: |
    **JSON** stands for *JavaScript Object Notation*. It is the most widespread data-exchange format in the
    world: web APIs, configuration files, cloud security policies, and the responses of almost every service
    speak JSON. Being able to read and write it is essential in DevSecOps.

    JSON is deliberately **minimal**: it has only two structures (objects and arrays) and six value types.
    Unlike YAML, it uses explicit **braces** and **brackets** rather than indentation, which makes it less
    error-prone but more verbose.

    Picture a highly structured ID card: a name in quotes, a list of skills in brackets, all wrapped in braces.
    In this lesson you will learn JSON's exact rules (notably the quote and comma traps) and what sets it apart
    from YAML.

sections:
  - heading:
      fr: "Objets, tableaux et types"
      en: "Objects, arrays and types"
    body:
      fr: |
        JSON repose sur deux structures :

        - un **objet** `{ ... }` : un ensemble de paires `"clé": valeur`, séparées par des virgules ;
        - un **tableau** `[ ... ]` : une liste ordonnée de valeurs, séparées par des virgules.

        Une valeur peut être de **six types** seulement :

        | Type | Exemple |
        |---|---|
        | chaîne | `"hello"` (toujours entre guillemets doubles) |
        | nombre | `42`, `3.14`, `-7` |
        | booléen | `true`, `false` |
        | null | `null` |
        | objet | `{ "a": 1 }` |
        | tableau | `[1, 2, 3]` |

        Règles strictes : les **clés sont toujours des chaînes entre guillemets doubles**, et il n'y a **pas de
        virgule après le dernier élément** (*trailing comma* interdit). JSON **n'autorise pas les commentaires**.
      en: |
        JSON rests on two structures:

        - an **object** `{ ... }`: a set of `"key": value` pairs, separated by commas;
        - an **array** `[ ... ]`: an ordered list of values, separated by commas.

        A value can be one of only **six types**:

        | Type | Example |
        |---|---|
        | string | `"hello"` (always in double quotes) |
        | number | `42`, `3.14`, `-7` |
        | boolean | `true`, `false` |
        | null | `null` |
        | object | `{ "a": 1 }` |
        | array | `[1, 2, 3]` |

        Strict rules: **keys are always strings in double quotes**, and there is **no comma after the last
        element** (trailing comma forbidden). JSON **does not allow comments**.
  - heading:
      fr: "JSON contre YAML"
      en: "JSON versus YAML"
    body:
      fr: |
        JSON et YAML représentent les mêmes données ; ils sont d'ailleurs convertibles l'un en l'autre (tout
        JSON est du YAML valide). Leurs différences pratiques :

        | Critère | JSON | YAML |
        |---|---|---|
        | Délimiteurs | accolades `{}` et crochets `[]` | indentation |
        | Guillemets des clés | obligatoires | optionnels |
        | Commentaires | interdits | autorisés (`#`) |
        | Virgule finale | interdite | sans objet |
        | Lisibilité | plus verbeux | plus léger |
        | Usage typique | API, échanges machine-à-machine | fichiers de config écrits à la main |

        En clair : **YAML pour écrire à la main**, **JSON pour les échanges entre programmes**. Un même outil
        (par exemple une politique AWS) peut exiger du JSON strict même si vous préférez YAML.
      en: |
        JSON and YAML represent the same data; in fact they convert into each other (any JSON is valid YAML).
        Their practical differences:

        | Criterion | JSON | YAML |
        |---|---|---|
        | Delimiters | braces `{}` and brackets `[]` | indentation |
        | Key quotes | mandatory | optional |
        | Comments | forbidden | allowed (`#`) |
        | Trailing comma | forbidden | not applicable |
        | Readability | more verbose | lighter |
        | Typical use | APIs, machine-to-machine | hand-written config files |

        In short: **YAML to write by hand**, **JSON for exchanges between programs**. A given tool (an AWS policy,
        for instance) may require strict JSON even if you prefer YAML.

examples:
  - title:
      fr: "Un objet JSON valide et complet"
      en: "A valid, complete JSON object"
    file: user.json
    lang: json
    kind: neutral
    code: |
      {
        "name": "alice",
        "active": true,
        "age": 30,
        "roles": ["admin", "auditor"],
        "manager": null,
        "settings": {
          "theme": "dark",
          "mfa": true
        }
      }
    output: |
      name     -> alice (string)
      active   -> true (boolean)
      roles    -> 2 items (array)
      manager  -> null
      settings -> object with 2 keys
    note:
      fr: "Les six types sont présents : chaîne, booléen, nombre, tableau, null et objet imbriqué. Toutes les clés sont entre guillemets doubles."
      en: "All six types appear: string, boolean, number, array, null and a nested object. Every key is in double quotes."

  - title:
      fr: "JSON invalide : les erreurs classiques"
      en: "Invalid JSON: the classic mistakes"
    file: broken.json
    lang: json
    kind: vulnerable
    code: |
      {
        'name': 'alice',
        "age": 30,
        "roles": ["admin", "auditor",],
        "comment": "trailing comma above is illegal"
      }
    output: |
      Error: single quotes are not allowed (use double quotes)
      Error: trailing comma in array ["admin", "auditor",]
    note:
      fr: "Fichier volontairement invalide (`kind: vulnerable`) : guillemets simples interdits et virgule finale après `\"auditor\"`. JSON exige des guillemets doubles et pas de virgule traînante."
      en: "Intentionally invalid file (`kind: vulnerable`): single quotes are forbidden and a trailing comma follows `\"auditor\"`. JSON requires double quotes and no trailing comma."

  - title:
      fr: "Lire et écrire du JSON en Python"
      en: "Reading and writing JSON in Python"
    file: parse_json.py
    lang: python
    kind: neutral
    code: |
      import json

      text = '{"name": "alice", "roles": ["admin", "auditor"], "mfa": true}'

      # json.loads parses a JSON string into Python objects
      data = json.loads(text)
      print(type(data["roles"]).__name__, data["roles"])  # list
      print("MFA enabled:", data["mfa"])                   # Python bool True

      # json.dumps serializes back to JSON; indent=2 pretty-prints it
      print(json.dumps(data, indent=2))
    output: |
      list ['admin', 'auditor']
      MFA enabled: True
      {
        "name": "alice",
        "roles": [
          "admin",
          "auditor"
        ],
        "mfa": true
      }
    note:
      fr: "`json.loads` transforme le texte en objets Python (le tableau JSON devient une `list`) ; `json.dumps(..., indent=2)` fait l'inverse en format lisible."
      en: "`json.loads` turns the text into Python objects (the JSON array becomes a `list`); `json.dumps(..., indent=2)` does the reverse in a readable form."

mistake:
  fr: |
    **Utiliser des guillemets simples, laisser une virgule finale ou ajouter des commentaires.**

    Ce sont les trois erreurs les plus fréquentes, souvent par habitude de JavaScript ou de Python. En JSON
    **strict** : les chaînes et les clés utilisent des **guillemets doubles** (`"clé"`, jamais `'clé'`), il n'y
    a **jamais de virgule après le dernier élément**, et les **commentaires sont interdits**. Si vous avez besoin
    de commenter, ajoutez un champ `"_comment": "..."` ou passez par YAML, puis convertissez.
  en: |
    **Using single quotes, leaving a trailing comma or adding comments.**

    These are the three most common mistakes, often from JavaScript or Python habits. In **strict** JSON: strings
    and keys use **double quotes** (`"key"`, never `'key'`), there is **never a comma after the last element**,
    and **comments are forbidden**. If you need a comment, add a `"_comment": "..."` field or use YAML and then
    convert.

bestPractice:
  fr: |
    - **Guillemets doubles partout** : pour les clés comme pour les chaînes.
    - **Pas de virgule finale** : supprimez-la après le dernier élément d'un objet ou d'un tableau.
    - **Validez** avec `python -m json.tool fichier.json` ou `jq . fichier.json` avant de livrer.
    - **Choisissez le bon format** : YAML pour les fichiers écrits à la main, JSON pour les échanges machine.
    - **Utilisez un champ `_comment`** si vous devez documenter du JSON strict.
  en: |
    - **Double quotes everywhere**: for keys as well as strings.
    - **No trailing comma**: remove it after the last element of an object or array.
    - **Validate** with `python -m json.tool file.json` or `jq . file.json` before shipping.
    - **Pick the right format**: YAML for hand-written files, JSON for machine exchanges.
    - **Use a `_comment` field** if you must document strict JSON.

exercise:
  statement:
    fr: |
      Le JSON suivant est invalide. Trouvez les trois erreurs et réécrivez une version strictement valide.

      ```text
      {
        'service': "billing",
        "ports": [80, 443,],
        // main port is 443
        "tls": true
      }
      ```
    en: |
      The following JSON is invalid. Find the three errors and rewrite a strictly valid version.

      ```text
      {
        'service': "billing",
        "ports": [80, 443,],
        // main port is 443
        "tls": true
      }
      ```
  solution:
    file: solution.json
    lang: json
    code: |
      {
        "service": "billing",
        "ports": [80, 443],
        "tls": true
      }
    note:
      fr: "Corrections : `'service'` → `\"service\"` (guillemets doubles), suppression de la virgule après `443`, suppression du commentaire `//` interdit en JSON."
      en: "Fixes: `'service'` → `\"service\"` (double quotes), removed the comma after `443`, removed the `//` comment forbidden in JSON."

quiz:
  - q:
      fr: "Quel type de guillemets JSON exige-t-il pour les chaînes et les clés ?"
      en: "Which kind of quotes does JSON require for strings and keys?"
    options:
      fr: ["Des guillemets doubles", "Des guillemets simples", "Des accents graves", "Aucun"]
      en: ["Double quotes", "Single quotes", "Backticks", "None"]
    answer: 0
    why:
      fr: "JSON n'accepte que les guillemets doubles ; `'clé'` est invalide, il faut `\"clé\"`."
      en: "JSON only accepts double quotes; `'key'` is invalid, you must write `\"key\"`."
  - q:
      fr: "Combien de types de valeurs JSON définit-il ?"
      en: "How many value types does JSON define?"
    options:
      fr: ["Quatre", "Six", "Huit", "Dix"]
      en: ["Four", "Six", "Eight", "Ten"]
    answer: 1
    why:
      fr: "Chaîne, nombre, booléen, null, objet et tableau : six types au total."
      en: "String, number, boolean, null, object and array: six types in total."
  - q:
      fr: "Laquelle de ces constructions est interdite en JSON ?"
      en: "Which of these is forbidden in JSON?"
    options:
      fr:
        - "Un tableau vide []"
        - "La valeur null"
        - "Une virgule après le dernier élément"
        - "Un objet imbriqué"
      en:
        - "An empty array []"
        - "The value null"
        - "A comma after the last element"
        - "A nested object"
    answer: 2
    why:
      fr: "La virgule finale (*trailing comma*) est interdite ; les autres constructions sont parfaitement valides."
      en: "The trailing comma is forbidden; the other constructions are perfectly valid."
  - q:
      fr: "Quelle différence majeure distingue JSON de YAML ?"
      en: "What major difference sets JSON apart from YAML?"
    options:
      fr:
        - "JSON autorise les commentaires, pas YAML"
        - "JSON utilise des accolades/crochets au lieu de l'indentation et interdit les commentaires"
        - "JSON ne peut pas contenir de tableaux"
        - "JSON n'a pas de type booléen"
      en:
        - "JSON allows comments, YAML does not"
        - "JSON uses braces/brackets instead of indentation and forbids comments"
        - "JSON cannot contain arrays"
        - "JSON has no boolean type"
    answer: 1
    why:
      fr: "JSON s'appuie sur `{}` et `[]` explicites et interdit les commentaires, là où YAML utilise l'indentation et autorise `#`."
      en: "JSON relies on explicit `{}` and `[]` and forbids comments, whereas YAML uses indentation and allows `#`."
  - q:
      fr: "En Python, quelle fonction transforme une chaîne JSON en objets Python ?"
      en: "In Python, which function turns a JSON string into Python objects?"
    options:
      fr: ["json.dumps", "json.print", "json.parse", "json.loads"]
      en: ["json.dumps", "json.print", "json.parse", "json.loads"]
    answer: 3
    why:
      fr: "`json.loads` lit (*load string*) le texte JSON ; `json.dumps` fait l'inverse en produisant du texte."
      en: "`json.loads` reads (load string) the JSON text; `json.dumps` does the reverse by producing text."
