description:
  fr: "Lire, chercher et filtrer du texte sous Linux avec cat, grep, find et les pipes, pour fouiller des fichiers et des journaux comme un pro."
  en: "Read, search and filter text on Linux with cat, grep, find and pipes, to dig through files and logs like a pro."
duration: 22

intro:
  fr: |
    Sous Linux, **presque tout est un fichier texte** : la configuration, les journaux, les listes
    d'utilisateurs. Savoir lire et fouiller ces fichiers est donc une compétence de base, utilisée tous les
    jours. En sécurité, c'est même l'essentiel : repérer une ligne suspecte dans un journal de connexions, c'est
    chercher du texte.

    Imaginez une immense bibliothèque sans moteur de recherche. Lire chaque livre page par page serait
    impossible. Il vous faut un bibliothécaire capable de retrouver instantanément toutes les pages qui citent
    un mot. Sous Linux, ce bibliothécaire s'appelle **grep**. Et pour retrouver les livres eux-mêmes par leur
    nom, c'est **find**.

    Dans cette leçon, vous allez afficher le contenu d'un fichier, y chercher un mot, retrouver des fichiers par
    leur nom, puis **enchaîner** ces commandes avec les *pipes* (`|`) pour composer des outils puissants à
    partir de petites briques simples.
  en: |
    On Linux, **almost everything is a text file**: configuration, logs, user lists. Knowing how to read and
    dig through these files is therefore a core skill, used every day. In security it is essential: spotting a
    suspicious line in a login log is searching text.

    Picture a huge library with no search engine. Reading every book page by page would be impossible. You need
    a librarian who can instantly find every page mentioning a word. On Linux, that librarian is called
    **grep**. And to find the books themselves by name, it is **find**.

    In this lesson you will display a file's contents, search it for a word, locate files by name, then **chain**
    these commands with *pipes* (`|`) to build powerful tools out of small, simple bricks.

sections:
  - heading:
      fr: "Lire un fichier"
      en: "Reading a file"
    body:
      fr: |
        Plusieurs commandes affichent un fichier, chacune pour un usage :

        | Commande | Usage |
        |---|---|
        | `cat fichier` | Affiche tout le contenu d'un coup (petit fichier) |
        | `less fichier` | Affiche page par page (gros fichier) ; `q` pour quitter |
        | `head -n 20 fichier` | Les 20 **premières** lignes |
        | `tail -n 20 fichier` | Les 20 **dernières** lignes |
        | `tail -f fichier` | Suit le fichier **en temps réel** (idéal pour un journal) |

        `tail -f` est un outil essentiel en exploitation : il affiche les nouvelles lignes au fur et à mesure
        qu'elles arrivent. Quand on cherche à comprendre pourquoi un service échoue, on lance `tail -f` sur son
        journal et on observe ce qui se passe en direct.
      en: |
        Several commands display a file, each for a purpose:

        | Command | Use |
        |---|---|
        | `cat file` | Show the whole content at once (small file) |
        | `less file` | Show it page by page (large file); `q` to quit |
        | `head -n 20 file` | The **first** 20 lines |
        | `tail -n 20 file` | The **last** 20 lines |
        | `tail -f file` | Follow the file **in real time** (ideal for a log) |

        `tail -f` is an essential operations tool: it prints new lines as they arrive. When trying to understand
        why a service is failing, you run `tail -f` on its log and watch what happens live.
  - heading:
      fr: "Chercher avec grep et find"
      en: "Searching with grep and find"
    body:
      fr: |
        Deux commandes complémentaires, à ne pas confondre :

        - **`grep`** cherche un **texte à l'intérieur** des fichiers. « Dans quels fichiers, et à quelles lignes,
          apparaît le mot *error* ? »
        - **`find`** cherche des **fichiers par leurs attributs** : nom, type, taille, date. « Où sont tous les
          fichiers qui se terminent par `.conf` ? »

        Les options les plus utiles de `grep` :

        | Option | Effet |
        |---|---|
        | `-i` | Ignore la casse (majuscules/minuscules) |
        | `-r` | Recherche récursive dans tous les sous-dossiers |
        | `-n` | Affiche le numéro de ligne |
        | `-c` | Compte le nombre de lignes qui correspondent |
        | `-v` | Inverse : montre les lignes qui **ne** correspondent **pas** |

        Et de `find` : `find . -name "*.log"` (par nom), `find . -type f` (fichiers seulement),
        `find . -mtime -1` (modifiés il y a moins d'un jour). En sécurité, `find / -perm -4000` retrouve les
        programmes à droits spéciaux (vu dans la leçon sur les permissions).
      en: |
        Two complementary commands, not to be confused:

        - **`grep`** searches for **text inside** files. "In which files, and at which lines, does the word
          *error* appear?"
        - **`find`** searches for **files by their attributes**: name, type, size, date. "Where are all the
          files ending in `.conf`?"

        The most useful `grep` options:

        | Option | Effect |
        |---|---|
        | `-i` | Ignore case (upper/lower) |
        | `-r` | Recursive search through all sub-folders |
        | `-n` | Show the line number |
        | `-c` | Count the matching lines |
        | `-v` | Invert: show lines that do **not** match |

        And for `find`: `find . -name "*.log"` (by name), `find . -type f` (files only),
        `find . -mtime -1` (modified less than a day ago). In security, `find / -perm -4000` locates programs
        with special rights (covered in the permissions lesson).
  - heading:
      fr: "Les pipes : enchaîner les commandes"
      en: "Pipes: chaining commands"
    body:
      fr: |
        La philosophie d'Unix est : *chaque outil fait une chose, bien, et on les combine*. Le **pipe** (`|`)
        envoie la sortie d'une commande dans l'entrée de la suivante, comme un tuyau. On construit ainsi des
        chaînes de traitement.

        Quelques briques qu'on ajoute souvent au bout d'un pipe :

        | Commande | Rôle |
        |---|---|
        | `wc -l` | Compte les lignes |
        | `sort` | Trie |
        | `uniq -c` | Regroupe les lignes identiques et les compte |
        | `cut -d: -f1` | Garde un champ (ici le 1er, séparé par `:`) |
        | `head` / `tail` | Garde le début / la fin |

        Exemple classique en analyse de journaux : trouver les 3 adresses IP qui ont le plus tenté de se
        connecter. On extrait l'IP (`cut`), on trie (`sort`), on compte les doublons (`uniq -c`), on trie par
        nombre (`sort -nr`), on garde le top 3 (`head -3`). Cinq petites briques, un outil d'analyse complet.
      en: |
        The Unix philosophy is: *each tool does one thing, well, and you combine them*. The **pipe** (`|`) sends
        one command's output into the next command's input, like a pipe. This builds processing chains.

        A few bricks often added at the end of a pipe:

        | Command | Role |
        |---|---|
        | `wc -l` | Count lines |
        | `sort` | Sort |
        | `uniq -c` | Group identical lines and count them |
        | `cut -d: -f1` | Keep one field (here the 1st, separated by `:`) |
        | `head` / `tail` | Keep the start / the end |

        A classic log-analysis example: find the 3 IP addresses that tried to connect the most. You extract the
        IP (`cut`), sort (`sort`), count duplicates (`uniq -c`), sort by count (`sort -nr`), keep the top 3
        (`head -3`). Five small bricks, one complete analysis tool.

examples:
  - title:
      fr: "Lire un journal et suivre son évolution"
      en: "Reading a log and following its changes"
    file: read-log.sh
    lang: bash
    kind: neutral
    code: |
      # Show the last 5 lines of the authentication log
      tail -n 5 /var/log/auth.log

      # Show only the first 3 lines of a config file
      head -n 3 /etc/ssh/sshd_config

      # Follow a log in real time (new lines appear live); Ctrl+C to stop
      tail -f /var/log/auth.log
    output: |
      Jun  3 10:41:02 server sshd[2043]: Accepted publickey for alice from 192.0.2.10 port 51224 ssh2
      Jun  3 10:42:17 server sudo:    alice : TTY=pts/0 ; PWD=/home/alice ; USER=root ; COMMAND=/usr/bin/apt update
      Jun  3 10:48:55 server sshd[2101]: Failed password for invalid user admin from 198.51.100.7 port 40112 ssh2
      Jun  3 10:48:58 server sshd[2101]: Failed password for invalid user admin from 198.51.100.7 port 40112 ssh2
      Jun  3 10:49:03 server sshd[2101]: Connection closed by invalid user admin 198.51.100.7 port 40112 [preauth]
    note:
      fr: "Ces cinq lignes racontent déjà une histoire : une connexion légitime par clé, un `sudo`, puis une machine (`198.51.100.7`) qui tente en vain le compte `admin`. `tail -f` permet de voir ces tentatives arriver en direct."
      en: "These five lines already tell a story: a legitimate key login, a `sudo`, then a machine (`198.51.100.7`) failing to log in as `admin`. `tail -f` lets you watch such attempts arrive live."

  - title:
      fr: "Chercher un texte et retrouver des fichiers"
      en: "Searching for text and locating files"
    file: search.sh
    lang: bash
    kind: neutral
    code: |
      # Count failed SSH login attempts, ignoring case
      grep -ic "failed password" /var/log/auth.log

      # Show matching lines WITH their line numbers
      grep -n "Failed password" /var/log/auth.log

      # Find every .conf file under /etc (errors silenced with 2>/dev/null)
      find /etc -type f -name "*.conf" 2>/dev/null | head -n 4
    output: |
      2
      37:Jun  3 10:48:55 server sshd[2101]: Failed password for invalid user admin from 198.51.100.7 port 40112 ssh2
      38:Jun  3 10:48:58 server sshd[2101]: Failed password for invalid user admin from 198.51.100.7 port 40112 ssh2
      /etc/ssh/ssh_config.d/50-redirect.conf
      /etc/ufw/sysctl.conf
      /etc/ca-certificates.conf
      /etc/resolv.conf
    note:
      fr: "`grep -c` compte, `grep -n` localise, `find -name` retrouve des fichiers par motif. Le `2>/dev/null` jette les messages d'erreur « permission refusée » pour ne garder que les résultats utiles."
      en: "`grep -c` counts, `grep -n` locates, `find -name` finds files by pattern. The `2>/dev/null` discards \"permission denied\" error messages to keep only the useful results."

  - title:
      fr: "Un pipe d'analyse : les IP les plus bruyantes"
      en: "An analysis pipe: the noisiest IPs"
    file: top-attackers.sh
    lang: bash
    kind: secure
    code: |
      # Which IP addresses failed to log in the most? Built from small bricks:
      grep "Failed password" /var/log/auth.log \
        | grep -oE "from [0-9.]+" \
        | awk '{print $2}' \
        | sort \
        | uniq -c \
        | sort -nr \
        | head -n 3
      #  grep  : keep failed-login lines
      #  grep -oE: keep only "from <ip>"
      #  awk   : keep the IP itself
      #  sort | uniq -c: group and count identical IPs
      #  sort -nr | head: most frequent first, top 3
    output: |
           14 198.51.100.7
            6 203.0.113.42
            2 192.0.2.55
    note:
      fr: "Six petites commandes enchaînées produisent un vrai outil d'analyse : `198.51.100.7` a échoué 14 fois, un signe clair d'attaque par force brute. C'est toute la puissance des pipes : combiner des briques simples."
      en: "Six small chained commands produce a real analysis tool: `198.51.100.7` failed 14 times, a clear sign of a brute-force attack. That is the power of pipes: combining simple bricks."

mistake:
  fr: |
    **Confondre `grep` et `find`, ou oublier les guillemets autour d'un motif.**

    `grep` cherche du **texte dans** les fichiers ; `find` cherche des **fichiers** par leur nom ou leurs
    attributs. Les intervertir ne donne rien d'utile. Autre piège classique : écrire `find . -name *.log` sans
    guillemets. Le shell remplace `*.log` par les fichiers du dossier courant **avant** que `find` ne s'exécute,
    ce qui casse la commande. Mettez toujours le motif entre guillemets : `find . -name "*.log"`.
  en: |
    **Confusing `grep` and `find`, or forgetting the quotes around a pattern.**

    `grep` searches for **text inside** files; `find` searches for **files** by name or attributes. Swapping
    them gives nothing useful. Another classic trap: writing `find . -name *.log` without quotes. The shell
    replaces `*.log` with the current folder's files **before** `find` runs, breaking the command. Always quote
    the pattern: `find . -name "*.log"`.

bestPractice:
  fr: |
    - **`grep` pour le contenu, `find` pour les fichiers** : choisissez le bon outil selon ce que vous cherchez.
    - **Toujours entre guillemets** : `find . -name "*.log"` évite que le shell interprète l'étoile trop tôt.
    - **`tail -f` pour diagnostiquer en direct** : observez un journal pendant que vous reproduisez un problème.
    - **Composez avec des pipes** : de petites commandes enchaînées valent mieux qu'un gros outil unique.
    - **`grep -i` et `-n`** : ignorez la casse et affichez les numéros de ligne pour aller droit au but.
    - **Jetez le bruit avec `2>/dev/null`** quand `find` parcourt des dossiers protégés et affiche des erreurs.
  en: |
    - **`grep` for content, `find` for files**: pick the right tool for what you are looking for.
    - **Always quote**: `find . -name "*.log"` stops the shell expanding the star too early.
    - **`tail -f` to diagnose live**: watch a log while you reproduce a problem.
    - **Compose with pipes**: small chained commands beat one big single tool.
    - **`grep -i` and `-n`**: ignore case and show line numbers to go straight to the point.
    - **Drop the noise with `2>/dev/null`** when `find` crosses protected folders and prints errors.

exercise:
  statement:
    fr: |
      À partir d'un fichier de journal, entraînez-vous à lire, chercher et composer :

      1. Créez un fichier `access.log` contenant quelques lignes, dont plusieurs avec le mot `ERROR`.
      2. Comptez combien de lignes contiennent `ERROR` (sans tenir compte de la casse).
      3. Affichez ces lignes avec leur numéro de ligne.
      4. Construisez un pipe qui affiche les 3 mots-clés de niveau (`INFO`, `WARN`, `ERROR`) les plus fréquents, triés du plus au moins fréquent.

      Notez vos commandes dans votre dépôt de suivi.
    en: |
      From a log file, practise reading, searching and composing:

      1. Create an `access.log` file with a few lines, several containing the word `ERROR`.
      2. Count how many lines contain `ERROR` (case-insensitive).
      3. Show those lines with their line numbers.
      4. Build a pipe that prints the 3 most frequent level keywords (`INFO`, `WARN`, `ERROR`), sorted from most to least frequent.

      Record your commands in your tracking repository.
  solution:
    file: solution.sh
    lang: bash
    code: |
      # 1. Create a small log file
      cat > access.log <<'EOF'
      2027-06-03 10:00 INFO  server started
      2027-06-03 10:01 WARN  disk almost full
      2027-06-03 10:02 ERROR database unreachable
      2027-06-03 10:03 INFO  retry scheduled
      2027-06-03 10:04 ERROR database unreachable
      EOF

      # 2. Count lines containing ERROR, ignoring case
      grep -ic "error" access.log

      # 3. Show those lines with their line numbers
      grep -n "ERROR" access.log

      # 4. Top 3 level keywords, most frequent first
      awk '{print $3}' access.log | sort | uniq -c | sort -nr | head -n 3
    note:
      fr: "`awk '{print $3}'` extrait le 3ᵉ champ (le niveau), `sort | uniq -c` regroupe et compte, `sort -nr` classe du plus grand au plus petit. Le même schéma sert à analyser n'importe quel journal."
      en: "`awk '{print $3}'` extracts the 3rd field (the level), `sort | uniq -c` groups and counts, `sort -nr` ranks largest to smallest. The same pattern analyses any log."

quiz:
  - q:
      fr: "Quelle commande suit un journal en temps réel ?"
      en: "Which command follows a log in real time?"
    options:
      fr: ["cat fichier", "tail -f fichier", "head fichier", "grep fichier"]
      en: ["cat file", "tail -f file", "head file", "grep file"]
    answer: 1
    why:
      fr: "`tail -f` affiche les nouvelles lignes au fur et à mesure qu'elles sont écrites : parfait pour observer un service en direct."
      en: "`tail -f` prints new lines as they are written: perfect to watch a service live."
  - q:
      fr: "Quelle est la différence entre `grep` et `find` ?"
      en: "What is the difference between `grep` and `find`?"
    options:
      fr:
        - "`grep` cherche du texte dans les fichiers, `find` cherche des fichiers par leurs attributs"
        - "`grep` est pour Windows, `find` pour Linux"
        - "Ils font exactement la même chose"
        - "`grep` supprime les fichiers, `find` les crée"
      en:
        - "`grep` searches text inside files, `find` searches files by their attributes"
        - "`grep` is for Windows, `find` for Linux"
        - "They do exactly the same thing"
        - "`grep` deletes files, `find` creates them"
    answer: 0
    why:
      fr: "`grep` fouille le contenu ; `find` localise des fichiers par nom, type, taille ou date. Ce sont deux besoins différents."
      en: "`grep` digs through content; `find` locates files by name, type, size or date. These are two different needs."
  - q:
      fr: "Que fait le pipe `|` ?"
      en: "What does the pipe `|` do?"
    options:
      fr:
        - "Il supprime la sortie d'une commande"
        - "Il envoie la sortie d'une commande dans l'entrée de la suivante"
        - "Il met la commande en arrière-plan"
        - "Il affiche l'aide de la commande"
      en:
        - "It deletes a command's output"
        - "It sends one command's output into the next command's input"
        - "It runs the command in the background"
        - "It shows the command's help"
    answer: 1
    why:
      fr: "Le pipe relie les commandes comme un tuyau : la sortie de l'une devient l'entrée de l'autre, ce qui permet de composer des traitements."
      en: "The pipe links commands like a tube: one command's output becomes the next one's input, letting you compose processing."
  - q:
      fr: "Pourquoi écrire `find . -name \"*.log\"` avec des guillemets ?"
      en: "Why write `find . -name \"*.log\"` with quotes?"
    options:
      fr:
        - "Pour que la commande soit plus lisible"
        - "Parce que find l'exige toujours"
        - "Pour éviter que le shell remplace `*.log` avant l'exécution de find"
        - "Pour chercher aussi dans les fichiers cachés"
      en:
        - "To make the command more readable"
        - "Because find always requires it"
        - "To stop the shell replacing `*.log` before find runs"
        - "To also search hidden files"
    answer: 2
    why:
      fr: "Sans guillemets, le shell développe `*.log` avec les fichiers du dossier courant avant que find ne démarre, ce qui fausse la recherche."
      en: "Without quotes, the shell expands `*.log` with the current folder's files before find starts, breaking the search."
  - q:
      fr: "Dans le pipe `... | sort | uniq -c | sort -nr`, que fait `uniq -c` ?"
      en: "In the pipe `... | sort | uniq -c | sort -nr`, what does `uniq -c` do?"
    options:
      fr:
        - "Il trie les lignes par ordre alphabétique"
        - "Il regroupe les lignes identiques et compte combien de fois chacune apparaît"
        - "Il supprime toutes les lignes"
        - "Il affiche uniquement la première ligne"
      en:
        - "It sorts lines alphabetically"
        - "It groups identical lines and counts how often each appears"
        - "It deletes all lines"
        - "It shows only the first line"
    answer: 1
    why:
      fr: "`uniq -c` compte les occurrences de chaque ligne (d'où le `sort` préalable qui regroupe les identiques) : c'est ce qui permet de classer par fréquence."
      en: "`uniq -c` counts each line's occurrences (hence the prior `sort` that groups identical ones): this is what lets you rank by frequency."
