description:
  fr: "Observer les processus qui tournent avec ps, top et kill, puis installer et mettre à jour des logiciels avec apt, en gardant un système sûr."
  en: "Observe running processes with ps, top and kill, then install and update software with apt, keeping the system secure."
duration: 22

intro:
  fr: |
    Un système Linux fait tourner en permanence des dizaines de programmes : votre terminal, le serveur web, la
    base de données, des tâches de fond. Chacun de ces programmes en cours d'exécution est un **processus**.
    Savoir lister les processus, repérer celui qui consomme toute la machine et l'arrêter proprement, c'est le
    quotidien de l'administration.

    Imaginez la cuisine d'un restaurant pendant le service. Chaque cuisinier est un processus : certains
    travaillent calmement, un autre monopolise les fourneaux, et parfois il faut en arrêter un qui bloque tout.
    Le chef a besoin d'une vue d'ensemble. Sous Linux, cette vue, c'est `ps` et `top`.

    L'autre moitié de la leçon concerne les **paquets** : les logiciels que l'on installe. Sous Linux, on ne
    télécharge pas des installateurs au hasard sur Internet ; on utilise un **gestionnaire de paquets** (`apt`
    sur Debian/Ubuntu) qui installe des logiciels vérifiés et surtout les **met à jour**. Garder ses paquets à
    jour est l'une des mesures de sécurité les plus efficaces qui soient.
  en: |
    A Linux system constantly runs dozens of programs: your terminal, the web server, the database, background
    tasks. Each of these running programs is a **process**. Knowing how to list processes, spot the one eating
    the whole machine and stop it cleanly is the daily bread of administration.

    Picture a restaurant kitchen during service. Each cook is a process: some work calmly, one hogs the stove,
    and sometimes you must stop one that is blocking everything. The head chef needs an overview. On Linux, that
    overview is `ps` and `top`.

    The other half of the lesson is about **packages**: the software you install. On Linux, you do not download
    random installers from the Internet; you use a **package manager** (`apt` on Debian/Ubuntu) that installs
    verified software and, above all, **updates** it. Keeping your packages up to date is one of the most
    effective security measures there is.

sections:
  - heading:
      fr: "Voir les processus : ps et top"
      en: "Seeing processes: ps and top"
    body:
      fr: |
        Chaque processus a un numéro unique, le **PID** (*Process ID*), et un propriétaire (l'utilisateur qui
        l'a lancé). Deux outils complémentaires :

        - **`ps`** donne une **photo** des processus à un instant. `ps aux` les liste tous, avec l'utilisateur,
          le PID, l'usage CPU et mémoire, et la commande.
        - **`top`** (ou le plus agréable **`htop`**) affiche un **tableau vivant**, rafraîchi en continu, trié
          par consommation. Idéal pour repérer en direct le processus qui surcharge la machine.

        | Colonne de `ps aux` | Signifie |
        |---|---|
        | USER | Qui a lancé le processus |
        | PID | Son numéro unique |
        | %CPU / %MEM | Part de processeur / mémoire utilisée |
        | COMMAND | La commande exécutée |

        En sécurité, `ps aux` sert à repérer un processus **inattendu** : un programme inconnu qui tourne sous un
        compte de service, ou un mineur de cryptomonnaie qui consomme 100 % du CPU, est un signe de compromission.
      en: |
        Each process has a unique number, the **PID** (*Process ID*), and an owner (the user who started it). Two
        complementary tools:

        - **`ps`** gives a **snapshot** of processes at one moment. `ps aux` lists them all, with the user, PID,
          CPU and memory usage, and the command.
        - **`top`** (or the nicer **`htop`**) shows a **live table**, refreshed continuously, sorted by usage.
          Ideal to spot the process overloading the machine in real time.

        | `ps aux` column | Means |
        |---|---|
        | USER | Who started the process |
        | PID | Its unique number |
        | %CPU / %MEM | Share of processor / memory used |
        | COMMAND | The command run |

        In security, `ps aux` helps spot an **unexpected** process: an unknown program running under a service
        account, or a cryptocurrency miner using 100% of the CPU, is a sign of compromise.
  - heading:
      fr: "Arrêter un processus : kill"
      en: "Stopping a process: kill"
    body:
      fr: |
        Quand un programme est bloqué ou indésirable, on l'arrête avec **`kill`**, en lui envoyant un **signal**
        par son PID. Les deux signaux à connaître :

        | Commande | Signal | Effet |
        |---|---|---|
        | `kill 2043` | `TERM` (15) | Demande polie : « termine proprement » |
        | `kill -9 2043` | `KILL` (9) | Ordre brutal : arrêt immédiat, sans ménagement |

        On essaie **toujours `kill` d'abord** (le signal `TERM`) : il laisse le programme fermer ses fichiers et
        finir proprement. On ne passe à `kill -9` que si le processus refuse de s'arrêter, car ce signal ne lui
        laisse aucune chance de ranger : on peut perdre des données.

        Pour arrêter un processus par son **nom** plutôt que par son PID, `pkill nginx` ou `killall nginx`. Mais
        attention : viser par nom peut arrêter plusieurs processus d'un coup. Vérifiez d'abord avec `ps aux | grep
        nginx` ce que vous allez réellement toucher.
      en: |
        When a program is stuck or unwanted, you stop it with **`kill`**, sending it a **signal** by its PID. The
        two signals to know:

        | Command | Signal | Effect |
        |---|---|---|
        | `kill 2043` | `TERM` (15) | Polite request: "finish cleanly" |
        | `kill -9 2043` | `KILL` (9) | Brutal order: immediate stop, no mercy |

        You **always try `kill` first** (the `TERM` signal): it lets the program close its files and finish
        cleanly. You only move to `kill -9` if the process refuses to stop, because that signal gives it no
        chance to tidy up: you can lose data.

        To stop a process by its **name** rather than its PID, `pkill nginx` or `killall nginx`. But beware:
        targeting by name can stop several processes at once. Check first with `ps aux | grep nginx` what you are
        actually going to hit.
  - heading:
      fr: "Les paquets : installer et surtout mettre à jour"
      en: "Packages: installing and above all updating"
    body:
      fr: |
        Un **gestionnaire de paquets** installe des logiciels depuis des **dépôts** officiels, signés
        cryptographiquement : vous êtes sûr que le logiciel vient bien de sa source et n'a pas été altéré. Sur
        Debian/Ubuntu, c'est `apt` ; sur RHEL/Fedora, c'est `dnf`.

        | Commande (apt) | Rôle |
        |---|---|
        | `sudo apt update` | Rafraîchit la **liste** des paquets disponibles |
        | `sudo apt upgrade` | Installe les mises à jour des paquets déjà présents |
        | `sudo apt install nginx` | Installe un paquet |
        | `sudo apt remove nginx` | Désinstalle un paquet |
        | `apt list --installed` | Liste ce qui est installé |

        Le point de sécurité **le plus important** : `sudo apt update && sudo apt upgrade` applique les correctifs
        de sécurité. Énormément d'intrusions exploitent une faille déjà corrigée, sur une machine qui n'a pas été
        mise à jour. Un système à jour est un système beaucoup plus difficile à attaquer. N'installez que des
        paquets dont vous avez besoin, et depuis les dépôts officiels : chaque logiciel inutile agrandit la
        surface d'attaque.
      en: |
        A **package manager** installs software from official **repositories**, cryptographically signed: you are
        sure the software really comes from its source and has not been tampered with. On Debian/Ubuntu it is
        `apt`; on RHEL/Fedora it is `dnf`.

        | Command (apt) | Role |
        |---|---|
        | `sudo apt update` | Refresh the **list** of available packages |
        | `sudo apt upgrade` | Install updates for packages already present |
        | `sudo apt install nginx` | Install a package |
        | `sudo apt remove nginx` | Uninstall a package |
        | `apt list --installed` | List what is installed |

        The **most important** security point: `sudo apt update && sudo apt upgrade` applies security fixes. A
        huge number of intrusions exploit an already-fixed flaw, on a machine that was never updated. An
        up-to-date system is a far harder system to attack. Install only the packages you need, and from official
        repositories: every useless program widens the attack surface.

examples:
  - title:
      fr: "Lister les processus et trouver les plus gourmands"
      en: "Listing processes and finding the greediest"
    file: list-processes.sh
    lang: bash
    kind: neutral
    code: |
      # Full snapshot of every process
      ps aux | head -n 4

      # The 3 processes using the most CPU (sorted on the %CPU column, 3rd field)
      ps aux --sort=-%cpu | head -n 4
    output: |
      USER       PID %CPU %MEM    VSZ   RSS TTY   STAT START   TIME COMMAND
      root         1  0.0  0.3 168140 11920 ?     Ss   09:00   0:02 /sbin/init
      www-data   812  0.1  1.2 721540 48220 ?     S    09:05   0:08 nginx: worker process
      alice     2043  0.0  0.2  18912  9200 pts/0 Ss   10:40   0:00 -bash
      USER       PID %CPU %MEM    VSZ   RSS TTY   STAT START   TIME COMMAND
      postgres   901 42.3  6.1 985000 240100 ?    S    09:05   3:12 postgres: query
      www-data   812  0.1  1.2 721540 48220 ?     S    09:05   0:08 nginx: worker process
      root         1  0.0  0.3 168140 11920 ?     Ss   09:00   0:02 /sbin/init
    note:
      fr: "Trié par CPU, on voit que `postgres` (PID 901) consomme 42 % : une requête lourde est en cours. `ps aux` révèle aussi qui possède chaque processus — un programme inconnu sous un compte de service mériterait une enquête."
      en: "Sorted by CPU, we see `postgres` (PID 901) using 42%: a heavy query is running. `ps aux` also reveals who owns each process — an unknown program under a service account would warrant investigation."

  - title:
      fr: "Arrêter proprement un processus bloqué"
      en: "Cleanly stopping a stuck process"
    file: stop-process.sh
    lang: bash
    kind: secure
    code: |
      # Find the PID of a stuck process by name
      ps aux | grep '[s]tuck-app'

      # Ask it politely to stop (TERM): it can close files and exit cleanly
      kill 3156

      # Still there after a few seconds? Force it (KILL) - last resort only
      kill -9 3156
    output: |
      alice     3156 99.0  0.5  22140  9800 pts/1 R    11:50   2:30 ./stuck-app
    note:
      fr: "On repère le PID (3156), on tente d'abord `kill` (signal poli), et seulement si le processus s'obstine on utilise `kill -9`. Le `grep '[s]tuck-app'` est une astuce pour que `grep` n'apparaisse pas lui-même dans les résultats."
      en: "You find the PID (3156), first try `kill` (polite signal), and only if the process persists do you use `kill -9`. The `grep '[s]tuck-app'` trick stops `grep` itself from appearing in the results."

  - title:
      fr: "Mettre le système à jour : le réflexe de sécurité n°1"
      en: "Updating the system: security reflex #1"
    file: update-system.sh
    lang: bash
    kind: secure
    code: |
      #!/usr/bin/env bash
      set -eu

      # 1. Refresh the list of available packages
      sudo apt update

      # 2. Apply all available updates, including security fixes
      sudo apt upgrade -y

      # 3. Install a needed tool from the official repositories
      sudo apt install -y htop
    output: |
      Hit:1 http://archive.ubuntu.com/ubuntu noble InRelease
      Get:2 http://security.ubuntu.com/ubuntu noble-security InRelease [126 kB]
      Fetched 126 kB in 1s (120 kB/s)
      Reading package lists... Done
      4 packages can be upgraded. Run 'apt list --upgradable' to see them.
      The following packages will be upgraded:
        libssl3 openssl openssh-server openssh-client
      4 upgraded, 0 newly installed, 0 to remove.
    note:
      fr: "Ici la mise à jour corrige `openssl` et `openssh` : exactement le genre de correctifs de sécurité qu'il ne faut jamais repousser. Un `apt update && apt upgrade` régulier ferme des failles avant qu'un attaquant ne les exploite."
      en: "Here the update fixes `openssl` and `openssh`: exactly the kind of security patch you must never postpone. A regular `apt update && apt upgrade` closes flaws before an attacker exploits them."

mistake:
  fr: |
    **Utiliser `kill -9` d'emblée, ou installer des logiciels hors des dépôts officiels.**

    Dégainer `kill -9` à la première difficulté ne laisse au programme aucune chance de fermer ses fichiers : on
    risque de corrompre des données (une base de données coupée brutalement, par exemple). Essayez toujours
    `kill` (signal `TERM`) d'abord. Côté logiciels, télécharger un paquet « .deb » trouvé sur un site inconnu ou
    copier-coller un `curl ... | sudo bash` sans le lire, c'est exécuter du code non vérifié en root : la porte
    ouverte aux logiciels malveillants. Préférez toujours les dépôts officiels signés.
  en: |
    **Reaching for `kill -9` immediately, or installing software outside official repositories.**

    Pulling out `kill -9` at the first hiccup gives the program no chance to close its files: you risk corrupting
    data (a database cut off abruptly, for example). Always try `kill` (the `TERM` signal) first. On the software
    side, downloading a ".deb" package from an unknown site or pasting a `curl ... | sudo bash` without reading
    it means running unverified code as root: the open door to malware. Always prefer signed, official
    repositories.

bestPractice:
  fr: |
    - **`ps aux` pour enquêter** : repérez les processus inattendus ou trop gourmands, et qui les possède.
    - **`kill` avant `kill -9`** : laissez d'abord le programme s'arrêter proprement ; la force est un dernier recours.
    - **Vérifiez avant de viser par nom** : `ps aux | grep` montre ce que `pkill` toucherait réellement.
    - **Mettez à jour régulièrement** : `apt update && apt upgrade` applique les correctifs de sécurité, priorité absolue.
    - **Dépôts officiels uniquement** : n'exécutez jamais en root un script téléchargé sans l'avoir lu.
    - **Moins, c'est mieux** : désinstallez les paquets inutiles ; chaque logiciel en plus agrandit la surface d'attaque.
  en: |
    - **`ps aux` to investigate**: spot unexpected or greedy processes, and who owns them.
    - **`kill` before `kill -9`**: let the program stop cleanly first; force is a last resort.
    - **Check before targeting by name**: `ps aux | grep` shows what `pkill` would actually hit.
    - **Update regularly**: `apt update && apt upgrade` applies security fixes, the top priority.
    - **Official repositories only**: never run a downloaded script as root without reading it.
    - **Less is more**: uninstall useless packages; every extra program widens the attack surface.

exercise:
  statement:
    fr: |
      Dans votre VM, entraînez-vous à observer, arrêter et mettre à jour :

      1. Lancez un processus de fond qui occupe le terminal (par exemple `sleep 600 &`).
      2. Retrouvez son PID avec `ps`.
      3. Arrêtez-le proprement (sans `-9`).
      4. Affichez les trois processus qui consomment le plus de mémoire.
      5. Rafraîchissez la liste des paquets et affichez combien de mises à jour sont disponibles.

      Notez vos commandes dans votre dépôt de suivi.
    en: |
      In your VM, practise observing, stopping and updating:

      1. Start a background process that occupies the terminal (for example `sleep 600 &`).
      2. Find its PID with `ps`.
      3. Stop it cleanly (without `-9`).
      4. Show the three processes using the most memory.
      5. Refresh the package list and show how many updates are available.

      Record your commands in your tracking repository.
  solution:
    file: solution.sh
    lang: bash
    code: |
      # 1. Start a background process (& puts it in the background)
      sleep 600 &

      # 2. Find its PID (the shell also printed it when launched)
      ps aux | grep '[s]leep 600'

      # 3. Stop it cleanly with TERM (replace 3200 with the real PID)
      kill 3200

      # 4. Top 3 memory consumers (sort on the %MEM column)
      ps aux --sort=-%mem | head -n 4

      # 5. Refresh package lists and count available upgrades
      sudo apt update
      apt list --upgradable 2>/dev/null | grep -c upgradable
    note:
      fr: "`&` lance la commande en arrière-plan. On arrête avec un simple `kill` (signal poli), pas `kill -9`. `ps aux --sort=-%mem` classe par mémoire ; `apt update` prépare le terrain pour voir les mises à jour."
      en: "`&` runs the command in the background. You stop it with a plain `kill` (polite signal), not `kill -9`. `ps aux --sort=-%mem` ranks by memory; `apt update` sets the stage to see the updates."

quiz:
  - q:
      fr: "Qu'est-ce qu'un PID ?"
      en: "What is a PID?"
    options:
      fr:
        - "Le numéro unique d'un processus en cours d'exécution"
        - "Le mot de passe d'un utilisateur"
        - "Le nom d'un paquet"
        - "Une permission de fichier"
      en:
        - "The unique number of a running process"
        - "A user's password"
        - "The name of a package"
        - "A file permission"
    answer: 0
    why:
      fr: "Le PID (Process ID) identifie de façon unique chaque processus ; on l'utilise par exemple avec `kill` pour arrêter un programme précis."
      en: "The PID (Process ID) uniquely identifies each process; you use it with `kill`, for example, to stop a specific program."
  - q:
      fr: "Pourquoi essayer `kill` avant `kill -9` ?"
      en: "Why try `kill` before `kill -9`?"
    options:
      fr:
        - "Parce que `kill -9` est plus lent"
        - "Parce que `kill` (signal TERM) laisse le programme se fermer proprement"
        - "Parce que `kill -9` n'existe pas"
        - "Parce que `kill` redémarre le processus"
      en:
        - "Because `kill -9` is slower"
        - "Because `kill` (TERM signal) lets the program close cleanly"
        - "Because `kill -9` does not exist"
        - "Because `kill` restarts the process"
    answer: 1
    why:
      fr: "Le signal TERM demande au programme de terminer proprement (fermer ses fichiers) ; `kill -9` l'arrête brutalement et peut corrompre des données."
      en: "The TERM signal asks the program to finish cleanly (close its files); `kill -9` stops it brutally and can corrupt data."
  - q:
      fr: "Quelle est la commande de sécurité la plus importante côté paquets ?"
      en: "What is the most important security command on the packages side?"
    options:
      fr:
        - "apt remove"
        - "apt list --installed"
        - "apt update && apt upgrade pour appliquer les correctifs de sécurité"
        - "apt search"
      en:
        - "apt remove"
        - "apt list --installed"
        - "apt update && apt upgrade to apply security fixes"
        - "apt search"
    answer: 2
    why:
      fr: "Beaucoup d'intrusions exploitent une faille déjà corrigée : garder ses paquets à jour ferme ces failles avant qu'elles ne soient exploitées."
      en: "Many intrusions exploit an already-fixed flaw: keeping packages updated closes those holes before they are exploited."
  - q:
      fr: "Pourquoi installer des logiciels depuis les dépôts officiels plutôt qu'un site au hasard ?"
      en: "Why install software from official repositories rather than a random site?"
    options:
      fr:
        - "Parce que c'est gratuit"
        - "Parce que les paquets y sont signés et vérifiés, donc non altérés"
        - "Parce que c'est plus rapide à télécharger"
        - "Parce que ça évite d'utiliser sudo"
      en:
        - "Because it is free"
        - "Because packages there are signed and verified, hence untampered"
        - "Because it downloads faster"
        - "Because it avoids using sudo"
    answer: 1
    why:
      fr: "Les dépôts officiels signent cryptographiquement leurs paquets : on est sûr que le logiciel vient bien de sa source et n'a pas été modifié par un attaquant."
      en: "Official repositories cryptographically sign their packages: you are sure the software comes from its source and was not modified by an attacker."
  - q:
      fr: "Quel outil affiche un tableau des processus rafraîchi en continu ?"
      en: "Which tool shows a continuously refreshed table of processes?"
    options:
      fr: ["cat", "apt", "chmod", "top (ou htop)"]
      en: ["cat", "apt", "chmod", "top (or htop)"]
    answer: 3
    why:
      fr: "`top` (ou `htop`) affiche un tableau vivant des processus trié par consommation, idéal pour repérer en direct celui qui surcharge la machine."
      en: "`top` (or `htop`) shows a live table of processes sorted by usage, ideal to spot in real time the one overloading the machine."
