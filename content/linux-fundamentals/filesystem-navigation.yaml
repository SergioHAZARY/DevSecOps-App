description:
  fr: "Comprendre l'arborescence Linux et se déplacer dans les dossiers avec pwd, ls, cd et les chemins, le tout premier geste de tout ingénieur."
  en: "Understand the Linux tree and move around folders with pwd, ls, cd and paths, the very first skill of every engineer."
duration: 18

intro:
  fr: |
    Avant de sécuriser quoi que ce soit, il faut savoir **se repérer** dans un système Linux. La quasi-totalité
    des serveurs du monde tournent sous Linux, et on les administre au **terminal** : une fenêtre où l'on tape
    des commandes au lieu de cliquer.

    Imaginez un grand immeuble de bureaux. Pour vous y retrouver, vous avez besoin de trois choses : savoir à
    quel étage vous êtes (*pwd*), voir ce qu'il y a dans la pièce (*ls*), et vous déplacer d'une pièce à l'autre
    (*cd*). C'est exactement ce que font les trois commandes de cette leçon. Les dossiers s'appellent des
    **répertoires**, et ils sont rangés en arbre, comme les étages et les couloirs d'un bâtiment.

    Dans cette leçon, vous allez ouvrir un terminal, afficher où vous êtes, lister des fichiers et vous promener
    dans l'arborescence. C'est le tout premier réflexe, celui sur lequel tout le reste repose.
  en: |
    Before securing anything, you must know how to **find your way** around a Linux system. Almost every server
    in the world runs Linux, and you administer it from the **terminal**: a window where you type commands
    instead of clicking.

    Picture a large office building. To get around, you need three things: to know which floor you are on
    (*pwd*), to see what is in the room (*ls*), and to move from room to room (*cd*). That is exactly what the
    three commands of this lesson do. Folders are called **directories**, and they are arranged in a tree, like
    the floors and corridors of a building.

    In this lesson you will open a terminal, show where you are, list files and walk through the tree. This is
    the very first reflex, the one everything else rests on.

sections:
  - heading:
      fr: "L'arbre des répertoires"
      en: "The directory tree"
    body:
      fr: |
        Sous Linux, tout part d'un seul répertoire tout en haut : la **racine**, notée `/` (une simple barre
        oblique). Tous les autres dossiers sont rangés dessous, comme les branches d'un arbre. Voici les
        répertoires que vous croiserez le plus souvent :

        | Répertoire | Contient | Analogie |
        |---|---|---|
        | `/` | La racine, le point de départ de tout | Le hall d'entrée |
        | `/home` | Les dossiers personnels des utilisateurs | Les appartements |
        | `/home/alice` | Les fichiers de l'utilisateur `alice` | L'appartement d'Alice |
        | `/etc` | Les fichiers de configuration du système | La salle des compteurs |
        | `/var/log` | Les journaux (logs) | Le registre des visites |
        | `/tmp` | Les fichiers temporaires | La corbeille du jour |
        | `/usr/bin` | Les programmes installés | La boîte à outils |

        Le symbole `~` (tilde) est un raccourci vers **votre** dossier personnel : pour `alice`, `~` veut dire
        `/home/alice`. Retenez `/` (la racine) et `~` (votre maison) : ce sont vos deux points de repère.
      en: |
        On Linux, everything starts from a single directory at the very top: the **root**, written `/` (a plain
        forward slash). Every other folder sits below it, like the branches of a tree. Here are the directories
        you will meet most often:

        | Directory | Holds | Analogy |
        |---|---|---|
        | `/` | The root, the starting point of everything | The lobby |
        | `/home` | Each user's personal folder | The flats |
        | `/home/alice` | User `alice`'s files | Alice's flat |
        | `/etc` | The system configuration files | The meter room |
        | `/var/log` | The logs | The visitors' register |
        | `/tmp` | Temporary files | Today's bin |
        | `/usr/bin` | Installed programs | The toolbox |

        The symbol `~` (tilde) is a shortcut to **your** personal folder: for `alice`, `~` means `/home/alice`.
        Remember `/` (the root) and `~` (your home): those are your two landmarks.
  - heading:
      fr: "Chemins absolus et chemins relatifs"
      en: "Absolute and relative paths"
    body:
      fr: |
        Un **chemin** (*path*) est l'adresse d'un fichier ou d'un dossier. Il en existe deux sortes :

        - Un **chemin absolu** commence par `/` et donne l'adresse complète depuis la racine, par exemple
          `/home/alice/notes.txt`. Il est toujours valable, où que vous soyez. C'est comme une adresse postale
          complète.
        - Un **chemin relatif** part de l'endroit où vous êtes *actuellement*, par exemple `notes.txt` ou
          `../photos`. C'est comme dire « la pièce d'à côté » : ça dépend d'où vous parlez.

        Deux raccourcis sont indispensables :

        | Symbole | Signifie |
        |---|---|
        | `.` | Le répertoire courant (ici) |
        | `..` | Le répertoire parent (un niveau au-dessus) |
        | `~` | Votre dossier personnel |
        | `-` | Le répertoire précédent (avec `cd`) |

        En sécurité, cette distinction compte : un script qui utilise un chemin relatif peut agir sur le mauvais
        dossier s'il est lancé d'un autre endroit. Pour les tâches sensibles, on préfère les chemins absolus.
      en: |
        A **path** is the address of a file or folder. There are two kinds:

        - An **absolute path** starts with `/` and gives the full address from the root, for example
          `/home/alice/notes.txt`. It is always valid, wherever you are. It is like a complete postal address.
        - A **relative path** starts from where you *currently* are, for example `notes.txt` or `../photos`. It
          is like saying "the room next door": it depends on where you speak from.

        Two shortcuts are essential:

        | Symbol | Means |
        |---|---|
        | `.` | The current directory (here) |
        | `..` | The parent directory (one level up) |
        | `~` | Your personal folder |
        | `-` | The previous directory (with `cd`) |

        In security this distinction matters: a script using a relative path can act on the wrong folder if it is
        launched from somewhere else. For sensitive tasks, absolute paths are preferred.

examples:
  - title:
      fr: "Où suis-je et qu'y a-t-il ici ?"
      en: "Where am I and what is here?"
    file: look-around.sh
    lang: bash
    kind: neutral
    code: |
      pwd          # print working directory: show the full path of where I am
      ls           # list: show the files and folders here
      ls -l        # long format: permissions, owner, size, date
      ls -la       # long format AND hidden files (names starting with a dot)
    output: |
      /home/alice
      Documents  Downloads  notes.txt  project
      total 20
      drwxr-xr-x 2 alice alice 4096 Jun  3 09:14 Documents
      drwxr-xr-x 2 alice alice 4096 Jun  3 09:14 Downloads
      -rw-r--r-- 1 alice alice   58 Jun  3 10:02 notes.txt
      drwxr-xr-x 3 alice alice 4096 Jun  3 09:40 project
      -rw------- 1 alice alice   12 Jun  3 10:05 .secret
    note:
      fr: "`ls -la` révèle le fichier caché `.secret` (les noms commençant par un point sont masqués par défaut). Les fichiers de configuration sensibles sont souvent cachés : pensez à `-a` quand vous cherchez un `.env` ou une clé."
      en: "`ls -la` reveals the hidden file `.secret` (names starting with a dot are hidden by default). Sensitive config files are often hidden: remember `-a` when hunting for a `.env` file or a key."

  - title:
      fr: "Se déplacer dans l'arborescence"
      en: "Moving through the tree"
    file: move-around.sh
    lang: bash
    kind: neutral
    code: |
      cd /etc            # go to an absolute path (the config directory)
      pwd
      cd ..              # go up one level, to the parent directory
      pwd
      cd ~               # go to my home folder (shortcut for /home/alice)
      pwd
      cd project/src     # go down using a relative path
      pwd
      cd -               # jump back to the previous directory
      pwd
    output: |
      /etc
      /
      /home/alice
      /home/alice/project/src
      /home/alice
    note:
      fr: "`cd ..` remonte, `cd ~` ramène à la maison, `cd -` fait l'aller-retour vers le dossier précédent. Taper `cd` tout seul, sans argument, revient aussi à votre dossier personnel : pratique quand on est perdu."
      en: "`cd ..` goes up, `cd ~` brings you home, `cd -` toggles back to the previous folder. Typing `cd` alone, with no argument, also returns to your home folder: handy when you are lost."

  - title:
      fr: "Explorer l'arbre et retrouver un fichier"
      en: "Exploring the tree and locating a file"
    file: explore.sh
    lang: bash
    kind: neutral
    code: |
      # Create a small folder structure to explore
      mkdir -p lab/configs lab/logs
      touch lab/configs/app.conf lab/logs/app.log

      # tree shows the structure visually (install with: sudo apt install tree)
      tree lab

      # realpath turns a relative path into a full absolute path
      realpath lab/configs/app.conf
    output: |
      lab
      ├── configs
      │   └── app.conf
      └── logs
          └── app.log

      3 directories, 2 files
      /home/alice/lab/configs/app.conf
    note:
      fr: "`mkdir -p` crée un dossier et tous ses parents d'un coup. `realpath` donne l'adresse absolue complète d'un fichier : utile pour vérifier exactement sur quoi un script va agir avant de le lancer."
      en: "`mkdir -p` creates a folder and all its parents at once. `realpath` gives a file's complete absolute address: useful to check exactly what a script will act on before running it."

mistake:
  fr: |
    **Confondre `/` et `~`, ou lancer une commande depuis le mauvais dossier.**

    `/` est la racine de tout le système ; `~` est votre petit dossier personnel. Un débutant qui tape une
    commande de suppression ou de copie en croyant être chez lui alors qu'il est à la racine peut faire de gros
    dégâts. Avant toute action qui modifie des fichiers, prenez le réflexe de taper `pwd` pour vérifier où vous
    êtes, et préférez les **chemins absolus** pour les opérations sensibles : ils ne dépendent pas de l'endroit
    d'où vous lancez la commande.
  en: |
    **Confusing `/` with `~`, or running a command from the wrong folder.**

    `/` is the root of the whole system; `~` is your small personal folder. A beginner who types a delete or
    copy command believing they are at home while actually at the root can cause real damage. Before any action
    that changes files, make it a reflex to type `pwd` to check where you are, and prefer **absolute paths** for
    sensitive operations: they do not depend on where you launch the command from.

bestPractice:
  fr: |
    - **`pwd` avant d'agir** : vérifiez toujours où vous êtes avant une commande qui modifie des fichiers.
    - **Chemins absolus pour les tâches sensibles** : un script fiable ne dépend pas du dossier d'où on le lance.
    - **`ls -la` pour ne rien manquer** : les fichiers de configuration et les secrets sont souvent cachés.
    - **La touche Tab** complète automatiquement les noms : moins de fautes de frappe, moins d'erreurs.
    - **`cd` sans argument** vous ramène chez vous : un repère sûr quand vous êtes perdu dans l'arborescence.
  en: |
    - **`pwd` before acting**: always check where you are before a command that changes files.
    - **Absolute paths for sensitive tasks**: a reliable script does not depend on the folder it is run from.
    - **`ls -la` to miss nothing**: config files and secrets are often hidden.
    - **The Tab key** auto-completes names: fewer typos, fewer mistakes.
    - **`cd` with no argument** brings you home: a safe landmark when lost in the tree.

exercise:
  statement:
    fr: |
      Dans votre VM Linux, entraînez-vous à vous repérer et à vous déplacer :

      1. Affichez le répertoire où vous êtes actuellement.
      2. Créez une arborescence `atelier/` contenant deux sous-dossiers `configs` et `donnees`, en une seule commande.
      3. Entrez dans `atelier/configs` et affichez son **chemin absolu** complet.
      4. Remontez d'un niveau, puis revenez directement dans le dossier précédent.
      5. Listez le contenu de `atelier/` en montrant aussi les fichiers cachés.

      Notez les commandes dans votre dépôt de suivi.
    en: |
      In your Linux VM, practise finding your way and moving around:

      1. Show the directory you are currently in.
      2. Create an `atelier/` tree containing two sub-folders `configs` and `donnees`, in a single command.
      3. Enter `atelier/configs` and show its full **absolute path**.
      4. Go up one level, then jump straight back to the previous folder.
      5. List the contents of `atelier/`, including hidden files.

      Record the commands in your tracking repository.
  solution:
    file: solution.sh
    lang: bash
    code: |
      # 1. Where am I?
      pwd

      # 2. Create the tree and both sub-folders in one command
      mkdir -p atelier/configs atelier/donnees

      # 3. Enter configs and print its absolute path
      cd atelier/configs
      pwd

      # 4. Up one level, then back to the previous directory
      cd ..
      cd -

      # 5. List atelier, including hidden files
      cd ~
      ls -la atelier
    note:
      fr: "`mkdir -p atelier/configs atelier/donnees` crée l'arbre complet en une commande. `cd -` fait l'aller-retour ; `ls -la` montre tout, y compris d'éventuels fichiers cachés."
      en: "`mkdir -p atelier/configs atelier/donnees` builds the whole tree in one command. `cd -` toggles back; `ls -la` shows everything, including any hidden files."

quiz:
  - q:
      fr: "Que représente le symbole `/` sous Linux ?"
      en: "What does the `/` symbol represent on Linux?"
    options:
      fr:
        - "La racine, le point de départ de toute l'arborescence"
        - "Votre dossier personnel"
        - "Le répertoire parent"
        - "Un fichier caché"
      en:
        - "The root, the starting point of the whole tree"
        - "Your personal folder"
        - "The parent directory"
        - "A hidden file"
    answer: 0
    why:
      fr: "`/` est la racine : tous les autres répertoires du système sont rangés en dessous, comme les branches d'un arbre."
      en: "`/` is the root: every other directory in the system sits below it, like the branches of a tree."
  - q:
      fr: "Quelle commande affiche le répertoire où vous vous trouvez ?"
      en: "Which command shows the directory you are in?"
    options:
      fr: ["ls", "cd", "pwd", "mkdir"]
      en: ["ls", "cd", "pwd", "mkdir"]
    answer: 2
    why:
      fr: "`pwd` (print working directory) affiche le chemin absolu complet de l'endroit où vous êtes."
      en: "`pwd` (print working directory) prints the full absolute path of where you are."
  - q:
      fr: "Que fait `cd ..` ?"
      en: "What does `cd ..` do?"
    options:
      fr:
        - "Il va dans votre dossier personnel"
        - "Il remonte d'un niveau, vers le répertoire parent"
        - "Il supprime le répertoire courant"
        - "Il liste les fichiers cachés"
      en:
        - "It goes to your personal folder"
        - "It goes up one level, to the parent directory"
        - "It deletes the current directory"
        - "It lists hidden files"
    answer: 1
    why:
      fr: "`..` désigne le répertoire parent ; `cd ..` vous fait donc remonter d'un niveau dans l'arborescence."
      en: "`..` means the parent directory; `cd ..` therefore moves you up one level in the tree."
  - q:
      fr: "Pourquoi utiliser `ls -la` plutôt que `ls` ?"
      en: "Why use `ls -la` rather than `ls`?"
    options:
      fr:
        - "Parce que c'est plus rapide"
        - "Parce que ça trie par taille"
        - "Parce que ça supprime les fichiers inutiles"
        - "Parce que ça montre aussi les fichiers cachés et les détails"
      en:
        - "Because it is faster"
        - "Because it sorts by size"
        - "Because it deletes useless files"
        - "Because it also shows hidden files and details"
    answer: 3
    why:
      fr: "`-a` affiche les fichiers cachés (commençant par un point) et `-l` les détails : utile car les secrets et configs sont souvent cachés."
      en: "`-a` shows hidden files (starting with a dot) and `-l` the details: useful because secrets and configs are often hidden."
  - q:
      fr: "Pourquoi préférer un chemin absolu pour une opération sensible ?"
      en: "Why prefer an absolute path for a sensitive operation?"
    options:
      fr:
        - "Parce qu'il ne dépend pas du dossier d'où la commande est lancée"
        - "Parce qu'il est plus court à taper"
        - "Parce qu'il chiffre le fichier"
        - "Parce qu'il est obligatoire avec cd"
      en:
        - "Because it does not depend on the folder the command is run from"
        - "Because it is shorter to type"
        - "Because it encrypts the file"
        - "Because it is required with cd"
    answer: 0
    why:
      fr: "Un chemin absolu part toujours de la racine : il désigne exactement le même fichier où que vous soyez, ce qui évite d'agir par erreur sur le mauvais dossier."
      en: "An absolute path always starts from the root: it points to exactly the same file wherever you are, avoiding acting on the wrong folder by mistake."
