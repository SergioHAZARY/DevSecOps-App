description:
  fr: "Apprendre la syntaxe YAML : indentation, clés, listes, types scalaires et le fameux piège de la Norvège."
  en: "Learn YAML syntax: indentation, keys, lists, scalar types and the infamous Norway pitfall."
duration: 20

intro:
  fr: |
    **YAML** signifie *YAML Ain't Markup Language*. C'est un format de **données lisibles par un humain**,
    utilisé partout en DevSecOps : Kubernetes, GitHub Actions, Ansible, Docker Compose, configurations
    d'applications. Si vous savez écrire du YAML, vous savez configurer presque tout l'outillage moderne.

    L'idée est simple : au lieu d'accolades et de points-virgules, YAML utilise l'**indentation** (des espaces
    en début de ligne) pour montrer ce qui appartient à quoi. C'est comme une liste à puces structurée que
    vous feriez dans un carnet.

    Attention : cette simplicité cache des pièges. Un espace mal placé ou le mot `yes` écrit tout seul peuvent
    changer le sens de votre fichier sans aucune erreur visible. Dans cette leçon vous apprendrez les règles de
    base et surtout à **éviter les conversions de type surprises**, le fameux « piège de la Norvège ».
  en: |
    **YAML** stands for *YAML Ain't Markup Language*. It is a **human-readable data** format used everywhere in
    DevSecOps: Kubernetes, GitHub Actions, Ansible, Docker Compose, application configuration. If you can write
    YAML, you can configure almost all modern tooling.

    The idea is simple: instead of braces and semicolons, YAML uses **indentation** (leading spaces) to show
    what belongs to what. It is like a structured bullet list you would write in a notebook.

    Beware: that simplicity hides traps. A misplaced space or the word `yes` written on its own can change the
    meaning of your file with no visible error. In this lesson you will learn the basic rules and, above all,
    how to **avoid surprise type conversions**, the infamous "Norway problem".

sections:
  - heading:
      fr: "Clés, valeurs et indentation"
      en: "Keys, values and indentation"
    body:
      fr: |
        Un document YAML est surtout une suite de paires `clé: valeur`. Les deux-points **suivis d'un espace**
        séparent la clé de la valeur :

        ```yaml
        name: web-server
        port: 8080
        enabled: true
        ```

        Pour imbriquer des données, on **indente avec des espaces** (jamais de tabulation). Toutes les clés d'un
        même niveau doivent être alignées exactement :

        ```yaml
        server:
          host: example.com
          tls:
            enabled: true
            min_version: "1.2"
        ```

        Ici `host` et `tls` appartiennent à `server`, et `enabled`/`min_version` appartiennent à `tls`. La
        convention universelle est **2 espaces** par niveau. YAML distingue ainsi un *mapping* (dictionnaire de
        paires clé/valeur) de ses sous-objets uniquement grâce à l'indentation.
      en: |
        A YAML document is mostly a series of `key: value` pairs. The colon **followed by a space** separates the
        key from the value:

        ```yaml
        name: web-server
        port: 8080
        enabled: true
        ```

        To nest data, you **indent with spaces** (never tabs). All keys at the same level must line up exactly:

        ```yaml
        server:
          host: example.com
          tls:
            enabled: true
            min_version: "1.2"
        ```

        Here `host` and `tls` belong to `server`, and `enabled`/`min_version` belong to `tls`. The universal
        convention is **2 spaces** per level. YAML tells a *mapping* (a dictionary of key/value pairs) apart from
        its sub-objects purely through indentation.
  - heading:
      fr: "Listes et types scalaires"
      en: "Lists and scalar types"
    body:
      fr: |
        Une **liste** (séquence) utilise un tiret suivi d'un espace. Chaque élément est sur sa propre ligne :

        ```yaml
        ports:
          - 80
          - 443
          - 8080
        ```

        YAML **devine le type** de chaque valeur. C'est pratique mais dangereux :

        | Écriture | Type deviné | Valeur réelle |
        |---|---|---|
        | `42` | entier | 42 |
        | `3.14` | flottant | 3.14 |
        | `true`, `yes`, `on` | booléen | vrai |
        | `false`, `no`, `off` | booléen | faux |
        | `null`, `~` | null | rien |
        | `"42"` | chaîne | "42" |

        Le **piège de la Norvège** : le code pays `NO` est interprété comme le booléen *faux* ! De même `yes`
        devient `true`. Pour forcer une chaîne, **mettez des guillemets** : `country: "NO"`.
      en: |
        A **list** (sequence) uses a dash followed by a space. Each item is on its own line:

        ```yaml
        ports:
          - 80
          - 443
          - 8080
        ```

        YAML **guesses the type** of each value. Convenient, but dangerous:

        | Written as | Guessed type | Actual value |
        |---|---|---|
        | `42` | integer | 42 |
        | `3.14` | float | 3.14 |
        | `true`, `yes`, `on` | boolean | true |
        | `false`, `no`, `off` | boolean | false |
        | `null`, `~` | null | nothing |
        | `"42"` | string | "42" |

        The **Norway problem**: the country code `NO` is read as the boolean *false*! Likewise `yes` becomes
        `true`. To force a string, **add quotes**: `country: "NO"`.

examples:
  - title:
      fr: "Un fichier de configuration YAML complet et valide"
      en: "A complete, valid YAML configuration file"
    file: config.yaml
    lang: yaml
    kind: neutral
    code: |
      # A small web-service configuration
      service:
        name: payments-api
        version: "2.4.0"      # quoted: keep it a string, not a float
        replicas: 3
      network:
        port: 8443
        tls: true             # boolean, enables HTTPS
        allowed_origins:      # a list of strings
          - https://example.com
          - https://app.example.com
      limits:
        cpu: "500m"
        memory: "256Mi"
    output: |
      service.name    = payments-api
      service.version = "2.4.0" (string)
      network.tls     = True (bool)
      allowed_origins = 2 items
    note:
      fr: "`version: \"2.4.0\"` est entre guillemets pour rester une chaîne : sans cela, `2.4` deviendrait un flottant et perdrait le dernier `.0`."
      en: "`version: \"2.4.0\"` is quoted so it stays a string: without quotes, `2.4` would become a float and lose the trailing `.0`."

  - title:
      fr: "Le piège de la Norvège : conversion de type involontaire"
      en: "The Norway problem: unintended type conversion"
    file: norway_bug.yaml
    lang: yaml
    kind: vulnerable
    code: |
      # VULNERABLE: unquoted scalars get the wrong type
      countries:
        - SE        # stays the string "SE"
        - NO        # BUG: parsed as the boolean false, not "NO"!
      feature_flags:
        beta: yes   # BUG: this is the boolean true, not the text "yes"
      version: 1.10 # BUG: parsed as the float 1.1 (trailing zero lost)
    output: |
      countries   = ['SE', False]   # "NO" became False
      beta        = True            # "yes" became a boolean
      version     = 1.1             # "1.10" became 1.1
    note:
      fr: "Fichier volontairement piégé (`kind: vulnerable`) : `NO`, `yes` et `1.10` sont mal typés. Rien ne lève d'erreur, d'où le danger."
      en: "Intentionally buggy file (`kind: vulnerable`): `NO`, `yes` and `1.10` are mistyped. Nothing raises an error, which is the danger."

  - title:
      fr: "La correction : mettre des guillemets autour des scalaires ambigus"
      en: "The fix: quote ambiguous scalars"
    file: norway_fixed.yaml
    lang: yaml
    kind: secure
    code: |
      # SECURE: quote anything that must stay text
      countries:
        - "SE"
        - "NO"        # quoted -> stays the string "NO"
      feature_flags:
        beta: true    # use the real boolean keyword when you mean a boolean
      version: "1.10" # quoted -> stays the string "1.10"
    output: |
      countries = ['SE', 'NO']
      beta      = True
      version   = '1.10'
    note:
      fr: "Règle d'or : mettez entre guillemets tout ce qui doit rester du texte (codes pays, versions, numéros de téléphone, valeurs comme `on`/`off`)."
      en: "Golden rule: quote anything that must stay text (country codes, versions, phone numbers, values like `on`/`off`)."

mistake:
  fr: |
    **Mélanger espaces et tabulations, ou laisser des scalaires ambigus sans guillemets.**

    YAML **interdit les tabulations** pour l'indentation : un seul caractère de tabulation invisible provoque
    une erreur de parsing. Configurez votre éditeur pour afficher les espaces. L'autre erreur majeure est le
    piège de la Norvège : les valeurs `yes`, `no`, `on`, `off`, `NO`, `true`, `null` et les versions comme
    `1.10` changent de type si elles ne sont pas entre guillemets.
  en: |
    **Mixing spaces and tabs, or leaving ambiguous scalars unquoted.**

    YAML **forbids tabs** for indentation: a single invisible tab character causes a parsing error. Configure
    your editor to show whitespace. The other major mistake is the Norway problem: the values `yes`, `no`, `on`,
    `off`, `NO`, `true`, `null` and versions like `1.10` change type unless they are quoted.

bestPractice:
  fr: |
    - **Indentez avec 2 espaces**, jamais de tabulation ; activez l'affichage des espaces dans l'éditeur.
    - **Mettez des guillemets** autour des codes, versions, booléens textuels et tout ce qui doit rester une chaîne.
    - **Préférez `true`/`false`** aux variantes `yes`/`no`/`on`/`off` pour les booléens.
    - **Validez vos fichiers** avec `yamllint` ou le parseur de l'outil cible avant de les livrer.
  en: |
    - **Indent with 2 spaces**, never tabs; turn on whitespace display in your editor.
    - **Quote** codes, versions, text booleans and anything that must stay a string.
    - **Prefer `true`/`false`** over the `yes`/`no`/`on`/`off` variants for booleans.
    - **Validate your files** with `yamllint` or the target tool's parser before shipping them.

exercise:
  statement:
    fr: |
      Le fichier YAML suivant contient trois pièges de type. Identifiez-les et réécrivez le fichier pour que
      `region`, `enabled` et `build` gardent la valeur attendue (du texte pour `region` et `build`, un vrai
      booléen pour `enabled`).

      ```yaml
      region: NO
      enabled: yes
      build: 2.0
      ```
    en: |
      The following YAML file contains three type traps. Identify them and rewrite the file so that `region`,
      `enabled` and `build` keep the expected value (text for `region` and `build`, a real boolean for
      `enabled`).

      ```yaml
      region: NO
      enabled: yes
      build: 2.0
      ```
  solution:
    file: solution.yaml
    lang: yaml
    code: |
      # region: NO was the boolean false -> quote it
      region: "NO"
      # enabled: yes was fine as a boolean, but spell it explicitly
      enabled: true
      # build: 2.0 was the float 2.0 -> quote it to keep the exact text
      build: "2.0"
    note:
      fr: "`NO` et `2.0` deviennent des chaînes grâce aux guillemets ; `yes` est remplacé par le mot-clé `true` sans ambiguïté."
      en: "`NO` and `2.0` become strings thanks to the quotes; `yes` is replaced by the unambiguous keyword `true`."

quiz:
  - q:
      fr: "Quel caractère YAML interdit-il pour l'indentation ?"
      en: "Which character does YAML forbid for indentation?"
    options:
      fr: ["L'espace", "La tabulation", "Le tiret", "Les deux-points"]
      en: ["The space", "The tab", "The dash", "The colon"]
    answer: 1
    why:
      fr: "YAML interdit les tabulations ; seule l'indentation par espaces est autorisée."
      en: "YAML forbids tabs; only space-based indentation is allowed."
  - q:
      fr: "Comment YAML interprète-t-il la valeur non quotée `NO` ?"
      en: "How does YAML interpret the unquoted value `NO`?"
    options:
      fr:
        - "Comme la chaîne \"NO\""
        - "Comme le booléen false"
        - "Comme un nombre"
        - "Comme null"
      en:
        - "As the string \"NO\""
        - "As the boolean false"
        - "As a number"
        - "As null"
    answer: 1
    why:
      fr: "C'est le piège de la Norvège : `NO` non quoté devient le booléen false. Il faut écrire `\"NO\"`."
      en: "This is the Norway problem: unquoted `NO` becomes the boolean false. You must write `\"NO\"`."
  - q:
      fr: "Comment démarre un élément de liste en YAML ?"
      en: "How does a list item start in YAML?"
    options:
      fr:
        - "Par un astérisque suivi d'un espace"
        - "Par une accolade"
        - "Par un tiret suivi d'un espace"
        - "Par un numéro"
      en:
        - "With an asterisk and a space"
        - "With a brace"
        - "With a dash and a space"
        - "With a number"
    answer: 2
    why:
      fr: "Chaque élément d'une séquence commence par `- ` (tiret + espace)."
      en: "Each sequence item starts with `- ` (dash + space)."
  - q:
      fr: "Comment forcer YAML à traiter `1.10` comme du texte ?"
      en: "How do you force YAML to treat `1.10` as text?"
    options:
      fr:
        - "En l'entourant de guillemets : \"1.10\""
        - "En ajoutant un espace avant"
        - "En le mettant en majuscules"
        - "C'est impossible"
      en:
        - "By wrapping it in quotes: \"1.10\""
        - "By adding a leading space"
        - "By uppercasing it"
        - "It is impossible"
    answer: 0
    why:
      fr: "Sans guillemets, `1.10` devient le flottant 1.1 ; `\"1.10\"` reste la chaîne exacte."
      en: "Without quotes, `1.10` becomes the float 1.1; `\"1.10\"` stays the exact string."
  - q:
      fr: "Combien d'espaces utilise-t-on par convention pour un niveau d'indentation ?"
      en: "How many spaces are used by convention for one indentation level?"
    options:
      fr: ["1", "2", "4", "8"]
      en: ["1", "2", "4", "8"]
    answer: 1
    why:
      fr: "La convention universelle est de 2 espaces par niveau d'imbrication."
      en: "The universal convention is 2 spaces per nesting level."
