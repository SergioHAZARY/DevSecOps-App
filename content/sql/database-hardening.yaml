        - "À accélérer les requêtes"
        - "À journaliser les actions sensibles (DDL, droits, écritures) pour l'audit"
        - "À sauvegarder la base"
      en:
        - "To encrypt the tables"
        - "To speed up queries"
        - "To log sensitive actions (DDL, rights, writes) for auditing"
        - "To back up the database"
