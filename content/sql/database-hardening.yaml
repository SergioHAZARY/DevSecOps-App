  - q:
      fr: "Quelle combinaison est à l'origine de la plupart des fuites de bases exposées ?"
      en: "Which combination is behind most exposed-database leaks?"
    options:
      fr:
        - "Un index manquant et des requêtes lentes"
        - "Écoute sur 0.0.0.0, méthode trust et absence de TLS"
        - "Trop de sauvegardes chiffrées"
        - "Un seul superutilisateur"
      en:
        - "A missing index and slow queries"
        - "Listening on 0.0.0.0, the trust method and no TLS"
        - "Too many encrypted backups"
        - "A single superuser"
    answer: 1
    why:
      fr: "Exposer la base à Internet (`0.0.0.0`), supprimer l'authentification (`trust`) et laisser les données en clair (sans TLS) cumulent les failles : c'est le scénario type des fuites massives."
      en: "Exposing the database to the Internet (`0.0.0.0`), removing authentication (`trust`) and leaving data in clear text (no TLS) stack the flaws: the typical scenario of massive leaks."
