description:
  fr: "Les 20 premières questions d'entretien DevSecOps (fondamentaux, vocabulaire du risque, outils et culture) avec des réponses modèles et des exercices posés en direct."
  en: "The first 20 DevSecOps interview questions (fundamentals, risk vocabulary, tooling and culture) with model answers and live exercises."
duration: 45

intro:
  fr: |
    Un entretien **DevSecOps** (Development, Security, Operations) commence presque toujours par les
    fondamentaux : le recruteur veut vérifier que vous savez **expliquer simplement** des notions que vous
    utilisez tous les jours. C'est comme l'épreuve du code de la route avant la conduite : personne ne
    vous laissera prendre le volant d'une production si vous hésitez sur la signification des panneaux.

    Cette leçon contient les **questions 1 à 20** de notre série de 100. Chaque question indique son niveau
    (*junior*, *confirmé*, *senior*) et une réponse modèle de quelques phrases, avec les mots-clés
    qu'un recruteur attend. Ne les apprenez pas par cœur : reformulez-les avec **vos** projets.

    Les exemples de code sont les exercices pratiques que l'on vous demandera de faire en direct :
    trouver les failles d'un script, prioriser des vulnérabilités, dessiner un pipeline sécurisé.
  en: |
    A **DevSecOps** (Development, Security, Operations) interview almost always starts with the
    fundamentals: the interviewer wants to check that you can **explain simply** the notions you use
    every day. It is like the theory test before the driving test: nobody will let you take the wheel of a
    production system if you hesitate on what the road signs mean.

    This lesson contains **questions 1 to 20** of our series of 100. Each question shows its level
    (*junior*, *mid*, *senior*) and a model answer of a few sentences, with the keywords an interviewer
    expects. Do not learn them by heart: rephrase them with **your own** projects.

    The code examples are the practical exercises you will be asked to do live: find the flaws in a
    script, prioritise vulnerabilities, draw a secure pipeline.

sections:
  - heading:
      fr: "Questions 1 à 5 : les concepts DevSecOps"
      en: "Questions 1 to 5: DevSecOps concepts"
    body:
      fr: |
        **Q1. Qu'est-ce que le DevSecOps, en une phrase ?** *(junior)*

        C'est l'intégration de la sécurité dans **chaque étape** du cycle de vie logiciel (conception, code,
        build, test, déploiement, exploitation), sous forme de contrôles **automatisés** et d'une
        **responsabilité partagée** entre développeurs, ops et sécurité. L'objectif est de livrer vite
        **et** sûr, au lieu d'ajouter un audit manuel à la fin.

        **Q2. Quelle différence entre DevOps et DevSecOps ?** *(junior)*

        DevOps rapproche le développement et l'exploitation pour livrer plus souvent grâce à
        l'automatisation (CI/CD, Infrastructure as Code). DevSecOps reprend exactement ces pratiques et y
        ajoute la sécurité comme exigence de qualité : scans dans le pipeline, politiques en tant que code,
        modélisation des menaces. Ce n'est pas une équipe en plus, c'est DevOps « fait correctement ».

        **Q3. Que signifie « shift left » ?** *(junior)*

        Déplacer les contrôles de sécurité **le plus tôt possible** dans le cycle (à gauche sur le schéma) :
        dans l'IDE, au commit, dans la pull request. Une faille corrigée pendant le développement coûte
        quelques minutes ; la même faille en production coûte un incident. On parle aussi de
        « shift everywhere » : on garde aussi des contrôles à droite (surveillance, détection en production).

        **Q4. Expliquez la triade CIA.** *(junior)*

        **Confidentialité** (seules les personnes autorisées lisent la donnée), **Intégrité** (la donnée
        n'est pas modifiée sans autorisation) et **Disponibilité** (le service répond quand on en a besoin).
        Exemples de contrôles : chiffrement et contrôle d'accès pour la confidentialité, signatures et
        hachage pour l'intégrité, redondance et sauvegardes pour la disponibilité.

        **Q5. Comment mesurez-vous la maturité DevSecOps d'une équipe ?** *(senior)*

        Je m'appuie sur un modèle public comme **OWASP SAMM** ou **OWASP DSOMM**, qui évalue des pratiques
        (gouvernance, conception, implémentation, vérification, opérations) sur plusieurs niveaux. Je
        complète avec des indicateurs factuels : couverture des dépôts par les scans, délai moyen de
        correction, part des déploiements passant par le pipeline. Je fixe ensuite un objectif réaliste par
        trimestre plutôt que de viser le niveau maximal partout.
      en: |
        **Q1. What is DevSecOps, in one sentence?** *(junior)*

        It is the integration of security into **every stage** of the software lifecycle (design, code,
        build, test, deploy, operate), as **automated** controls and a **shared responsibility** between
        developers, ops and security. The goal is to ship fast **and** safe, instead of bolting a manual
        audit on at the end.

        **Q2. What is the difference between DevOps and DevSecOps?** *(junior)*

        DevOps brings development and operations together to ship more often through automation (CI/CD,
        Infrastructure as Code). DevSecOps keeps exactly those practices and adds security as a quality
        requirement: scans in the pipeline, policy as code, threat modelling. It is not an extra team, it
        is DevOps "done properly".

        **Q3. What does "shift left" mean?** *(junior)*

        Moving security checks **as early as possible** in the lifecycle (to the left of the diagram): in
        the IDE, at commit time, in the pull request. A flaw fixed during development costs minutes; the
        same flaw in production costs an incident. People also say "shift everywhere": you still keep
        controls on the right (monitoring, detection in production).

        **Q4. Explain the CIA triad.** *(junior)*

        **Confidentiality** (only authorised people read the data), **Integrity** (the data is not modified
        without authorisation) and **Availability** (the service answers when it is needed). Example
        controls: encryption and access control for confidentiality, signatures and hashing for integrity,
        redundancy and backups for availability.

        **Q5. How do you measure the DevSecOps maturity of a team?** *(senior)*

        I rely on a public model such as **OWASP SAMM** or **OWASP DSOMM**, which rates practices
        (governance, design, implementation, verification, operations) on several levels. I complete it
        with factual indicators: share of repositories covered by scans, mean time to remediate, share of
        deployments going through the pipeline. Then I set a realistic target per quarter rather than
        aiming for the top level everywhere.
  - heading:
      fr: "Questions 6 à 10 : vocabulaire du risque et principes"
      en: "Questions 6 to 10: risk vocabulary and principles"
    body:
      fr: |
        **Q6. Différence entre vulnérabilité, menace et risque ?** *(junior)*

        Une **vulnérabilité** est une faiblesse (un port ouvert, une injection SQL). Une **menace** est ce
        qui peut l'exploiter (un attaquant, un ransomware, une erreur humaine). Le **risque** est la
        combinaison de la probabilité que cela arrive et de l'impact sur l'entreprise. On ne corrige pas
        « toutes les vulnérabilités », on réduit les risques les plus élevés.

        **Q7. À quoi servent CVE, CVSS et CWE ?** *(junior)*

        | Sigle | Ce que c'est | Exemple |
        |---|---|---|
        | **CVE** | Identifiant unique d'une vulnérabilité publique | CVE-2021-44228 (Log4Shell) |
        | **CVSS** | Score de gravité de 0 à 10 | 10.0 = critique |
        | **CWE** | Catégorie de faiblesse | CWE-89 = injection SQL |

        Le CVSS mesure la gravité technique, pas le risque réel : je le croise avec l'exposition de l'actif
        et l'exploitation connue (catalogue **CISA KEV**, score **EPSS**).

        **Q8. Qu'est-ce que le principe du moindre privilège ?** *(junior)*

        Chaque utilisateur, service ou pipeline ne reçoit que les droits **strictement nécessaires** à sa
        tâche, pour la durée nécessaire. Exemples : un jeton de CI en lecture seule sur le dépôt, un rôle
        IAM limité à un seul bucket, un conteneur sans root. Si le composant est compromis, le rayon
        d'explosion (*blast radius*) reste petit.

        **Q9. Qu'est-ce que la défense en profondeur ?** *(confirmé)*

        Superposer plusieurs couches de protection **indépendantes** pour qu'une seule défaillance ne
        suffise pas : pare-feu applicatif, validation des entrées, requêtes paramétrées, compte de base de
        données à droits réduits, chiffrement, journalisation et alertes. Chaque couche suppose que la
        précédente peut échouer.

        **Q10. Qu'est-ce que le Zero Trust ?** *(confirmé)*

        Un modèle où l'on **ne fait jamais confiance par défaut**, même à l'intérieur du réseau : chaque
        requête est authentifiée, autorisée et chiffrée, en fonction de l'identité, de l'état de l'appareil
        et du contexte. Le périmètre n'est plus le réseau mais **l'identité**. En pratique : MFA, accès
        conditionnel, micro-segmentation, mTLS entre services, droits minimaux et vérification continue.
      en: |
        **Q6. Difference between a vulnerability, a threat and a risk?** *(junior)*

        A **vulnerability** is a weakness (an open port, a SQL injection). A **threat** is what may exploit
        it (an attacker, ransomware, a human error). **Risk** is the combination of the likelihood that it
        happens and the impact on the business. You do not fix "all vulnerabilities", you reduce the
        highest risks.

        **Q7. What are CVE, CVSS and CWE for?** *(junior)*

        | Acronym | What it is | Example |
        |---|---|---|
        | **CVE** | Unique identifier of a public vulnerability | CVE-2021-44228 (Log4Shell) |
        | **CVSS** | Severity score from 0 to 10 | 10.0 = critical |
        | **CWE** | Category of weakness | CWE-89 = SQL injection |

        CVSS measures technical severity, not real risk: I cross it with the exposure of the asset and
        known exploitation (**CISA KEV** catalogue, **EPSS** score).

        **Q8. What is the principle of least privilege?** *(junior)*

        Every user, service or pipeline gets only the rights **strictly necessary** for its task, for the
        time needed. Examples: a read-only CI token on the repository, an IAM role limited to a single
        bucket, a non-root container. If the component is compromised, the blast radius stays small.

        **Q9. What is defence in depth?** *(mid)*

        Stacking several **independent** layers of protection so that one failure is not enough: web
        application firewall, input validation, parameterized queries, a database account with reduced
        rights, encryption, logging and alerting. Each layer assumes the previous one can fail.

        **Q10. What is Zero Trust?** *(mid)*

        A model where you **never trust by default**, even inside the network: every request is
        authenticated, authorised and encrypted, based on identity, device posture and context. The
        perimeter is no longer the network but **identity**. In practice: MFA, conditional access,
        micro-segmentation, mTLS between services, minimal rights and continuous verification.
  - heading:
      fr: "Questions 11 à 15 : outils et pratiques"
      en: "Questions 11 to 15: tools and practices"
    body:
      fr: |
        **Q11. Différence entre SAST, DAST, SCA et IAST ?** *(junior)*

        | Type | Analyse quoi ? | Quand ? | Exemples |
        |---|---|---|---|
        | **SAST** | Le code source, sans l'exécuter | Commit / pull request | Semgrep, CodeQL, Bandit |
        | **SCA** | Les dépendances et leurs CVE | Commit / build | Trivy, Dependabot, pip-audit |
        | **DAST** | L'application en fonctionnement, de l'extérieur | Environnement de test | OWASP ZAP |
        | **IAST** | L'application instrumentée pendant les tests | Tests d'intégration | Agents intégrés au runtime |

        Ils sont complémentaires : le SAST voit le code mais pas la configuration réelle, le DAST voit le
        comportement réel mais pas la ligne fautive.

        **Q12. Comment gérez-vous les secrets ?** *(confirmé)*

        Jamais dans le code ni dans Git. Ils vivent dans un gestionnaire de secrets (HashiCorp Vault, AWS
        Secrets Manager, Azure Key Vault) et sont injectés à l'exécution. J'ajoute la détection
        (Gitleaks en pre-commit et dans la CI), la rotation régulière, et je préfère les identifiants
        **éphémères** (OIDC entre la CI et le cloud) aux clés longue durée. Un secret poussé dans Git est
        considéré comme compromis : on le **révoque** d'abord, on nettoie l'historique ensuite.

        **Q13. Qu'est-ce que la modélisation des menaces ?** *(confirmé)*

        Un atelier de conception où l'on répond à quatre questions : que construit-on, qu'est-ce qui peut
        mal tourner, que fait-on pour l'éviter, a-t-on bien fait le travail ? On dessine un diagramme de flux
        de données, puis on parcourt une méthode comme **STRIDE** (Spoofing, Tampering, Repudiation,
        Information disclosure, Denial of service, Elevation of privilege). Le résultat est une liste de
        menaces priorisées, transformées en tickets.

        **Q14. Qu'est-ce qu'un SBOM et pourquoi est-ce utile ?** *(confirmé)*

        Un **Software Bill of Materials** est l'inventaire de tous les composants d'un logiciel (bibliothèques,
        versions, licences), aux formats **CycloneDX** ou **SPDX**. Quand une faille comme Log4Shell sort,
        il permet de répondre en minutes à « sommes-nous touchés, et où ? ». On le génère dans le pipeline
        (Syft, Trivy) et on l'attache à l'artefact livré.

        **Q15. Comment sécurisez-vous la chaîne d'approvisionnement logicielle ?** *(senior)*

        J'agis sur trois maillons. **Sources** : protection de branche, revues obligatoires, commits signés.
        **Dépendances** : fichiers de verrouillage, registre interne, analyse SCA, épinglage des actions de
        CI par SHA. **Build et artefacts** : runners éphémères, SBOM, signature des images (Sigstore
        Cosign), attestations de provenance selon le référentiel **SLSA**, et vérification de la signature
        à l'admission dans le cluster.
      en: |
        **Q11. Difference between SAST, DAST, SCA and IAST?** *(junior)*

        | Type | What it analyses | When | Examples |
        |---|---|---|---|
        | **SAST** | Source code, without running it | Commit / pull request | Semgrep, CodeQL, Bandit |
        | **SCA** | Dependencies and their CVEs | Commit / build | Trivy, Dependabot, pip-audit |
        | **DAST** | The running application, from outside | Test environment | OWASP ZAP |
        | **IAST** | The instrumented application during tests | Integration tests | Agents embedded in the runtime |

        They complement each other: SAST sees the code but not the real configuration, DAST sees the real
        behaviour but not the faulty line.

        **Q12. How do you manage secrets?** *(mid)*

        Never in code or in Git. They live in a secrets manager (HashiCorp Vault, AWS Secrets Manager,
        Azure Key Vault) and are injected at runtime. I add detection (Gitleaks as a pre-commit hook and in
        CI), regular rotation, and I prefer **short-lived** credentials (OIDC between CI and the cloud) to
        long-lived keys. A secret pushed to Git is considered compromised: you **revoke** it first, then
        clean the history.

        **Q13. What is threat modelling?** *(mid)*

        A design workshop answering four questions: what are we building, what can go wrong, what are we
        doing about it, did we do a good job? You draw a data-flow diagram, then walk through a method such
        as **STRIDE** (Spoofing, Tampering, Repudiation, Information disclosure, Denial of service,
        Elevation of privilege). The outcome is a prioritised list of threats turned into tickets.

        **Q14. What is an SBOM and why is it useful?** *(mid)*

        A **Software Bill of Materials** is the inventory of every component of a piece of software
        (libraries, versions, licences), in **CycloneDX** or **SPDX** format. When a flaw like Log4Shell
        comes out, it lets you answer "are we affected, and where?" in minutes. It is generated in the
        pipeline (Syft, Trivy) and attached to the delivered artifact.

        **Q15. How do you secure the software supply chain?** *(senior)*

        I act on three links. **Source**: branch protection, mandatory reviews, signed commits.
        **Dependencies**: lock files, an internal registry, SCA scanning, CI actions pinned by SHA.
        **Build and artifacts**: ephemeral runners, SBOM, image signing (Sigstore Cosign), provenance
        attestations following the **SLSA** framework, and signature verification at cluster admission.
  - heading:
      fr: "Questions 16 à 20 : culture, indicateurs et collaboration"
      en: "Questions 16 to 20: culture, metrics and collaboration"
    body:
      fr: |
        **Q16. Qu'est-ce qu'un « security champion » ?** *(confirmé)*

        Un développeur ou un ops volontaire qui devient le **relais sécurité** de son équipe : il participe
        aux revues, anime la modélisation des menaces, trie les alertes et remonte les besoins à l'équipe
        sécurité. Cela permet de passer à l'échelle : une équipe sécurité de cinq personnes ne peut pas
        relire le code de deux cents développeurs.

        **Q17. Quels indicateurs suivez-vous ?** *(confirmé)*

        Côté livraison, les quatre métriques **DORA** : fréquence de déploiement, délai de mise en
        production, taux d'échec des changements, temps de restauration. Côté sécurité : **MTTR** (délai
        moyen de correction) par gravité, nombre de vulnérabilités critiques ouvertes hors délai, couverture
        des scans, taux de faux positifs. Un bon indicateur déclenche une décision ; sinon c'est du bruit.

        **Q18. Les développeurs se plaignent que les scans bloquent tout. Que faites-vous ?** *(senior)*

        J'écoute d'abord : le problème vient souvent des **faux positifs** ou de scans trop lents. Je règle
        les outils (règles désactivées avec justification, analyse limitée au code modifié), je ne bloque
        que sur les critiques **nouvelles** et corrigeables, et j'affiche le résultat directement dans la
        pull request avec la correction suggérée. Le reste part dans un backlog avec un délai convenu.
        Un contrôle que tout le monde contourne ne protège personne.

        **Q19. Qu'est-ce qu'un post-mortem « sans reproche » (blameless) ?** *(confirmé)*

        Une analyse d'incident qui cherche les **causes systémiques** et non un coupable : chronologie des
        faits, ce qui a bien fonctionné, ce qui a manqué, actions correctives avec un responsable et une
        date. Si les gens craignent une sanction, ils cachent les erreurs et l'organisation n'apprend rien.

        **Q20. Qu'est-ce que la « compliance as code » ?** *(senior)*

        Traduire les exigences de conformité (ISO 27001, PCI DSS, RGPD, CIS Benchmarks) en **règles
        exécutables** et versionnées : politiques OPA/Rego ou Kyverno, contrôles Checkov, profils InSpec.
        La conformité est alors vérifiée à chaque changement et les preuves d'audit sont produites
        automatiquement par le pipeline, au lieu d'un tableur rempli une fois par an.
      en: |
        **Q16. What is a "security champion"?** *(mid)*

        A volunteer developer or ops engineer who becomes the **security relay** of their team: they take
        part in reviews, run threat modelling, triage alerts and bring needs back to the security team. It
        is how you scale: a five-person security team cannot review the code of two hundred developers.

        **Q17. Which metrics do you track?** *(mid)*

        On the delivery side, the four **DORA** metrics: deployment frequency, lead time for changes,
        change failure rate, time to restore service. On the security side: **MTTR** (mean time to
        remediate) per severity, number of critical vulnerabilities open past their deadline, scan
        coverage, false-positive rate. A good metric triggers a decision; otherwise it is noise.

        **Q18. Developers complain that scans block everything. What do you do?** *(senior)*

        I listen first: the problem usually comes from **false positives** or slow scans. I tune the tools
        (rules disabled with a justification, analysis limited to changed code), I only block on **new**,
        fixable criticals, and I show the result right in the pull request with the suggested fix. The
        rest goes to a backlog with an agreed deadline. A control everybody bypasses protects nobody.

        **Q19. What is a blameless post-mortem?** *(mid)*

        An incident review that looks for **systemic causes**, not a culprit: timeline of facts, what
        worked well, what was missing, corrective actions with an owner and a date. If people fear being
        punished, they hide mistakes and the organisation learns nothing.

        **Q20. What is "compliance as code"?** *(senior)*

        Translating compliance requirements (ISO 27001, PCI DSS, GDPR, CIS Benchmarks) into versioned,
        **executable rules**: OPA/Rego or Kyverno policies, Checkov checks, InSpec profiles. Compliance is
        then verified on every change and audit evidence is produced automatically by the pipeline, instead
        of a spreadsheet filled in once a year.

examples:
  - title:
      fr: "Question en direct : « Que reprochez-vous à ce stockage de mots de passe ? »"
      en: "Live question: \"What is wrong with this password storage?\""
    file: password_storage.py
    lang: python
    kind: neutral
    code: |
      import hashlib
      import hmac
      import os

      password = "Tr0ub4dor&3"

      # WEAK: MD5 is fast and unsalted -> same password = same hash, cracked by GPU or rainbow tables
      weak = hashlib.md5(password.encode()).hexdigest()
      print("MD5 (weak)     :", weak)

      # STRONG: a slow key-derivation function with a random salt per user
      salt = os.urandom(16)
      ITERATIONS = 600_000
      strong = hashlib.pbkdf2_hmac("sha256", password.encode(), salt, ITERATIONS)
      print("PBKDF2 (strong):", len(strong), "bytes, salt of", len(salt), "bytes")


      def verify(candidate):
          test = hashlib.pbkdf2_hmac("sha256", candidate.encode(), salt, ITERATIONS)
          # Constant-time comparison: no timing side channel
          return hmac.compare_digest(test, strong)


      print("Right password :", verify("Tr0ub4dor&3"))
      print("Wrong password :", verify("password123"))
    output: |
      MD5 (weak)     : 9c5ccc17e3bc1ad4bf2d4de0ceb4b4a7
      PBKDF2 (strong): 32 bytes, salt of 16 bytes
      Right password : True
      Wrong password : False
    note:
      fr: "La réponse attendue : un mot de passe ne se **chiffre** pas et ne se hache pas avec MD5/SHA-1 ; on utilise une fonction lente et salée (Argon2id, bcrypt, scrypt ou PBKDF2) et une comparaison à temps constant."
      en: "The expected answer: a password is not **encrypted** and not hashed with MD5/SHA-1; you use a slow, salted function (Argon2id, bcrypt, scrypt or PBKDF2) and a constant-time comparison."

  - title:
      fr: "Question en direct : « Laquelle de ces vulnérabilités corrigez-vous en premier ? »"
      en: "Live question: \"Which of these vulnerabilities do you fix first?\""
    file: prioritize.py
    lang: python
    kind: neutral
    code: |
      # CVSS alone is not risk: exposure and known exploitation change the order.
      findings = [
          {"id": "VULN-1", "cvss": 9.8, "internet_facing": False, "known_exploited": False, "asset": "internal batch server"},
          {"id": "VULN-2", "cvss": 7.5, "internet_facing": True, "known_exploited": True, "asset": "public API gateway"},
          {"id": "VULN-3", "cvss": 5.3, "internet_facing": True, "known_exploited": False, "asset": "marketing website"},
          {"id": "VULN-4", "cvss": 8.8, "internet_facing": False, "known_exploited": True, "asset": "CI runner"},
      ]


      def priority(finding):
          score = finding["cvss"]
          if finding["internet_facing"]:
              score += 2  # reachable by any attacker
          if finding["known_exploited"]:
              score += 3  # listed in a catalogue such as CISA KEV
          return score


      for f in sorted(findings, key=priority, reverse=True):
          print(f"{f['id']}  priority={priority(f):4.1f}  cvss={f['cvss']}  {f['asset']}")
    output: |
      VULN-2  priority=12.5  cvss=7.5  public API gateway
      VULN-4  priority=11.8  cvss=8.8  CI runner
      VULN-1  priority= 9.8  cvss=9.8  internal batch server
      VULN-3  priority= 7.3  cvss=5.3  marketing website
    note:
      fr: "Le CVSS 9.8 n'est **pas** corrigé en premier : la faille 7.5 est exposée sur Internet et déjà exploitée. Expliquez votre raisonnement à voix haute : gravité, exposition, exploitation connue, valeur de l'actif."
      en: "The CVSS 9.8 is **not** fixed first: the 7.5 flaw is exposed to the Internet and already exploited. Explain your reasoning out loud: severity, exposure, known exploitation, value of the asset."

  - title:
      fr: "Question en direct : « Dessinez un pipeline sécurisé et placez chaque contrôle »"
      en: "Live question: \"Draw a secure pipeline and place each control\""
    file: .github/workflows/secure-pipeline.yml
    lang: yaml
    kind: secure
    code: |
      name: secure-pipeline

      on:
        pull_request:
        push:
          branches: [main]

      # Least privilege for the workflow token
      permissions:
        contents: read

      jobs:
        # Stage 1 - code: secrets, SAST and SCA run on every change (shift left)
        code-checks:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 0 # full history so old commits are scanned for secrets
            - name: Secret detection
              uses: gitleaks/gitleaks-action@v2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            - name: SAST (static analysis of our code)
              run: |
                pip install semgrep
                semgrep scan --config auto --error
            - name: SCA (known CVEs in dependencies)
              run: |
                pip install pip-audit
                pip-audit -r requirements.txt

        # Stage 2 - build: the image is scanned before it can be pushed
        build-and-scan:
          needs: code-checks
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - name: Build image
              run: docker build -t app:${{ github.sha }} .
            - name: Image scan (fail on HIGH and CRITICAL)
              run: |
                docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
                  aquasec/trivy image --exit-code 1 --severity HIGH,CRITICAL app:${{ github.sha }}
    note:
      fr: "À l'oral, annoncez l'ordre : secrets, SAST et SCA sur chaque pull request ; scan d'image au build ; DAST sur l'environnement de test ; signature avant le déploiement ; surveillance en production. Précisez ce qui **bloque** et ce qui **alerte** seulement."
      en: "Out loud, state the order: secrets, SAST and SCA on every pull request; image scan at build; DAST on the test environment; signing before deployment; monitoring in production. Say what **blocks** and what only **alerts**."

mistake:
  fr: |
    **Réciter une définition sans exemple vécu.**

    « Le shift left consiste à déplacer la sécurité à gauche » ne prouve rien : n'importe qui peut le lire
    sur un blog. Le recruteur cherche la preuve que vous l'avez **fait**. Ajoutez toujours une phrase
    concrète : « Sur mon dernier projet, j'ai ajouté Gitleaks en pre-commit et le nombre de secrets
    détectés en CI est passé de plusieurs par mois à zéro. » Si vous n'avez pas d'expérience
    professionnelle, citez un projet personnel ou un lab de ce cours, et dites-le honnêtement.
  en: |
    **Reciting a definition with no lived example.**

    "Shift left means moving security to the left" proves nothing: anyone can read it on a blog. The
    interviewer is looking for proof that you **did** it. Always add one concrete sentence: "On my last
    project I added Gitleaks as a pre-commit hook and the number of secrets caught in CI went from several
    a month to zero." If you have no professional experience, quote a personal project or a lab from this
    course, and say so honestly.

bestPractice:
  fr: |
    - **Structurez chaque réponse** en trois temps : définition en une phrase, exemple concret, limite ou
      compromis. Visez 60 à 90 secondes.
    - **Utilisez les mots-clés attendus** (moindre privilège, défense en profondeur, SBOM, MTTR), mais
      seulement ceux que vous savez expliquer si l'on creuse.
    - **Dites « je ne sais pas »** quand c'est le cas, puis expliquez comment vous chercheriez la réponse.
      Inventer est éliminatoire dans un métier de sécurité.
    - **Pensez à voix haute** pendant les exercices en direct : le raisonnement compte plus que la
      syntaxe exacte.
    - **Préparez deux ou trois projets** que vous pouvez raconter sous plusieurs angles (technique,
      collaboration, erreur commise).
  en: |
    - **Structure every answer** in three beats: one-sentence definition, concrete example, limit or
      trade-off. Aim for 60 to 90 seconds.
    - **Use the expected keywords** (least privilege, defence in depth, SBOM, MTTR), but only those you
      can explain if the interviewer digs deeper.
    - **Say "I don't know"** when that is the case, then explain how you would find the answer. Making
      things up is disqualifying in a security job.
    - **Think out loud** during live exercises: the reasoning matters more than the exact syntax.
    - **Prepare two or three projects** you can tell from several angles (technical, collaboration, a
      mistake you made).

exercise:
  statement:
    fr: |
      Exercice classique d'entretien : « Écrivez une fonction qui convertit un score **CVSS v3** en niveau
      de gravité. »

      Les seuils officiels sont : `0.0` = None, `0.1` à `3.9` = Low, `4.0` à `6.9` = Medium, `7.0` à `8.9`
      = High, `9.0` à `10.0` = Critical.

      1. Écrivez `severity(score)` en Python. Elle doit refuser un score hors de l'intervalle 0-10.
      2. Testez-la avec `0`, `3.9`, `4.0`, `7.5`, `9.8` et `11`.
      3. Préparez la phrase que vous diriez à l'oral pour expliquer pourquoi la gravité n'est pas le risque.
    en: |
      A classic interview exercise: "Write a function that converts a **CVSS v3** score into a severity
      level."

      The official thresholds are: `0.0` = None, `0.1` to `3.9` = Low, `4.0` to `6.9` = Medium, `7.0` to
      `8.9` = High, `9.0` to `10.0` = Critical.

      1. Write `severity(score)` in Python. It must reject a score outside the 0-10 range.
      2. Test it with `0`, `3.9`, `4.0`, `7.5`, `9.8` and `11`.
      3. Prepare the sentence you would say out loud to explain why severity is not risk.
  solution:
    file: cvss_severity.py
    lang: python
    code: |
      def severity(score):
          # Validate input first: never trust a value coming from a scanner report
          if not 0.0 <= score <= 10.0:
              raise ValueError(f"invalid CVSS score: {score}")
          if score == 0.0:
              return "None"
          if score < 4.0:
              return "Low"
          if score < 7.0:
              return "Medium"
          if score < 9.0:
              return "High"
          return "Critical"


      for value in (0, 3.9, 4.0, 7.5, 9.8, 11):
          try:
              print(value, "->", severity(value))
          except ValueError as error:
              print(value, "->", "rejected:", error)
    note:
      fr: "Résultat : None, Low, Medium, High, Critical, puis rejet de 11. À l'oral : « la gravité décrit la faille ; le risque dépend aussi de l'exposition de l'actif, de l'exploitation connue et de l'impact métier »."
      en: "Result: None, Low, Medium, High, Critical, then 11 is rejected. Out loud: \"severity describes the flaw; risk also depends on the exposure of the asset, known exploitation and business impact\"."

quiz:
  - q:
      fr: "Quel outil analyse l'application **en cours d'exécution**, depuis l'extérieur ?"
      en: "Which kind of tool analyses the **running** application from the outside?"
    options:
      fr: ["SAST", "SCA", "DAST", "SBOM"]
      en: ["SAST", "SCA", "DAST", "SBOM"]
    answer: 2
    why:
      fr: "Le DAST (Dynamic Application Security Testing) attaque l'application déployée comme le ferait un attaquant ; le SAST lit le code, le SCA lit les dépendances."
      en: "DAST (Dynamic Application Security Testing) attacks the deployed application like an attacker would; SAST reads the code, SCA reads the dependencies."
  - q:
      fr: "Que désigne l'identifiant CWE-89 ?"
      en: "What does the identifier CWE-89 refer to?"
    options:
      fr:
        - "Une catégorie de faiblesse : l'injection SQL"
        - "Une vulnérabilité précise dans Log4j"
        - "Un score de gravité de 8,9"
        - "Une norme de conformité"
      en:
        - "A weakness category: SQL injection"
        - "A specific vulnerability in Log4j"
        - "A severity score of 8.9"
        - "A compliance standard"
    answer: 0
    why:
      fr: "CWE classe les **types** de faiblesses (CWE-89 = injection SQL). CVE identifie une vulnérabilité précise et CVSS donne un score."
      en: "CWE classifies **types** of weaknesses (CWE-89 = SQL injection). CVE identifies one specific vulnerability and CVSS gives a score."
  - q:
      fr: "Dans l'exemple de priorisation, pourquoi la faille CVSS 7.5 passe-t-elle avant la 9.8 ?"
      en: "In the prioritisation example, why does the CVSS 7.5 flaw come before the 9.8 one?"
    options:
      fr:
        - "Parce que le CVSS est toujours faux"
        - "Parce qu'elle est exposée sur Internet et déjà exploitée"
        - "Parce qu'elle est plus facile à corriger"
        - "Parce qu'elle a été découverte en premier"
      en:
        - "Because CVSS is always wrong"
        - "Because it is Internet-facing and already exploited"
        - "Because it is easier to fix"
        - "Because it was discovered first"
    answer: 1
    why:
      fr: "Le risque combine gravité, exposition et exploitation connue : une faille exploitée sur un service public est plus urgente qu'une faille théorique sur un serveur interne."
      en: "Risk combines severity, exposure and known exploitation: an exploited flaw on a public service is more urgent than a theoretical one on an internal server."
  - q:
      fr: "Que faut-il faire **en premier** quand un secret a été poussé dans Git ?"
      en: "What must be done **first** when a secret has been pushed to Git?"
    options:
      fr:
        - "Supprimer le fichier dans un nouveau commit"
        - "Réécrire l'historique Git"
        - "Rendre le dépôt privé"
        - "Révoquer le secret et en générer un nouveau"
      en:
        - "Delete the file in a new commit"
        - "Rewrite the Git history"
        - "Make the repository private"
        - "Revoke the secret and generate a new one"
    answer: 3
    why:
      fr: "Le secret doit être considéré comme compromis dès qu'il a quitté votre machine : seule la révocation le rend inutilisable. Le nettoyage de l'historique vient ensuite."
      en: "The secret must be considered compromised as soon as it left your machine: only revocation makes it useless. Cleaning the history comes afterwards."
  - q:
      fr: "Quel ensemble correspond aux quatre métriques DORA ?"
      en: "Which set matches the four DORA metrics?"
    options:
      fr:
        - "Confidentialité, intégrité, disponibilité, traçabilité"
        - "SAST, DAST, SCA, IAST"
        - "Fréquence de déploiement, délai de mise en production, taux d'échec des changements, temps de restauration"
        - "Spoofing, Tampering, Repudiation, Denial of service"
      en:
        - "Confidentiality, integrity, availability, traceability"
        - "SAST, DAST, SCA, IAST"
        - "Deployment frequency, lead time for changes, change failure rate, time to restore service"
        - "Spoofing, Tampering, Repudiation, Denial of service"
    answer: 2
    why:
      fr: "Les métriques DORA mesurent la performance de livraison ; on les complète par des indicateurs de sécurité comme le MTTR par gravité."
      en: "DORA metrics measure delivery performance; they are completed with security indicators such as MTTR per severity."
