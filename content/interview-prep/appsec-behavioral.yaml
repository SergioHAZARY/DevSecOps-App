description:
  fr: "Questions d'entretien 81 à 100 : sécurité applicative, réponse à incident et questions comportementales, avec un Dockerfile à sécuriser, une injection SQL à corriger et la méthode STAR."
  en: "Interview questions 81 to 100: application security, incident response and behavioral questions, with a Dockerfile to secure, a SQL injection to fix and the STAR method."
duration: 50

intro:
  fr: |
    Voici les **20 dernières questions** de la série (81 à 100). Elles couvrent trois terrains : la
    **sécurité applicative** (OWASP, authentification, API), la **réponse à incident** (que faire quand
    ça tourne mal) et les questions **comportementales** (comment vous travaillez en équipe).

    Un entretien n'est pas qu'un contrôle technique : le recruteur veut savoir s'il peut vous confier un
    incident à 3 h du matin. Pensez à l'entretien comme à un **permis de conduire** : connaître le code
    ne suffit pas, il faut montrer que vous gardez votre calme et prenez les bonnes décisions sous pression.

    Pour les questions comportementales, utilisez la méthode **STAR** (Situation, Tâche, Action,
    Résultat) : une histoire courte et structurée vaut mieux qu'une théorie. Entraînez-vous à voix haute,
    et préparez les deux exercices en direct : « sécurisez ce Dockerfile » et « corrigez cette injection SQL ».
  en: |
    These are the **last 20 questions** of the series (81 to 100). They cover three grounds: **application
    security** (OWASP, authentication, APIs), **incident response** (what to do when things go wrong) and
    **behavioral** questions (how you work in a team).

    An interview is not only a technical check: the recruiter wants to know whether they can hand you an
    incident at 3 a.m. Think of the interview as a **driving test**: knowing the rules is not enough, you
    must show that you stay calm and make good decisions under pressure.

    For behavioral questions, use the **STAR** method (Situation, Task, Action, Result): a short,
    structured story beats theory. Practise out loud, and prepare the two live exercises: "secure this
    Dockerfile" and "fix this SQL injection".

sections:
  - heading:
      fr: "Questions 81 à 85 : sécurité applicative"
      en: "Questions 81 to 85: application security"
    body:
      fr: |
        **Q81. Qu'est-ce que l'OWASP Top 10 et à quoi sert-il ?** *(junior)*

        C'est une liste, mise à jour tous les trois à quatre ans, des **dix risques de sécurité web les
        plus critiques**, établie par la fondation OWASP à partir de données réelles. Elle sert de
        référentiel commun : priorités de formation, points de contrôle en revue de code, base d'une
        checklist. Ce n'est pas une norme exhaustive, mais un excellent point de départ.

        **Q82. Expliquez le principe du moindre privilège.** *(junior)*

        Chaque utilisateur, service ou processus ne reçoit **que** les droits strictement nécessaires à
        sa tâche, et rien de plus. Si un composant est compromis, les dégâts restent limités à son
        périmètre. Concrètement : des rôles IAM étroits, des ServiceAccounts dédiés, pas de compte
        « admin partout », et des accès temporaires plutôt que permanents.

        **Q83. Différence entre authentification et autorisation ?** *(junior)*

        L'**authentification** prouve *qui vous êtes* (mot de passe, MFA, certificat). L'**autorisation**
        décide *ce que vous avez le droit de faire* une fois identifié (RBAC, ABAC). On authentifie une
        fois, on autorise à chaque action. Une faille classique est de bien authentifier mais d'oublier
        de vérifier l'autorisation côté serveur à chaque requête.

        **Q84. Comment stockez-vous les mots de passe des utilisateurs ?** *(confirmé)*

        Jamais en clair, jamais chiffrés de façon réversible, jamais avec un simple MD5 ou SHA-256. On
        utilise une fonction de hachage **lente et salée** conçue pour les mots de passe : **Argon2id**
        (recommandée), bcrypt ou scrypt. Le sel unique par utilisateur empêche les tables arc-en-ciel, et
        le coût élevé rend le cassage hors ligne très lent.

        **Q85. Qu'est-ce qu'une injection et comment l'empêcher ?** *(confirmé)*

        Une injection survient quand une entrée utilisateur est interprétée comme du **code** (SQL,
        commande shell, LDAP). La défense principale est la **séparation du code et des données** :
        requêtes paramétrées pour SQL, API sûres plutôt que concaténation de chaînes pour les commandes,
        plus une validation stricte des entrées (liste blanche) et le moindre privilège sur la base.
      en: |
        **Q81. What is the OWASP Top 10 and what is it for?** *(junior)*

        It is a list, refreshed every three to four years, of the **ten most critical web security
        risks**, produced by the OWASP foundation from real-world data. It acts as a shared reference:
        training priorities, code-review checkpoints, the basis of a checklist. It is not an exhaustive
        standard, but an excellent starting point.

        **Q82. Explain the principle of least privilege.** *(junior)*

        Every user, service or process receives **only** the rights strictly needed for its task, and
        nothing more. If a component is compromised, the damage stays confined to its scope. In practice:
        narrow IAM roles, dedicated ServiceAccounts, no "admin everywhere" account, and temporary rather
        than permanent access.

        **Q83. Difference between authentication and authorization?** *(junior)*

        **Authentication** proves *who you are* (password, MFA, certificate). **Authorization** decides
        *what you are allowed to do* once identified (RBAC, ABAC). You authenticate once, you authorize on
        every action. A classic flaw is to authenticate well but forget to check authorization on the
        server for each request.

        **Q84. How do you store user passwords?** *(mid)*

        Never in clear text, never reversibly encrypted, never with a plain MD5 or SHA-256. Use a **slow,
        salted** hashing function designed for passwords: **Argon2id** (recommended), bcrypt or scrypt.
        The per-user salt defeats rainbow tables, and the high cost makes offline cracking very slow.

        **Q85. What is an injection and how do you prevent it?** *(mid)*

        An injection happens when user input is interpreted as **code** (SQL, shell command, LDAP). The
        main defense is **separating code from data**: parameterized queries for SQL, safe APIs instead of
        string concatenation for commands, plus strict input validation (allow-list) and least privilege
        on the database.
  - heading:
      fr: "Questions 86 à 90 : API, secrets et chaîne d'approvisionnement"
      en: "Questions 86 to 90: APIs, secrets and the supply chain"
    body:
      fr: |
        **Q86. Comment sécurisez-vous une API REST ?** *(confirmé)*

        Authentification forte (OAuth2/OIDC, clés ou mTLS selon le contexte), **autorisation vérifiée à
        chaque endpoint**, validation stricte des entrées contre un schéma (OpenAPI), **rate limiting**
        et quotas, TLS partout, pas de données sensibles dans les URL, et journalisation des accès. On
        s'appuie sur l'OWASP API Security Top 10, où la faille numéro un est le contrôle d'accès au niveau
        objet (BOLA/IDOR).

        **Q87. Qu'est-ce qu'une IDOR (référence directe à un objet) ?** *(confirmé)*

        C'est quand un utilisateur change un identifiant dans une requête (`/invoices/123` ->
        `/invoices/124`) et accède aux données d'un autre, parce que le serveur ne vérifie pas qu'il est
        bien **propriétaire** de l'objet. La correction : contrôler l'autorisation *sur l'objet* côté
        serveur, pas seulement l'authentification, et éviter de se fier à des identifiants devinables.

        **Q88. Où et comment stockez-vous les secrets d'une application ?** *(confirmé)*

        Jamais dans le code ni dans Git. On les injecte par variables d'environnement issues d'un
        **gestionnaire de secrets** (HashiCorp Vault, AWS Secrets Manager, un coffre cloud), idéalement
        avec des **secrets dynamiques à durée de vie courte** et une rotation automatique. En CI/CD, on
        préfère l'**OIDC** aux clés statiques, et on scanne le dépôt avec Gitleaks pour détecter les fuites.

        **Q89. Qu'est-ce qu'une attaque de la chaîne d'approvisionnement logicielle ?** *(senior)*

        L'attaquant compromet une **dépendance** ou un outil de build plutôt que votre code directement :
        paquet malveillant, mainteneur compromis, typosquatting, build empoisonné. Défenses : verrouiller
        les versions (lockfiles), un **SBOM** (inventaire des composants), le scan SCA, la vérification des
        signatures, des builds reproductibles et des runners CI isolés avec des permissions minimales.

        **Q90. Qu'est-ce que le DevSecOps « shift left » et a-t-il des limites ?** *(senior)*

        « Shift left » signifie déplacer les contrôles de sécurité **tôt** dans le cycle (IDE, pre-commit,
        PR) pour corriger moins cher. Mais déplacer à gauche ne suffit pas : il faut aussi « shift right »,
        c'est-à-dire la détection à l'exécution (Falco), l'observabilité et la réponse à incident. La
        sécurité couvre toute la chaîne, pas seulement le début.
      en: |
        **Q86. How do you secure a REST API?** *(mid)*

        Strong authentication (OAuth2/OIDC, keys or mTLS depending on context), **authorization checked at
        every endpoint**, strict input validation against a schema (OpenAPI), **rate limiting** and
        quotas, TLS everywhere, no sensitive data in URLs, and access logging. Lean on the OWASP API
        Security Top 10, where the number-one flaw is object-level access control (BOLA/IDOR).

        **Q87. What is an IDOR (insecure direct object reference)?** *(mid)*

        It is when a user changes an identifier in a request (`/invoices/123` -> `/invoices/124`) and
        reaches someone else's data, because the server does not check that they actually **own** the
        object. The fix: check authorization *on the object* on the server side, not just authentication,
        and avoid relying on guessable identifiers.

        **Q88. Where and how do you store an application's secrets?** *(mid)*

        Never in code or in Git. Inject them through environment variables sourced from a **secrets
        manager** (HashiCorp Vault, AWS Secrets Manager, a cloud vault), ideally with **short-lived dynamic
        secrets** and automatic rotation. In CI/CD, prefer **OIDC** over static keys, and scan the repo
        with Gitleaks to detect leaks.

        **Q89. What is a software supply-chain attack?** *(senior)*

        The attacker compromises a **dependency** or a build tool rather than your code directly: malicious
        package, compromised maintainer, typosquatting, poisoned build. Defenses: pin versions (lockfiles),
        an **SBOM** (component inventory), SCA scanning, signature verification, reproducible builds and
        isolated CI runners with minimal permissions.

        **Q90. What is DevSecOps "shift left", and does it have limits?** *(senior)*

        "Shift left" means moving security checks **early** in the cycle (IDE, pre-commit, PR) to fix them
        more cheaply. But shifting left is not enough: you also need to "shift right", that is runtime
        detection (Falco), observability and incident response. Security spans the whole chain, not just
        the beginning.
  - heading:
      fr: "Questions 91 à 95 : réponse à incident"
      en: "Questions 91 to 95: incident response"
    body:
      fr: |
        **Q91. Quelles sont les grandes phases d'une réponse à incident ?** *(confirmé)*

        Le modèle classique (NIST) comporte : **préparation**, **détection et analyse**, **confinement**,
        **éradication**, **récupération**, puis **leçons apprises**. L'erreur fréquente est de sauter
        directement à l'éradication : on supprime la menace mais on perd les preuves et on ignore le
        vecteur d'entrée, donc l'attaquant revient.

        **Q92. Un secret a fuité dans un dépôt Git public. Que faites-vous ?** *(confirmé)*

        Je considère le secret comme **compromis** : le retirer du code ne suffit pas, il reste dans
        l'historique. Je le **révoque et le fais tourner immédiatement**, je cherche des traces
        d'utilisation dans les journaux, puis je nettoie l'historique si nécessaire. Enfin, je corrige la
        cause : scan de secrets en pre-commit et en CI, et passage à un gestionnaire de secrets.

        **Q93. Comment priorisez-vous les vulnérabilités à corriger ?** *(confirmé)*

        Je ne me fie pas qu'au score CVSS. Je croise **sévérité**, **exploitabilité réelle** (existe-t-il
        un exploit public, la faille est-elle dans la liste CISA KEV ?), **exposition** (le composant
        est-il accessible depuis Internet ?) et **impact métier**. Une faille moyenne exposée et activement
        exploitée passe avant une faille critique interne et théorique. Des cadres comme EPSS et SSVC aident.

        **Q94. Qu'est-ce qu'un post-mortem « sans reproche » (blameless) ?** *(senior)*

        Une analyse d'incident qui cherche les **causes systémiques** plutôt qu'un coupable. L'idée :
        si les gens ont peur d'être punis, ils cachent les erreurs et l'organisation n'apprend pas. On
        documente la chronologie, l'impact, les causes et des **actions correctives** concrètes avec un
        responsable et une échéance. La question n'est pas « qui ? » mais « quel garde-fou a manqué ? ».

        **Q95. Comment détecteriez-vous qu'un serveur est compromis ?** *(senior)*

        Signaux : connexions sortantes inhabituelles, pics de charge, nouveaux processus ou comptes,
        binaires modifiés (vérification d'intégrité AIDE), tâches cron suspectes, journaux effacés. Je
        corrèle ces signaux dans un **SIEM**, je m'appuie sur la détection à l'exécution (Falco, auditd) et
        je raisonne avec **MITRE ATT&CK** pour relier les indices à des techniques connues.
      en: |
        **Q91. What are the main phases of incident response?** *(mid)*

        The classic model (NIST) is: **preparation**, **detection and analysis**, **containment**,
        **eradication**, **recovery**, then **lessons learned**. A common mistake is to jump straight to
        eradication: you remove the threat but lose the evidence and ignore the entry vector, so the
        attacker comes back.

        **Q92. A secret leaked in a public Git repository. What do you do?** *(mid)*

        I treat the secret as **compromised**: removing it from the code is not enough, it stays in the
        history. I **revoke and rotate it immediately**, look for signs of use in the logs, then clean the
        history if needed. Finally I fix the root cause: secret scanning in pre-commit and CI, and moving
        to a secrets manager.

        **Q93. How do you prioritize which vulnerabilities to fix?** *(mid)*

        I do not rely on the CVSS score alone. I combine **severity**, **real exploitability** (is there a
        public exploit, is it on the CISA KEV list?), **exposure** (is the component reachable from the
        internet?) and **business impact**. A medium flaw that is exposed and actively exploited comes
        before a critical but internal, theoretical one. Frameworks like EPSS and SSVC help.

        **Q94. What is a blameless post-mortem?** *(senior)*

        An incident review that looks for **systemic causes** rather than a culprit. The idea: if people
        fear punishment, they hide mistakes and the organization does not learn. You document the timeline,
        the impact, the causes and concrete **corrective actions** with an owner and a due date. The
        question is not "who?" but "which safeguard was missing?".

        **Q95. How would you detect that a server is compromised?** *(senior)*

        Signals: unusual outbound connections, load spikes, new processes or accounts, modified binaries
        (AIDE integrity check), suspicious cron jobs, wiped logs. I correlate these signals in a **SIEM**,
        lean on runtime detection (Falco, auditd) and reason with **MITRE ATT&CK** to tie the clues to
        known techniques.
  - heading:
      fr: "Questions 96 à 100 : comportemental (méthode STAR)"
      en: "Questions 96 to 100: behavioral (STAR method)"
    body:
      fr: |
        Pour ces questions, répondez avec une **histoire réelle** structurée en STAR : la **S**ituation,
        la **T**âche à accomplir, l'**A**ction que *vous* avez menée, le **R**ésultat mesurable.

        **Q96. Parlez-moi d'une fois où vous avez découvert une faille grave.** *(tous niveaux)*

        Racontez comment vous l'avez trouvée, comment vous l'avez signalée **sans dramatiser ni cacher**,
        et comment vous avez contribué à la corriger. Le recruteur évalue votre honnêteté et votre sens
        des responsabilités, pas seulement la technique.

        **Q97. Un développeur refuse de corriger une vulnérabilité que vous signalez. Que faites-vous ?** *(confirmé)*

        Montrez que vous savez **convaincre sans imposer** : expliquer le risque en termes métier, fournir
        un exemple d'exploitation, proposer une correction concrète et chiffrer l'effort. Si le désaccord
        persiste, on documente le risque et on le fait **accepter formellement** par le bon responsable.
        La sécurité accompagne, elle ne joue pas la police.

        **Q98. Décrivez un projet où vous avez dû apprendre une technologie rapidement.** *(tous niveaux)*

        Illustrez votre **méthode d'apprentissage** : documentation officielle, laboratoire personnel,
        petits projets. Le domaine évolue sans cesse ; les recruteurs cherchent des gens capables
        d'apprendre seuls, pas des gens qui savent déjà tout.

        **Q99. Comment restez-vous à jour en sécurité ?** *(tous niveaux)*

        Soyez concret : blogs et avis de sécurité, newsletters, CVE et CISA KEV, laboratoires (homelab,
        plateformes d'entraînement), conférences, et contribution à des projets. Nommez deux ou trois
        sources que vous suivez vraiment ; une réponse vague sonne faux.

        **Q100. Où vous voyez-vous dans trois ans ?** *(tous niveaux)*

        Montrez une direction cohérente avec le poste (par exemple se spécialiser en sécurité cloud ou
        AppSec, passer une certification, prendre plus de responsabilités) sans réciter un plan rigide.
        L'honnêteté et la curiosité comptent plus qu'une réponse « parfaite ».
      en: |
        For these questions, answer with a **real story** structured in STAR: the **S**ituation, the
        **T**ask to accomplish, the **A**ction *you* took, the measurable **R**esult.

        **Q96. Tell me about a time you found a serious vulnerability.** *(all levels)*

        Tell how you found it, how you reported it **without dramatizing or hiding it**, and how you helped
        fix it. The recruiter assesses your honesty and sense of responsibility, not just the technique.

        **Q97. A developer refuses to fix a vulnerability you reported. What do you do?** *(mid)*

        Show that you can **persuade without imposing**: explain the risk in business terms, provide an
        exploitation example, propose a concrete fix and estimate the effort. If disagreement persists, you
        document the risk and have it **formally accepted** by the right owner. Security enables, it does
        not play police.

        **Q98. Describe a project where you had to learn a technology fast.** *(all levels)*

        Illustrate your **learning method**: official documentation, personal lab, small projects. The
        field changes constantly; recruiters look for people who can learn on their own, not people who
        already know everything.

        **Q99. How do you stay up to date in security?** *(all levels)*

        Be concrete: blogs and security advisories, newsletters, CVEs and CISA KEV, labs (homelab, practice
        platforms), conferences, and contributing to projects. Name two or three sources you actually
        follow; a vague answer rings false.

        **Q100. Where do you see yourself in three years?** *(all levels)*

        Show a direction consistent with the role (for example specializing in cloud security or AppSec,
        taking a certification, taking on more responsibility) without reciting a rigid plan. Honesty and
        curiosity matter more than a "perfect" answer.

examples:
  - title:
      fr: "Exercice en direct : « Sécurisez ce Dockerfile »"
      en: "Live exercise: \"Secure this Dockerfile\""
    file: Dockerfile
    lang: dockerfile
    kind: secure
    code: |
      # syntax=docker/dockerfile:1

      # ---- Build stage: compilers and dev tools stay out of the final image ----
      FROM node:22-slim AS build
      WORKDIR /app
      # Copy manifests first for better layer caching and to install only declared deps
      COPY package.json package-lock.json ./
      # npm ci installs the exact locked versions, reproducible builds
      RUN npm ci --omit=dev
      COPY . .

      # ---- Runtime stage: minimal image, no build toolchain ----
      FROM node:22-slim
      # Dedicated unprivileged user with a fixed numeric UID (verifiable by Kubernetes)
      RUN groupadd --system --gid 10001 app \
          && useradd --system --uid 10001 --gid app --no-create-home app
      WORKDIR /app
      COPY --from=build --chown=app:app /app /app
      # Run as non-root so a container escape does not land on root
      USER 10001
      # Unprivileged port above 1024
      EXPOSE 3000
      # Exec form: the app is PID 1 and receives SIGTERM directly for clean shutdown
      CMD ["node", "server.js"]
    output: |
      $ docker build -t api:1.0.0 .
      $ docker run --rm api:1.0.0 id
      uid=10001(app) gid=10001(app) groups=10001(app)
    note:
      fr: "Les points à verbaliser : image de base versionnée et minimale, build multi-étapes, dépendances figées (`npm ci`), utilisateur non root à UID numérique, forme exec. Ajoutez un `.dockerignore` (`.git`, `.env`) et l'épinglage par digest en production."
      en: "Points to say out loud: versioned minimal base image, multi-stage build, pinned dependencies (`npm ci`), non-root numeric UID user, exec form. Add a `.dockerignore` (`.git`, `.env`) and pin the base image by digest in production."

  - title:
      fr: "Exercice en direct : code vulnérable à l'injection SQL"
      en: "Live exercise: SQL-injection-vulnerable code"
    file: users_vulnerable.py
    lang: python
    kind: vulnerable
    code: |
      import sqlite3

      db = sqlite3.connect(":memory:")
      db.execute("CREATE TABLE users (name TEXT, role TEXT)")
      db.execute("INSERT INTO users VALUES ('alice', 'admin'), ('bob', 'user')")


      def find_user(name):
          # BUG: user input is concatenated straight into the SQL string
          query = "SELECT name, role FROM users WHERE name = '" + name + "'"
          return db.execute(query).fetchall()


      print("Normal:", find_user("bob"))
      # The attacker makes the WHERE clause always true and dumps the whole table
      print("Attack:", find_user("x' OR '1'='1"))
    output: |
      Normal: [('bob', 'user')]
      Attack: [('alice', 'admin'), ('bob', 'user')]
    note:
      fr: "En entretien, nommez la faille (injection SQL par concaténation), montrez l'exploit (`' OR '1'='1`), puis annoncez la correction : une requête paramétrée. Enchaînez sur l'exemple suivant."
      en: "In the interview, name the flaw (SQL injection by concatenation), show the exploit (`' OR '1'='1`), then announce the fix: a parameterized query. Move on to the next example."

  - title:
      fr: "Exercice en direct : l'injection SQL corrigée"
      en: "Live exercise: the SQL injection fixed"
    file: users_secure.py
    lang: python
    kind: secure
    code: |
      import sqlite3

      db = sqlite3.connect(":memory:")
      db.execute("CREATE TABLE users (name TEXT, role TEXT)")
      db.execute("INSERT INTO users VALUES ('alice', 'admin'), ('bob', 'user')")


      def find_user(name):
          # FIX: parameterized query. The value is bound separately and never parsed as SQL
          query = "SELECT name, role FROM users WHERE name = ?"
          return db.execute(query, (name,)).fetchall()


      print("Normal:", find_user("bob"))
      # The same attack now returns nothing: the input is treated as data, not code
      print("Attack:", find_user("x' OR '1'='1"))
    output: |
      Normal: [('bob', 'user')]
      Attack: []
    note:
      fr: "Une seule idée à retenir : **séparer le code des données**. Le marqueur `?` transmet la valeur à part. Mentionnez aussi la validation des entrées et le moindre privilège sur la base en défense en profondeur."
      en: "One idea to remember: **separate code from data**. The `?` placeholder passes the value separately. Also mention input validation and least privilege on the database as defense in depth."

  - title:
      fr: "Gabarit de réponse comportementale (méthode STAR)"
      en: "Behavioral answer template (STAR method)"
    file: star-template.md
    lang: markdown
    kind: neutral
    code: |
      ## STAR — "Tell me about a time you found a serious vulnerability"

      **Situation** (set the scene, 1-2 sentences)
      > During a code review on our payment service, I noticed an endpoint
      > that returned any invoice by its numeric id.

      **Task** (what was your responsibility?)
      > I had to confirm whether it was exploitable and get it fixed before release.

      **Action** (what *you* did — the longest part, use "I")
      > I reproduced an IDOR by requesting another tenant's invoice, wrote a short
      > proof of concept, opened a ticket with the business impact, and paired with
      > the developer to add a server-side ownership check and an integration test.

      **Result** (measurable outcome)
      > The fix shipped the same sprint, we added an automated test so it cannot
      > regress, and I ran a quick workshop so the team spots IDOR in future reviews.
    note:
      fr: "Gardez l'action à la première personne (« j'ai ») et finissez toujours par un résultat **mesurable**. Préparez trois histoires STAR réutilisables : une réussite, un échec dont vous avez appris, un conflit résolu."
      en: "Keep the action in the first person (\"I did\") and always end with a **measurable** result. Prepare three reusable STAR stories: a success, a failure you learned from, a conflict you resolved."

mistake:
  fr: |
    **Réciter de la théorie sans jamais répondre à la vraie question.**

    Pour les questions comportementales, les candidats partent souvent dans un cours magistral (« la
    réponse à incident, c'est six phases... ») au lieu de raconter ce qu'**ils** ont fait. Le recruteur
    veut une histoire concrète et votre rôle dedans. À l'inverse, pour les questions techniques, évitez
    le « ça dépend » sans suite : donnez une réponse claire, puis nuancez.
  en: |
    **Reciting theory without ever answering the real question.**

    For behavioral questions, candidates often launch into a lecture ("incident response has six
    phases...") instead of telling what **they** did. The recruiter wants a concrete story and your role
    in it. Conversely, for technical questions, avoid an open-ended "it depends": give a clear answer
    first, then add nuance.

bestPractice:
  fr: |
    - **Structurez en STAR** chaque réponse comportementale, et terminez par un résultat chiffré.
    - **Préparez les deux classiques en direct** : sécuriser un Dockerfile et corriger une injection SQL,
      sans documentation, en expliquant chaque ligne.
    - **Soyez honnête** : « je ne sais pas, mais voici comment je trouverais » vaut mieux qu'un bluff.
    - **Reliez tout au risque métier** : un bon profil sécurité parle impact et priorités, pas seulement outils.
    - **Posez des questions** à la fin : organisation de la sécurité, gestion des incidents, dette technique.
  en: |
    - **Structure every behavioral answer in STAR**, and finish with a quantified result.
    - **Prepare the two live classics**: secure a Dockerfile and fix a SQL injection, without
      documentation, explaining every line.
    - **Be honest**: "I don't know, but here is how I'd find out" beats a bluff.
    - **Tie everything back to business risk**: a strong security profile talks impact and priorities, not
      just tools.
    - **Ask questions** at the end: how security is organized, how incidents are handled, technical debt.

exercise:
  statement:
    fr: |
      Un recruteur vous demande : « Un pipeline CI a poussé une clé AWS dans un dépôt GitHub **public**
      il y a deux heures. Que faites-vous, dans l'ordre ? »

      Rédigez votre réponse en 5 étapes, dans l'ordre de priorité, comme si vous la disiez à l'oral.
    en: |
      A recruiter asks: "A CI pipeline pushed an AWS key into a **public** GitHub repository two hours
      ago. What do you do, in order?"

      Write your answer in 5 ordered steps, in priority order, as if you were saying it out loud.
  solution:
    file: incident-answer.md
    lang: markdown
    code: |
      1. **Revoke and rotate first.** Disable/delete the leaked AWS access key immediately
         (IAM) and issue a new one. The key is public — assume it is already scraped.
      2. **Investigate abuse.** Check CloudTrail for calls made with that key since it
         leaked: new IAM users, resources created, data accessed. Contain any abuse.
      3. **Remove and clean.** Delete the secret from the code and purge it from Git
         history; the commit alone is not enough. Confirm the repo no longer exposes it.
      4. **Fix the root cause.** Add secret scanning (Gitleaks) as a pre-commit hook and a
         CI gate, and move the secret to a manager (Secrets Manager) injected via OIDC,
         not a static key.
      5. **Write it up.** A short blameless post-mortem: timeline, impact, actions with
         owners and dates, so it cannot happen the same way again.
    note:
      fr: "L'ordre est le point noté : **révoquer avant de nettoyer**. Supprimer d'abord le secret du code pendant qu'il reste actif laisse une fenêtre d'exploitation. La cause racine et le post-mortem montrent la maturité."
      en: "The order is what's graded: **revoke before cleaning up**. Removing the secret from the code first while it is still active leaves an exploitation window. The root cause and post-mortem show maturity."

quiz:
  - q:
      fr: "Que vérifie-t-on d'abord pour corriger une IDOR (référence directe à un objet) ?"
      en: "What do you check first to fix an IDOR (insecure direct object reference)?"
    options:
      fr:
        - "Que l'utilisateur est bien propriétaire de l'objet, côté serveur"
        - "Que l'identifiant est chiffré dans l'URL"
        - "Que l'utilisateur est authentifié"
        - "Que le mot de passe est suffisamment long"
      en:
        - "That the user actually owns the object, on the server side"
        - "That the identifier is encrypted in the URL"
        - "That the user is authenticated"
        - "That the password is long enough"
    answer: 0
    why:
      fr: "L'IDOR est une faille d'**autorisation** : l'utilisateur est authentifié mais le serveur ne vérifie pas qu'il a le droit d'accéder à *cet* objet précis."
      en: "IDOR is an **authorization** flaw: the user is authenticated but the server does not check they are allowed to access *that specific* object."
  - q:
      fr: "Quelle fonction est adaptée au stockage de mots de passe ?"
      en: "Which function is appropriate for storing passwords?"
    options:
      fr:
        - "MD5"
        - "SHA-256 simple"
        - "Argon2id"
        - "Base64"
      en:
        - "MD5"
        - "Plain SHA-256"
        - "Argon2id"
        - "Base64"
    answer: 2
    why:
      fr: "Argon2id est une fonction de hachage lente, salée et résistante au matériel, conçue pour les mots de passe. MD5 et SHA-256 sont trop rapides ; Base64 n'est qu'un encodage."
      en: "Argon2id is a slow, salted, hardware-resistant hashing function built for passwords. MD5 and SHA-256 are too fast; Base64 is only an encoding."
  - q:
      fr: "Dans la réponse à incident, quelle est la première action face à un secret fuité et encore actif ?"
      en: "In incident response, what is the first action for a leaked secret that is still active?"
    options:
      fr:
        - "Rédiger le post-mortem"
        - "Révoquer et faire tourner le secret"
        - "Supprimer le fichier du dernier commit"
        - "Prévenir l'équipe marketing"
      en:
        - "Write the post-mortem"
        - "Revoke and rotate the secret"
        - "Delete the file from the latest commit"
        - "Notify the marketing team"
    answer: 1
    why:
      fr: "Un secret public est à considérer comme compromis : on le révoque et on le fait tourner immédiatement, avant tout nettoyage de l'historique."
      en: "A public secret must be treated as compromised: revoke and rotate it immediately, before any history cleanup."
  - q:
      fr: "À quoi sert la méthode STAR dans un entretien ?"
      en: "What is the STAR method used for in an interview?"
    options:
      fr:
        - "À calculer un score de risque"
        - "À structurer une réponse comportementale concrète"
        - "À classer les vulnérabilités"
        - "À configurer un pipeline CI"
      en:
        - "To compute a risk score"
        - "To structure a concrete behavioral answer"
        - "To rank vulnerabilities"
        - "To configure a CI pipeline"
    answer: 1
    why:
      fr: "STAR (Situation, Tâche, Action, Résultat) structure une histoire réelle : contexte, votre responsabilité, ce que vous avez fait, le résultat mesurable."
      en: "STAR (Situation, Task, Action, Result) structures a real story: context, your responsibility, what you did, and the measurable outcome."
  - q:
      fr: "Pourquoi ne pas prioriser les vulnérabilités uniquement sur le score CVSS ?"
      en: "Why not prioritize vulnerabilities on the CVSS score alone?"
    options:
      fr:
        - "Parce que le CVSS est toujours faux"
        - "Parce qu'il ne reflète ni l'exploitabilité réelle, ni l'exposition, ni l'impact métier"
        - "Parce qu'il est payant"
        - "Parce qu'il ne s'applique qu'aux conteneurs"
      en:
        - "Because CVSS is always wrong"
        - "Because it reflects neither real exploitability, nor exposure, nor business impact"
        - "Because it is paid"
        - "Because it only applies to containers"
    answer: 1
    why:
      fr: "Le CVSS mesure une sévérité théorique. Une bonne priorisation croise exploitabilité (EPSS, CISA KEV), exposition et impact métier."
      en: "CVSS measures a theoretical severity. Good prioritization combines exploitability (EPSS, CISA KEV), exposure and business impact."
