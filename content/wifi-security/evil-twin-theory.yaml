description:
  fr: "Comprendre la menace des points d'accès pirates (evil twin) et des attaques de déauthentification, et surtout comment les détecter et s'en protéger."
  en: "Understand the threat of rogue access points (evil twin) and deauthentication attacks, and above all how to detect and defend against them."
duration: 20

intro:
  fr: |
    Cette leçon est **conceptuelle** et **défensive**. Elle explique comment fonctionnent deux menaces Wi-Fi
    célèbres — l'**evil twin** (jumeau maléfique) et la **déauthentification** — afin que vous sachiez les
    **reconnaître** et vous en **protéger**. Elle ne fournit **aucun** mode opératoire clé en main pour les
    mener contre autrui, ce qui serait illégal.

    Imaginez un faux guichet de banque installé juste à côté du vrai : il affiche le même logo, vous invite à
    taper votre code, et le vole. L'evil twin, c'est cela pour le Wi-Fi : un point d'accès pirate qui imite le
    nom (SSID) d'un réseau de confiance pour tromper les appareils et intercepter leurs données.

    Comprendre ces attaques est indispensable pour un défenseur : on ne protège bien que ce que l'on comprend.
    **Avertissement légal** : créer un faux point d'accès imitant un réseau que vous ne possédez pas, ou
    déauthentifier les appareils d'autrui, constitue une interception et un accès frauduleux — c'est un délit.
    Les seules manipulations pratiques autorisées ici concernent **votre propre réseau** (détection, test de
    résilience) ou un périmètre **autorisé par écrit**.
  en: |
    This lesson is **conceptual** and **defensive**. It explains how two famous Wi-Fi threats work — the **evil
    twin** and **deauthentication** — so that you can **recognise** them and **protect** against them. It
    provides **no** turnkey procedure to run them against others, which would be illegal.

    Picture a fake bank counter set up right next to the real one: it shows the same logo, invites you to type
    your PIN, and steals it. The evil twin is that for Wi-Fi: a rogue access point that imitates the name (SSID)
    of a trusted network to fool devices and intercept their data.

    Understanding these attacks is essential for a defender: you only protect well what you understand. **Legal
    warning**: creating a fake access point imitating a network you do not own, or deauthenticating other
    people's devices, constitutes interception and unauthorised access — it is a crime. The only hands-on
    manipulations allowed here concern **your own network** (detection, resilience testing) or a scope
    **authorised in writing**.

sections:
  - heading:
      fr: "L'evil twin : un jumeau qui trompe"
      en: "The evil twin: a twin that deceives"
    body:
      fr: |
        Le Wi-Fi n'oblige pas un appareil à vérifier **qui** se cache derrière un nom de réseau. Si deux points
        d'accès annoncent le SSID `Cafe-WiFi`, un téléphone peut se connecter au plus puissant des deux, sans
        savoir lequel est légitime. Un attaquant exploite cette confiance :

        1. Il monte un point d'accès qui **annonce le même SSID** qu'un réseau de confiance.
        2. Il le rend plus **puissant** ou plus proche, pour que les appareils le préfèrent.
        3. Une fois les victimes connectées, tout leur trafic passe par lui : il peut l'observer, le modifier,
           ou présenter une **fausse page de connexion** (*captive portal*) pour voler des identifiants.

        Le danger est maximal sur les **réseaux ouverts** (sans chiffrement) et les portails captifs, où rien ne
        prouve l'identité du point d'accès. Sur un réseau **WPA2/WPA3 avec mot de passe**, l'evil twin ne peut
        pas reproduire la clé sans connaître le mot de passe : c'est déjà une première protection, que la leçon
        suivante renforce.
      en: |
        Wi-Fi does not force a device to verify **who** is behind a network name. If two access points advertise
        the SSID `Cafe-WiFi`, a phone may connect to the stronger of the two, with no way to know which is
        legitimate. An attacker exploits this trust:

        1. They set up an access point that **advertises the same SSID** as a trusted network.
        2. They make it **stronger** or closer, so devices prefer it.
        3. Once victims connect, all their traffic goes through it: they can observe it, modify it, or present a
           **fake login page** (*captive portal*) to steal credentials.

        The danger peaks on **open networks** (no encryption) and captive portals, where nothing proves the
        access point's identity. On a **WPA2/WPA3 network with a password**, the evil twin cannot reproduce the
        key without knowing the password: that is already a first protection, which the next lesson reinforces.
  - heading:
      fr: "La déauthentification : forcer la déconnexion"
      en: "Deauthentication: forcing disconnection"
    body:
      fr: |
        Dans le Wi-Fi classique (jusqu'à WPA2 sans protection des trames), les **trames de gestion** —
        notamment celles qui gèrent la connexion et la déconnexion — ne sont **pas authentifiées**. Un attaquant
        peut donc forger une trame de **déauthentification** prétendant venir du point d'accès, et éjecter un
        appareil du réseau.

        À quoi sert cette attaque, côté menace ?

        - **Capturer un handshake** : en forçant une reconnexion, l'attaquant provoque un nouveau 4-way
          handshake (voir la leçon de capture).
        - **Pousser vers l'evil twin** : en coupant le vrai réseau, les appareils se rabattent sur le jumeau.
        - **Déni de service** : empêcher purement et simplement la connexion.

        Le point à retenir pour la défense : cette attaque repose sur l'**absence de protection des trames de
        gestion**. La parade existe et s'appelle le **Protected Management Frames (PMF / 802.11w)**, détaillée
        dans la leçon de durcissement. Comprendre la faille, c'est comprendre pourquoi la parade est nécessaire.
      en: |
        In classic Wi-Fi (up to WPA2 without frame protection), the **management frames** — notably those that
        handle connection and disconnection — are **not authenticated**. So an attacker can forge a
        **deauthentication** frame pretending to come from the access point, and kick a device off the network.

        What is this attack used for, on the threat side?

        - **Capturing a handshake**: forcing a reconnection triggers a new 4-way handshake (see the capture
          lesson).
        - **Pushing toward the evil twin**: by cutting the real network, devices fall back on the twin.
        - **Denial of service**: plainly preventing connection.

        The point to remember for defence: this attack relies on the **absence of protection on management
        frames**. The countermeasure exists and is called **Protected Management Frames (PMF / 802.11w)**,
        detailed in the hardening lesson. Understanding the flaw is understanding why the countermeasure is
        needed.
  - heading:
      fr: "Détecter et se protéger"
      en: "Detecting and protecting"
    body:
      fr: |
        Comme défenseur ou utilisateur, plusieurs signaux trahissent ces attaques :

        - **Deux points d'accès avec le même SSID mais des BSSID différents** : suspect, surtout si l'un apparaît
          soudainement avec un signal très fort.
        - **Déconnexions répétées** sans raison : possibles trames de déauthentification.
        - **Un réseau de confiance qui devient soudain « ouvert »** ou demande à nouveau un identifiant via une
          page web : signe possible d'un portail captif pirate.

        Les protections concrètes (détaillées dans la leçon suivante) :

        - **WPA3 ou WPA2 avec PMF** : authentifie les trames de gestion, ce qui bloque la déauthentification
          classique.
        - **Ne jamais saisir d'identifiants sur un réseau ouvert** sans HTTPS vérifié ; préférer un **VPN** sur
          les réseaux publics.
        - **802.1X / EAP** en entreprise : le client **vérifie le certificat** du serveur, donc un evil twin sans
          le bon certificat est rejeté.

        La logique est toujours la même : rendre vérifiable l'**identité** du point d'accès et **l'intégrité**
        des trames. C'est tout l'objet du durcissement Wi-Fi.
      en: |
        As a defender or user, several signals betray these attacks:

        - **Two access points with the same SSID but different BSSIDs**: suspicious, especially if one appears
          suddenly with a very strong signal.
        - **Repeated disconnections** for no reason: possible deauthentication frames.
        - **A trusted network suddenly becoming "open"** or asking again for a credential via a web page: a
          possible sign of a rogue captive portal.

        The concrete protections (detailed in the next lesson):

        - **WPA3 or WPA2 with PMF**: authenticates management frames, which blocks classic deauthentication.
        - **Never enter credentials on an open network** without verified HTTPS; prefer a **VPN** on public
          networks.
        - **802.1X / EAP** in enterprise: the client **verifies the server's certificate**, so an evil twin
          without the right certificate is rejected.

        The logic is always the same: make the access point's **identity** and the frames' **integrity**
        verifiable. That is the whole point of Wi-Fi hardening.

examples:
  - title:
      fr: "Repérer un SSID dupliqué (détection défensive)"
      en: "Spotting a duplicated SSID (defensive detection)"
    file: detect_twin.sh
    lang: bash
    kind: secure
    code: |
      # Defensive: list visible networks and look for the SAME SSID advertised
      # by DIFFERENT BSSIDs - a classic evil-twin signal. This only reads the air.
      nmcli -f SSID,BSSID,CHAN,SIGNAL device wifi list | sort

      # If "MyLab-AP" appears twice with two different BSSIDs, investigate:
      # one of them may be a rogue access point impersonating your network.
    output: |
      SSID        BSSID              CHAN  SIGNAL
      MyLab-AP    AA:BB:CC:DD:EE:FF  6     62
      MyLab-AP    66:66:66:66:66:66  11    95
      Neighbour1  11:22:33:44:55:66  11    40
    note:
      fr: "Deux `MyLab-AP` avec des BSSID différents, dont un au signal anormalement fort (95) sur un autre canal : signal typique d'un evil twin. On **observe**, on ne crée aucun faux point d'accès."
      en: "Two `MyLab-AP` with different BSSIDs, one with an abnormally strong signal (95) on another channel: a typical evil-twin signal. You **observe**, you create no fake access point."
  - title:
      fr: "Vérifier que votre réseau impose la protection des trames"
      en: "Checking that your network enforces frame protection"
    file: check_pmf.sh
    lang: bash
    kind: secure
    code: |
      # Defensive check: does YOUR network use Protected Management Frames (PMF)?
      # PMF (802.11w) is what blocks classic deauthentication attacks.
      # iw shows capabilities of the connection to your own AP.
      iw dev wlan0 link

      # Look for "Management frame protection" or an RSN capability mentioning
      # MFP. If absent, enable PMF on your router (see the hardening lesson).
    output: |
      Connected to aa:bb:cc:dd:ee:ff (on wlan0)
          SSID: MyLab-AP
          freq: 2437
          RSN:  * Management frame protection: required
    note:
      fr: "`Management frame protection: required` confirme que votre réseau active le PMF : les trames de déauthentification forgées sont rejetées. S'il affiche `disabled`, activez-le."
      en: "`Management frame protection: required` confirms your network enables PMF: forged deauthentication frames are rejected. If it shows `disabled`, enable it."
  - title:
      fr: "Protéger ses données sur un réseau non fiable (VPN)"
      en: "Protecting your data on an untrusted network (VPN)"
    file: client.txt
    lang: text
    kind: secure
    code: |
      Defensive habits on any network you do not control:

      1. Prefer networks you trust; be wary of duplicated or open SSIDs.
      2. Verify HTTPS (padlock + correct domain) before typing any credential.
      3. Use a VPN: it encrypts ALL your traffic end-to-end, so even an evil
         twin only sees opaque ciphertext, not your logins or messages.
      4. Turn off auto-connect to open networks, so your phone does not silently
         join a rogue "Free-WiFi" that reuses a known name.

      The attacker's whole advantage is seeing or altering your traffic.
      A VPN removes that advantage even if the access point is malicious.
    note:
      fr: "Un VPN chiffre le trafic de bout en bout : un evil twin ne voit alors que des données illisibles. C'est la protection la plus simple côté utilisateur sur un réseau non maîtrisé."
      en: "A VPN encrypts traffic end-to-end: an evil twin then sees only unreadable data. It is the simplest user-side protection on a network you do not control."

mistake:
  fr: |
    **Croire qu'« essayer un evil twin pour voir » sur un réseau public est anodin.** Monter un faux point
    d'accès qui imite un réseau existant, intercepter le trafic de personnes qui s'y connectent, ou les
    déauthentifier, sont des atteintes graves : interception de communications et accès frauduleux, lourdement
    sanctionnés. Il n'y a pas d'exception « pédagogique » quand des tiers sont touchés. L'apprentissage se fait
    en **comprenant** le mécanisme et en testant la **détection** et la **défense** sur **votre propre**
    matériel, jamais en attaquant les appareils d'autrui.
  en: |
    **Thinking that "trying an evil twin to see" on a public network is harmless.** Setting up a fake access
    point that imitates an existing network, intercepting the traffic of people who connect to it, or
    deauthenticating them, are serious offences: interception of communications and unauthorised access, heavily
    punished. There is no "educational" exception when third parties are affected. Learning happens by
    **understanding** the mechanism and testing **detection** and **defence** on **your own** equipment, never
    by attacking other people's devices.

bestPractice:
  fr: |
    - **Comprenez le mécanisme** (SSID non authentifié, trames de gestion non protégées) pour mieux défendre.
    - **Détectez** : surveillez les SSID dupliqués, les signaux anormaux, les déconnexions répétées.
    - **Activez le PMF (802.11w)** ou WPA3 sur votre réseau pour bloquer la déauthentification classique.
    - **Côté client** : pas d'identifiants sur un réseau ouvert sans HTTPS vérifié, et un VPN sur les réseaux publics.
    - **En entreprise, utilisez 802.1X/EAP** : la vérification du certificat serveur rejette un evil twin.
  en: |
    - **Understand the mechanism** (unauthenticated SSID, unprotected management frames) to defend better.
    - **Detect**: watch for duplicated SSIDs, abnormal signals, repeated disconnections.
    - **Enable PMF (802.11w)** or WPA3 on your network to block classic deauthentication.
    - **Client side**: no credentials on an open network without verified HTTPS, and a VPN on public networks.
    - **In enterprise, use 802.1X/EAP**: verifying the server certificate rejects an evil twin.

exercise:
  statement:
    fr: |
      Dans un lieu public, votre téléphone propose deux réseaux nommés `Cafe-WiFi`, l'un ouvert et l'un que vous
      aviez déjà utilisé. Peu après, vous êtes déconnecté plusieurs fois, puis une page vous demande de « vous
      reconnecter » en saisissant votre e-mail et un mot de passe.

      1. Quels indices suggèrent une attaque de type evil twin ?
      2. Que faites-vous pour vous protéger ?
    en: |
      In a public place, your phone offers two networks named `Cafe-WiFi`, one open and one you had used before.
      Shortly after, you are disconnected several times, then a page asks you to "reconnect" by entering your
      email and a password.

      1. Which clues suggest an evil-twin-style attack?
      2. What do you do to protect yourself?
  solution:
    file: answer.md
    lang: markdown
    code: |
      ## 1. Clues of an evil-twin attack
      - Two networks with the SAME name (Cafe-WiFi) but likely different BSSIDs.
      - Repeated disconnections: possible deauthentication to push you onto the twin.
      - A sudden page asking for email + password: a rogue captive portal
        trying to steal credentials.

      ## 2. How to protect yourself
      - Do NOT enter any credential on that page.
      - Disconnect; disable auto-connect to open networks.
      - Use mobile data or a VPN instead of the untrusted Wi-Fi.
      - Only trust a login page reached over verified HTTPS on the right domain.
    note:
      fr: "Le réflexe clé : ne jamais saisir d'identifiants sur une page surgie d'un réseau non fiable. Un VPN ou les données mobiles contournent entièrement le piège."
      en: "The key reflex: never enter credentials on a page popped up by an untrusted network. A VPN or mobile data bypasses the trap entirely."

quiz:
  - q:
      fr: "Qu'est-ce qu'un evil twin en Wi-Fi ?"
      en: "What is a Wi-Fi evil twin?"
    options:
      fr:
        - "Un point d'accès pirate qui imite le SSID d'un réseau de confiance"
        - "Un virus qui double les fichiers"
        - "Un câble réseau défectueux"
        - "Un second routeur officiel"
      en:
        - "A rogue access point that imitates the SSID of a trusted network"
        - "A virus that duplicates files"
        - "A faulty network cable"
        - "A second official router"
    answer: 0
    why:
      fr: "L'evil twin annonce le même nom de réseau qu'un AP légitime pour tromper les appareils et intercepter leur trafic."
      en: "The evil twin advertises the same network name as a legitimate AP to fool devices and intercept their traffic."
  - q:
      fr: "Sur quelle faiblesse repose l'attaque de déauthentification classique ?"
      en: "What weakness does the classic deauthentication attack rely on?"
    options:
      fr:
        - "Un mot de passe trop long"
        - "L'absence d'authentification des trames de gestion"
        - "Un canal radio saturé"
        - "Un certificat expiré"
      en:
        - "A password that is too long"
        - "The lack of authentication of management frames"
        - "A saturated radio channel"
        - "An expired certificate"
    answer: 1
    why:
      fr: "Les trames de gestion non protégées peuvent être forgées, ce qui permet d'éjecter un appareil du réseau."
      en: "Unprotected management frames can be forged, which lets an attacker kick a device off the network."
  - q:
      fr: "Quelle protection bloque la déauthentification classique ?"
      en: "Which protection blocks classic deauthentication?"
    options:
      fr:
        - "Le masquage du SSID"
        - "Un canal plus élevé"
        - "Les Protected Management Frames (PMF / 802.11w) ou WPA3"
        - "Un mot de passe plus court"
      en:
        - "Hiding the SSID"
        - "A higher channel"
        - "Protected Management Frames (PMF / 802.11w) or WPA3"
        - "A shorter password"
    answer: 2
    why:
      fr: "Le PMF authentifie les trames de gestion, si bien qu'une trame de déauthentification forgée est rejetée."
      en: "PMF authenticates management frames, so a forged deauthentication frame is rejected."
  - q:
      fr: "Pourquoi un evil twin est-il plus dangereux sur un réseau ouvert ?"
      en: "Why is an evil twin more dangerous on an open network?"
    options:
      fr:
        - "Parce que rien ne prouve l'identité du point d'accès"
        - "Parce que le réseau est plus rapide"
        - "Parce que le SSID est caché"
        - "Parce qu'il n'y a pas d'ondes radio"
      en:
        - "Because nothing proves the access point's identity"
        - "Because the network is faster"
        - "Because the SSID is hidden"
        - "Because there are no radio waves"
    answer: 0
    why:
      fr: "Sans chiffrement ni mot de passe, l'appareil ne peut pas distinguer le vrai AP du jumeau pirate."
      en: "With no encryption or password, the device cannot tell the real AP from the rogue twin."
  - q:
      fr: "Quelle habitude protège le mieux un utilisateur sur un réseau non maîtrisé ?"
      en: "Which habit best protects a user on a network they do not control?"
    options:
      fr:
        - "Saisir ses identifiants rapidement"
        - "Utiliser un VPN qui chiffre tout le trafic"
        - "Activer la connexion automatique partout"
        - "Augmenter la luminosité de l'écran"
      en:
        - "Entering credentials quickly"
        - "Using a VPN that encrypts all traffic"
        - "Enabling auto-connect everywhere"
        - "Increasing the screen brightness"
    answer: 1
    why:
      fr: "Un VPN chiffre le trafic de bout en bout : même un evil twin ne voit que des données illisibles."
      en: "A VPN encrypts traffic end-to-end: even an evil twin sees only unreadable data."
