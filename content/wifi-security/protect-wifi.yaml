description:
  fr: "Protéger son Wi-Fi : WPA3-SAE, phrase de passe forte, 802.1X/EAP, désactivation du WPS, segmentation invité/IoT et protection des trames de gestion."
  en: "Protect your Wi-Fi: WPA3-SAE, a strong passphrase, 802.1X/EAP, disabling WPS, guest/IoT segmentation and management frame protection."
duration: 20

intro:
  fr: |
    Cette leçon est **entièrement défensive** : après avoir compris comment on attaque un réseau sans fil, on
    le **durcit**. L'objectif est que votre Wi-Fi résiste aux attaques vues dans ce cours — capture et
    cassage de mot de passe, evil twin, déauthentification.

    Sécuriser son Wi-Fi, c'est comme sécuriser une maison : une seule serrure ne suffit pas, on empile les
    protections (bonne serrure, alarme, pièces séparées). En Wi-Fi, on combine un **chiffrement moderne**, un
    **mot de passe fort**, des **trames de gestion protégées**, et une **segmentation** qui isole les appareils
    les moins fiables.

    Vous verrez comment choisir **WPA3-SAE** (ou WPA2-AES avec une bonne phrase de passe), activer la
    **protection des trames de gestion (PMF)**, **désactiver le WPS**, utiliser **802.1X/EAP** en entreprise, et
    **segmenter** le réseau (invités, objets connectés). Toutes ces actions se font sur **votre propre** réseau
    ou celui que vous administrez : c'est du durcissement, pas une attaque.
  en: |
    This lesson is **entirely defensive**: having understood how a wireless network is attacked, you now
    **harden** it. The goal is for your Wi-Fi to resist the attacks seen in this course — handshake capture and
    password cracking, evil twin, deauthentication.

    Securing your Wi-Fi is like securing a house: one lock is not enough, you stack protections (a good lock, an
    alarm, separate rooms). In Wi-Fi, you combine **modern encryption**, a **strong password**, **protected
    management frames**, and **segmentation** that isolates the least trustworthy devices.

    You will see how to choose **WPA3-SAE** (or WPA2-AES with a good passphrase), enable **management frame
    protection (PMF)**, **disable WPS**, use **802.1X/EAP** in enterprise, and **segment** the network (guests,
    connected objects). All these actions are performed on **your own** network or one you administer: this is
    hardening, not an attack.

sections:
  - heading:
      fr: "Chiffrement et mot de passe : la base solide"
      en: "Encryption and password: the solid base"
    body:
      fr: |
        Le socle de la sécurité Wi-Fi tient en deux décisions :

        - **Choisir WPA3-SAE** quand c'est possible. Le SAE (*Simultaneous Authentication of Equals*) rend les
          attaques par dictionnaire **hors ligne** impraticables : même un attaquant qui capture les échanges ne
          peut plus deviner le mot de passe à grande vitesse. Si certains appareils anciens imposent WPA2, un
          mode **WPA2/WPA3 mixte** (*transition*) est un compromis acceptable, le temps de les remplacer.
        - **Utiliser une phrase de passe forte**. En WPA2, c'est **la** défense (le cassage hors ligne reste
          possible) ; en WPA3, c'est une sécurité supplémentaire. Visez au moins **15 caractères**, aléatoires,
          par exemple une suite de mots sans lien (`correct-horse-battery-staple-7f3a`). La longueur prime sur
          la complexité.

        Et bien sûr : **jamais WEP ni WPA (TKIP)**, qui n'offrent aucune protection réelle. Ce choix de base,
        chiffrement moderne + mot de passe long, neutralise déjà la majorité des attaques domestiques.
      en: |
        The foundation of Wi-Fi security comes down to two decisions:

        - **Choose WPA3-SAE** when possible. SAE (*Simultaneous Authentication of Equals*) makes **offline**
          dictionary attacks impractical: even an attacker who captures the exchanges can no longer guess the
          password at high speed. If some old devices require WPA2, a **mixed WPA2/WPA3** mode (*transition*) is
          an acceptable compromise while you replace them.
        - **Use a strong passphrase**. In WPA2 it is **the** defence (offline cracking stays possible); in WPA3
          it is an extra safety. Aim for at least **15 characters**, random, for example a string of unrelated
          words (`correct-horse-battery-staple-7f3a`). Length beats complexity.

        And of course: **never WEP or WPA (TKIP)**, which offer no real protection. This basic choice, modern
        encryption + a long password, already neutralises most home attacks.
  - heading:
      fr: "Protéger les trames et désactiver le WPS"
      en: "Protecting frames and disabling WPS"
    body:
      fr: |
        Deux réglages ferment des portes bien connues :

        - **Protected Management Frames (PMF / 802.11w)** : authentifie les trames de gestion, ce qui **bloque la
          déauthentification** classique vue à la leçon précédente. WPA3 l'impose ; en WPA2, activez-le
          (*required* si tous vos appareils le gèrent, sinon *optional*).
        - **Désactiver le WPS** (*Wi-Fi Protected Setup*). Le WPS permet de connecter un appareil avec un code
          PIN à 8 chiffres ou un bouton. Son implémentation par PIN est **notoirement vulnérable** : le PIN se
          devine par force brute en quelques heures, ce qui donne accès au réseau **quel que soit** la force du
          mot de passe Wi-Fi. Un bon mot de passe ne sert à rien si le WPS reste activé.

        | Réglage | Pourquoi |
        |---|---|
        | PMF activé | Bloque la déauthentification et la capture forcée de handshake |
        | WPS désactivé | Supprime une porte dérobée qui contourne le mot de passe |
        | SSID visible | Le masquage n'apporte rien : inutile, voire contre-productif |

        Désactiver le WPS est l'une des actions les plus rentables : un seul réglage supprime une faille majeure.
      en: |
        Two settings close well-known doors:

        - **Protected Management Frames (PMF / 802.11w)**: authenticates management frames, which **blocks**
          the classic deauthentication seen in the previous lesson. WPA3 mandates it; on WPA2, enable it
          (*required* if all your devices support it, otherwise *optional*).
        - **Disable WPS** (*Wi-Fi Protected Setup*). WPS lets you connect a device with an 8-digit PIN or a
          button. Its PIN implementation is **notoriously vulnerable**: the PIN is brute-forced in a few hours,
          which grants network access **regardless** of the Wi-Fi password strength. A good password is useless
          if WPS stays enabled.

        | Setting | Why |
        |---|---|
        | PMF enabled | Blocks deauthentication and forced handshake capture |
        | WPS disabled | Removes a backdoor that bypasses the password |
        | SSID visible | Hiding brings nothing: pointless, even counter-productive |

        Disabling WPS is one of the most cost-effective actions: a single setting removes a major flaw.
  - heading:
      fr: "802.1X/EAP et segmentation"
      en: "802.1X/EAP and segmentation"
    body:
      fr: |
        Pour aller plus loin, deux pratiques de niveau professionnel :

        - **802.1X / EAP** (*WPA-Enterprise*). Au lieu d'un mot de passe partagé par tous, chaque utilisateur
          s'authentifie **individuellement** auprès d'un serveur (RADIUS), souvent avec un certificat. Avantages
          majeurs : révoquer un seul utilisateur sans changer la clé de tous, et surtout le client **vérifie le
          certificat du serveur**, ce qui **rejette un evil twin** qui ne possède pas ce certificat. C'est le
          standard en entreprise.
        - **Segmentation** (réseaux séparés / VLAN). On crée des réseaux distincts :
          - un réseau **principal** pour vos appareils de confiance,
          - un réseau **invité** isolé, sans accès à vos ressources internes,
          - un réseau **IoT** pour les objets connectés (caméras, ampoules), souvent peu sécurisés.

        Si une caméra bon marché est compromise, la segmentation l'empêche d'atteindre votre ordinateur. On
        isole le maillon faible pour qu'il ne contamine pas le reste. Combinées au chiffrement moderne, ces
        mesures constituent une défense **en profondeur**.
      en: |
        To go further, two professional-grade practices:

        - **802.1X / EAP** (*WPA-Enterprise*). Instead of one password shared by everyone, each user
          authenticates **individually** against a server (RADIUS), often with a certificate. Major benefits:
          revoke a single user without changing everyone's key, and above all the client **verifies the server's
          certificate**, which **rejects an evil twin** that lacks that certificate. It is the enterprise
          standard.
        - **Segmentation** (separate networks / VLANs). You create distinct networks:
          - a **main** network for your trusted devices,
          - an isolated **guest** network, with no access to your internal resources,
          - an **IoT** network for connected objects (cameras, bulbs), often poorly secured.

        If a cheap camera is compromised, segmentation stops it from reaching your computer. You isolate the weak
        link so it cannot contaminate the rest. Combined with modern encryption, these measures build a defence
        **in depth**.

examples:
  - title:
      fr: "Configurer un point d'accès en WPA3-SAE avec PMF (hostapd)"
      en: "Configuring an access point in WPA3-SAE with PMF (hostapd)"
    file: hostapd.conf
    lang: ini
    kind: secure
    code: |
      interface=wlan0
      ssid=MyLab-AP
      channel=6

      # WPA3-SAE only (wpa=2 with SAE key management).
      wpa=2
      wpa_key_mgmt=SAE
      rsn_pairwise=CCMP

      # ieee80211w=2 => Protected Management Frames REQUIRED.
      # This blocks classic deauthentication attacks.
      ieee80211w=2

      # A long, random passphrase: the base defence even under WPA3.
      wpa_passphrase=correct-horse-battery-staple-7f3a
    note:
      fr: "`wpa_key_mgmt=SAE` active WPA3 et `ieee80211w=2` impose le PMF : deux réglages qui déjouent à la fois le cassage hors ligne et la déauthentification. La phrase de passe reste longue et aléatoire."
      en: "`wpa_key_mgmt=SAE` enables WPA3 and `ieee80211w=2` enforces PMF: two settings that defeat both offline cracking and deauthentication. The passphrase stays long and random."
  - title:
      fr: "Un mode mixte WPA2/WPA3 pour les appareils anciens"
      en: "A mixed WPA2/WPA3 mode for older devices"
    file: hostapd-mixed.conf
    lang: ini
    kind: secure
    code: |
      interface=wlan0
      ssid=MyLab-AP
      channel=6

      # Transition mode: accept both WPA2-PSK and WPA3-SAE clients.
      wpa=2
      wpa_key_mgmt=WPA-PSK SAE
      rsn_pairwise=CCMP

      # PMF optional (1) so WPA2-only devices still connect; WPA3 devices get
      # PMF required automatically. Move to ieee80211w=2 once all devices support it.
      ieee80211w=1
      wpa_passphrase=correct-horse-battery-staple-7f3a
    note:
      fr: "Le mode transition accepte les deux protocoles : les appareils modernes bénéficient de WPA3, les anciens restent connectés. C'est un compromis temporaire, le temps de remplacer le matériel ancien."
      en: "The transition mode accepts both protocols: modern devices benefit from WPA3, older ones stay connected. It is a temporary compromise while you replace old hardware."
  - title:
      fr: "Checklist de durcissement d'un routeur domestique"
      en: "Home router hardening checklist"
    file: hardening.txt
    lang: text
    kind: secure
    code: |
      Wi-Fi hardening checklist (apply on YOUR OWN router):

      [x] Encryption: WPA3-SAE (or WPA2/WPA3 mixed; never WEP/WPA-TKIP)
      [x] Passphrase: 15+ random characters, unique to this network
      [x] PMF (802.11w): enabled (required if all devices support it)
      [x] WPS: DISABLED (removes a PIN backdoor)
      [x] Router admin password: changed from the factory default
      [x] Firmware: updated to the latest version
      [x] Guest network: separate, isolated from internal devices
      [x] IoT network: separate VLAN/SSID for cameras, bulbs, etc.
      [x] Remote management from the internet: disabled unless needed
    note:
      fr: "Cette liste couvre les décisions clés : chiffrement moderne, mot de passe fort, PMF, WPS désactivé, et segmentation. Le mot de passe d'administration du routeur, souvent oublié, est tout aussi crucial."
      en: "This list covers the key decisions: modern encryption, strong password, PMF, WPS disabled, and segmentation. The router admin password, often forgotten, is just as crucial."

mistake:
  fr: |
    **Mettre un mot de passe Wi-Fi solide mais laisser le WPS activé.** Beaucoup pensent qu'une longue phrase de
    passe suffit, mais le WPS par PIN se casse par force brute en quelques heures et donne l'accès au réseau
    **quel que soit** le mot de passe. De même, garder le mot de passe d'**administration** du routeur à sa
    valeur d'usine annule toutes les autres protections : un attaquant qui atteint l'interface d'admin
    reconfigure tout. La sécurité Wi-Fi est une chaîne : le maillon le plus faible (WPS, admin par défaut)
    détermine le niveau réel.
  en: |
    **Setting a solid Wi-Fi password but leaving WPS enabled.** Many think a long passphrase is enough, but the
    PIN-based WPS is brute-forced in a few hours and grants network access **regardless** of the password.
    Likewise, keeping the router's **admin** password at its factory value cancels every other protection: an
    attacker who reaches the admin interface reconfigures everything. Wi-Fi security is a chain: the weakest link
    (WPS, default admin) sets the real level.

bestPractice:
  fr: |
    - **WPA3-SAE** (ou WPA2/WPA3 mixte en transition) ; jamais WEP ni WPA-TKIP.
    - **Phrase de passe de 15+ caractères aléatoires**, unique à ce réseau.
    - **Activez le PMF (802.11w)** pour bloquer la déauthentification et désactivez le **WPS**.
    - **Changez le mot de passe d'administration** du routeur et **mettez à jour le firmware**.
    - **Segmentez** : réseau invité isolé, réseau IoT séparé ; en entreprise, **802.1X/EAP** avec vérification du certificat serveur.
  en: |
    - **WPA3-SAE** (or mixed WPA2/WPA3 in transition); never WEP or WPA-TKIP.
    - **A 15+ character random passphrase**, unique to this network.
    - **Enable PMF (802.11w)** to block deauthentication and disable **WPS**.
    - **Change the router's admin password** and **update the firmware**.
    - **Segment**: isolated guest network, separate IoT network; in enterprise, **802.1X/EAP** with server certificate verification.

exercise:
  statement:
    fr: |
      Vous configurez le point d'accès `MyLab-AP` et vous voulez une sécurité maximale pour des appareils tous
      récents. Indiquez les valeurs des directives hostapd suivantes et expliquez brièvement chaque choix :

      1. `wpa_key_mgmt`
      2. `ieee80211w`
      3. Un réglage supplémentaire du routeur (hors hostapd) indispensable à ne pas oublier.
    en: |
      You are configuring the access point `MyLab-AP` and want maximum security for all-recent devices. Give the
      values of the following hostapd directives and briefly explain each choice:

      1. `wpa_key_mgmt`
      2. `ieee80211w`
      3. One additional router setting (outside hostapd) that must not be forgotten.
  solution:
    file: secure_ap.conf
    lang: ini
    code: |
      # 1. SAE => WPA3 only, which defeats offline password guessing.
      wpa_key_mgmt=SAE

      # 2. 2 => Protected Management Frames REQUIRED, which blocks classic
      #    deauthentication attacks (all devices are recent, so required is fine).
      ieee80211w=2

      # 3. Outside hostapd, on the router itself: DISABLE WPS.
      #    The WPS PIN is brute-forceable and would bypass even a perfect
      #    passphrase. Also change the admin password and update the firmware.
    note:
      fr: "WPA3-SAE + PMF requis donne une base très solide, mais sans désactiver le WPS la protection serait contournable. Les trois éléments vont ensemble."
      en: "WPA3-SAE + required PMF gives a very solid base, but without disabling WPS the protection would be bypassable. The three elements go together."

quiz:
  - q:
      fr: "Quel mode de chiffrement est recommandé pour un Wi-Fi moderne ?"
      en: "Which encryption mode is recommended for a modern Wi-Fi?"
    options:
      fr:
        - "WEP"
        - "WPA (TKIP)"
        - "WPA3-SAE"
        - "Aucun chiffrement"
      en:
        - "WEP"
        - "WPA (TKIP)"
        - "WPA3-SAE"
        - "No encryption"
    answer: 2
    why:
      fr: "WPA3-SAE rend les attaques par dictionnaire hors ligne impraticables ; WEP et WPA-TKIP sont obsolètes."
      en: "WPA3-SAE makes offline dictionary attacks impractical; WEP and WPA-TKIP are obsolete."
  - q:
      fr: "Pourquoi désactiver le WPS ?"
      en: "Why disable WPS?"
    options:
      fr:
        - "Parce qu'il ralentit le réseau"
        - "Parce que son PIN se casse par force brute et contourne le mot de passe"
        - "Parce qu'il chiffre trop fort"
        - "Parce qu'il cache le SSID"
      en:
        - "Because it slows the network"
        - "Because its PIN is brute-forced and bypasses the password"
        - "Because it encrypts too strongly"
        - "Because it hides the SSID"
    answer: 1
    why:
      fr: "Le PIN WPS se devine en quelques heures et donne accès au réseau quelle que soit la force du mot de passe Wi-Fi."
      en: "The WPS PIN is guessed in a few hours and grants network access regardless of the Wi-Fi password strength."
  - q:
      fr: "Que bloque la protection des trames de gestion (PMF / 802.11w) ?"
      en: "What does management frame protection (PMF / 802.11w) block?"
    options:
      fr:
        - "Les mises à jour de firmware"
        - "L'attaque de déauthentification classique"
        - "Le DNS"
        - "Le chiffrement AES"
      en:
        - "Firmware updates"
        - "The classic deauthentication attack"
        - "DNS"
        - "AES encryption"
    answer: 1
    why:
      fr: "Le PMF authentifie les trames de gestion : une trame de déauthentification forgée est rejetée."
      en: "PMF authenticates management frames: a forged deauthentication frame is rejected."
  - q:
      fr: "Quel avantage majeur offre 802.1X/EAP face à un evil twin ?"
      en: "What major advantage does 802.1X/EAP give against an evil twin?"
    options:
      fr:
        - "Le client vérifie le certificat du serveur et rejette un faux AP"
        - "Il accélère le Wi-Fi"
        - "Il supprime le besoin de chiffrement"
        - "Il cache le SSID automatiquement"
      en:
        - "The client verifies the server's certificate and rejects a fake AP"
        - "It speeds up Wi-Fi"
        - "It removes the need for encryption"
        - "It hides the SSID automatically"
    answer: 0
    why:
      fr: "En 802.1X/EAP, le client valide le certificat du serveur ; un evil twin sans ce certificat est refusé."
      en: "In 802.1X/EAP, the client validates the server's certificate; an evil twin without it is refused."
  - q:
      fr: "À quoi sert la segmentation (réseaux invité et IoT séparés) ?"
      en: "What is segmentation (separate guest and IoT networks) for?"
    options:
      fr:
        - "À augmenter la portée du signal"
        - "À empêcher un appareil compromis d'atteindre vos appareils de confiance"
        - "À désactiver le chiffrement"
        - "À masquer le SSID"
      en:
        - "To increase signal range"
        - "To stop a compromised device from reaching your trusted devices"
        - "To disable encryption"
        - "To hide the SSID"
    answer: 1
    why:
      fr: "Isoler les invités et les objets connectés limite les dégâts : un appareil faible compromis ne contamine pas le réseau principal."
      en: "Isolating guests and IoT limits damage: a compromised weak device cannot contaminate the main network."
