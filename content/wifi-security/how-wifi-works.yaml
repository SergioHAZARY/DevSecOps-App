description:
  fr: "Comprendre le Wi-Fi : la norme 802.11, le chiffrement WEP, WPA2 et WPA3, le 4-way handshake et le PMKID."
  en: "Understand Wi-Fi: the 802.11 standard, WEP, WPA2 and WPA3 encryption, the 4-way handshake and the PMKID."
duration: 20

intro:
  fr: |
    Avant de tester la sécurité d'un réseau sans fil, il faut comprendre **comment il protège vos données**.
    Le Wi-Fi diffuse des ondes radio : n'importe qui à portée peut les capter. La seule chose qui empêche un
    voisin de lire votre trafic, c'est le **chiffrement**. Encore faut-il qu'il soit solide.

    Pensez au Wi-Fi comme à une conversation criée dans la rue : tout le monde l'entend. Le chiffrement, c'est
    parler dans une langue secrète que seuls vous et votre box comprenez. Les anciennes « langues » (WEP) se
    déchiffrent en minutes ; les récentes (WPA3) résistent bien mieux.

    Dans cette leçon, vous allez découvrir la norme **802.11**, l'évolution du chiffrement **WEP → WPA2 →
    WPA3**, le mécanisme du **4-way handshake** (la poignée de main en quatre temps qui établit les clés) et le
    **PMKID**. C'est une leçon de **théorie** : tout ce que vous apprendrez ici ne s'appliquera, dans les
    leçons suivantes, qu'à **votre propre réseau Wi-Fi** ou à un réseau pour lequel vous avez une autorisation
    écrite. Capter ou déchiffrer le Wi-Fi d'autrui est une interception illégale.
  en: |
    Before testing the security of a wireless network, you must understand **how it protects your data**. Wi-Fi
    broadcasts radio waves: anyone in range can pick them up. The only thing stopping a neighbour from reading
    your traffic is **encryption** — and it still has to be strong.

    Think of Wi-Fi as a conversation shouted in the street: everyone hears it. Encryption is speaking a secret
    language only you and your router understand. The old "languages" (WEP) are decrypted in minutes; the recent
    ones (WPA3) resist far better.

    In this lesson you will discover the **802.11** standard, the evolution of encryption **WEP → WPA2 → WPA3**,
    the **4-way handshake** mechanism (the four-step handshake that establishes the keys) and the **PMKID**.
    This is a **theory** lesson: everything you learn here will only apply, in later lessons, to **your own
    Wi-Fi network** or a network you have written authorisation for. Capturing or decrypting someone else's
    Wi-Fi is illegal interception.

sections:
  - heading:
      fr: "802.11 : la norme du Wi-Fi"
      en: "802.11: the Wi-Fi standard"
    body:
      fr: |
        **802.11** est la famille de normes qui définit le Wi-Fi. Chaque lettre correspond à une génération
        (802.11n, ac, ax...), avec des débits et des fréquences différents (2,4 GHz, 5 GHz, 6 GHz). Pour la
        sécurité, deux notions comptent :

        - Un réseau Wi-Fi est identifié par son **SSID** (le nom, par ex. `MyLab-AP`) et son **BSSID**
          (l'adresse MAC du point d'accès, par ex. `AA:BB:CC:DD:EE:FF`).
        - Les communications se font sur un **canal** (channel), une sous-fréquence précise.

        Le point crucial : le Wi-Fi émet dans l'air, donc **tout le monde à portée reçoit les trames**. On ne
        peut pas empêcher la réception ; on peut seulement rendre le contenu **illisible** par le chiffrement.
        C'est pourquoi la qualité du chiffrement est la clé de voûte de toute la sécurité Wi-Fi : sans lui, le
        réseau est une conversation publique.
      en: |
        **802.11** is the family of standards that defines Wi-Fi. Each letter corresponds to a generation
        (802.11n, ac, ax...), with different speeds and frequencies (2.4 GHz, 5 GHz, 6 GHz). For security, two
        notions matter:

        - A Wi-Fi network is identified by its **SSID** (the name, e.g. `MyLab-AP`) and its **BSSID** (the access
          point's MAC address, e.g. `AA:BB:CC:DD:EE:FF`).
        - Communications happen on a **channel**, a precise sub-frequency.

        The crucial point: Wi-Fi transmits into the air, so **everyone in range receives the frames**. You cannot
        prevent reception; you can only make the content **unreadable** through encryption. That is why the
        quality of the encryption is the keystone of all Wi-Fi security: without it, the network is a public
        conversation.
  - heading:
      fr: "WEP, WPA2, WPA3 : l'évolution du chiffrement"
      en: "WEP, WPA2, WPA3: the evolution of encryption"
    body:
      fr: |
        Le chiffrement Wi-Fi a beaucoup évolué, car les premières versions étaient cassables :

        | Protocole | Année | Chiffrement | État |
        |---|---|---|---|
        | WEP | 1999 | RC4 | Cassé (minutes) — à ne plus jamais utiliser |
        | WPA | 2003 | TKIP | Obsolète, vulnérable |
        | WPA2 | 2004 | AES-CCMP | Solide, mais sensible aux mots de passe faibles |
        | WPA3 | 2018 | AES + SAE | Recommandé : résiste aux attaques hors ligne |

        **WEP** est une relique : sa clé se récupère en capturant assez de trafic. **WPA2-Personal** (avec une
        *passphrase*) reste très répandu et solide **si** le mot de passe est long et aléatoire ; sa faiblesse,
        c'est qu'un attaquant peut tester des mots de passe **hors ligne** après avoir capturé un handshake.

        **WPA3** corrige cela avec **SAE** (*Simultaneous Authentication of Equals*, aussi appelé *Dragonfly*) :
        il rend les attaques par dictionnaire hors ligne impraticables et chiffre même les réseaux ouverts
        (OWE). C'est le choix recommandé aujourd'hui.
      en: |
        Wi-Fi encryption has evolved a lot, because the early versions were breakable:

        | Protocol | Year | Encryption | Status |
        |---|---|---|---|
        | WEP | 1999 | RC4 | Broken (minutes) — never use again |
        | WPA | 2003 | TKIP | Obsolete, vulnerable |
        | WPA2 | 2004 | AES-CCMP | Strong, but sensitive to weak passwords |
        | WPA3 | 2018 | AES + SAE | Recommended: resists offline attacks |

        **WEP** is a relic: its key is recovered by capturing enough traffic. **WPA2-Personal** (with a
        *passphrase*) is still widespread and strong **if** the password is long and random; its weakness is
        that an attacker can test passwords **offline** after capturing a handshake.

        **WPA3** fixes this with **SAE** (*Simultaneous Authentication of Equals*, also called *Dragonfly*): it
        makes offline dictionary attacks impractical and even encrypts open networks (OWE). It is the recommended
        choice today.
  - heading:
      fr: "Le 4-way handshake et le PMKID"
      en: "The 4-way handshake and the PMKID"
    body:
      fr: |
        En WPA2, quand un appareil rejoint le réseau, il exécute avec le point d'accès une **poignée de main en
        quatre temps** (*4-way handshake*). Son but : prouver que les deux côtés connaissent le mot de passe et
        en dériver des clés de session, **sans jamais transmettre le mot de passe en clair**.

        Simplifié, les quatre messages échangent des valeurs aléatoires (*nonces*) et un code de vérification
        (MIC). À partir du mot de passe (la **PSK**, *Pre-Shared Key*) et de ces valeurs, les deux côtés
        calculent la même clé. Un observateur qui capture le handshake obtient tout **sauf** le mot de passe,
        mais il peut ensuite **deviner** le mot de passe hors ligne en testant des candidats (voir la leçon
        hashcat).

        Le **PMKID** est une optimisation : certains points d'accès incluent, dès le premier message, une valeur
        (le PMKID) qui dépend elle aussi du mot de passe. Un attaquant peut parfois la récupérer **sans même
        qu'un client soit connecté**, puis tenter de retrouver le mot de passe hors ligne de la même manière.
        Dans les deux cas, la **force du mot de passe** est la vraie défense : c'est tout l'objet des leçons
        suivantes, menées sur **votre propre box**.
      en: |
        In WPA2, when a device joins the network, it performs a **four-step handshake** (*4-way handshake*) with
        the access point. Its purpose: to prove that both sides know the password and to derive session keys,
        **without ever transmitting the password in clear**.

        Simplified, the four messages exchange random values (*nonces*) and a verification code (MIC). From the
        password (the **PSK**, *Pre-Shared Key*) and these values, both sides compute the same key. An observer
        who captures the handshake gets everything **except** the password, but can then **guess** the password
        offline by testing candidates (see the hashcat lesson).

        The **PMKID** is an optimisation: some access points include, in the very first message, a value (the
        PMKID) that also depends on the password. An attacker can sometimes grab it **without even a client being
        connected**, then try to recover the password offline the same way. In both cases, the **strength of the
        password** is the real defence: that is the whole point of the next lessons, carried out on **your own
        router**.

examples:
  - title:
      fr: "Comparer les protocoles d'un réseau (théorie)"
      en: "Comparing a network's protocols (theory)"
    file: wifi_security.py
    lang: python
    kind: neutral
    code: |
      # A tiny helper to rank the security of a Wi-Fi protocol.
      # It encodes the lesson's table as advice, not an attack.
      RANK = {
          "WEP": (0, "Broken - replace immediately"),
          "WPA": (1, "Obsolete - upgrade"),
          "WPA2": (2, "OK with a long random passphrase"),
          "WPA3": (3, "Recommended - resists offline attacks"),
      }

      for proto in ["WEP", "WPA", "WPA2", "WPA3"]:
          score, advice = RANK[proto]
          print(f"{proto:5} score={score}  {advice}")
    output: |
      WEP   score=0  Broken - replace immediately
      WPA   score=1  Obsolete - upgrade
      WPA2  score=2  OK with a long random passphrase
      WPA3  score=3  Recommended - resists offline attacks
    note:
      fr: "Ce classement résume la leçon : WEP et WPA sont à bannir, WPA2 convient avec un bon mot de passe, WPA3 est le choix moderne. Aucune attaque ici, juste de la hiérarchisation."
      en: "This ranking sums up the lesson: WEP and WPA must go, WPA2 is fine with a good password, WPA3 is the modern choice. No attack here, just prioritisation."
  - title:
      fr: "Lister les réseaux visibles autour de vous (passif)"
      en: "Listing the networks visible around you (passive)"
    file: scan.sh
    lang: bash
    kind: neutral
    code: |
      # Passive observation of the radio around you (Linux, NetworkManager).
      # This only LISTS networks already broadcasting their presence; it does not
      # connect to or attack any of them. Identify YOUR OWN SSID in the list.
      nmcli -f SSID,BSSID,CHAN,SECURITY device wifi list
    output: |
      SSID        BSSID              CHAN  SECURITY
      MyLab-AP    AA:BB:CC:DD:EE:FF  6     WPA2
      Neighbour1  11:22:33:44:55:66  11    WPA2
      OldRouter   99:88:77:66:55:44  1     WEP
    note:
      fr: "On voit ici le SSID, le BSSID, le canal et le type de sécurité. `OldRouter` est en WEP : un réseau de ce type est dangereusement obsolète. On n'interagit avec aucun autre que le sien."
      en: "Here we see the SSID, BSSID, channel and security type. `OldRouter` is on WEP: such a network is dangerously obsolete. You interact with none but your own."
  - title:
      fr: "Comprendre la dérivation de clé WPA2 (schéma)"
      en: "Understanding WPA2 key derivation (diagram)"
    file: handshake.txt
    lang: text
    kind: neutral
    code: |
      WPA2 4-way handshake (simplified)

      Client (STA)                         Access Point (AP)
          |  <---- Msg1: ANonce ----------------  |   AP sends its random nonce
          |  ----- Msg2: SNonce + MIC ---------->  |   STA proves it knows the PSK
          |  <---- Msg3: GTK + MIC --------------  |   AP installs keys
          |  ----- Msg4: ACK ------------------->  |   confirmation

      Both sides derive the same PTK from:
        PSK (from the password) + ANonce + SNonce + MAC addresses

      An eavesdropper who captures Msg1..Msg4 gets the nonces and the MIC,
      but NOT the password. They can only GUESS it offline.
    note:
      fr: "Le schéma montre que le mot de passe ne circule jamais : il sert à calculer les clés. C'est pourquoi la seule attaque possible est de **deviner** le mot de passe hors ligne, d'où l'importance d'un mot de passe fort."
      en: "The diagram shows the password never travels: it is used to compute the keys. That is why the only possible attack is to **guess** the password offline, hence the importance of a strong password."

mistake:
  fr: |
    **Garder WEP ou WPA « parce que ça marche encore ».** WEP se casse en quelques minutes avec des outils
    publics : un réseau WEP n'offre aucune protection réelle. WPA (TKIP) est également obsolète. Autre
    malentendu fréquent : croire que cacher le SSID sécurise le réseau. Masquer le nom ne chiffre rien et se
    contourne trivialement ; seul un chiffrement moderne (WPA2 avec bon mot de passe, idéalement WPA3) protège
    réellement les données qui voyagent dans l'air.
  en: |
    **Keeping WEP or WPA "because it still works".** WEP is broken in minutes with public tools: a WEP network
    offers no real protection. WPA (TKIP) is likewise obsolete. Another common misconception: thinking that
    hiding the SSID secures the network. Hiding the name encrypts nothing and is trivially bypassed; only modern
    encryption (WPA2 with a good password, ideally WPA3) truly protects the data travelling through the air.

bestPractice:
  fr: |
    - **Utilisez WPA3** quand vos équipements le permettent ; sinon WPA2-AES avec un mot de passe long et aléatoire.
    - **Bannissez WEP et WPA (TKIP)** : ils n'offrent aucune sécurité réelle en 2026.
    - **Comprenez que le chiffrement est le seul rempart** : tout le monde reçoit les trames dans l'air.
    - **Retenez que la force du mot de passe** est décisive en WPA2 (attaque hors ligne possible après capture).
    - **N'observez que votre propre réseau** : même lister/capter le Wi-Fi d'autrui peut être une interception illégale.
  en: |
    - **Use WPA3** when your equipment allows; otherwise WPA2-AES with a long, random password.
    - **Ban WEP and WPA (TKIP)**: they offer no real security in 2026.
    - **Understand that encryption is the only barrier**: everyone receives the frames in the air.
    - **Remember that password strength** is decisive in WPA2 (offline attack possible after capture).
    - **Observe only your own network**: even listing/capturing someone else's Wi-Fi can be illegal interception.

exercise:
  statement:
    fr: |
      Un ami vous dit : « Mon réseau est en WPA2 avec le mot de passe `motdepasse`, et je cache le SSID, donc
      il est sûr. »

      1. Quel est le vrai problème de sécurité de ce réseau ?
      2. Pourquoi cacher le SSID ne le protège-t-il pas ?
    en: |
      A friend tells you: "My network is on WPA2 with the password `password`, and I hide the SSID, so it's
      safe."

      1. What is the real security problem of this network?
      2. Why does hiding the SSID not protect it?
  solution:
    file: answer.md
    lang: markdown
    code: |
      ## 1. The real problem: a weak password
      WPA2 is strong, but its weakness is OFFLINE guessing. After capturing a
      handshake (or a PMKID), an attacker tests candidate passwords offline.
      "password" is in every wordlist, so it would be cracked in milliseconds.
      The fix is a long, random passphrase (or WPA3, which resists offline attacks).

      ## 2. Hiding the SSID does not protect anything
      A hidden SSID is not encrypted; the network name still leaks in management
      frames and when a client connects. It is security through obscurity, not
      a protection of the data. Only strong encryption + a strong password does that.
    note:
      fr: "La leçon clé : en WPA2, la sécurité repose sur la force du mot de passe, pas sur le masquage du SSID. `motdepasse` tomberait instantanément."
      en: "The key lesson: in WPA2, security rests on password strength, not on hiding the SSID. `password` would fall instantly."

quiz:
  - q:
      fr: "Que définit la famille de normes 802.11 ?"
      en: "What does the 802.11 family of standards define?"
    options:
      fr:
        - "Le protocole du courrier électronique"
        - "Le fonctionnement du Wi-Fi"
        - "Le format des fichiers PDF"
        - "Le routage Internet"
      en:
        - "The email protocol"
        - "How Wi-Fi works"
        - "The PDF file format"
        - "Internet routing"
    answer: 1
    why:
      fr: "802.11 est la famille de normes qui définit les réseaux locaux sans fil, c'est-à-dire le Wi-Fi."
      en: "802.11 is the family of standards that defines wireless local networks, i.e. Wi-Fi."
  - q:
      fr: "Quel protocole de chiffrement Wi-Fi est cassé et à ne plus jamais utiliser ?"
      en: "Which Wi-Fi encryption protocol is broken and must never be used again?"
    options:
      fr:
        - "WPA3"
        - "WPA2-AES"
        - "WEP"
        - "OWE"
      en:
        - "WPA3"
        - "WPA2-AES"
        - "WEP"
        - "OWE"
    answer: 2
    why:
      fr: "WEP (RC4) se casse en quelques minutes avec des outils publics : il n'offre aucune protection réelle."
      en: "WEP (RC4) is broken in minutes with public tools: it offers no real protection."
  - q:
      fr: "Quelle est la fonction du 4-way handshake en WPA2 ?"
      en: "What is the function of the 4-way handshake in WPA2?"
    options:
      fr:
        - "Transmettre le mot de passe en clair"
        - "Prouver la connaissance du mot de passe et dériver des clés sans l'envoyer"
        - "Chiffrer le DNS"
        - "Changer le canal radio"
      en:
        - "Transmit the password in clear"
        - "Prove knowledge of the password and derive keys without sending it"
        - "Encrypt DNS"
        - "Change the radio channel"
    answer: 1
    why:
      fr: "Le handshake dérive des clés de session à partir du mot de passe, sans jamais le transmettre en clair."
      en: "The handshake derives session keys from the password, without ever transmitting it in clear."
  - q:
      fr: "Pourquoi WPA3 résiste-t-il mieux que WPA2 ?"
      en: "Why does WPA3 resist better than WPA2?"
    options:
      fr:
        - "Parce qu'il cache le SSID"
        - "Parce qu'il utilise SAE, qui rend les attaques par dictionnaire hors ligne impraticables"
        - "Parce qu'il est plus rapide"
        - "Parce qu'il n'utilise pas de mot de passe"
      en:
        - "Because it hides the SSID"
        - "Because it uses SAE, making offline dictionary attacks impractical"
        - "Because it is faster"
        - "Because it uses no password"
    answer: 1
    why:
      fr: "SAE (Dragonfly) empêche de tester des mots de passe hors ligne après une capture, contrairement à WPA2."
      en: "SAE (Dragonfly) prevents testing passwords offline after a capture, unlike WPA2."
  - q:
      fr: "Après avoir capturé un handshake WPA2, que peut faire un attaquant ?"
      en: "After capturing a WPA2 handshake, what can an attacker do?"
    options:
      fr:
        - "Lire le mot de passe directement dans la capture"
        - "Tenter de deviner le mot de passe hors ligne"
        - "Changer le mot de passe de la box"
        - "Rien du tout"
      en:
        - "Read the password directly from the capture"
        - "Try to guess the password offline"
        - "Change the router's password"
        - "Nothing at all"
    answer: 1
    why:
      fr: "La capture ne contient pas le mot de passe en clair ; l'attaquant ne peut que le **deviner** hors ligne, d'où l'importance d'un mot de passe fort."
      en: "The capture does not contain the password in clear; the attacker can only **guess** it offline, hence the importance of a strong password."
