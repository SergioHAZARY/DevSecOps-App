  - q:
      fr: "Pourquoi ne faut-il pas passer un secret dans un flag comme `-token` ?"
      en: "Why should a secret not be passed in a flag such as `-token`?"
    options:
      fr:
        - "Parce que les flags sont limités à 8 caractères"
        - "Parce que les arguments sont visibles dans la liste des processus et l'historique du shell"
        - "Parce que le paquet `flag` chiffre mal les valeurs"
        - "Parce que Go interdit les chaînes dans les flags"
      en:
        - "Because flags are limited to 8 characters"
        - "Because arguments are visible in the process list and the shell history"
        - "Because the `flag` package encrypts values badly"
        - "Because Go forbids strings in flags"
    answer: 1
    why:
      fr: "N'importe quel utilisateur local peut lire les arguments d'un processus avec `ps`, et le shell les enregistre dans son historique."
      en: "Any local user can read a process's arguments with `ps`, and the shell records them in its history."
  - q:
      fr: "Que doit-on absolument appeler avant de lire la valeur des flags du paquet `flag` ?"
      en: "What must be called before reading the values of `flag` package flags?"
    options:
      fr:
        - "`flag.Parse()`"
        - "`flag.Usage()`"
        - "`os.Exit(0)`"
        - "`flag.Args()`"
      en:
        - "`flag.Parse()`"
        - "`flag.Usage()`"
        - "`os.Exit(0)`"
        - "`flag.Args()`"
    answer: 0
    why:
      fr: "Sans `flag.Parse()`, les variables gardent leur valeur par défaut : la ligne de commande n'est jamais lue."
      en: "Without `flag.Parse()`, the variables keep their default values: the command line is never read."
  - q:
      fr: "Quel avantage principal Cobra apporte-t-il par rapport au paquet `flag` ?"
      en: "What is the main advantage of Cobra over the `flag` package?"
    options:
      fr:
        - "Il rend le binaire plus petit"
        - "Il supprime le besoin de valider les arguments"
        - "Il gère les sous-commandes, l'aide détaillée et l'auto-complétion"
        - "Il chiffre automatiquement les secrets passés en flag"
      en:
        - "It makes the binary smaller"
        - "It removes the need to validate arguments"
        - "It handles subcommands, detailed help and shell completion"
        - "It automatically encrypts secrets passed as flags"
    answer: 2
    why:
      fr: "Cobra structure l'outil en commandes et sous-commandes et génère aide et complétion, au prix d'une dépendance externe."
      en: "Cobra structures the tool into commands and subcommands and generates help and completion, at the cost of an external dependency."
  - q:
      fr: "Pourquoi éviter `os.Exit(1)` au fond d'une fonction utilitaire ?"
      en: "Why avoid `os.Exit(1)` deep inside a helper function?"
    options:
      fr:
        - "Parce que `os.Exit` ne fonctionne que sous Linux"
        - "Parce que le code 1 est réservé au système"
        - "Parce que `os.Exit` affiche le mot de passe"
        - "Parce que les `defer` ne s'exécutent pas et la fonction devient difficile à tester"
      en:
        - "Because `os.Exit` only works on Linux"
        - "Because code 1 is reserved for the system"
        - "Because `os.Exit` prints the password"
        - "Because `defer` calls do not run and the function becomes hard to test"
    answer: 3
    why:
      fr: "`os.Exit` termine le processus immédiatement : mieux vaut renvoyer une `error` et laisser `main` choisir le code de sortie."
      en: "`os.Exit` terminates the process immediately: return an `error` instead and let `main` choose the exit code."
