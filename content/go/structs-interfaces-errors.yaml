      en: "When should you use a pointer receiver (`func (f *Finding) ...`)?"
    options:
      fr:
        - "Quand la méthode doit modifier la struct"
        - "Quand la méthode ne renvoie rien"
        - "Uniquement pour les types exportés"
        - "Jamais : les pointeurs sont interdits en Go"
      en:
        - "When the method must modify the struct"
        - "When the method returns nothing"
        - "Only for exported types"
        - "Never: pointers are forbidden in Go"
    answer: 0
    why:
      fr: "Un receveur par valeur travaille sur une copie ; seul un receveur par pointeur modifie la struct d'origine."
      en: "A value receiver works on a copy; only a pointer receiver modifies the original struct."
