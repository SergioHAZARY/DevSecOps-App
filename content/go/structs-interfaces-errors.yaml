        - "Avec une annotation `@Override`"
        - "En héritant de l'interface avec `extends`"
        - "Il ne déclare rien : il lui suffit de posséder les méthodes"
      en:
        - "With the `implements` keyword"
        - "With an `@Override` annotation"
        - "By inheriting from the interface with `extends`"
        - "It declares nothing: having the methods is enough"
