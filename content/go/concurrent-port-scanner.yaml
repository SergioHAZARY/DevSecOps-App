      en: "Why does \"one goroutine per port\" give wrong results over 65,535 ports?"
    options:
      fr:
        - "Parce que la limite de descripteurs de fichiers est dépassée et les erreurs passent pour des ports fermés"
        - "Parce que Go ne peut pas créer plus de 1000 goroutines"
        - "Parce que les goroutines s'exécutent toujours dans l'ordre"
        - "Parce que `net.DialTimeout` n'accepte qu'un appel à la fois"
      en:
        - "Because the file descriptor limit is exceeded and the errors are mistaken for closed ports"
        - "Because Go cannot create more than 1000 goroutines"
        - "Because goroutines always run in order"
        - "Because `net.DialTimeout` only accepts one call at a time"
    answer: 0
    why:
      fr: "Chaque connexion utilise un descripteur ; au-delà de la limite, `Dial` échoue et le scanner naïf conclut à tort « fermé »."
      en: "Each connection uses a descriptor; past the limit, `Dial` fails and the naive scanner wrongly concludes \"closed\"."
  - q:
