      en: "In the worker pool, what is `close(ports)` for?"
    options:
      fr:
        - "À fermer les connexions TCP ouvertes"
        - "À libérer la mémoire du channel immédiatement"
        - "À annuler le context"
        - "À signaler aux workers qu'il n'y a plus de travail, ce qui termine leur boucle `range`"
      en:
        - "To close the open TCP connections"
        - "To free the channel's memory immediately"
        - "To cancel the context"
        - "To tell the workers there is no more work, which ends their `range` loop"
    answer: 3
    why:
      fr: "Une boucle `for port := range ports` se termine quand le channel est fermé et vidé : les workers s'arrêtent alors d'eux-mêmes."
      en: "A `for port := range ports` loop ends when the channel is closed and drained: the workers then stop by themselves."
  - q:
      fr: "Quel est l'état d'un port quand un pare-feu jette silencieusement les paquets ?"
      en: "What is the state of a port when a firewall silently drops the packets?"
    options:
      fr:
        - "Ouvert"
        - "Filtré : le scanner n'obtient une réponse qu'à l'expiration du timeout"
        - "Fermé : la cible renvoie un refus immédiat"
        - "Chiffré"
      en:
        - "Open"
        - "Filtered: the scanner only gets an answer when the timeout expires"
        - "Closed: the target sends an immediate refusal"
        - "Encrypted"
    answer: 1
    why:
      fr: "Sans réponse du tout, le scanner attend jusqu'au timeout : c'est ce qui rend les timeouts indispensables."
      en: "With no answer at all, the scanner waits until the timeout: this is what makes timeouts essential."
