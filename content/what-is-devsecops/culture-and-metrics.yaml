description:
  fr: "Comprendre la culture DevSecOps avec le modèle CALMS et apprendre à mesurer ses progrès avec les quatre métriques DORA et des indicateurs de sécurité."
  en: "Understand DevSecOps culture with the CALMS model and learn to measure progress with the four DORA metrics and security indicators."
duration: 20

intro:
  fr: |
    Vous connaissez maintenant les rôles, le principe du Shift Left et le pipeline. Il manque la question la
    plus importante : **comment savoir si l'équipe progresse vraiment ?**

    Pensez à quelqu'un qui veut se remettre en forme. Acheter des chaussures de course (les outils) ne suffit
    pas : il faut changer ses **habitudes** (la culture) et **se peser régulièrement** (les métriques) pour
    vérifier que les efforts paient. Sans habitudes, les chaussures restent au placard. Sans mesure, on ne
    sait pas si l'on avance.

    Dans cette leçon, vous allez découvrir **CALMS**, une grille en cinq lettres pour évaluer la culture d'une
    équipe, puis les métriques **DORA**, quatre chiffres simples que vous calculerez vous-même en Python et
    en SQL.
  en: |
    You now know the roles, the Shift Left principle and the pipeline. The most important question is
    still missing: **how do you know whether the team is really improving?**

    Think of someone who wants to get fit. Buying running shoes (the tools) is not enough: they must change
    their **habits** (the culture) and **step on the scale regularly** (the metrics) to check that the
    effort pays off. Without habits, the shoes stay in the closet. Without measurement, you cannot tell
    whether you are moving forward.

    In this lesson you will discover **CALMS**, a five-letter grid to assess a team's culture, then the
    **DORA** metrics, four simple numbers that you will compute yourself in Python and SQL.

sections:
  - heading:
      fr: "CALMS : cinq lettres pour évaluer la culture"
      en: "CALMS: five letters to assess the culture"
    body:
      fr: |
        | Lettre | Signification | Concrètement, en DevSecOps |
        |---|---|---|
        | **C** | *Culture* | La sécurité est une responsabilité partagée ; on signale un problème sans craindre d'être puni. |
        | **A** | *Automation* (automatisation) | Les tests, les scans et les déploiements tournent sans intervention humaine. |
        | **L** | *Lean* (sans gaspillage) | De petits changements livrés souvent, plutôt qu'une énorme livraison risquée. |
        | **M** | *Measurement* (mesure) | On suit des chiffres pour décider, pas des impressions. |
        | **S** | *Sharing* (partage) | Les connaissances, les outils et les leçons des incidents circulent entre équipes. |

        CALMS sert d'auto-diagnostic : pour chaque lettre, demandez-vous « que faisons-nous déjà ? » et
        « quel est le prochain petit pas ? ». Une équipe forte en automatisation mais faible en partage
        aura des outils que seule une personne comprend.
      en: |
        | Letter | Meaning | In practice, in DevSecOps |
        |---|---|---|
        | **C** | *Culture* | Security is a shared responsibility; people report a problem without fear of punishment. |
        | **A** | *Automation* | Tests, scans and deployments run without human intervention. |
        | **L** | *Lean* | Small changes shipped often, rather than one huge risky release. |
        | **M** | *Measurement* | Numbers are tracked to decide, not impressions. |
        | **S** | *Sharing* | Knowledge, tools and lessons from incidents flow between teams. |

        CALMS works as a self-assessment: for each letter, ask "what do we already do?" and "what is the
        next small step?". A team that is strong on automation but weak on sharing ends up with tools
        that only one person understands.
  - heading:
      fr: "Les quatre métriques DORA"
      en: "The four DORA metrics"
    body:
      fr: |
        **DORA** (*DevOps Research and Assessment*) est un programme de recherche qui étudie depuis des années
        ce qui distingue les équipes logicielles performantes. Il en a tiré quatre métriques clés.

        | Métrique | Question posée | Ce qu'elle mesure |
        |---|---|---|
        | **Fréquence de déploiement** | Combien de fois livre-t-on en production ? | La vitesse |
        | **Délai de mise en production** (*lead time for changes*) | Combien de temps entre un commit et sa mise en production ? | La vitesse |
        | **Taux d'échec des changements** (*change failure rate*) | Quelle part des déploiements provoque un incident ? | La stabilité |
        | **Temps de restauration** (*time to restore*, aussi appelé *failed deployment recovery time*) | Combien de temps pour réparer après un déploiement raté ? | La stabilité |

        La leçon principale de ces recherches : **vitesse et stabilité ne s'opposent pas**. Les équipes qui
        livrent souvent, par petits changements, sont aussi celles qui cassent le moins et réparent le plus
        vite. C'est l'argument central pour automatiser la sécurité au lieu de ralentir les livraisons.
      en: |
        **DORA** (*DevOps Research and Assessment*) is a research programme that has studied for years what
        sets high-performing software teams apart. It produced four key metrics.

        | Metric | Question asked | What it measures |
        |---|---|---|
        | **Deployment frequency** | How often do we release to production? | Speed |
        | **Lead time for changes** | How long between a commit and its release to production? | Speed |
        | **Change failure rate** | What share of deployments causes an incident? | Stability |
        | **Time to restore** (also called *failed deployment recovery time*) | How long to repair after a failed deployment? | Stability |

        The main lesson of that research: **speed and stability are not opposites**. Teams that ship often,
        in small changes, are also the ones that break the least and repair the fastest. This is the
        central argument for automating security instead of slowing releases down.
  - heading:
      fr: "Mesurer aussi la sécurité"
      en: "Measuring security too"
    body:
      fr: |
        Les métriques DORA ne parlent pas directement de sécurité. On les complète par quelques indicateurs :

        | Indicateur | Définition | Bon signe |
        |---|---|---|
        | **MTTR des vulnérabilités** (*Mean Time To Remediate*) | Délai moyen entre la détection d'une faille et sa correction | Il baisse, surtout pour les failles critiques |
        | **Stock de failles ouvertes** | Nombre de failles non corrigées, par sévérité | Il ne grossit pas |
        | **Couverture** | Part des dépôts dont le pipeline contient des contrôles de sécurité | Elle augmente |
        | **Secrets détectés avant fusion** | Secrets arrêtés par les crochets ou la pull request | Ils sont arrêtés à gauche, pas trouvés en production |

        Méfiez-vous des **métriques de vanité** : « nombre de scans lancés » ou « nombre d'outils installés »
        donnent bonne conscience mais ne disent rien du risque réel. Et rappelez-vous qu'un chiffre qui
        devient un objectif à atteindre à tout prix finit par être truqué : mesurez pour **comprendre**,
        pas pour punir.
      en: |
        DORA metrics do not speak about security directly. They are complemented with a few indicators:

        | Indicator | Definition | Good sign |
        |---|---|---|
        | **Vulnerability MTTR** (*Mean Time To Remediate*) | Average delay between the detection of a flaw and its fix | It goes down, especially for critical flaws |
        | **Open flaw backlog** | Number of unfixed flaws, by severity | It does not grow |
        | **Coverage** | Share of repositories whose pipeline contains security checks | It goes up |
        | **Secrets caught before merge** | Secrets stopped by hooks or the pull request | They are stopped on the left, not found in production |

        Beware of **vanity metrics**: "number of scans run" or "number of tools installed" feel good but
        say nothing about real risk. And remember that a number which becomes a target to hit at all
        costs ends up being gamed: measure to **understand**, not to punish.
  - heading:
      fr: "Une culture sans blâme"
      en: "A blameless culture"
    body:
      fr: |
        Quand un incident survient, la question utile n'est pas « **qui** a fait l'erreur ? » mais
        « **pourquoi le système a-t-il laissé passer l'erreur ?** ». C'est le principe du **post-mortem sans
        blâme** : un compte rendu écrit après chaque incident, qui décrit les faits, les causes et les
        actions pour que cela ne se reproduise pas, sans désigner de coupable.

        La raison est très pratique : si les gens sont punis, ils cachent les problèmes. Or un secret
        poussé par erreur doit être signalé **dans la minute** pour être révoqué. Une équipe où l'on ose
        dire « j'ai fait une bêtise » est une équipe plus sûre.
      en: |
        When an incident happens, the useful question is not "**who** made the mistake?" but "**why did the
        system let the mistake through?**". This is the principle of the **blameless post-mortem**: a
        written report after every incident that describes the facts, the causes and the actions to prevent
        it from happening again, without naming a culprit.

        The reason is very practical: if people are punished, they hide problems. Yet a secret pushed by
        mistake must be reported **within the minute** so it can be revoked. A team where people dare to
        say "I made a mistake" is a safer team.

examples:
  - title:
      fr: "Calculer les quatre métriques DORA"
      en: "Computing the four DORA metrics"
    file: dora.py
    lang: python
    kind: neutral
    code: |
      from datetime import datetime

      # One tuple per production deployment over the last 7 days:
      # (commit time, deploy time, caused an incident?, minutes to restore)
      deployments = [
          ("2026-03-02 09:10", "2026-03-02 11:40", False, 0),
          ("2026-03-02 14:05", "2026-03-03 10:15", False, 0),
          ("2026-03-04 08:30", "2026-03-04 09:00", True, 45),
          ("2026-03-05 16:20", "2026-03-06 09:50", False, 0),
          ("2026-03-06 10:00", "2026-03-06 15:30", True, 15),
      ]
      DAYS = 7
      FORMAT = "%Y-%m-%d %H:%M"

      # Lead time: hours between the commit and its arrival in production
      lead_times = []
      for commit, deploy, _, _ in deployments:
          delta = datetime.strptime(deploy, FORMAT) - datetime.strptime(commit, FORMAT)
          lead_times.append(delta.total_seconds() / 3600)

      failures = [d for d in deployments if d[2]]

      print(f"Deployment frequency  : {len(deployments) / DAYS:.2f} per day")
      print(f"Lead time for changes : {sum(lead_times) / len(lead_times):.1f} hours on average")
      print(f"Change failure rate   : {100 * len(failures) / len(deployments):.0f} %")
      print(f"Time to restore       : {sum(d[3] for d in failures) / len(failures):.0f} minutes on average")
    output: |
      Deployment frequency  : 0.71 per day
      Lead time for changes : 9.2 hours on average
      Change failure rate   : 40 %
      Time to restore       : 30 minutes on average
    note:
      fr: "Quatre chiffres suffisent à décrire la livraison d'une équipe. Ici elle livre presque chaque jour et répare vite, mais 2 déploiements sur 5 provoquent un incident : c'est le point à améliorer, par exemple avec plus de tests automatiques."
      en: "Four numbers are enough to describe a team's delivery. Here it ships almost every day and repairs fast, but 2 deployments out of 5 cause an incident: that is the point to improve, for example with more automated tests."

  - title:
      fr: "Mesurer le délai de correction des vulnérabilités"
      en: "Measuring the time to remediate vulnerabilities"
    file: mttr.sql
    lang: sql
    kind: neutral
    code: |
      -- Every finding reported by the scanners ends up in a table like this one
      CREATE TABLE vulnerabilities (
        id INTEGER PRIMARY KEY,
        severity TEXT NOT NULL,
        found_on TEXT NOT NULL, -- day the scanner reported it
        fixed_on TEXT           -- NULL while the flaw is still open
      );

      INSERT INTO vulnerabilities (severity, found_on, fixed_on) VALUES
        ('CRITICAL', '2026-03-01', '2026-03-02'),
        ('CRITICAL', '2026-03-10', '2026-03-13'),
        ('HIGH',     '2026-03-03', '2026-03-10'),
        ('HIGH',     '2026-03-12', '2026-03-21'),
        ('HIGH',     '2026-03-20', NULL),
        ('MEDIUM',   '2026-02-15', '2026-03-17'),
        ('MEDIUM',   '2026-03-18', NULL);

      -- Mean time to remediate (MTTR) and open backlog, per severity
      SELECT
        severity,
        COUNT(fixed_on) AS fixed,
        COUNT(*) - COUNT(fixed_on) AS still_open,
        ROUND(AVG(julianday(fixed_on) - julianday(found_on)), 1) AS mttr_days
      FROM vulnerabilities
      GROUP BY severity
      ORDER BY CASE severity WHEN 'CRITICAL' THEN 1 WHEN 'HIGH' THEN 2 ELSE 3 END;
    output: |
      severity | fixed | still_open | mttr_days
      CRITICAL | 2     | 0          | 2.0
      HIGH     | 2     | 1          | 8.0
      MEDIUM   | 1     | 1          | 30.0
    note:
      fr: "`julianday()` convertit une date en nombre de jours : la soustraction donne le délai de correction. Les failles critiques sont corrigées en 2 jours en moyenne, les moyennes en 30 : c'est normal de traiter le plus grave d'abord, à condition que le stock ouvert ne grossisse pas."
      en: "`julianday()` converts a date into a number of days: the subtraction gives the time to fix. Critical flaws are fixed in 2 days on average, medium ones in 30: handling the worst first is normal, as long as the open backlog does not grow."

  - title:
      fr: "Mesurer la fréquence de déploiement depuis Git"
      en: "Measuring deployment frequency from Git"
    file: deploy-frequency.sh
    lang: bash
    kind: neutral
    code: |
      # Assumption: every merge into main triggers a production deployment.
      git fetch --quiet origin

      # How many deployments in the last 30 days?
      git log origin/main --merges --since="30 days ago" --oneline | wc -l

      # Deployments per day over the last week
      git log origin/main --merges --since="7 days ago" \
        --date=short --format="%ad" | sort | uniq -c
    output: |
      18
            2 2026-03-02
            1 2026-03-04
            2 2026-03-06
    note:
      fr: "Pas besoin d'un outil coûteux pour commencer à mesurer : l'historique Git contient déjà les dates. `sort | uniq -c` compte les lignes identiques, ici le nombre de fusions par jour."
      en: "No expensive tool is needed to start measuring: the Git history already holds the dates. `sort | uniq -c` counts identical lines, here the number of merges per day."

  - title:
      fr: "La culture dans le dépôt : un modèle de pull request"
      en: "Culture in the repository: a pull request template"
    file: .github/pull_request_template.md
    lang: markdown
    kind: secure
    code: |
      ## What does this change do?

      <!-- One or two sentences. Link the ticket if there is one. -->

      ## Security checklist

      - [ ] No secret, password or token in the code or in the tests
      - [ ] User input is validated before it is used
      - [ ] New dependencies come from a trusted source and are pinned
      - [ ] Errors do not reveal internal details (stack traces, paths)
      - [ ] I ran the tests and the pre-commit hooks locally

      ## How was it tested?

      <!-- Commands, screenshots or steps a reviewer can reproduce. -->

      ## Anything risky the reviewer should look at first?

      <!-- Being honest here is a strength, not a weakness. -->
    note:
      fr: "GitHub pré-remplit chaque nouvelle pull request avec ce fichier. C'est de la culture rendue concrète : la sécurité devient une question posée à **chaque** changement, par l'auteur lui-même, et la dernière rubrique encourage à signaler les risques sans crainte."
      en: "GitHub pre-fills every new pull request with this file. This is culture made concrete: security becomes a question asked on **every** change, by the author, and the last section encourages people to flag risks without fear."

mistake:
  fr: |
    **Utiliser les métriques pour classer ou punir les personnes.**

    Dès qu'un chiffre sert à juger des individus (« tu as introduit 4 vulnérabilités ce mois-ci »), il est
    contourné : on ferme les alertes sans les corriger, on désactive le scanner sur les projets difficiles,
    on cache les incidents. Les chiffres s'améliorent, la sécurité se dégrade. Les métriques DORA et de
    sécurité se lisent **au niveau de l'équipe et du système**, pour choisir quoi améliorer ensuite.
    Deuxième piège : ne mesurer que la vitesse (ou que la stabilité). Les quatre métriques se lisent ensemble.
  en: |
    **Using metrics to rank or punish people.**

    As soon as a number is used to judge individuals ("you introduced 4 vulnerabilities this month"), it
    gets gamed: alerts are closed without being fixed, the scanner is disabled on difficult projects,
    incidents are hidden. The numbers improve, security degrades. DORA and security metrics are read
    **at team and system level**, to choose what to improve next. Second trap: measuring only speed
    (or only stability). The four metrics are read together.

bestPractice:
  fr: |
    - **Commencez par mesurer** l'existant, même approximativement, avant de fixer un objectif.
    - **Suivez la tendance**, pas la valeur d'un jour : un chiffre qui s'améliore mois après mois compte plus qu'un record.
    - **Peu d'indicateurs, bien choisis** : les quatre DORA, le MTTR des failles critiques et le stock ouvert suffisent pour débuter.
    - **Automatisez la collecte** depuis Git, le pipeline et les scanners : une métrique saisie à la main est vite abandonnée.
    - **Post-mortem sans blâme** après chaque incident, partagé avec toute l'équipe.
    - **Rendez la sécurité visible** : modèle de pull request, canal de discussion dédié, référents sécurité dans chaque équipe.
  en: |
    - **Start by measuring** what exists, even roughly, before setting a target.
    - **Follow the trend**, not a single day's value: a number improving month after month matters more than a record.
    - **Few, well-chosen indicators**: the four DORA metrics, the MTTR of critical flaws and the open backlog are enough to begin.
    - **Automate the collection** from Git, the pipeline and the scanners: a metric typed in by hand is soon abandoned.
    - **Blameless post-mortem** after every incident, shared with the whole team.
    - **Make security visible**: pull request template, dedicated chat channel, security champions in each team.

exercise:
  statement:
    fr: |
      Sur les 30 derniers jours, une équipe a réalisé **20 déploiements** en production. Trois d'entre eux ont
      provoqué un incident, réparés respectivement en **30**, **60** et **90** minutes.

      Écrivez un script Python qui calcule et affiche :

      1. la fréquence de déploiement (par jour) ;
      2. le taux d'échec des changements (en %) ;
      3. le temps moyen de restauration (en minutes).

      Puis répondez : parmi ces trois chiffres, lesquels mesurent la **stabilité** ?
    en: |
      Over the last 30 days, a team made **20 deployments** to production. Three of them caused an
      incident, repaired in **30**, **60** and **90** minutes respectively.

      Write a Python script that computes and prints:

      1. the deployment frequency (per day);
      2. the change failure rate (in %);
      3. the mean time to restore (in minutes).

      Then answer: among these three numbers, which ones measure **stability**?
  solution:
    file: solution.py
    lang: python
    code: |
      DAYS = 30
      deployments = 20
      restore_minutes = [30, 60, 90]  # one value per failed deployment

      frequency = deployments / DAYS
      failure_rate = 100 * len(restore_minutes) / deployments
      time_to_restore = sum(restore_minutes) / len(restore_minutes)

      print(f"Deployment frequency : {frequency:.2f} per day")
      print(f"Change failure rate  : {failure_rate:.0f} %")
      print(f"Time to restore      : {time_to_restore:.0f} minutes")
    note:
      fr: "Résultat : 0,67 déploiement par jour, 15 % d'échec, 60 minutes de restauration. Le taux d'échec et le temps de restauration mesurent la stabilité ; la fréquence mesure la vitesse."
      en: "Result: 0.67 deployments per day, 15% failure rate, 60 minutes to restore. The failure rate and the time to restore measure stability; the frequency measures speed."

quiz:
  - q:
      fr: "Que signifie le « S » de CALMS ?"
      en: "What does the \"S\" in CALMS stand for?"
    options:
      fr:
        - "Security (sécurité)"
        - "Speed (vitesse)"
        - "Scanning (analyse)"
        - "Sharing (partage)"
      en:
        - "Security"
        - "Speed"
        - "Scanning"
        - "Sharing"
    answer: 3
    why:
      fr: "CALMS = Culture, Automation, Lean, Measurement, Sharing : le partage des connaissances et des leçons entre équipes."
      en: "CALMS = Culture, Automation, Lean, Measurement, Sharing: knowledge and lessons flow between teams."
  - q:
      fr: "Quelle métrique DORA mesure le temps entre un commit et sa mise en production ?"
      en: "Which DORA metric measures the time between a commit and its release to production?"
    options:
      fr:
        - "Le taux d'échec des changements"
        - "Le délai de mise en production (lead time for changes)"
        - "Le temps de restauration"
        - "La fréquence de déploiement"
      en:
        - "Change failure rate"
        - "Lead time for changes"
        - "Time to restore"
        - "Deployment frequency"
    answer: 1
    why:
      fr: "Le lead time for changes est le délai nécessaire pour qu'une modification validée dans Git atteigne la production."
      en: "Lead time for changes is the delay needed for a change committed to Git to reach production."
  - q:
      fr: "Sur 50 déploiements, 5 ont provoqué un incident. Quel est le taux d'échec des changements ?"
      en: "Out of 50 deployments, 5 caused an incident. What is the change failure rate?"
    options:
      fr:
        - "10 %"
        - "5 %"
        - "45 %"
        - "50 %"
      en:
        - "10%"
        - "5%"
        - "45%"
        - "50%"
    answer: 0
    why:
      fr: "Taux d'échec = déploiements en échec / déploiements totaux = 5 / 50 = 10 %."
      en: "Failure rate = failed deployments / total deployments = 5 / 50 = 10%."
  - q:
      fr: "Quel est le principe d'un post-mortem sans blâme ?"
      en: "What is the principle of a blameless post-mortem?"
    options:
      fr:
        - "Ne rien écrire pour éviter les reproches"
        - "Désigner le responsable pour qu'il ne recommence pas"
        - "Analyser pourquoi le système a laissé passer l'erreur, sans chercher un coupable"
        - "Confier l'enquête à une entreprise extérieure"
      en:
        - "Writing nothing down to avoid reproach"
        - "Naming the person responsible so they do not do it again"
        - "Analysing why the system let the mistake through, without looking for a culprit"
        - "Handing the investigation to an outside company"
    answer: 2
    why:
      fr: "Si les erreurs sont punies, elles sont cachées. On cherche donc les causes dans le système pour l'améliorer."
      en: "If mistakes are punished, they get hidden. So causes are sought in the system in order to improve it."
  - q:
      fr: "Lequel de ces indicateurs est une « métrique de vanité » ?"
      en: "Which of these indicators is a \"vanity metric\"?"
    options:
      fr:
        - "Le délai moyen de correction des failles critiques"
        - "Le nombre de failles critiques encore ouvertes"
        - "Le nombre de scans de sécurité lancés ce mois-ci"
        - "Le taux d'échec des changements"
      en:
        - "The mean time to fix critical flaws"
        - "The number of critical flaws still open"
        - "The number of security scans run this month"
        - "The change failure rate"
    answer: 2
    why:
      fr: "Lancer beaucoup de scans ne dit rien du risque réel : ce qui compte, c'est ce qui est trouvé et corrigé."
      en: "Running many scans says nothing about real risk: what matters is what gets found and fixed."
