description:
  fr: "Comparer les rôles Dev, DevOps, DevSecOps et SRE : qui fait quoi, avec quels outils, et comment ces métiers travaillent ensemble."
  en: "Compare the Dev, DevOps, DevSecOps and SRE roles: who does what, with which tools, and how these jobs work together."
duration: 15

intro:
  fr: |
    Dans les offres d'emploi, quatre mots reviennent sans cesse : **Dev**, **DevOps**, **DevSecOps** et
    **SRE** (*Site Reliability Engineering*, l'ingénierie de la fiabilité). Ils se ressemblent, et pourtant
    chacun répond à une question différente.

    Pensez à un restaurant. Le **cuisinier** crée les plats (Dev). Le **chef de salle** organise le passage
    de la cuisine à la table pour que chaque plat arrive vite et chaud (DevOps). Le **responsable hygiène**
    vérifie la chaîne du froid et la propreté à chaque étape, pas seulement le jour de l'inspection
    (DevSecOps). Enfin, le **gérant** mesure le temps d'attente des clients et décide quand il faut
    ralentir les nouveautés pour stabiliser le service (SRE).

    Dans cette leçon, vous allez voir pour chaque rôle un exemple concret de ce qu'il produit au quotidien.
  en: |
    Four words keep coming back in job offers: **Dev**, **DevOps**, **DevSecOps** and **SRE**
    (*Site Reliability Engineering*). They look alike, yet each one answers a different question.

    Think of a restaurant. The **cook** creates the dishes (Dev). The **head waiter** organises the path
    from the kitchen to the table so that every dish arrives fast and hot (DevOps). The **hygiene officer**
    checks the cold chain and cleanliness at every step, not only on inspection day (DevSecOps). Finally,
    the **manager** measures how long customers wait and decides when new dishes must slow down so the
    service can stabilise (SRE).

    In this lesson you will see, for each role, a concrete example of what it produces every day.

sections:
  - heading:
      fr: "Quatre rôles, quatre questions"
      en: "Four roles, four questions"
    body:
      fr: |
        | Rôle | Sa question principale | Ce qu'il produit | Outils typiques |
        |---|---|---|---|
        | **Dev** | « Est-ce que ça fait ce que le client demande ? » | Du code et des tests | Python, JavaScript, Git, IDE |
        | **DevOps** | « Est-ce que ça arrive vite et sans douleur en production ? » | Des pipelines, de l'infrastructure en code | GitHub Actions, Docker, Terraform |
        | **DevSecOps** | « Est-ce que ça arrive vite **et** en sécurité ? » | Des contrôles de sécurité automatisés | Semgrep, Trivy, Vault, OPA |
        | **SRE** | « Est-ce que ça reste disponible pour les utilisateurs ? » | Des objectifs de fiabilité mesurés | Prometheus, Grafana, alertes |

        Ces rôles ne sont pas des cases étanches. Dans une petite équipe, **une seule personne** porte souvent
        plusieurs casquettes. Dans une grande entreprise, ce sont des équipes différentes qui partagent les
        mêmes outils : le dépôt Git et le pipeline.
      en: |
        | Role | Its main question | What it produces | Typical tools |
        |---|---|---|---|
        | **Dev** | "Does it do what the customer asked for?" | Code and tests | Python, JavaScript, Git, IDE |
        | **DevOps** | "Does it reach production quickly and painlessly?" | Pipelines, infrastructure as code | GitHub Actions, Docker, Terraform |
        | **DevSecOps** | "Does it get there quickly **and** safely?" | Automated security checks | Semgrep, Trivy, Vault, OPA |
        | **SRE** | "Does it stay available for users?" | Measured reliability objectives | Prometheus, Grafana, alerts |

        These roles are not sealed boxes. In a small team, **a single person** often wears several hats.
        In a large company, they are different teams sharing the same tools: the Git repository and the
        pipeline.
  - heading:
      fr: "DevOps et SRE : une culture et une façon de l'appliquer"
      en: "DevOps and SRE: a culture and a way to apply it"
    body:
      fr: |
        **DevOps** est une culture : développeurs (Dev) et exploitants (Ops) partagent la responsabilité de la
        livraison, au lieu de se renvoyer la balle.

        **SRE** est né chez Google. C'est une manière précise d'appliquer cette culture : on confie
        l'exploitation à des ingénieurs logiciels, et on pilote avec des chiffres. Trois mots à retenir :

        - **SLI** (*Service Level Indicator*) : ce qu'on mesure. Exemple : le pourcentage de requêtes réussies.
        - **SLO** (*Service Level Objective*) : l'objectif visé. Exemple : 99,9 % de requêtes réussies sur 30 jours.
        - **Budget d'erreur** : la marge de panne autorisée. Avec un SLO de 99,9 %, on a « droit » à 0,1 % d'échecs.

        Tant qu'il reste du budget, l'équipe peut livrer des nouveautés. Quand il est épuisé, on arrête les
        nouveautés et on répare la fiabilité. La décision n'est plus une dispute, c'est un calcul.
      en: |
        **DevOps** is a culture: developers (Dev) and operators (Ops) share responsibility for delivery
        instead of blaming each other.

        **SRE** was born at Google. It is a precise way of applying that culture: operations are handed to
        software engineers, and decisions are driven by numbers. Three words to remember:

        - **SLI** (*Service Level Indicator*): what is measured. Example: the percentage of successful requests.
        - **SLO** (*Service Level Objective*): the target. Example: 99.9% of successful requests over 30 days.
        - **Error budget**: the allowed margin of failure. With a 99.9% SLO, you are "allowed" 0.1% of failures.

        As long as some budget is left, the team may ship new features. When it is used up, features stop
        and reliability gets fixed. The decision is no longer an argument, it is a calculation.
  - heading:
      fr: "Où se place DevSecOps ?"
      en: "Where does DevSecOps fit?"
    body:
      fr: |
        DevSecOps n'ajoute pas un cinquième silo : il ajoute la **sécurité dans le travail des trois autres**.

        | Avec… | L'ingénieur DevSecOps apporte… |
        |---|---|
        | les **Dev** | des règles d'analyse de code, des revues, de la formation au code sûr |
        | les **DevOps** | des étapes de sécurité dans le pipeline, des images et une infrastructure durcies |
        | les **SRE** | la détection d'attaques dans les journaux, la réponse aux incidents de sécurité |

        Concrètement, un ingénieur DevSecOps est souvent un profil DevOps qui a appris la sécurité, ou un
        profil sécurité qui a appris l'automatisation. C'est exactement le chemin que suit ce site.
      en: |
        DevSecOps does not add a fifth silo: it adds **security to the work of the other three**.

        | With… | The DevSecOps engineer brings… |
        |---|---|
        | **Devs** | code analysis rules, reviews, secure coding training |
        | **DevOps** | security steps in the pipeline, hardened images and infrastructure |
        | **SREs** | attack detection in the logs, security incident response |

        In practice, a DevSecOps engineer is often a DevOps profile who learned security, or a security
        profile who learned automation. That is exactly the path this site follows.

examples:
  - title:
      fr: "Dev : une fonction et ses tests"
      en: "Dev: a function and its tests"
    file: discount.py
    lang: python
    kind: neutral
    code: |
      # The developer's job: turn a need into working, tested code.


      def apply_discount(price, percent):
          """Return the price after a discount."""
          if not 0 <= percent <= 100:
              # Reject absurd input instead of silently computing a wrong price
              raise ValueError("percent must be between 0 and 100")
          return round(price * (1 - percent / 100), 2)


      # Unit tests: the developer proves the code does what was asked
      assert apply_discount(100, 20) == 80.0
      assert apply_discount(50, 0) == 50.0

      try:
          apply_discount(100, 150)
      except ValueError as error:
          print("Rejected:", error)

      print("All tests passed")
    output: |
      Rejected: percent must be between 0 and 100
      All tests passed
    note:
      fr: "Le développeur livre la fonctionnalité **et** la preuve qu'elle marche. Remarquez la validation de l'entrée : refuser une remise de 150 % est déjà un réflexe de sécurité."
      en: "The developer ships the feature **and** the proof that it works. Notice the input validation: refusing a 150% discount is already a security reflex."

  - title:
      fr: "DevOps : un pipeline qui teste et construit à chaque push"
      en: "DevOps: a pipeline that tests and builds on every push"
    file: .github/workflows/ci.yml
    lang: yaml
    kind: neutral
    code: |
      name: ci

      on:
        push:
          branches: [main]
        pull_request:

      jobs:
        test:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            - name: Install dependencies
              run: pip install -r requirements.txt pytest
            - name: Run the unit tests
              run: pytest -q

        build:
          needs: test # build the image only if the tests pass
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - name: Build the container image
              run: docker build -t shop-api:${{ github.sha }} .
    note:
      fr: "Le profil DevOps automatise le chemin entre le code et la production : plus personne ne lance les tests ou la construction à la main. Ce pipeline est rapide, mais il ne vérifie **rien** côté sécurité."
      en: "The DevOps profile automates the path from code to production: nobody runs the tests or the build by hand any more. This pipeline is fast, but it checks **nothing** about security."

  - title:
      fr: "DevSecOps : le même pipeline, avec un contrôle de sécurité"
      en: "DevSecOps: the same pipeline, with a security check"
    file: .github/workflows/ci.yml
    lang: yaml
    kind: secure
    code: |
      name: ci

      on:
        push:
          branches: [main]
        pull_request:

      # Least privilege: the jobs can read the code, nothing else
      permissions:
        contents: read

      jobs:
        test:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            - name: Install dependencies
              run: pip install -r requirements.txt pytest
            - name: Run the unit tests
              run: pytest -q

        audit:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            - name: Look for known vulnerabilities in the dependencies
              run: |
                pip install pip-audit
                pip-audit -r requirements.txt

        build:
          needs: [test, audit] # no image if a test OR the audit fails
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - name: Build the container image
              run: docker build -t shop-api:${{ github.sha }} .
    output: |
      Run pip-audit -r requirements.txt
      Found 3 known vulnerabilities in 1 package
      Name  Version ID             Fix Versions
      ----- ------- -------------- ------------
      flask 0.12.2  PYSEC-2018-66  0.12.3
      flask 0.12.2  PYSEC-2019-179 1.0
      flask 0.12.2  PYSEC-2023-62  2.2.5,2.3.2
      Error: Process completed with exit code 1.
    note:
      fr: "Deux ajouts suffisent : des permissions minimales et un job `audit`. `pip-audit` compare les dépendances à une base de vulnérabilités connues ; ici une vieille version de Flask bloque la construction de l'image. La colonne *Fix Versions* indique vers quelle version mettre à jour."
      en: "Two additions are enough: minimal permissions and an `audit` job. `pip-audit` compares the dependencies with a database of known vulnerabilities; here an old Flask version blocks the image build. The *Fix Versions* column tells you which version to upgrade to."

  - title:
      fr: "SRE : calculer le budget d'erreur"
      en: "SRE: computing the error budget"
    file: error_budget.py
    lang: python
    kind: neutral
    code: |
      # An SRE turns "the site must be reliable" into numbers.

      SLO = 99.9                  # objective: 99.9 % of requests succeed
      total_requests = 2_000_000  # requests received this month
      failed_requests = 1_400     # requests answered with an error

      availability = 100 * (total_requests - failed_requests) / total_requests
      error_budget = total_requests * (100 - SLO) / 100  # failures we can afford
      budget_used = 100 * failed_requests / error_budget

      print(f"Availability    : {availability:.2f} %")
      print(f"Error budget    : {error_budget:.0f} failed requests allowed")
      print(f"Budget consumed : {budget_used:.0f} %")

      # The budget drives the decision, not opinions
      if budget_used >= 100:
          print("Decision        : freeze releases, fix reliability first")
      elif budget_used >= 75:
          print("Decision        : slow down, low-risk releases only")
      else:
          print("Decision        : budget left, keep shipping")
    output: |
      Availability    : 99.93 %
      Error budget    : 2000 failed requests allowed
      Budget consumed : 70 %
      Decision        : budget left, keep shipping
    note:
      fr: "Avec un SLO de 99,9 %, 2 000 échecs sont tolérés sur 2 millions de requêtes. L'équipe en a consommé 70 % : elle peut continuer à livrer. Changez `failed_requests` en `2500` et relancez : la décision s'inverse."
      en: "With a 99.9% SLO, 2,000 failures are tolerated out of 2 million requests. The team has used 70% of them: it can keep shipping. Change `failed_requests` to `2500` and run again: the decision flips."

mistake:
  fr: |
    **Créer une « équipe DevSecOps » isolée qui fait la sécurité à la place des autres.**

    Si une nouvelle équipe reçoit tous les problèmes de sécurité pendant que les développeurs continuent comme
    avant, on a simplement recréé un silo avec un nom à la mode. Le rôle d'un ingénieur DevSecOps est de
    **donner aux autres les moyens** de livrer du code sûr (outils, règles, conseils), pas de corriger leurs
    failles dans leur dos. Même confusion fréquente : penser que DevOps, DevSecOps et SRE sont des outils
    ou des logiciels à installer. Ce sont des façons de travailler.
  en: |
    **Creating an isolated "DevSecOps team" that does security on behalf of everyone else.**

    If a new team receives every security problem while developers carry on as before, you have simply
    rebuilt a silo with a trendy name. The role of a DevSecOps engineer is to **enable others** to ship
    safe code (tools, rules, advice), not to fix their flaws behind their back. A related confusion:
    believing that DevOps, DevSecOps and SRE are tools or software to install. They are ways of working.

bestPractice:
  fr: |
    - **Un seul pipeline partagé** : tests, sécurité et déploiement vivent dans le même fichier, visible par tous.
    - **Des objectifs communs** : mesurez à la fois la vitesse de livraison, la fiabilité et la sécurité.
    - **La sécurité aide, elle ne juge pas** : chaque alerte doit expliquer comment corriger.
    - **Apprenez le métier du voisin** : un bon profil DevSecOps sait lire du code, un pipeline et un tableau de bord.
    - **Décidez avec des chiffres** : un budget d'erreur ou un seuil de sévérité évite les débats sans fin.
  en: |
    - **One shared pipeline**: tests, security and deployment live in the same file, visible to everyone.
    - **Common goals**: measure delivery speed, reliability and security together.
    - **Security helps, it does not judge**: every alert must explain how to fix the problem.
    - **Learn your neighbour's job**: a good DevSecOps profile can read code, a pipeline and a dashboard.
    - **Decide with numbers**: an error budget or a severity threshold avoids endless debates.

exercise:
  statement:
    fr: |
      Votre équipe s'engage sur un SLO de disponibilité de **99,95 %** sur une période de **30 jours**.

      1. Combien de **minutes** de panne ce SLO autorise-t-il sur la période (le budget d'erreur) ?
      2. Ce mois-ci, le site a été indisponible **25 minutes**. Le budget est-il respecté ?
      3. Écrivez un petit script Python qui affiche le budget, le temps consommé et la décision à prendre.
    en: |
      Your team commits to an availability SLO of **99.95%** over a **30-day** period.

      1. How many **minutes** of downtime does this SLO allow over the period (the error budget)?
      2. This month, the site was down for **25 minutes**. Is the budget respected?
      3. Write a small Python script that prints the budget, the time consumed and the decision to take.
  solution:
    file: solution.py
    lang: python
    code: |
      SLO = 99.95          # availability objective in percent
      PERIOD_DAYS = 30
      downtime_minutes = 25

      period_minutes = PERIOD_DAYS * 24 * 60              # 43 200 minutes
      budget_minutes = period_minutes * (100 - SLO) / 100  # allowed downtime

      print(f"Error budget : {budget_minutes:.1f} minutes")
      print(f"Downtime     : {downtime_minutes} minutes")

      if downtime_minutes > budget_minutes:
          # Budget exhausted: reliability work takes priority over new features
          print("Decision     : budget exceeded, freeze risky releases")
      else:
          print("Decision     : budget respected, keep shipping")
    note:
      fr: "30 jours = 43 200 minutes ; 0,05 % de 43 200 = **21,6 minutes**. Avec 25 minutes de panne, le budget est dépassé : l'équipe doit donner la priorité à la fiabilité."
      en: "30 days = 43,200 minutes; 0.05% of 43,200 = **21.6 minutes**. With 25 minutes of downtime the budget is exceeded: the team must prioritise reliability."

quiz:
  - q:
      fr: "Quelle est la question principale d'un profil DevOps ?"
      en: "What is the main question of a DevOps profile?"
    options:
      fr:
        - "Le code respecte-t-il la charte graphique ?"
        - "Le code arrive-t-il vite et sans douleur en production ?"
        - "Le budget du projet est-il respecté ?"
        - "Le contrat du client est-il signé ?"
      en:
        - "Does the code follow the style guide?"
        - "Does the code reach production quickly and painlessly?"
        - "Is the project budget respected?"
        - "Is the customer contract signed?"
    answer: 1
    why:
      fr: "DevOps rapproche développement et exploitation pour automatiser et fluidifier la livraison jusqu'en production."
      en: "DevOps brings development and operations together to automate and smooth delivery all the way to production."
  - q:
      fr: "Que signifie SLO ?"
      en: "What does SLO stand for?"
    options:
      fr:
        - "Secure Linux Operations"
        - "Software Lifecycle Owner"
        - "System Log Output"
        - "Service Level Objective"
      en:
        - "Secure Linux Operations"
        - "Software Lifecycle Owner"
        - "System Log Output"
        - "Service Level Objective"
    answer: 3
    why:
      fr: "Un SLO (Service Level Objective) est l'objectif chiffré de fiabilité, par exemple 99,9 % de requêtes réussies."
      en: "An SLO (Service Level Objective) is the numeric reliability target, for example 99.9% of successful requests."
  - q:
      fr: "Le budget d'erreur du mois est entièrement consommé. Que fait une équipe SRE ?"
      en: "This month's error budget is fully consumed. What does an SRE team do?"
    options:
      fr:
        - "Elle donne la priorité à la fiabilité et gèle les livraisons risquées"
        - "Elle augmente le nombre de livraisons pour compenser"
        - "Elle supprime le SLO pour ne plus être gênée"
        - "Elle désactive la supervision jusqu'au mois suivant"
      en:
        - "It prioritises reliability and freezes risky releases"
        - "It increases the number of releases to compensate"
        - "It deletes the SLO so it is no longer bothered"
        - "It turns monitoring off until next month"
    answer: 0
    why:
      fr: "Le budget d'erreur sert justement à décider : quand il est épuisé, on stabilise avant de livrer des nouveautés."
      en: "That is exactly what the error budget is for: when it is used up, you stabilise before shipping new features."
  - q:
      fr: "Dans l'exemple DevSecOps, que fait le job `audit` ?"
      en: "In the DevSecOps example, what does the `audit` job do?"
    options:
      fr:
        - "Il chiffre le dépôt Git"
        - "Il mesure le temps de réponse de l'application"
        - "Il cherche des vulnérabilités connues dans les dépendances"
        - "Il déploie l'application en production"
      en:
        - "It encrypts the Git repository"
        - "It measures the response time of the application"
        - "It looks for known vulnerabilities in the dependencies"
        - "It deploys the application to production"
    answer: 2
    why:
      fr: "`pip-audit` compare les paquets de `requirements.txt` à une base de vulnérabilités connues et fait échouer le job s'il en trouve."
      en: "`pip-audit` compares the packages in `requirements.txt` with a database of known vulnerabilities and fails the job if it finds any."
  - q:
      fr: "Quelle phrase décrit le mieux la place de DevSecOps par rapport aux autres rôles ?"
      en: "Which sentence best describes where DevSecOps sits among the other roles?"
    options:
      fr:
        - "Une équipe séparée qui valide chaque livraison à la main"
        - "Un remplacement des développeurs par des outils de sécurité"
        - "La sécurité intégrée au travail des Dev, des DevOps et des SRE"
        - "Un autre nom pour l'équipe d'assistance aux utilisateurs"
      en:
        - "A separate team that approves every release by hand"
        - "A replacement of developers by security tools"
        - "Security built into the work of Devs, DevOps and SREs"
        - "Another name for the user support team"
    answer: 2
    why:
      fr: "DevSecOps n'est pas un silo de plus : il apporte la sécurité dans le code, dans le pipeline et dans l'exploitation."
      en: "DevSecOps is not one more silo: it brings security into the code, the pipeline and operations."
