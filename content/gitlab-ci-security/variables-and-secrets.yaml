description:
  fr: "Gérer les secrets dans GitLab CI : variables masquées, protégées et de type fichier, authentification OIDC avec id_tokens vers Vault ou AWS, et l'erreur d'écho d'un secret."
  en: "Manage secrets in GitLab CI: masked, protected and file variables, OIDC authentication with id_tokens to Vault or AWS, and the mistake of echoing a secret."
duration: 25

intro:
  fr: |
    Un pipeline a besoin de secrets : mot de passe de base de données, jeton de registre, clé d'API. La
    question n'est pas *si* vous aurez des secrets, mais *comment* les manipuler sans les exposer. GitLab
    offre pour cela des **variables CI/CD** aux propriétés de sécurité distinctes, et un mécanisme moderne
    pour s'en passer totalement : l'**OIDC**.

    Imaginez un coffre à clés à l'entrée d'un chantier. Certaines clés sont **masquées** (on ne voit pas leur
    gravure dans les journaux), d'autres sont **protégées** (elles ne sortent que pour les ouvriers de
    confiance, sur les zones sûres), et certaines sont des **trousseaux entiers** (des fichiers de
    configuration). Bien les ranger, c'est tout l'enjeu.

    Dans cette leçon, vous allez distinguer les variables **masquées** (`masked`), **protégées**
    (`protected`) et de type **fichier** (`file`), comprendre quand chacune s'applique, puis découvrir
    l'**OIDC** avec `id_tokens` pour obtenir des identifiants temporaires auprès de **Vault** ou **AWS** sans
    stocker aucun secret de longue durée. Enfin, vous verrez l'erreur la plus fréquente — **afficher un
    secret avec `echo`** — en version vulnérable et sécurisée.
  en: |
    A pipeline needs secrets: database password, registry token, API key. The question is not *if* you will
    have secrets, but *how* to handle them without exposing them. For this GitLab offers **CI/CD variables**
    with distinct security properties, and a modern mechanism to avoid them entirely: **OIDC**.

    Picture a key box at a construction site entrance. Some keys are **masked** (their engraving is not
    visible in the logs), others are **protected** (they only come out for trusted workers, on safe zones),
    and some are **whole keyrings** (configuration files). Storing them properly is the whole challenge.

    In this lesson you will distinguish **masked**, **protected** and **file** variables, understand when
    each applies, then discover **OIDC** with `id_tokens` to obtain temporary credentials from **Vault** or
    **AWS** without storing any long-lived secret. Finally, you will see the most common mistake — **echoing
    a secret** — in vulnerable and secure versions.

sections:
  - heading:
      fr: "Masquée, protégée, fichier : trois propriétés"
      en: "Masked, protected, file: three properties"
    body:
      fr: |
        Les variables CI/CD se définissent dans *Settings > CI/CD > Variables* (jamais dans le
        `.gitlab-ci.yml`, qui est versionné). Chacune porte des propriétés de sécurité **indépendantes** :

        | Propriété | Effet | À utiliser pour |
        |---|---|---|
        | **Masked** | La valeur est **caviardée** dans les logs du job | Tout secret court (jeton, mot de passe) |
        | **Protected** | La variable n'est exposée qu'aux branches/tags **protégés** | Secrets de production |
        | **File** | La valeur est écrite dans un **fichier temporaire**, la variable contient son chemin | Certificats, kubeconfig, clés multilignes |

        **Masked** empêche qu'un secret affiché par mégarde n'apparaisse en clair dans les journaux : GitLab
        le remplace par `[MASKED]`. Attention, le masquage a des contraintes de format (longueur minimale,
        pas de caractères spéciaux arbitraires selon la version) : une valeur non conforme ne sera pas
        masquée, d'où l'intérêt de vérifier.

        **Protected** est la clé de l'isolation production. Une variable protégée n'est **jamais** fournie à
        un pipeline tournant sur une branche de fonctionnalité ou une merge request de fork. Ainsi, le mot de
        passe de production reste inaccessible au code non encore revu — exactement l'esprit du cours Secure
        Git sur les branches protégées.

        **File** résout le cas des secrets **multilignes** (un certificat, un fichier `kubeconfig`). GitLab
        écrit le contenu dans un fichier et met son **chemin** dans la variable : on utilise alors
        `$MY_CERT` comme un chemin, pas comme la valeur.
      en: |
        CI/CD variables are defined in *Settings > CI/CD > Variables* (never in the `.gitlab-ci.yml`, which
        is versioned). Each carries **independent** security properties:

        | Property | Effect | Use for |
        |---|---|---|
        | **Masked** | The value is **redacted** in the job logs | Any short secret (token, password) |
        | **Protected** | The variable is only exposed to **protected** branches/tags | Production secrets |
        | **File** | The value is written to a **temporary file**, the variable holds its path | Certificates, kubeconfig, multiline keys |

        **Masked** prevents a secret printed by accident from appearing in clear text in the logs: GitLab
        replaces it with `[MASKED]`. Note that masking has format constraints (minimum length, no arbitrary
        special characters depending on the version): a non-compliant value will not be masked, hence the
        need to verify.

        **Protected** is the key to production isolation. A protected variable is **never** provided to a
        pipeline running on a feature branch or a fork merge request. So the production password stays out of
        reach of not-yet-reviewed code — exactly the spirit of the Secure Git course on protected branches.

        **File** solves the case of **multiline** secrets (a certificate, a `kubeconfig` file). GitLab writes
        the content to a file and puts its **path** in the variable: you then use `$MY_CERT` as a path, not
        as the value.
  - heading:
      fr: "OIDC avec id_tokens : des secrets éphémères"
      en: "OIDC with id_tokens: ephemeral secrets"
    body:
      fr: |
        Le meilleur secret est celui qu'on n'a pas à stocker. Comme GitHub Actions, GitLab sait émettre un
        **jeton d'identité OIDC** de courte durée, que Vault ou AWS vérifient pour accorder des identifiants
        **temporaires**. On déclare ce jeton avec la clé **`id_tokens`** :

        ```yaml
        deploy:
          id_tokens:
            VAULT_ID_TOKEN:
              aud: https://vault.example.com   # the audience the token is for
          script:
            - export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role=deploy jwt=$VAULT_ID_TOKEN)"
            - vault kv get -field=password secret/db   # read a short-lived secret
        ```

        Le principe est identique à l'OIDC GitHub :

        1. GitLab génère `VAULT_ID_TOKEN`, un JWT signé, propre à ce job.
        2. Le job l'échange auprès de **Vault** (ou d'AWS via `sts:AssumeRoleWithWebIdentity`) contre un
           accès temporaire.
        3. Aucun secret de longue durée n'est stocké dans les variables du projet.

        Le champ **`aud`** (*audience*) précise à qui le jeton est destiné : Vault et AWS vérifient que le
        jeton leur est bien adressé et qu'il provient de votre projet GitLab (via le *claim* `sub`,
        `project_path:acme/app:ref_type:branch:ref:main`). Comme pour GitHub, la confiance est **restreinte**
        à une identité précise côté fournisseur. C'est la méthode recommandée pour tout accès cloud.
      en: |
        The best secret is the one you do not have to store. Like GitHub Actions, GitLab can mint a
        short-lived **OIDC identity token**, which Vault or AWS verify to grant **temporary** credentials.
        You declare this token with the **`id_tokens`** key:

        ```yaml
        deploy:
          id_tokens:
            VAULT_ID_TOKEN:
              aud: https://vault.example.com   # the audience the token is for
          script:
            - export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role=deploy jwt=$VAULT_ID_TOKEN)"
            - vault kv get -field=password secret/db   # read a short-lived secret
        ```

        The principle is identical to GitHub OIDC:

        1. GitLab generates `VAULT_ID_TOKEN`, a signed JWT, specific to this job.
        2. The job exchanges it with **Vault** (or with AWS via `sts:AssumeRoleWithWebIdentity`) for
           temporary access.
        3. No long-lived secret is stored in the project variables.

        The **`aud`** (*audience*) field specifies whom the token is for: Vault and AWS verify the token is
        addressed to them and comes from your GitLab project (via the `sub` claim,
        `project_path:acme/app:ref_type:branch:ref:main`). As with GitHub, trust is **restricted** to a
        precise identity on the provider side. This is the recommended method for all cloud access.
  - heading:
      fr: "L'erreur d'écho : un secret qui finit dans les logs"
      en: "The echo mistake: a secret ending up in the logs"
    body:
      fr: |
        Les logs d'un pipeline sont souvent visibles par plus de monde qu'on ne le croit (toute personne
        ayant accès au projet, parfois au-delà). Y faire apparaître un secret, même une fraction de seconde,
        c'est le compromettre.

        Le piège le plus courant est l'**écho involontaire**. Il prend plusieurs formes :

        - `echo "$DB_PASSWORD"` — affichage direct (évident, mais ça arrive en débogage).
        - `set -x` ou `bash -x` — le mode trace affiche **chaque commande avec ses variables développées**.
        - Une commande qui reçoit le secret en **argument** : `mysql -p$DB_PASSWORD` apparaît en clair dans
          la trace et dans la liste des processus.
        - Une URL avec identifiants : `curl https://user:$TOKEN@example.com` journalise le jeton.

        La variable **masquée** est un filet de sécurité (GitLab remplace la valeur par `[MASKED]`), mais
        elle ne couvre pas tout : une transformation du secret (base64, sous-chaîne) n'est plus reconnue et
        n'est **pas** masquée. La vraie parade est de **ne jamais afficher** le secret :

        - passez-le par une variable d'environnement et laissez l'outil le lire lui-même ;
        - préférez les options qui lisent depuis un fichier ou `stdin` plutôt qu'en argument ;
        - n'activez jamais `set -x` dans un job qui manipule des secrets.

        Le masquage protège contre l'accident ; la discipline protège contre le reste.
      en: |
        A pipeline's logs are often visible to more people than you think (anyone with project access,
        sometimes beyond). Making a secret appear there, even for a fraction of a second, compromises it.

        The most common trap is the **unintentional echo**. It takes several forms:

        - `echo "$DB_PASSWORD"` — direct printing (obvious, but it happens while debugging).
        - `set -x` or `bash -x` — trace mode prints **every command with its variables expanded**.
        - A command receiving the secret as an **argument**: `mysql -p$DB_PASSWORD` appears in clear text in
          the trace and in the process list.
        - A URL with credentials: `curl https://user:$TOKEN@example.com` logs the token.

        The **masked** variable is a safety net (GitLab replaces the value with `[MASKED]`), but it does not
        cover everything: a transformation of the secret (base64, substring) is no longer recognised and is
        **not** masked. The real defence is to **never print** the secret:

        - pass it through an environment variable and let the tool read it itself;
        - prefer options that read from a file or `stdin` rather than as an argument;
        - never enable `set -x` in a job that handles secrets.

        Masking protects against the accident; discipline protects against the rest.

examples:
  - title:
      fr: "Variable fichier : un kubeconfig multiligne"
      en: "File variable: a multiline kubeconfig"
    file: .gitlab-ci.yml
    lang: yaml
    kind: secure
    code: |
      deploy:
        stage: deploy
        image: bitnami/kubectl:1.31
        script:
          # KUBECONFIG is a FILE-type variable: GitLab wrote its content to a
          # temporary file and $KUBECONFIG_FILE holds the PATH to that file.
          # kubectl reads the file itself; the secret never passes through a log.
          - kubectl --kubeconfig "$KUBECONFIG_FILE" get pods
        rules:
          - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    note:
      fr: "`KUBECONFIG_FILE` est une variable de type **File** : sa valeur est le **chemin** d'un fichier temporaire, pas le contenu. Idéal pour les secrets multilignes (certificats, kubeconfig). On passe le chemin à l'outil qui lit le fichier lui-même, sans jamais afficher le contenu."
      en: "`KUBECONFIG_FILE` is a **File**-type variable: its value is the **path** of a temporary file, not the content. Ideal for multiline secrets (certificates, kubeconfig). You pass the path to the tool, which reads the file itself, without ever printing the content."

  - title:
      fr: "Vulnérable : le secret s'affiche dans les logs"
      en: "Vulnerable: the secret shows in the logs"
    file: .gitlab-ci.yml
    lang: yaml
    kind: vulnerable
    code: |
      db-migrate:
        stage: deploy
        script:
          # Trace mode: every expanded command is printed to the log
          - set -x
          # Secret printed directly (debug line that was never removed)
          - echo "Connecting with $DB_PASSWORD"
          # Secret passed as an argument: visible in the trace AND in `ps`
          - mysql -u app -p$DB_PASSWORD -e "SELECT 1"
          # Credentials in a URL: the token is logged in full
          - curl "https://user:$API_TOKEN@api.example.com/health"
    note:
      fr: "Quatre fuites dans un seul job : `set -x` développe tout, `echo` affiche le mot de passe, `-p$DB_PASSWORD` le met en argument (visible aussi dans `ps`), et l'URL journalise le jeton. Même une variable masquée ne protège pas si le secret est transformé. Résultat : des secrets lisibles par tous ceux qui ouvrent les logs."
      en: "Four leaks in a single job: `set -x` expands everything, `echo` prints the password, `-p$DB_PASSWORD` puts it in an argument (also visible in `ps`), and the URL logs the token. Even a masked variable does not protect if the secret is transformed. The result: secrets readable by everyone who opens the logs."

  - title:
      fr: "Sécurisé : le secret ne passe jamais par un log"
      en: "Secure: the secret never passes through a log"
    file: .gitlab-ci.yml
    lang: yaml
    kind: secure
    code: |
      db-migrate:
        stage: deploy
        script:
          # No "set -x". The tool reads the secret from the environment itself.
          # MYSQL_PWD is read by the mysql client; nothing is printed or passed
          # as an argument, so it stays out of logs and out of `ps`.
          - MYSQL_PWD="$DB_PASSWORD" mysql -u app -e "SELECT 1"
          # For curl, pass credentials via a header built from an env var,
          # not inside the URL, so the token is not logged.
          - curl -H "Authorization: Bearer $API_TOKEN" https://api.example.com/health
        rules:
          - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    note:
      fr: "Même tâche, aucune fuite : pas de `set -x`, le client MySQL lit `MYSQL_PWD` depuis l'environnement, et le jeton curl passe par un en-tête (pas dans l'URL). Le secret, de préférence une variable **masquée et protégée**, ne traverse jamais un log ni la liste des processus."
      en: "Same task, no leak: no `set -x`, the MySQL client reads `MYSQL_PWD` from the environment, and the curl token goes through a header (not in the URL). The secret, ideally a **masked and protected** variable, never crosses a log or the process list."

  - title:
      fr: "OIDC : obtenir un secret temporaire depuis Vault"
      en: "OIDC: getting a temporary secret from Vault"
    file: .gitlab-ci.yml
    lang: yaml
    kind: secure
    code: |
      deploy:
        stage: deploy
        image: vault:1.17
        # GitLab mints a short-lived JWT for this job; no stored Vault token
        id_tokens:
          VAULT_ID_TOKEN:
            aud: https://vault.example.com
        script:
          - export VAULT_ADDR=https://vault.example.com
          # Exchange the OIDC token for a temporary Vault token
          - export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role=deploy jwt=$VAULT_ID_TOKEN)"
          # Read a dynamic, short-lived database password
          - DB_PWD="$(vault kv get -field=password secret/db)"
          - MYSQL_PWD="$DB_PWD" mysql -u app -e "SELECT 1"
        rules:
          - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    note:
      fr: "Aucun secret de longue durée n'est stocké. GitLab émet `VAULT_ID_TOKEN` (JWT signé), le job l'échange contre un jeton Vault temporaire, puis lit un mot de passe éphémère. Le champ `aud` cible Vault, qui vérifie aussi que le jeton vient bien de votre projet. C'est l'équivalent GitLab de l'OIDC AWS vu en GitHub Actions."
      en: "No long-lived secret is stored. GitLab mints `VAULT_ID_TOKEN` (signed JWT), the job exchanges it for a temporary Vault token, then reads an ephemeral password. The `aud` field targets Vault, which also verifies the token truly comes from your project. It is GitLab's equivalent of the AWS OIDC seen in GitHub Actions."

mistake:
  fr: |
    **Afficher un secret dans les logs, souvent sans le vouloir.**

    `echo "$TOKEN"`, `set -x`, un mot de passe passé en argument (`-p$PWD`, visible aussi dans `ps`), des
    identifiants dans une URL : autant de façons de journaliser un secret, lisible ensuite par tous ceux qui
    ouvrent les logs. La variable **masquée** aide, mais ne couvre pas les secrets transformés (base64,
    sous-chaîne). La seule vraie parade est de **ne jamais afficher** le secret : le passer par
    l'environnement, le lire depuis un fichier ou `stdin`, et ne jamais activer le mode trace dans un job
    sensible. Et pour les accès cloud, l'OIDC supprime carrément le secret stocké.
  en: |
    **Printing a secret to the logs, often unintentionally.**

    `echo "$TOKEN"`, `set -x`, a password passed as an argument (`-p$PWD`, also visible in `ps`),
    credentials in a URL: all ways to log a secret, then readable by everyone who opens the logs. The
    **masked** variable helps, but does not cover transformed secrets (base64, substring). The only real
    defence is to **never print** the secret: pass it through the environment, read it from a file or
    `stdin`, and never enable trace mode in a sensitive job. And for cloud access, OIDC removes the stored
    secret entirely.

bestPractice:
  fr: |
    - **Définissez les secrets dans les variables CI/CD**, jamais dans le `.gitlab-ci.yml` versionné.
    - **Cochez `masked`** pour tout secret, et **`protected`** pour les secrets de production.
    - **Utilisez le type `file`** pour les secrets multilignes (certificats, kubeconfig).
    - **Ne faites jamais `echo` d'un secret** et bannissez `set -x` dans les jobs sensibles.
    - **Passez les secrets par l'environnement** ou un fichier, jamais en argument ni dans une URL.
    - **Préférez l'OIDC (`id_tokens`)** vers Vault/AWS : des identifiants temporaires, aucun secret stocké.
  en: |
    - **Define secrets in CI/CD variables**, never in the versioned `.gitlab-ci.yml`.
    - **Tick `masked`** for every secret, and **`protected`** for production secrets.
    - **Use the `file` type** for multiline secrets (certificates, kubeconfig).
    - **Never `echo` a secret** and ban `set -x` in sensitive jobs.
    - **Pass secrets through the environment** or a file, never as an argument or inside a URL.
    - **Prefer OIDC (`id_tokens`)** to Vault/AWS: temporary credentials, no stored secret.

exercise:
  statement:
    fr: |
      Un job de déploiement contient ces lignes, qui font fuiter le mot de passe dans les logs :

      ```yaml
      script:
        - set -x
        - echo "Deploying with password $DB_PASSWORD"
        - mysql -u app -p$DB_PASSWORD < migrate.sql
      ```

      1. Citez les trois façons dont le secret fuit ici.
      2. Réécrivez le `script` pour qu'aucun secret n'apparaisse dans les logs ni dans la liste des
         processus.
      3. En une phrase : quelle approche supprimerait carrément le besoin de stocker ce mot de passe ?
    en: |
      A deployment job contains these lines, which leak the password into the logs:

      ```yaml
      script:
        - set -x
        - echo "Deploying with password $DB_PASSWORD"
        - mysql -u app -p$DB_PASSWORD < migrate.sql
      ```

      1. Name the three ways the secret leaks here.
      2. Rewrite the `script` so that no secret appears in the logs or in the process list.
      3. In one sentence: which approach would remove the need to store this password entirely?
  solution:
    file: .gitlab-ci.yml
    lang: yaml
    code: |
      # 1. THREE leaks:
      #    - set -x prints every expanded command (secret included)
      #    - echo prints the password directly
      #    - -p$DB_PASSWORD puts it in an argument, visible in the trace and in `ps`

      # 2. Fixed script: no trace, no echo, secret read from the environment
      script:
        - MYSQL_PWD="$DB_PASSWORD" mysql -u app < migrate.sql

      # 3. Use OIDC (id_tokens) to fetch a short-lived password from Vault at run
      #    time, so no long-lived DB password is stored in the project variables.
    note:
      fr: "Le client MySQL lit `MYSQL_PWD` depuis l'environnement : le secret ne passe ni par un `echo`, ni par un argument, ni par la trace. En complément, `DB_PASSWORD` doit être une variable **masquée et protégée**. L'OIDC vers Vault (question 3) irait plus loin en délivrant un mot de passe éphémère, jamais stocké."
      en: "The MySQL client reads `MYSQL_PWD` from the environment: the secret goes through no `echo`, no argument, no trace. In addition, `DB_PASSWORD` should be a **masked and protected** variable. OIDC to Vault (question 3) would go further by delivering an ephemeral password, never stored."

quiz:
  - q:
      fr: "Que garantit une variable CI/CD « masquée » (masked) ?"
      en: "What does a \"masked\" CI/CD variable guarantee?"
    options:
      fr:
        - "Sa valeur est caviardée dans les logs du job"
        - "Elle n'est disponible que sur les branches protégées"
        - "Elle est écrite dans un fichier temporaire"
        - "Elle est chiffrée dans le dépôt Git"
      en:
        - "Its value is redacted in the job logs"
        - "It is only available on protected branches"
        - "It is written to a temporary file"
        - "It is encrypted in the Git repo"
    answer: 0
    why:
      fr: "Masked remplace la valeur par `[MASKED]` dans les logs. L'isolation par branche, c'est `protected` ; le fichier temporaire, c'est le type `file`."
      en: "Masked replaces the value with `[MASKED]` in the logs. Branch isolation is `protected`; the temporary file is the `file` type."
  - q:
      fr: "À quoi sert la propriété « protégée » (protected) d'une variable ?"
      en: "What is the \"protected\" property of a variable for?"
    options:
      fr:
        - "À masquer la valeur dans les logs"
        - "À ne l'exposer qu'aux branches et tags protégés"
        - "À la transformer en fichier"
        - "À la rendre obligatoire"
      en:
        - "To mask the value in the logs"
        - "To expose it only to protected branches and tags"
        - "To turn it into a file"
        - "To make it mandatory"
    answer: 1
    why:
      fr: "Une variable protégée n'est jamais fournie à un pipeline tournant sur une branche non protégée : les secrets de production restent hors de portée du code non revu."
      en: "A protected variable is never provided to a pipeline running on an unprotected branch: production secrets stay out of reach of unreviewed code."
  - q:
      fr: "Pour un secret multiligne comme un kubeconfig, quel type de variable utiliser ?"
      en: "For a multiline secret like a kubeconfig, which variable type do you use?"
    options:
      fr:
        - "Le type `masked`"
        - "Le type `protected`"
        - "Le type `file`"
        - "Aucun, il faut le mettre dans le `.gitlab-ci.yml`"
      en:
        - "The `masked` type"
        - "The `protected` type"
        - "The `file` type"
        - "None, put it in the `.gitlab-ci.yml`"
    answer: 2
    why:
      fr: "Le type `file` écrit la valeur dans un fichier temporaire et place son chemin dans la variable, idéal pour les certificats et kubeconfig multilignes."
      en: "The `file` type writes the value to a temporary file and puts its path in the variable, ideal for multiline certificates and kubeconfigs."
  - q:
      fr: "Quelle clé GitLab CI déclare un jeton OIDC pour un job ?"
      en: "Which GitLab CI key declares an OIDC token for a job?"
    options:
      fr:
        - "`id_tokens`"
        - "`secrets`"
        - "`oidc_login`"
        - "`vault`"
      en:
        - "`id_tokens`"
        - "`secrets`"
        - "`oidc_login`"
        - "`vault`"
    answer: 0
    why:
      fr: "`id_tokens` (avec un champ `aud`) fait émettre par GitLab un JWT de courte durée, échangeable auprès de Vault ou AWS contre des identifiants temporaires."
      en: "`id_tokens` (with an `aud` field) makes GitLab mint a short-lived JWT, exchangeable with Vault or AWS for temporary credentials."
  - q:
      fr: "Pourquoi `set -x` est-il dangereux dans un job qui manipule des secrets ?"
      en: "Why is `set -x` dangerous in a job that handles secrets?"
    options:
      fr:
        - "Il ralentit fortement le job"
        - "Il désactive le masquage des variables"
        - "Il supprime les artifacts"
        - "Il affiche chaque commande avec ses variables développées dans les logs"
      en:
        - "It greatly slows the job down"
        - "It disables variable masking"
        - "It deletes the artifacts"
        - "It prints every command with its variables expanded in the logs"
    answer: 3
    why:
      fr: "Le mode trace journalise chaque commande avec les valeurs développées ; un secret transformé peut échapper au masquage et apparaître en clair."
      en: "Trace mode logs every command with expanded values; a transformed secret can escape masking and appear in clear text."
