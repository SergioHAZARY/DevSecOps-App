      fr: "Comment ignorer un check Trivy en ligne dans du Terraform ?"
      en: "How do you ignore a Trivy check inline in Terraform?"
    options:
      fr:
        - "Avec `// skip` à la fin de la ligne"
        - "Avec un commentaire `#trivy:ignore:<ID>` juste au-dessus du bloc"
        - "En supprimant la ressource"
        - "En renommant le fichier"
      en:
        - "With `// skip` at the end of the line"
        - "With a `#trivy:ignore:<ID>` comment just above the block"
        - "By deleting the resource"
        - "By renaming the file"
    answer: 1
    why:
