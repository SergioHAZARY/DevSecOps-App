    answer: 0
    why:
      fr: "Là où tfsec ne faisait que l'IaC, le même binaire Trivy scanne aussi les images, les dépendances et les secrets. On réduit le nombre d'outils à installer et à intégrer."
      en: "Where tfsec only did IaC, the same Trivy binary also scans images, dependencies and secrets. You reduce the number of tools to install and integrate."
  - q:
      fr: "Que désigne un identifiant comme `AVD-AWS-0107` dans un résultat Trivy ?"
      en: "What does an identifier like `AVD-AWS-0107` refer to in a Trivy result?"
    options:
      fr:
        - "Le numéro de version de Trivy"
        - "L'identifiant stable du contrôle de configuration, utilisé pour l'ignorer ou le documenter"
        - "Le coût de la correction"
        - "L'adresse IP de la ressource"
      en:
        - "Trivy's version number"
        - "The config check's stable identifier, used to ignore or document it"
        - "The cost of the fix"
        - "The resource's IP address"
