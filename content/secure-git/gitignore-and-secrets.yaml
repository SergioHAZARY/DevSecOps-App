description:
  fr: "Utiliser .gitignore pour garder les secrets hors du dépôt, comprendre pourquoi il ne supprime pas un fichier déjà commité et nettoyer avec git rm --cached."
  en: "Use .gitignore to keep secrets out of the repo, understand why it does not remove an already-committed file, and clean up with git rm --cached."
duration: 20

intro:
  fr: |
    **Git** garde la trace de chaque version de votre code. C'est merveilleux pour le travail d'équipe,
    mais c'est aussi un piège : tout ce que vous commitez est enregistré **pour toujours** dans l'historique.
    Un mot de passe commité puis supprimé reste visible dans les anciennes versions.

    Imaginez un carnet où vous écrivez à l'encre indélébile : vous pouvez tourner la page, mais la page
    précédente reste lisible. Un fichier `.env` plein de secrets, une clé privée, un fichier de sauvegarde
    de base de données : s'ils entrent dans Git, ils y restent.

    La première ligne de défense porte un nom simple : **`.gitignore`**. C'est une liste de fichiers que
    Git doit *ignorer*, c'est-à-dire ne jamais proposer d'ajouter. Dans cette leçon, vous allez créer un
    bon `.gitignore`, comprendre sa limite majeure (il n'efface pas ce qui est déjà commité) et apprendre
    à retirer proprement un fichier du suivi avec `git rm --cached`.
  en: |
    **Git** keeps track of every version of your code. That is wonderful for teamwork, but it is also a
    trap: everything you commit is recorded **forever** in the history. A password committed and then
    deleted stays visible in the older versions.

    Picture a notebook written in permanent ink: you can turn the page, but the previous page is still
    readable. A `.env` file full of secrets, a private key, a database backup file: once they enter Git,
    they stay there.

    The first line of defence has a simple name: **`.gitignore`**. It is a list of files Git must
    *ignore*, meaning it will never offer to add them. In this lesson you will create a good `.gitignore`,
    understand its major limitation (it does not erase what is already committed) and learn to cleanly
    remove a file from tracking with `git rm --cached`.

sections:
  - heading:
      fr: "Ce qu'est (et n'est pas) un .gitignore"
      en: "What a .gitignore is (and is not)"
    body:
      fr: |
        Un fichier `.gitignore` contient une **règle par ligne**. Chaque règle est un motif (*pattern*) :
        tout fichier qui correspond est exclu des commandes `git add` et n'apparaît plus dans
        `git status`.

        | Motif | Ce qu'il ignore |
        |---|---|
        | `.env` | Le fichier `.env` dans ce dossier |
        | `*.pem` | Tous les fichiers finissant par `.pem` (clés privées) |
        | `secrets/` | Tout le contenu du dossier `secrets` |
        | `**/credentials.json` | Ce fichier dans n'importe quel sous-dossier |
        | `!config.example.env` | **Exception** : ce fichier n'est PAS ignoré |

        Un point crucial : `.gitignore` n'agit que sur les fichiers **non suivis** (*untracked*). Il dit à
        Git « ne me propose jamais d'ajouter ces fichiers ». Mais il **ne touche pas** aux fichiers déjà
        enregistrés : une fois qu'un secret est dans un commit, l'ajouter à `.gitignore` ne le fait pas
        disparaître. C'est l'erreur la plus fréquente, et nous y revenons plus bas.
      en: |
        A `.gitignore` file contains **one rule per line**. Each rule is a pattern: any file that matches
        is excluded from `git add` commands and no longer shows up in `git status`.

        | Pattern | What it ignores |
        |---|---|
        | `.env` | The `.env` file in this folder |
        | `*.pem` | Every file ending in `.pem` (private keys) |
        | `secrets/` | The whole contents of the `secrets` folder |
        | `**/credentials.json` | That file in any sub-folder |
        | `!config.example.env` | **Exception**: this file is NOT ignored |

        One crucial point: `.gitignore` only acts on **untracked** files. It tells Git "never offer to add
        these files for me". But it **does not touch** files that are already recorded: once a secret is in
        a commit, adding it to `.gitignore` does not make it disappear. This is the most common mistake,
        and we come back to it below.
  - heading:
      fr: "Quels fichiers ne doivent jamais entrer dans Git"
      en: "Which files must never enter Git"
    body:
      fr: |
        Toute donnée qui identifie, authentifie ou déverrouille quelque chose n'a rien à faire dans un
        dépôt. Les cas classiques :

        - **Fichiers d'environnement** : `.env`, `.env.local`, `.env.production`.
        - **Clés privées et certificats** : `*.pem`, `*.key`, `id_rsa`, `*.p12`, `*.pfx`.
        - **Fichiers de configuration cloud** : `.aws/credentials`, `kubeconfig`, `terraform.tfstate`
          (il contient souvent des secrets en clair).
        - **Sauvegardes et dumps** : `*.sql`, `*.dump`, `*.bak`.
        - **Dépendances et artefacts** : `node_modules/`, `__pycache__/`, `.venv/`, `dist/` — pas des
          secrets, mais du bruit inutile.

        La bonne pratique est de **committer un modèle** à la place du vrai fichier : `.env.example` qui
        liste les noms des variables avec des valeurs factices (`API_KEY=changeme-in-vault`), pour que les
        collègues sachent quoi renseigner sans jamais voir un vrai secret.
      en: |
        Any data that identifies, authenticates or unlocks something has no place in a repository. The
        classic cases:

        - **Environment files**: `.env`, `.env.local`, `.env.production`.
        - **Private keys and certificates**: `*.pem`, `*.key`, `id_rsa`, `*.p12`, `*.pfx`.
        - **Cloud configuration files**: `.aws/credentials`, `kubeconfig`, `terraform.tfstate`
          (it often holds clear-text secrets).
        - **Backups and dumps**: `*.sql`, `*.dump`, `*.bak`.
        - **Dependencies and build artefacts**: `node_modules/`, `__pycache__/`, `.venv/`, `dist/` — not
          secrets, but useless noise.

        The good practice is to **commit a template** instead of the real file: a `.env.example` that lists
        the variable names with fake values (`API_KEY=changeme-in-vault`), so colleagues know what to fill
        in without ever seeing a real secret.
  - heading:
      fr: "Retirer un fichier déjà suivi sans le supprimer du disque"
      en: "Removing an already-tracked file without deleting it from disk"
    body:
      fr: |
        Quand un fichier a déjà été commité, ajouter une ligne dans `.gitignore` ne suffit pas. Il faut
        d'abord dire à Git d'arrêter de le suivre, avec **`git rm --cached`** :

        ```bash
        git rm --cached .env
        ```

        - `git rm .env` supprimerait le fichier du dépôt **et** de votre disque.
        - `git rm --cached .env` le retire seulement de l'**index** de Git : le fichier reste sur votre
          disque, mais le prochain commit l'enregistre comme supprimé du dépôt.

        Après cette commande, ajoutez `.env` à `.gitignore` pour que l'erreur ne se reproduise pas, puis
        committez. Attention : le secret reste présent dans **l'historique** (les anciens commits). Si
        c'était un vrai secret exposé, il faut **le changer immédiatement** (le « révoquer ») et, si le
        dépôt a été partagé, réécrire l'historique — c'est le sujet de la dernière leçon de ce cours.
      en: |
        When a file has already been committed, adding a line to `.gitignore` is not enough. You must
        first tell Git to stop tracking it, with **`git rm --cached`**:

        ```bash
        git rm --cached .env
        ```

        - `git rm .env` would delete the file from the repository **and** from your disk.
        - `git rm --cached .env` removes it only from Git's **index**: the file stays on your disk, but the
          next commit records it as removed from the repository.

        After this command, add `.env` to `.gitignore` so the mistake does not happen again, then commit.
        Beware: the secret is still present in the **history** (the older commits). If it was a real
        exposed secret, you must **rotate it immediately** (revoke it) and, if the repo was shared, rewrite
        the history — that is the subject of the last lesson of this course.

examples:
  - title:
      fr: "Un .gitignore complet pour une application Python/Node"
      en: "A complete .gitignore for a Python/Node application"
    file: .gitignore
    lang: bash
    kind: secure
    code: |
      # --- Secrets: never commit these ---
      .env
      .env.*
      *.pem
      *.key
      id_rsa
      *.p12
      *.pfx
      .aws/credentials
      kubeconfig

      # Exception: the template IS committed so the team knows the variable names
      !.env.example

      # --- Infrastructure state (often contains clear-text secrets) ---
      *.tfstate
      *.tfstate.*
      .terraform/

      # --- Database backups ---
      *.sql
      *.dump
      *.bak

      # --- Dependencies and build output (noise, not secrets) ---
      node_modules/
      __pycache__/
      .venv/
      dist/
      build/
    note:
      fr: "`!.env.example` est une exception : le modèle est versionné pour documenter les variables attendues, alors que les vrais `.env.*` restent ignorés. Mettez ce fichier à la racine du dépôt dès le premier commit."
      en: "`!.env.example` is an exception: the template is versioned to document the expected variables, while the real `.env.*` files stay ignored. Put this file at the root of the repo from the very first commit."

  - title:
      fr: "Le modèle à committer à la place du vrai fichier"
      en: "The template to commit instead of the real file"
    file: .env.example
    lang: bash
    kind: secure
    code: |
      # Copy this file to ".env" and fill in real values.
      # ".env" is listed in .gitignore and must never be committed.

      # Database (fake placeholder values only)
      DATABASE_URL=postgres://user:changeme-in-vault@localhost:5432/app

      # Third-party API (obviously fake example key)
      STRIPE_API_KEY=sk_test_changeme-in-vault

      # Signing secret, generated per environment
      SESSION_SECRET=changeme-in-vault
    note:
      fr: "Le modèle ne contient **aucune** vraie valeur : uniquement des noms de variables et des espaces réservés (`changeme-in-vault`). Un nouveau développeur copie ce fichier en `.env` et remplit les vraies valeurs localement."
      en: "The template contains **no** real value: only variable names and placeholders (`changeme-in-vault`). A new developer copies this file to `.env` and fills in the real values locally."

  - title:
      fr: "L'erreur : .env commité, puis « corrigé » sans effet"
      en: "The mistake: .env committed, then \"fixed\" with no effect"
    file: wrong.sh
    lang: bash
    kind: vulnerable
    code: |
      # The developer commits the secret file by accident...
      git add .
      git commit -m "Add app config"        # .env is now in the history FOREVER

      # ...then "fixes" it by adding it to .gitignore
      echo ".env" >> .gitignore
      git add .gitignore
      git commit -m "Ignore .env"

      # But the secret is still tracked AND still in every past commit:
      git ls-files | grep .env
    output: |
      .env
    note:
      fr: "`.gitignore` n'agit que sur les fichiers non suivis. Comme `.env` est déjà suivi, il continue d'apparaître dans `git ls-files` et son contenu reste dans l'historique. Ajouter la règle trop tard ne protège rien."
      en: "`.gitignore` only affects untracked files. Because `.env` is already tracked, it still shows in `git ls-files` and its contents stay in the history. Adding the rule too late protects nothing."

  - title:
      fr: "La correction : retirer du suivi puis ignorer"
      en: "The fix: untrack, then ignore"
    file: fix.sh
    lang: bash
    kind: secure
    code: |
      # 1. Stop tracking the file WITHOUT deleting it from your disk
      git rm --cached .env

      # 2. Make sure it is ignored from now on (no duplicate line)
      grep -qxF '.env' .gitignore || echo '.env' >> .gitignore

      # 3. Commit both changes
      git add .gitignore
      git commit -m "Stop tracking .env and ignore it"

      # The file is gone from the index but still on disk:
      git ls-files | grep -c '\.env$'   # -> 0 (no longer tracked)
      ls -la .env                       # -> still present locally
    output: |
      rm '.env'
      [main 9f3c1a2] Stop tracking .env and ignore it
      0
      -rw-r--r-- 1 dev dev 142 .env
    note:
      fr: "Le fichier n'est plus suivi et ne repartira plus dans un commit, mais il reste sur le disque pour l'application. **Rappel** : son contenu est toujours dans les anciens commits — si c'était un vrai secret, révoquez-le avant toute autre chose."
      en: "The file is no longer tracked and will not go into a commit again, but it stays on disk for the application. **Reminder**: its contents are still in the old commits — if it was a real secret, rotate it before anything else."

mistake:
  fr: |
    **Croire qu'ajouter un fichier à `.gitignore` efface le secret déjà commité.**

    C'est l'erreur numéro un. `.gitignore` ne regarde que les fichiers *non suivis* : un fichier déjà
    enregistré continue d'être suivi et son contenu reste dans tout l'historique, accessible à quiconque
    clone le dépôt. Pour arrêter le suivi il faut `git rm --cached`, et pour un secret réellement exposé,
    la seule bonne réaction est de **le changer immédiatement** : un secret qui a touché un dépôt partagé
    doit être considéré comme compromis.
  en: |
    **Believing that adding a file to `.gitignore` erases an already-committed secret.**

    This is the number-one mistake. `.gitignore` only looks at *untracked* files: a file that is already
    recorded stays tracked and its contents remain in the whole history, available to anyone who clones
    the repo. To stop tracking you need `git rm --cached`, and for a truly exposed secret the only correct
    reaction is to **rotate it immediately**: a secret that reached a shared repository must be considered
    compromised.

bestPractice:
  fr: |
    - **Créez le `.gitignore` en premier**, avant le premier commit, pas après.
    - **Committez un `.env.example`** avec des valeurs factices ; gardez les vrais secrets dans un
      gestionnaire (Vault, AWS Secrets Manager, les secrets du CI).
    - **Ignorez aussi `*.tfstate`** : l'état Terraform contient souvent des secrets en clair.
    - **Ne vous reposez pas uniquement sur `.gitignore`** : un oubli arrive vite. Ajoutez un scanner de
      secrets (Gitleaks, leçon suivante) qui bloque le commit même si la règle d'ignorance manque.
    - **Vérifiez avec `git status` avant chaque commit** : si un fichier sensible apparaît, arrêtez-vous.
  en: |
    - **Create the `.gitignore` first**, before the first commit, not after.
    - **Commit a `.env.example`** with fake values; keep the real secrets in a manager (Vault, AWS Secrets
      Manager, the CI secrets).
    - **Also ignore `*.tfstate`**: Terraform state often holds clear-text secrets.
    - **Do not rely on `.gitignore` alone**: an oversight happens fast. Add a secret scanner (Gitleaks,
      next lesson) that blocks the commit even when the ignore rule is missing.
    - **Check `git status` before every commit**: if a sensitive file shows up, stop.

exercise:
  statement:
    fr: |
      Vous reprenez un projet mal configuré. `git status` et `git ls-files` montrent que deux fichiers
      sensibles sont **déjà suivis** par Git :

      ```text
      config/credentials.json
      backup/dump.sql
      ```

      Le dépôt n'a **pas encore** de fichier `.gitignore`.

      1. Écrivez les commandes qui arrêtent le suivi de ces deux fichiers **sans les supprimer** de votre
         disque.
      2. Créez un `.gitignore` qui empêche qu'ils reviennent, ainsi que tout fichier `.json` du dossier
         `config/` et tout `.sql`.
      3. En une phrase : ces deux fichiers contenaient de vrais secrets. Que devez-vous faire en plus ?
    en: |
      You take over a badly configured project. `git status` and `git ls-files` show that two sensitive
      files are **already tracked** by Git:

      ```text
      config/credentials.json
      backup/dump.sql
      ```

      The repo has **no** `.gitignore` file yet.

      1. Write the commands that stop tracking these two files **without deleting** them from your disk.
      2. Create a `.gitignore` that prevents them from coming back, plus any `.json` file in the `config/`
         folder and any `.sql` file.
      3. In one sentence: these two files held real secrets. What else must you do?
  solution:
    file: solution.sh
    lang: bash
    code: |
      # 1. Untrack both files, keeping them on disk
      git rm --cached config/credentials.json backup/dump.sql

      # 2. Create the .gitignore
      cat > .gitignore <<'EOF'
      # Secrets and backups must never be tracked
      config/*.json
      *.sql
      EOF

      git add .gitignore
      git commit -m "Untrack secrets and add .gitignore"

      # 3. The secrets are STILL in the history. Rotate (change) them now:
      #    issue new credentials, generate a new database password, and
      #    revoke the old ones. .gitignore does not remove past commits.
    note:
      fr: "`git rm --cached` retire les fichiers de l'index sans les effacer du disque. Point clé de la question 3 : comme les secrets ont déjà été commités, ils restent dans l'historique ; il faut les **révoquer et les régénérer**, puis éventuellement nettoyer l'historique."
      en: "`git rm --cached` removes the files from the index without deleting them from disk. Key point of question 3: because the secrets were already committed, they remain in the history; you must **revoke and regenerate** them, then optionally clean the history."

quiz:
  - q:
      fr: "Sur quels fichiers un `.gitignore` agit-il ?"
      en: "Which files does a `.gitignore` act on?"
    options:
      fr:
        - "Uniquement les fichiers déjà suivis par Git"
        - "Uniquement les fichiers non suivis (untracked)"
        - "Tous les fichiers, suivis ou non"
        - "Uniquement les fichiers du dernier commit"
      en:
        - "Only files already tracked by Git"
        - "Only untracked files"
        - "All files, tracked or not"
        - "Only files in the last commit"
    answer: 1
    why:
      fr: "`.gitignore` empêche d'ajouter des fichiers *non suivis*. Un fichier déjà suivi continue de l'être tant qu'on ne le retire pas avec `git rm --cached`."
      en: "`.gitignore` prevents *untracked* files from being added. A file that is already tracked stays tracked until you remove it with `git rm --cached`."
  - q:
      fr: "Quelle commande arrête le suivi d'un fichier sans l'effacer de votre disque ?"
      en: "Which command stops tracking a file without deleting it from your disk?"
    options:
      fr:
        - "`git rm --cached .env`"
        - "`git rm .env`"
        - "`rm .env`"
        - "`git checkout .env`"
      en:
        - "`git rm --cached .env`"
        - "`git rm .env`"
        - "`rm .env`"
        - "`git checkout .env`"
    answer: 0
    why:
      fr: "`--cached` retire le fichier de l'index Git seulement ; sans ce drapeau, `git rm` supprimerait aussi le fichier local."
      en: "`--cached` removes the file from the Git index only; without that flag, `git rm` would also delete the local file."
  - q:
      fr: "Vous ajoutez `.env` à `.gitignore` après l'avoir commité. Que se passe-t-il pour le secret déjà commité ?"
      en: "You add `.env` to `.gitignore` after committing it. What happens to the already-committed secret?"
    options:
      fr:
        - "Il est automatiquement supprimé de tout l'historique"
        - "Il est chiffré par Git"
        - "Il reste présent dans les commits passés"
        - "Il devient invisible pour quiconque clone le dépôt"
      en:
        - "It is automatically removed from the whole history"
        - "It gets encrypted by Git"
        - "It stays present in the past commits"
        - "It becomes invisible to anyone cloning the repo"
    answer: 2
    why:
      fr: "`.gitignore` ne réécrit pas l'historique. Le secret reste lisible dans les anciens commits : il faut le révoquer et, si besoin, nettoyer l'historique."
      en: "`.gitignore` does not rewrite history. The secret stays readable in the old commits: you must rotate it and, if needed, clean the history."
  - q:
      fr: "À quoi sert une ligne `!.env.example` dans un `.gitignore` ?"
      en: "What is a `!.env.example` line in a `.gitignore` for?"
    options:
      fr:
        - "À supprimer le fichier `.env.example`"
        - "À faire une exception : ce fichier n'est PAS ignoré"
        - "À chiffrer le fichier modèle"
        - "À ignorer tous les fichiers sauf celui-ci"
      en:
        - "To delete the `.env.example` file"
        - "To make an exception: this file is NOT ignored"
        - "To encrypt the template file"
        - "To ignore every file except this one"
    answer: 1
    why:
      fr: "Le préfixe `!` ré-inclut un fichier qui serait sinon ignoré. On s'en sert pour committer le modèle `.env.example` tout en ignorant les vrais `.env`."
      en: "The `!` prefix re-includes a file that would otherwise be ignored. It is used to commit the `.env.example` template while still ignoring the real `.env` files."
  - q:
      fr: "Que doit-on committer à la place d'un vrai fichier `.env` ?"
      en: "What should you commit instead of a real `.env` file?"
    options:
      fr:
        - "Le `.env` chiffré avec un mot de passe"
        - "Rien du tout, jamais aucune documentation des variables"
        - "Le vrai `.env`, mais dans un dossier caché"
        - "Un `.env.example` avec uniquement des valeurs factices"
      en:
        - "The `.env` encrypted with a password"
        - "Nothing at all, never any documentation of the variables"
        - "The real `.env`, but in a hidden folder"
        - "An `.env.example` with fake values only"
    answer: 3
    why:
      fr: "Le modèle documente les noms de variables attendus sans exposer de secret ; chacun le copie en `.env` et le remplit localement."
      en: "The template documents the expected variable names without exposing any secret; each person copies it to `.env` and fills it in locally."
