description:
  fr: "Finaliser le projet : un README professionnel avec badges, tableau des contrôles de sécurité et guide de test, puis comment présenter ce projet dans un portfolio."
  en: "Finalise the project: a professional README with badges, a security controls table and a testing guide, then how to present this project in a portfolio."
duration: 20

intro:
  fr: |
    Le code est écrit, l'image est durcie, le pipeline tourne. Il reste l'étape que beaucoup négligent et
    qui fait pourtant toute la différence en entretien : la **livraison**. Un recruteur passe souvent
    moins d'une minute sur un dépôt. Ce qu'il lit en premier, c'est le **README**.

    Un bon README raconte en quelques secondes : *ce que fait le projet*, *comment le lancer*, et surtout
    *quels contrôles de sécurité* il met en œuvre. Les badges verts en haut de page prouvent que le
    pipeline passe.

    Analogie : vous avez cuisiné un excellent plat (le code) ; le README, c'est le **menu et le dressage
    de l'assiette**. Dans cette dernière leçon, on écrit le README complet et on apprend à mettre ce
    projet en valeur dans un portfolio.
  en: |
    The code is written, the image is hardened, the pipeline runs. One step remains that many neglect and
    that makes all the difference in an interview: **delivery**. A recruiter often spends less than a
    minute on a repository. What they read first is the **README**.

    A good README tells, in seconds: *what the project does*, *how to run it*, and above all *which
    security controls* it implements. The green badges at the top prove the pipeline passes.

    Analogy: you cooked an excellent dish (the code); the README is the **menu and the plating**. In this
    final lesson we write the complete README and learn how to showcase this project in a portfolio.

sections:
  - heading:
      fr: "L'anatomie d'un bon README"
      en: "The anatomy of a good README"
    body:
      fr: |
        Un README de projet DevSecOps professionnel contient, dans l'ordre :

        1. **Titre + badges** : nom, build status, licence.
        2. **Description** : une phrase claire sur ce que fait le projet.
        3. **Architecture** : un schéma simple (ici en texte) du flux.
        4. **Prérequis** : ce qu'il faut installer.
        5. **Démarrage rapide** (*quick start*) : les commandes pour lancer l'app en local et avec Docker.
        6. **Contrôles de sécurité** : un **tableau** listant chaque outil et ce qu'il protège. C'est la
           section qui fait la différence pour un poste DevSecOps.
        7. **Comment tester** : lancer les tests et consulter le pipeline.
        8. **Licence**.
      en: |
        A professional DevSecOps project README contains, in order:

        1. **Title + badges**: name, build status, licence.
        2. **Description**: a clear sentence about what the project does.
        3. **Architecture**: a simple diagram (here in text) of the flow.
        4. **Prerequisites**: what to install.
        5. **Quick start**: the commands to run the app locally and with Docker.
        6. **Security controls**: a **table** listing each tool and what it protects. This is the section
           that makes the difference for a DevSecOps role.
        7. **How to test**: run the tests and view the pipeline.
        8. **Licence**.
  - heading:
      fr: "Les badges : une preuve visuelle"
      en: "Badges: visual proof"
    body:
      fr: |
        Un **badge** est une petite image dynamique en haut du README. Le badge de build (fourni par
        GitHub Actions) affiche `passing` en vert quand le pipeline réussit, `failing` en rouge sinon.

        Sa syntaxe est un simple lien Markdown vers une image :

        ```markdown
        ![CI](https://github.com/OWNER/REPO/actions/workflows/ci.yml/badge.svg)
        ```

        Remplacez `OWNER/REPO` par votre identifiant et le nom de votre dépôt. Un badge vert prouve, sans
        que le recruteur ait à lire une ligne de code, que vos tests et vos contrôles de sécurité passent.
      en: |
        A **badge** is a small dynamic image at the top of the README. The build badge (provided by GitHub
        Actions) shows `passing` in green when the pipeline succeeds, `failing` in red otherwise.

        Its syntax is a simple Markdown link to an image:

        ```markdown
        ![CI](https://github.com/OWNER/REPO/actions/workflows/ci.yml/badge.svg)
        ```

        Replace `OWNER/REPO` with your handle and repository name. A green badge proves, without the
        recruiter reading a single line of code, that your tests and security controls pass.
  - heading:
      fr: "Présenter le projet dans un portfolio"
      en: "Presenting the project in a portfolio"
    body:
      fr: |
        Un projet n'a de valeur que s'il est **trouvé et compris**. Pour le mettre en avant :

        - **Épinglez** le dépôt sur votre profil GitHub et soignez la description courte.
        - Dans votre **CV**, décrivez-le par l'impact : *« API Python livrée via un pipeline CI/CD
          intégrant SAST, SCA, scan de secrets, scan d'image et DAST, avec image signée et SBOM »*.
        - Préparez un **récit de 2 minutes** pour l'entretien : le problème (livrer vite ET sûrement),
          votre solution (les portes du pipeline), un détail technique que vous maîtrisez (ex. : signature
          keyless cosign).
        - Montrez que vous **comprenez les compromis** : pourquoi `--ignore-unfixed`, pourquoi faire
          échouer le build, pourquoi un utilisateur non-root.
      en: |
        A project only has value if it is **found and understood**. To showcase it:

        - **Pin** the repository on your GitHub profile and polish the short description.
        - In your **résumé**, describe it by impact: *"Python API delivered through a CI/CD pipeline with
          SAST, SCA, secret scanning, image scanning and DAST, with a signed image and an SBOM"*.
        - Prepare a **2-minute story** for the interview: the problem (ship fast AND safely), your
          solution (the pipeline gates), one technical detail you master (e.g. cosign keyless signing).
        - Show that you **understand the trade-offs**: why `--ignore-unfixed`, why fail the build, why a
          non-root user.

examples:
  - title:
      fr: "Le README.md complet du projet"
      en: "The project's complete README.md"
    file: README.md
    lang: markdown
    kind: secure
    code: |
      # flask-secure-api

      ![CI](https://github.com/OWNER/flask-secure-api/actions/workflows/ci.yml/badge.svg)
      ![License](https://img.shields.io/badge/license-MIT-green)

      A small Flask REST API shipped through a **100% secure CI/CD pipeline**:
      SAST, SCA, secret scanning, a hardened Docker image, image scanning and DAST,
      with a signed image and an SBOM published to GHCR.

      ## Architecture

      ```text
      git push ─► GitHub Actions ─► [lint+tests] [gitleaks] [bandit+semgrep] [pip-audit]
                                            │
                                            ▼
                                    [docker build ─► Trivy ─► ZAP]
                                            │ (main only)
                                            ▼
                              build+push ─► SBOM ─► cosign sign ─► GHCR
      ```

      ## Prerequisites

      - Python 3.12+
      - Docker
      - Git and a GitHub account

      ## Quick start

      ```bash
      # Local run
      python -m venv .venv && source .venv/bin/activate
      pip install -r requirements-dev.txt
      export SECRET_KEY=local-dev-secret
      gunicorn --bind 127.0.0.1:8000 wsgi:app

      # Or with Docker
      docker build -t flask-secure-api:dev .
      docker run -d -p 8000:8000 -e SECRET_KEY=local-dev-secret flask-secure-api:dev

      # Try it
      curl -s http://localhost:8000/health
      curl -s -X POST http://localhost:8000/api/items \
        -H "Content-Type: application/json" -d '{"name":"laptop"}'
      ```

      ## Security controls

      | Stage | Tool | Protects against |
      |-------|------|------------------|
      | Secrets | Gitleaks | Hard-coded secrets in Git history |
      | SAST | Bandit, Semgrep | Injection and dangerous code patterns |
      | SCA | pip-audit | Dependencies with known CVEs |
      | Image | Trivy | Vulnerable OS/Python packages |
      | DAST | OWASP ZAP | Missing security headers on the running API |
      | Supply chain | SBOM + cosign | Tampered or untraceable images |

      Application-level: environment-based config, parameterized SQL,
      input validation, security headers, non-root container.

      ## How to test

      ```bash
      pytest -q          # functional + security tests
      ruff check .       # lint
      ```

      The full pipeline runs automatically on every push and pull request.

      ## License

      MIT
    note:
      fr: "Remplacez `OWNER` par votre identifiant GitHub. Le tableau des contrôles de sécurité est la section la plus importante pour un poste DevSecOps : elle résume toute la valeur du projet."
      en: "Replace `OWNER` with your GitHub handle. The security controls table is the most important section for a DevSecOps role: it summarises the whole value of the project."

  - title:
      fr: "Vérifier la signature de l'image publiée"
      en: "Verifying the published image's signature"
    file: verify.sh
    lang: bash
    kind: secure
    code: |
      # Anyone can verify the image was signed by THIS repository's pipeline,
      # thanks to keyless (OIDC) signing. No public key to distribute.
      cosign verify \
        --certificate-identity-regexp "https://github.com/OWNER/flask-secure-api/.*" \
        --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
        ghcr.io/OWNER/flask-secure-api:latest
    output: |
      Verification for ghcr.io/OWNER/flask-secure-api:latest --
      The following checks were performed on the signature:
        - The cosign claims were validated
        - The identity matched the specified regex
    note:
      fr: "Cette commande prouve que l'image provient bien de votre pipeline et n'a pas été altérée. L'identité est liée au dépôt GitHub, sans aucune clé à partager."
      en: "This command proves the image really comes from your pipeline and was not tampered with. The identity is tied to the GitHub repository, with no key to share."

  - title:
      fr: "Résumé du projet pour le CV (format orienté impact)"
      en: "Project summary for the résumé (impact-oriented)"
    file: cv-entry.txt
    lang: text
    kind: neutral
    code: |
      flask-secure-api — Secure CI/CD pipeline for a Python API
      - Built a Flask REST API (app factory, parameterized SQL, input
        validation, HTTP security headers) with pytest covering functional
        and security behaviour.
      - Hardened the delivery: multi-stage non-root Docker image, Trivy image
        scanning (fail on fixable HIGH/CRITICAL), .dockerignore.
      - Designed a GitHub Actions pipeline with least-privilege permissions:
        Gitleaks, Bandit, Semgrep, pip-audit, ZAP baseline DAST.
      - Published a signed (cosign keyless) image and a CycloneDX SBOM to GHCR.
      Tech: Python, Flask, Docker, GitHub Actions, Trivy, OWASP ZAP, cosign.
    note:
      fr: "Chaque ligne commence par un verbe d'action et cite des outils concrets. C'est ce vocabulaire précis qui passe les filtres ATS et accroche un recruteur technique."
      en: "Each line starts with an action verb and names concrete tools. This precise vocabulary is what passes ATS filters and catches a technical recruiter's eye."

mistake:
  fr: |
    **Un README vide ou réduit à « projet Flask ».**

    Sans démarrage rapide, sans tableau des contrôles de sécurité, le recruteur ne voit qu'un énième
    projet CRUD et passe au suivant. À l'inverse, inutile d'écrire un roman : un README trop long noie
    l'information. Visez une page claire, avec le tableau des contrôles de sécurité bien visible — c'est
    lui qui démontre la compétence DevSecOps.
  en: |
    **An empty README, or one reduced to "Flask project".**

    Without a quick start, without a security controls table, the recruiter sees just another CRUD project
    and moves on. Conversely, no need to write a novel: an overly long README buries the information. Aim
    for one clear page, with the security controls table clearly visible — that is what demonstrates the
    DevSecOps skill.

bestPractice:
  fr: |
    - **README en une page** : description, architecture, quick start, contrôles de sécurité, tests, licence.
    - **Badge de build** en haut : preuve visuelle que le pipeline passe.
    - **Tableau des contrôles de sécurité** : la section clé pour un poste DevSecOps.
    - **Commandes copiables** et testées, pas de pseudo-code.
    - **Épingler le dépôt** et préparer un récit de 2 minutes orienté problème/solution/compromis.
    - **Licence explicite** (ex. MIT) pour que le projet soit réutilisable.
  en: |
    - **One-page README**: description, architecture, quick start, security controls, tests, licence.
    - **Build badge** at the top: visual proof the pipeline passes.
    - **Security controls table**: the key section for a DevSecOps role.
    - **Copy-pasteable, tested commands**, no pseudo-code.
    - **Pin the repository** and prepare a 2-minute story: problem/solution/trade-offs.
    - **Explicit licence** (e.g. MIT) so the project is reusable.

exercise:
  statement:
    fr: |
      Ajoutez à votre README une section **« Threat model »** (modèle de menace) courte qui, sous forme de
      tableau, relie **trois** menaces concrètes à la **parade** mise en place dans ce projet.

      Choisissez par exemple : injection SQL, secret poussé dans Git, image de conteneur vulnérable.
      Pour chacune, indiquez le contrôle du projet qui la traite.
    en: |
      Add to your README a short **"Threat model"** section that, as a table, links **three** concrete
      threats to the **defense** implemented in this project.

      Choose, for example: SQL injection, a secret pushed into Git, a vulnerable container image. For each
      one, state the project control that addresses it.
  solution:
    file: threat-model.md
    lang: markdown
    code: |
      ## Threat model

      | Threat | Defense in this project |
      |--------|-------------------------|
      | SQL injection (OWASP A03) | Parameterized queries (`?`) + input validation |
      | Secret leaked into Git | Gitleaks in CI + pre-commit + `.gitignore` |
      | Vulnerable container image | Multi-stage slim image, non-root, Trivy gate |
      | Tampered image in registry | cosign keyless signature + SBOM |
      | Missing security headers | `after_request` headers + ZAP baseline DAST |
    note:
      fr: "Relier chaque menace à sa parade prouve que vous ne collez pas des outils au hasard : vous répondez à des risques précis. C'est exactement le raisonnement attendu en entretien DevSecOps."
      en: "Linking each threat to its defense proves you are not bolting on tools at random: you address specific risks. This is exactly the reasoning expected in a DevSecOps interview."

quiz:
  - q:
      fr: "Quelle section d'un README fait le plus la différence pour un poste DevSecOps ?"
      en: "Which README section makes the biggest difference for a DevSecOps role?"
    options:
      fr:
        - "La liste des contributeurs"
        - "Le tableau des contrôles de sécurité"
        - "L'historique des versions"
        - "La taille du dépôt"
      en:
        - "The list of contributors"
        - "The security controls table"
        - "The version history"
        - "The repository size"
    answer: 1
    why:
      fr: "Le tableau résume quels outils protègent contre quoi : c'est la preuve directe de la compétence DevSecOps."
      en: "The table summarises which tools protect against what: it is direct proof of the DevSecOps skill."
  - q:
      fr: "À quoi sert le badge de build en haut du README ?"
      en: "What is the build badge at the top of the README for?"
    options:
      fr:
        - "À prouver visuellement que le pipeline passe (tests et contrôles de sécurité)"
        - "À afficher le nombre d'étoiles"
        - "À lancer le déploiement"
        - "À signer l'image"
      en:
        - "To visually prove the pipeline passes (tests and security checks)"
        - "To show the number of stars"
        - "To trigger deployment"
        - "To sign the image"
    answer: 0
    why:
      fr: "Le badge passe au vert quand le pipeline réussit : une preuve immédiate, sans lire le code."
      en: "The badge turns green when the pipeline succeeds: immediate proof, without reading the code."
  - q:
      fr: "Grâce à la signature keyless (OIDC), que faut-il distribuer pour vérifier l'image ?"
      en: "Thanks to keyless (OIDC) signing, what must be distributed to verify the image?"
    options:
      fr:
        - "Une clé publique à partager avec chaque utilisateur"
        - "Rien : l'identité est liée au dépôt GitHub via l'émetteur OIDC"
        - "Un mot de passe GHCR"
        - "Le SBOM complet"
      en:
        - "A public key to share with every user"
        - "Nothing: the identity is tied to the GitHub repository via the OIDC issuer"
        - "A GHCR password"
        - "The full SBOM"
    answer: 1
    why:
      fr: "La signature keyless n'utilise pas de clé stockée : `cosign verify` vérifie l'identité du dépôt et l'émetteur OIDC."
      en: "Keyless signing uses no stored key: `cosign verify` checks the repository identity and the OIDC issuer."
  - q:
      fr: "Comment décrire ce projet dans un CV pour maximiser l'impact ?"
      en: "How should this project be described in a résumé to maximise impact?"
    options:
      fr:
        - "En listant seulement « Python, Flask »"
        - "En copiant le code source"
        - "En mentionnant uniquement le nombre de lignes"
        - "Avec des verbes d'action et les outils de sécurité concrets mis en œuvre"
      en:
        - "By listing only \"Python, Flask\""
        - "By copying the source code"
        - "By mentioning only the number of lines"
        - "With action verbs and the concrete security tools implemented"
    answer: 3
    why:
      fr: "Un recruteur et les filtres ATS repèrent des verbes d'action et des outils précis (SAST, SCA, Trivy, ZAP, cosign)."
      en: "A recruiter and ATS filters pick up action verbs and specific tools (SAST, SCA, Trivy, ZAP, cosign)."
  - q:
      fr: "Quel est le bon dosage pour un README de portfolio ?"
      en: "What is the right length for a portfolio README?"
    options:
      fr:
        - "Le plus long possible pour tout détailler"
        - "Aucune documentation, le code parle de lui-même"
        - "Une page claire, avec le tableau des contrôles de sécurité bien visible"
        - "Uniquement une capture d'écran"
      en:
        - "As long as possible to detail everything"
        - "No documentation, the code speaks for itself"
        - "One clear page, with the security controls table clearly visible"
        - "Only a screenshot"
    answer: 2
    why:
      fr: "Trop court, on ne comprend rien ; trop long, l'information se noie. Une page claire et structurée est l'idéal."
      en: "Too short and nothing is clear; too long and the information drowns. One clear, structured page is ideal."
