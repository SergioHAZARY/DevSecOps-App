description:
  fr: "Poser les fondations du projet : objectif, architecture, arborescence du dépôt, prérequis et fichiers de base d'une API Flask sécurisée."
  en: "Lay the foundations of the project: goal, architecture, repository tree, prerequisites and the base files of a secure Flask API."
duration: 20

intro:
  fr: |
    Bienvenue dans le **premier projet de portfolio**. Vous allez construire, étape par étape, un dépôt
    complet : une petite **API Flask** (un mini-serveur web en Python), ses tests, son image Docker et
    surtout un **pipeline CI/CD 100 % sécurisé** qui vérifie le code à chaque `git push`.

    À la fin des 5 leçons, vous aurez un dépôt que vous pourrez publier sur GitHub et montrer en entretien :
    chaque fichier sera réel, commenté et cohérent avec les autres.

    Pensez à ce projet comme à une **recette de cuisine** : cette première leçon dresse la liste des
    ingrédients (les fichiers) et le plan du plat (l'architecture). Les leçons suivantes cuisinent chaque
    partie. Aujourd'hui, pas encore de code applicatif : on met en place la **structure** du dépôt, on
    comprend l'objectif et on prépare l'environnement.
  en: |
    Welcome to the **first portfolio project**. You will build, step by step, a complete repository:
    a small **Flask API** (a mini web server in Python), its tests, its Docker image and above all a
    **100% secure CI/CD pipeline** that checks the code on every `git push`.

    By the end of the 5 lessons you will have a repository you can publish on GitHub and show in an
    interview: every file will be real, commented and consistent with the others.

    Think of this project like a **cooking recipe**: this first lesson lists the ingredients (the files)
    and the plan of the dish (the architecture). The following lessons cook each part. Today there is no
    application code yet: we set up the repository **structure**, understand the goal and prepare the
    environment.

sections:
  - heading:
      fr: "Ce que l'on construit et pourquoi"
      en: "What we build and why"
    body:
      fr: |
        L'application est volontairement **petite** : une API qui gère une liste d'« items » (des objets
        avec un `id` et un `name`). Ce qui compte, ce n'est pas la complexité fonctionnelle, mais la
        **chaîne de sécurité** qui l'entoure. Un recruteur regarde surtout *comment* vous livrez, pas la
        taille de l'application.

        Le pipeline vérifiera, à chaque modification :

        | Contrôle | Outil | Ce qu'il empêche |
        |---|---|---|
        | Secrets en clair | Gitleaks | Une clé d'API poussée dans Git |
        | Analyse statique (SAST) | Bandit, Semgrep | Injection SQL, code dangereux |
        | Dépendances vulnérables (SCA) | pip-audit | Une lib avec une CVE connue |
        | Image Docker | Trivy | Une image avec des paquets vulnérables |
        | Test dynamique (DAST) | OWASP ZAP | En-têtes de sécurité manquants |

        Chaque contrôle **fait échouer le pipeline** s'il trouve un problème grave : le code vulnérable ne
        peut pas être fusionné.
      en: |
        The application is deliberately **small**: an API that manages a list of "items" (objects with an
        `id` and a `name`). What matters is not functional complexity but the **security chain** around it.
        A recruiter mostly looks at *how* you ship, not at the size of the application.

        On every change, the pipeline will check:

        | Control | Tool | What it prevents |
        |---|---|---|
        | Clear-text secrets | Gitleaks | An API key pushed into Git |
        | Static analysis (SAST) | Bandit, Semgrep | SQL injection, dangerous code |
        | Vulnerable dependencies (SCA) | pip-audit | A library with a known CVE |
        | Docker image | Trivy | An image with vulnerable packages |
        | Dynamic test (DAST) | OWASP ZAP | Missing security headers |

        Each control **fails the pipeline** if it finds a serious issue: vulnerable code cannot be merged.
  - heading:
      fr: "L'arborescence du dépôt"
      en: "The repository tree"
    body:
      fr: |
        Un dépôt bien rangé est le premier signe de professionnalisme. Le code applicatif vit dans le
        paquet `app/`, les tests dans `tests/`, et tout ce qui concerne la sécurité et l'automatisation
        est à la racine ou dans `.github/`.

        Cette séparation a une raison **de sécurité** : le `.dockerignore` et le `.gitignore` pourront
        exclure proprement les tests, les secrets locaux et les caches de l'image et du dépôt. On ne
        livre que `app/` et le strict nécessaire.
      en: |
        A tidy repository is the first sign of professionalism. Application code lives in the `app/`
        package, tests in `tests/`, and everything about security and automation sits at the root or in
        `.github/`.

        This separation has a **security** reason: `.dockerignore` and `.gitignore` can cleanly exclude
        tests, local secrets and caches from the image and the repository. We ship only `app/` and the
        bare minimum.
  - heading:
      fr: "Préparer l'environnement"
      en: "Preparing the environment"
    body:
      fr: |
        Avant de coder, installez les prérequis :

        - **Python 3.12+** et le module `venv` (environnement virtuel isolé).
        - **Docker** (pour construire l'image en leçon 3).
        - **Git** et un compte **GitHub** (le pipeline tourne sur GitHub Actions).

        La règle d'or : on **n'installe jamais** les dépendances d'un projet directement sur le système.
        On crée un environnement virtuel (`python -m venv .venv`) pour que chaque projet ait ses propres
        bibliothèques, avec des **versions figées** dans `requirements.txt`. Figer les versions est une
        mesure de sécurité : on sait exactement ce que l'on exécute, et pip-audit peut vérifier chaque version.
      en: |
        Before coding, install the prerequisites:

        - **Python 3.12+** and the `venv` module (isolated virtual environment).
        - **Docker** (to build the image in lesson 3).
        - **Git** and a **GitHub** account (the pipeline runs on GitHub Actions).

        The golden rule: **never** install a project's dependencies directly on the system. Create a
        virtual environment (`python -m venv .venv`) so each project has its own libraries, with
        **pinned versions** in `requirements.txt`. Pinning versions is a security measure: you know
        exactly what you run, and pip-audit can check each version.

examples:
  - title:
      fr: "L'arborescence cible du projet"
      en: "The target project tree"
    file: tree.txt
    lang: text
    kind: neutral
    code: |
      flask-secure-api/
      ├── app/
      │   ├── __init__.py          # app factory: create_app()
      │   ├── config.py            # configuration read from the environment
      │   ├── db.py                # SQLite access, parameterized queries
      │   └── routes.py            # endpoints + input validation
      ├── tests/
      │   └── test_api.py          # pytest: functional + security tests
      ├── wsgi.py                  # production entrypoint (gunicorn wsgi:app)
      ├── requirements.txt         # runtime deps, PINNED versions
      ├── requirements-dev.txt     # dev/test/security deps, pinned
      ├── Dockerfile               # hardened multi-stage, non-root
      ├── .dockerignore            # keep tests/secrets out of the image
      ├── .gitignore               # keep secrets/venv out of Git
      ├── .gitleaks.toml           # secret-scanning rules
      ├── .pre-commit-config.yaml  # local checks before each commit
      ├── .github/
      │   └── workflows/
      │       └── ci.yml           # the secure CI/CD pipeline
      └── README.md                # documentation + security controls table
    note:
      fr: "Gardez cette arborescence sous les yeux : chaque leçon remplit une partie. Les noms de fichiers ne changeront plus, pour rester cohérents d'une leçon à l'autre."
      en: "Keep this tree in sight: each lesson fills in one part. File names will not change, to stay consistent from one lesson to the next."

  - title:
      fr: "requirements.txt : des versions figées (reproductible et auditable)"
      en: "requirements.txt: pinned versions (reproducible and auditable)"
    file: requirements.txt
    lang: text
    kind: secure
    code: |
      # Runtime dependencies ONLY. Every version is pinned with == so that
      # the build is reproducible and pip-audit can check each exact version.
      Flask==3.1.0
      gunicorn==23.0.0
    note:
      fr: "On ne met ici que ce qui tourne en production (Flask et le serveur gunicorn). Les outils de test et de sécurité iront dans `requirements-dev.txt` pour ne pas alourdir ni exposer l'image finale."
      en: "Here we keep only what runs in production (Flask and the gunicorn server). Test and security tools go in `requirements-dev.txt` to avoid bloating or exposing the final image."

  - title:
      fr: "requirements-dev.txt : outils de test et de sécurité"
      en: "requirements-dev.txt: test and security tools"
    file: requirements-dev.txt
    lang: text
    kind: secure
    code: |
      # Dev-only dependencies: tests and security scanners.
      # "-r requirements.txt" pulls in the runtime deps too.
      -r requirements.txt
      pytest==8.3.4
      ruff==0.8.4
      bandit==1.8.0
      pip-audit==2.7.3
    note:
      fr: "Séparer dev et runtime est une bonne pratique de sécurité : l'image de production n'embarque jamais pytest, ruff ou bandit, donc moins de code et moins de surface d'attaque."
      en: "Separating dev and runtime is a security best practice: the production image never ships pytest, ruff or bandit, so less code and a smaller attack surface."

  - title:
      fr: ".gitignore : empêcher secrets et caches d'entrer dans Git"
      en: ".gitignore: keep secrets and caches out of Git"
    file: .gitignore
    lang: text
    kind: secure
    code: |
      # Virtual environment and Python caches
      .venv/
      __pycache__/
      *.pyc
      .pytest_cache/

      # Local secrets and database must NEVER be committed
      .env
      *.db

      # Build artifacts
      sbom.cdx.json
    note:
      fr: "La première ligne de défense contre une fuite de secret, c'est de ne jamais le versionner. Un fichier `.env` (mots de passe, clés) et la base locale `*.db` sont exclus dès le départ."
      en: "The first line of defense against a secret leak is never to version it. A `.env` file (passwords, keys) and the local `*.db` database are excluded from the start."

mistake:
  fr: |
    **Commencer par coder, et ranger (ou sécuriser) « plus tard ».**

    Sans `.gitignore` dès le premier commit, un fichier `.env` ou une base `items.db` contenant des
    données peut partir dans l'historique Git. Même supprimé ensuite, il reste récupérable dans
    l'historique. On met donc en place `.gitignore` et la structure **avant** d'écrire la moindre ligne
    d'application.
  en: |
    **Start by coding and tidy up (or secure) "later".**

    Without a `.gitignore` from the very first commit, a `.env` file or an `items.db` database with data
    can end up in Git history. Even if deleted afterwards, it stays recoverable in history. So we put the
    `.gitignore` and the structure in place **before** writing a single line of application code.

bestPractice:
  fr: |
    - **Figer toutes les versions** (`==`) : builds reproductibles et audit fiable.
    - **Séparer runtime et dev** : l'image de production reste minimale.
    - **`.gitignore` et `.dockerignore` dès le début** : secrets et caches hors du dépôt et de l'image.
    - **Un commit initial propre** : structure vide mais complète, puis on remplit fichier par fichier.
    - **Un README qui grandit avec le projet** : on le finalise en leçon 5, mais on crée le fichier tout de suite.
  en: |
    - **Pin every version** (`==`): reproducible builds and reliable auditing.
    - **Separate runtime and dev**: the production image stays minimal.
    - **`.gitignore` and `.dockerignore` from the start**: secrets and caches out of the repo and image.
    - **A clean initial commit**: empty but complete structure, then fill it file by file.
    - **A README that grows with the project**: finalised in lesson 5, but create the file right away.

exercise:
  statement:
    fr: |
      Initialisez le dépôt sur votre machine. Écrivez une suite de commandes shell qui :

      1. crée le dossier `flask-secure-api` et y entre ;
      2. initialise Git ;
      3. crée l'arborescence des dossiers (`app/`, `tests/`, `.github/workflows/`) ;
      4. crée un environnement virtuel Python et l'active.

      Bonus : ajoutez le fichier `.gitignore` de la leçon avant le premier commit.
    en: |
      Initialise the repository on your machine. Write a sequence of shell commands that:

      1. creates the `flask-secure-api` folder and enters it;
      2. initialises Git;
      3. creates the folder tree (`app/`, `tests/`, `.github/workflows/`);
      4. creates a Python virtual environment and activates it.

      Bonus: add the lesson's `.gitignore` file before the first commit.
  solution:
    file: setup.sh
    lang: bash
    code: |
      # 1. Create and enter the project folder
      mkdir flask-secure-api && cd flask-secure-api

      # 2. Initialise Git
      git init

      # 3. Create the folder structure
      mkdir -p app tests .github/workflows

      # 4. Create and activate a virtual environment (Linux/macOS)
      python -m venv .venv
      source .venv/bin/activate
      # On Windows PowerShell instead:  .venv\Scripts\Activate.ps1

      # Bonus: a .gitignore BEFORE the first commit protects secrets from day one
      cat > .gitignore <<'EOF'
      .venv/
      __pycache__/
      *.pyc
      .pytest_cache/
      .env
      *.db
      sbom.cdx.json
      EOF

      git add .gitignore
      git commit -m "chore: initial structure with gitignore"
    note:
      fr: "Créer `.gitignore` avant le premier `git add .` évite d'ajouter par erreur un secret local. L'environnement virtuel `.venv/` est ignoré : il ne doit jamais partir dans Git."
      en: "Creating `.gitignore` before the first `git add .` avoids accidentally adding a local secret. The `.venv/` virtual environment is ignored: it must never go into Git."

quiz:
  - q:
      fr: "Pourquoi fige-t-on les versions des dépendances avec `==` ?"
      en: "Why do we pin dependency versions with `==`?"
    options:
      fr:
        - "Pour que le build soit reproductible et que pip-audit vérifie chaque version exacte"
        - "Pour télécharger les paquets plus vite"
        - "Parce que pip refuse les versions non figées"
        - "Pour réduire la taille du code source"
      en:
        - "So the build is reproducible and pip-audit can check each exact version"
        - "To download packages faster"
        - "Because pip refuses unpinned versions"
        - "To reduce the size of the source code"
    answer: 0
    why:
      fr: "Des versions figées garantissent que l'on exécute toujours le même code, et permettent un audit de sécurité fiable (SCA)."
      en: "Pinned versions guarantee you always run the same code, and enable reliable security auditing (SCA)."
  - q:
      fr: "Pourquoi séparer `requirements.txt` et `requirements-dev.txt` ?"
      en: "Why separate `requirements.txt` and `requirements-dev.txt`?"
    options:
      fr:
        - "C'est obligatoire pour Flask"
        - "Pour que l'image de production n'embarque pas les outils de test et reste minimale"
        - "Pour accélérer les tests"
        - "Pour pouvoir utiliser deux versions de Python"
      en:
        - "It is mandatory for Flask"
        - "So the production image does not ship test tools and stays minimal"
        - "To speed up the tests"
        - "To be able to use two versions of Python"
    answer: 1
    why:
      fr: "Moins de code dans l'image de production, c'est une surface d'attaque plus petite : pytest ou bandit n'ont rien à y faire."
      en: "Less code in the production image means a smaller attack surface: pytest or bandit have no place there."
  - q:
      fr: "Quel fichier empêche un secret local de partir dans l'historique Git ?"
      en: "Which file prevents a local secret from ending up in Git history?"
    options:
      fr:
        - "requirements.txt"
        - "wsgi.py"
        - ".gitignore"
        - "Dockerfile"
      en:
        - "requirements.txt"
        - "wsgi.py"
        - ".gitignore"
        - "Dockerfile"
    answer: 2
    why:
      fr: "`.gitignore` exclut `.env`, `*.db` et les caches : ils ne sont jamais ajoutés au dépôt."
      en: "`.gitignore` excludes `.env`, `*.db` and caches: they are never added to the repository."
  - q:
      fr: "Dans ce projet, où vit le code applicatif de l'API ?"
      en: "In this project, where does the API's application code live?"
    options:
      fr:
        - "Dans le dossier `tests/`"
        - "Dans le paquet `app/`"
        - "À la racine, dans `ci.yml`"
        - "Dans `.github/workflows/`"
      en:
        - "In the `tests/` folder"
        - "In the `app/` package"
        - "At the root, in `ci.yml`"
        - "In `.github/workflows/`"
    answer: 1
    why:
      fr: "Le code de l'API est regroupé dans `app/` ; `tests/` contient les tests et `.github/workflows/` le pipeline."
      en: "The API code is grouped in `app/`; `tests/` holds the tests and `.github/workflows/` the pipeline."
  - q:
      fr: "Quel est l'objectif principal de ce projet de portfolio ?"
      en: "What is the main goal of this portfolio project?"
    options:
      fr:
        - "Montrer une application fonctionnellement complexe"
        - "Battre un record de performance"
        - "Démontrer une chaîne de livraison sécurisée et automatisée"
        - "Utiliser le plus d'outils possible"
      en:
        - "Show a functionally complex application"
        - "Beat a performance record"
        - "Demonstrate a secure, automated delivery chain"
        - "Use as many tools as possible"
    answer: 2
    why:
      fr: "L'application est volontairement petite ; ce que l'on démontre, c'est la maîtrise du pipeline DevSecOps."
      en: "The application is deliberately small; what we demonstrate is mastery of the DevSecOps pipeline."
