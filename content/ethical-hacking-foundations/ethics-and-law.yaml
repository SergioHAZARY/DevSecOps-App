description:
  fr: "Comprendre le cadre légal et éthique du hacking : autorisation écrite, périmètre, règles d'engagement et divulgation responsable."
  en: "Understand the legal and ethical framework of hacking: written authorisation, scope, rules of engagement and responsible disclosure."
duration: 20

intro:
  fr: |
    Un **hacker éthique** (ou *pentester*, de *penetration tester*) utilise exactement les mêmes techniques
    qu'un attaquant criminel. La seule différence, mais elle est **énorme**, c'est l'**autorisation**.
    Sans un document signé qui vous autorise à tester une cible précise, la même action devient un délit.

    Imaginez un serrurier : avec un contrat du propriétaire, il crochète une porte pour tester la serrure ;
    sans ce contrat, c'est une effraction. Le code est identique, c'est le **papier** qui fait la différence.

    Dans cette leçon, vous allez apprendre ce qu'est une autorisation écrite, comment définir un **périmètre**
    (*scope*), ce que sont les **règles d'engagement**, et comment signaler une faille de façon responsable.
    Règle d'or de tout le module 8 : **ne testez QUE** vos propres systèmes, des cibles d'entraînement prévues
    pour cela (DVWA, OWASP Juice Shop, scanme.nmap.org, HackTheBox, TryHackMe), ou un périmètre pour lequel
    vous avez une **autorisation écrite**. Tester le système d'un tiers sans autorisation est illégal.
  en: |
    An **ethical hacker** (or *pentester*, from *penetration tester*) uses exactly the same techniques as a
    criminal attacker. The only difference, but it is a **huge** one, is **authorisation**. Without a signed
    document allowing you to test a specific target, the very same action becomes a crime.

    Picture a locksmith: with a contract from the owner, picking a lock tests the door; without that contract,
    it is breaking and entering. The action is identical, the **paperwork** is what makes the difference.

    In this lesson you will learn what written authorisation is, how to define a **scope**, what **rules of
    engagement** are, and how to report a flaw responsibly. The golden rule for the whole of Module 8:
    **only test** your own systems, purpose-built practice targets (DVWA, OWASP Juice Shop, scanme.nmap.org,
    HackTheBox, TryHackMe), or a scope you have **written authorisation** for. Testing a third party's system
    without authorisation is illegal.

sections:
  - heading:
      fr: "Autorisation, périmètre et règles d'engagement"
      en: "Authorisation, scope and rules of engagement"
    body:
      fr: |
        Trois documents encadrent une mission légale :

        - **L'autorisation écrite** (*authorization to test*, parfois appelée « get-out-of-jail letter ») :
          signée par une personne qui a réellement le droit d'autoriser le test (le propriétaire du système,
          pas un employé lambda). Elle nomme le testeur, les cibles et la période.
        - **Le périmètre** (*scope*) : la liste **exacte** de ce qui est autorisé (domaines, plages d'IP,
          applications) et surtout ce qui est **hors périmètre** (production critique, données clients réelles).
        - **Les règles d'engagement** (*Rules of Engagement*, RoE) : les horaires autorisés, les techniques
          interdites (par ex. déni de service), les contacts d'urgence, et la conduite à tenir si une donnée
          sensible ou une faille critique est découverte.

        Un seul paquet envoyé vers une IP **hors périmètre** peut transformer une mission légale en infraction.
        Le périmètre n'est pas une formalité : c'est votre protection juridique.
      en: |
        Three documents frame a legal engagement:

        - **Written authorisation** (*authorization to test*, sometimes called a "get-out-of-jail letter"):
          signed by someone who actually has the right to authorise the test (the system owner, not a random
          employee). It names the tester, the targets and the time window.
        - **Scope**: the **exact** list of what is allowed (domains, IP ranges, applications) and, crucially,
          what is **out of scope** (critical production, real customer data).
        - **Rules of Engagement** (RoE): the allowed hours, forbidden techniques (for example denial of
          service), emergency contacts, and what to do if sensitive data or a critical flaw is discovered.

        A single packet sent to an **out-of-scope** IP can turn a legal engagement into an offence. Scope is
        not a formality: it is your legal protection.
  - heading:
      fr: "Les grandes catégories de lois (vue générale)"
      en: "The main categories of law (general overview)"
    body:
      fr: |
        Ceci n'est **pas** un conseil juridique et ne vise aucun pays en particulier : les lois varient.
        Mais presque partout, on retrouve les mêmes **catégories** d'infractions que tout testeur doit connaître :

        | Catégorie | Ce qui est réprimé | Exemple |
        |---|---|---|
        | Accès non autorisé | Entrer dans un système sans droit | Se connecter avec des identifiants trouvés |
        | Atteinte à l'intégrité | Modifier ou détruire des données | Effacer une table, défigurer un site |
        | Interception | Capturer des communications d'autrui | Sniffer le Wi-Fi d'un voisin |
        | Protection des données | Traiter des données personnelles sans base légale | Exfiltrer une base clients |
        | Outils d'attaque | Détenir/diffuser des outils à des fins malveillantes | Vendre un kit de phishing |

        Point clé : **l'intention et l'autorisation** sont souvent ce qui sépare le test légal du délit.
        En cas de doute sur le cadre légal d'une mission réelle, consultez un juriste, pas un forum.
      en: |
        This is **not** legal advice and targets no specific country: laws vary. But almost everywhere the same
        **categories** of offence appear, and every tester must know them:

        | Category | What it punishes | Example |
        |---|---|---|
        | Unauthorised access | Entering a system without the right | Logging in with found credentials |
        | Integrity offences | Altering or destroying data | Dropping a table, defacing a site |
        | Interception | Capturing someone else's communications | Sniffing a neighbour's Wi-Fi |
        | Data protection | Processing personal data without a legal basis | Exfiltrating a customer database |
        | Attack tools | Possessing/distributing tools for malicious use | Selling a phishing kit |

        Key point: **intent and authorisation** are often what separate a legal test from a crime. If you are
        unsure about the legal framing of a real engagement, ask a lawyer, not a forum.
  - heading:
      fr: "La divulgation responsable"
      en: "Responsible disclosure"
    body:
      fr: |
        Vous trouvez une faille dans un produit ou un service (en dehors d'une mission). Que faire ?
        La **divulgation responsable** (*responsible / coordinated disclosure*) est la voie éthique :

        1. **Signalez** la faille en privé à l'éditeur (via un programme *bug bounty*, un fichier
           `security.txt`, ou un contact sécurité).
        2. **Laissez du temps** pour corriger (souvent 90 jours, standard de l'industrie).
        3. **Ne l'exploitez pas** au-delà de la preuve minimale, et ne volez aucune donnée.
        4. **Publiez** les détails seulement après correction, ou de façon coordonnée.

        À l'inverse, la *full disclosure* immédiate expose les utilisateurs avant le correctif. Beaucoup
        d'éditeurs publient un fichier `/.well-known/security.txt` indiquant où envoyer un rapport : c'est le
        premier endroit à regarder.
      en: |
        You find a flaw in a product or service (outside an engagement). What now? **Responsible disclosure**
        (*responsible / coordinated disclosure*) is the ethical path:

        1. **Report** the flaw privately to the vendor (via a *bug bounty* program, a `security.txt` file, or a
           security contact).
        2. **Give time** to fix it (often 90 days, the industry norm).
        3. **Do not exploit** it beyond the minimum proof, and steal no data.
        4. **Publish** details only after a fix, or in a coordinated way.

        By contrast, immediate *full disclosure* exposes users before a patch exists. Many vendors publish a
        `/.well-known/security.txt` file saying where to send a report: that is the first place to look.

examples:
  - title:
      fr: "Un modèle d'autorisation écrite minimale"
      en: "A minimal written authorisation template"
    file: authorization.md
    lang: markdown
    kind: secure
    code: |
      # Authorisation to Perform Security Testing

      Client: Example Corp (owner of the systems below)
      Tester: Jane Doe, ACME Security Ltd.

      ## Authorised scope (IN SCOPE)
      - Domain: lab.example.com and all sub-domains
      - IP range: 192.0.2.0/24
      - Web application: https://lab.example.com (staging only)

      ## Out of scope (DO NOT TOUCH)
      - Production: www.example.com, 198.51.100.0/24
      - Any third-party service (payment provider, email, CDN)

      ## Window
      - From 2026-01-10 00:00 to 2026-01-17 23:59 (UTC)

      ## Signatures
      - Client representative (authorised to grant access): ______________
      - Tester: ______________
    note:
      fr: "Ce document nomme la cible, ce qui est interdit, la période et surtout il est **signé par une personne habilitée**. Sans la signature du bon décideur, l'autorisation ne vaut rien."
      en: "This document names the target, what is off-limits, the window and, crucially, it is **signed by someone with authority**. Without the right decision-maker's signature, the authorisation is worthless."
  - title:
      fr: "Lire le fichier security.txt d'un site (divulgation responsable)"
      en: "Reading a site's security.txt file (responsible disclosure)"
    file: securitytxt.sh
    lang: bash
    kind: neutral
    code: |
      # security.txt tells you WHERE to report a vulnerability, per RFC 9116.
      # Reading this public file is passive and fully legal.
      curl -s https://example.com/.well-known/security.txt

      # Typical content you would get back:
      #   Contact: mailto:security@example.com
      #   Expires: 2026-12-31T23:59:59.000Z
      #   Policy: https://example.com/security-policy
      #   Preferred-Languages: en, fr
    output: |
      Contact: mailto:security@example.com
      Expires: 2026-12-31T23:59:59.000Z
      Policy: https://example.com/security-policy
      Preferred-Languages: en, fr
    note:
      fr: "Avant de signaler quoi que ce soit, cherchez le canal officiel. Un `security.txt` ou un programme *bug bounty* vous dit comment rapporter **sans** enfreindre la loi."
      en: "Before reporting anything, find the official channel. A `security.txt` file or a *bug bounty* program tells you how to report **without** breaking the law."
  - title:
      fr: "Une checklist de périmètre à valider avant de scanner"
      en: "A scope checklist to validate before scanning"
    file: scope_check.py
    lang: python
    kind: secure
    code: |
      # A tiny guard: refuse to act on a target that is not explicitly in scope.
      # Running this prints which targets are allowed and which must be skipped.
      IN_SCOPE = {"lab.example.com", "192.0.2.10", "192.0.2.11"}

      requested = ["lab.example.com", "192.0.2.10", "www.example.com", "8.8.8.8"]

      for target in requested:
          if target in IN_SCOPE:
              print(f"ALLOWED : {target}")
          else:
              # Out of scope: scanning it could be a criminal offence
              print(f"BLOCKED : {target}  -> NOT in written scope, do not touch")
    output: |
      ALLOWED : lab.example.com
      ALLOWED : 192.0.2.10
      BLOCKED : www.example.com  -> NOT in written scope, do not touch
      BLOCKED : 8.8.8.8  -> NOT in written scope, do not touch
    note:
      fr: "Automatiser la vérification du périmètre évite l'erreur humaine la plus coûteuse : scanner une IP voisine par erreur. Un *allow-list* explicite vaut mieux qu'une liste d'exclusions."
      en: "Automating the scope check prevents the most expensive human error: scanning a neighbouring IP by mistake. An explicit allow-list beats a list of exclusions."

mistake:
  fr: |
    **Croire qu'une autorisation orale ou un \"ok\" sur un chat suffit.** Un message « vas-y, teste » d'un
    collègue qui n'a pas le pouvoir d'autoriser ne vous protège pas. De même, un périmètre flou (« tout le
    réseau ») mène tôt ou tard à toucher un système interdit. Exigez toujours un périmètre **écrit, précis et
    signé par un décideur habilité**, et gardez-en une copie pendant toute la mission.
  en: |
    **Thinking a verbal "ok" or a chat message is enough.** A "go ahead, test it" from a colleague who has no
    authority to authorise does not protect you. Likewise, a vague scope ("the whole network") sooner or later
    leads you to touch a forbidden system. Always demand a **written, precise scope signed by an authorised
    decision-maker**, and keep a copy for the entire engagement.

bestPractice:
  fr: |
    - **Pas de test sans autorisation écrite.** Jamais, même « juste pour voir ».
    - **Définissez le hors-périmètre aussi clairement que le périmètre**, et validez chaque cible avant d'agir.
    - **Journalisez tout** : horodatage, cible, commande. Un journal prouve que vous êtes resté dans le cadre.
    - **Choisissez un terrain légal pour vous entraîner** : vos propres VM, DVWA, Juice Shop, scanme.nmap.org,
      HackTheBox, TryHackMe.
    - **Signalez de façon responsable** et laissez le temps du correctif avant toute publication.
  en: |
    - **No test without written authorisation.** Ever, not even "just to see".
    - **Define out-of-scope as clearly as in-scope**, and validate every target before acting.
    - **Log everything**: timestamp, target, command. A log proves you stayed within bounds.
    - **Pick a legal playground to practise**: your own VMs, DVWA, Juice Shop, scanme.nmap.org, HackTheBox,
      TryHackMe.
    - **Disclose responsibly** and allow time for a fix before any public release.

exercise:
  statement:
    fr: |
      Un ami vous envoie ce message : « Mon entreprise pense que son site www.example.com est mal sécurisé.
      Tu peux le scanner ce soir et me dire ce que tu trouves ? » Vous n'avez aucun document.

      1. Citez **deux** raisons pour lesquelles vous ne devez **pas** scanner tout de suite.
      2. Décrivez ce que vous demandez avant d'accepter.
    en: |
      A friend sends you this message: "My company thinks its site www.example.com is poorly secured. Can you
      scan it tonight and tell me what you find?" You have no document.

      1. Give **two** reasons why you must **not** scan right away.
      2. Describe what you ask for before agreeing.
  solution:
    file: answer.md
    lang: markdown
    code: |
      ## 1. Two reasons not to scan
      - Your friend is probably NOT authorised to grant access to the company's systems,
        so a verbal "can you scan it" gives you no legal cover.
      - www.example.com looks like production: scanning it without written authorisation
        is unauthorised access and could also be an out-of-scope/interception offence.

      ## 2. What to ask for first
      - A written authorisation signed by someone with authority (CISO, system owner).
      - An explicit scope (domains, IP ranges) and out-of-scope list.
      - Rules of engagement: allowed hours, forbidden techniques, an emergency contact.
      - Until that paperwork exists, practise on a legal target instead (DVWA, scanme.nmap.org).
    note:
      fr: "La bonne réponse n'est jamais « je scanne vite fait ». Sans papier signé par un décideur, on refuse poliment et on propose la voie légale."
      en: "The right answer is never \"I'll just quickly scan it\". Without paper signed by a decision-maker, you politely decline and offer the legal path."

quiz:
  - q:
      fr: "Qu'est-ce qui distingue légalement un hacker éthique d'un attaquant criminel ?"
      en: "What legally distinguishes an ethical hacker from a criminal attacker?"
    options:
      fr:
        - "Les outils utilisés"
        - "L'autorisation écrite de tester la cible"
        - "La vitesse d'exécution"
        - "Le système d'exploitation"
      en:
        - "The tools used"
        - "The written authorisation to test the target"
        - "The execution speed"
        - "The operating system"
    answer: 1
    why:
      fr: "Les techniques sont identiques ; c'est l'autorisation qui rend l'action légale."
      en: "The techniques are identical; it is the authorisation that makes the action legal."
  - q:
      fr: "Que doit contenir le périmètre (scope) d'une mission ?"
      en: "What must the scope of an engagement contain?"
    options:
      fr:
        - "Seulement la liste des cibles autorisées"
        - "Uniquement les horaires"
        - "Ce qui est autorisé ET ce qui est hors périmètre"
        - "Le salaire du testeur"
      en:
        - "Only the list of allowed targets"
        - "Only the time windows"
        - "What is allowed AND what is out of scope"
        - "The tester's salary"
    answer: 2
    why:
      fr: "Définir le hors-périmètre est aussi important que le périmètre : c'est ce qui évite de toucher un système interdit."
      en: "Defining out-of-scope matters as much as in-scope: it is what stops you touching a forbidden system."
  - q:
      fr: "Dans la divulgation responsable, que fait-on après avoir trouvé une faille dans un produit ?"
      en: "In responsible disclosure, what do you do after finding a flaw in a product?"
    options:
      fr:
        - "On la publie immédiatement avec un exploit complet"
        - "On la signale en privé à l'éditeur et on laisse le temps de corriger"
        - "On l'exploite pour récupérer des données"
        - "On la vend au plus offrant"
      en:
        - "Publish it immediately with a full exploit"
        - "Report it privately to the vendor and allow time to fix"
        - "Exploit it to grab data"
        - "Sell it to the highest bidder"
    answer: 1
    why:
      fr: "Le signalement privé, puis un délai de correction (souvent 90 jours), protège les utilisateurs avant toute publication."
      en: "Private reporting, then a fix window (often 90 days), protects users before any public release."
  - q:
      fr: "Laquelle de ces cibles pouvez-vous légalement scanner pour vous entraîner, sans autre autorisation ?"
      en: "Which of these targets can you legally scan to practise, with no further authorisation?"
    options:
      fr:
        - "Le site web de votre banque"
        - "L'IP publique d'un voisin"
        - "scanme.nmap.org (cible d'entraînement officielle de Nmap)"
        - "N'importe quel site gouvernemental"
      en:
        - "Your bank's website"
        - "A neighbour's public IP"
        - "scanme.nmap.org (Nmap's official practice target)"
        - "Any government website"
    answer: 2
    why:
      fr: "scanme.nmap.org est explicitement mis à disposition par Nmap pour s'entraîner. Les autres cibles exigent une autorisation."
      en: "scanme.nmap.org is explicitly provided by Nmap for practice. The other targets require authorisation."
  - q:
      fr: "Un fichier `/.well-known/security.txt` sert à :"
      en: "A `/.well-known/security.txt` file is used to:"
    options:
      fr:
        - "Indiquer où signaler une vulnérabilité"
        - "Lister les mots de passe du site"
        - "Bloquer les scanners automatiques"
        - "Chiffrer le trafic du site"
      en:
        - "Indicate where to report a vulnerability"
        - "List the site's passwords"
        - "Block automated scanners"
        - "Encrypt the site's traffic"
    answer: 0
    why:
      fr: "Défini par la RFC 9116, `security.txt` publie le canal de contact sécurité d'une organisation."
      en: "Defined by RFC 9116, `security.txt` publishes an organisation's security contact channel."
