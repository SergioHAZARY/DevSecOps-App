description:
  fr: "Les phases d'un test d'intrusion : reconnaissance, scan, exploitation, post-exploitation et reporting, avec PTES et OWASP WSTG."
  en: "The phases of a penetration test: reconnaissance, scanning, exploitation, post-exploitation and reporting, with PTES and OWASP WSTG."
duration: 20

intro:
  fr: |
    Un test d'intrusion n'est pas une suite d'attaques au hasard : c'est une **méthode** reproductible, en
    phases, exactement comme une enquête. On commence par observer, puis on cartographie, puis seulement on
    agit, et on finit toujours par un **rapport**. Suivre une méthode garantit qu'on n'oublie rien et que deux
    testeurs différents couvrent le même terrain.

    Pensez à un cambrioleur professionnel comparé à un amateur : l'amateur casse une vitre au hasard ; le
    professionnel observe la maison pendant des jours, note les habitudes, teste une porte discrètement, puis
    agit. Le hacking éthique professionnel ressemble au second, en **légal** et **documenté**.

    Dans cette leçon, vous allez découvrir les cinq grandes phases, et deux cadres de référence du métier :
    **PTES** (Penetration Testing Execution Standard) et **OWASP WSTG** (Web Security Testing Guide).
    Rappel du module : ne pratiquez que sur **vos** systèmes, des cibles d'entraînement (DVWA, Juice Shop,
    scanme.nmap.org, HackTheBox, TryHackMe) ou un périmètre **autorisé par écrit**. Tester un tiers sans
    autorisation est illégal.
  en: |
    A penetration test is not a string of random attacks: it is a repeatable **method**, in phases, just like
    an investigation. You observe first, then map, then and only then act, and you always finish with a
    **report**. Following a method guarantees nothing is missed and that two different testers cover the same
    ground.

    Think of a professional burglar versus an amateur: the amateur smashes a random window; the professional
    watches the house for days, notes the routines, quietly tries a door, then acts. Professional ethical
    hacking resembles the latter, but **legal** and **documented**.

    In this lesson you will discover the five main phases, and two reference frameworks of the trade: **PTES**
    (Penetration Testing Execution Standard) and **OWASP WSTG** (Web Security Testing Guide). Module reminder:
    only practise on **your** systems, practice targets (DVWA, Juice Shop, scanme.nmap.org, HackTheBox,
    TryHackMe) or a scope **authorised in writing**. Testing a third party without authorisation is illegal.

sections:
  - heading:
      fr: "Les cinq phases d'un test d'intrusion"
      en: "The five phases of a penetration test"
    body:
      fr: |
        | Phase | But | Exemple d'activité |
        |---|---|---|
        | 1. Reconnaissance | Collecter de l'info sans toucher la cible | Whois, DNS, OSINT |
        | 2. Scan / énumération | Cartographier les hôtes, ports, services | Nmap, feroxbuster |
        | 3. Exploitation | Obtenir un accès via une faille | Injection SQL, exploit de service |
        | 4. Post-exploitation | Mesurer l'impact : élévation, pivot, persistance | Privesc Linux, dump de hash |
        | 5. Reporting | Documenter et proposer des correctifs | Rapport, scores CVSS |

        Ces phases sont **itératives** : la post-exploitation révèle souvent de nouvelles cibles internes, et
        l'on repart en reconnaissance sur le réseau interne. La reconnaissance et le scan prennent en général
        **plus de temps** que l'exploitation elle-même : un bon testeur passe l'essentiel de son temps à
        comprendre la cible avant d'agir.
      en: |
        | Phase | Goal | Example activity |
        |---|---|---|
        | 1. Reconnaissance | Gather info without touching the target | Whois, DNS, OSINT |
        | 2. Scanning / enumeration | Map hosts, ports, services | Nmap, feroxbuster |
        | 3. Exploitation | Gain access via a flaw | SQL injection, service exploit |
        | 4. Post-exploitation | Measure impact: escalation, pivot, persistence | Linux privesc, hash dump |
        | 5. Reporting | Document and propose fixes | Report, CVSS scores |

        These phases are **iterative**: post-exploitation often reveals new internal targets, and you go back to
        reconnaissance on the internal network. Reconnaissance and scanning usually take **longer** than the
        exploitation itself: a good tester spends most of their time understanding the target before acting.
  - heading:
      fr: "PTES : le standard d'exécution"
      en: "PTES: the execution standard"
    body:
      fr: |
        Le **PTES** (*Penetration Testing Execution Standard*) découpe une mission en **sept** étapes, plus
        détaillées que les cinq phases classiques :

        1. **Pre-engagement interactions** : cadrage, périmètre, autorisation, règles d'engagement.
        2. **Intelligence gathering** : reconnaissance passive et active.
        3. **Threat modeling** : quels actifs, quels attaquants réalistes ?
        4. **Vulnerability analysis** : identifier les failles exploitables.
        5. **Exploitation** : prouver qu'une faille est réelle.
        6. **Post-exploitation** : évaluer l'impact métier.
        7. **Reporting** : restituer de façon exploitable.

        L'apport majeur du PTES est de rappeler que **tout commence par le pre-engagement** : le périmètre et
        l'autorisation ne sont pas une case à cocher, ils sont l'étape 1. Pas de pre-engagement, pas de test.
      en: |
        **PTES** (*Penetration Testing Execution Standard*) splits an engagement into **seven** stages, more
        detailed than the classic five phases:

        1. **Pre-engagement interactions**: scoping, scope, authorisation, rules of engagement.
        2. **Intelligence gathering**: passive and active reconnaissance.
        3. **Threat modeling**: which assets, which realistic attackers?
        4. **Vulnerability analysis**: identify exploitable flaws.
        5. **Exploitation**: prove a flaw is real.
        6. **Post-exploitation**: assess business impact.
        7. **Reporting**: deliver something actionable.

        The main contribution of PTES is the reminder that **everything starts with pre-engagement**: scope and
        authorisation are not a checkbox, they are step 1. No pre-engagement, no test.
  - heading:
      fr: "OWASP WSTG : tester le web méthodiquement"
      en: "OWASP WSTG: testing the web methodically"
    body:
      fr: |
        Pour les applications web, la référence est l'**OWASP WSTG** (*Web Security Testing Guide*). C'est un
        catalogue de tests classés par thème, avec un identifiant stable pour chaque test (par ex. `WSTG-ATHN`
        pour l'authentification). Les grandes familles :

        - **INFO** : collecte d'information (technologies, points d'entrée).
        - **CONF** : configuration et déploiement.
        - **IDNT / ATHN / ATHZ** : identité, authentification, autorisation.
        - **SESS** : gestion de session.
        - **INPV** : validation des entrées (injections, XSS).
        - **BUSL** : logique métier.
        - **CLNT** : côté client.

        Le WSTG se combine avec l'**OWASP Top 10** (la liste des risques les plus répandus) : le Top 10 dit
        *quoi* chercher en priorité, le WSTG dit *comment* le tester, test par test.
      en: |
        For web applications, the reference is the **OWASP WSTG** (*Web Security Testing Guide*). It is a
        catalogue of tests grouped by theme, with a stable identifier for each test (e.g. `WSTG-ATHN` for
        authentication). The main families:

        - **INFO**: information gathering (technologies, entry points).
        - **CONF**: configuration and deployment.
        - **IDNT / ATHN / ATHZ**: identity, authentication, authorisation.
        - **SESS**: session management.
        - **INPV**: input validation (injection, XSS).
        - **BUSL**: business logic.
        - **CLNT**: client side.

        WSTG pairs with the **OWASP Top 10** (the list of the most widespread risks): the Top 10 says *what* to
        look for first, the WSTG says *how* to test it, test by test.

examples:
  - title:
      fr: "Un plan de mission qui suit les cinq phases"
      en: "An engagement plan that follows the five phases"
    file: engagement_plan.md
    lang: markdown
    kind: neutral
    code: |
      # Engagement plan - lab.example.com (authorised scope 192.0.2.0/24)

      ## Phase 1 - Reconnaissance (passive)
      - whois, DNS records, certificate transparency, public tech stack

      ## Phase 2 - Scanning / enumeration
      - nmap -sn 192.0.2.0/24        # live hosts
      - nmap -sV -sC 192.0.2.10      # services and versions

      ## Phase 3 - Exploitation (only proven, minimal)
      - Confirm one finding (e.g. SQL injection) with a safe proof of concept

      ## Phase 4 - Post-exploitation
      - Assess impact: what data is reachable? no destruction, no real exfiltration

      ## Phase 5 - Reporting
      - One finding per issue, CVSS score, clear remediation
    note:
      fr: "Un plan écrit avant d'agir évite l'improvisation. Remarquez que chaque commande vise une cible **dans le périmètre** et que l'exploitation reste **minimale**."
      en: "A plan written before acting avoids improvisation. Notice every command targets something **in scope** and that exploitation stays **minimal**."
  - title:
      fr: "Reconnaissance passive avant tout scan actif"
      en: "Passive reconnaissance before any active scan"
    file: recon.sh
    lang: bash
    kind: neutral
    code: |
      # Phase 1 is passive: you read public data, you do not touch the target yet.
      # Here, on a domain you own (example.com used as a placeholder).

      whois example.com | grep -Ei 'registrar|creation'   # registration data
      dig +short example.com A                             # IPv4 address(es)
      dig +short example.com MX                            # mail servers
      dig +short NS example.com                            # name servers
    output: |
      Registrar: Example Registrar, Inc.
      Creation Date: 1995-08-14T04:00:00Z
      192.0.2.10
      mail.example.com.
      ns1.example.com.
      ns2.example.com.
    note:
      fr: "La reconnaissance passive ne génère aucun trafic vers l'application cible : elle lit des bases publiques. C'est la phase la plus discrète et la plus sûre juridiquement."
      en: "Passive reconnaissance generates no traffic to the target application: it reads public databases. It is the stealthiest and the legally safest phase."
  - title:
      fr: "Suivre un test WSTG : vérifier l'en-tête de serveur (INFO)"
      en: "Following a WSTG test: checking the server header (INFO)"
    file: wstg_info.sh
    lang: bash
    kind: neutral
    code: |
      # WSTG-INFO-02: fingerprint the web server. Run against YOUR lab app only.
      # -I = headers only, -s = silent. Target is localhost (your own container).
      curl -sI http://127.0.0.1:8080/ | grep -Ei 'server|x-powered-by'

      # A verbose server banner leaks the exact software version to attackers.
      # Finding it is step 1; the fix (hide the banner) comes in the report.
    output: |
      Server: Apache/2.4.58 (Ubuntu)
      X-Powered-By: PHP/8.1.2
    note:
      fr: "Chaque test WSTG a un identifiant (`WSTG-INFO-02`) qui rend le rapport traçable. Ici, la bannière révèle Apache et PHP : une information à réduire côté défense."
      en: "Each WSTG test has an identifier (`WSTG-INFO-02`) that makes the report traceable. Here the banner reveals Apache and PHP: information to reduce on the defensive side."

mistake:
  fr: |
    **Sauter la reconnaissance pour « aller vite » à l'exploitation.** Les débutants lancent Metasploit avant
    d'avoir compris la cible, et passent à côté de la vraie faille. Un test sérieux consacre la majorité du
    temps aux phases 1 et 2 : on n'exploite bien que ce qu'on a d'abord bien cartographié. Brûler les étapes
    produit un rapport superficiel et, souvent, des dégâts évitables sur la cible.
  en: |
    **Skipping reconnaissance to "rush" to exploitation.** Beginners launch Metasploit before understanding the
    target, and miss the real flaw. A serious test spends most of its time in phases 1 and 2: you only exploit
    well what you first mapped well. Rushing the early steps yields a shallow report and, often, avoidable
    damage to the target.

bestPractice:
  fr: |
    - **Respectez l'ordre des phases**, mais acceptez les itérations (la post-exploitation relance la recon).
    - **Commencez toujours par le pre-engagement** (périmètre, autorisation) : c'est l'étape 1 de PTES.
    - **Documentez au fil de l'eau** : chaque commande et chaque résultat, pour un rapport fidèle.
    - **Appuyez-vous sur un standard** (PTES pour la mission, WSTG pour le web) afin de ne rien oublier.
    - **Restez minimal en exploitation** : prouvez la faille, ne causez pas de dégât ni d'exfiltration réelle.
  en: |
    - **Respect the phase order**, but accept iteration (post-exploitation restarts recon).
    - **Always start with pre-engagement** (scope, authorisation): it is PTES step 1.
    - **Document as you go**: every command and every result, for a faithful report.
    - **Lean on a standard** (PTES for the engagement, WSTG for the web) so nothing is missed.
    - **Stay minimal in exploitation**: prove the flaw, cause no damage and no real exfiltration.

exercise:
  statement:
    fr: |
      On vous confie un test de l'application web `lab.example.com` (périmètre autorisé par écrit).
      Classez ces quatre actions dans l'ordre des phases d'un test d'intrusion, et nommez la phase de chacune :

      - A. Lancer `nmap -sV -sC` sur le serveur
      - B. Lire les enregistrements DNS publics du domaine
      - C. Rédiger un rapport avec un score CVSS pour chaque faille
      - D. Confirmer une injection SQL par une preuve minimale
    en: |
      You are given a test of the web application `lab.example.com` (scope authorised in writing). Put these
      four actions in the order of the penetration-test phases, and name the phase of each:

      - A. Run `nmap -sV -sC` on the server
      - B. Read the domain's public DNS records
      - C. Write a report with a CVSS score for each flaw
      - D. Confirm a SQL injection with a minimal proof
  solution:
    file: order.md
    lang: markdown
    code: |
      Correct order and phase:

      1. B - Reconnaissance (passive): read public DNS records, no contact with the app.
      2. A - Scanning / enumeration: nmap -sV -sC maps services and versions.
      3. D - Exploitation: confirm the SQL injection with a minimal, safe proof.
      4. C - Reporting: document each finding with a CVSS score and a fix.

      (Post-exploitation would sit between D and C if an access were obtained.)
    note:
      fr: "La reconnaissance passive (B) vient toujours en premier, le reporting (C) toujours en dernier. L'exploitation (D) ne se fait qu'après avoir cartographié la cible (A)."
      en: "Passive reconnaissance (B) always comes first, reporting (C) always last. Exploitation (D) only happens after mapping the target (A)."

quiz:
  - q:
      fr: "Dans quel ordre se déroulent les phases classiques d'un test d'intrusion ?"
      en: "In what order do the classic penetration-test phases run?"
    options:
      fr:
        - "Exploitation, recon, scan, rapport, post-exploitation"
        - "Reconnaissance, scan, exploitation, post-exploitation, reporting"
        - "Rapport, exploitation, scan, recon, post-exploitation"
        - "Scan, exploitation, recon, reporting, post-exploitation"
      en:
        - "Exploitation, recon, scan, report, post-exploitation"
        - "Reconnaissance, scanning, exploitation, post-exploitation, reporting"
        - "Report, exploitation, scan, recon, post-exploitation"
        - "Scan, exploitation, recon, reporting, post-exploitation"
    answer: 1
    why:
      fr: "On observe (recon), on cartographie (scan), on agit (exploitation puis post-exploitation), puis on documente (reporting)."
      en: "You observe (recon), map (scan), act (exploitation then post-exploitation), then document (reporting)."
  - q:
      fr: "Quelle est la toute première étape du PTES ?"
      en: "What is the very first stage of PTES?"
    options:
      fr:
        - "L'exploitation"
        - "La collecte d'information"
        - "Le pre-engagement (périmètre, autorisation)"
        - "Le reporting"
      en:
        - "Exploitation"
        - "Intelligence gathering"
        - "Pre-engagement (scope, authorisation)"
        - "Reporting"
    answer: 2
    why:
      fr: "Le PTES commence par le pre-engagement : sans périmètre ni autorisation, aucun test ne doit démarrer."
      en: "PTES starts with pre-engagement: with no scope and no authorisation, no test should begin."
  - q:
      fr: "À quoi sert principalement la phase de post-exploitation ?"
      en: "What is the post-exploitation phase mainly for?"
    options:
      fr:
        - "À mesurer l'impact réel d'un accès obtenu"
        - "À rédiger le contrat de mission"
        - "À choisir le système d'exploitation du testeur"
        - "À scanner les ports ouverts"
      en:
        - "To measure the real impact of an obtained access"
        - "To draft the engagement contract"
        - "To choose the tester's operating system"
        - "To scan open ports"
    answer: 0
    why:
      fr: "Une fois un accès obtenu, la post-exploitation évalue jusqu'où on peut aller (élévation, pivot) pour chiffrer l'impact métier."
      en: "Once access is gained, post-exploitation assesses how far one can go (escalation, pivot) to quantify business impact."
  - q:
      fr: "Que fournit l'OWASP WSTG ?"
      en: "What does the OWASP WSTG provide?"
    options:
      fr:
        - "Un pare-feu applicatif gratuit"
        - "Un catalogue de tests de sécurité web avec des identifiants stables"
        - "Une liste de mots de passe courants"
        - "Un système d'exploitation pour pentester"
      en:
        - "A free web application firewall"
        - "A catalogue of web security tests with stable identifiers"
        - "A list of common passwords"
        - "An operating system for pentesting"
    answer: 1
    why:
      fr: "Le Web Security Testing Guide classe des tests web (par ex. WSTG-ATHN) pour tester une application méthodiquement."
      en: "The Web Security Testing Guide organises web tests (e.g. WSTG-ATHN) to test an application methodically."
  - q:
      fr: "Pourquoi la reconnaissance prend-elle souvent plus de temps que l'exploitation ?"
      en: "Why does reconnaissance often take more time than exploitation?"
    options:
      fr:
        - "Parce que les outils de recon sont lents"
        - "Parce qu'on n'exploite bien que ce qu'on a d'abord bien compris"
        - "Parce que la loi l'impose"
        - "Parce que l'exploitation est interdite"
      en:
        - "Because recon tools are slow"
        - "Because you only exploit well what you first understood well"
        - "Because the law requires it"
        - "Because exploitation is forbidden"
    answer: 1
    why:
      fr: "Comprendre la cible (recon, scan) oriente une exploitation précise ; sauter ces phases mène à des échecs et des dégâts."
      en: "Understanding the target (recon, scan) steers a precise exploitation; skipping these phases leads to failures and damage."
