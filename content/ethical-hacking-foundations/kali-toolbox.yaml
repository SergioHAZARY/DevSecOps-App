description:
  fr: "Découvrir Kali Linux et classer sa boîte à outils par catégories : reconnaissance, scan, web, exploitation, mots de passe, sans-fil."
  en: "Discover Kali Linux and sort its toolbox by category: reconnaissance, scanning, web, exploitation, passwords, wireless."
duration: 20

intro:
  fr: |
    **Kali Linux** est une distribution Linux pensée pour les tests de sécurité : au lieu d'installer des
    centaines d'outils un par un, vous obtenez un système où presque tout est déjà prêt. C'est la boîte à
    outils du pentester, comme la caisse à outils complète d'un mécanicien.

    Mais une caisse à outils pleine ne fait pas de vous un mécanicien : il faut savoir **quel outil pour quel
    travail**. La vraie compétence n'est pas de connaître 600 commandes, c'est de savoir, à chaque phase d'un
    test, quelle **catégorie** d'outil sortir.

    Dans cette leçon, vous allez ranger les outils de Kali par **catégorie** (reconnaissance, scan,
    énumération web, exploitation, mots de passe, sans-fil, post-exploitation) et comprendre à quoi sert
    chacune. Rappel du module : ces outils ne se lancent que contre **vos** cibles de lab, des cibles
    d'entraînement (scanme.nmap.org, DVWA, Juice Shop, HackTheBox, TryHackMe) ou un périmètre **autorisé par
    écrit**. Les utiliser contre un tiers sans autorisation est illégal.
  en: |
    **Kali Linux** is a Linux distribution built for security testing: instead of installing hundreds of tools
    one by one, you get a system where almost everything is ready. It is the pentester's toolbox, like a
    mechanic's fully stocked tool chest.

    But a full tool chest does not make you a mechanic: you must know **which tool for which job**. The real
    skill is not knowing 600 commands, it is knowing, at each phase of a test, which **category** of tool to
    reach for.

    In this lesson you will sort Kali's tools by **category** (reconnaissance, scanning, web enumeration,
    exploitation, passwords, wireless, post-exploitation) and understand what each is for. Module reminder:
    these tools are only run against **your** lab targets, practice targets (scanme.nmap.org, DVWA, Juice Shop,
    HackTheBox, TryHackMe) or a scope **authorised in writing**. Using them against a third party without
    authorisation is illegal.

sections:
  - heading:
      fr: "Les grandes catégories d'outils"
      en: "The main tool categories"
    body:
      fr: |
        Chaque catégorie correspond à une phase de la méthodologie vue précédemment :

        | Catégorie | Phase | Outils typiques | À quoi ça sert |
        |---|---|---|---|
        | Information gathering | Recon | theHarvester, dnsrecon, whois | Collecter de l'info publique |
        | Scanning | Scan | Nmap, masscan | Trouver hôtes, ports, services |
        | Web enumeration | Scan web | feroxbuster, ffuf, whatweb, Nikto | Cartographier une appli web |
        | Web proxy | Test web | Burp Suite, OWASP ZAP | Intercepter et modifier des requêtes |
        | Exploitation | Exploitation | Metasploit, sqlmap, searchsploit | Prouver qu'une faille est réelle |
        | Password | Transverse | hashcat, John, hydra | Tester la robustesse de mots de passe |
        | Wireless | Wi-Fi | aircrack-ng, hcxtools | Tester la sécurité du Wi-Fi |
        | Post-exploitation | Post-exploit | Metasploit, LinPEAS, mimikatz | Mesurer l'impact d'un accès |

        Retenir les **catégories** vaut mieux que mémoriser chaque outil : face à une tâche, vous saurez dans
        quelle famille chercher, et les outils d'une même famille se ressemblent.
      en: |
        Each category matches a phase of the methodology seen earlier:

        | Category | Phase | Typical tools | Purpose |
        |---|---|---|---|
        | Information gathering | Recon | theHarvester, dnsrecon, whois | Collect public info |
        | Scanning | Scan | Nmap, masscan | Find hosts, ports, services |
        | Web enumeration | Web scan | feroxbuster, ffuf, whatweb, Nikto | Map a web app |
        | Web proxy | Web testing | Burp Suite, OWASP ZAP | Intercept and modify requests |
        | Exploitation | Exploitation | Metasploit, sqlmap, searchsploit | Prove a flaw is real |
        | Password | Cross-cutting | hashcat, John, hydra | Test password strength |
        | Wireless | Wi-Fi | aircrack-ng, hcxtools | Test Wi-Fi security |
        | Post-exploitation | Post-exploit | Metasploit, LinPEAS, mimikatz | Measure the impact of access |

        Remembering the **categories** beats memorising every tool: facing a task, you will know which family to
        reach into, and tools within a family resemble each other.
  - heading:
      fr: "Scan, exploitation et mots de passe en détail"
      en: "Scanning, exploitation and passwords in detail"
    body:
      fr: |
        Trois catégories reviennent dans presque toutes les missions :

        - **Nmap** (scan) est l'outil le plus universel : il découvre les hôtes vivants, les ports ouverts, les
          versions de service, et exécute des scripts NSE. On l'utilise à chaque test.
        - **Metasploit** (exploitation) est un *framework* : une base de données d'exploits et de *payloads*
          qu'on configure (`set RHOSTS`, `set PAYLOAD`, `run`). Il industrialise la preuve d'exploitation.
        - **hashcat** et **John the Ripper** (mots de passe) testent la robustesse d'un hash *hors ligne* :
          on compare le hash à des millions de candidats. **hydra** teste des identifiants *en ligne* contre un
          service (SSH, FTP) ; très bruyant, à réserver au lab.

        Important : les outils de mots de passe ne servent, dans ce module, qu'à **tester vos propres** hashs ou
        ceux d'une cible de lab. Attaquer les comptes réels d'autrui est un délit.
      en: |
        Three categories appear in almost every engagement:

        - **Nmap** (scanning) is the most universal tool: it finds live hosts, open ports, service versions, and
          runs NSE scripts. You use it in every test.
        - **Metasploit** (exploitation) is a *framework*: a database of exploits and *payloads* you configure
          (`set RHOSTS`, `set PAYLOAD`, `run`). It industrialises the proof of exploitation.
        - **hashcat** and **John the Ripper** (passwords) test the strength of a hash *offline*: the hash is
          compared to millions of candidates. **hydra** tries credentials *online* against a service (SSH, FTP);
          very noisy, keep it to the lab.

        Important: in this module, password tools are only used to **test your own** hashes or those of a lab
        target. Attacking other people's real accounts is a crime.
  - heading:
      fr: "Garder Kali à jour et minimal"
      en: "Keeping Kali up to date and minimal"
    body:
      fr: |
        Kali évolue vite : les outils et les signatures changent souvent. Avant une session, mettez le système
        à jour avec `apt update && apt full-upgrade`. Un Kali à jour évite les faux négatifs (un exploit qui
        échoue parce que l'outil est périmé).

        Vous n'avez pas besoin de la totalité des 600+ outils. Les méta-paquets permettent de choisir :
        `kali-linux-default` pour l'essentiel, `kali-linux-large` pour plus, ou des paquets thématiques comme
        `kali-tools-web`. Un système plus léger démarre plus vite et expose moins de surface.

        Enfin, **ne lancez pas Kali en root au quotidien** : les versions modernes utilisent un utilisateur
        non privilégié par défaut, et c'est une bonne chose. On n'élève ses droits que pour les commandes qui
        l'exigent (capture Wi-Fi, scan brut), avec `sudo`.
      en: |
        Kali moves fast: tools and signatures change often. Before a session, update the system with
        `apt update && apt full-upgrade`. An up-to-date Kali avoids false negatives (an exploit failing because
        the tool is stale).

        You do not need all 600+ tools. Meta-packages let you choose: `kali-linux-default` for the essentials,
        `kali-linux-large` for more, or themed packages such as `kali-tools-web`. A lighter system boots faster
        and exposes less surface.

        Finally, **do not run Kali as root day to day**: modern versions use an unprivileged user by default,
        which is a good thing. You only raise privileges for the commands that need it (Wi-Fi capture, raw
        scanning), with `sudo`.

examples:
  - title:
      fr: "Reconnaissance : theHarvester sur un domaine que vous possédez"
      en: "Reconnaissance: theHarvester on a domain you own"
    file: harvester.sh
    lang: bash
    kind: neutral
    code: |
      # theHarvester collects public emails, sub-domains and hosts for a domain.
      # Run it ONLY on a domain you own or are authorised to test.
      # -d = domain, -b = data source (here, certificate transparency).
      theHarvester -d example.com -b crtsh
    output: |
      [*] Target: example.com
      [*] Searching crtsh.
      [*] Hosts found: 3
      ---------------------
      mail.example.com
      shop.example.com
      vpn.example.com
    note:
      fr: "theHarvester appartient à la catégorie *information gathering* : il agrège des sources publiques, sans attaquer la cible. Idéal pour débuter la phase de reconnaissance."
      en: "theHarvester belongs to the *information gathering* category: it aggregates public sources without attacking the target. Ideal to begin the reconnaissance phase."
  - title:
      fr: "Exploitation : chercher un exploit local avec searchsploit"
      en: "Exploitation: searching a local exploit database with searchsploit"
    file: searchsploit.sh
    lang: bash
    kind: neutral
    code: |
      # searchsploit queries the offline Exploit-DB copy shipped with Kali.
      # Here we look up a known-vulnerable FTP service found during scanning.
      searchsploit vsftpd 2.3.4

      # The result tells you an exploit module exists; in the lab you would then
      # verify it against YOUR Metasploitable target, never a third party.
    output: |
      -------------------------------------------------- ----------------------------
       Exploit Title                                     |  Path
      -------------------------------------------------- ----------------------------
       vsftpd 2.3.4 - Backdoor Command Execution         | unix/remote/17491.rb
      -------------------------------------------------- ----------------------------
    note:
      fr: "searchsploit relie une version de service (trouvée au scan) à un exploit connu. La catégorie *exploitation* transforme une observation en preuve, uniquement sur une cible autorisée."
      en: "searchsploit links a service version (found while scanning) to a known exploit. The *exploitation* category turns an observation into proof, only on an authorised target."
  - title:
      fr: "Mots de passe : tester un hash de lab avec hashcat"
      en: "Passwords: testing a lab hash with hashcat"
    file: hashcat.sh
    lang: bash
    kind: neutral
    code: |
      # Offline password-strength test on a hash you own (here a lab MD5 hash).
      # -m 0 = MD5, -a 0 = dictionary attack, rockyou = classic wordlist.
      # Goal: see if YOUR password would survive a wordlist attack.
      echo '5f4dcc3b5aa765d61d8327deb882cf99' > lab_hash.txt
      hashcat -m 0 -a 0 lab_hash.txt /usr/share/wordlists/rockyou.txt
    output: |
      5f4dcc3b5aa765d61d8327deb882cf99:password

      Session..........: hashcat
      Status...........: Cracked
      Hash.Mode........: 0 (MD5)
    note:
      fr: "hashcat (catégorie *password*) casse ici le mot de passe `password` en quelques millisecondes : la preuve qu'un mot de passe faible ne résiste à aucune attaque par dictionnaire. À n'utiliser que sur vos propres hashs."
      en: "hashcat (the *password* category) cracks the password `password` here in milliseconds: proof that a weak password survives no dictionary attack. Use it only on your own hashes."

mistake:
  fr: |
    **Croire qu'avoir Kali fait de vous un hacker, et lancer les outils au hasard.** Kali n'est qu'une boîte à
    outils ; sans méthode, on bombarde une cible de scans bruyants sans rien comprendre. Pire, certains lancent
    des outils agressifs (hydra, Nikto) sur des cibles réelles « pour voir » : c'est illégal et détectable.
    L'objectif est de choisir le bon outil pour la bonne phase, sur une cible autorisée, pas d'exécuter tout le
    menu.
  en: |
    **Thinking that having Kali makes you a hacker, and firing tools at random.** Kali is just a toolbox;
    without method, you bombard a target with noisy scans and understand nothing. Worse, some people run
    aggressive tools (hydra, Nikto) at real targets "to see": that is illegal and detectable. The goal is to
    pick the right tool for the right phase, against an authorised target, not to run the whole menu.

bestPractice:
  fr: |
    - **Pensez par catégorie** : à chaque phase, demandez-vous quelle famille d'outils est pertinente.
    - **Mettez Kali à jour** avant chaque session (`apt update && apt full-upgrade`) pour éviter les faux négatifs.
    - **N'utilisez pas root au quotidien** : travaillez en utilisateur normal, élevez avec `sudo` au besoin.
    - **Maîtrisez quelques outils à fond** (Nmap, Burp, Metasploit) plutôt que d'en survoler des dizaines.
    - **Jamais sur une cible non autorisée** : vos VM de lab, scanme.nmap.org, DVWA, Juice Shop, HTB, THM.
  en: |
    - **Think in categories**: at each phase, ask which family of tools is relevant.
    - **Update Kali** before each session (`apt update && apt full-upgrade`) to avoid false negatives.
    - **Do not use root day to day**: work as a normal user, raise with `sudo` when needed.
    - **Master a few tools deeply** (Nmap, Burp, Metasploit) rather than skimming dozens.
    - **Never against an unauthorised target**: your lab VMs, scanme.nmap.org, DVWA, Juice Shop, HTB, THM.

exercise:
  statement:
    fr: |
      Pour chacune de ces tâches, indiquez la **catégorie** d'outil et **un** outil typique de Kali :

      1. Lister les sous-domaines publics d'un domaine que vous possédez.
      2. Découvrir les ports ouverts d'une cible de lab.
      3. Intercepter et modifier une requête HTTP envoyée à votre application de lab.
      4. Tester si le mot de passe d'un hash que vous possédez est faible.
    en: |
      For each of these tasks, give the tool **category** and **one** typical Kali tool:

      1. List the public sub-domains of a domain you own.
      2. Discover the open ports of a lab target.
      3. Intercept and modify an HTTP request sent to your lab application.
      4. Test whether the password of a hash you own is weak.
  solution:
    file: answers.md
    lang: markdown
    code: |
      1. Information gathering   -> theHarvester (or dnsrecon)
      2. Scanning                -> Nmap
      3. Web proxy               -> Burp Suite (or OWASP ZAP)
      4. Password                -> hashcat (or John the Ripper)

      The point is to map each task to a CATEGORY first: once you know the family,
      the specific tool follows naturally and tools in a family work alike.
    note:
      fr: "Raisonner par catégorie permet de choisir vite : reconnaissance, scan, proxy web, mots de passe. L'outil exact est secondaire."
      en: "Reasoning by category lets you choose quickly: recon, scan, web proxy, passwords. The exact tool is secondary."

quiz:
  - q:
      fr: "Qu'est-ce que Kali Linux ?"
      en: "What is Kali Linux?"
    options:
      fr:
        - "Un pare-feu commercial"
        - "Une distribution Linux livrée avec des outils de test de sécurité"
        - "Un antivirus pour Windows"
        - "Un service cloud de scan"
      en:
        - "A commercial firewall"
        - "A Linux distribution shipped with security-testing tools"
        - "An antivirus for Windows"
        - "A cloud scanning service"
    answer: 1
    why:
      fr: "Kali regroupe des centaines d'outils de sécurité prêts à l'emploi dans une distribution Linux."
      en: "Kali bundles hundreds of ready-to-use security tools in a Linux distribution."
  - q:
      fr: "Quel outil appartient à la catégorie exploitation ?"
      en: "Which tool belongs to the exploitation category?"
    options:
      fr:
        - "theHarvester"
        - "whatweb"
        - "Metasploit"
        - "dnsrecon"
      en:
        - "theHarvester"
        - "whatweb"
        - "Metasploit"
        - "dnsrecon"
    answer: 2
    why:
      fr: "Metasploit est un framework d'exploitation ; les autres servent à la reconnaissance ou à l'énumération web."
      en: "Metasploit is an exploitation framework; the others are for reconnaissance or web enumeration."
  - q:
      fr: "À quoi sert hashcat dans ce module ?"
      en: "What is hashcat used for in this module?"
    options:
      fr:
        - "À tester hors ligne la robustesse de vos propres hashs"
        - "À scanner les ports d'un réseau"
        - "À intercepter des requêtes HTTP"
        - "À casser les comptes réels d'autrui"
      en:
        - "To test offline the strength of your own hashes"
        - "To scan a network's ports"
        - "To intercept HTTP requests"
        - "To crack other people's real accounts"
    answer: 0
    why:
      fr: "hashcat compare un hash à des millions de candidats, pour mesurer la robustesse de **vos** mots de passe. L'utiliser contre autrui est illégal."
      en: "hashcat compares a hash to millions of candidates, to measure the strength of **your** passwords. Using it against others is illegal."
  - q:
      fr: "Pourquoi mettre Kali à jour avant une session ?"
      en: "Why update Kali before a session?"
    options:
      fr:
        - "Pour changer le fond d'écran"
        - "Pour éviter les faux négatifs dus à des outils périmés"
        - "Pour activer le mode root permanent"
        - "Pour supprimer tous les outils web"
      en:
        - "To change the wallpaper"
        - "To avoid false negatives from stale tools"
        - "To enable permanent root mode"
        - "To delete all web tools"
    answer: 1
    why:
      fr: "Des outils ou signatures périmés peuvent manquer une faille : un Kali à jour donne des résultats fiables."
      en: "Stale tools or signatures can miss a flaw: an up-to-date Kali gives reliable results."
  - q:
      fr: "Quelle est la meilleure habitude de compte utilisateur sous Kali ?"
      en: "What is the best user-account habit on Kali?"
    options:
      fr:
        - "Tout faire en root en permanence"
        - "Désactiver complètement sudo"
        - "Travailler en utilisateur normal et élever avec sudo au besoin"
        - "Créer un compte invité sans mot de passe"
      en:
        - "Do everything as root all the time"
        - "Disable sudo entirely"
        - "Work as a normal user and raise with sudo when needed"
        - "Create a guest account with no password"
    answer: 2
    why:
      fr: "Les Kali modernes utilisent un utilisateur non privilégié ; on n'élève les droits que pour les commandes qui l'exigent."
      en: "Modern Kali uses an unprivileged user; you only raise privileges for the commands that require it."
