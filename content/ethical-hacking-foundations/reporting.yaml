description:
  fr: "Rédiger un rapport de test d'intrusion professionnel : structure, scores de sévérité CVSS et un modèle de constat en Markdown."
  en: "Write a professional penetration-test report: structure, CVSS severity scores and a findings template in Markdown."
duration: 25

intro:
  fr: |
    Un test d'intrusion ne vaut que par son **rapport**. Les failles trouvées ne servent à rien si personne ne
    peut les comprendre ni les corriger. Le rapport est le **produit final** livré au client : c'est lui qu'on
    relit, qu'on budgète et qu'on suit dans le temps.

    Pensez au compte rendu d'un médecin : il ne suffit pas de dire « ça va mal ». Il faut le diagnostic, la
    gravité, l'examen qui le prouve, et le traitement. Un bon rapport de pentest fait exactement cela pour
    chaque faille : *où*, *quelle gravité*, *comment je l'ai prouvée*, *comment la corriger*.

    Dans cette leçon, vous allez apprendre la **structure** d'un rapport, calculer une **sévérité** avec le
    **CVSS** (Common Vulnerability Scoring System, v3.1), et utiliser un **modèle de constat** réutilisable.
    Ces constats décrivent des failles trouvées sur **vos** cibles de lab ou un périmètre **autorisé par
    écrit** ; on ne teste jamais un tiers sans autorisation.
  en: |
    A penetration test is only worth its **report**. The flaws found are useless if nobody can understand or
    fix them. The report is the **final product** delivered to the client: it is what gets re-read, budgeted
    and tracked over time.

    Think of a doctor's write-up: saying "it looks bad" is not enough. You need the diagnosis, the severity,
    the examination that proves it, and the treatment. A good pentest report does exactly that for each flaw:
    *where*, *how severe*, *how I proved it*, *how to fix it*.

    In this lesson you will learn the **structure** of a report, compute a **severity** with **CVSS** (Common
    Vulnerability Scoring System, v3.1), and use a reusable **findings template**. These findings describe
    flaws found on **your** lab targets or a scope **authorised in writing**; you never test a third party
    without authorisation.

sections:
  - heading:
      fr: "La structure d'un rapport de pentest"
      en: "The structure of a pentest report"
    body:
      fr: |
        Un rapport professionnel suit un plan stable, lu par deux publics : les décideurs (résumé) et les
        techniciens (détails) :

        1. **Résumé exécutif** (*executive summary*) : une page sans jargon, pour la direction. Niveau de
           risque global, 3-4 constats majeurs, recommandation.
        2. **Périmètre et méthodologie** : ce qui a été testé, quand, avec quelle méthode (PTES, WSTG) et quelles
           limites.
        3. **Synthèse des constats** : un tableau de toutes les failles, triées par sévérité.
        4. **Constats détaillés** : un bloc par faille (description, preuve, impact, remédiation, score CVSS).
        5. **Annexes** : outils utilisés, commandes, journaux.

        Le **résumé exécutif** est la partie la plus lue et la plus difficile : il traduit des détails techniques
        en **risque métier** (« un attaquant pourrait lire la base clients »), sans une seule ligne de code.
      en: |
        A professional report follows a stable outline, read by two audiences: decision-makers (summary) and
        technicians (details):

        1. **Executive summary**: one jargon-free page, for management. Overall risk level, 3-4 major findings,
           recommendation.
        2. **Scope and methodology**: what was tested, when, with which method (PTES, WSTG) and what limits.
        3. **Findings summary**: a table of all flaws, sorted by severity.
        4. **Detailed findings**: one block per flaw (description, proof, impact, remediation, CVSS score).
        5. **Appendices**: tools used, commands, logs.

        The **executive summary** is the most read and the hardest part: it translates technical detail into
        **business risk** ("an attacker could read the customer database"), without a single line of code.
  - heading:
      fr: "La sévérité avec CVSS v3.1"
      en: "Severity with CVSS v3.1"
    body:
      fr: |
        Le **CVSS** attribue à chaque faille un score de **0.0 à 10.0** et une catégorie :

        | Score | Sévérité |
        |---|---|
        | 0.0 | None |
        | 0.1 - 3.9 | Low |
        | 4.0 - 6.9 | Medium |
        | 7.0 - 8.9 | High |
        | 9.0 - 10.0 | Critical |

        Le score **base** se calcule à partir de huit métriques, dont :

        - **AV** (Attack Vector) : Network, Adjacent, Local, Physical.
        - **AC** (Attack Complexity) : Low / High.
        - **PR** (Privileges Required) : None / Low / High.
        - **UI** (User Interaction) : None / Required.
        - **C / I / A** (Confidentiality / Integrity / Availability) : None / Low / High.

        On les résume dans un **vecteur** lisible, par ex. `CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H`
        (= 9.8, Critical). Le CVSS n'est pas parfait, mais il donne un langage **commun** pour prioriser.
      en: |
        **CVSS** gives each flaw a score from **0.0 to 10.0** and a category:

        | Score | Severity |
        |---|---|
        | 0.0 | None |
        | 0.1 - 3.9 | Low |
        | 4.0 - 6.9 | Medium |
        | 7.0 - 8.9 | High |
        | 9.0 - 10.0 | Critical |

        The **base** score is computed from eight metrics, including:

        - **AV** (Attack Vector): Network, Adjacent, Local, Physical.
        - **AC** (Attack Complexity): Low / High.
        - **PR** (Privileges Required): None / Low / High.
        - **UI** (User Interaction): None / Required.
        - **C / I / A** (Confidentiality / Integrity / Availability): None / Low / High.

        They are summarised in a readable **vector**, e.g. `CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H`
        (= 9.8, Critical). CVSS is not perfect, but it provides a **common** language to prioritise.
  - heading:
      fr: "Un bon constat : preuve et remédiation"
      en: "A good finding: proof and remediation"
    body:
      fr: |
        Chaque constat détaillé doit répondre à quatre questions, dans cet ordre :

        - **Quoi et où** : la faille et l'endroit précis (URL, paramètre, service, ligne).
        - **Preuve** : la requête/commande et la réponse qui démontrent la faille. Reproductible, mais
          **minimale** : on prouve, on ne pille pas.
        - **Impact** : ce qu'un attaquant pourrait réellement faire, en termes métier.
        - **Remédiation** : la correction concrète (requête paramétrée, mise à jour, durcissement), idéalement
          avec un exemple de code corrigé.

        Deux pièges classiques : (1) un constat sans remédiation, inutile au client ; (2) une preuve
        exagérée qui a volé des données réelles, ce qui dépasse le mandat. Un constat efficace est **actionnable**
        et **proportionné**.
      en: |
        Each detailed finding must answer four questions, in this order:

        - **What and where**: the flaw and its exact location (URL, parameter, service, line).
        - **Proof**: the request/command and the response that demonstrate the flaw. Reproducible, but
          **minimal**: you prove, you do not loot.
        - **Impact**: what an attacker could really do, in business terms.
        - **Remediation**: the concrete fix (parameterized query, update, hardening), ideally with an example of
          corrected code.

        Two classic traps: (1) a finding with no remediation, useless to the client; (2) an exaggerated proof
        that stole real data, which exceeds the mandate. An effective finding is **actionable** and
        **proportionate**.

examples:
  - title:
      fr: "Un modèle de constat réutilisable en Markdown"
      en: "A reusable findings template in Markdown"
    file: finding_template.md
    lang: markdown
    kind: secure
    code: |
      ## F-01  SQL Injection in the login form

      | Field | Value |
      |---|---|
      | Severity | High (CVSS 8.6) |
      | CVSS vector | CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N |
      | Affected | https://lab.example.com/login  (parameter: username) |
      | Status | Open |

      ### Description
      The `username` field is concatenated into the SQL query without
      parameterisation, allowing authentication bypass and data extraction.

      ### Proof of concept (minimal)
      Request: username = `admin' -- ` , password = anything
      Result: logged in as admin without a valid password.

      ### Impact
      An unauthenticated attacker can read the users table and log in as any
      account, including administrators.

      ### Remediation
      Use parameterised queries (prepared statements). Example (PHP/PDO):
      `$stmt = $pdo->prepare("SELECT * FROM users WHERE name = ?");`
    note:
      fr: "Ce modèle couvre les quatre questions (quoi/où, preuve, impact, remédiation) plus le score. Le même squelette se réutilise pour chaque faille, ce qui rend le rapport homogène."
      en: "This template covers the four questions (what/where, proof, impact, remediation) plus the score. The same skeleton is reused for each flaw, making the report consistent."
  - title:
      fr: "Lire un vecteur CVSS et sa catégorie"
      en: "Reading a CVSS vector and its category"
    file: cvss.py
    lang: python
    kind: neutral
    code: |
      # Map a CVSS base score to its severity label (CVSS v3.1 ranges).
      def severity(score: float) -> str:
          if score == 0.0:
              return "None"
          if score < 4.0:
              return "Low"
          if score < 7.0:
              return "Medium"
          if score < 9.0:
              return "High"
          return "Critical"

      # Example: a classic unauthenticated RCE vector scores 9.8
      for s in [0.0, 3.1, 5.4, 8.6, 9.8]:
          print(f"{s:>4}  -> {severity(s)}")
    output: |
       0.0  -> None
       3.1  -> Low
       5.4  -> Medium
       8.6  -> High
       9.8  -> Critical
    note:
      fr: "Le score chiffré est utile pour trier, mais c'est la **catégorie** (High, Critical) que lit la direction. Les deux apparaissent dans la synthèse du rapport."
      en: "The numeric score is useful to sort, but it is the **category** (High, Critical) that management reads. Both appear in the report's summary."
  - title:
      fr: "Un tableau de synthèse des constats"
      en: "A findings summary table"
    file: summary.md
    lang: markdown
    kind: neutral
    code: |
      ## Findings summary

      | ID | Finding | Severity | CVSS | Status |
      |----|---------|----------|------|--------|
      | F-01 | SQL injection in login | High | 8.6 | Open |
      | F-02 | Reflected XSS in search | Medium | 6.1 | Open |
      | F-03 | Verbose server banner | Low | 3.1 | Open |
      | F-04 | Missing HTTPS redirect | Medium | 5.3 | Open |

      Recommended order of remediation: F-01 first (highest impact), then the
      two Medium findings, then the Low informational item.
    note:
      fr: "La synthèse permet au lecteur de voir en un coup d'œil le volume et la gravité des failles, et de prioriser. Elle précède toujours les constats détaillés."
      en: "The summary lets the reader see at a glance the volume and severity of the flaws, and prioritise. It always precedes the detailed findings."

mistake:
  fr: |
    **Livrer un dump d'outil comme rapport.** Coller la sortie brute de Nmap ou de sqlmap n'est pas un rapport :
    le client ne sait ni quelle est la gravité, ni quoi corriger en premier, ni comment. Autre erreur fréquente :
    oublier le résumé exécutif, si bien que la direction ne comprend pas le risque et ne débloque pas de budget.
    Un rapport doit **traduire** la technique en risque métier et en actions concrètes, pas recopier des logs.
  en: |
    **Delivering a tool dump as a report.** Pasting raw Nmap or sqlmap output is not a report: the client knows
    neither the severity, nor what to fix first, nor how. Another common mistake: skipping the executive
    summary, so management never grasps the risk and never releases budget. A report must **translate** the
    technical into business risk and concrete actions, not copy logs.

bestPractice:
  fr: |
    - **Écrivez pour deux publics** : un résumé exécutif sans jargon, des constats détaillés pour les techniciens.
    - **Chaque constat est actionnable** : preuve minimale, impact métier, remédiation concrète.
    - **Scorez avec CVSS** pour donner une priorité objective et un langage commun.
    - **Triez par sévérité** dans une synthèse, pour guider l'ordre des corrections.
    - **Restez proportionné** : prouvez la faille sans voler de données réelles ni dépasser le périmètre.
  en: |
    - **Write for two audiences**: a jargon-free executive summary, detailed findings for technicians.
    - **Every finding is actionable**: minimal proof, business impact, concrete remediation.
    - **Score with CVSS** to give an objective priority and a common language.
    - **Sort by severity** in a summary, to guide the order of fixes.
    - **Stay proportionate**: prove the flaw without stealing real data or exceeding scope.

exercise:
  statement:
    fr: |
      Pendant un test autorisé sur `lab.example.com`, vous trouvez un **XSS réfléchi** dans le paramètre `q` de
      la page de recherche : la valeur est renvoyée dans la page sans encodage. Un attaquant doit convaincre la
      victime de cliquer sur un lien, et peut alors exécuter du JavaScript dans son navigateur.

      Rédigez un constat court (titre, sévérité approximative, description, impact, remédiation). Vous pouvez
      estimer le CVSS autour de 6.1 (Medium).
    en: |
      During an authorised test on `lab.example.com`, you find a **reflected XSS** in the `q` parameter of the
      search page: the value is echoed back into the page without encoding. An attacker must convince the
      victim to click a link, and can then run JavaScript in their browser.

      Write a short finding (title, approximate severity, description, impact, remediation). You may estimate
      the CVSS around 6.1 (Medium).
  solution:
    file: finding_xss.md
    lang: markdown
    code: |
      ## F-02  Reflected XSS in the search page

      | Field | Value |
      |---|---|
      | Severity | Medium (CVSS ~6.1) |
      | CVSS vector | CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N |
      | Affected | https://lab.example.com/search  (parameter: q) |

      ### Description
      The value of the `q` parameter is reflected into the HTML response without
      output encoding, allowing injection of arbitrary HTML/JavaScript.

      ### Impact
      An attacker who lures a victim to a crafted link can run JavaScript in the
      victim's session: steal cookies, perform actions as the user, or deface the page.

      ### Remediation
      HTML-encode all user input on output; add a Content-Security-Policy header.
    note:
      fr: "Notez l'`UI:R` du vecteur (interaction requise : la victime doit cliquer), ce qui abaisse le score. La remédiation combine encodage en sortie et CSP."
      en: "Note the vector's `UI:R` (user interaction required: the victim must click), which lowers the score. Remediation combines output encoding and CSP."

quiz:
  - q:
      fr: "Quelle section s'adresse d'abord à la direction ?"
      en: "Which section is aimed first at management?"
    options:
      fr:
        - "Le résumé exécutif"
        - "Les annexes de commandes"
        - "La preuve technique détaillée"
        - "La liste des outils"
      en:
        - "The executive summary"
        - "The command appendices"
        - "The detailed technical proof"
        - "The list of tools"
    answer: 0
    why:
      fr: "Le résumé exécutif traduit le risque en langage métier, sans jargon, pour les décideurs."
      en: "The executive summary translates risk into business language, jargon-free, for decision-makers."
  - q:
      fr: "Un score CVSS de 9.2 correspond à quelle catégorie ?"
      en: "A CVSS score of 9.2 maps to which category?"
    options:
      fr:
        - "Low"
        - "Medium"
        - "High"
        - "Critical"
      en:
        - "Low"
        - "Medium"
        - "High"
        - "Critical"
    answer: 3
    why:
      fr: "La plage 9.0-10.0 correspond à la sévérité Critical dans CVSS v3.1."
      en: "The 9.0-10.0 range corresponds to Critical severity in CVSS v3.1."
  - q:
      fr: "Que doit obligatoirement contenir un constat détaillé en plus de la description ?"
      en: "Besides the description, what must a detailed finding contain?"
    options:
      fr:
        - "Le salaire de l'équipe"
        - "Une preuve, l'impact et une remédiation"
        - "Uniquement une capture d'écran"
        - "La version du noyau Linux du testeur"
      en:
        - "The team's salary"
        - "A proof, the impact and a remediation"
        - "Only a screenshot"
        - "The tester's Linux kernel version"
    answer: 1
    why:
      fr: "Un constat utile répond à : quoi/où, preuve reproductible, impact métier, et comment corriger."
      en: "A useful finding answers: what/where, a reproducible proof, business impact, and how to fix it."
  - q:
      fr: "Dans un vecteur CVSS, que signifie `AV:N` ?"
      en: "In a CVSS vector, what does `AV:N` mean?"
    options:
      fr:
        - "Antivirus activé"
        - "Vecteur d'attaque : réseau (exploitable à distance)"
        - "Aucune vulnérabilité"
        - "Accès physique requis"
      en:
        - "Antivirus enabled"
        - "Attack Vector: Network (remotely exploitable)"
        - "No vulnerability"
        - "Physical access required"
    answer: 1
    why:
      fr: "`AV:N` indique un vecteur d'attaque réseau : la faille est exploitable à distance, ce qui augmente la gravité."
      en: "`AV:N` denotes a Network attack vector: the flaw is remotely exploitable, which raises severity."
  - q:
      fr: "Pourquoi coller la sortie brute d'un outil ne fait pas un bon rapport ?"
      en: "Why does pasting a tool's raw output not make a good report?"
    options:
      fr:
        - "Parce que c'est trop court"
        - "Parce que le client ne sait ni la gravité, ni quoi corriger, ni comment"
        - "Parce que les outils sont payants"
        - "Parce que c'est interdit par la loi"
      en:
        - "Because it is too short"
        - "Because the client knows neither severity, nor what to fix, nor how"
        - "Because tools are paid"
        - "Because it is forbidden by law"
    answer: 1
    why:
      fr: "Un rapport traduit la technique en risque métier et en actions ; un dump brut ne priorise ni ne corrige rien."
      en: "A report translates the technical into business risk and actions; a raw dump neither prioritises nor fixes anything."
