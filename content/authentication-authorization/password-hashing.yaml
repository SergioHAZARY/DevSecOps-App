description:
  fr: "Stocker les mots de passe correctement : pourquoi MD5 et SHA-256 ne suffisent pas, rôle du sel et du poivre, Bcrypt, Argon2id et mise à niveau à la connexion."
  en: "Store passwords correctly: why MD5 and SHA-256 are not enough, the role of salt and pepper, Bcrypt, Argon2id and upgrade-on-login."
duration: 35

intro:
  fr: |
    Une base de données finit toujours par fuiter un jour : sauvegarde oubliée, injection SQL, compte
    administrateur compromis. La question n'est donc pas « si » mais « que trouvera l'attaquant ? ».
    S'il y trouve les mots de passe en clair, tous les comptes sont perdus, y compris sur les autres
    sites où vos utilisateurs réutilisent le même mot de passe.

    On ne stocke donc jamais un mot de passe, seulement son **empreinte** (*hash*) : le résultat d'une
    fonction à sens unique. Imaginez un hachoir à viande : il est facile de transformer un steak en
    viande hachée, impossible de refaire le steak. Pour vérifier un mot de passe, on hache ce que
    l'utilisateur tape et on compare les deux résultats.

    Mais tous les hachoirs ne se valent pas. Dans cette leçon, vous allez casser en une fraction de
    seconde des empreintes SHA-256, comprendre le rôle du **sel**, du **coût** et du **poivre**, puis
    utiliser les fonctions prévues pour cet usage : **Argon2id** et **Bcrypt**.
  en: |
    A database always leaks some day: a forgotten backup, a SQL injection, a compromised admin
    account. The question is therefore not "if" but "what will the attacker find?". If they find
    clear-text passwords, every account is lost, including on the other sites where your users reuse
    the same password.

    So a password is never stored, only its **hash**: the output of a one-way function. Picture a meat
    grinder: turning a steak into minced meat is easy, rebuilding the steak is impossible. To check a
    password, you hash what the user types and compare the two results.

    But not all grinders are equal. In this lesson you will crack SHA-256 hashes in a fraction of a
    second, understand the role of the **salt**, the **cost** and the **pepper**, then use the
    functions designed for this job: **Argon2id** and **Bcrypt**.

sections:
  - heading:
      fr: "Pourquoi MD5, SHA-1 ou SHA-256 seuls ne conviennent pas"
      en: "Why MD5, SHA-1 or SHA-256 alone are not suitable"
    body:
      fr: |
        SHA-256 est une excellente fonction de hachage... pour vérifier l'intégrité d'un fichier. Elle
        est conçue pour être **rapide**, et c'est précisément le problème : une seule carte graphique
        teste des **milliards** de mots de passe candidats par seconde. L'attaquant ne « déchiffre »
        rien, il essaie des dictionnaires de mots de passe courants et compare.

        Deux défauts s'ajoutent quand on hache sans précaution :

        - **Pas de sel** : deux utilisateurs avec le même mot de passe ont la même empreinte, et des
          tables précalculées (*rainbow tables*) donnent la réponse instantanément.
        - **Pas de coût réglable** : impossible de ralentir le calcul quand le matériel progresse.

        Une fonction de hachage **de mots de passe** corrige ces trois points :

        1. Un **sel** aléatoire, unique par utilisateur, stocké à côté de l'empreinte. Il n'est pas
           secret : il rend chaque empreinte différente et les tables précalculées inutiles.
        2. Un **facteur de coût** : le calcul prend volontairement 100 à 500 ms. Invisible pour un
           utilisateur qui se connecte, ruineux pour un attaquant qui doit essayer des milliards de
           candidats.
        3. Pour Argon2 et scrypt, un coût en **mémoire** : chaque essai consomme des dizaines de Mio,
           ce qui neutralise l'avantage des cartes graphiques.
      en: |
        SHA-256 is an excellent hash function... for checking the integrity of a file. It is designed
        to be **fast**, and that is exactly the problem: a single graphics card tests **billions** of
        candidate passwords per second. The attacker does not "decrypt" anything, they try
        dictionaries of common passwords and compare.

        Two more defects appear when hashing carelessly:

        - **No salt**: two users with the same password get the same hash, and precomputed tables
          (*rainbow tables*) give the answer instantly.
        - **No tunable cost**: there is no way to slow the computation down as hardware improves.

        A **password** hashing function fixes these three points:

        1. A random **salt**, unique per user, stored next to the hash. It is not secret: it makes
           every hash different and precomputed tables useless.
        2. A **cost factor**: the computation deliberately takes 100 to 500 ms. Invisible to a user
           who logs in, ruinous for an attacker who must try billions of candidates.
        3. For Argon2 and scrypt, a **memory** cost: each attempt consumes tens of MiB, which
           neutralises the advantage of graphics cards.
  - heading:
      fr: "Quel algorithme, avec quels paramètres ?"
      en: "Which algorithm, with which parameters?"
    body:
      fr: |
        Les valeurs ci-dessous sont les minimums recommandés par l'*OWASP Password Storage Cheat
        Sheet*. Ce sont des planchers : augmentez-les tant que la connexion reste sous la seconde sur
        votre serveur.

        | Algorithme | Paramètres minimums | Quand le choisir |
        |---|---|---|
        | **Argon2id** | mémoire 19 Mio (`m=19456`), 2 itérations (`t=2`), parallélisme 1 (`p=1`) - ou `m=46 Mio, t=1, p=1` | Premier choix pour tout nouveau projet |
        | **scrypt** | `N=2^17`, `r=8`, `p=1` | Si Argon2id n'est pas disponible |
        | **bcrypt** | coût (*work factor*) d'au moins 10, souvent 12 | Systèmes existants ; limite de 72 octets en entrée |
        | **PBKDF2-HMAC-SHA256** | 600 000 itérations | Quand une conformité FIPS-140 est exigée |

        Une empreinte moderne est **auto-descriptive** : elle embarque l'algorithme, les paramètres
        et le sel.

        ```text
        $argon2id$v=19$m=19456,t=2,p=1$Q2vFqz0tHVkRVWhqvoKI+g$Q6AzybF2BzAmUnWq+/qGU0U0bEV6UZMmbAQMG9eJMnk
        $2b$12$eSuhcOT9MLQ7yTL6cxt/qeyrkXZdYdUYHKKw/zv7EhhPQN5IAQeL2
        ```

        La première ligne se lit : Argon2id, version 19, 19 456 Kio de mémoire, 2 itérations,
        1 fil, puis le sel et l'empreinte en Base64. La seconde : bcrypt (`2b`), coût 12
        (2^12 = 4 096 tours), puis 22 caractères de sel et 31 d'empreinte. Une seule colonne en base
        suffit, et le coût peut évoluer sans migration de schéma.
      en: |
        The values below are the minimums recommended by the *OWASP Password Storage Cheat Sheet*.
        They are floors: raise them as long as login stays under one second on your server.

        | Algorithm | Minimum parameters | When to choose it |
        |---|---|---|
        | **Argon2id** | 19 MiB of memory (`m=19456`), 2 iterations (`t=2`), parallelism 1 (`p=1`) - or `m=46 MiB, t=1, p=1` | First choice for any new project |
        | **scrypt** | `N=2^17`, `r=8`, `p=1` | If Argon2id is not available |
        | **bcrypt** | work factor of at least 10, often 12 | Existing systems; 72-byte input limit |
        | **PBKDF2-HMAC-SHA256** | 600,000 iterations | When FIPS-140 compliance is required |

        A modern hash is **self-describing**: it embeds the algorithm, the parameters and the salt.

        ```text
        $argon2id$v=19$m=19456,t=2,p=1$Q2vFqz0tHVkRVWhqvoKI+g$Q6AzybF2BzAmUnWq+/qGU0U0bEV6UZMmbAQMG9eJMnk
        $2b$12$eSuhcOT9MLQ7yTL6cxt/qeyrkXZdYdUYHKKw/zv7EhhPQN5IAQeL2
        ```

        The first line reads: Argon2id, version 19, 19,456 KiB of memory, 2 iterations, 1 thread,
        then the salt and the hash in Base64. The second: bcrypt (`2b`), cost 12 (2^12 = 4,096
        rounds), then 22 characters of salt and 31 of hash. A single database column is enough, and
        the cost can evolve without a schema migration.
  - heading:
      fr: "Poivre et mise à niveau à la connexion"
      en: "Pepper and upgrade-on-login"
    body:
      fr: |
        Le **poivre** (*pepper*) est un secret **commun à tous les utilisateurs**, conservé **hors de
        la base** : coffre-fort de secrets, KMS ou variable injectée au déploiement. On l'applique en
        général avec un HMAC avant la fonction lente. Si l'attaquant ne vole *que* la base (cas
        typique d'une injection SQL), il lui manque le poivre et il ne peut même pas commencer à
        tester des candidats.

        | | Sel | Poivre |
        |---|---|---|
        | Secret ? | Non | Oui |
        | Unique par utilisateur ? | Oui | Non, un seul pour l'application |
        | Stocké où ? | Dans la base, avec l'empreinte | Hors de la base (coffre, KMS) |
        | Protège contre | Tables précalculées, empreintes identiques | Vol de la base seule |

        La **mise à niveau à la connexion** (*upgrade-on-login*) permet de changer d'algorithme ou
        d'augmenter le coût sans forcer tout le monde à changer de mot de passe : le serveur ne
        connaît le mot de passe en clair qu'à un seul instant, quand l'utilisateur se connecte. Si la
        vérification réussit et que l'empreinte stockée est ancienne (MD5, bcrypt coût 8, anciens
        paramètres), on recalcule l'empreinte avec les réglages actuels et on remplace l'ancienne.
      en: |
        The **pepper** is a secret **shared by all users**, kept **outside the database**: a secrets
        vault, a KMS or a variable injected at deploy time. It is usually applied with an HMAC before
        the slow function. If the attacker steals *only* the database (the typical case of a SQL
        injection), the pepper is missing and they cannot even start testing candidates.

        | | Salt | Pepper |
        |---|---|---|
        | Secret? | No | Yes |
        | Unique per user? | Yes | No, one for the whole application |
        | Stored where? | In the database, with the hash | Outside the database (vault, KMS) |
        | Protects against | Precomputed tables, identical hashes | Theft of the database alone |

        **Upgrade-on-login** lets you change algorithm or raise the cost without forcing everyone to
        change their password: the server knows the clear-text password at one moment only, when the
        user logs in. If verification succeeds and the stored hash is outdated (MD5, bcrypt cost 8,
        old parameters), the hash is recomputed with the current settings and replaces the old one.

examples:
  - title:
      fr: "Vulnérable : des empreintes SHA-256 sans sel, cassées instantanément"
      en: "Vulnerable: unsalted SHA-256 hashes, cracked instantly"
    file: fast_hash_vulnerable.py
    lang: python
    kind: vulnerable
    code: |
      import hashlib
      import time

      # A leaked "users" table: passwords stored as unsalted SHA-256 (MD5 would be even worse)
      leaked = {
          "alice": hashlib.sha256(b"sunshine").hexdigest(),
          "bob": hashlib.sha256(b"P@ssw0rd").hexdigest(),
          "carol": hashlib.sha256(b"sunshine").hexdigest(),
      }

      # Problem 1: no salt, so identical passwords give identical hashes
      print("alice and carol share a hash:", leaked["alice"] == leaked["carol"])

      # Problem 2: SHA-256 is designed to be FAST, so guessing is cheap
      wordlist = ["123456", "password", "qwerty", "sunshine", "letmein", "P@ssw0rd"]
      lookup = {hashlib.sha256(w.encode()).hexdigest(): w for w in wordlist}
      for user, digest in leaked.items():
          print(f"{user:5} -> {lookup.get(digest, 'not found')}")

      # How many guesses per second on ONE CPU core, in pure Python?
      start = time.perf_counter()
      for i in range(200_000):
          hashlib.sha256(str(i).encode()).hexdigest()
      elapsed = time.perf_counter() - start
      print("more than 100,000 guesses per second:", 200_000 / elapsed > 100_000)
    output: |
      alice and carol share a hash: True
      alice -> sunshine
      bob   -> P@ssw0rd
      carol -> sunshine
      more than 100,000 guesses per second: True
    note:
      fr: "Les trois mots de passe tombent avec un dictionnaire de six mots, et Python seul dépasse déjà 100 000 essais par seconde. Un outil spécialisé comme hashcat sur une carte graphique en fait des milliards : `P@ssw0rd` n'a aucune chance."
      en: "All three passwords fall to a six-word dictionary, and plain Python already exceeds 100,000 guesses per second. A specialised tool such as hashcat on a graphics card does billions: `P@ssw0rd` stands no chance."

  - title:
      fr: "Corrigé (bibliothèque standard) : sel unique, 600 000 itérations, comparaison à temps constant"
      en: "Fixed (standard library): unique salt, 600,000 iterations, constant-time comparison"
    file: pbkdf2_secure.py
    lang: python
    kind: secure
    code: |
      import hashlib
      import hmac
      import os

      ITERATIONS = 600_000  # OWASP minimum for PBKDF2-HMAC-SHA256


      def hash_password(password, salt=None):
          # A unique random salt per user: same password, different hash
          salt = salt or os.urandom(16)
          digest = hashlib.pbkdf2_hmac("sha256", password.encode(), salt, ITERATIONS)
          # Store algorithm, cost, salt and hash together: the cost can be raised later
          return f"pbkdf2_sha256${ITERATIONS}${salt.hex()}${digest.hex()}"


      def verify_password(password, stored):
          _algo, iterations, salt_hex, digest_hex = stored.split("$")
          candidate = hashlib.pbkdf2_hmac(
              "sha256", password.encode(), bytes.fromhex(salt_hex), int(iterations)
          )
          # Constant-time comparison: no timing side channel
          return hmac.compare_digest(candidate, bytes.fromhex(digest_hex))


      alice = hash_password("sunshine")
      carol = hash_password("sunshine")

      print("format                     :", alice.split("$")[0], alice.split("$")[1])
      print("same password, same hash   :", alice == carol)
      print("correct password accepted  :", verify_password("sunshine", alice))
      print("wrong password rejected    :", not verify_password("Sunshine", alice))

      # Demo only: a fixed salt gives a reproducible value (never do this in production)
      fixed = hash_password("sunshine", salt=bytes.fromhex("00112233445566778899aabbccddeeff"))
      print("stored value (fixed salt)  :", fixed[:70] + "...")
    output: |
      format                     : pbkdf2_sha256 600000
      same password, same hash   : False
      correct password accepted  : True
      wrong password rejected    : True
      stored value (fixed salt)  : pbkdf2_sha256$600000$00112233445566778899aabbccddeeff$42006dd8286216eb...
    note:
      fr: "Alice et Carol ont le même mot de passe mais des empreintes différentes grâce au sel, et chaque essai coûte désormais 600 000 calculs HMAC au lieu d'un seul. PBKDF2 est présent dans toute bibliothèque standard ; préférez Argon2id quand vous pouvez installer une dépendance."
      en: "Alice and Carol have the same password but different hashes thanks to the salt, and each guess now costs 600,000 HMAC computations instead of one. PBKDF2 ships with every standard library; prefer Argon2id when you can install a dependency."

  - title:
      fr: "scrypt et poivre : une fonction gourmande en mémoire, un secret hors de la base"
      en: "scrypt and pepper: a memory-hard function, a secret outside the database"
    file: scrypt_pepper.py
    lang: python
    kind: secure
    code: |
      import hashlib
      import hmac
      import os

      # The pepper is a secret shared by all users, kept OUTSIDE the database
      # (vault, KMS, environment variable injected at deploy time).
      PEPPER = os.environ.get("PASSWORD_PEPPER", "demo-pepper-change-me").encode()

      # OWASP parameters for scrypt: N=2^17, r=8, p=1 (about 128 MiB of RAM per hash)
      N, R, P = 2**17, 8, 1


      def hash_password(password):
          salt = os.urandom(16)
          # Pepper applied with HMAC before the slow, memory-hard function
          peppered = hmac.new(PEPPER, password.encode(), hashlib.sha256).digest()
          digest = hashlib.scrypt(peppered, salt=salt, n=N, r=R, p=P, maxmem=2**28, dklen=32)
          return f"scrypt${N}${R}${P}${salt.hex()}${digest.hex()}"


      def verify_password(password, stored, pepper=PEPPER):
          _algo, n, r, p, salt_hex, digest_hex = stored.split("$")
          peppered = hmac.new(pepper, password.encode(), hashlib.sha256).digest()
          candidate = hashlib.scrypt(
              peppered, salt=bytes.fromhex(salt_hex), n=int(n), r=int(r), p=int(p),
              maxmem=2**28, dklen=32,
          )
          return hmac.compare_digest(candidate, bytes.fromhex(digest_hex))


      stored = hash_password("correct horse battery staple")
      print("parameters                  :", stored.split("$")[:4])
      print("right password, right pepper:", verify_password("correct horse battery staple", stored))
      print("wrong password              :", verify_password("correct horse", stored))
      # An attacker who only stole the database does not know the pepper
      print("right password, no pepper   :", verify_password("correct horse battery staple", stored, b""))
    output: |
      parameters                  : ['scrypt', '131072', '8', '1']
      right password, right pepper: True
      wrong password              : False
      right password, no pepper   : False
    note:
      fr: "`maxmem` doit être relevé car `N=2^17` et `r=8` demandent environ 128 Mio. La dernière ligne montre l'intérêt du poivre : même avec le bon mot de passe, l'empreinte volée est invérifiable sans le secret resté dans le coffre. `hashlib.scrypt` nécessite un Python compilé avec OpenSSL (c'est le cas des distributions officielles)."
      en: "`maxmem` must be raised because `N=2^17` and `r=8` need about 128 MiB. The last line shows the value of the pepper: even with the right password, the stolen hash cannot be verified without the secret that stayed in the vault. `hashlib.scrypt` requires a Python built with OpenSSL (official distributions are)."

  - title:
      fr: "Production en Python : Argon2id avec argon2-cffi et migration depuis bcrypt"
      en: "Production in Python: Argon2id with argon2-cffi and migration from bcrypt"
    file: passwords.py
    lang: python
    kind: secure
    code: |
      # pip install argon2-cffi bcrypt
      import bcrypt
      from argon2 import PasswordHasher
      from argon2.exceptions import InvalidHashError, VerificationError

      # OWASP minimum for Argon2id: 19 MiB of memory, 2 iterations, 1 thread.
      # memory_cost is expressed in KiB. Raise the values if your server allows it.
      ph = PasswordHasher(time_cost=2, memory_cost=19456, parallelism=1)

      # In a real application this is the "users" table
      USERS = {
          # Legacy account, still hashed with bcrypt (cost 12)
          "bob": bcrypt.hashpw(b"old-but-gold", bcrypt.gensalt(rounds=12)).decode(),
      }


      def register(username, password):
          # The salt is generated by the library and embedded in the returned string
          USERS[username] = ph.hash(password)


      def login(username, password):
          stored = USERS.get(username)
          if stored is None:
              # Hash anyway so that unknown users take as long as known ones
              ph.hash(password)
              return False

          if stored.startswith("$2"):
              # Legacy bcrypt hash: verify with bcrypt, then upgrade to Argon2id.
              # bcrypt only uses the first 72 bytes of its input.
              if not bcrypt.checkpw(password.encode()[:72], stored.encode()):
                  return False
              USERS[username] = ph.hash(password)
              return True

          try:
              ph.verify(stored, password)  # raises on mismatch, constant-time inside
          except (VerificationError, InvalidHashError):
              return False

          # Parameters were raised since this hash was created? Re-hash now.
          if ph.check_needs_rehash(stored):
              USERS[username] = ph.hash(password)
          return True


      register("alice", "sunshine-on-leith-1988")
      print("alice hash starts with:", USERS["alice"][:31])
      print("alice, good password  :", login("alice", "sunshine-on-leith-1988"))
      print("alice, bad password   :", login("alice", "sunshine"))
      print("bob before login      :", USERS["bob"][:7])
      print("bob, good password    :", login("bob", "old-but-gold"))
      print("bob after login       :", USERS["bob"][:31])
    output: |
      alice hash starts with: $argon2id$v=19$m=19456,t=2,p=1$
      alice, good password  : True
      alice, bad password   : False
      bob before login      : $2b$12$
      bob, good password    : True
      bob after login       : $argon2id$v=19$m=19456,t=2,p=1$
    note:
      fr: "`PasswordHasher` gère le sel, le format et la comparaison. Regardez Bob : son empreinte bcrypt est remplacée par une empreinte Argon2id dès sa première connexion réussie, sans qu'il s'en aperçoive. `check_needs_rehash` fait la même chose quand vous augmentez les paramètres."
      en: "`PasswordHasher` handles the salt, the format and the comparison. Look at Bob: his bcrypt hash is replaced by an Argon2id hash on his first successful login, without him noticing. `check_needs_rehash` does the same when you raise the parameters."

  - title:
      fr: "Production en Node.js : argon2 et bcrypt"
      en: "Production in Node.js: argon2 and bcrypt"
    file: passwords.js
    lang: javascript
    kind: secure
    code: |
      // npm install argon2 bcrypt
      const argon2 = require("argon2");
      const bcrypt = require("bcrypt");

      // OWASP minimum for Argon2id (memoryCost is in KiB)
      const ARGON2_OPTIONS = {
        type: argon2.argon2id,
        memoryCost: 19456,
        timeCost: 2,
        parallelism: 1,
      };

      async function hashPassword(password) {
        // Salt generated automatically and stored inside the encoded hash
        return argon2.hash(password, ARGON2_OPTIONS);
      }

      // Returns { ok, newHash }: newHash is set when the stored hash must be replaced
      async function verifyPassword(password, storedHash) {
        if (storedHash.startsWith("$2")) {
          // Legacy bcrypt account: verify, then upgrade on login
          const ok = await bcrypt.compare(password, storedHash);
          return { ok, newHash: ok ? await hashPassword(password) : null };
        }
        const ok = await argon2.verify(storedHash, password);
        // Cost raised since the hash was created? Re-hash while we have the password
        const outdated = ok && argon2.needsRehash(storedHash, ARGON2_OPTIONS);
        return { ok, newHash: outdated ? await hashPassword(password) : null };
      }

      async function main() {
        const legacy = await bcrypt.hash("old-but-gold", 12); // 12 = cost factor
        const modern = await hashPassword("sunshine-on-leith-1988");

        console.log("bcrypt  :", legacy.slice(0, 7));
        console.log("argon2id:", modern.slice(0, 31));

        const first = await verifyPassword("old-but-gold", legacy);
        console.log("legacy login ok:", first.ok, "- upgraded to:", first.newHash.slice(0, 9));

        const wrong = await verifyPassword("sunshine", modern);
        console.log("wrong password :", wrong.ok);
      }

      main();
    output: |
      bcrypt  : $2b$12$
      argon2id: $argon2id$v=19$m=19456,t=2,p=1$
      legacy login ok: true - upgraded to: $argon2id
      wrong password : false
    note:
      fr: "Même logique qu'en Python : la bibliothèque produit une chaîne auto-descriptive, et la vérification renvoie la nouvelle empreinte à enregistrer quand l'ancienne est dépassée. Utilisez toujours les versions asynchrones (`hash`, `compare`, `verify`) : un calcul de 200 ms synchrone bloquerait tout le serveur Node.js."
      en: "Same logic as in Python: the library produces a self-describing string, and verification returns the new hash to save when the old one is outdated. Always use the asynchronous versions (`hash`, `compare`, `verify`): a synchronous 200 ms computation would block the whole Node.js server."

mistake:
  fr: |
    **« On hache en SHA-256 avec un sel, donc c'est sécurisé. »**

    Le sel empêche les tables précalculées, mais il ne ralentit rien : `sha256(sel + mot_de_passe)`
    se calcule toujours des milliards de fois par seconde sur une carte graphique, et le sel est
    stocké juste à côté de l'empreinte. Les variantes maison (`md5(sha1(mot_de_passe))`, double
    hachage, sel identique pour tous) n'y changent rien.

    Erreur voisine : **chiffrer** les mots de passe (AES) au lieu de les hacher. Un chiffrement est
    réversible : celui qui vole la clé, souvent rangée à côté de l'application, récupère tous les
    mots de passe d'un coup.
  en: |
    **"We hash with SHA-256 and a salt, so it is secure."**

    The salt defeats precomputed tables, but it slows nothing down: `sha256(salt + password)` is still
    computed billions of times per second on a graphics card, and the salt is stored right next to
    the hash. Home-made variants (`md5(sha1(password))`, double hashing, the same salt for everyone)
    change nothing.

    A neighbouring mistake: **encrypting** passwords (AES) instead of hashing them. Encryption is
    reversible: whoever steals the key, often stored next to the application, recovers every password
    at once.

bestPractice:
  fr: |
    - **Utilisez Argon2id** (au minimum `m=19456, t=2, p=1`) ; à défaut scrypt, bcrypt (coût 10 ou plus) ou PBKDF2 (600 000 itérations).
    - **Laissez la bibliothèque gérer le sel et le format** : n'écrivez pas votre propre schéma en production.
    - **Mesurez puis ajustez le coût** pour viser 100 à 500 ms par vérification sur votre matériel, et relevez-le au fil des années.
    - **Ajoutez un poivre** stocké dans un coffre-fort de secrets, jamais dans la base ni dans Git.
    - **Mettez à niveau à la connexion** les anciennes empreintes (`check_needs_rehash`, `needsRehash`).
    - **Comparez à temps constant** (`hmac.compare_digest`) et limitez le débit des tentatives de connexion.
    - **Dans le pipeline** : une règle SAST (Bandit `B324`, Semgrep) signale `hashlib.md5` et `hashlib.sha1` utilisés pour la sécurité, et l'analyse SCA surveille les CVE de vos bibliothèques de hachage.
  en: |
    - **Use Argon2id** (at least `m=19456, t=2, p=1`); otherwise scrypt, bcrypt (cost 10 or more) or PBKDF2 (600,000 iterations).
    - **Let the library handle the salt and the format**: do not write your own scheme in production.
    - **Measure, then tune the cost** to aim for 100 to 500 ms per verification on your hardware, and raise it over the years.
    - **Add a pepper** stored in a secrets vault, never in the database or in Git.
    - **Upgrade on login** the outdated hashes (`check_needs_rehash`, `needsRehash`).
    - **Compare in constant time** (`hmac.compare_digest`) and rate-limit login attempts.
    - **In the pipeline**: a SAST rule (Bandit `B324`, Semgrep) flags `hashlib.md5` and `hashlib.sha1` used for security, and SCA watches the CVEs of your hashing libraries.

exercise:
  statement:
    fr: |
      Vous héritez d'une application dont la table `users` contient des empreintes **MD5 sans sel**
      (32 caractères hexadécimaux). Impossible de demander à tous les utilisateurs de changer de mot
      de passe aujourd'hui.

      Avec la bibliothèque standard de Python uniquement, écrivez une fonction `login(username, password)` qui :

      1. vérifie les anciennes empreintes MD5 **et** les nouvelles empreintes au format
         `pbkdf2_sha256$iterations$sel$empreinte` ;
      2. remplace l'empreinte MD5 par une empreinte PBKDF2 (600 000 itérations, sel aléatoire de
         16 octets) dès qu'une connexion réussit ;
      3. compare toujours à temps constant.

      Point de départ :

      ```python
      import hashlib
      users = {"alice": hashlib.md5(b"sunshine").hexdigest()}
      ```
    en: |
      You inherit an application whose `users` table contains **unsalted MD5** hashes (32 hexadecimal
      characters). Asking every user to change their password today is not an option.

      Using only the Python standard library, write a function `login(username, password)` that:

      1. verifies the old MD5 hashes **and** the new hashes in the format
         `pbkdf2_sha256$iterations$salt$hash`;
      2. replaces the MD5 hash with a PBKDF2 hash (600,000 iterations, random 16-byte salt) as soon
         as a login succeeds;
      3. always compares in constant time.

      Starting point:

      ```python
      import hashlib
      users = {"alice": hashlib.md5(b"sunshine").hexdigest()}
      ```
  solution:
    file: upgrade_on_login.py
    lang: python
    code: |
      import hashlib
      import hmac
      import os

      ITERATIONS = 600_000

      # Legacy database: unsalted MD5 hex digests (32 characters)
      users = {"alice": hashlib.md5(b"sunshine").hexdigest()}


      def new_hash(password):
          salt = os.urandom(16)
          digest = hashlib.pbkdf2_hmac("sha256", password.encode(), salt, ITERATIONS)
          return f"pbkdf2_sha256${ITERATIONS}${salt.hex()}${digest.hex()}"


      def login(username, password):
          stored = users.get(username)
          if stored is None:
              return False

          if not stored.startswith("pbkdf2_sha256$"):
              # Legacy path: check the old MD5 hash one last time
              legacy = hashlib.md5(password.encode()).hexdigest()
              if not hmac.compare_digest(legacy, stored):
                  return False
              # Upgrade-on-login: we know the clear password only now, so re-hash it
              users[username] = new_hash(password)
              return True

          _algo, iterations, salt_hex, digest_hex = stored.split("$")
          candidate = hashlib.pbkdf2_hmac(
              "sha256", password.encode(), bytes.fromhex(salt_hex), int(iterations)
          )
          return hmac.compare_digest(candidate, bytes.fromhex(digest_hex))


      print("before :", users["alice"][:14], "(MD5)")
      print("login 1:", login("alice", "sunshine"))
      print("after  :", users["alice"][:20], "(upgraded)")
      print("login 2:", login("alice", "sunshine"))
      print("wrong  :", login("alice", "hunter2"))
    note:
      fr: "Le script affiche `True`, puis une empreinte `pbkdf2_sha256$600000`, puis `True` et `False`. Les comptes qui ne se reconnectent jamais gardent leur MD5 : après quelques mois, invalidez-les et imposez une réinitialisation du mot de passe."
      en: "The script prints `True`, then a `pbkdf2_sha256$600000` hash, then `True` and `False`. Accounts that never log in again keep their MD5: after a few months, invalidate them and force a password reset."

quiz:
  - q:
      fr: "Pourquoi SHA-256 seul est-il un mauvais choix pour stocker des mots de passe ?"
      en: "Why is SHA-256 alone a poor choice for storing passwords?"
    options:
      fr:
        - "Il est cassé : on peut inverser l'empreinte mathématiquement"
        - "Son empreinte est trop courte pour une base de données"
        - "Il est trop rapide : un attaquant teste des milliards de candidats par seconde"
        - "Il n'est pas disponible dans les bibliothèques standard"
      en:
        - "It is broken: the hash can be reversed mathematically"
        - "Its output is too short for a database"
        - "It is too fast: an attacker tests billions of candidates per second"
        - "It is not available in standard libraries"
    answer: 2
    why:
      fr: "SHA-256 n'est pas cassé, mais il est conçu pour la vitesse. Une fonction de hachage de mots de passe doit au contraire être lente et, si possible, gourmande en mémoire."
      en: "SHA-256 is not broken, but it is designed for speed. A password hashing function must on the contrary be slow and, if possible, memory-hungry."
  - q:
      fr: "À quoi sert le sel ?"
      en: "What is the salt for?"
    options:
      fr:
        - "À rendre chaque empreinte unique, même pour deux mots de passe identiques"
        - "À chiffrer le mot de passe avant de l'envoyer au serveur"
        - "À remplacer le mot de passe si l'utilisateur l'oublie"
        - "À garder secrète la méthode de hachage"
      en:
        - "To make every hash unique, even for two identical passwords"
        - "To encrypt the password before sending it to the server"
        - "To replace the password if the user forgets it"
        - "To keep the hashing method secret"
    answer: 0
    why:
      fr: "Le sel est aléatoire, unique par utilisateur et non secret. Il rend les tables précalculées inutiles et empêche de repérer les mots de passe identiques."
      en: "The salt is random, unique per user and not secret. It makes precomputed tables useless and prevents spotting identical passwords."
  - q:
      fr: "Quels paramètres minimums l'OWASP recommande-t-il pour Argon2id ?"
      en: "Which minimum parameters does OWASP recommend for Argon2id?"
    options:
      fr:
        - "1 Mio de mémoire, 1 itération, parallélisme 8"
        - "19 Mio de mémoire, 2 itérations, parallélisme 1"
        - "600 000 itérations, sans paramètre de mémoire"
        - "Coût 12 et une entrée limitée à 72 octets"
      en:
        - "1 MiB of memory, 1 iteration, parallelism 8"
        - "19 MiB of memory, 2 iterations, parallelism 1"
        - "600,000 iterations, with no memory parameter"
        - "Cost 12 and an input limited to 72 bytes"
    answer: 1
    why:
      fr: "`m=19456` (19 Mio), `t=2`, `p=1` est le plancher OWASP pour Argon2id. Les 600 000 itérations concernent PBKDF2, et le coût avec la limite de 72 octets décrit bcrypt."
      en: "`m=19456` (19 MiB), `t=2`, `p=1` is the OWASP floor for Argon2id. The 600,000 iterations apply to PBKDF2, and the cost with the 72-byte limit describes bcrypt."
  - q:
      fr: "Où doit être stocké le poivre ?"
      en: "Where must the pepper be stored?"
    options:
      fr:
        - "Dans la même colonne que l'empreinte"
        - "Dans le dépôt Git, à côté du code"
        - "Dans un cookie côté navigateur"
        - "Hors de la base, dans un coffre-fort de secrets ou un KMS"
      en:
        - "In the same column as the hash"
        - "In the Git repository, next to the code"
        - "In a browser cookie"
        - "Outside the database, in a secrets vault or a KMS"
    answer: 3
    why:
      fr: "Le poivre n'a d'intérêt que s'il ne fuit pas avec la base : un attaquant qui vole seulement la table des utilisateurs ne peut alors tester aucun candidat."
      en: "The pepper is only useful if it does not leak with the database: an attacker who steals only the users table then cannot test any candidate."
  - q:
      fr: "Pourquoi la mise à niveau d'une empreinte se fait-elle au moment de la connexion ?"
      en: "Why is a hash upgraded at login time?"
    options:
      fr:
        - "Parce que la base de données est verrouillée le reste du temps"
        - "Parce que c'est le seul moment où le serveur connaît le mot de passe en clair"
        - "Parce que l'ancienne empreinte peut être déchiffrée à ce moment-là"
        - "Parce que le sel change à chaque connexion"
      en:
        - "Because the database is locked the rest of the time"
        - "Because it is the only moment when the server knows the clear-text password"
        - "Because the old hash can be decrypted at that moment"
        - "Because the salt changes at every login"
    answer: 1
    why:
      fr: "Une empreinte ne s'inverse pas : pour en calculer une nouvelle, il faut le mot de passe, que le serveur ne voit que lors d'une connexion réussie."
      en: "A hash cannot be reversed: computing a new one requires the password, which the server only sees during a successful login."
