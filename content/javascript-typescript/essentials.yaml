description:
  fr: "L'essentiel de JavaScript et TypeScript pour la sécurité : variables, fonctions, tableaux, objets, async/await et typage, avec des exemples exécutables dans le navigateur."
  en: "JavaScript and TypeScript essentials for security: variables, functions, arrays, objects, async/await and typing, with examples you can run in the browser."
duration: 30

intro:
  fr: |
    **JavaScript** (abrégé JS) est le langage du web : il tourne dans tous les navigateurs et, grâce à
    **Node.js**, aussi côté serveur. **TypeScript** (TS) est JavaScript auquel on ajoute des **types**
    vérifiés avant l'exécution : c'est le même langage, avec un filet de sécurité. Pour un ingénieur
    DevSecOps, JS/TS est incontournable : API, outils, pipelines et une bonne partie de l'écosystème cloud
    en dépendent.

    Pensez au typage comme aux étiquettes sur les boîtes d'un entrepôt. Sans étiquette (JS pur), vous pouvez
    ranger un liquide dans une boîte « livres » : ça passe, jusqu'au jour où ça coule. Avec les étiquettes
    (TS), l'erreur est détectée au moment du rangement, avant tout dégât.

    Cette leçon pose les bases que toutes les suivantes réutiliseront. Les exemples en `javascript` et
    `typescript` s'exécutent **directement dans le navigateur** (bouton « Essayez ») : ils sont autonomes,
    affichent leur résultat avec `console.log`, et n'utilisent ni Node, ni le réseau, ni le DOM.
  en: |
    **JavaScript** (JS for short) is the language of the web: it runs in every browser and, thanks to
    **Node.js**, on the server too. **TypeScript** (TS) is JavaScript with **types** checked before
    execution: the same language, with a safety net. For a DevSecOps engineer, JS/TS is unavoidable: APIs,
    tools, pipelines and much of the cloud ecosystem depend on it.

    Think of typing like labels on the boxes in a warehouse. With no label (plain JS), you can put a liquid
    in a box marked "books": it works, until the day it leaks. With labels (TS), the mistake is caught at
    packing time, before any damage.

    This lesson lays the foundations every later lesson reuses. The `javascript` and `typescript` examples
    run **directly in the browser** ("Try it" button): they are self-contained, print their result with
    `console.log`, and use neither Node, nor the network, nor the DOM.

sections:
  - heading:
      fr: "Variables, types et égalité stricte"
      en: "Variables, types and strict equality"
    body:
      fr: |
        On déclare une variable avec **`const`** (valeur qui ne sera pas réassignée) ou **`let`** (valeur qui
        change). On évite **`var`**, aux règles de portée surprenantes. La règle : `const` par défaut, `let`
        seulement si nécessaire.

        JavaScript a quelques pièges historiques. Le plus important pour la sécurité est l'**égalité** :

        - `==` compare après *conversion de type* : `0 == "0"` est `true`, `"" == false` est `true`. Ces
          surprises créent des failles d'autorisation.
        - `===` compare *sans conversion* : `0 === "0"` est `false`. **Utilisez toujours `===`.**

        TypeScript ajoute les **annotations de type** : `const port: number = 8080`. Le compilateur refuse
        alors `port = "oops"`. Les types n'existent qu'à la compilation : ils disparaissent du JavaScript
        final, mais ils ont déjà attrapé les erreurs.
      en: |
        You declare a variable with **`const`** (a value that will not be reassigned) or **`let`** (a value
        that changes). Avoid **`var`**, whose scoping rules are surprising. The rule: `const` by default,
        `let` only when needed.

        JavaScript has a few historical traps. The most important one for security is **equality**:

        - `==` compares after *type coercion*: `0 == "0"` is `true`, `"" == false` is `true`. These surprises
          create authorization flaws.
        - `===` compares *without coercion*: `0 === "0"` is `false`. **Always use `===`.**

        TypeScript adds **type annotations**: `const port: number = 8080`. The compiler then rejects
        `port = "oops"`. Types only exist at compile time: they vanish from the final JavaScript, but they
        have already caught the mistakes.
  - heading:
      fr: "Fonctions, tableaux, objets et asynchrone"
      en: "Functions, arrays, objects and async"
    body:
      fr: |
        Les **fonctions fléchées** (`const f = (x) => x * 2`) sont la forme courte moderne. Les **tableaux**
        offrent `map` (transformer), `filter` (garder), `reduce` (agréger) et `find` (chercher), sans boucle
        explicite. Les **objets** se lisent par déstructuration : `const { name, role } = user`.

        Le code web est souvent **asynchrone** : lire une base, appeler une API. Une `Promise` représente un
        résultat qui arrivera plus tard. `async`/`await` permet de l'écrire comme du code séquentiel :

        ```javascript
        async function getUser(id) {
          const data = await fetchUser(id); // waits without blocking
          return data;
        }
        ```

        Toujours entourer un `await` risqué d'un `try`/`catch` : une erreur réseau non gérée fait planter le
        service. Ces bases suffisent pour lire et écrire la grande majorité du code de sécurité en JS/TS.
      en: |
        **Arrow functions** (`const f = (x) => x * 2`) are the modern short form. **Arrays** offer `map`
        (transform), `filter` (keep), `reduce` (aggregate) and `find` (search), without an explicit loop.
        **Objects** are read by destructuring: `const { name, role } = user`.

        Web code is often **asynchronous**: reading a database, calling an API. A `Promise` represents a
        result that will arrive later. `async`/`await` lets you write it like sequential code:

        ```javascript
        async function getUser(id) {
          const data = await fetchUser(id); // waits without blocking
          return data;
        }
        ```

        Always wrap a risky `await` in a `try`/`catch`: an unhandled network error crashes the service. These
        basics are enough to read and write the vast majority of security code in JS/TS.

examples:
  - title:
      fr: "Variables, types et le piège de l'égalité"
      en: "Variables, types and the equality trap"
    file: basics.js
    lang: javascript
    kind: neutral
    code: |
      // const = not reassigned, let = reassigned, never var
      const name = "alice";
      let attempts = 0;
      attempts = attempts + 1;

      // typeof reveals the runtime type
      console.log(typeof name, typeof attempts, typeof true);

      // == coerces types and causes security surprises
      console.log("loose 0 == '0':", 0 == "0");
      console.log("loose '' == false:", "" == false);

      // === never coerces: always use it
      console.log("strict 0 === '0':", 0 === "0");
      console.log("strict 1 === 1:", 1 === 1);
    output: |
      string number boolean
      loose 0 == '0': true
      loose '' == false: true
      strict 0 === '0': false
      strict 1 === 1: true
    note:
      fr: "`==` convertit les types : `0 == \"0\"` est `true`, ce qui peut contourner une vérification. `===` ne convertit jamais et donne le résultat attendu. Prenez l'habitude d'utiliser `===` partout."
      en: "`==` coerces types: `0 == \"0\"` is `true`, which can bypass a check. `===` never coerces and gives the expected result. Make a habit of using `===` everywhere."

  - title:
      fr: "Tableaux et objets : map, filter, déstructuration"
      en: "Arrays and objects: map, filter, destructuring"
    file: collections.js
    lang: javascript
    kind: neutral
    code: |
      const users = [
        { name: "alice", role: "admin", active: true },
        { name: "bob", role: "user", active: false },
        { name: "carol", role: "user", active: true },
      ];

      // filter keeps matching items, map transforms them
      const activeNames = users
        .filter((u) => u.active)
        .map((u) => u.name);
      console.log("active:", activeNames);

      // find returns the first match or undefined
      const admin = users.find((u) => u.role === "admin");
      // destructuring reads fields by name
      const { name, role } = admin;
      console.log("admin:", name, role);

      // reduce aggregates to a single value
      const activeCount = users.reduce((n, u) => n + (u.active ? 1 : 0), 0);
      console.log("active count:", activeCount);
    output: |
      active: [ 'alice', 'carol' ]
      admin: alice admin
      active count: 2
    note:
      fr: "`filter`, `map`, `find` et `reduce` remplacent les boucles manuelles et rendent le code plus lisible. La déstructuration `{ name, role }` extrait proprement les champs d'un objet."
      en: "`filter`, `map`, `find` and `reduce` replace manual loops and make code clearer. The destructuring `{ name, role }` cleanly extracts an object's fields."

  - title:
      fr: "Asynchrone : async/await avec gestion d'erreur"
      en: "Async: async/await with error handling"
    file: async.js
    lang: javascript
    kind: neutral
    code: |
      // A Promise that resolves or rejects after a short delay
      function lookup(id) {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            if (id > 0) resolve({ id, name: "user-" + id });
            else reject(new Error("invalid id"));
          }, 10);
        });
      }

      async function main() {
        // await reads the resolved value as if it were synchronous
        const ok = await lookup(1);
        console.log("found:", ok.name);

        // Always guard a risky await: a rejection must not crash the service
        try {
          await lookup(-1);
        } catch (err) {
          console.log("handled:", err.message);
        }
      }

      main();
    output: |
      found: user-1
      handled: invalid id
    note:
      fr: "`await` attend la résolution d'une `Promise` sans bloquer le reste du programme. Le `try`/`catch` autour de l'appel qui échoue évite que l'erreur ne remonte et ne fasse planter le processus."
      en: "`await` waits for a `Promise` to resolve without blocking the rest of the program. The `try`/`catch` around the failing call stops the error from propagating and crashing the process."

  - title:
      fr: "TypeScript : les types attrapent l'erreur avant l'exécution"
      en: "TypeScript: types catch the mistake before execution"
    file: types.ts
    lang: typescript
    kind: neutral
    code: |
      // A type describes the exact shape an object must have
      type User = {
        name: string;
        role: "admin" | "user"; // only these two values are allowed
      };

      // The parameter is typed: TypeScript rejects any other shape at compile time
      function canDelete(user: User): boolean {
        return user.role === "admin";
      }

      const alice: User = { name: "alice", role: "admin" };
      const bob: User = { name: "bob", role: "user" };

      console.log("alice can delete:", canDelete(alice));
      console.log("bob can delete:", canDelete(bob));
      // A line like `canDelete({ name: "x", role: "root" })` would NOT compile:
      // "root" is not an allowed role, so the bug never reaches runtime.
    output: |
      alice can delete: true
      bob can delete: false
    note:
      fr: "Le type `role: \"admin\" | \"user\"` n'accepte que deux valeurs. Une faute comme `role: \"root\"` est refusée **à la compilation**, donc le bug n'atteint jamais la production. Les annotations disparaissent du JS final."
      en: "The `role: \"admin\" | \"user\"` type allows only two values. A typo like `role: \"root\"` is rejected **at compile time**, so the bug never reaches production. The annotations disappear from the final JS."

mistake:
  fr: |
    **Utiliser `==` au lieu de `===` dans une vérification de sécurité.**

    ```javascript
    if (user.role == 0) { /* treat as guest */ }  // "0", "", [] all coerce oddly
    ```

    L'égalité faible `==` convertit les types avant de comparer, ce qui produit des résultats contre-intuitifs
    (`0 == ""` est `true`, `0 == "0"` est `true`, `[] == false` est `true`). Dans un contrôle d'accès ou de
    validation, ces conversions ouvrent des contournements. Utilisez **toujours** `===` (et `!==`), qui
    comparent la valeur **et** le type sans aucune conversion. C'est une règle que des linters comme ESLint
    peuvent imposer automatiquement.
  en: |
    **Using `==` instead of `===` in a security check.**

    ```javascript
    if (user.role == 0) { /* treat as guest */ }  // "0", "", [] all coerce oddly
    ```

    Loose equality `==` coerces types before comparing, which yields counter-intuitive results (`0 == ""` is
    `true`, `0 == "0"` is `true`, `[] == false` is `true`). In an access-control or validation check, these
    coercions open bypasses. **Always** use `===` (and `!==`), which compare value **and** type with no
    coercion. This is a rule that linters like ESLint can enforce automatically.

bestPractice:
  fr: |
    - **`const` par défaut**, `let` si la valeur change, jamais `var`.
    - **`===` et `!==` partout** : l'égalité stricte évite les conversions de type dangereuses.
    - **Préférez `map`/`filter`/`reduce`** aux boucles manuelles : code plus clair et moins de bugs d'index.
    - **Entourez chaque `await` risqué d'un `try`/`catch`** pour ne jamais laisser une erreur faire planter le service.
    - **Adoptez TypeScript** dès que le projet grandit : les types attrapent les erreurs avant l'exécution.
    - **Restreignez les valeurs avec des types littéraux** (`"admin" | "user"`) plutôt qu'un `string` ouvert.
  en: |
    - **`const` by default**, `let` if the value changes, never `var`.
    - **`===` and `!==` everywhere**: strict equality avoids dangerous type coercions.
    - **Prefer `map`/`filter`/`reduce`** over manual loops: clearer code and fewer index bugs.
    - **Wrap every risky `await` in a `try`/`catch`** so an error never crashes the service.
    - **Adopt TypeScript** as the project grows: types catch mistakes before execution.
    - **Restrict values with literal types** (`"admin" | "user"`) rather than an open `string`.

exercise:
  statement:
    fr: |
      Écrivez un programme JavaScript **exécutable dans le navigateur** qui :

      1. Définit un tableau d'objets `transactions`, chacun avec `{ id, amount, status }` (`status` vaut
         `"ok"` ou `"failed"`).
      2. Calcule, avec `filter` et `reduce`, la **somme des montants** des transactions dont le statut est
         `"ok"` (utilisez `===`).
      3. Affiche le résultat avec `console.log`.

      Donnez au moins 3 transactions, dont une `"failed"`.
    en: |
      Write a JavaScript program that **runs in the browser** and:

      1. Defines an array of `transactions` objects, each with `{ id, amount, status }` (`status` is `"ok"`
         or `"failed"`).
      2. Computes, with `filter` and `reduce`, the **sum of the amounts** of the transactions whose status is
         `"ok"` (use `===`).
      3. Prints the result with `console.log`.

      Provide at least 3 transactions, including one `"failed"`.
  solution:
    file: solution.js
    lang: javascript
    code: |
      const transactions = [
        { id: 1, amount: 50, status: "ok" },
        { id: 2, amount: 20, status: "failed" },
        { id: 3, amount: 30, status: "ok" },
      ];

      // Strict equality (===) avoids type-coercion surprises on status
      const total = transactions
        .filter((t) => t.status === "ok")
        .reduce((sum, t) => sum + t.amount, 0);

      console.log("total of ok transactions:", total);
    note:
      fr: "`filter` ne garde que les transactions `\"ok\"`, puis `reduce` additionne leurs montants à partir de `0`. L'égalité stricte `===` garantit qu'une valeur comme `0` ou `\"ok \"` ne passe pas par erreur."
      en: "`filter` keeps only the `\"ok\"` transactions, then `reduce` sums their amounts starting from `0`. Strict equality `===` ensures a value like `0` or `\"ok \"` does not slip through by mistake."

quiz:
  - q:
      fr: "Quel opérateur faut-il utiliser pour comparer deux valeurs sans conversion de type ?"
      en: "Which operator should you use to compare two values without type coercion?"
    options:
      fr:
        - "`===`"
        - "`==`"
        - "`=`"
        - "`!`"
      en:
        - "`===`"
        - "`==`"
        - "`=`"
        - "`!`"
    answer: 0
    why:
      fr: "`===` compare la valeur et le type sans conversion ; `==` convertit les types et provoque des surprises comme `0 == \"0\"`."
      en: "`===` compares value and type with no coercion; `==` coerces types and causes surprises like `0 == \"0\"`."
  - q:
      fr: "Quelle déclaration de variable faut-il éviter dans le code moderne ?"
      en: "Which variable declaration should be avoided in modern code?"
    options:
      fr:
        - "`const`"
        - "`let`"
        - "`var`"
        - "`function`"
      en:
        - "`const`"
        - "`let`"
        - "`var`"
        - "`function`"
    answer: 2
    why:
      fr: "`var` a des règles de portée surprenantes (hoisting, portée de fonction) ; on préfère `const` et `let`, à portée de bloc."
      en: "`var` has surprising scoping rules (hoisting, function scope); prefer `const` and `let`, which are block-scoped."
  - q:
      fr: "À quoi sert `async`/`await` ?"
      en: "What is `async`/`await` for?"
    options:
      fr:
        - "À chiffrer les données"
        - "À écrire du code asynchrone de façon lisible, comme du séquentiel"
        - "À déclarer des types"
        - "À remplacer `filter` et `map`"
      en:
        - "To encrypt data"
        - "To write asynchronous code readably, like sequential code"
        - "To declare types"
        - "To replace `filter` and `map`"
    answer: 1
    why:
      fr: "`await` attend la résolution d'une `Promise` sans bloquer, ce qui rend le code asynchrone aussi lisible qu'une suite d'instructions."
      en: "`await` waits for a `Promise` to resolve without blocking, making asynchronous code as readable as a sequence of statements."
  - q:
      fr: "Quel avantage principal TypeScript apporte-t-il à JavaScript ?"
      en: "What is TypeScript's main advantage over JavaScript?"
    options:
      fr:
        - "Il rend le code plus rapide à l'exécution"
        - "Il supprime le besoin de tests"
        - "Il chiffre automatiquement les secrets"
        - "Il vérifie les types avant l'exécution et attrape des erreurs tôt"
      en:
        - "It makes code run faster"
        - "It removes the need for tests"
        - "It automatically encrypts secrets"
        - "It checks types before execution and catches errors early"
    answer: 3
    why:
      fr: "TypeScript vérifie les types à la compilation ; les erreurs de type sont détectées avant que le code n'atteigne la production."
      en: "TypeScript checks types at compile time; type errors are caught before the code reaches production."
  - q:
      fr: "Pourquoi entourer un `await` risqué d'un `try`/`catch` ?"
      en: "Why wrap a risky `await` in a `try`/`catch`?"
    options:
      fr:
        - "Pour qu'une erreur (réseau, rejet) ne fasse pas planter le service"
        - "Pour accélérer la Promise"
        - "Pour convertir le résultat en nombre"
        - "Pour éviter d'utiliser `const`"
      en:
        - "So an error (network, rejection) does not crash the service"
        - "To speed up the Promise"
        - "To convert the result to a number"
        - "To avoid using `const`"
    answer: 0
    why:
      fr: "Un rejet de Promise non géré se propage et peut arrêter le processus ; le `try`/`catch` capture l'erreur et permet d'y répondre proprement."
      en: "An unhandled Promise rejection propagates and can stop the process; the `try`/`catch` captures the error and lets you handle it cleanly."
